# クロール対象サイトのレジストリ (旧 科研STOER oer_site_list.xlsx の後継)。
# license_status: cc (CCライセンス) | custom_reuse (独自だが再利用条件明示) |
#                 no_reuse (視聴のみ・再利用不可) | unknown
# rendering: static (requests可) | playwright (JSレンダリング必須)

sites:
  - code: ocw_nagoya_u
    name: 名大の授業 (NU OCW)
    organization: 名古屋大学
    url: https://ocw.nagoya-u.jp/
    sitemap: https://ocw.nagoya-u.jp/sitemap-index.xml
    course_url_pattern: "https://ocw.nagoya-u.jp/courses/<id>-<題名>-<年度>/ (英語版は /en/courses/)"
    rendering: playwright
    parser: nagoya_u
    usage_summary: 非営利の教育目的に限り、コピー・配布・翻訳・編集を含め利用可。クレジット「© 講義の年 教員の氏名（名大の授業）」の明記が条件。
    license_status: custom_reuse
    license_url: https://ocw.nagoya-u.jp/about/
    license_note: >-
      非営利の教育目的に限りコピー・配布・翻訳・編集可。クレジット
      「© 講義の年 教員の氏名（名大の授業）」の明記が条件。CC ではない独自ライセンス
      (実質 CC BY-NC 相当)。確認日 2026-07-21
    status: active
    date_checked: "2026-07-21"
    notes: robots.txt は /admin/ のみ禁止。コース本文 (講師・開講部局・年度・対象者) は
      レンダリング後に取得可能。旧パーサ parsers/ocw_nagoya_u.py・旧収集 ocw_nagoya_u.xlsx あり。
      方針決定 (2026-07-21) — usageTerms (allowed_with_conditions) 付きで目録化対象

  - code: ocw_kyoto_u
    name: 京都大学OCW
    organization: 京都大学
    url: https://ocw.kyoto-u.ac.jp/
    sitemap: https://ocw.kyoto-u.ac.jp/sitemap.xml
    course_url_pattern: "https://ocw.kyoto-u.ac.jp/course/<id>/"
    rendering: static
    parser: kyoto_u
    usage_summary: 非営利かつ教育的な目的に限り、適切なクレジット表記をおこなうことで共有・転載・改変などの二次利用可 (公開講座等の一部コンテンツは個別の CC ライセンス表記が優先)。
    license_status: custom_reuse
    license_url: https://ocw.kyoto-u.ac.jp/guideline/
    license_note: >-
      利用規約 (guideline) が「非営利かつ教育的な目的において、適切なクレジット表記を
      おこなうことで、共有、転載、改変などの二次利用がおこなえます」と明示 (実質 CC BY-NC 相当)。
      コンテンツごとに CC BY-NC-SA 4.0 / BY-NC-ND 4.0 バッジがあるページはそれが優先。
      確認日 2026-07-27
    status: active
    date_checked: "2026-07-27"
    notes: 2021年リニューアル後の WordPress 静的サイト (旧 Plone から移行)。sitemap に
      course 1,209件。カテゴリ (通常/公開/最終講義・国際会議・その他) と分野タグはページに
      現れず、検索一覧の走査 (.cache/kyoto_taxonomy.json) から逆引きする。
      REST API は無効。動画は YouTube 埋め込み、講義資料 PDF は rel="archives" リンク。

  - code: ocw_hokudai
    name: 北海道大学OCW
    organization: 北海道大学
    url: https://ocw.hokudai.ac.jp/
    sitemap: https://ocw.hokudai.ac.jp/sitemap.xml (講義は含まれない。/lecture/page/N の一覧走査で発見)
    course_url_pattern: "https://ocw.hokudai.ac.jp/lecture/<slug>"
    rendering: static
    parser: hokudai
    usage_summary: 教材ごとにライセンスマークが指定される（制限資料=閲覧のみ / CC BY-NC / CC BY）。マークの無い教材は映像内クレジット等での個別確認が必要。
    license_status: custom_reuse
    quote_basis: quotation   # /licence は教材のマークを定めるもので、ページ本文の転載許諾ではない
    license_url: https://ocw.hokudai.ac.jp/licence
    license_note: >-
      /licence がマーク方式を定義: 制限資料 (閲覧のみ・二次利用不可) / CC BY-NC / CC BY。
      実測 (2026-07-27・584講義): 制限資料 444・CC BY-NC 2・無表記 138。無表記は
      reuse: unspecified として扱う。確認日 2026-07-27
    status: active
    date_checked: "2026-07-27"
    notes: WordPress。講義はカスタム投稿型で REST・sitemap に出ないため /lecture/page/N
      (24頁) を走査して発見。トップページのみ locale クッキー要 (講義ページは不要)。
      講義情報は cnt_left/cnt_right のラベル・値ペア。タグに種別 (公開講座/学部/大学院)・
      ジャンル・部局・言語 (japanese/english)。動画は旧 iTunesU リンク中心 (129件)。

  - code: ocw_tsukuba
    name: TSUKUBA OCW
    organization: 筑波大学
    url: https://ocw.tsukuba.ac.jp/
    sitemap: https://ocw.tsukuba.ac.jp/sitemap.xml (AIOSEO。コースは page-sitemap.xml 内)
    course_url_pattern: "https://ocw.tsukuba.ac.jp/course/<分野>/<slug>/ ほか /data-science/<slug>/・/discovery/<slug>/"
    rendering: static
    parser: tsukuba
    usage_summary: サイト全体が CC BY-NC-SA 2.1 日本 (表示-非営利-継承)。クレジット表示・非営利・同一条件での頒布を条件に複製・頒布・展示・実演・二次的著作物の作成が可能。
    license_status: cc
    license_url: https://ocw.tsukuba.ac.jp/guide/
    license_note: >-
      /guide/ が「TSUKUBA OCWで公開されるすべてのコンテンツの利用許諾条件は、
      クリエイティブ・コモンズ・ライセンス『表示-非営利-継承 2.1 日本』に従います」と明記。
      全エントリに license: CC URL (by-nc-sa/2.1/jp) を付与。確認日 2026-07-27
    status: active
    date_checked: "2026-07-27"
    notes: WordPress 固定ページ階層。目録単位は3系統 = 講義動画 /course/分野/slug (50)・
      データサイエンス講義 /data-science/slug (26)・筑波大の人々 /discovery/slug (16)。
      コース下位の /p-N/ (239頁) は各回ページで目録単位にしない。レイアウトは
      page_ttl 型と movie 型の2系統が URL 系統と独立に混在。講師は c_lect リンク。
      年度表示はデータサイエンス講義のみ (公開日)。

  - code: utokyo_channel
    name: UTokyo Channel (旧 UTokyo OCW)
    organization: 東京大学
    url: https://ch.u-tokyo.ac.jp/
    sitemap: https://ch.u-tokyo.ac.jp/wp-sitemap.xml
    course_url_pattern: "https://ch.u-tokyo.ac.jp/series/?id=<ChXXX> (旧 ocw.u-tokyo.ac.jp/course_NNNNN/ は series へ 301)"
    rendering: static
    parser: utokyo_channel
    usage_summary: UTokyo Channel の利用規約により、複製（ダウンロードを含む）・頒布・配布・改変等は不可。オンラインでの視聴のみ可能。
    license_status: no_reuse
    license_url: https://ch.u-tokyo.ac.jp/privacy-policy/
    license_note: >-
      利用規約が複製 (ダウンロード含む)・頒布・配布・改変等を明示的に禁止 (視聴のみ可)。
      旧 UTokyo OCW の CC BY-NC-ND 表記はサイト上で確認できず。確認日 2026-07-21
    status: active
    date_checked: "2026-07-21"
    notes: WordPress 静的。sitemap に series 580件 (東大TV 403 / 旧OCW 177。2026-07-27 取得)。
      各 series ページに講義一覧 (「資料あり」マーカー)・タグ (ジャンル/中高生向け/英語話者向け/
      学内限定など)。旧OCWコースURLが series へリダイレクトするため旧収集データのURLは解決可能。
      方針決定 (2026-07-21) — usageTerms (not_allowed) と「再利用不可」ラベル付きで目録化対象。
      視聴のみ規約のため materials (ファイルURL) は載せない
