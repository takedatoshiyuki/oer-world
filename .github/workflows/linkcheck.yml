# oer-kit が private の間は自動実行しない (pip install が失敗する)。
# 検証・配信はローカルの make validate / make deploy で行い、oer-kit 公開後にトリガを復元する。
name: linkcheck

# referenced エントリの外部リンクは切れる。週1回まとめて確認する
# （PR ごとに外部サイトを叩かないよう validate とは分けている）。
on:
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "oer-kit[legacy] @ git+https://github.com/takedatoshiyuki/oer-kit"
      - name: リンク生存・Wayback スナップショット確認
        run: python3 -m oer_kit.wayback --check
