# oer-kit 公開 (2026-07-30) に伴い push/PR トリガを復元。
name: validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths: ["resources/**", "vocabularies/**", "sites.yaml", "config.yaml"]

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "oer-kit @ git+https://github.com/takedatoshiyuki/oer-kit"
      - name: メタデータ検証（スキーマ・語彙・運用ポリシー）
        run: python -m oer_kit.validate
      - name: JSON-LD / catalog.json の生成確認
        run: python -m oer_kit.build_catalog

# 外部リンクの生存確認は外部サイトへアクセスするため、PR ごとには走らせない
# （週1回の linkcheck.yml で実施）。
