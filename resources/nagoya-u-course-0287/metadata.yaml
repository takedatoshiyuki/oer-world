name:
  ja: 核医学診断技術学-I
description:
  ja: 核医学の基礎を扱い、放射性同位元素を用いた診断・治療や、臓器の機能・代謝を知るための方法を学ぶ内容である。SPECTやPET、核医学治療などの近年の動向にも触れ、臨床診断に役立つデータ収集の知識を身につける。実際の症例を通して、国家試験に対応する知識の習得もめざす。
quotedDescription:
  text:
    ja: '核医学（nuclear medicine）とは、放射性同位元素（radioisotope: RI）を利用して診断や治療を行う医学です。 放射線医学を構成する主要な分野であり，臓器の機能・代謝を知る方法として重要です。
      とりわけ単一光子横断断層像（single photon emission computed tomography、SPECT）、ポジトロン横断断層像（positron emission tomography、PET）を用いる施設も増加し，この分野における進歩はめざましいものがあります。
      また、核医学治療（内用療法）は 50 年以上歴史があるバセドウ病や甲状腺癌に対する I-131 治療のみならず、近年、骨転移疼痛緩和治療（メタストロン、Sr-89）や悪性リンパ腫に対するモノクローナル抗体による治療（ゼヴァリン、Y-90）が盛んに行われるようになりました。

      核医学の基礎を学ぶとともに，臨床診断に役立つデータを収集するための知識を得るのみでなく，最近の動向をふまえ， 将来新しい核医学の分野における技術の進歩に対応できる基礎知識を習得できるようにします。また、実際の症例を勉強しながら、国家試験に対応する知識の習得もできるようにします。'
