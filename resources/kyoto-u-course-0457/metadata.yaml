name:
  ja: 公開シンポジウム「ひろげよう、フィールドの世界」
description:
  ja: 自然に入って自然を知ることを起点に、自然研究を理系だけの領域に限らず、芸術・社会・文化との関わりも含めて考える公開シンポジウムである。京都大学が受け継いできたフィールドの知を現代にどうつなぐかという観点から、自然から学び、その内容を発信することを扱う。
quotedDescription:
  text:
    ja: '趣旨

      自然に入り、自然を知る。

      京都大学伝統の「フィールドの知」を現代に継承するためのシンポジウムです。

      自然の研究を「理系」に任せっきりにするのはもったいない。芸術・社会・文化・・・。現代の私たちの暮らしにも、自然は深くかかわっています。さまざまな側面から自然を知ること。自然から学び、みんなにメッセージを伝えるということ。私たちからの提案を紹介します。'
