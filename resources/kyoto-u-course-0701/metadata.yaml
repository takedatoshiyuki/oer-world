  ja: この講義は、機械学習の基礎を扱い、前半で離散データからの学習に関する理論を、後半で数値データや連続データからの学習に関する理論を扱う。形式言語や一階論理の式を例に、基本理論とその応用方法を学ぶ構成になっている。
quotedDescription:
  text:
    ja: '授業の概要·目的

      このコースでは、機械学習の基礎を調べます。最初の部分は、計算の学習などの正式な言語などの離散データから学習するためである理論と、一階論理の式を説明しています。第二部は、数値と連続データからの学習のためである統計的学習理論を説明しています。両方の部分は、基本的な理論とその応用の方法で構成されています。

       

      Course Description

      This course examines the foundations of Machine Learning. The first part explains Computational
      Learning Theory, which is for learning from discrete data, such as formal languages, and formulae
      of first-order logic.

      The second part explains Statistical Learning Theory, which is for learning from numerical and continuous
      data. Both parts consist of fundamental theories and methods of their applications.'
