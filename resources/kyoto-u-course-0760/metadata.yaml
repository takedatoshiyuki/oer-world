name:
  ja: 資源生物科学概論Ⅱ
description:
  ja: 動物生産科学を構成する複数の分野を取り上げ、その体系と戦略、社会的・経済的意義を扱う講義である。あわせて、基礎科学の成果を動物生産にどう応用するかを、自然環境や資源循環、情報システムの観点から概説する。公開教材では、繁殖、栄養、生体機能、情報処理、日本と世界の畜産に関する回の資料を確認できる。
quotedDescription:
  text:
    ja: 動物遺伝学、増殖学、飼養学、生理機能学、資源利用学、畜産情報システム学など、動物生産科学の学問体系と戦略を理解するとともに、その社会的・経済的意義について講述する。特に、基礎科学の成果の動物生産への応用、自然環境、資源循環や情報システムなどの幅広い視点から、現在および近未来の動物生産について概説する。
  source: https://ocw.kyoto-u.ac.jp/course/760/
