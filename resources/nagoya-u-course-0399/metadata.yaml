name:
  ja: 構造解析学
description:
  ja: 構造物の力学的挙動を理論的に予測する構造解析を扱い、その基礎理論と計算機を用いた計算手法を学ぶ講義である。講義に加えて演習を行い、構造解析の方法を身につけることを目指す。公開教材として、講義ノートが2件ある。
quotedDescription:
  text:
    ja: '構造解析は構造物の力学的挙動を理論的に予測する手段であり、構造解析学はその基礎を構成する理学と応用力学から成る学問体系である。この講義ではその基礎理論と計算機利用による計算手法について、講義を通して学習し，適宜の演習を通して構造解析の方法を体得することを目的とする。

      加えて、担当教員の実務経歴と研究活動に裏付けられた高度な専門知識や最先端の理論に触れることにより、建築構造設計を理論的側面から深く分析し、具体的、総合的に設計する力を養う事を目指す。インターンシップを行う上で、建築構造設計に不可欠な構造デザイン・構造設計実践のための知識・能力を習得する科目である。'
