name:
  ja: Blow-up, compactness and (partial) regularity in Partial Differential Equations
description:
  ja: 偏微分方程式の正則性を、blow-up と compactness に基づく手法から扱う講義である。線形楕円型発散形方程式の均質化における一様Lipschitz評価と、Navier-Stokes方程式のepsilon-regularityを中心に、周期係数の方程式に対するLiouville型定理にも触れる。
quotedDescription:
  text:
    ja: 'Course Description

      The question of whether solutions of Partial Differential Equations (PDEs) are regular or not is
      central in the field. One of the most famous problems is the existence of smooth solutions to the
      Navier-Stokes equations in fluid mechanics, or the finite time break down of regularity (millennium
      problem of the Clay Institute).

      The scope of this lecture series is much more modest. Methods based on blow-up and compactness are
      powerful tools to establish regularity for linear PDEs or partial regularity for nonlinear PDEs.
      These methods, which originated in the study of the regularity of minimal surfaces in the 60‘s,
      have been successfully applied to other subjects: regularity in homogenization, in the calculus
      of variations or in fluid mechanics. More specifically, the lectures will focus on two topics: (i)
      uniform estimates in the homogenization of linear elliptic divergence form equations, (ii) epsilon-regularity
      results for the Navier-Stokes equations. The material presented in the course is well-known to the
      PDE community since the late 90’s. However, the results have been celebrated as breakthroughs and
      are still inspiring new mathematical developments today, some of which will be outlined.

      Summary of the content:

      1. Improved regularity in homogenization: compactness methods for uniform Lipschitz regularity,
      Liouville type theorems for equations with periodic coefficients

      2. Epsilon-regularity for Navier-Stokes equations'
