name:
  ja: 土曜市民セミナー サステナブルな企業報告を考える（2013）
description:
  ja: 企業が社会に対して行う報告のあり方を、財務報告から環境報告、CSR報告、統合報告へと移る流れの中で扱う。あわせて、企業が何を報告すべきか、企業の社会貢献をどう捉えるかを考える。
quotedDescription:
  text:
    ja: 企業がその活動を社会に対して報告する方法にはいくつかあります。代表的なものは財務報告（会計報告）ですが、１９８０年代以降、環境に関する報告が注目されてきました。それはＣＳＲ（企業の社会的責任）報告となり、そしていま、それらを統合した「統合報告」が提案されています。企業が社会に何を報告すべきなのか、企業の社会貢献とは何か、今までの流れを追いながら、今後の企業のあり方を探ります。
