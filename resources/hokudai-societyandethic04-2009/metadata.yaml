name:
  ja: 北海道大学公開講座 現代社会と倫理 「企業不正と倫理」（2009）
description:
  ja: 企業不正や不祥事の事例を取り上げ、その倫理的側面を会計・監査の観点から扱う講義である。企業や経営者に求められる倫理観だけでなく、企業を監査する会計専門職の倫理観にも触れる。
quotedDescription:
  text:
    ja: 景気が悪くなると、好景気の時には見えなかった経済のひずみが現れる。企業不正、不祥事はその典型である。その多くは、企業やその経営者の倫理観が保持されていれば防げたはずのことであった。一方で、企業を監査する会計専門職にも、高い倫理観が求められている。ここでは、いくつかの企業不正の例を取り上げながらその倫理的側面について、会計・監査の立場から検討していく。
