name:
  ja: 教育学研究科 2020レクチャーシリーズ第6回 「『日本型』問題解決と授業研究を用いたアメリカ都市部の学校における算数の学習支援：越境する学びの力」
description:
  ja: 本講演は、アメリカ都市部の学校での算数の学習支援を題材に、「日本型」問題解決と授業研究の活用を扱う。日本の教育実践が別の教育環境でどのように用いられるかを、講演と質疑応答を通して考える内容である。
quotedDescription:
  text:
    ja: '概要

      グローバル教育展開オフィス主催2020年度レクチャーシリーズ『越境する「日本型教育」の歴史的・多目的理解に向けて』の第6回講演会を、12月11日（金）にZoom開催しました。今回は、Mills
      College　Catherine C. Lewis氏が「『日本型』問題解決と授業研究を用いたアメリカ都市部の学校における算数の学習支援：越境する学びの力」と題した講演を行い、司会進行は高山敬太教授が務めました。英語同時通訳を導入し、学内外および国内外からも多くの参加がありました。講演会では活発な質疑応答も行われ、盛況のうち閉会しました。'
