name:
  ja: 教養教育高度化機構シンポジウム2025
description:
  ja: D&Iの推進をめぐって、多様性と安全が緊張関係に置かれる状況を扱う。教養教育高度化機構のD&I部門の活動を背景に、教養教育の場でこの関係をどう捉え直すかを考える。
quotedDescription:
  text:
    ja: D&Iの推進がひとつの大きな課題になっている現在は、「多様性」と「安全」がある種の緊張を孕んで対置され、フレームアップされることも多くなってきた。日本の大学でそれまで前例のなかったSafer
      Spaceの活動をひとつの前身とする教養教育高度化機構のD&I部門も、教育・研究活動の中でこの緊張にさまざまなかたちで直面してきた。教養教育の場に根差しつつ、この緊張関係を正面から見据え、多様性と安全との共存可能性をあらためて問い直す。
