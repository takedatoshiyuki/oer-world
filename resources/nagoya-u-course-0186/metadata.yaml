name:
  ja: 基礎セミナーオペラの魔力とはなにか
description:
  ja: オペラを題材に、代表的な作品を取り上げながらグループで調査・討論し、発表とレポートにまとめる基礎セミナーである。作品に描かれる人間関係や感情を手がかりに、オペラの内容と登場人物の行動について考える。
quotedDescription:
  text:
    ja: '基礎セミナー A(前期開講)と基礎セミナー B(後期開講)は関連するテーマを扱います。

      基礎セミナーでは「大学生として自立した学習を行うために必要な、『読む』『書く』『話す』という能力を身につける」ことを目標にしている。この授業では、『オペラの魔力とは何か』をテーマに、文系の学生たちと理系の学生たちが討論や共同での調査をとおして、「人とは異なる視点を持つ」、「調べる」、「書く」、「討論する」、「発表する」能力を身につけ、自立的な学習能力をつける事を目指しています。
      特に、「人は自分とは異なる意見を持ち、その意見を十分尊重した上で、自分の意見を述べることによって、そこから新しい世界が開ける」ことを実感して欲しいと思っています。また共同で調査し、討論することでチームワークの重要性を学ばせたいと思っています。

      オペラは音楽、演劇、舞台芸術などが一体となった総合芸術であり、その内容は歴史や神話をはじめとして、多くの文学作品によるものが多く、人生で遭遇するあらゆることが作品に凝縮されています。この授業では、いくつかの代表的なオペラを取り上げ、その中で展開される人間模様、すなわち「恋」「愛」「喜び」「苦悩」「憎しみ」「嫉妬」「裏切り」「哀しみ」「背徳」など、人間の持つあらゆる感情に基づく行動について考えるとともに、音楽と結びつくことによって、それらの感情を強く訴えかけることが出来るのだということを体験して欲しいと思っています。さらに、その体験を通して、オペラとは何なのか考え、またオペラの登場人物の行動から、人間としてのあり方についても考えさせたいと思っています。

      オペラとしては、これまで、ヴェルディ作曲「椿姫」「マクベス」、モーツアルト作曲「フィガロの結婚」「ドン・ジョバンニ」、プッチーニ作曲「ラ・ボエーム」「トスカ」、チャイコフスキー作曲「エフゲニー・オネーギン」、ビゼー作曲「カルメン」、ヨハン・シュトラウス作曲「こうもり」、オッフェンバック作曲「美しきエレーヌ」などを取り上げてきました。これらのオペラについて、4
      人一組のグループで、調査・討論し、その結果をまとめさせて、パワーポイントにより発表させるとともに、その内容をレポートにまとめさせます。また、その結果に基づいて、全体での討論を行っています。'
