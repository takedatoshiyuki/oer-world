description:
  ja: 東京大学附属図書館の学生ボランティアの発案をもとに、図書館でのアクティブラーニング実践の一環として行うミニレクチャプログラムである。東京大学フューチャーファカルティプログラムでアクティブラーニングを学んだ大学院生・若手教員による講義を収録し、中高生向けに公開している。
quotedDescription:
  text:
    ja: '講師：栗田佳代子

      「東大院生・若手教員によるミニレクチャプログラム」は、附属図書館学生ボランティア Academic Commons Supporter の発案により、図書館でのアクティブラーニング実践の一環として実施しています。東京大学フューチャーファカルティプログラム（東大FFP）で「アクティブラーニング」という教育手法を学んだ大学院生・若手教員によるレクチャをお楽しみください。

      主催：東京大学大学総合教育研究センター…'
