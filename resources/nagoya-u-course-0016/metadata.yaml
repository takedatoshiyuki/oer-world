name:
  ja: 離散数学及び演習
description:
  ja: 集合・命題・関数や関係・順序、集合の計数をはじめ、約数・倍数、ユークリッドの互除法、素数、合同式、中国人の剰余定理などの初等整数論を扱う。さらに、群、環・整域・体、多項式環・ガロア体までの代数系の理論を学ぶ。演習では証明問題を書き下し、論述を行う。
quotedDescription:
  text:
    ja: 本講義では，集合・関数・関係に関する諸概念，初等整数論，代数系の理論を学びます．また，演習として大量の証明問題を書き下して貰い，論述力を習得して貰います．
