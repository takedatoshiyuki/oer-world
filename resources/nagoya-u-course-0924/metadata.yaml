quotedDescription:
  text:
    ja: '宇宙物理、天体物理は、身近な物理学を用いて、宇宙を理解しようとする学問である。本講義は、恒星や銀河、ブ ラックホールなどを題材に、その天体の性質を決定する背景の物理、さらにそれを理解する上で有用な物理法則を知り、「宇宙を物理の言葉で理解する」方法を学ぶことを目的とする。具体的には、重力で束縛されている系である恒星の熱力学的な性質や進化を学ぶとともに、その結果誕生する白色矮星、中性子星、ブラックホールといったコンパクト星につながる基礎物理を学ぶ。また現代宇宙論の基礎を導入し、インフレーション宇宙論の考え方を理解することを目的とする。

      学生が、天体の状態と進化を支配する基礎物理の方程式を把握し、これを実際の天体に近似的に当てはめて、その性質を半定量的に理解できること。具体的には、重力、力学、熱力学、輻射圧、フェルミオンの縮退圧の基本的な方程式を利用して、天体の性質を理解し、これにより宇宙の天体進化が本質的にカタストロフィックであることを理解すること。また、膨張する時空の力学の概要を理解することで、我々が宇宙のどのような時代に生きているのかを、宇宙論的視点で大まかに理解できること。'
