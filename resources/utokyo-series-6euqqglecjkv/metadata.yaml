  ja: 20世紀初頭のイタリアの詩人ダンヌンツィオを取り上げ、その人生と作品をたどる講座である。日本で彼の作品が夏目漱石や森鴎外らに読まれ、訳されたことにも触れ、飛行機草創期との関わりも扱う。
quotedDescription:
  text:
    ja: 20世紀初頭イタリアの詩人ダンヌンツィオをご存知でしょうか？国際的大流行作家だったダンヌンツィオの作品は、日本でも夏目漱石、森鴎外、生田長江、有島生馬、三島由紀夫など蒼々たる作家に読まれ、訳されました。本講座では、イタリアの飛行機草創期にも深く関わったダンヌンツィオの驚きの人生と作品を辿ります。
