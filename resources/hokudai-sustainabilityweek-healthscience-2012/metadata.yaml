name:
  ja: サステナビリティ・ウィーク ようこそ！ヘルスサイエンスの世界へ （2012）
description:
  ja: 保健科学研究院の公開講座として、ヘルスサイエンスに関わる3つの話題を順に扱う。アレルギー、看護職者の業務、高齢者の終末期医療について、それぞれの専門分野から解説する構成である。
quotedDescription:
  text:
    ja: '保健科学研究院の公開講座は「ようこそ！ ヘルスサイエンスの世界へ」というテーマのもと、３名の講師陣が専門分野の紹介をします。

      第１限目は「アレルギーの不思議」と題して、小林清一教授が国民病とも呼ばれているアレルギーについて解説します。第２限目は「あなたの健康生活を支える看護師活用術」と題して、良村貞子教授が保健医療福祉の現場で活躍している看護職者の業務の内容を紹介します。第３限目は「今こそ考えるとき、高齢者の延命治療　―我が国と諸外国の比較から―」と題して、宮本顯二教授が高齢者の終末期医療について解説します。'
  source: https://ocw.hokudai.ac.jp/lecture/sustainabilityweek-healthscience-2012
