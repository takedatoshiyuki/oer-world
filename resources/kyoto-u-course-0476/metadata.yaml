name:
  ja: E.FORUM 2017 全国スクールリーダー育成研修
description:
  ja: スクールリーダーの育成と力量向上を扱う研修で、授業づくり、カリキュラム・マネジメント、グローバル化と多文化共生などのテーマを含む。あわせて、国際交流・留学と市民育成、データから読む日本社会、E.FORUMスタンダードの再検討に向けた資料が公開されている。
quotedDescription:
  text:
    ja: '京都大学大学院教育学研究科 教育実践コラボレーション・センター主催

       

      概要

      現在の日本においては、学校や地域の教育改革を推進するスクールリーダー（教育委員会指導主事、学校管理職・研究主任、地域の教育サークルのリーダーなど）の育成・力量向上が求められています。そこで、京都大学大学院教育学研究科では2006年度に
      E.FORUM を設立し、毎年「全国スクールリーダー育成研修」を提供しています。2012年度からは、教師をめざす学生たちにも積極的な参加を呼び掛け、教師のライフコース全体を見通した力量向上のネットワークを築くことをめざしています。'
  source: https://ocw.kyoto-u.ac.jp/course/476/
  note: 京都大学OCW 「概要」より（同サイトの利用条件に基づく転載）
