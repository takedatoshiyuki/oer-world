quotedDescription:
  text:
    ja: 本講義では、民事訴訟を規律する法律である民事訴訟法の内容を、訴えの提起から判決が下されるまでの第一審手続を中心に、訴訟手続の流れにそって説明する。本講義は，民事訴訟法に関する知識を断片的に提供するのではなく，体系的に整理された基礎理論と個別の論点を、手続全体の流れとの関係で受講者全員が理解することを目的とする。
      単に現時点における実務処理や教科書の抽象的な記述を暗記するだけではなく、当事者間の衡平、裁判の適正・迅速という民事訴訟の理念を実現するために考慮されるべき要素と、それぞれのバランスをどうとるべきかについて、自分なりに利益衡量できるようになること、さらには実務における法形成ができるようになるための準備段階として、基礎理論の理解を深めることを目指す。
      なお、本講義においては、「法科大学院における共通的な到達目標」を踏まえつつ、具体的な講義内容を設定している。
