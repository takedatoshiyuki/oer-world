name:
  ja: English as an International Language 国際語としての英語
description:
  ja: 英語を社会的・世界的な視点から捉え、世界語としての地位がどのように広がってきたかを考察する教材である。あわせて、英語が普及した理由や、各地の社会で生じている英語の使用とその諸問題を扱う。
quotedDescription:
  text:
    ja: 'This course examines English and English language issues at societal and global levels. It considers
      the expanding status of English as the first world language, and points out some of the reasons
      for the spread of English, and the uses of English, and issues involving English, that are currently
      developing in and across diverse societies.

      英語とそれに関わる諸相を世界的レベルで検討する。世界語としての英語の地位の確立過程を考察し、英語普及の理由のいくつかを指摘し、英語の使用と現在さまざまな社会で普及している英語に関する諸問題を考察する。

      ※Videos are condensed version of course.

      ※この動画は授業内容をまとめたダイジェスト版を公開しています。'
