name:
  ja: 社会学ワンダーランド（学術俯瞰講義）
description:
  ja: この講義は、社会学を手がかりに、コミュニティや想像力、都市、学校、健康、アジア全体の社会変容へとつながるテーマを横断的に扱う。社会学がさまざまな分野に入り込む様子をたどりながら、学問全体の見取り図を考える構成である。
quotedDescription:
  text:
    ja: '学術俯瞰講義に今回「社会学」が登場します。社会学は不思議な学問です。社会学には固有な対象がない。社会学は人間世界の森羅万象を研究していますが、社会学が研究している分野はそれ以外の学問の人も研究しています。どこにもあり、どこにもない。

      今回の講義では、いろいろな分野に入り込んだ社会学の赤い糸をたどりながら、学問の全体像を横断的に理解してもらうことを目的とします。赤い糸は、コミュニティという日常生活、想像力という自明な力から、都市、学校、健康におよび、かつアジア全体の社会の変容という大きなテーマに広がっていきます。でも、社会学は何でも屋さんではありません。どんなテーマであれ、そこに「社会学的な対象」を発見する不思議な方法、独特な技を必ず使います。この仕掛けは本やインターネットには書いてないものなので、これこそを今回の講義で皆さんの前に示したいと思います。

      社会学というワンダーランドにようこそ。この世界には、曖昧なもの、驚きなど、人間くさいものがたくさん詰まっています。'
  source: https://ch.u-tokyo.ac.jp/series/?id=A5Zk3ax6ofMk
