name:
  ja: 土曜市民セミナー 食糧問題から見る昭和史（2012）
description:
  ja: 第二次世界大戦前後を起点に、日本の食糧が外国に依存するようになった経緯をたどりながら、昭和史の中で食糧問題を考える講義である。現代日本の食料輸入の状況にも触れつつ、その背景を歴史的に扱う。
quotedDescription:
  text:
    ja: 現代日本にくらす私たちは、食べ物をどこから獲得しているのか、を考えてみると、主食の米はともかくとして、穀物、肉類、野菜など外国からの輸入品がひじょうに多いことに気づかされます。現在、話題になっているＴＰＰへの参加如何によっては、外国からの輸入食料品がさらに増える可能性もあります。私たちはなぜ、食糧を外国に依存するようになったのでしょうか。話は第二次世界大戦前後にさかのぼります。
      昭和史という長い時代のなかで私たちの食糧の問題を考えてみようと思います。
