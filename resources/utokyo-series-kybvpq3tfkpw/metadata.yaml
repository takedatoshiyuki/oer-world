description:
  ja: 資源の制約を前提に、持続可能な循環型社会を目指すための資源処理と環境浄化を扱う講義である。資源と素材、設計と生産、廃製品の処理とリサイクル、有機系廃棄物処理など、資源の循環に関わる複数の論点を取り上げる。
