name:
  ja: 情報記号論
description:
  ja: この講義は、記号論を手がかりに、人間の意味活動や社会・文化をどのように捉えるかを扱う。あわせて、情報技術革命のなかで記号論が担う新しい役割としての「情報記号論」を考える。
quotedDescription:
  text:
    ja: '＜記号論Semiotics＞は、C.S. PeirceとF. de Saussureを祖として二十世紀を通して発達してきた人間の意味活動のインターディシプリナリーな研究領域です。記号論は、＜構造主義＞と呼ばれた二
      十世紀の社会・文化知のパラダイム変換に貢献し、またメディア文化や大衆社会現象を理解する理論的枠組みとしてメディア・スタディーズやカルチュラル・ス タディーズと呼ばれる研究動向のなかでも重要な理論的支柱となってきました。

      そして今日では、記号論には、人間の意味環境を急速に変化させつつある記号テクノロジーに媒介された社会や文化を理解するために、新しい役割を果たすことを求められています。これが、＜情報記号論＞の領域だといえるでしょう。

      この新しい学問分野は、いま情報技術革命と呼ばれているような大変化のなかで、記号論が二十世紀を通じて考えようとしてきた根本問題をとらえ返すことによって、これから創り出されるべきものという性格が強いのです。'
