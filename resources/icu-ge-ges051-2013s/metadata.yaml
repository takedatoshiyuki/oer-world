name:
  ja: 'S2: Media and Cultural Signs Ｓ２：メディアと記号'
description:
  ja: メディアを通じて意味がどのように社会的に構築されるかを扱い、記号論的分析によって日常で見過ごしやすい記号の意味を読み解く。文化記号論に基づき、多様な記号を批判的に解釈する視点を示す。授業内容をまとめたダイジェスト版として公開されている。
quotedDescription:
  text:
    ja: 'The course examines how meaning is socially constructed through media. Semiotic analysis allows
      us to reveal the meanings of various signs which we may overlook in everyday life and to open up
      the possibility of different interpretation.

      様々なメディアを通して構築される私たちの周りの世界の意味を読み解いていく。文化記号論的な考え方に基づき、日常の「当たり前」を見直すために、多様な記号のクリティカルな意味解釈を試みる。

      ※Videos are condensed version of course.

      ※この動画は授業内容をまとめたダイジェスト版を公開しています。'
