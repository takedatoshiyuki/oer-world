  ja: 地球に水が存在することを前提に、生命の成立や水循環を含む地球環境との関係を扱う講義である。あわせて、人類の活動が生み出した世界と地球環境問題との関わりにも触れる内容である。
quotedDescription:
  text:
    ja: 太陽系の第三惑星―地球―。もし、地球に水が存在しなかったら・・・。海は無く、原始生命も発生せず、水循環に代表される生命圏と地球圏との物質循環も起きなかったはずです。したがって、人類が進化することもなく、その活動の基盤となった地球環境も形成されなかったでしょう。人類は今や生命圏の枠を越えて、人工物を含む人間圏ともいうべき世界を生み出すに至りましたが、私たちが直面している地球環境問題はこの人間圏と地球…
