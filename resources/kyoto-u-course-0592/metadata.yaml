name:
  ja: 森里海連環学実習Ｃ
description:
  ja: 北海道東部の別寒辺牛川流域を舞台に、上流の森林域から中流の牧草地、下流の厚岸湾岸域までを対象として生物調査を行う。森・川・里・海の連続したつながりを、生物を通して調べながら、その関係に人間がどう関わるかを実習データに基づいて学ぶ。実習は京都大学と北海道大学の研究拠点を使って実施する。
quotedDescription:
  text:
    ja: 自然景観が気象・地象・海象・生物・人為の相互作用によって形成されていることを実体験することを目的に、北海道東部にある別寒辺牛川上流の自然度が高い森林域、牧草地として土地利用されている中流、そして下流の厚岸湾岸域の生物調査を通して、森－川ー里－海のつながりについて学習する。森と川と海が生物を通してつながっていること、さらに人間がそのつながりにどのように関わっているかを実習中に得られたデータや知見をもとに理解を深めることを目的としている。本実習は、京都大学フィールド科学教育研究センター北海道研究林標茶区、北海道大学北方生物圏フィールド科学センター厚岸臨海実験所を拠点に行う。
  source: https://ocw.kyoto-u.ac.jp/course/592/
