name:
  ja: 土曜市民セミナー 地域の課題解決と大学研究活動（2013）
description:
  ja: 大学の研究活動が、地域の課題解決や活性化にどう関わるかを扱う講義である。釧路公立大学で13年間続けた実践的な研究活動の経験を踏まえ、産業政策、環境問題、福祉政策などの地域課題を通して大学の地域社会への貢献を考える。
quotedDescription:
  text:
    ja: 大学の地域貢献が求められているが、地域のかかえる課題の解決や、活性化に向けて大学の研究活動がどのようにかかわっていくかは大変難しいテーマでです。釧路公立大学において１３年間にわたって、産業政策、環境問題、福祉政策など幅広い地域課題に向き合って実践的な研究活動を続けてきた挑戦の経験を紹介しながら、大学の地域社会への貢献について一緒に考えていきます。
