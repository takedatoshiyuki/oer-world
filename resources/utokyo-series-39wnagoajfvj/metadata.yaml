name:
  ja: 境界線をめぐる旅（朝日講座「知の冒険—もっともっと考えたい、世界は謎に満ちている」2013年度講義）
description:
  ja: この講義は、私・他者・国家・生物・地球にまたがる境界線を題材に、その線がどのように作られ、誰に向けて引かれているのかを考える。あわせて、誕生や死、脳死問題にも触れながら、人が世界のどこに位置づけられるのかを問い直す。
quotedDescription:
  text:
    ja: '目には見えない無数の境界線を張り巡らせて、人は暮らしています。その基点となるべき私でさえも、どこまでが私なのかと問いかけることが可能です。少なくとも誕生と死というふたつの境界線の間に私は存在しているはずですが、脳死問題を考えれば、死にさえも人為的な境界線が持ち込まれることを拒否できません。

      　初年度のテーマ「震災後、魂と風景の再生へ」を受けて、昨年度は「幸福」を問題にしました。それは、さまざまな幸福の輪郭線を探る試みでした。幸福と不幸とを分ける境界線は、どこよりもまず人の意識の中に引かれるはずです。今年度は少し観点を変え、私たちがつくりだす無数の境界線に目を向けます。リレー形式の講義により、私・他者・国家・生物・地球の境界線を辿りながら、それらが誰によって、誰に向けて、どのように引かれているのかを見つめ直し、私たちの現在地を、私たちがこの世界のどこに存在しているのかを探ります。'
