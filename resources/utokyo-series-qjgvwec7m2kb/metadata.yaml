name:
  ja: コミュニケーション・システム（2002年度講義）
description:
  ja: コンピュータと映像・音響技術を結び付けたメディア技術を背景に、人とコンピュータの関係の変化を扱う講義である。感性情報処理や複合現実感、空間を対象とした情報処理・アート・デザイン・インタフェースなどを取り上げ、現代技術の方向性と社会への影響を考える。あわせて、将来の人間中心のヒューマンコミュニケーションメディアへの展望を示す。
quotedDescription:
  text:
    ja: 'コンピュータと映像・音響技術を結び付けたメディア技術が広く普及し、人とコンピュータの関係は大きく変わりつつある。これに伴い、感性情報の処理、現実 世界と仮想世界の境界に挑む複合現実感技術、空間を対象とした情報処理・アート・デザイン・インタフェース、人に優しいメディア環境などの話題が注目され
      るようになってきた。

      この講義では、メディアも含めた現代技術の目指す方向、それらの２１世紀社会に与える光と影の問題を論ずるとともに、将来の人間中心の「ヒューマンコミュニケーションメディア」へ至る道を展望してみたいと考えています。'
