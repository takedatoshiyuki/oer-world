name:
  ja: Influences on Imageability
description:
  ja: 都市の景観変化や、都市化の進行の中で生じる社会的な問題を扱う内容である。あわせて、デリーの労働者居住地域での芸術実践を通じ、住民との協働や地域空間への介入によって社会的テーマを表現する試みが述べられている。
quotedDescription:
  text:
    ja: "One of the starkest visual outcomes of contemporary neo-liberal political environments and economic\
      \ policies that have catalyzed globalization on an unforeseen and unimaginable scale is the relentless\
      \ mutation of metropolitan landscapes all over the world. Urban geographies are being rapidly and\
      \ permanently transformed to accommodate the ever-expanding construction of skyscrapers, corporate\
      \ offices and shopping malls. The traditionally public, historical and ‘green’ spaces in cities\
      \ are encroached upon and appropriated, shrinking and disappearing as state property is sold developed\
      \ into commercial mega-projects for private business interests. The migrant working class is also\
      \ a subject to various powerful modes of alienation, even while the city enlarges these communities’\
      \ frames of reference, dismantles provincial and rural prejudices, offers a range of new affiliations\
      \ and professions, and new possibilities of individual freedom. And at the other end of the scale,\
      \ cities themselves bloat into unsustainable entities via the influx of millions of impoverished\
      \ rural migrants, who create their own precarious settlements, infrastructure and relational circuits\
      \ in whatever corner they can find. \n For the last five years my art practice has involved experimenting\
      \ with new genres of art across different populations in various working-class localities in Delhi.\
      \ My research focuses on the representation of social issues through works created in collaboration\
      \ with the community and through direct interaction / intervention in the physical spaces of neighbourhoods.\
      \ I visualize collective projects that would serve as a voice for the community, inviting women,\
      \ children and youth from different background to narrate their personal experiences of the changing\
      \ urban milieu through a variety of creative media and art forms."
