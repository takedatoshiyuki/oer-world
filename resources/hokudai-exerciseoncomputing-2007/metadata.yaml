name:
  ja: 学部専門教育 コンピューティング演習（2007）
description:
  ja: 工学部環境社会工学科の2年生を対象に、コンピュータを使った問題解決の基礎を扱う演習である。プログラミング言語の理解から、簡単なプログラムの設計、計算結果の表示と考察までを、演習課題を通して学ぶ。公開教材として講義資料2件と実施要領1件がある。
quotedDescription:
  text:
    ja: 様々な現象の分析・解明、実験より得られたデータの解析等、コンピュータは環境社会工学科の各分野で必須の道具である。本演習ではコンピュータを利用した問題解決へ向けての基礎的な技術の修得を目標とする。すなわち、プログラミング言語を理解して簡単なプログラムのデザイン能力を身につけると共に、コンピュータによる計算の実行、計算結果の表示、結果に対する考察までの一連の過程を、演習課題を通じて学習する。
