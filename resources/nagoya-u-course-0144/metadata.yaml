description:
  ja: 現代日本語の文法をいくつかの話題に分け、具体例をもとに分析・考察する講義である。あわせて、日本語教科書や文法解説書における文法項目の扱いを整理し、日本語教育への応用や実用的な文法指導の方法まで扱う。
