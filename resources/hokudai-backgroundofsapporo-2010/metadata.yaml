name:
  ja: 土曜市民セミナー 豊平川沿いに札幌の生い立ちをさぐる ～北の都の一千万年史～(2010)
description:
  ja: 豊平川の扇状地に成立した札幌の地形と、その流域がもたらしてきた水・緑・石材・鉱物資源などの関わりを扱う。鉱物資源、温泉、地震、カイギュウ化石に触れながら、地学的データをもとに豊平川流域の地質と一千数百万年前までの地史をたどる。あわせて、直下型地震や地震動に関係する札幌の地下構造と地盤の成り立ちを解説する。
quotedDescription:
  text:
    ja: 札幌の中心部は豊平川の扇状地の上に成り立っていますが、豊平川とその流域は「命をつなぐ水」、「憩いの緑」、建築用の石材、鉱物資源（豊羽鉱山）など、明治期以来、札幌市・市民に多大な恩恵をもたらしてきました。鉱物資源・温泉・地震・カイギュウ化石などに関連して、自らの足・手・眼で直接確かめた地学的データを基にしながら、豊平川流域の地質を明らかにし、一千数百万年前までの地史を語ります。合わせて、直下型地震の発生や地震動で問題となる札幌の地下構造・地盤の成り立ちについて解説します。
