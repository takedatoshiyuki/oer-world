name:
  ja: 2017A Introduction to Physics 初級物理学
description:
  ja: エネルギーと運動に関わる物理学の基礎的概念や法則を、力学を中心に扱う講義である。ニュートンの法則、仕事とエネルギー、運動量、回転運動、振動、波、流体、万有引力などを順に学ぶ。
quotedDescription:
  text:
    ja: 'This course provides an introduction to fundamental concepts and laws related to energy and motion
      in the physical science.

      力学を中心として、エネルギーと運動に関わる物理学の基礎的諸概念や法則について学ぶ。ICU献学の理念とその歴史について近代日本社会の歩みの中でとらえる。明治以来のキリスト教の高等教育の歴史に始まり、冷戦時代に創設されたICUの現在までの経験を考察する。

      Contents of Lectures

      Newtons first two laws, position, velocity, acceleration, force, mass (example: skating)

      Free fall, acceleration due to gravity, mass, weight, superposition (example: falling balls)

      Newton’s third law, force addition, mechanical advantage, work, energy (kinetic and potential),
      gravitational potential energy (example: ramps)

      Newton’s laws of rotational motion, angular velocity, angular acceleration, torque, rotational inertia,
      rotational mass, center of mass, lever arm, torque balance (example: seesaw)

      Friction (static and sliding), work, torque and power, translational and rotational kinetic energy,
      potential and thermal energy, roller bearing, free and powered wheels (example: wheels)

      Linear and angular momentum and momentum transfer, (angular) impulse, change of rotational mass,
      force and potential energy,

      Hooke’s law of elasticity, measuring mass, simple oscillation (example: spring scale)

      8.

      Elastic and inelastic collisions, energy and velocity of collision and rebound, frames of reference,
      vibrations (example: ball sports)

      9.

      Feeling of acceleration and apparent weight, uniform circular motion, centripetal force and acceleration
      (examples: carousel and roller coaster)

      10.

      Static and dynamic stability, precession, drive system (example: bicycle)

      11.

      Rocket propulsion, Newton’s Law of Universal Gravitation, Kepler’s laws (example: space travel)

      12.

      Atmospheric pressure gradient, buoyancy, temperature definitions, ideal gas law (example: ballons)

      13.

      Hydrodynamics, hydraulics, pump mechanism, steady state flow, streamlines, Bernoulli’s equation
      (example: water distribution)

      14.Oscillations, period, frequency, amplitude, harmonic oscillator, pendulum, piezoelectricity (example:
      clocks)

      15.Standing and traveling waves, harmonics, resonant energy transfer, sympathetic vibration, sound
      waves, open and closed air column vibration, transverse and longitudinal waves (example: musical
      instruments)

      16.

      Water waves, physics of tides, tidal power, tsunami, wave breaking, wave reflection, refraction,
      dispersion and interference (example: sea)'
