name:
  ja: 情報処理基礎演習
description:
  ja: パソコンの基本操作と、PASCALなどを用いた初歩的なプログラミング演習を扱う。基本コマンド、日本語ワードプロセッサ、電子メールの利用を通して、計算機システムを利用するための基礎を学ぶ。あわせて、問題を解く手順であるアルゴリズムを考え、プログラムとして表現する過程を扱う。
quotedDescription:
  text:
    ja: 'この科目では、パソコンの実際的な操作法とプログラミングの初歩を学びます。

      実際的な操作法としては、パソコンの基本コマンドや日本語ワードプロセッサ、電子メールを利用し、

      道具としてのパソコンの基本的操作を身につけます。

      数値計算法や大型計算機操作法などはあつかいませんが、一般的な計算機システム利用のための知識を身につけることができます。

      プログラミングとは、与えられた問題を分析して問題を解くための手順、すなわちアルゴリズムを見つけだし、

      プログラミング言語を用いて表現する作業です。

      この科目では、パソコン上で ＰＡＳＣＡＬ等のプログラミング言語を用いて、初歩的なプログラミングの演習をおこないます。

      実際にプログラムを作成することにより、プログラムの本質であるアルゴリズムの概念を理解することを目標とします。'
