name:
  ja: 非線形制御特論
description:
  ja: 非線形の微分方程式で表される制御対象を扱い、制御方法と性能の解析手法を学ぶ講義である。リアプノフの方法、入出力安定性、消散理論といった基礎的な手法から、メカトロニクス系のモデル化や制御手法までを取り上げる。
quotedDescription:
  text:
    ja: 本講義では，非線形の微分方程式で表された制御対象の制御方法や性能の解析手法を学ぶ。一般的な非線形の解析手法であるリアプノフの方法，入出力安定性，消散理論などの基礎的な内容から，メカトロニクス系の特徴をとらえたモデル化や制御手法など実用的なものまで，幅広い内容についてふれる。制御工学だけではなく数学や物理学など，関連分野とのつながりを意識した講義を行いたい。
