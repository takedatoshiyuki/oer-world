description:
  ja: 競技スポーツのメカニズムに焦点を当て、身体動作や心理面特性、ゲーム局面を取り上げる。あわせて、青年期の運動・心理の可能性を探り、大学生活を心身ともに健康に過ごすための基礎的知識と運動の意義を学ぶ。
quotedDescription:
  text:
    ja: スポーツ・運動理論は世界水準の身体運動発揮現場から導き出されている。本講義では様々な競技スポーツのメカニズムにフォーカスし、近年明らかにされてきた身体動作および心理面特性・ゲーム局面を理解し、青年期における自らの運動・心理ダイナミズムの可能性を探る。また大学生活を心身ともに健康に過ごすために必要な基礎的知識の修得と、運動の意義・必要性について多面的に学ぶ
