description:
  ja: この講義は、情報社会における基礎力としてのプログラミングを、初歩から課題解決まで通して学ぶ内容である。Rubyを用いて、コンピュータと対話しながらプログラムを書く考え方を扱う。さらに、Ruby
    on RailsなどWeb向け開発環境にも触れる。
quotedDescription:
  text:
    ja: '情報社会における学問の基礎力として，コンピュータと会話するプログラミングについて学ぶ。初歩から始め，課題の解決を通して，実践的に学ぶ。

      本講義では，オブジェクト指向型のプログラミング言語Rubyを用いる。Rubyは，日本発の代表的なプログラミング言語で，オープンソースとして，世界中で広く使われている。最近は，Ruby on Railsなど，Webで使うソフトの開発環境として，世界的に注目されている。ごく初心者の場合は，より簡易なオブジェクト指向型言語に触れて，プログラミング言語Rubyの利用をめざす場合もある。'
