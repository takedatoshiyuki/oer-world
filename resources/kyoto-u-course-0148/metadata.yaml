name:
  ja: 2014年度 E.FORUM 全国スクールリーダー育成研修：教師力アップ研修「探究力をどう育成するか」
description:
  ja: 本教材は、学校教育で求められる探究力の育成をテーマに、探究を深める際の思考のあり方や、その育成方法を扱う。あわせて、SGHでの実践報告を踏まえ、探究指導のためのカリキュラムと評価のあり方まで検討する内容である。
quotedDescription:
  text:
    ja: '趣旨

      変化の激しい現代社会において、学校教育では、探究力の育成がますます求められるようになっています。スーパーサイエンスハイスクール (SSH) や、スーパーグローバルハイスクール (SGH) において探究的な学習が重視されていることは、そのことを示す端的な例と言えるでしょう。

      そこで本研修では、探究力を育成するための手立てについて考えます。探究を深める際に鍵となる思考とはどのようなものなのかについて伊勢田哲治准教授にご提案いただくとともに、SGH として先進的な取り組みを進めておられる金沢大学附属高等学校より実践をご報告いただきます。その上で、探究指導のためのカリキュラムや評価のあり方について検討したいと考えています。'
  source: https://ocw.kyoto-u.ac.jp/course/148/
