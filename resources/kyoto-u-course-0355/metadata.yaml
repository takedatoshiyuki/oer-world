  ja: 教育学研究科レクチャーシリーズ第2回 “Research-based Development of Finnish Education”
description:
  ja: フィンランド教育を研究に基づいて発展させる考え方を扱い、1970年代後半の教員養成改革以降に続く大学研究と教育実践の関係をたどる。あわせて、研究と実践を結びつけるためのモデルと、数学教育分野の具体例を示す。
quotedDescription:
  text:
    ja: 'コース概要

      Since the new teacher education reform in late 1970’s there has been close relationship between
      university-based research and educational practices. In the beginning it mainly meant that it was
      easy to carry out individual research studies in schools, teacher students in preservice teacher
      education participated in research projects, and researchers were invited to run separate in-service
      training sessions for teachers. In recent years there have been attempts to make the impact of research
      more sustainable by developing more systematic, broad-scale, and long-lasting models for research-practice
      collaboration. In the presentation I present some general principles of Finnish education, research
      based development models and concrete example from our research in the field of mathematics education.'
