name:
  ja: 微分積分学 B
description:
  ja: 微分積分法Aに続く内容として、微分積分の基本公式、広義積分、多変数の微分積分を扱う講義資料である。具体例を早い段階から多く示す方針があり、抽象論は必要最低限にとどめる構成になっている。第1回から第10回までの講義ノートが公開されている。
quotedDescription:
  text:
    ja: '授業の特色

      理論面の一般性・厳密性を保持しつつ、抽象論に偏らず、具体例を通じて「体で覚える微積分」を目指す。

      授業の紹介

      微積分法A（前期）にひきつづき、微積分の基本公式、広義積分、多変数の微積分を述べる。従来の教程を大胆に見直すことにより、具体例をできるだけ早い段階で、かつ多くの時間をかけて述べられるように配慮し、難解な抽象論は必要最低限、かつ後まわしにする。'
