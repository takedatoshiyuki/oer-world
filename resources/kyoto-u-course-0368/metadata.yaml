name:
  ja: Combinatorial structures for distributed computing models
description:
  ja: 分散計算の基礎を導入し、さまざまな分散計算モデルをどう整理して扱うかを考える講義である。後半では、モデル実行を表す単体複体の性質を通して、広いクラスのモデルの計算可能性を特徴づける方法を扱う。
quotedDescription:
  text:
    ja: 'Course Description

      The main complication in the analysis of distributed systems is the immense diversity of distributed
      computing models, combined with the lack of mathematical tools to handle this complexity.

      In this mini-course, we begin with a gentle introduction into the basics of distributed computing
      and then discuss how to characterize the computability power of a large class of models via properties
      of the corresponding simplicial complexes, combinatorial structures capturing representative sets
      of model executions.'
