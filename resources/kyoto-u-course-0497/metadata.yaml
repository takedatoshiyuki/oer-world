name:
  ja: 初心者のための簡易補修～よくある破損、こう直そう
description:
  ja: 図書館で見つかる図書の破損のうち、ページの破れや外れ、背の外れ、表紙と中身のつなぎ部分の緩みを取り上げる。作業手順を撮影した映像に基づくレクチャーと実習を通して、簡易な補修の手順を学ぶ。補修経験がない、または補修をよくわからないまま行っている図書系職員を対象とする。
quotedDescription:
  text:
    ja: 'カウンターでの受け渡しや書架整理の際に破損した図書が見つかることがあります。破損の進行を止め長く利用するためには、傷みの少ないうちに適切な処置を施すことが大切です。今回は、ページの破れや外れ、背の外れ、表紙と中身のつなぎ部分の緩みなど、図書館でよくある破損を扱います。作業手順を撮影した映像に基づくレクチャーと実習を通して、ぜひ知っておきたい簡易な補修方法を学んでいただきます。今まで補修をしたことがない、またはよくわからないまま補修をしているという初心者の方が対象です。

      京都大学図書館業務改善検討委員会 資料保存環境整備部会

      対象：図書系職員'
