quotedDescription:
  text:
    ja: 目を閉じて、あなたがこれまで過ごしてきた家の事を思い出してください。だれもが、楽しい出来事や思い出に残るひとときを一つや二つ、思い起こすのではないでしょうか。 その一方で、あなたが住む家と他の人の家は同じなのか、違うのかと、考えたことはありませんか？
