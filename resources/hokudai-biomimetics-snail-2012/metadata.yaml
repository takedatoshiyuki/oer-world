description:
  ja: カタツムリの性質を手がかりに、住宅材料の防汚技術を扱う。環境負荷を低減しながら人にとっての価値を上げる技術について紹介する内容である。
quotedDescription:
  text:
    ja: 日本の梅雨の代名詞と言えばアジサイとカタツムリです。カタツムリは乾燥に弱いためジメジメした場所を好むせいか、汚れたイメージが付きまといます。しかし、殻が汚れたカタツムリを見つける事はなかなかできません。そこにはどんな秘密が隠されているのでしょうか？本セミナーではカタツムリから学び、環境負荷を低減しながら、人にとっての価値を上げる住宅材料の防汚技術について紹介します。
