name:
  ja: 生物学各論
description:
  ja: 植物を中心に、生殖、遺伝、発生の分子機構を扱い、細胞間コミュニケーションに関わるシグナリング分子に注目する講義である。細胞間シグナリング分子の発見の経緯も取り上げ、仕組みの理解を通して多細胞生物の進化的背景まで考察する。
quotedDescription:
  text:
    ja: '植物を中心に生殖、遺伝、発生の分子機構について講義を行う。特に細胞間のコミュニケーションを担うシグナリング分子に着目することで、幅広く生物界を俯瞰する。

      バクテリアから高等動植物に至るまで、個々の細胞は、他の細胞とコミュニケーションをとることで、生命の営みを維持している。それは細胞の増殖の協調や、細胞の出会い、位置情報や生理情報の交換といった、様々な局面で見られる。本講義では、特に細胞間シグナリング分子が発見されてきた経緯については詳しく紹介する。最終的には、細胞間シグナリングの様々な仕組みを理解することで、現在の多細胞生物を生み出してきた進化的背景についても考察したい。'
