name:
  ja: 環境行動論
description:
  ja: 廃棄物、水、交通、エネルギーなどに関わる環境問題を、消費者や住民の認知・態度・行動の観点から扱う講義である。環境心理学の視点に加え、環境ボランティアや環境NPOの事例を通して、心理学が環境問題の解決にどう関わるかを考察する。あわせて、アクションリサーチや社会調査などの研究アプローチにも触れる。
quotedDescription:
  text:
    ja: 廃棄物、水、交通、エネルギーなどに関する多様な環境問題についての消費者・住民の認知・態度・行動の特徴やその規定因との関連を、環境心理学の視点から解明する。あわせて、グローバルおよびローカルの環境問題の解決に対して心理学がどのような貢献をできるのかを、環境ボランティアや環境
      NPO による様々な環境問題への取り組み事例などをもとに、アクションリサーチ、フィールド実験、擬似実験、社会調査、事例分析などの研究アプローチの意義とともに考察する。
  source: https://ocw.nagoya-u.jp/courses/0127-%E7%92%B0%E5%A2%83%E8%A1%8C%E5%8B%95%E8%AB%96-2008/
