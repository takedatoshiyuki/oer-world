name:
  ja: 土曜市民セミナー 何が出る 豊平川の 花見かな(2011)
description:
  ja: 豊平川の河口から源頭部までを順に追い、沿岸部から山地までの各地点で見られる植物を取り上げる。湿地や山間部、残雪の残る高標高域など、流域に広がるさまざまな環境をたどりながら植物相を紹介する。
quotedDescription:
  text:
    ja: 豊平川が注ぐ石狩川河口付近の海辺から花をたずねながら源頭のハイマツ帯までさかのぼってみます。湿った低地には沼と共に湿地の植物、扇状地上に広がった札幌市市街地は帰化植物がほとんどなのでここはパス。代わりに周囲の藻岩山や桜山、柏ヶ丘などを尋ねて中流域の山間部へ。定山渓付近で幾つかの支流を分け、その源頭部は標高１０００メートルを超える山が連なっていますが、基本的に山頂部はハイマツ帯。遅くまで残雪の見られる所には思いがけないお花畑が・・・。豊平川を囲む地域に固有種こそありませんが、山あり沼あり岩場ありの環境からして植物相は想像以上に豊かです。
  source: https://ocw.hokudai.ac.jp/lecture/flowersnearthetoyohirariver-2011
