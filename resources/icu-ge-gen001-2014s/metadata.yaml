name:
  ja: 'N1: Life Science (A) Ｎ１：生命科学（Ａ）'
description:
  ja: 生命科学の基礎知識を踏まえ、生物学者が研究をどのように進めるかを扱う共同講義である。公開教材としては、Lecture 2 のスライドが掲載されており、ヒトの脳の性やジェンダーに関する内容を含む。
quotedDescription:
  text:
    ja: 'This is a collaborative course that aims to promote understanding of how biologists conduct their
      research based on the fundamental knowledge of this field introduced in the course.

      生物学の基礎を理解したうえで、生物学研究が生物学者によってどのように行われているのかを理解することを目的とした共同講義。

      Contents of Lectures

      1 Lecture / 1 Video

      Lecture 2

      ヒトの脳の性（男の脳、女の脳）：ヒトのジェンダー（性自認）は胎児の時に決まる。

      Slide

      ※Video is partial recording of Course.

      ※この動画はコースの一部を公開しています。'
