name:
  ja: 春秋講義「共生ネットワークでよみとく地球生態系の未来」
description:
  ja: DNA分析技術の進歩を背景に、微生物の多様性と機能を取り上げる講義である。ヒトの腸内細菌、植物に共生する細菌や真菌の役割を通して、病気の予防、食糧生産、希少植物の保全との関係を扱う。あわせて、人類と地球生態系の未来に関わる菌の発見という最新科学の話題を紹介する。
quotedDescription:
  text:
    ja: '講演内容

      DNA分析技術が近年飛躍的に進歩し、微生物たちの驚くべき多様性と機能が次々に明らかになってきました。ヒトの腸内に生息する多様な細菌たちは、病気の予防にも大きく貢献しています。植物に共生する細菌や真菌（きのこ・かび類）は、食糧生産を伸ばす上で、また、希少植物を絶滅から救う上で、欠かせない存在です。人類と地球生態系の未来を救う菌を発見できるのか？
      最新科学の挑戦について紹介します。'
