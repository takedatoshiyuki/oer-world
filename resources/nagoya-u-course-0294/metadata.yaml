  ja: 心理行動科学実験演習9（観察法）
description:
  ja: 学校での授業場面を観察し、発話や行動のデータを集めて、コード化・整理・検討まで行う流れを扱う。心理学・行動科学における観察法を、実際の観察作業を通して学ぶ内容である。
quotedDescription:
  text:
    ja: 心理学・行動科学の主要な研究方法のひとつである、行動観察法について、学校での実際の授業場面の観察を実施し、発話・行動データを収集し、データのコード化、整理、検討を行いながら、体験的に学習する。単に、日常的に見たり聴いたりする、いうこと以上に、人間の行動を客観的、科学的にアプローチする方法である、心理学研究法としての観察法を学ぶことを目的とする。
