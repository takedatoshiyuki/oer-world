name:
  ja: 第4回「京大おもろトーク：アートな京大を目指して」〜ちょっとぐらい ええやないか
description:
  ja: この教材は、京都とアートの関係を手がかりに、京都大学がアートの発想を取り入れて変わろうとする試みを扱う。講義では「ちょっとぐらい ええやないか」というテーマを軸に、社会の風通しをよくするための考え方を論じる。
quotedDescription:
  text:
    ja: '長い歴史と文化を持つ京都は、同時に常に最先端の動きを取り入れてきた町でもあります。アートはその伝統とモダンをつなぎ、新しい動きを創る力を持っています。いま京都大学はアートの発想を取り入れて、新しく生まれ変わろうとしています。京大おもろトークに参加して、その試みを目撃してみませんか？
      第4回目のテーマは、「ちょっとぐらい ええやないか」です。

      今は、人と人とのつながりや社会生活において、ルールが先にあるような時代です。はみ出たことをすると、攻撃をするようなちょっと窮屈なところがあります。しかし、「ちょっとぐらい ええやないか」という気持ちを持っているはずです。

      「ちょっとぐらい ええやないか」という言葉をアートで、私たちの時代の風通しを良くして住みやすい場所にするための方法を考えてみます。'
  source: https://ocw.kyoto-u.ac.jp/course/244/
