name:
  ja: 東京大学バーチャルリアリティ教育研究センター開所記念式典：東京大学が挑戦するバーチャルリアリティの未来
description:
  ja: 東京大学のVR教育研究センター開所記念式典を扱い、式典当日の講演とパネルディスカッションを収録する。医学系や人文系など複数分野でVRを用いる若手研究者の講演を通して、VRの活用例を示す。その後、VRに期待することを議論する構成になっている。
quotedDescription:
  text:
    ja: '東京大学は、2018年11月1日(木)、伊藤国際学術研究センター・伊藤謝恩ホールにおいて、バーチャルリアリティ(VR)教育研究センター設立記念式典を開催しました。

      若手講演・パネルディスカッション１「バーチャルリアリティへの期待」では、医学系や人文系など様々な分野でVRをツールとして使用している若手研究者による講演のあと、VRに期待することについて議論します。

      若手講演

      00:01:56 「3DCGを駆使した脳神経外科手術シュ…'
