name:
  ja: 原子力人材育成事業（*） 機関連携強化による未来社会に向けた新たな原子力教育拠点の構築 ：原子力安全工学
description:
  ja: 原子力安全工学を主題に、原子力安全の基礎から原子力発電プラントの設備、設計基準事象の解析、安全設計・安全評価までを扱う講義資料である。さらに、規制基準、外的ハザード、シビアアクシデント、原子力防災、主要な原子力事故、福島第一原子力発電所事故までを含み、全体として原子力安全を幅広く整理する内容になっている。
