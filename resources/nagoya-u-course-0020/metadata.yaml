name:
  ja: 管理会計
description:
  ja: この講義は、企業経営における会計の役割を扱う。財務諸表作成のための原価計算を起点に、その計算が経営上の意思決定やマネジメント・コントロールでどう使われるかを説明する。公開資料には、原価計算編、意思決定会計、管理会計の有用性、戦略的コストマネジメントなどの教材が含まれる。
quotedDescription:
  text:
    ja: 会計が企業経営にどのように貢献するかについて理解を深めることを講義の目的とする。はじめに財務諸表作成のための原価計算について説明する。そして、そうした原価計算が経営上の意思決定のどのように利用されるか説明し、マネジメント・コントロールなどにおける会計の役割とその有用性について説明していく。
