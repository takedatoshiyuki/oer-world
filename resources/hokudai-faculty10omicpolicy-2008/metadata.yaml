name:
  ja: 大学院教育 経済政策論（2008）
description:
  ja: 公共政策大学院の1年次向けに開講された経済政策の講義で、財政・金融政策に限らず、日本経済や世界経済の構造変化を含む視点から経済政策を扱う。公開されている教材には、講義全体のノートや目次に加え、市場と国家、マクロ経済均衡、対外経済政策、グローバル化に関する資料が含まれる。
quotedDescription:
  text:
    ja: '本科目は，公共政策の基本科目のうち，学生の知見を標準化するための前提科目の一つとして開講される．

      経済政策に関し，財政・金融政策といった範囲に限定することなく，日本経済，世界経済の構造変化等学際的な視点から体系的に方向づけ，理論と実践を融合した経済政策の知識と応用力を形成することを目的としている．'
  source: https://ocw.hokudai.ac.jp/lecture/faculty10omicpolicy-2008
