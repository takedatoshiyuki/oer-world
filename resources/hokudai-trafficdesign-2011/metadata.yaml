name:
  ja: 北海道大学大学院経済学研究科・経済学部セミナー 札幌市の交通デザイン （2011）
description:
  ja: 札幌市の交通政策を題材に、学識経験者や実務家を招いて工学的側面と政策的側面の両方から論点を掘り下げるセミナーである。札幌市の交通事情にある問題点を整理し、将来の交通戦略をどう構築するかを扱う。
quotedDescription:
  text:
    ja: 本セミナーでは札幌市の交通政策に深く係わられている、学識経験者・実務に携われている方などをお招きして工学的側面、政策的側面など、多角的見地からテーマを深く掘り下げていきます。少子高齢化の急速な進展、経済活力の低下、低炭素型都市の実現など、様々な課題を抱える札幌市交通事情。その問題点を把握し、将来的に札幌の交通戦略をいかに構築していくかを探ります。
