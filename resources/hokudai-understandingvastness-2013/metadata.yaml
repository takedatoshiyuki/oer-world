name:
  ja: 土曜市民セミナー 「フカシギの数え方」（2013）
description:
  ja: 身近な問題に現れる組合せの数を手がかりに、超巨大数の考え方を扱う。畳の敷き詰め方や電車の乗り換え案内を例に、組合せ爆発とそれに対する情報科学の研究成果を紹介する。
quotedDescription:
  text:
    ja: 「不可思議（フカシギ）」とは、万、億、兆、京などと続く数の単位で、１の後に０が６４個も続く数のことです。みなさん想像できますか？実は、畳の敷き詰め方から電車の乗り換え案内まで、私たちの身の回りにある様々な組合せの中に、フカシギのような超巨大数が現れます。このセミナーでは身近な問題を題材にして、「組合せ爆発」のものすごさと、それに立ち向かう最先端の情報科学の研究成果をご紹介します。
