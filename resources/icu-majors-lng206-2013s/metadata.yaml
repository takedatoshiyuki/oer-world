name:
  ja: Language and Culture in Japan 日本の言語と文化
description:
  ja: 日本語の言語的特徴と文化との関係を、言語学や日本語学の観点から扱う講義である。語彙、和製英語、敬語、男女差のある言葉、擬態語・擬声語などの話題に加え、日本語教育の歴史や日本語で書かれた非日本語話者の文学作品にも触れる。
