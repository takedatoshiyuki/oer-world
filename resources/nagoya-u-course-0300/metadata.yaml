name:
  ja: オートマトン・形式言語特論
description:
  ja: この教材は、木言語上のオートマトンを中心に、形式言語と論理の関係を扱う。講義ノートではNFTAやDFTA、反復補題、閉包性、Myhill-Nerode定理、正規木文法、木正規表現、WSkS、線形時間命題論理などを学ぶ構成になっている。
quotedDescription:
  text:
    ja: オートマトン理論は情報科学の土台ともいえ、コンパイラへの応用やモデル検査アルゴリズムへの応用など、情報処理全般の理論的基礎となっている。本講義では、木言語上のオートマトンを学び、論理との関係や応用について論ずる。
