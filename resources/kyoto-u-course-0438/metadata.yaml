name:
  ja: 資源生物科学概論Ⅲ
description:
  ja: 海洋資源生物の生活史や生産の特徴を取り上げ、それらを支える物質循環と微生物の役割、海洋の物理環境を扱う。さらに、その基盤の上に成り立つ生物資源の利用、マリンバイオテクノロジー、資源培養技術、海洋環境保全の現状と将来展望を概説する。
quotedDescription:
  text:
    ja: 海洋資源生物の生活史や生産の特徴と、それらを支える物質循環に果たす微生物の役割並びに海洋の物理環境の特徴を述べる。また、それらを基盤にして生まれる生物資源の食料、生理活性物質等としての有効利用、マリンバイオテクノロジー、資源培養技術、海洋環境保全の現状と将来展望を概説する。
