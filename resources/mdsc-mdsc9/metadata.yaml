name:
  ja: 国民生活基礎調査
description:
  ja: 全国の世帯と世帯員を対象に、保健・医療・福祉・年金・所得に関する基礎的な項目を調べる教材である。世帯数や世帯人員、所得、健康、介護の状況などの結果を扱い、行政の企画や運営に必要な基礎資料を得るための調査であることが示されている。
quotedDescription:
  text:
    ja: 世帯数と世帯人員の状況、各種世帯の所得等の状況、世帯員の健康状況、介護の状況等の結果を提供。全国の世帯及び世帯員を対象に、保健、医療、福祉、年金、所得等国民生活の基礎的事項を調査し、厚生労働行政の企画及び運営に必要な基礎資料を得ることを目的とし、昭和61年を初年として３年ごとに大規模な調査を実施し、中間の各年は簡易な調査を実施している。
