description:
  ja: 少人数のグループで、生物現象に関する課題を取り上げて学習する講義である。ここでは「細胞応答の分子機構」をテーマに、小胞体の機能維持に関わる真核細胞の応答を扱い、関連する重要な論文や総説を講読する。
quotedDescription:
  text:
    ja: '種々の生物現象について，他の教科から派生した問題や，それらとは独立した新たな問題について，教員と学生の比較的小人数のグループで，密度の高い学習を行う。学習課題は教員あるいは教員群が呈示したり，学生の希望に基づいたりして決定する。

      「細胞応答の分子機構」

      分泌系タンパク質の高次構造形成の場である小胞体の機能を維持するために真核細胞が示す様々な応答についての重要な論文・総説を講読する。'
