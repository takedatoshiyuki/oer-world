name:
  ja: 2014年度 特別講義「『地域の時代』をデザインする」
description:
  ja: デザインを理念の表現として捉え、地域社会が直面する少子高齢化や過疎化、地域産業の衰退を主な題材として扱う講義である。デザインの視点から、これらの課題を乗り越えるための理念と戦略を構想し、地域の新たな発展モデルを考える。
quotedDescription:
  text:
    ja: デザイン＝自分の理念を表現すること。 高度経済成長期に付加価値創造の要となってきたデザインに、今新たな役割が求められている。少子・高齢化、過疎化、地域産業の衰退といった解き難く思える諸問題を乗り越え、地域社会の新たな発展モデルを描き出すための理念と戦略を、デザインの視点から構想してみる。
