name:
  ja: 技術は人を不幸にするのか？東大教授たちと考えるELSI/RRI Vol.2 「エネルギーと環境 未来の持続可能社会をどうするべきか」
description:
  ja: 技術革新がもたらす社会的・倫理的な論点を、ELSI/RRIの観点から考える講義である。Vol.2では、エネルギーと環境を切り口に、気候変動を踏まえた持続可能な社会のあり方をめぐって複数の研究者が対話する。
quotedDescription:
  text:
    ja: '現代社会において、技術革新は日々進展していますが、その一方で倫理的・社会的な課題も顕在化しています。こうした背景の中、大学における倫理的・法的・社会的課題（ELSI, Ethical,
      Legal and Social Issues）を意識した責任ある研究・イノベーション（RRI, Responsible Research and Innovation）の重要性がますます高まっています。本シリーズの目的は、工学が関わる様々な分野における技術とその社会的影響について、我々が持つ知見を共有し、広く社会に対して理解を深めてもらうこと、つまり、多角的な視点から未来技術のELSI/RRIを探求することです。そして、未来技術の最前線で活躍する研究者の知見と対話を通じて、視聴者に新たな視点を提供することを目指しています。

      vol.2のテーマは「エネルギーと環境」。気候変動という大きな課題を前に、私たちは未来の持続可能な社会をどのように築いていけばよいのか？ この答えのない問いに、各分野のトップを走る4人の教授たちが挑みます。あえて答えを出さないトークセッションを、お楽しみ下さい！'
  source: https://ch.u-tokyo.ac.jp/series/?id=XdNULvjnLdJK
