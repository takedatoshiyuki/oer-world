name:
  ja: 学部専門教育 基礎乗船実習（2008）
description:
  ja: 水産学附属練習船「おしょろ丸」に乗船し、海をフィールドとして実体験する内容を扱う。航法や海図による地学の理解に加え、生物採取や観測を通して海洋生物の生息を学ぶ。あわせて、船という空間でのグループ学習と共同生活も含む。
quotedDescription:
  text:
    ja: '水産学附属練習船「おしょろ丸」に乗船し，水産学の対象となる海というフィールドを実体験すると同時に，フィールドに出るために必要な船の航法や海図等を通した地学の理解，またイカ等の生物採取，イルカ等の観測等により生きた海洋生物に接し，海洋生物の生息を理解します。全体にグループ学習を通して船という空間での規則正しい共同生活を体験します。

      【関連動画】

      北海道大学 ※準備中

      水産学部 ※準備中'
