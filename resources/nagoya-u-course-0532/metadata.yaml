name:
  ja: 社会的行為と言語I
description:
  ja: この講義は、個人が言語やスタイルをどのように使い分けてコミュニケーション上の課題に対処するかを扱う。また、個々の言語活動が言語変化などのより大きな現象とどう結びつき、社会がそれにどう対応するかも扱う。公開教材には、多言語使用、方言、社会的変異、語用論、ポライトネス、談話、言語と文化などの項目が含まれる。
quotedDescription:
  text:
    ja: 以下のトピックについて学びます。扱うトピックは、  1. 個々人がどのように異なる言語やスタイルを使い分け、コミュニケーションにおける課題を解決しているか、また  2. 個々人の言語活動が、言語変化などより大きなスケールでの現象とどのように結びつき、また社会はそれにどう対応していくのかという2つの問題に大きく分けることができます。授業中は、英語による議論への積極的参加が求められます。
  source: https://ocw.nagoya-u.jp/courses/0532-%E7%A4%BE%E4%BC%9A%E7%9A%84%E8%A1%8C%E7%82%BA%E3%81%A8%E8%A8%80%E8%AA%9EI-2015/
