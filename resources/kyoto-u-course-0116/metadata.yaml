name:
  ja: コンパイラ
description:
  ja: この教材は、コンパイラとインタプリタを含む言語処理系の位置づけを扱い、その中でコンパイラの基本的な構成要素を順に取り上げる。公開資料には、概要から字句解析、文法、構文解析、意味解析、コード生成までの講義資料と試験問題が含まれる。出典文上では、再帰的下向き構文解析法やLR構文解析法、lex、yaccにも触れる。
quotedDescription:
  text:
    ja: '授業の特色

      教科書に準拠したPowerPoint資料に基づいて，講義中心の授業を行う．

      授業の紹介

      計算機の基本的ソフトウェアであるコンパイラやインタプリタなどの言語処理系とそれらの関係などについて概説し，その内の特にコンパイラについて，字句解析手法，構文解析手法，コード生成手法について詳説する．取り上げる構文解析法は，再帰的下向き構文解析法，LR構文解析法など．lexやyaccなどのコンパイラ生成ツールについても触れる．'
  source: https://ocw.kyoto-u.ac.jp/course/116/
