name:
  ja: 人文学カフェ そうだ、聖地へ行こう（2011）
description:
  ja: イランやイラク、イスラームのシーア派に関する話題を手がかりに、巡礼の営みを取り上げる講義である。現地イランでの研究をもとに、シーア派の巡礼がどのようなものかを説明する。
quotedDescription:
  text:
    ja: '私たち日本人の多くにとってイランやイラクという国や、イスラームのシーア派の人々はなじみの薄い遠い世界の、遠い人々かもしれません。しかし、そこは紀元前までさかのぼる悠久の歴史・文化を持つ奥深い世界です。イスラームの人々の「巡礼」も長い歴史を持つ文化的営みの一つです。そしてその光景を映像などで目にする時、イスラームの人々は何と強い宗教的敬虔さを身につけているのだろうと素朴に思い、その点でイスラームの人々はわれわれ日本人とは大きく異なるのだと考えてしまいがちです。

      しかし、イスラームの人々を巡礼に赴かせる原動力は日本人も共通して持つ心情でもあるのです。そしてその意外な巡礼の動機が明らかになった時、イスラーム世界の巡礼は、それまでとは違ったものとして私たちの目に映ることでしょう。

      今回の話し手の守川知子さんは、気鋭のイラン・イスラーム社会史研究者です。現地イランで行われた研究をもとに、イスラーム・シーア派の巡礼について、その実像を解き明かしてきました。狭くなったといわれる世界においても、いまだ多くの未知なる部分が残されたイスラーム世界。守川さんのガイドで、ひとときその知られざる世界を堪能してみませんか。'
