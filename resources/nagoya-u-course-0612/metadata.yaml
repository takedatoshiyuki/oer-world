name:
  ja: 情報リテラシー（理系）
description:
  ja: 情報リテラシーの基礎として、コンピュータやネットワークの概説から、情報社会のモラル、情報セキュリティ、電子メール、情報検索までを扱う。あわせて、文書作成、表計算、プレゼンテーション、ウェブによる情報発信に触れ、演習を交えながら進める。理系のレポートや論文執筆で用いられるTeXやgnuplotも簡単に紹介する。
quotedDescription:
  text:
    ja: 'インターネットの普及とネットワーク環境の充実により，いつでもどこでも大量の情報に接することが可能になった．これらの情報を活用するため，情報を収集/整理分析/伝達する能力が必要とされる．これらの能力の中で，特に伝達(レポート，プレゼンテーション)は，大学の講義/実験/卒業研究で重要となる．また，近年では情報セキュリティ情報機器のセキュリティ確保やネットワーク利用におけるモラルが重大な問題となっているため，これらについての説明も行う．この講義の最終目標は，情報関連技術の活用能力の基礎と基本的なルールを講義と演習を通して習得することである．

      情報リテラシー/コンピュータ/ネットワーク概説

      情報社会のモラル/マナー

      情報セキュリティ

      電子メール(全学メール)の利用方法

      インターネットによる情報検索

      電子図書館と文献利用

      ワードプロセッサによる文書作成

      ウェブページなどによる情報発信

      表計算ソフトによる数値処理

      プレゼンテーションの手順と表現のコツ

      講義は上記のような内容を取り上げ，演習を交えながら進めるが，順序が前後する場合もある．

      また，演習内容においては一般的なウェブブラウザやオフィススイートを用いるが，講義内容においては，理系のレポート/論文執筆において良く使われるツール(TeX, gnuplot, など)についての簡単な紹介も行う.'
