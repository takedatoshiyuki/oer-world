name:
  ja: 無機構造論1
description:
  ja: 核磁気共鳴法（NMR）を手がかりに、無機化合物の結晶構造と電子構造を扱う講義資料である。理論的な説明に加え、論文などを参照した具体的な実験例も取り上げ、構造論を論述する。後半の資料では、超伝導理論、BCS理論、高温超伝導、遍歴と局在に関するNMRの話題を含む。
quotedDescription:
  text:
    ja: '授業の特色

      核磁気共鳴法を用いた無機化合物の結晶構造および電子構造研究に関して，理論的な説明と具体的な実験例（実際の論文などを引用しながら）を用いた詳細な説明とを併用して構造論を解説論述する点が特徴である。

      授業の紹介

      無機化合物の結晶構造および電子構造を調べる上で，非常に重要な微視的な化学的手法として核磁気共鳴法（NMR）がある．核磁気共鳴法を用いた構造論を論述し，実際の実験例などを参照しながら概説する。'
  source: https://ocw.kyoto-u.ac.jp/course/540/
