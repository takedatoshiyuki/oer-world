quotedDescription:
  text:
    ja: '授業の概要・目的

      本講義は，プレゼンテーション能力，英語のコミュニケーション能力，パワーポイント作成時に必要なデザイン能力等を養うため，英語で行うものである。受講生は前期，後期共に２回ずつの発表を行い，担当教員ならびにNative
      Speaker，海外からの研究者およびPh.Dコースの学生によってそれぞれの能力の評価を行う。発表は修士論文，博士論文，課題研究などを通じて行った実験について行い，発表時間は12分，質疑応答は約10分で行う。適宜OCWも利用することより，自己評価ならびに自分自身での能力向上を可能としている。'
