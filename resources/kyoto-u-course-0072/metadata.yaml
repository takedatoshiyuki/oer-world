description:
  ja: 英語で行う演習形式の講義で、発表と質疑応答を通してプレゼンテーション、英語でのコミュニケーション、スライド作成に必要なデザインの各要素を扱う。発表内容は、修士論文や博士論文、課題研究で行った実験に基づく。前期・後期にそれぞれ2回の発表を行い、教員やNative
