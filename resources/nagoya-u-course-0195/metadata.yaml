name:
  ja: 世界の中の日本語
description:
  ja: 日本語を世界の諸言語の中に位置づけ、その系統上の特徴を扱う教材である。さらに、主語や目的語の表し方、語順、時間表現といった言語の仕組みにも触れる。
quotedDescription:
  text:
    ja: 日本語は世界で使われている七千にものぼる諸言語の一つです。世界の言語の多くは、数十の「語族」と呼ばれる、祖先を共通にするグループのどれかに属しているのですが、日本語はどの語族にも属していません。この点で日本語は、起源的に孤立した言語です。一方で、主語や目的語を表す方法や、語順の規則、事柄が起きた時間を表す方法のような、言語としての特徴については、世界の言語の中でも多数派に属する「普通の」言語です。
  source: https://ocw.nagoya-u.jp/courses/0195-%E4%B8%96%E7%95%8C%E3%81%AE%E4%B8%AD%E3%81%AE%E6%97%A5%E6%9C%AC%E8%AA%9E-2009/
