name:
  ja: 北海道大学教育GP「博物館を舞台とした体験型全人教育の推進」 北大の教育改革の15年（2009）
description:
  ja: 北海道大学における1995年以降の教育改革を、15年の流れとして整理する講義である。教養教育の再編成、とくに体験型教育の拡充に焦点を当て、特色GP「進化するコアカリキュラム」と教育GP「博物館を舞台とした体験型全人教育の推進」の取り組みをたどる。あわせて、体験型教育を今後どう充実させるかという方向性と課題も扱う。
quotedDescription:
  text:
    ja: 北大では、1995年の教養部廃止・学部一貫教育の開始から15年をかけて、教育改革・授業改善に取り組み、教養教育の再編成、特に体験型教育の拡充をはかってきた。2003～2007年に実施された特色GP「進化するコアカリキュラム」から、2008年にはじまった教育GP「博物館を舞台とした体験型全人教育の推進」までのさまざまな取り組みを振り返るとともに、今後の体験型教育の充実の方向性と課題を考えてみる。
