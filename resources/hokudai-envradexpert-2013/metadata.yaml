name:
  ja: 特別プログラム 多様な環境放射能問題に対応可能な 国際的人材の機関連携による育成 「環境放射能専門家育成コース（上級コース）・講義」（2013）
description:
  ja: この講義は、環境放射能に関わる分野で将来国際的に活動する人材の育成を目的とし、放射性廃棄物の処理・処分技術や環境修復技術を扱う。あわせて、非密封放射性同位体を用いた実験やフィールドワークを行い、その成果を発表する機会も設ける。
quotedDescription:
  text:
    ja: '本事業では、放射線や放射能および原子力について正確な知識を習得し、原子力工学分野のみならず、環境科学、放射化学、保健物理学、獣医学、農学などの他分野の視点から環境放射能の諸課題を学び、さらに放射線計測の実習を通して環境放射能測定の技術を習得した、多様な環境放射能問題に対応可能な国際的人材を育成することを目的と致します。

      上級コースは、環境放射能に関連する分野で将来国際的に活躍できる人材の育成を目標とした、放射性廃棄物処理・処分技術および環境修復技術に関する講義ならびに非密封放射性同位体を用いた関連実験とフィールドワークを受講できるコースです。また、講義の成果をもとにした発表を通して、一般市民への情報発信スキルを身につけることができます。

      リンク

      国際原子力人材育成イニシアティブ事業'
