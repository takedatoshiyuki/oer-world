name:
  ja: 上智の座シリーズ 第3回
description:
  ja: ヨハネ・パウロ二世について、教皇選出から襲撃事件、冷戦終結期の出来事、晩年の活動までをたどる内容である。1981年5月13日の襲撃と、そこから2005年の死去、さらに2011年の福者宣言に至る流れが扱われる。
quotedDescription:
  text:
    ja: "ヨハネ・パウロ二世 世界を変えた教皇 \n 1981年5月13日、ヨハネ・パウロ二世は、バチカンの聖ペトロ広場で凶弾に倒れた。銃弾は腹部を貫通し、教皇は重傷を負ったが、一命をとりとめた。この事件は、1978年10月16日、ヨハネ・パウロ二世がカトリック教会の第264代目の教皇に選出されたその日から、1989年、ベルリ\
      \ ンの壁が崩壊し、冷戦が終結する日に通じる一本の線上で起きた出来事である。「恐れてはならない。 キリストに扉を開きなさい。世界を大きく変えるのです。」就任後間もなく口にされた教皇のこの予言的言葉は10年後に現実となった。しかしそのためには教皇がいのちを危険にさらすという犠牲が要求された。その後も教皇は「恐れてはならない」と繰り返しながら、2005年\
      \ 4月2日、84歳でこの世を去る日まで力の限りを尽くして世界平和のために働き続けられた。（2011年5月1日、カトリック教会はヨハネ・パウロ二世を福者と宣言する。）"
