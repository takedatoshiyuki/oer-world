  ja: ロシアにおける化学と大学の成立を、文化的背景や地理的条件、西欧文化の影響とあわせて扱う講義である。あわせて、ロシア科学界の長所と短所を踏まえ、基礎化学と応用科学の今後の展望にも触れる。
quotedDescription:
  text:
    ja: '授業概要・目的

      周期表を発見した科学者メンデレーエフを生み出したロシア。そのロシアにおける化学と大学の始まりがどのようなものであったかについて、文化的背景、地理的な条件、さらに西欧文化の影響と絡めてロシア・モスクワ国立大学化学科のAndrey
      Vorobiev博士が英語で講演されています。講演ではさらにロシア科学界の長所と短所を踏まえながら、今後の基礎化学と応用科学の展望についても話されています。'
