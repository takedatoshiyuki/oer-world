description:
  ja: 大学で学ぶための技術を自習するための動画教材で、テーマごとに短い単位で構成される。収録内容には、プレゼンテーションの基礎やレポート作成の基本が含まれる。
quotedDescription:
  text:
    ja: '本シリーズは，学生が大学で学ぶための技術「スタディスキル」を自習するための動画教材です。

      各動画は個別の学習テーマに分けられており，1テーマ5-10分で解説します。

      必要なスキルを，必要な時に短時間で学習できます。ぜひご活用ください。

      現在収録されているテーマ

      1) プレゼンテーションの“技法” 基礎編

      2) レポート作成の“技法” 基本編

      関連教材

      図書館情報入門

      1) 論文の入手

      2) 図書の入手

      3) 図書館の便利なサービス'
