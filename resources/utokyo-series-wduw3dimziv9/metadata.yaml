  ja: 工学倫理
description:
  ja: 東京大学工学部で行われている工学倫理講演会と、各学科の講義の一部をもとに構成された教材である。科学・技術倫理や企業倫理に関わる経験を持つ人や、それらを専門とする人の話を集め、工学倫理と安全教育、倫理教育の補完を扱う。
quotedDescription:
  text:
    ja: 東京大学工学部では各学科での分野に特徴的な工学倫理・安全教育と共に、各学科での倫理教育を補完することを目的に毎年夏学期に「工学倫理講演会」を開催しています。講演会では科学・技術倫理あるいは企業倫理に深く関わったご経験をお持ちの方や、それらをご専門とされる方々を御招きしてお話していただいています。UTokyo
      OCWでは、「工学倫理講演会」および各学科の講義の中から、特に一般性が高いあるいは広く聞いていただきたいと考えたものの内の幾つかを集めて、一つの仮想的な講義として構成しました。
