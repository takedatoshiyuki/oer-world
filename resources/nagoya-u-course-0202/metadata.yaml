  ja: 医療事故対応と医療安全管理
description:
  ja: 医療事故への対応と医療安全の管理を扱う教材である。医療をめぐる安全・安心の実現に関する課題や、医療従事者の教育・配置、医療事故の扱いを論じる内容になっている。
quotedDescription:
  text:
    ja: 「医療は危機に瀕している」と言えば、大げさかもしれないが、すでに一部では現実の問題となっている。目指すのは「安全・安心の医療」であることに異論はないが、それには医療費の増加、さらに多くの人材の育成・投入なしには実現できない。人材については、総数で不足しているのは明がだが、医師を始めとする医療従事者の専門教育や適正配置にも問題を残している。また、約10年前までは、医療事故は隠されていたと言っても過言
