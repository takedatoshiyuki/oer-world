name:
  ja: オープンコースウェア･セミナー アート＆テクノロジーが導く未来（2012）
description:
  ja: 2012年に制作・上映された作品を取り上げ、LEDスクリーン向けの映像作品や、京都の禅と神道を題材にした作品、「音の生け花」を紹介する。あわせて、アートとテクノロジーの関係から未来について考える。
quotedDescription:
  text:
    ja: '2012年韓国の麗水海洋万博委員会から依頼されて250m×30mのLEDスクリーンに上映した作品、京都の禅と神道を題材にした「日本的霊性」、芸術と自然科学が融合された作品「音の生け花」を紹介して頂くとともに、アート＆テクノロジーが導く未来について考えます。

      講師紹介：土佐尚子教授

      カルチュラルコンピューティングという概念を生み出し、日本の伝統、文化を元にデジタル技術を活用した作品を制作しておられます。作品はニューヨーク近代美術館、国立国際美術館などにおいて収蔵、展示されています。'
