description:
  ja: この講義は、漸化式のような離散的な方程式を自然現象の記述にどう用いるかを扱う。あわせて、離散力学系の数学的な役割や性質を取り上げ、他の数学分野との関係を説明する。
quotedDescription:
  text:
    ja: '漸化式のような離散的な方程式は昔からよく自然現象の記述に使われていますが、微分方程式と比べて、離散系の解析に必要な数学は未だにそれほど理解されていません。「離散力学系」と呼ばれているものの数学的な役割と不思議な性質を紹介しながら、数学の他の分野との深い関係を説明します。

      03:18　 この講座について

      04:32　 講義

      ★高校生と大学生のための金曜特別講座 

      ★あなたのシェアが、ほかの誰か…'
