quotedDescription:
  text:
    ja: 'Course Description

      Kyoto University School of Public Health (KUSPH) invites you to the special short course on “Introduction
      of Health Services Course (Elements from LSHTM Health Service Masters of Public Health Module)”
      by Dr. Esther Kwong, Honorary Clinical Assistant Professor, London School of Hygiene & Tropical
      Medicine.

       

      Course aims and learning outcomes:

      Public health is as much concerned with the provision and performance of health services as it is
      with the activities to promote health and prevent disease. This course is for all who are interested
      in a systematic way to understand Health Services. It is indeed relevant for all who participate
      in health services activities from public health preventions through to tertiary care, all those
      who work in it and thus contribute to its delivery, or those who study it in research, as well as
      policy makers who want to improve it. This course aims to help us appreciate why several perspectives
      are required to understand health services. You will learn important concepts to gain a good understanding
      of health services, delivered through a combination of perspectives and systematic approaches. It
      provides an initial look into the complexities of health services and helps you understand the structure,
      activities and quality of health services. This complex perspective is fundamental to undertaking
      approaches to improve services either as a clinician, researcher, manager, planner, commissioner
      or policy-maker.

       

      About Dr. Esther Kwong:

      Dr. Esther Kwong is a medical doctor specialising in Public Health Medicine in the UK, she currently
      practices in London in government departments and health-care organisations. She has previously
      worked in NHS hospitals, Department of Health, NHS England, with roles in both local and national
      government. She has an academic and research interest in improving the quality of healthcare and
      the effectiveness of delivering health services. Her doctorate at the London School of Hygiene and
      Tropical Medicine (LSHTM) was in the use of Patient Reported Outcomes (PROMs) to evaluate the quality
      of emergency hospital care. Esther is currently an Honorary Clinical Assistant Professor at LSHTM
      and is involved in teaching on the MSc Public Health programme; she is also on the board of assessors
      and examiners for LSHTM MSc Public Health Distance Learning MSc programme with the University of
      London.

      https://www.lshtm.ac.uk/aboutus/people/kwong.esther'
