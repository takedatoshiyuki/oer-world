name:
  ja: 基礎セミナー民法の世界で遊ぶ
description:
  ja: 少人数グループで役割を交替しながら進める民法の講義である。BBSやメールを使った事前の意見交換と相談を通じて、授業での主張の準備を行う内容になっている。公開教材には、プレゼン資料や事件名を付した講義ノートが含まれる。
quotedDescription:
  text:
    ja: 受講生は少人数ののグループに分かれ、原告役・被告役・裁判官役を交替で務めます。自分の役割を果たすために、事前に BBS などを利用してグループ内で意見交換をし、また、メールで先生に作戦の相談をし、授業でどのような主張を展開するのかを準備します。みんなで助け合って情報を収集し説得のしかたを考えるうちに、参加者全員が自然に発表・司会・ディベートの能力を身につけ、議論を楽しめるようになります。
  source: https://ocw.nagoya-u.jp/courses/0023-%E5%9F%BA%E7%A4%8E%E3%82%BB%E3%83%9F%E3%83%8A%E3%83%BC%E6%B0%91%E6%B3%95%E3%81%AE%E4%B8%96%E7%95%8C%E3%81%A7%E9%81%8A%E3%81%B6-2003/
