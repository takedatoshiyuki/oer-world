  ja: 東京大学マテリアル工学科の模擬講義として、都市鉱山を手がかりに材料と資源の話題を扱う。自動車や携帯電話を例に、身近な製品に含まれる未利用の金属片をどう再利用するかという研究内容を紹介する。
quotedDescription:
  text:
    ja: "技術発展の基盤となるマテリアル（原料、材料）を扱うマテリアル工学科。模擬授業では身近にある都市鉱山の存在に触れ、活用されずに眠っている小さな金属片を効率的に再利用し資源を無駄にしない社会を創るための研究を紹介します。\
      \ \n \n  模擬講義「都市鉱山の有効活用で実現する資源大国ニッポン」（マテリアル工学科） \n  00:12 自己紹介 \n  07:26 都市鉱山って何だろう？：自動車・携帯電話から考える\
