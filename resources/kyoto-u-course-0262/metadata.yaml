description:
  ja: 京都大学のアフリカユニットを背景に、複数分野の専門家がアフリカ研究の最新の話題を取り上げる講座である。アフリカを学ぶ立場から、現在どのような行動や関わり方が考えられるかを参加者とともに検討する。
quotedDescription:
  text:
    ja: '概要

      京都大学では2017年にアフリカ学際研究拠点推進ユニット（アフリカユニット）を立ち上げ、分野を超えてアフリカに関わる研究をつなぐ取り組みをおこなっています。今回のシリーズでは、アフリカユニットから、さまざまな分野でアフリカ研究を展開している５人の専門家に最新の話題を提供してもらいます。アフリカを学ぶ私たちにとって、いま何ができるのか、みなさんと一緒に考えてみたいと思います。'
