name:
  ja: 北海道大学公開講座 現代社会と倫理 「リスクの社会倫理」（2009）
description:
  ja: 社会的弱者にリスクが偏る仕組みを、社会的不平等と知識・情報格差の両面から扱う講義である。あわせて、権利を守りつつ弱者へのしわよせを避けるにはどのような民主主義が必要かを論じる。
quotedDescription:
  text:
    ja: 便益の分配は必ずしも公平になされているわけではなく、環境リスクを始めとしたさまざまなリスクも、社会的弱者に課せられる傾向がある。それは社会的不平等に由来するものであるが、専門家や行政の持つ知識や情報と市民のもつ知識や情報との格差にも由来する。様々な権利を保護し、弱者へのしわよせを回避する必要があるが、そのためにはどのような民主主義が適切かを講じる。
