name:
  ja: International Human Rights Law 国際人権法
description:
  ja: 国際人権保護の法的側面を扱い、国際人権法規範の分析、国内と国際での実施、国連や地域機関の人権保障制度を取り上げる。とくに、個人による申立制度に重点を置いている。動画はコースの一部を公開した部分収録である。
quotedDescription:
  text:
    ja: 'Being offered as an advanced course in the International Law category, this course focuses on
      the legal aspect of international human rights protection. Topics will include: the analysis of
      international human rights norms, domestic and international implementation of international human
      rights law, the UN”s and regional organizations” human rights protection systems with a particular
      emphasis on the complaint-filing system by individuals

      国際人権法の国内的実施、国際人権法の国際的実施、人権条約の報告制度と個人通報制度、国連の人権活動、人権の地域的保障など、人権保障の法的側面について考究する。

      ※Video is partial recording of Course.

      ※この動画はコースの一部を公開しています。'
