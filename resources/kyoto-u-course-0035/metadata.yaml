name:
  ja: マクロ経済学 1
description:
  ja: 京都大学経済学部の2010年度開講講義で、国民経済計算から乗数モデル、IS-LMモデル、開放経済、マンデル・フレミングモデルまでを扱う。公開されている教材には、利子率や割引現在価値、期待と消費・投資、期待とIS-LMモデルに関する回も含まれる。出典文では、学部中級レベルのマクロ経済学の前半部分にあたるとしている。
quotedDescription:
  text:
    ja: '授業の特色

      この講義は学部中級レベルのマクロ経済学の前半部分にあたる。標準的な理論を用いて現実のマクロ経済を分析する力を身につけることを目指す。

      授業の紹介

      学部中級レベルのマクロ経済学のトピックスのうち、国民経済計算、乗数モデル、IS-LMモデル、マンデル・フレミングモデル、消費のライフサイクルモデル、投資のQ理論などについてカバーする。'
