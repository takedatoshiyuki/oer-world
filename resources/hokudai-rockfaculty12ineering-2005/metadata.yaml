name:
  ja: 大学院教育 Rock Engineering（2005）
description:
  ja: 岩石工学を学ぶ大学院講義で、岩石の時間依存変形や、条件の違いが変形・破壊に及ぼす影響を扱う。続いて、岩盤の特性や初期応力、その計測法を取り上げ、最後に斜面安定と地下空洞への応用へとつなげる。
quotedDescription:
  text:
    ja: This course aims to obtain deeper knowledge on rock engineering. Time-dependent deformation of
      rock including creep and fatigue and effects of various conditions on rock deformation and failure
      are described first. And then characteristics of rock mass，concept of initial stress and its measurement
      will also be covered. Finally，applications to slope stability and underground opening will be described.
