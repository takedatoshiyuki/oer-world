description:
  ja: 火山の分布とそれを左右する地学的背景、噴火の様式や規模の指標、さらに噴火に伴うさまざまな災害を扱う導入教材である。火山現象の基本事項から、噴火がもたらす自然現象・災害までを一通り整理する内容である。
quotedDescription:
  text:
    ja: "導入：火山噴火の仕組みと火山災害\n \n「導入：火山噴火の仕組みと火山災害」の教材は全てCC BY-NCのライセンスで公開しています。\n \n本教材の内容は以下の通りです。\n \n\
      1. 火山の分布と地学的な背景\n    火山とは。世界及び日本の活火山分布と、分布の偏りをもたらすテクトニクスの復習\n \n2. 火山噴火の様式と規模\n    多様な火山噴火様式とマグマ組成についての復習。噴火規模の指標の例\n\
      \ \n3. 火山噴火がもたらす多様な災害\n    火山噴火がもたらす多様な自然現象・災害の紹介\n \n \n「解説：火山噴火の仕組みと火山災害」の教材はこちらから視聴可能です。"
