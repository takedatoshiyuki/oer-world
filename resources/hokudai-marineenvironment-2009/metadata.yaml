name:
  ja: 北海道大学プロフェッサー・ビジット 海鳥の目から海洋環境を見る（2009）
description:
  ja: 海洋、海鳥、地球環境変化の関係を取り上げ、海鳥を手がかりに海洋生態系を考える講義である。海鳥の行動や食性にも触れながら、地球環境変化が海鳥に及ぼす影響を紹介する。
quotedDescription:
  text:
    ja: '地球表面積の３分の２を占める海洋は、気候変化や人間活動の影響を強く受け、また重要な食料を供給してくれます。海鳥は海洋を広く飛び回り、またクジラやアザラシ以上に深く潜って、プランクトンから大形のイカまで多種多様な海洋生物を食べます。地球環境変化が海洋生態系の重要な高次捕食者である海鳥にどのような影響を与えるのかを紹介することで、海洋をよりよく理解していただくのが目的です。

      場所： 札幌大谷高等学校

      日時： 2009年11月7日'
