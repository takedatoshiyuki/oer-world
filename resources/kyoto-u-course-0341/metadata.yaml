name:
  ja: 2013年度 京都大学新任教員教育セミナー
description:
  ja: 京都大学の教育改善やFD、学生の学習実態、教養・共通教育、教育の国際化、ICTを用いた教育支援など、新任教員が知っておくべき学内の教育関連事項を扱う。あわせて、教育サポートリソースの案内と、教員自身の授業実践を扱う講義が含まれる。開会挨拶と複数のミニ講義で構成される。
quotedDescription:
  text:
    ja: '1 開会挨拶：松本 紘（京都大学総長）

      セッション１　ミニ講義１：｢京都大学のFD・教育改善｣

      2 FD研究検討委員会委員長　宮川 恒

      セッション２　ミニ講義２：「京大生の学習の実態」

      3 高等教育開発推進センター准教授　溝上 慎一

      ミニ講義３：「京大の教育的取組」

      4 「教養・共通教育」

      国際高等教育院教育院長　北野 正雄

      5 「京大の教育の国際化戦略」

      国際交流推進機構長　森 純一

      6 「ICT利用による教育支援」

      高等教育研究開発推進センター教授　飯吉 透

      7 「京都大学の教育サポートリソース」

