description:
  ja: 幌延深地層研究センターの深度350m調査坑道を、360°VRで閲覧する教材である。東周回坑道、岩盤、試験坑道、地下水の各コンテンツを通して、地下の調査環境を扱う。関連するオープン教材への案内も付いている。
quotedDescription:
  text:
    ja: '本教材では、幌延深地層研究センター「深度350m調査坑道」の様子を 360°VR 教材でご覧いただけます。

      ※ 360° 動画を視聴するには、パソコン用の Chrome、Opera、Firefox、MS Edge の最新バージョンが必要です。

      【公開VRコンテンツ一覧】

      ・東周回坑道

      ・岩盤

      ・試験坑道（人工バリア性能確認試験）

      ・地下水

      【関連オープン教材】

      ・藤田先生『放射性廃棄物処分工学　深地層の研究施設での研究開発』

      ・谷口先生『高レベル放射性廃棄物地層処分における炭素鋼オーバーパックの腐食挙動』「原位置試験での腐食関連試験・今後の研究展開 (5/5)」'
