name:
  ja: 'Multilateral Financial Institutions: Rules and Practice'
description:
  ja: 多国間金融機関が国際開発とルール形成の中で果たす役割を扱い、ブレトンウッズ機関や国連専門機関、地域開発銀行まで視野に入れて学ぶ。あわせて、IFIsのルールと実務がどのように形成され、現場で適用されるかを考える。さらに、実務家の話を通じて、IFIsでのキャリア形成と国際公務員制度の特徴にも触れる。
quotedDescription:
  text:
    ja: 'This course focuses on the nature, roles and operations of multilateral financial

      institutions (more commonly known as international financial institutions (IFIs)) in

      the architecture of international development and rule-making. A variety of such

      IFIs are examined, including Bretton Woods institutions, other global financial

      organizations and specialized agencies of the United Nations, and major regional

      development banks.

      Students, through this course, are expected to achieve a conceptual foundation of

      understanding the rules and practice of the IFIs, and practical apprehension of how

      such rules and practice are developed and applied in reality. Students will also be

      encouraged to consider practical solutions to factors that can impede the effective

      and efficient delivery of the development mandate of the IFIs.

      This course also offers an opportunity for students to learn from experienced

      practitioners how to start and develop a career in IFIs and the key characteristics

      of international civil service system.'
  source: https://ch.u-tokyo.ac.jp/series/?id=SdaBAdPpZJpt
