name:
  ja: Introduction to Western Art 西洋美術概論
description:
  ja: 西洋美術を対象に、形態、空間、色彩、構図、象徴性といった観点から作品を分析する講義である。絵画、彫刻、建築、工芸を含む美術理論に加え、主題や内容の解釈、図像学の概説も扱う。
quotedDescription:
  text:
    ja: 'A survey of western art, dealing primarily with stylistic analysis and evaluation of major and
      minor arts in terms of form, space, color, composition, problems of symbolism, etc. A brief survey
      of iconography is included.

      西洋美術の基礎的知識の習得。絵画、彫刻、建築、工芸等の美術理論を解説し、作品の主題、内容の解釈、形態、色彩、空間構成等の様式分析、作品の総合的評価を学ぶ。

      Contents of Lectures

      9

      Lectures /

      1

      Video

      プロローグ「ヴァザーリを訪ねて」

      1. ジョットの何が革新的だったか?──パドヴァのスクロヴェーニ家礼拝堂壁画

      2. 学者たちの饗宴──ラファエッロ《アテネの学堂》

      3. 「欺瞞」の青──ピーテル・ブリューゲル《ネーデルラントの諺》

      4. 「傷」の意味するもの──カラヴァッジョ《トマスの不信》

      5. 日常生活の中の寓意──フェルメール《絵画芸術》

      6. 女性画家たち──エリザベート=ルイーズ・ヴィジェ=ルブラン《自画像》

      7. 絵画の革命──マネ《草上の昼食》

      8. タイトルは絵画を説明しうるか？──マグリット《光の帝国》

      Jan 25

      9. 黒を着る'
