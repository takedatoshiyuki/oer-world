name:
  ja: 基礎細胞学3
description:
  ja: 細胞という基本単位の中で、生命分子がどのように働くかを扱う講義である。物質の取り込みやエネルギー産生、細胞運動と輸送、接着、成長・分裂、刺激応答といった細胞固有の活動を、主に真核生物の知見を通して学ぶ。公開教材としては「細胞周期とその制御因子の発見」がある。
quotedDescription:
  text:
    ja: 生物の生命活動の基本単位である細胞について学ぶ。細胞という空間の中で、遺伝学及び生化学で学ぶ種々の生命分子が、どのようにして細胞固有の活動 (物質の取り込み、エネルギー産生、細胞運動と輸送、接着、成長・分裂、刺激応答等)
      を営んでいくのかといった基礎概念を、主に真核生物の知見を通して理解することがねらいである。これらの内容は基礎細胞学Ⅰ、Ⅱを通して学ぶものであるので、学生諸君は全てを履修すること。
