name:
  ja: 生涯学習とスポーツ／LIFELONG EDUCATION & SPORTS
description:
  ja: この教材は、生涯学習の題材としてスポーツを取り上げ、その諸相と課題を事例とともに扱う。スポーツを通じて生涯学習を考えるための講義資料である。
quotedDescription:
  text:
    ja: 人類の基本的能力であり、生きる力の源でもある「考える」「作る」「遊ぶ」の中で、遊ぶ力は人類の文化を生み出してきた原動力である。人類の偉大な遊び文化であるスポーツは、生涯楽しむことができ、身体的にも、精神的にも、社会的にも豊かで良好な人生を築く強力な機能をもっている。スポーツは、生涯学習に欠くことのできないカリキュラムであり、古代から人と人を結びつけ、コミュニティーを形成していくコミュニケーション・ツールでもある。この授業では、生涯学習題材としてのスポーツの諸相と課題を実際の事例を紹介しながら明らかにしていく。
