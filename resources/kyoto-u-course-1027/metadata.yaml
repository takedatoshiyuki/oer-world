name:
  ja: アフリカ地域研究資料センター2020年度 公開講座 第5回「生物多様性はどのように保全されるのか？」
description:
  ja: 京都大学アフリカ地域研究資料センターが、カメルーン東部州の森林地域で進めるSATREPSプロジェクトに関連した研究を紹介する公開講座である。扱うのは、在来知と生態学的手法を組み合わせた森林資源マネジメントと、その研究に関わるテーマである。
quotedDescription:
  text:
    ja: '概要

      京都大学アフリカ地域研究資料センターは、2018年4月から2023年7月までの５年間あまり、JST-JICAによる地球規模課題対応国際科学技術協力（SATREPS）プログラムの枠組みのもとで、カメルーン東部州の森林地域にて「在来知と生態学的手法の統合による革新的な森林資源マネジメントの共創」プロジェクト（https://sites.google.com/view/projet-comeca/）を実施しています。2020年度公開講座では、このプロジェクトにかかわる研究を紹介します。

      （https://www.africa.kyoto-u.ac.jp/archives/9138）'
