name:
  ja: 北海道大学情報基盤センター共同研究公開講演会 参加型地域活性化におけるウェブコンテンツ構築の研究 （2011）
description:
  ja: 本教材は、参加型地域活性化を支えるウェブコンテンツの構築をテーマにする。日本と韓国の事例を比較し、韓国の「地域まるごとミュージアム」を参照しながら、日本での可能性とWeb情報としてのコンテンツ提供のありかたを検討する。スライド資料として公開されている。
quotedDescription:
  text:
    ja: 日本では、広い意味でのアートにおける参加型地域活性化の成功事例が十分であるとは言えず、Ｗｅｂ情報として参加型地域活性化を支えるデジタルコンテンツの作成も蓄積が少ない。その問題解決の手掛かりを探ることが本研究の目的である。研究方法は、韓国における「地域まるごとミュージアム」の事例研究を参照軸として、日本や韓国で展開されている事例を比較し、日本における参加型地域活性化に関する可能性を検討した。そしてＷｅｂ情報としてそれを支えるコンテンツ提供のありかたを検証した。
