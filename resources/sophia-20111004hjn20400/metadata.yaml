description:
  ja: 文字の誕生から紙や印刷といった複製技術、さらに通信や交通手段の発展までを手がかりに、ジャーナリズムの発展をたどる講義である。20世紀のジャーナリズムを対象として、こうした技術や社会的条件がジャーナリズムの形をどう規定するかを扱う。
