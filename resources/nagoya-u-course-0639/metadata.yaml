name:
  ja: 生体の機能II
description:
  ja: 生体の植物機能を中心に、呼吸、循環、消化吸収、排泄、生殖、内分泌系、自律神経系の働きを分子・細胞レベルから個体レベルまで扱う講義である。公開教材としては、恒常性と体液を扱う講義ノートが1件ある。
quotedDescription:
  text:
    ja: '生体の機能は、個体の新生、発達、維持のための機能（植物機能）と、外界の変化の受容、外界への働きかけ、そして高次の精神活動などの機能（動物機能）とに分けられる。

      生体の機能 II の講義では主に植物機能について学ぶ。すなわち、ガス交換を行う呼吸機能、物質と熱の運搬に関与する循環機能、エネルギー摂取を行う消化吸収機能、老廃物の排泄機能、新個体発生のための生殖機能、これらを調節する内分泌系および自律神経系の機能を、分子・細胞レベルから、さらに組織・臓器・個体レベルにおいて包括的に理解することを目標とする。

      この正常の生体機能を理解することで、異常状態としての疾患を扱う臨床医学を学ぶ基礎を身につける。'
