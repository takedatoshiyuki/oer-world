name:
  ja: 北海道大学公開講座 私たちの未来とリスク 健康とリスク ―健康の社会的規定要因―（2012）
description:
  ja: 'この講義は、健康や疾病を個人の問題にとどめず、社会的条件との関係から考える。競争やストレス、経済格差、教育格差が健康にどう結びつくかを、具体例を通して扱う。

    あわせて、現代社会におけるリスク認識が、疾病や個人のリスク行動を考えるうえで重要であることを示す。'
quotedDescription:
  text:
    ja: '健康や疾病は個人に現れますが、その原因や結果あるいは影響は個人的課題ではなく、むしろ社会的な課題です。健康は人生の全過程における多様な社会的な諸条件によって規定されています。競争・ストレス社会では自殺が増え、血圧は上昇します。現代ではむしろ貧しい人々に肥満者は多く、経済格差が教育格差を通して健康格差に連動しています。現代社会のリスク認識は、疾病や個々人のリスク行動を認識する上で重要です。

      河口　明人

      1974年北海道大学文学部卒業、1984年旭川医科大学医学部卒業、都立豊島病院、国立循環器病センター、および同研究所を経て2003年北海道大学・大学院教育学研究科（現研究院）教授、健康科学担当。専門は、循環器内科学。動脈硬化症を焦点とした生活習慣病予防、健康増進の視点から、札幌ライフスタイルスタディなどの地域住民を対象とした臨床疫学研究を実施。'
