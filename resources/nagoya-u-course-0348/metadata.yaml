name:
  ja: あたらしい学校建築
description:
  ja: 名大建築3年生が附属学校の校舎のあり方を考えて提案する設計課題をもとに、学校建築の変化を扱う講義ノートである。戦後の標準化された学校建築と、1970年代以降に現れた新しい学校建築の動きを取り上げ、学校を学びと生活の場として見直す視点を示す。
quotedDescription:
  text:
    ja: 昨年度から附属学校の校舎のあり方を考え、提案する設計課題を名大建築 3 年生の設計演習の中で取り組んでいます。日本の学校建築は戦後、標準化された校舎建築を全国一律に適用する方法で建設されてきました。皆さんが勉強し、生活した学校は、通った学校は違えども、おそらく同じような校舎だと思います。しかし、学校建築のあり方を考え直す機運は
      1970 年代からあり、全体の数からすればまだまだ少ないですが、新しい学びの場、そして生活の場としての学校建築が生まれています。建築家ルイス・カーンは「学校は木の下のひとりの男とともに始まりました。自分が教師であることを知らない一人の男が、自分たちが学生であることを知らないわずかの人たちと自らの自覚について話していました。・・・」と語っています。普段見慣れた学校建築を忘れて、学びの場について一緒に考えたいと思います。
  source: https://ocw.nagoya-u.jp/courses/0348-%E3%81%82%E3%81%9F%E3%82%89%E3%81%97%E3%81%84%E5%AD%A6%E6%A0%A1%E5%BB%BA%E7%AF%89%E2%80%94%E5%90%8D%E5%A4%A7%E5%BB%BA%E7%AF%89%EF%BC%93%E5%B9%B4%E7%94%9F%E3%81%8C%E8%80%83%E3%81%88%E3%82%8B%E9%99%84%E5%B1%9E%E5%AD%A6%E6%A0%A1%E3%81%AE%E6%A0%A1%E8%88%8E-2011/
