description:
  ja: 捕鯨をめぐる国際的な争点を、国際法の観点から検討する講義である。鯨の保護と海洋生物資源の持続可能な利用という二つの論点を通じて、多元的な国際社会における環境保護の問題を扱う。
quotedDescription:
  text:
    ja: 捕鯨をめぐり、日本は欧米諸国や環境保護団体から批判されています。この問題を、国際法の観点から考えてみよう。鯨の保護か、海洋生物資源の持続可能な利用か－多元的な国際社会での「環境保護」を巡る複雑な現実が見えてきます。
