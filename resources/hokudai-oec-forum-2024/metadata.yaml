name:
  ja: OECフォーラム2024「オープンエデュケーションセンターの10年と未来の学び」
description:
  ja: 北海道大学オープンエデュケーションセンター（OEC）の10周年を記念して開かれたフォーラムで、OECの活動事例紹介を含む構成になっている。会場参加とZoomウェビナーの両方で実施され、基調講演とパネルディスカッションも行われた。
quotedDescription:
  text:
    ja: "北海道大学大学院教育推進機構オープンエデュケーションセンター（OEC）は、オープン教育資源（Open Educational Resource：OER）を中心とした教材開発、ICT（情報通信技術）を活用した授業支援ならびに教育システムの提供、またこれらを総合した研究開発を行っています。\n\
      2024年度のフォーラムはOECが10周年を迎えたことを記念し、北大OECフォーラム2024「オープンエデュケーションセンターの10年と未来の学び」と題して、対面およびZoomウェビナーにおいて開催しました。\n\
      \ \n【開催概要】\n開催日時：2024年9月12日（木） 13：00 ～ 17：30\n対面会場：北海道大学 高等教育推進機構 S講義棟 S5\nオンライン会場：Zoomウェビナー\n主催：北海道大学大学院教育推進機構オープンエデュケーションセンター\n\
      共催：北海道大学大学院教育推進機構高等教育研修センター\nフォーラム開催報告\n \n【プログラム】\n開会挨拶\nフォーラム趣旨説明\n基調講演（アーカイブ配信なし）\nOECの活動事例紹介\n\
      パネルディスカッション（アーカイブ配信なし）\n閉会挨拶"
