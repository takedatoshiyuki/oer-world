  text:
    ja: レアアースは日本のハイテク産業を支える最も重要な資源ですが、中国一国によって生産が独占されている状況にあります。なぜ中国が独占しているのかを含め、本講座では現状打破のために『日本の執るべき資源戦略』についてお話しします。タヒチ、ハワイ、さらに南鳥島周辺海域など、太平洋の深海底で発見された“レアアース泥”の開発を基軸に、“夢の泥”と言われるレアアース泥の詳細や南鳥島周辺海域の探査や開発に向けての最新の…
