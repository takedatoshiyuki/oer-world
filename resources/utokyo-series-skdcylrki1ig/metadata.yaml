  ja: レアアースをめぐる中国の独占状況と、日本が取るべき資源戦略を扱う講座である。太平洋の深海底で見つかったレアアース泥を中心に、タヒチ、ハワイ、南鳥島周辺海域での探査や開発にも触れる。
