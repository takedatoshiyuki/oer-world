name:
  ja: レジャー・スポーツ・レクリエーション論／THEORIES OF LEISURE, SPORTS & REC
description:
  ja: レジャー、スポーツ、レクリエーションの定義、歴史、機能を扱う講義である。講義ではこれらに関する諸問題を取り上げ、グループディスカッションを通してその在り方を考える。
quotedDescription:
  text:
    ja: 上智大生は年207日、1年の約54％が自由に使える日であり、平均的な日本人も週休2日と人生80年時代の到来により生涯の約3分の1、平均生涯労働時間の約3倍がレジャー（自由時間）となり、レジャー活動としてのスポーツやレクリエーションは、人生において重要な意味を持つようになってきている。レジャーの使い方によっては、個人の身体的・精神的・社会的健康のみならず国の経済にも重大な影響が生じてくる。この授業では、レジャー・スポーツ・レクリエーションの定義・歴史・機能などについて講義し、その諸問題についてグループディスカッションを行いながらその理想的な在り方を考えていく。
