name:
  ja: 全学教育 思索と言語 論理学A（2001）
description:
  ja: この講義は、命題論理を中心に、前提から結論が論理的に導けるかを判定するための基礎を扱う。論理式や各種結合詞、真理表、推論規則に加え、証明可能性や決定手続き、健全性定理と完全性定理までを扱う。
quotedDescription:
  text:
    ja: '【講義目標】

      前提から結論が論理的に正しく導かれているか否か、文論理（命題論理）の範囲で、判定できるようになること。

      【スケジュール】

      1. 初等言語　論理式

      2. 選言　連言　否定　含意　論理的同値

      3. 日常言語との比較

      4. 真理表　恒真文

      5. 論理的公理　推論規則

      6. 証明可能性と決定手続き

      7. 論理学の応用

      8. 健全性定理　完全性定理'
