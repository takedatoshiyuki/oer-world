name:
  ja: シミュレーション物理
description:
  ja: 物理現象のシミュレーションの意義と手法を扱い、最初にFortran 90/2003を学ぶ構成になっている。続いて、プログラム作成を通して、いくつかの物理現象を実際にシミュレーションする。
quotedDescription:
  text:
    ja: 物理学は理論物理、実験物理の両輪からなっていた。ところがここ、50年ほどで計算機が急速に発展し、理論でも実験でもない第3の物理学、計算物理が発展しつつある。本講義では実際に物理現象のシミュレーションの意義とテクニックを学ぶ。併せて物理現象の理解を深める。
      講義はまず，シミュレーションを行う上で最も強力であるfortran 90/2003を学ぶことからはじめる。次に実際にプログラムを組むことを通して，物理学現象のシミュレーションを数々の例に対して実際に行う。
