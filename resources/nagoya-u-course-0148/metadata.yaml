  ja: 農業生産の現場や、それを支える行政・流通・研究の現場を訪れて体験する内容である。東海農政局、JAあいち経済連、愛知県農業総合試験場などを実習先とし、講義や実習で学んだことが農業生産にどう結びつくかを考える。
