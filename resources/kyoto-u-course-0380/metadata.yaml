name:
  ja: 世界に舞う－日本人プリマバレリーナ飛翔の軌跡－
description:
  ja: 日本人プリマバレリーナの歩みを軸に、バレエを始めたきっかけやロザンヌ国際コンクール、海外での経験を取り上げる。あわせて、移籍や日本との違い、舞台に向けた準備、評価への対応、日本のバレエ環境や今後の展望、東日本大震災後のチャリティ公演までを扱う。
quotedDescription:
  text:
    ja: '経営管理大学院

      建設マネジメント勉強会

       

      【各シーンとキーワード】

      1 紹介

      2 バレエ、きっかけ、ロザンヌ国際コンクール、海外

      3 出会い、移籍、日本との違い、モチベーション、失敗

      4 芸術、パフォーマンス、心構え、取り組み、準備

      5 日本のバレエ環境、今後、グローバル化、若者、メッセージ

      6 評価、批評、対応、パートナー、変化

      7 東日本大震災、チャリティ公演、経緯、今後'
