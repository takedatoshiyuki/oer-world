name:
  ja: 力学-I
description:
  ja: 力学の基礎を扱う講義で、ニュートンの運動の法則から始まり、ベクトル、速度、加速度、単位系、放物運動、円運動などの運動の記述を学ぶ。さらに、保存力とポテンシャル、万有引力、振動、波動、慣性力と回転座標系までを講義ノートで順に扱う。
quotedDescription:
  text:
    ja: 自然科学の基礎学問である力学を、身近な現象の力学的解明を通じて学ぶことを指針とする。物理学科進学を希望する学生および専門を学ぶ上で力学が重要となる学生を対象とする。それのみならず、科学を学ぶ学生には必要な基礎である。この「力学
      I 」および後期に開講される「力学 II 」と合わせて、ニュートン力学の基礎についてのまとまった内容を講義する。
  source: https://ocw.nagoya-u.jp/courses/0008-%E5%8A%9B%E5%AD%A6-I-2003/
