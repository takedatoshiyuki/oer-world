  ja: 20世紀に発達したマス・コミュニケーション型メディア・システムを題材に、その社会の成り立ちと研究史を前半でたどる。後半では、インターネットやケータイの普及を背景とするメディア社会の現状と未来を、ワークショップやディスカッションを交えて考察する。
quotedDescription:
  text:
    ja: 20世紀を通して発達したマス・コミュニケーション型メディア・システムは、インターネットやケータイなどの普及によって新たなかたちへと変化を迫られている。本講義では、前半でマス・コミュニケーション型社会の生成過程と研究の系譜を振り返り、後半では、今後のメディア社会の現状と未来をワークショップやディスカッションといったアクティヴ・ラーニングの手法を交えながら、批判的、実践的に考察していきたい。
