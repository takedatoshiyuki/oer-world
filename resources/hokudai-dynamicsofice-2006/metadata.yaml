name:
  ja: 大学院教育 Dynamics of ice sheets and glaciers (2006)
description:
  ja: 氷床と氷河を地球の気候システムの一部として位置づけ、その力学と熱力学を連続体力学のバランス方程式を基礎に扱う講義である。氷床に付随する氷棚も対象に含み、講義資料が公開されている。
quotedDescription:
  text:
    ja: Ice sheets and glaciers are an active，dynamic part of the Earth's climate system on time-scales
      of decades and more. More than 90% of the terrestrial freshwater reserves are stored in these ice
      masses. Their complete disintegration would lead to a global sea-level rise of approximately 70
      meters and would have severe impacts on the atmospheric and oceanic circulation. Against the background
      of future global climate warming due to ongoing emissions of greenhouse gases，understanding the
      behaviour of these ice bodies is of great relevance. In this lecture，based on the general framework
      of continuum-mechanical balance equations，the dynamics and thermodynamics of ice sheets (including
      attached ice shelves) and glaciers will be treated.
