name:
  ja: スキルアップセミナー第2回 論文・レポートを書く前に（2012）
description:
  ja: 論文やレポートを書き始める前に、アカデミックな文章を書く際の考え方と注意点を扱う。講義外の学習支援として実施されるスキルアップセミナーの第2回で、学部学生を主な対象とした連携ゼミに位置づけられている。
quotedDescription:
  text:
    ja: '第２回目は、「論文・レポートを書く前に」と題して、アカデミックな文章を書く上での考え方や注意点について、セミナーを開催しました。これから卒論、修論を始める人にオススメです。

      アカデミック・サポートセンター（ASC）は、講義外での学習サポートやセミナーを開催し、学生の主体的な学習活動を支援しています。学習支援の一環として、学部学生を主な対象とした、ASCと図書館の連携ゼミ「スキルアップセミナー」を開催しています。'
