name:
  ja: 進化生態情報学（2003年度講義）
description:
  ja: 生命システムにおける進化の基本概念を導入し、適応や選択淘汰、自己複製を扱う講義である。さらに、文化や都市、知識体系のような非生命システムに現れる進化現象も取り上げ、生命と非生命の違いを考える。あわせて、人間の生物学的側面と文化的側面の関係を、遺伝子とミームの対立という観点から検討する。
quotedDescription:
  text:
    ja: '生命という情報システムの振る舞いは、他のシステムを調べるときにいろいろな点で参考になることが多い。とくに、環境に適応するメカニズムとプロセス（＝進化）は、生命以外のシステムにも共通する点が多く、複雑系を理解するための基本概念である。

      この講義では、まず、生命システムの進化について、適応、選択淘汰、自己複製などの基本概念を解説する。次に、人間の文化や都市システム、知識システム、 ミッキーマウス、フォークなど、生命以外のシステムにみられる進化現象について考察する。さて、こうなると、生命体と非生命体は、どこがどうちがうのだろ
      うか？

      また、人間そのものの進化過程をまとめながら、人間の生物としての側面と文化的な側面の関係について、両者の葛藤（遺伝子とミームの対立？）という視点か ら論じる。これはたとえば、「新興宗教の教義に殉じて自殺した人間は幸せなのか？」といった問題に、進化論的な立場から回答を試みるということである。'
