name:
  ja: Political Purpose and National Identity:Representations of the Food Education Campaign in Japan
description:
  ja: 日本の食教育キャンペーン「shokuiku」を、オンラインコンテンツや公共広告といったメディア表象の質的分析から検討する講義である。食の問題を手がかりに、国家的・地域的アイデンティティがどのように表現されるかを扱う。
quotedDescription:
  text:
    ja: Unbalanced eating habits including leaving home without breakfast and consuming fatty food and
      ready-made meals have become a matter of serious concern in Japan. Weight problems, such as obesity
      but also skinniness, diabetes, coronary heart diseases, and high blood pressure are among prevalent
      lifestyle-related diseases supposedly caused by unbalanced nutritional habits. In 2005, the Japanese
      government initiated a nationwide food education campaign, termed shokuiku in order to counterbalance
      this trend and advocate a return to supposedly healthier Japanese staple foods such as rice and
      miso. This campaign also encourages the consumption of regional food products. Based on a qualitative
      analysis of media representations of the shokuiku campaign such as online content and public advertisements,
      this presentation argues that a state campaign has developed into a political campaign, which uses
      pressing health concerns to address national and regional identities expressed through food.
