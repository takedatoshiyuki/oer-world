name:
  ja: 第3回上智大学全国高校生英語弁論大会ジョン・ニッセル杯
description:
  ja: 高校生が英語で自分の考えを発表する弁論大会を扱う。上智大学外国語学部英語学科が主催し、2011年に創設された大会として、2013年の本選までの流れと開催の様子を示す。
quotedDescription:
  text:
    ja: "創立１００周年記念事業の一環として2011年に創設されたこの弁論大会は、外国語学部英語学科が主催し、高校生が自分の考えを英語で発表することを通じて英語能力向上の一助となること目的としています。英語学科で長年教鞭をとった故ジョン・ニッセル教授にちなんで「ジョン・ニッセル杯」と名づけられました。\
      \ \n 今回は、全国から118人の応募があり、一次審査を通過した21人が四谷キャンパスで行われた本選に臨みました。優秀な弁論が多く、審査員による順位決定のための審議に予定より時間がかかりました。\
      \ \n 「本当に甲乙つけがたい弁論大会でした。素晴らしい内容でしたし、英語も上手い。毎年レベルが上がってきて、今年ほど審査に苦労した年はなかったです」と、審査委員長を務めた吉田研作言語教育研究センター教授は大会を振り返りました。"
  source: https://ocw.cc.sophia.ac.jp/lecture/20131130lecture/
