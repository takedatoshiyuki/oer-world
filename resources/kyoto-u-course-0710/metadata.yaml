name:
  ja: 資源生物科学概論 B
description:
  ja: 資源植物と資源動物の生産・利用に関わる基礎を扱う講義で、関連分野を横断して概説する内容になっている。公開教材には、海洋生物資源や農業生産、病害虫、雑草、シロアリなどを扱う回の資料が含まれる。植物生理学から動物遺伝育種学、生物資源情報学まで、複数の研究分野を対象にしている。
quotedDescription:
  text:
    ja: '授業の特色

      資源植物および動物の生産および利用技術の基礎として、それらに関連した授業を行う。

      授業の紹介

      資源植物および資源動物に関連の深い研究分野の連携により、植物生理学、栽培植物起源学、植物遺伝学、作物学、育種学、果樹園芸学、蔬菜花卉園芸学、品質設計開発学、品質評価学、栽培システム学、植物生産管理学、動物遺伝育種学、生殖生物学、動物栄養科学、生体機構学、畜産資源学、生物資源情報学を概説する。'
  source: https://ocw.kyoto-u.ac.jp/course/710/
