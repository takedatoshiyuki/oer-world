name:
  ja: 防災研究所第32回公開講座「激甚化し頻発する災害に備える」
description:
  ja: 近年の気候変動の影響などで、災害が激甚化し頻発する状況を扱う公開講座である。そうした状況を前提に、災害に対してどのように備え、対処するかを論じる。
quotedDescription:
  text:
    ja: '自然災害が多い日本ですが、近年、気候変動の影響などもあり、災害が激甚化するとともに頻発するようになっており、これまでの災害対策や心構えでは通用しなくなってきています。このような状況を踏まえて、激甚化し頻発する災害に対して、どう備え対処すべきかについてお話させていただきます。

