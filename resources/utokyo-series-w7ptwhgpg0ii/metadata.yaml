    ja: 本学の環境安全衛生活動については、『東京大学の教職員の環境安全衛生管理規程』に基づき、部局の総括を担う環境安全管理室と大学法人の当該業務を総括する環境安全本部との連携・協力体制のもとで行われています。また、当該業務の適正・適切な実施にあたっては、その実務の十分な理解が肝要となるため、主に環境安全衛生管理担当の構成員を対象とした説明会を実施いたしました。
