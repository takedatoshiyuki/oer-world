  ja: 東京大学の環境安全衛生活動を扱い、環境安全管理室と環境安全本部の連携・協力体制に基づく運営について説明する。あわせて、環境安全衛生管理担当の構成員を主な対象として、当該業務を進めるための実務面を扱う。
