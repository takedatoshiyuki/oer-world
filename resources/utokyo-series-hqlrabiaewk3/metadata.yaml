name:
  ja: ビジョンとミッション－海事・海洋、エネルギー・環境、構造基準－（湯原哲夫最終講義）
description:
  ja: 構造健全性と安全評価学を軸に、環境・エネルギーの技術開発と政策、次世代の造船・海洋産業の構想、技術経営学を扱う。東京大学工学部・工学系研究科で2006年に開講され、日本語で提供される。
quotedDescription:
  text:
    ja: '【研究概要】

      構造健全性、安全評価学

      環境・エネルギーの技術開発と政策

      次世代造船・海洋産業の構想研究

      技術経営学（研究開発のマネージメント）

      【教授略歴】

      1944年　生まれ

      1970年　東京大学大学院　工学系研究科　修了

      1971年　三菱重工株式会社　技術本部（技術管理部）

      1971年　同上　長崎研究所　強度研究室　研究員

      1975年　動燃事業団　高速増殖炉開発本部

      原型炉準備室プロジェクトエンジニア

      1980年　三菱重工 技術本部 長崎研究所 主任

      1982年　工学博士取得（東京大学）

      1986年　同 長崎研究所 主務

      1991年　スタンフォード大学 経営大学院　エグゼクティブ・プログラム 留学

      1992年　三菱重工 技術本部 長崎研究所 強度研究室 室長

      1995年　同 長崎研究所 次長・船舶海洋部門長

      1997年　同 横浜研究所 所長

      2000年　長菱エンジニアリング 参与　三菱重工 技術本部顧問

      2002年　東京大学大学院　工学系研究科　教授

      2007年　定年退官

      東京大学サステイナビリティ学連携研究機構 特任研究員

      2008年　大学院工学系研究科特任教授就任

      海洋技術フォーラム代表幹事

      日本機械学会発電用設備規格委員会委員長

      （NPO）日中環境エネルギーシステム促進機構 代表

      米国機械学会規格基準理事会理事（Board of Director）など'
