name:
  ja: 少人数セミナー「eラーニング入門」
description:
  ja: eラーニングの基本的な知識から具体例、技術面、教材作成の方法までを扱う。受講者として授業を受ける視点に加え、教員や教材作成者の立場も取り上げる。あわせて、情報通信技術を活用した今後の学習環境を考える。
quotedDescription:
  text:
    ja: '現在、コンピュータとネットワークを利用した教育、 いわゆるeラーニングが多くの大学で導されつつあり、 九州大学でもｅラーニングシステムを活用した授業が実践されています。

      本セミナーでは、eラーニングに関する一般的な知識、具体的事例、技術的知識、教材作成手法等を学ぶことを通して、

      eラーニングを利用した授業を学生として受講するだけでなく 教員や教材作成者の立場を経験するとともに、 これからの情報通信技術を活用した学習環境について考えていきます。'
