name:
  ja: 全学教育 聞く力・話す力のトレーニング（2011）
description:
  ja: 大学生活で必要となる聞くこと、話すこと、討論することを中心に、口頭コミュニケーションの技術を段階的に扱う講義である。講義や演習、打ち合わせ、会議などの場面を背景に、言葉と身体を使って他者と関わる力を育てる内容になっている。
quotedDescription:
  text:
    ja: '教室での講義や演習、課外活動の打ち合わせ、アルバイト先での会議……大学生活は聞いたり話したりの連続です。話を聞いたり、人前で話したり、グループで討論したりといった口頭でのコミュニケーションが効果的にできるかどうかが、大学生活の充実度を左右すると言っても過言ではありません。

      あなたは人の話を本当にきちんと聞けていますか。あなたの話は相手にうまく伝わっているでしょうか。

      この授業では、大学生にふさわしい口頭コミュニケーションの技術を、いくつかの要素に分けて順を追ってトレーニングします。それによって、自信を持って聞いたり話したりできる力を身につけ、言葉と身体を駆使して他者と積極的にかかわる能力を高めます。'
