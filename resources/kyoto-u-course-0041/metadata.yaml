name:
  ja: 第29回 京都大学品川セミナー「研究用原子炉と中性子科学－中性子の生成と利用について－」
description:
  ja: この講義は、研究用原子炉と加速器を基盤にした中性子の生成と利用を扱う。加速器駆動システム(ADS)の研究開発の状況を述べるとともに、生成された中性子を用いた物質科学研究として、原子配列や運動、析出、揺らぎ、中性子イメージングを取り上げる。
quotedDescription:
  text:
    ja: '京都大学原子炉実験所では研究用原子炉を中心に種々の研究が進められていますが、安全・安心・信頼を目指して、将来型の新しい中性子源や原子力システムとして、臨界とはならない核燃料集合体と加速器を組み合わせた加速器駆動システム（ADS）という装置の研究が世界に先駆けて行われています。その開発に向けた基礎的・先進的な研究の状況を紹介したいと思っています。

      また、その研究用原子炉や加速器で生成された中性子を使って基礎・応用研究が展開されています。前回の品川セミナーではその例としてホウ素中性子捕捉療法(BNCT)という癌治療の研究について紹介しましたので、続いて今回は中性子の物質科学への利用、すなわち原子配列や運動の観察、析出や原子集団の揺らぎの観察、さらにマクロ的な中性子イメージングなどの研究の一端を紹介いたします。'
