name:
  ja: 全学教育 科学・技術の世界 数論の歴史（2005）
description:
  ja: 古代の数論から出発し、フェルマーの最終定理に関わる問いがどのように生まれ、どのような解決の प्रयासが重ねられたかを歴史の流れに沿って扱う講義である。公開教材は講義スライド15件で構成され、高校数学
    I・IIA・IIB を前提としている。
quotedDescription:
  text:
    ja: '1630 年、フランスの法律家 Pierre de Fermat は本の欄外に次のような内容の書き込みを残した.

      「3 以上の整数に対して、不定方程式 x^n + y^n = z^n は整数解を持たない. このことの驚くべき証明を私は見つけたが、これを記すには余白が小さすぎる...」

      この命題の正否はなんと約 370 年後、1995 年になるまで決着がつかなかった. 授業ではこのような問題が産まれる背景を古代の数論から掘りおこし、問題解決のためにどのような努力が払われたかを歴史を追って見ることにする.
      必要な予備知識としては高校数学 I、IIA、IIB で十分である.'
