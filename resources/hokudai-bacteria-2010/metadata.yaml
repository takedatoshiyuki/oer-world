name:
  ja: ひらめき☆ときめきサイエンス ようこそ不思議な細菌の世界へ！（2010）
description:
  ja: 身の回りや体内に存在する細菌を取り上げ、どのような場所にいるのかを扱う講義である。病気を起こす細菌は一部であることにも触れ、細菌を観察し、増やしながらその存在を確かめる内容になっている。
quotedDescription:
  text:
    ja: 皆さんは身の周りに沢山の細菌が存在していることを知っていますか。口、皮膚、腸管等、体には沢山の細菌が住みついています。また校庭の土や流しの周りや、こうやって吸い込む空気にも細菌が存在しているのです。"病気になっちゃう!!"と思って口を塞いだあなた。大丈夫です。ほとんどの場合、害はありません。病気を起こす細菌はほんの一部です。例え害のある細菌が体に入り込んだとしても体に元から住みついている細菌のおかげで容易には病気にはなりません。さて、身の周りに沢山いる細菌は様々な環境でどのように生きているのでしょうか。
      一緒にその細菌を見て、ふやして、そして感じてみましょう!
