name:
  ja: 全学教育 社会体験ワークショップ（2023）
description:
  ja: 北海道を代表するゲスト企業等との対談を通じて、実社会の課題や展望を扱う授業である。公開教材では、各企業等の取組やゲスト講師のこれまでのキャリア、学んだことを中心に取り上げ、講演動画と講義資料を閲覧できる。北大生とのディスカッション部分は公開範囲に含まれない。
quotedDescription:
  text:
    ja: '2022年度に引き続き、北海道を代表するゲスト企業等7社との対談形式で実社会の課題や展望についてディスカッションを行う「社会体験ワークショップ」を開講しました。

      >> 2022年度の取組はこちら

      オープンコースウェアでの公開内容は、講演動画6社（北大生とのディスカッションを除く）、講義資料6社と授業の一部ですが、各企業等の取組やゲスト講師の体験談（これまでのキャリアや学んだこと）を中心に、道内企業等の魅力を実感できる内容です。

      ぜひご覧ください！'
