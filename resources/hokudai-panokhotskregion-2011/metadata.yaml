name:
  ja: サステナビリティ・ウィーク 第2回アムール・オホーツクコンソーシアム国際会合 （2011）
description:
  ja: 本講義は、オホーツク海とアムール川流域をめぐる環境問題を対象に、多国間の学術ネットワークであるアムール・オホーツクコンソーシアムの第二回国際会議として行われる。日本、ロシア、中国、モンゴルに関わる越境環境を扱い、市民と学生も交えて保全と継承のあり方を学際的に議論する。
quotedDescription:
  text:
    ja: 世界でも最高位の生物生産性と生物多様性に恵まれた海、オホーツク海は、近年の地球温暖化やアムール川流域の急速な開発によって、大きく影響を受けようとしています。この問題を未然に防ぐべく、オホーツク海を領有する日本とロシアはもちろん、アムール川を通じてオホーツク海に影響を与える中国とモンゴルを加えた多国間学術ネットワーク"アムール・オホーツクコンソーシアム"が2009年11月に設立されました。本企画は、この組織の第二回目の国際会議です。市民と学生にも参加してもらい、越境環境という地域の共有財産をいかにして保全し、未来世代へと引き継ぐかを学際的な立場から議論することを目的としています。
  source: https://ocw.hokudai.ac.jp/lecture/panokhotskregion-2011
