name:
  ja: 春秋講義『「山」は「森」－「森・里・海のつながり」の物語り』
description:
  ja: 日本での「山」と「森」の関係を手がかりに、森が川を介して里や海へつながる流れを扱う。あわせて、そのつながりの中で人びとの暮らしがどのように成り立つかを考える内容である。
quotedDescription:
  text:
    ja: 日本で山と言えば、森のこと。山持ちさんとは、ものすごい力持ちではなく、森林所有者のこと。「あとは野となれ山となれ」とは、原っぱが盛り上がって山になるのではなく、放っておけば野原や森になること。山は森です。森は川を通じて里、そして海につながり、そのつながりの中で人びとは暮らしています。このつながりは、何かを物語っているのだろうと思います。そのお話しを聞いてみませんか。もちろん、全部ではないのですが。
  source: https://ocw.kyoto-u.ac.jp/course/805/
