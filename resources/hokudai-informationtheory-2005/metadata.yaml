  ja: 学部専門教育 情報理論（2005）
description:
  ja: 情報理論の出発点となる情報量の定義から、エントロピーや相互情報量までを扱う講義である。通信技術だけでなく、パターン認識、人工知能、統計物理、遺伝情報学に共通する概念にも触れる。理論の基礎を直感的に理解することに重点を置く。
quotedDescription:
  text:
    ja: 情報理論は、情報の量を定義することから始まり、それを元にした理論を展開する。ここで学ぶ事柄、特に、エントロピーや相互情報量は、現在の通信技術の根幹を成すのみならず、パターン認識や、人工知能、あるいは統計物理、遺伝情報学などの多くの異なる分野において共有される重要な概念である。本講義ではこの理論の基礎を直感的に理解することに重点を置く。
  source: https://ocw.hokudai.ac.jp/lecture/informationtheory-2005
