name:
  ja: 'S2: Culture, Gender and Health Ｓ２：文化、ジェンダー、健康'
description:
  ja: 文化、ジェンダー、健康の相互関連を学際的に扱い、文化的な観念や価値観が健康に与える影響を考察する。主要トピックとしてHIV-AIDSを取り上げ、これに関する考え方、患者の現状、今後を扱う。公開されているのはコースの一部である。
quotedDescription:
  text:
    ja: 'This course’s purpose is to examine from a multidiciplinary perspective the interrelations between
      culture, gender and health. In particular it will examine the ways in which cultural ideas and values
      can have a profound impact on an individual’s health. Special attention will be given to HIV-AIDS
      in the comtemporary world, ideas regarding it cause, the situation of those ill with it and the
      future of the epidemic.

      本コースの目的は、文化とジェンダーと健康の相互関連を学際的視点から考察することにある。特に、各文化に固有の観念や価値観が個人の健康に及ぼす影響の大きさについて見る。主要トピックのひとつとして、現代世界におけるHIV-AIDS、これにまつわる様々な考え、患者の現状、この病気の今後について考察する。

      ※Video is partial recording of Course.

      ※この動画はコースの一部を公開しています。'
