name:
  ja: 全学教育 北大生のための音楽講座 1350分の理論と実践【初級】（2012）
description:
  ja: 西洋音楽の記譜法を手がかりに、楽譜に現れる情報と実際の音を結びつけながら、音高・拍子・音階・和音などの基本事項を学ぶ。さらに、それらの知識を用いて簡単な曲を創作し、聴き取りや読譜、用語理解、分析を通して音楽理論を扱う。
quotedDescription:
  text:
    ja: "授業の目標\nこの授業では、「音を表す視覚的記号」としての「記譜法」(西洋音楽の音符の書き方)に焦点を当て、楽譜からの情報と実際の音の情報とを関連させながら、音楽を構成する音高・音程・音長・拍・拍子・音階(旋法・音列)・和音と\
      \ いった基礎的項目について解説する。また、それらの知識を応用しながら簡単な曲を創作する。これらを通して、「音楽理論」が単に「五線譜がすでに読めて楽器の演奏ができる一部の人がさらに上の専門性を目ざすために必要なもの」\
      \ ではなく、「時間の経過とともに消えていってしまう音楽の実体をつかみたいと願うすべての人に有益なもの」であることを体験する\n \t到達目標\n1. 音楽の構成要素である音高・音程・音長・拍・拍子・音階(旋法・音列)・和音の基礎的な内容について、「音符を見てわかる」「聴いててわかる」ようになる。(ミニクイズ/ミニ課題・期末試験)\n\
      2. 特定の音楽の特徴を、各構成要素の観点から分析し、適切な表現で理解できるようになる。(ミニクイズ/ミニ課題・期末試験)\n3. 自分が「何が分かって何が分からないのか」「何ができて何ができないのか」ということに対し自己認識し、分からないことやできないことに関し、教員に質問したりアドバイスを求めたりすることができるようになる。(学習に関する自己評価・授業での質疑や活動参加の様子)\n\
      \ \t教科書・参考書など\n教科書:土田京子(2005)『改訂版・説き語り楽典講座』ヤマハミュージックメディア出版(1,600 円+税)その他必需品:五線紙または音楽ノート(線と線の間が狭すぎない方がよい。自分でも作れるだろう。)\
      \ 授業で使用する資料・ワークシートはその都度配布する。\n \t授業についての注意事項\n・但し、この授業では、音楽理論の意義を理解してもらうため、実際の音楽表現活動を行なってもらう。したがって、「講義」とはいえ、「学生参加型」授業である。\n\
      ・1単位は45時間の学修を必要とする(『学生便覧平成22年度入学者用』p.9)。この授業は2単位なので、1 学期 90 時間の学修が必要(授業が 1.5 時間 x 15 回 = 22.5 時間、授業外\
      \ 67.5 時間)。\n \t授業計画\n・「授業計画」についての変更の際は、授業の中でその都度知らせる。\n \t評価方法:\n到達目標1~3が達成できたかどうかを下記の方法で「絶対評価」する。但し、成績に極端な偏りがある場合には、各評価項目の%を変更する等、成績分布を考慮しつつ評価することもあり得る。\n\
      ・授業参加度(20%):各授業の最後に「学習に関する自己評価」を行い、その記入状況をもって「授業 参加度」とする。\n・ミニクイズ/ミニ課題(20%):授業でカバーした内容の理解を確認するため、簡単な「聴き取り」「読\
      \ 譜」「用語の理解」「創作」を、ほぼ毎回行う。授業内に行う場合と、宿題として行う場合がある。\n・期末試験(60%):ミニクイズ/ミニ課題と同様の問題と、それらの応用問題を課す。\n・その他(+α):授業中に行う学生参加型活動やミニ課題に特に積極的に参加したと思われる場合にボーナス点を与える。\n\
      ・上記評価項目すべてを総合して、90%以上を「秀」、80-89%を「優」、70-79%を「良」、60-69%を「可」、59%以下を「不可」とする。\n \tその他\n・授業を欠席する(した)場合には、配布資料や授業での連絡事項などの有無について、その週のうちにTA\
      \ と教員に連絡して確認すること。\n・授業内容について質問などがある場合は、授業直後に教員に聞くか、オフィスアワー(木曜日5時限目)に文学部 E 棟 E401 室へ来るか、あらためて教員に直接アポイントメントを取ること。"
