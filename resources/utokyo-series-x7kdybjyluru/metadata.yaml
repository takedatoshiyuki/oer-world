name:
  ja: 光の科学−未来を照らす究極の技術とアイデア（学術俯瞰講義）
description:
  ja: 光の性質を手がかりに、量子論や相対論の成立からレーザーの発明、光通信や照明までを幅広く扱う講義である。観察、物質制御、情報伝送といった場面で光が果たす役割を取り上げ、最先端の光科学を複数の観点から紹介する。
quotedDescription:
  text:
    ja: 'コーディネータ：五神　真

      ナビゲータ：鳥井寿夫

      光は生命のみなもとであり、人類の文化と文明も光と深くかかわって発展してきた。人類はその黎明期から光を介して自然を見つめ、宇宙の星々からミクロの世界まで様々なスケールの事象を観察し、自然の仕組みを解き明かしてきた。光の正体はそもそも何なのか、という問いかけは、現代物理学の礎である量子論と相対論を生みだした。そして、２０世紀後半のレーザーの発明を契機として、光技術が最先端の科学を牽引するとともに、社会基盤を支える技術を担っている。今や、「目」としての光の技術は、１京分の１秒の出来事を捉えたり、我々の脳内の活動を外から観察したりできるまでに進歩しつつある。光は物質を操る究極の「手」としても活躍し、エネルギーを集中して星の内部に匹敵する高温高密度の状態を作ったり、逆に物質を極低温に冷やして驚くべき精度でその動きを制御したりすることを可能にしている。また、光は情報を運ぶ「足」として、情報ネットワークを支えている。さらに、微弱光のもつ不思議な性質が究極のセキュリティをもつ情報技術を生み出す可能性も見えてきている。一方この新しい光の技術は、我々の生活の中に深く入り込んできている。照明としての光の技術は、新しい視覚体験を創造し、特別な空間を演出して心を豊かにする芸術となっている。この講義では、このように万能選手として様々な場面で活躍する光のサイエンスの最先端の姿を、いろいろな切り口から紹介していく。'
