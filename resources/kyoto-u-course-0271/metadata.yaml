name:
  ja: 第7回 MACSコロキウム「～鉱物に耳をあてがう、地球と宇宙が聞こえる～「はやぶさ」サンプルから聞こえてきたこと、「はやぶさ２」サンプルへの期待」
description:
  ja: 鉱物の分析を通じて、地球や惑星の成り立ちと履歴を考える講義である。「はやぶさ」が小惑星イトカワから採取したサンプルの解析結果を手がかりに、鉱物から読み取れる内容を扱う。「はやぶさ２」サンプルについても言及する。
quotedDescription:
  text:
    ja: '概要

      鉱物は地球や惑星を作る基本的な構成単位で、宇宙にも広く存在しています。鉱物を調べることにより、これらがどのようにして生成され、どのような履歴を経たかがわかります。演者は、「はやぶさ」探査機が小惑星イトカワから採取したサ
      ンプルの分析をおこなってきました。「はやぶさ」サンプル中の鉱物を例として、どのようなことがわかるかについて述べたいと思います。また、2020年に地球帰還が予定されている「はやぶさ２」サンプルについても大いに語りたいと思います。'
