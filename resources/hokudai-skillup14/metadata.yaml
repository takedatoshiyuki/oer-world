name:
  ja: オンラインコミュニケーションのかくし味（研究者のためのスキルアップセミナー 14）
description:
  ja: オンライン授業やイベントで使うテクニックを、実例を交えて扱う講義である。オンラインでの講演や、学会・イベントの企画に関わる場面を想定し、オンライン教育に関する回とオンラインコミュニケーションの実践編、質疑応答で構成される。
quotedDescription:
  text:
    ja: 'オープンエデュケーションとサイエンスコミュニケーションの専門家が、オンライン授業やイベントで 使えるテクニックについて、実例を交えて紹介しました。オンラインで講演する際、学会・イベントを
      企画する際にぜひ、お役立てください。

      ■ プログラム

      開催挨拶：

      吉見宏（北海道大学 理事・副学長）

      セミナー1：

      OEC のお～い知ってる？オンライン教育【特別編】

      重田勝介（北海道大学 高等教育推進機構 オープンエデュケーションセンター）

      セミナー2：

      よりうまく ?! オンラインコミュニケーションの仕込み方【実践編】

      古澤輝由（立教大学 理学部 共通教育推進室〈SCOLA〉）

      質疑応答：

      ファシリテーター

      川本真奈美（北海道大学 創成研究機構）

      主 催：大学力強化推進本部、広報室

      共 催：高等教育推進機構 オープンエデュケーションセンター、URA ステーション

      北海道大学 創成研究機構 CRIS

      研究者のためのスキルアップセミナー'
