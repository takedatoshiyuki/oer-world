name:
  ja: Clinician-at-the-crossroads
description:
  ja: この講義は、医療者が扱う問題と、体や心の問題だけでは捉えきれない医療のあり方をテーマにする。診療の流れを体験しながら、患者と医療者の間に生じる問題への対応を考える構成になっている。
quotedDescription:
  text:
    ja: '私たち医療者は、様々な問題を抱える人々がそれを解決するための手伝いを日々行っています。そして、私たちが扱う問題は、人々の体や心に関係するものがほとんどです。しかし、体と心の問題がなければ、人々は健康であるといえるでしょうか？実は、医療というのは人々の問題の一部を扱うだけで目前の問題を解決するだけでは本当の解決にむすびつかない事が頻繁にあるのです。

      今回は、まず私たちが日常に行っている診療の一連の流れを皆さんにも体験していただきたいと思います。その上で、患者と医療者の間に生じる問題に、どのように対応して行けばよいかを、一緒に考えていきましょう。'
