description:
  ja: 国連人権高等弁務官事務所の対話シリーズに連なるウェビナーで、人権を促進する経済の重要性をめぐって議論する。環境の持続可能性、ジェンダー平等、企業の説明責任、地方の主体といった論点を扱い、10月回ではミャンマーにおける企業の人権尊重を日本の経験から考える。
quotedDescription:
  text:
    ja: '国連人権高等弁務官事務所（OHCHR）のThe Hernan Santa Cruz Dialogues シリーズでは、学者、経済学者、政治家、市民社会のメンバーが集まり、環境の持続可能性、ジェンダー平等、企業の説明責任、地方の主体などのテーマに触れながら、人権を促進する経済の重要性について対話します。

      10月の本ウェビナーのテーマは「ミャンマーにおけるビジネスの人権尊重の促進：日本からの教訓」です。ミャンマーにおけるビジネスの人権尊重…'
