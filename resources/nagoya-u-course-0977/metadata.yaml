quotedDescription:
  text:
    ja: 'この講義では、労働市場に関する指標や統計に理解を深め、関連する理論を習得し現実のデータに応用する。特に、数理モデルに適切 な数値を与えて数量分析を行うことを通じてデータの推移を理解し、国際比較を通じて日本や世界の労働市場の特徴を明らかにすることを目的とする。

      伝統的需要供給分析を応用した労働市場分析を数式と数値計算を用いて遂行できる。

      労働市場に関する主要な統計について定義や計測方法を理解し、自ら利用できる。

      労働力フローについてデータを用いて解説でき、対応する数理モデルの骨子を説明できる。

      日本や世界の所得格差についてテデータに基づいて論じ、その理論仮説について説明できる。

      初歩的なプログラミングを通じて数理モデルを解析できる。'
