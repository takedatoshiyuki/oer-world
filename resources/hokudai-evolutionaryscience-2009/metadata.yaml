name:
  ja: 三省堂サイエンスカフェin札幌 第2回 進化から見た病気 ～「ダーウィン医学」のすすめ～（2009）
description:
  ja: 進化論に基づいて、病気の起こり方や治り方、薬の効き方を考える内容である。風邪の症状を防御反応としてとらえたり、腰痛を二足歩行の代償として見たりしながら、生命38億年のスケールで病気を見直す「ダーウィン医学」を紹介する。楢木佑佳の解説図とともに扱う。
quotedDescription:
  text:
    ja: '進化論の考え方に基づいて病気を考えると、ヒトがなぜ病気になるか、なぜ治るのか、なぜ薬が効いたり効かなかったりするのか、なぜヒトの身体は完璧ではないのかなどといった疑問が次々と解けていく。風邪をひいたときの発熱、くしゃみ、鼻水といった諸症状はうっとうしいものであるが、ウィルスから体を守るために進化の過程で獲得した大切な防御反応である。また、腰痛は二足歩行に対する代償と考えられる。

      人の一生というスケールで見る病気とは違った、生命38億年というスケールでヒトの病気を捉えなおそうという「ダーウィン医学」を、サイエンス・デザイナーの楢木佑佳さんの解説図とともにわかりやすく紹介する。

      第2回三省堂サイエンスカフェin札幌

      日時 2009年5月8日

      場所 三省堂書店札幌本店内UCCカフェ'
