name:
  ja: 大学院教育 博物館コミュニケーション特論(2010)
description:
  ja: 北海道大学総合博物館の使命や代表的な博物館活動を扱い、そこから問題点を見出すところまで進める講義である。受講生は教員が示すプロジェクトや自主プロジェクトに小グループで取り組み、授業外活動、研究報告、討論、成果発表を通して学習する。
quotedDescription:
  text:
    ja: '● 北海道大学総合博物館の使命を説明し、いくつかの代表的な博物館活動などを紹介し、問題点を見出する

      ● 問題点を解決するため、プロジェクト案を教員がいくつか提示し、受講生が小グループにわかれてそのプロジェクトに取り組む（授業時間外の活動が求められる）。受講生による自主プロジェクトも議論の上、積極的に採用する

      ● 毎週一つのグループが研究報告を行い、全員で討論する

      ● 最後に、適切な形態で研究成果を発表し、評価する'
