name:
  ja: 先端アートデザイン学
description:
  ja: この講義は、先端アートデザイン分野を軸に、自然環境や感性、人の視座から科学技術を捉え直す内容を扱う。アート・デザインの各分野で活躍する専門家を招き、学生とともにこれからの未来について議論する。
quotedDescription:
  text:
    ja: 複雑化し動的に変化する現代の社会では、科学的・論理的な手段、最適な解を求める手段だけでは解決できない課題が次々に生まれている。多様な人からなる複雑な社会では、より柔軟な多様性ある解を求めることが重要である。本学の先端アートデザイン分野では、自然環境やそこで培われる感性に立ち戻り、人本来の視座から感性を介して科学技術を見直し、持続的なインクルーシブ社会の創造のための日本オリジナルな科学技術・アート・デザインを世界に発信して行くことを目指している。本講義では、アート・デザインの各分野において世界の第一線で活躍するプロフェッショナルをお招きし、これからの未来について学生と共に議論して頂く。
