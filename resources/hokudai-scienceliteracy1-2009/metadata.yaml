name:
  ja: 全学教育 ゼロからはじめる「科学力」養成講座1(2009)
description:
  ja: 自然科学の基本的な考え方から、力・エネルギー・熱・電気磁気・光・原子・量子・化学結合までを順に扱う講義資料を公開する。物理と化学を中心に、自然科学全体を見渡しながら科学リテラシーの基礎を身につける構成である。
quotedDescription:
  text:
    ja: '理系や文系に関係なく、科学リテラシー確立のためのコースであり、科学者になるためのコースではありません。このコースでは、主に物理と化学を学び、力と物質について理解しましょう。

      また社会問題などにあらわれる地球温暖化や放射性廃棄物の問題は、人間の決めた分野で言うと、物理、化学、生物、地球物理にまたがっています。このため、これらの問題を議論するときには総合的な科学的知識が必要となります。そうした総合的な知識を得るためには、統合的なサイエンスのコースが最も適しています。このコースでは自然科学１および自然科学２で自然科学のすべてを概観できるようになっています。またこれにより自然界の構造的理解が明確にできるようになるでしょう。予備とする基本的な知識も必要ありませんので文系でも安心して受講できます。また、理系学生でもサイエンス全般にわたっての理解や、サイエンスとは何かを知っておくことは重要です。このコースでは、サイエンスに対しての知識と、大局的な理解を目指します。

      この授業は、アメリカでその重要性が認識され、現在広く行われている統合的科学授業に基づいています。日本では、このコースが最初の試みとなりますが、世界標準の内容に基づきますので安心して受講してください。

      科学・技術の世界 ゼロからはじめる「科学力」養成講座2（2009年度）'
