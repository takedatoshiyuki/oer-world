name:
  ja: 移民の言語教育と教師の役割－フランス語、日本語教育の現場からの発信－
description:
  ja: 移民が受け入れ社会で生活する際の言語教育を取り上げ、第二言語教育の現場で誰が何を教えるのかという論点を扱う。教師の役割を軸に、フランス語教育と日本語教育の現状から考察する。
quotedDescription:
  text:
    ja: 外国からの移民が受け入れ社会で生活するために言語能力が重要な鍵になると言われますが、移民のための第二言語教育の現場では、誰が何を教えるのか試行錯誤が続いています。今回の研究会では、言語教育における「教師の役割」について、フランス語教育と日本語教育の現状から考えます。
