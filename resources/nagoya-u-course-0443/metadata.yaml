name:
  ja: 国際私法
description:
  ja: この講義は、私人間または私人と国家のあいだに生じる国際的な法律関係を扱い、それらを規律する抵触法を主題とする。公開教材には、外国国家行為の承認、国際裁判管轄、国家管轄権、外国法の適用、身分関係、契約に関する回が含まれる。説明文では、外国法適用制度を中心に基本的知識を提供するとしている。
quotedDescription:
  text:
    ja: '経済のボーダーレス化に従い私人の国際的活動は増加の一途を辿り、それに伴い私人間の(或いは私人と国家間の)国際的法律関係に関する問題も多様化且つ複雑化しつつある。海外での交通事故、国際的な自動車の盗難、独占禁止法や通信法の域外適用また各国法規の抵触、国有化・収用措置や資産凍結措置の国際取引への介入、多国籍企業の複数国での大型倒産、アメリカ懲罰的損害賠償判決の我が国での執行の可否等、そういった問題の例としては枚挙に暇がない。また、このような財産関係事件に限らず、身分関係事件においても、離婚の国際裁判管轄、子供の引渡を命じた外国判決の我が国での執行の可否、国を跨った子供の奪い合い、代理出産に関する親子関係を確認した外国判決の我が国での承認等、国際的紛争事例は夥しい。

      このような複雑な国際的法律関係を規律する法律が抵触法(広義の国際私法)である。本講義では、外国法適用制度を中心に、その基本的知識を提供する。受講者には、教科書・参考書により各テーマについて予習を行うこと、及び、レジュメに挙げられた裁判例や参考文献を出来る限り読むことが期待される。'
