description:
  ja: 芸術専門学群の学生を念頭に、芸術とデータサイエンスの接点や考え方を扱う講義である。コンピューターを使った分析に対する距離感を前提に、データサイエンスが芸術分野とどう関わるかを説明する。
quotedDescription:
  text:
    ja: "芸術専門学群の皆さんにとって、データサイエンスというのは縁遠い、または、できれば避けて通りたかった分野かもしれません。コンピューターを使った分析と聞いただけで距離を取ってしまう事も。\n\
      \ しかし、皆さんは鉛筆と同じくらいスマートフォンを片手に持って、毎日のように小さなコンピューターを使って生活しています。身近な道具のはずですよね。そこで本講義では、芸術専門学群の皆さんにとってのデータサイエンスについて、その接点や考え方について説明します。"
