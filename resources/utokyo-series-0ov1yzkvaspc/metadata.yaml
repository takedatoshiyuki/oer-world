description:
  ja: 和食を主題に、日本の国土や季節性が各地の食文化にどう関わるかを取り上げる。あわせて、和食を語るうえで重要な米と魚について、日本を中心とした研究成果に触れる。
quotedDescription:
  text:
    ja: 平成25年に「和食：日本人の伝統的な食文化」がユネスコの無形文化遺産に登録されました。日本の国土は南北に長く、海と山が近接していることから、季節感に富み、各地に根差した多様な「和食」が形成されてきました。昨今の健康食ブームもあって、「和食」は世界的に注目されています。"Sushi"
      の世界的な評価からも、「和食」を語るうえで外せない食材が米と魚です。この講演では、日本を中心としてなされてきた研究成果などを…
