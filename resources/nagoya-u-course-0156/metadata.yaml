name:
  ja: 教育方法学講義-I-教育方法概論
description:
  ja: 教育方法の基礎となる理論と授業実践事例を、今日の教育上の課題と関わらせながら扱う講義である。公開教材には、教育課題や学習指導要領、教材研究、体験学習、模擬授業、学校を基盤とする研究、授業分析などに関する講義ノートが含まれる。2回は演習形式で、模擬授業の計画と実施を行う。
quotedDescription:
  text:
    ja: 今日の教育上の課題と関わらせながら、教育方法の基礎となる理論や、優れた授業実践事例を学ぶともに、教師に必要とされる授業実践力の基礎を身につける。２回は、演習形式とし、模擬授業を計画・実施する。
