    ja: "東日本大震災の発生以来、数ヶ月ごとに開催してきた本学農学生命科学研究科での被災地支援研究も、今回で15回目を数えました。\n今回は、森林域を中心に、土壌や水田の放射能汚染について、長年の調査から判ってきたことを報告します。\n\
