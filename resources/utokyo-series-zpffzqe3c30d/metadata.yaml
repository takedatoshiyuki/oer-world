  ja: 東日本大震災後に継続してきた研究報告会の第15回として、森林域を中心に土壌や水田の放射能汚染を扱う。長年の調査を通じて判明してきた点を報告し、農学生命科学研究科の復興支援プロジェクトに位置づけられる。
