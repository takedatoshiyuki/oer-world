description:
  ja: 数学の複数分野から選んだ話題を通して、数学の世界を扱う講義である。例として、組み合わせの数学、微積分の歴史、幾何学における代数的手法が挙げられている。扱う内容の詳細はシラバスで示される。
quotedDescription:
  text:
    ja: 'Through topics from various fields of mathematics, students are invited to the world do mathematics.
      Topics depend on the lecturer and are chosen among mathematics of combinatorics, history of calculus,
      algebraic methods in geometry and others. The details will be given in the syllabus.

      多岐にわたる数学の分野の中から選ばれたトピックスを通して数学の世界を理解する。たとえば、組み合わせの数学、微積分の発生の歴史、幾何学の代数的な方法などが、考えられる。詳細は、開講時にシラバスによって明示される。

