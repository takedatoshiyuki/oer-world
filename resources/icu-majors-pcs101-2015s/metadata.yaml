name:
  ja: Peace Studies I 平和研究 I
description:
  ja: 平和研究と平和・安全保障研究の基本的な理論やアプローチを、複数の学問分野の視点から扱う講義である。平和の概念、戦争や暴力的紛争の原因、紛争解決のモデルや事例に加え、国際レベルでの紛争対応や集団安全保障まで取り上げる。講義にはロールプレイ、事例研究、討論、中間試験、最終試験が含まれる。
