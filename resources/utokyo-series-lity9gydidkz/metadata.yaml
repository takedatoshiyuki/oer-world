  ja: 機械学習の手法を定式化から学び、後半でその基礎となるパラメータ推定理論を扱う講義である。教師あり学習、教師なし学習、ベイズ推論、凸最適化を取り上げ、演習では講義で扱ったアルゴリズムの実践を行う。
quotedDescription:
  text:
    ja: '機械学習手法の定式化を前半で学び、それらの基礎となるパラメータ推定理論を後半で扱う。

      演習では講義で扱ったアルゴリズムの実践を行う。

      Ⅰ．教師あり学習

      　　１．最小二乗法

      　　２．過学習と正則化

      　　３．交差検証

      　　４．正則化付き経験リスク最小化

      　　５．カーネル法

      Ⅱ．教師なし学習

      　　１．ハードクラスタリング問題

      　　２．ソフトクラスタリング問題

      　　３．次元削減問題

      Ⅲ．ベイズ推論

      　　１．各問題の確率論的定式化

      　　２．推定理論

      Ⅳ．凸最適化

      　　１．凸関数

      　　２．双対問題

      　　３．最適化法'
