name:
  ja: 「柔らかい材料 ソフトマテリアル」の化学
description:
  ja: ソフトマテリアルに含まれる高分子材料、液晶、界面活性剤、コロイド、タンパク質、多糖類、ゲルなどを題材に、その化学を扱う講義資料である。あわせて、ソフトマテリアルの化学がどのように発展し、社会や身の回りでどのように関わるかを、体験、観察、計算機シミュレーションを通して扱う構成になっている。
quotedDescription:
  text:
    ja: "本イベントは、日本学術振興会の 「ひらめき☆ときめきサイエンス」 のプログラムとして開催されました。\n ソフトマテリアル（柔らかい材料）は、プラスチック・ゴム・繊維などの高分子材料、液晶、石けんなどの界面活性剤、コロイド、タンパク質、多糖類、ゲルなどの有機物質を中心とする柔らかい物資です。硬い金属材料（ハードマテリアル）、セラミックスと対極的な材料です。\n\
      このプログラムでは、ソフトマテリアルの化学とは何か、それがどのように発展し、これからどのように発展する可能性があるか、またそれが私たちの社会、身の回りでどのように活躍しているかを中高生ならびに教師・父兄に体験、観察、計算機シュミレーションを通して伝えることを目的としています。そのために第一線の研究者による視覚に訴えた講義と、若手研究者・大学院生による最新のソフトマテリアルに関するポスターセッションと交流会、実際の材料に手に触れる機会を設けるものです。\n\
      また最先端のソフトマテリアルの化学で用いられる研究施設の見学会では、最新の分析機器を使った観察を実際に体験します。\nそして最後に、若手研究者を交えて質疑応答、フリートークを行います。\nQOCWでは、当日の講義資料を公開します。"
