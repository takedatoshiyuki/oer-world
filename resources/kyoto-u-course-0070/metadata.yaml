name:
  ja: 物理気候学, 2011
description:
  ja: 地球システム内のエネルギーの流れと、そこから生じる気候形成の物理過程を大気科学の視点から扱う講義である。地質学的気候変化や地球の基本データから始まり、大気放射、熱力学、雲・降水形成、大気境界層、気候数値モデルまでを取り上げる。あわせて、大気の変化過程を記述する方程式を導出し、その意味と応用を解説する。
quotedDescription:
  text:
    ja: 地球システム内のエネルギーの流れが気候を形成するが、その様々な形態について気候の記述ではなく大気科学の視点から講述する。具体的には、地質学的気候変化、惑星地球の基本データとその変化、大気放射学の基礎、混合気体の状態方程式、未飽和大気熱力学、飽和大気熱力学、雲・降水形成過程の入門、大気境界層の基礎、気候数値モデル紹介、などである。気候形成物理過程の基礎理解のため、大気の変化過程を記述する方程式を導出してその意味を解説し、実際への応用についても多数の図版を示しながら例示する。
  source: https://ocw.kyoto-u.ac.jp/course/70/
