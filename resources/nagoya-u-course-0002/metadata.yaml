name:
  ja: 民法-II
description:
  ja: この講義は、民法第2編の物権を対象に、物権法の基礎と全体像、物権変動論を順に扱う。後半では担保物権に進み、担保法の問題を詳細に検討する構成になっている。公開教材として、課題と複数回分の講義ノートが付属する。
quotedDescription:
  text:
    ja: '本講義は、民法第２編に規定されている物権を扱うものである。物を所有・支配する、取引により物を流通させる、担保により債権回収の実をあげる等、物権法の規律する法理は経済活動の根幹をなすものであり、古くから学説・判例が緻密な理論を積み重ねてきた。加えて近時は、区分所有法や担保法の改正等、この領域でも社会の複雑化・多様化にあわせ、新たな動きが種々みられる。この講義を通じて、経済秩序の基底にあるものを理解し、取引社会の「いま」を実感し、また法的思考の養成に努めてもらいたい。

      講義はまず、第１部として、物権とは何か、どのような物権があるか等、物権法の基礎、全体像をひととおり概観し、第２部で総論としての物権変動論を検討する。

      講義の後半、第３部として扱う担保物権に関しては、バブル崩壊をも受けて、最近新たな判例が続々と登場しており、大規模な法改正もなされた（2004 年 4 月、2005 年 3 月、2005 年 10
      月と、目白押しである）。金融取引において重要な役割を担っている担保法に今何がおこっているのか、担保法の直面する問題についても、詳細に扱うこととしたい。'
