name:
  ja: 新しい医療が社会に届くまで ～データサイエンスが支える健康社会～（学術俯瞰講義）
description:
  ja: 医療技術が研究を通じて確立され、社会に届くまでの流れを俯瞰する講義である。ゲノム研究や治験、市販後調査、薬剤疫学、医療経済性評価などを取り上げ、そこでのデータ収集・解析・意思決定のあり方を扱う。医学、薬学、生物学、工学、経済学、統計学など複数分野の関わりも示す。
quotedDescription:
  text:
    ja: 'コーディネータ：松山 裕

      ナビゲータ：大庭 幸治

      日々、進歩を続ける医療は、人を対象とした研究の成果を通してその技術が確立し、我々のもとへと届けられています。一言で研究と言っても、ゲノム情報を用いた研究から新薬開発のために実施される治験、更には、市販後の最適な治療法の評価、開発時には検出が困難な副作用に関する薬剤疫学研究、医療経済性の評価など、その種類は非常に多様なものです。そのため、医学のみならず、薬学、生物学、工学、経済学、統計学など様々な学問の専門家が関わって実施されています。一方で、全ての研究で共通していることは、それぞれで必要なデータを計画的に収集し、解析し、データに基づいた意思決定を行っているということです。近年、データサイエンスという新しい科学研究の方法論が注目を集めていますが、医療という分野は比較的古くからデータサイエンスを実践してきたとも言えます。本講義シリーズでは、薬や治療が社会に届くまでの全体像を俯瞰し、実際に研究に関わっている方からの話を伺うことで、健康社会を支える様々な学問の貢献を考えていきます。

      【AMED生物統計家育成支援事業】

      【2019年度SセメスターGLP指定科目　http://www.glp.u-tokyo.ac.jp/gefil/courses/】'
