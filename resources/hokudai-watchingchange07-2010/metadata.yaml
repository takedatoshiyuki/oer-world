name:
  ja: 北海道大学公開講座 「変化」を見つめる－私たちや地域の未来のために－ 第7回北海道の雇用を創る－産業、大学教育、人材育成－ (2010)
description:
  ja: 北海道の雇用創出を手がかりに、産業を育てることと人材を育成することの関係を扱う。あわせて、大学教育が人材育成にどのような役割を果たすかを、諸外国との比較から考える。
quotedDescription:
  text:
    ja: 厳しい雇用環境の中、雇用を創出することが重要な政策課題となり、北海道ではよりその側面が大くなっています。雇用を創出するためには、中長期的な視点で産業を育成していくことが重要ですが、そのためには産業を支える人材の育成が不可欠である。本講義ではこの人材育成に大学教育は役立っているのか、どのような役割を果たしているのか、諸外国と比較しながら考えます。
