name:
  ja: 〈偶然〉という回路（朝日講座「知の調和―世界をみつめる 未来を創る」2017年度講義）
description:
  ja: この講義は、偶然という主題を手がかりに、知の営みと現実の関係を考える。縁、運、宿命、たまたまの遭遇といった人間に身近な事柄を学問的に扱い、そこから見えてくるものを各分野の講師が論じる。
quotedDescription:
  text:
    ja: '私たちは、偶然に取り囲まれ、偶然に振り回されて生きている――少なくともたいがいはそう思って生きています。一方、研究に求められる知性は、偶然性を排し、偶然に見える事柄の奥に隠された必然を見いだすことに求められる、としばしば言われます。では、偶然と知性は、まったく相容れないものなのでしょうか。

      私たちが偶然と名づけているものが、予測不可能に見えるこの世の現実の手触りだとすれば、偶然とはどういうものかと目をこらすことは、知の営みを現実へと新たにつなぎ合わせることになりはしないでしょうか。たとえば、縁や運や宿命、あるいはたまたまの遭遇がもたらす喜怒哀楽といった、いかにも人間くさい事柄に学問的にアプローチしたらどうなるか、などということです。なにかと孤立して見える偶然を、むしろ現実のリアリティへと接近する回路にしたいという思いなのです。

      　本年度の朝日講座では、それぞれの学問分野や実業界を担う先生方から、「偶然とは何か、そこから何か見えてくるか」という観点にもとづいた講義を行っていただきます。'
  source: https://ch.u-tokyo.ac.jp/series/?id=SvXothAMzG2p
