name:
  ja: 「21世紀における健康管理」を考える
description:
  ja: 生活習慣に関する知識を基礎に、学生の自己管理と社会人に必要な健康の考え方を扱う講義である。内容は生活習慣病、心肺蘇生法、感染症、社会保障制度、生命倫理まで広がり、知識を解説しながら議論する構成になっている。
quotedDescription:
  text:
    ja: '本講義の目的は、「栄養、運動、嗜好などの生活習慣に関する知識を与え、学生の自己管理をサポートすること」と、「社会人として必要な健康に関する知識を与えること」である。具体的には、生活習慣（病）、心肺蘇生法、感染症、社会保障制度、生命倫理等に関し、解説し議論をする。

      20 世紀における科学の進歩は、医療を大きく変え、薬の開発、手術の進歩にとどまらず、臓器移植や細胞を使った治療など、半世紀前には夢物語に過ぎなかったことを現実にしつつある。このような生命科学の発見は素晴らしいものであるが、その科学知識の利用は、慎重に行わなければならない。また、このような知識・技術は、（例えば経済的優位性等によって）特定の人のためにのみに利用されるべきものではないと思われる。医療の平等性という観点からは、世界的な規模での人口の増加、貧富の差や健康格差等にも目を向け、社会的なつながりにおいて、健康を考える機会としたい。'
