name:
  ja: 春秋講義「ジュゴン、ウミガメ、オオナマズを追いかける－希少水圏生物の保護と共存」
description:
  ja: 海の生物を直接観察しにくいという前提から、小型の発信機や記録計を用いるバイオロギングという研究手法を扱う講義である。ジュゴン、ウミガメ、メコンオオナマズを対象に、研究に至った背景と、調査で明らかになった生態を紹介する。
quotedDescription:
  text:
    ja: 'Course Description

      海の生物を直接観察することは大変難しいことです。しかし、近年、小型の発信機や記録計による研究が可能となってきました。この研究手法を「バイオロギング」と言います。これは、バイオ（生物）とロギング（記録）を組み合わせた和製英語ですが、今では学術用語として定着しています。講義では、ジュゴン、ウミガメ、メコンオオナマズを研究するに至った背景を説明するとともに、明らかになった彼らの生態を紹介します。'
