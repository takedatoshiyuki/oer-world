name:
  ja: 教養学部創立70周年シンポジウム：学際知の俯瞰力ー東京大学駒場スタイル
description:
  ja: 東京大学教養学部の創立70周年を記念して開かれたシンポジウムで、駒場における研究と教育の意義を多面的に扱う。教養学部にゆかりのある登壇者と教員が参加し、さまざまな立場からその特徴を論じる。
quotedDescription:
  text:
    ja: '1949年に新制東京大学の第1回入学式が安田講堂で挙行されたのと同じ7月7日に、東京大学教養学部の創立70周年記念したシンポジウムが開催されました。シンポジウムでは、東京大学教養学部にご縁が深く現在一線で活躍中の方々、および教養学部の教員が登壇し、駒場における研究・教育の意義と魅力をさまざまな視点から解き明かします。

      ★あなたのシェアが、ほかの誰かの学びに繋がるかもしれません。

      お気に入りの講義・講演があれ…'
