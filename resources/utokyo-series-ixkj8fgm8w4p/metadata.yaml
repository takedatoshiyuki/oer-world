name:
  ja: 量子力学 第2
description:
  ja: 量子力学における対称性の考え方として、軌道角運動量やスピン角運動量、2粒子の交換を扱う。さらに、3次元球対称ポテンシャルの具体例や角運動量の合成、スピン軌道相互作用を踏まえ、摂動論、遷移確率、変分法まで学ぶ。量子力学第Iの続編として位置づけられ、量子力学第IIIへつながる。
quotedDescription:
  text:
    ja: '量子力学における対称性と摂動論を学ぶ。軌道角運動量、スピン角運動量、2粒子の交換などは量子力学において特徴的な対称性の概念であり、摂動論は一般的 な状態に関する理論であり、計算のための具体的な手続きを与える。この講義は量子力学第I（量子力学の基礎、1次元の量子力学）に続くものである。

      まず軌道角運動量について学んだ後、3次元球対称ポテンシャル（3次元井戸型ポテンシャル、水素様原子、3次元調和振動子など）の具体的な問題を考える。 スピン角運動量、スピン軌道相互作用、角運動量の合成についても学ぶ。そのあと、摂動論（時間に依存しない摂動、時間に依存する摂動）、遷移確率、
      および変分法等を学び，具体的に様々な問題を解くための手法を身に付ける。具体的な問題を自身で解いて量子力学を使えることを目標とする。量子力学第 III（散乱、多電子問題、電磁場と電子の相互作用）につながる。'
  source: https://ch.u-tokyo.ac.jp/series/?id=ixKJ8FGM8w4p
