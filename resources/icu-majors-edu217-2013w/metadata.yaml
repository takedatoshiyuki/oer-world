description:
  ja: 日本における道徳教育を、理論面と歴史面の両方から扱う講義である。あわせて、道徳教育の目的、原理、方法を研究対象に含む。公開教材は講義資料1件で、コースの一部を公開した動画も示されている。
quotedDescription:
  text:
    ja: 'Theoretical and historical approach to problems of moral education in Japan today. Includes study
      of its aims, principles and methods of instruction. Required of those seeking junior high school
      teacher certification. Priority for course registration is given to junior and senior students.

      今日の日本における道徳教育の諸問題を理論的，歴史的に考察する。道徳教育の目的，原理，方法の研究を含む。中学校教員免許状取得希望者は必修。第 3，4 年次生対象。

      ※Video is partial recording of Course.

      ※この動画はコースの一部を公開しています。'
