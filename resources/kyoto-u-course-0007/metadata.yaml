  ja: fMRI実験の紹介
description:
  ja: 機能的磁気共鳴画像法（fMRI）の実験方法を、実際のMRI装置と実験環境を用いて扱う動画である。fMRIの原理から実験手順、取得データの解析、実験時の注意点までを一連の実験の中で紹介する。
quotedDescription:
  text:
    ja: 現在、ヒトを対象とした脳機能研究において欠かせないツールとなっている機能的磁気共鳴画像法（functional magnetic resonance imaging; fMRI)の実験方法について、実際のMRI装置や実験環境を用いて紹介した動画になります。fMRIの原理や実際の実験の手順、取得したデータの解析、実験において気を付けるべき事等を、一連の実験の中で紹介しています。
