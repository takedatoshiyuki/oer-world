description:
  ja: 連立一次方程式を中心に、方程式を解くための内容とその理論的背景を扱う講義である。授業では随時レポート課題を出し、復習を促す。1回分の講義内容は準備ノート4ページ程度を目安に進め、質問も随時受け付ける。
quotedDescription:
  text:
    ja: '授業の特色

      連立一次方程式を中心に講述します。方程式が解けるようになることが目標ですが、理論的背景もおろそかにしません。 随時、レポート課題を出し、講義の復習を促します。

       

      授業の紹介

      1回分の講義内容は、私の準備ノートで4ページを目安に進めます。昨年度は少し詰め込みすぎたことを反省して、余裕を持って講義するつもりです。質問は随時受け付けます。(質問には丁寧に答えるつもりです。)
      間違いの訂正も歓迎します。(双方、勘違いのこともありますが、あまり気にしないようにしましょう。) 講義を5〜10分早く終了し、間違い探しをしますので、真面目に聞いてください。(でも、気に入ったところだけ聞いていただいても、かまいません。)'
