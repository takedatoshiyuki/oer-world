description:
  ja: 東日本大震災による健康被害を取り上げ、地震・津波被害と福島第一原子力発電所事故の影響を含めて考えるフォーラムである。東京大学大学院医学系研究科公共健康医学専攻が、これらの課題に公衆衛生としてどう向き合うかを中長期の視点で扱う。
quotedDescription:
  text:
    ja: 東京大学大学院医学系研究科公共健康医学専攻（ＳＰＨ）は4月20日、「東日本大震災の健康被害－－公衆衛生に何ができるか」をテーマに、フォーラムを開催いたしました。地震と津波による大きな被害、その後の福島第一原子力発電所の事故の影響は、これまでに私たちが経験したことのない深刻な事態となっています。本学ＳＰＨとして、さまざまな課題にどう対処していくべきか、中長期的な視点でとらえようというものです。
