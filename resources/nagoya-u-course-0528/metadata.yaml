name:
  ja: 英語-(基礎)
description:
  ja: 英語で段落を書く練習を中心に、準備・執筆・推敲を含む書く過程を扱う教材である。食品を題材にした複数回の活動を通じて、書く内容の整理や段落構成、修正の進め方を学ぶ。公開教材には、アウトライン、コヒーレンス、つなぎ語、典型的な誤りなど、英作文の形式面を扱う資料が含まれる。
quotedDescription:
  text:
    ja: 'Students work on writing well-structured paragraphs and practice a writing process that includes
      preparing, writing, and revising to improve written work. Every week in class students practice
      writing a paragraph very quickly.

      Three of these paragraphs are rewritten and submitted for a grade.

      Students also read extensively outside of class in addition to reading in class.

      Students learn about world cultures by reading and writing about food ways.

      The course is taught entirely in English.

      Students are required to participate actively in class discussions and to write paragraphs in English.

      Grades are based not only on English language ability but also on control of writing forms such
      as proper topic sentences and paragraph structure.'
