name:
  ja: 情報探索入門：図書館とインターネット情報の活用, 2009
description:
  ja: この教材は、図書館情報学と情報探索の基本を扱い、図書館の機能、学問・研究における文献と情報、分類や目録情報、参考資料、インターネット情報やデータベースの活用までを取り上げる。文献・情報収集や卒業論文作成のための調査を念頭に、演習を通じて情報活用技術を学ぶ構成になっている。図書館司書も演習に協力する。
quotedDescription:
  text:
    ja: '授業の特色

      情報探索に必要な基礎を、専門分野の異なる教員によるリレー方式の講義と演習で身につける。演習には図書館司書が協力する。

      授業の紹介

      論文・レポートを書くための文献・情報収集、卒業論文作成のための文献調査等に必要な情報活用技術を演習によって習得しながら、図書館情報学、情報探索の概要を学ぶ 。'
  source: https://ocw.kyoto-u.ac.jp/course/500/
