  ja: アカデミック日本語１B
description:
  ja: 日本語の発音やイントネーションに慣れる短文聴解から、教科書本文の内容理解、語彙・文法の学習までを扱う。さらに、テーマ設定から資料・スクリプト作成、質疑応答を含む発表、1分間スピーチへとつなげていく。公開教材には、自己紹介や各種トピックを扱う12件のファイルが含まれる。
quotedDescription:
  text:
    ja: '日本語の発音やイントネーションに慣れる。（短文聴解）

      教科書：内容を理解する。新しい単語や文法表現を学ぶ。（長文聴解）

      1 分間スピーチ：テーマに沿って、自分で考えた後、グループでディスカッションし、その後、短いスピーチを行う。

      発表：指定されたカテゴリーの中で、テーマを決める。資料やスクリプトを作成する。研究室や学会を想定した場面に沿う。質疑応答も行う。

      期末試験：スクリプト、資料、ディスカッション等準備を経て、発表。

      宿題：長文聴解（TACT で行う。）・発表の資料やスクリプト等。'
