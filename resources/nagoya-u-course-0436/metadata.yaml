name:
  ja: 基礎セミナー−食と健康
description:
  ja: 食と健康に関する基本テーマを扱い、その中から受講生がサブテーマを選んで調査する形式の講義である。選んだテーマについて、図書・文献・インターネット等を使って調べ、内容をまとめて発表資料と要旨を作成する。最後にパワーポイントで発表し、質疑応答を行う。
quotedDescription:
  text:
    ja: '基本テーマについて説明を行い、複数のサブテーマを学生に伝える。

      受講生に、基本的にサブテーマの中から自分のサブテーマを選択させる。

      受講生は、図書、文献、インターネット等を利用して、選択したテーマについて調査・学習する。

      調査内容をまとめて、発表のための資料をパワーポイントで作成する。また、その要旨も作成する。

      受講生はパワーポイントを用いて、他の学生に対してプレゼンテーションする。続いて、質疑に対して応答 する。

      教員は、発表および質疑応答について助言を行う。'
