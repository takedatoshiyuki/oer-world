name:
  ja: Interpreting Theory and Practice 通訳の理論と実践
description:
  ja: 通訳をコミュニケーションの営みとして捉え、その性質や進行過程を考察する講義である。基礎理論に加えて、通訳の形態やモード、訓練方法を扱い、逐次通訳と同時通訳の実践も含む。さらに、時事問題について日本語と英語で情報や考えを素早く整理することにも取り組む。
quotedDescription:
  text:
    ja: 'The nature and process of interpreting will be examined from a communication studies perspective.
      Basic interpreting theories and a variety of interpreting types and modes will be introduced. Students
      will experience various training methods and practice both consecutive and simultaneous interpreting.
      The course also trains students in promptly presenting information and one’s understanding of current
      issues both in Japanese and English.

      通訳という行為のプロセスと特質を、コミュニケーションの観点から考察する。基礎的な理論の学習と共に、様々な通訳の形態を学ぶ。また、各種の練習法、逐次通訳、同時通訳を体験する。時事問題領域を広く学び、日本語および英語で情報や概念を素早くまとめる能力も養う。

