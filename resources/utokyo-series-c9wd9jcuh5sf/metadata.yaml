name:
  ja: 現代行政（事例研究）
description:
  ja: 現代日本の政策決定を事例で扱い、特定の地方自治体を対象に現場の行政課題やその対応を検討する。制度そのものだけでなく、実際の運用や地方分権改革の影響にも目を向け、聞き取りと調査を通じて課題の全体像を把握する。最後に政策提言を含むレポートをまとめ、対象自治体に提出する。
quotedDescription:
  text:
    ja: 現代日本における政策決定の事例を取り上げ、議論を中心として授業を進めてゆく。 今年度は、特定の地方自治体を素材として定点観測を行い、自治体の現場における行政課題、それへの対応、行政管理の方法等を、制度とのその運用実態とに着目しながら考察する。その過程で、現在進められている地方分権改革の影響も学ぶ。
      観察する自治体は千葉県佐原市を予定しており、授業においては、同市の概要を学んだ後、一定の政策課題について、佐原市の関係者、地元の組織、県、国の関係省等から聞き取りを行って、課題の全体像を把握する。
      最終的に、政策提言を含めレポート作成し、佐原市に提出する予定。
