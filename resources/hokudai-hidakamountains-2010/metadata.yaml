name:
  ja: 土曜市民セミナー 北海道の背骨の生い立ちを探る(2010)
description:
  ja: 日高山脈を例に、地殻変動と山脈形成の過程を取り上げる講義である。あわせて、山脈が形成された後に生じる影響についても扱う。
quotedDescription:
  text:
    ja: 「動かざること山の如し」という言葉がありますが、一方では「桑田変じて滄海となる」という言葉もあります。地球の年齢（46億年）の時間スケールで見ますと、地球表層部（深部も）は常に千変万化しており、山が海になるどころか大陸が移動し、互いに衝突もします。北海道の背骨といわれる日高山脈では、地球の内部や地表で起こるいろいろな出来事（地殻変動）がよく観察できます。また、隆起した山脈は「出る杭は打たれる」の喩えのように、風雨により侵食されます。講演では、日高山脈を例に山脈の生い立ちの一例を紹介するともに、山脈ができたことによる影響についてもお話しします。
