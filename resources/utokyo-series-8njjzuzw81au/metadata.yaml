name:
  ja: 第136回（2023年春季）東京大学公開講座「少子化」
description:
  ja: 少子化によって人口減少や高齢化率の上昇が生じることを起点に、その影響を社会全体と財政の両面から考える講義である。近代日本の人口構造の変化を踏まえつつ、高齢者給付を現役世代が支える財政構造が少子化でどう変わるかを扱い、財政の対応を検討する。
quotedDescription:
  text:
    ja: 少子化が進むと人口が減少し、高齢化率が上昇しますが、そのことはどこまで問題なのでしょうか。近代日本の人口構造は大きく変動しましたが、経済と社会は比較的柔軟に対応してきました。しかし、高齢者への給付を現役世代の負担でまかなう財政の構造は少子化によって深刻な影響を受けます。そのとき財政はどのように対応すればいいかを考えます。
