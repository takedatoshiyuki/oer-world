name:
  ja: 特別プログラム 第2回 福島第一原子力発電所における事故の影響に関する説明会 （2011）
description:
  ja: 福島第一原子力発電所事故による健康への影響と食品の安全を扱い、あわせて日本と海外メディアの報道の違いを説明する説明会の記録である。公開教材には、冒頭説明、放射線の人体への影響、食品安全、情報提供とパニックの関係を扱う資料が含まれる。北海道大学の外国人留学生や札幌市の在留外国人を主な対象としている。
quotedDescription:
  text:
    ja: 北海道大学の外国人留学生及び札幌市の在留外国人等を対象に、４月１１日に開催した説明会において参加者の関心が高かった、福島第一原子力発電所の事故による健康への影響及び食品の安全について正しい知識を提供するとともに、日本と海外メディアにおける報道の違いを説明し、生活・学習への不安を軽減するために、英語による説明会（第２回）を開催しました。
