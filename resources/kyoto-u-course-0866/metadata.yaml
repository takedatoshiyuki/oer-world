name:
  ja: 教育学研究科 公開シンポジウム「東アジア地域における大学入試改革」, 2012
description:
  ja: 東アジア地域で進められている大学入試改革を取り上げ、学力試験の成績だけに依拠しない選抜方法に目を向ける。あわせて、そうした改革が導入された背景、実施状況、結果を整理し、大学入試のあり方を考える内容である。
quotedDescription:
  text:
    ja: '概要

      わが国では現在、大学入試のあり方が改めて問われている。わが国と同様、激しい受験競争が存在する東アジア地域でも大学入試改革が進められ、学力試験の成績のみによらない選抜方法が模索、導入されている。そうした先行事例における導入の背景、実施状況、結果などについて理解を深めつつ、望ましい大学入試のあり方を考える。

       

      韓 崇熙 教授（ソウル大学）

      洪 成文 教授（北京師範大学）

      洪 泰雄 主任（国立台湾大学）

      コメンテーター: 南部 広孝 准教授（京都大学大学院教育学研究科）

      司会: 鈴木 晶子 教授（京都大学大学院教育学研究科）'
