name:
  ja: 'H1: The World of Classics Ｈ１：西洋古典の世界'
description:
  ja: 西洋文化の古典的遺産が現代世界にどのような意味をもつかを扱い、特にギリシア人の人間理解に焦点を当てる。ギリシア悲劇の名作を解釈しながら、古代ギリシアで「人間であること」が何を意味したかを考える。あわせて、ヨーロッパ文明史における古典ギリシアの位置とその時代的意義を取り上げる。
quotedDescription:
  text:
    ja: 'The classical heritage of Western culture and its significance for the modern world, with special
      reference to the Greek understanding of humankind. Studied through interpretation of the masterpieces
      of Greek tragedy.

      ギリシア古典文学（ギリシア悲劇）の解釈と鑑賞を通じて古代ギリシア人にとって“人間であること”とは何であったかを探り，あわせてヨーロッパ文明史上にしめる“古典ギリシア”の位置，さらにその時代における意義を考える。

      ※Video is partial recording of Course.

      ※この動画はコースの一部を公開しています。'
