  ja: 北海道大学のCenter for Open Educationが、OERを用いてオンライン学習を進める取り組みを扱う。ブレンド型学習向けの教材開発や、学部授業・特別教育プログラム・国際プログラムへの適用が述べられている。あわせて、工学部のCEEDとの連携も示される。
quotedDescription:
  text:
    ja: 'Center for Open Education is a department to leverage OER to accelerate online learning around
      Hokkaido University. Center for OE develops OERs in blended learning to improve student engagement
      and learning outcomes for both on its own campus and on the consortium by public universities in
      Hokkaido region. These OERs are for undergraduate courses，special-education programs and international
      programs. Center for OE collaborates with Center for Engineering Education Development (CEED) in
      the School of Engineering at Hokkaido U.

