description:
  ja: ヒルベルトの積分方程式論と、そこから発展した非可換幾何学のつながりを扱う講義である。コンヌの構成の一つを軸に、積分方程式をWeylの漸近法則やAtiyah-Singer指数定理へ結びつけて考える。
quotedDescription:
  text:
    ja: 'Course Description

      Hilbert’s theory of integral equations, now over one hundred years old, is a famously successful
      marriage of matrix algebra and analysis. One way to view Alain Connes’ much newer noncommutative
      geometry is to see it as an evolution of the theory of integral equations that incorporates geometric
      ideas into Hilbert’s work. I shall try to develop this perspective in my lecture. I will focus on
      one construction of Connes, which relates integral equations to Weyl’s asymptotic law, the Atiyah-Singer
      index theorem, and more.'
