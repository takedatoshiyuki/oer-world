description:
  ja: 小学生の読書量と学習意欲の関係を扱う研究発表である。読書に関する既存の議論と、読書の効果を実証的に確かめる研究の少なさに触れつつ、その影響を検討する内容である。
quotedDescription:
  text:
    ja: '「小学生の読書量が学習意欲に及ぼす影響」についての研究発表。

      読書をすると良いことがある、と良く言われるが、読書に関する文献では、学習意欲が沸き立つ、想像力が養われる、教養が身につくなどが述べられているに留まり、読書の効果を実証的に示した研究は少ない。読書が学習意欲に及ぼす影響を検討することを目的として、研究を行っている。'
