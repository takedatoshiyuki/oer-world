  ja: 図書館の情報や資料の種類、分類、参考資料、目録情報、インターネット情報、データベースの扱い方を順に取り上げる講義である。最後に総合演習があり、公開教材には各回の講義資料が資料1・資料2としてまとまっている。
quotedDescription:
