quotedDescription:
  text:
    ja: '本学が参加する国連大学SDG-UP（SDG大学連携プラットフォーム)は、他の参加大学と協働で、一般教養科目「国連SDGs入門」を2021年度末に開発しました。本動画は、これに合わせて本学から提供した２つの動画のうちの一つです。

      本動画では、北極海での長期漂流観測「MOSAiC」計画に参加した講師が、この計画の内容について示し、海氷の表面が融けてできた水溜であるメルトポンドの調査結果も含めて、北極海でいま何が起きているかを紹介します。'
