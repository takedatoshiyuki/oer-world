description:
  ja: 本講義は、確率的情報処理を題材に、統計力学の考え方を用いた情報処理システムの設計と動作解析を扱う。具体例を通して、その設計と解析の進め方を説明する構成になっている。
quotedDescription:
  text:
    ja: '確率的情報処理に関する話題の提供 : 統計力学の考え方に基づく情報処理システムの設計と その動作の解析がどのように行われるのか、を具体例をあげて解説する.

      次年度は「画像/符号/スペクトル拡散通信の数理 : ベイズ統計と情報処理」、「ゲーム理論と経済現象の数理」をとりあげる予定です.

      2005年度の資料も参照のこと.'
