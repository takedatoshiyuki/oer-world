name:
  ja: サステナビリティ・ウィーク サステイナブルキャンパス 国際シンポジウム（2014）
description:
  ja: サステナビリティ・ウィークの一環として実施される国際シンポジウムで、2014年はサステイナブルキャンパスの思想と実践をテーマに据える。講演では、サステイナブルキャンパスの必要性や諸外国における大学と地域の関係を扱い、その後のパネルディスカッションで北海道大学における地域連携とキャンパスの活用の可能性を議論する。
quotedDescription:
  text:
    ja: サステナビリティ・ウィークの一環として行われるサステイナブルキャンパス国際シンポジウムは2011年から始まり、今回で4回目を迎えます。昨年のシンポジウムでは、「地域と連携したサステイナブルキャンパスの構築」をテーマに、大学キャンパスの役割を地域計画の中でどう位置づけるかが一貫して主題となり、特に本学札幌キャンパスは市街中心部において他との明解な境界を持つにも関わらず、市民、観光客との相互作用が起きやすい環境にあるとの指摘から、その“浸透膜”のような柔らかい境界を活かしたキャンパスづくりを目指すべきであるとの意見で議論が締めくくられました。これを踏まえ、今回は「サステイナブルキャンパス構築のための思想と実践―
      大学にとって地域とは―」をテーマに、なぜサステイナブルキャンパスが必要なのか、諸外国において、大学の地域連携はサステイナブルキャンパス構築の文脈の中でどのように位置づけられているのか、といった思想的・実践的話題について講演を行います。さらにその後のパネルディスカッションでは、北大にとっての「地域」を想起しながら、地域連携のためにキャンパスがどのように活用されうるか、その可能性を議論します。
