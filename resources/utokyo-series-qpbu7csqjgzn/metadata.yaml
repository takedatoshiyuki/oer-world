name:
  ja: ジェロントロジー2：高齢社会の社会システムと生活環境
description:
  ja: 東京大学の2008年度開講講義で、高齢者や高齢社会の問題を学際的に扱うジェロントロジーをテーマにする。社会システムや生活環境に関わる高齢社会の課題を視野に入れた内容として提示されている。
quotedDescription:
  text:
    ja: '「ジェロントロジー」とは、高齢者や高齢社会の諸問題を解決するために生まれた学際的学問です。医学、看護学、理学、工学、法学、経済学、社会学、心理学、倫理学、教育学などの幅広い領域を包含します。２０１５年には４人に１人が６５歳以上という超高齢社会を迎える日本では、専門分化した学問だけでは対応が難しい複雑な問題が生じてきています。ジェロントロジーを学ぶことは、将来どの専門領域に進む上でも非常に有用です。

      総長室直轄の総括プロジェクト機構ジェロントロジー寄付研究部門では、ジェロントロジーに関する学際的教育基盤構築の一環として、２００８年度より学際横断型教育プログラム「ジェロントロジー」を国内で初めて設置し、高齢者や高齢社会の諸問題に関する学際的な知識を有する学生の育成を開始します。あらゆる分野を目指す学生の参加を歓迎します。'
