name:
  ja: 正多面体と群
description:
  ja: 正多面体の対称性を題材に、図形の美しさを群という代数的な枠組みで捉える内容を扱う。さらに、対称性と群の考え方を別の例にも広げて学ぶ構成になっている。公開されている教材は第1回と第2回の講義資料である。
quotedDescription:
  text:
    ja: 正多面体とは、合同な正多角形を面に持つ「美しい」立体のことです。正多角 形が無数に存在するのに対し、正多面体は全部で五種類しかないことが知られています。この講義では、「美しさ」の背後にある図形の対称性が、群という代数的な概念で捉えられることを紹介します。さらに、対称性と群の考え方の有用性を、他のいくつかの例を基に学んでいきたいと思います。
  source: https://ocw.nagoya-u.jp/courses/0117-%E6%AD%A3%E5%A4%9A%E9%9D%A2%E4%BD%93%E3%81%A8%E7%BE%A4-2008/
