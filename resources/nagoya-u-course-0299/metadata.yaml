name:
  ja: 地球環境変動論（温暖化概論）
description:
  ja: この教材は、温暖化によって近い将来の環境がどう変わるかを、複数分野の視点から扱う。温暖化の仕組みから、自然環境や産業への影響、さらに環境予測や政策・展望までを取り上げる。
quotedDescription:
  text:
    ja: 本講義は、「温暖化概論」である。「温暖化によって、近未来の環境がどうなるか」を、理学、工学、農学、人文科学などの領域から横断的に講義する。温暖化の仕組み 、温暖化による自然環境の変動と産業への影響、近未来の環境予測と政策・展望等を取り上げ、わかりやすく説明する。
