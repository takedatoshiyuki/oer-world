name:
  ja: GCOE総合博物館市民セミナー ロシア文学と境界（2011）
description:
  ja: ロシア文化を、地理や民族構成の多様さを背景にした境界の問題から捉える講義である。文学・芸術だけでなく宗教や政治文化も視野に入れ、東方キリスト教世界や帝国内の諸社会、ヨーロッパとアジアの関係を手がかりに考察する。主として19世紀ロシア文学を題材に、文化的境界のあり方を扱う。
quotedDescription:
  text:
    ja: 'ロシア文化は、地理風土からしても民族構成からしても広く多様な基盤をもっているので、境界に関する事象も複雑な様相を呈しています。

      文学・芸術も宗教・政治文化も、東方キリスト教世界、ロシア帝国内のロシア人社会と諸民族社会、ヨーロッパ部分とアジア部分といった諸空間の入り組んだ関係を抜きにしては、説明できません。

      ただし文学には境界や差異の問題を顕在化する側面と隠ぺいする側面があり、たとえば知識人と民衆の断絶論に熱心な作家が、ロシア的宗教文化の一元性を疑わないというような歪みも観察されます。

      本セミナーではそんなことを前提に、主として19世紀ロシア文学を題材とした文化的境界論を試みたいと思っています。

      ‡ これらの資料は制限資料です。'
