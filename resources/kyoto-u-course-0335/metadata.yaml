name:
  ja: 第5回 MACSコロキウム「沈み込み帯で活動する水の挙動の理解へ：青色片岩は有馬型熱水の起源」
description:
  ja: 沈み込むプレートから放出される水を主体とする深部流体に着目し、それが岩石の性質やプレート間地震、島孤火山活動にどう関わるかを扱う。あわせて、地下15〜150kmで形成された沈み込み帯の岩石に含まれる含水珪酸塩鉱物や流体包有物を手がかりに、深部流体活動の実態を探る。講演では、こうした研究の最近の成果を紹介する。
quotedDescription:
  text:
    ja: '概要

      沈みこむプレートから放出されるH2Oを主体とする深部流体は岩石の物性を大きく変化させ、プレート間地震や島孤火山活動を誘発するため、深部流体活動の実態解明は21世紀初頭から大きな注目を集めています。

      私達は過去の沈み込み帯の地下15-150kmで形成された岩石に含まれる含水珪酸塩鉱物の消長や深部流体そのものである流体包有物を素材として、地下深部流体活動の実態解明に取り組んでいます。

      本講演では、最近の成果について紹介したいと思います。'
