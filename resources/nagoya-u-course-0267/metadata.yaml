name:
  ja: 言語文化学方法論a：表象の領域
description:
  ja: 表象をめぐる具体例と、その分析・考察の方法を扱う講義資料である。富士山や美人、病気、自然、不気味なものといった題材を通して、何がどのように表象されるかを検討する。公開教材として「富士山と浴場」「自分が知っている絵」の2件がある。
quotedDescription:
  text:
    ja: 'われわれの身近にある事象を詳細に検討してみると、いったいどのような理由でわれわれに重要な意味を持つようになったのか不明な場合がある。 理由も分からず、愛でていたり、尊重していたりすることがある。そうした事象のひとつひとつの成り立ち、また意識に上る条件を、考察・検討してみる。そして、その表象を、自らまとめて互いにプレゼンテーションすることで、表象の確認作業をする。それは、PPT（PowerPoint）や
      Keynote（Macintosh）というソフトウェアを使った発表を促し、いわば表象のルーツ探しの方法を探りかつそれを表象するセミナーである。参加型授業である。

      イントロダクション。表象の具体的提示。ディスカッション。

      分析と考察の方法論。ディスカッション。

      典型的な日本文化を表象するものの例示。

      「富士山」の表象するもの、表象されるもの。

      「美人」という表象。

      病気がもたらす美人像の変化。佳人薄命。現実と空想の狭間で。

      「自然」の呪縛とそこからの解放。

      「不気味なもの」の意味について。

      「病気」とは何かの表象について。

      まとめ。

      講義資料

      富士山と浴場

      自分が知っている絵'
