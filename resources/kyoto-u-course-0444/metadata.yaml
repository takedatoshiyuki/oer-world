name:
  ja: 動物生体機構学
description:
  ja: 動物の生体機構と生理機能を主題に、細胞・組織・器官の構造と働きを順に扱う。あわせて、内分泌機能、免疫機能、家畜の遺伝的改良に伴う体の構造と生理機能の変化と適応も取り上げる。公開資料では、細胞から各器官系までを通して学ぶ構成になっている。
quotedDescription:
  text:
    ja: '授業の特色

      動物の生体機構および生理機能に関連した授業を行う。

      授業の概要目的

      動物は環境に適応しながら、ホメオスタシスの働きで体内の恒常性を一定に維持している。動物の細胞・組織・器官などの構造と生理・内分泌機能の特性、家畜の遺伝的改良に伴う体の構造と生理機能の変化と適応、動物の免疫機能の特徴などを講述する。'
