name:
  ja: 日中比較文化論ab
description:
  ja: 古代日本と古代中国の文化的交渉を扱い、文化要素がどのように流動し、衝突し、融合するかを観察する方法を学ぶ講義である。掲載されている教材は、大伴坂上郎女の怨恨歌を題材にした講義ノート2件で、恋歌（和歌）と閨怨詩（漢詩）の関係も扱う。原典と研究文献を読みながら、作品分析を行う構成になっている。
quotedDescription:
  text:
    ja: 古代日本と外来文化の関係を探求する。主に古代日本と古代中国の文化的交渉の諸問題を取り扱っているが、単に両国の文化の相違点を洗い出すのみならず、文化要素の流動、衝突、融合の過程を観察する方法を学ぶ。毎年トピックを変える。今年度（２４年度）は前期、後期を通じて、恋歌（和歌）と閨怨詩（漢詩）の交渉について考える。参加者は、各トピックに関する原典と研究文献を事前に読み、その方法や発想を学びながら、作品の分析を行う。先行研究と原典を読むことによって、読解力、問題点を発見する能力、論理的に考える能力を身につけることがこの授業の目的である。
