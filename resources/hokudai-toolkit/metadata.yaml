name:
  ja: オンライン教育セミナー「ツールキットを活用した授業設計と改善」（2021.10.29）
description:
  ja: この教材は、オンライン授業と対面授業を組み合わせたブレンド型授業を対象に、設計と改善の考え方を扱う。リビルド法と、それを支援するツールキットを用いて授業をどう設計・改善するかを紹介する内容である。
quotedDescription:
  text:
    ja: "高等教育推進機構オープンエデュケーションセンターでは、オンライン授業と対面授業を組み合わせた「ブレンド型授業」を効果的に設計・改善する手法「リビルド法」を考案しました。さらに、リビルド法による授業設計・改善を支援するための「ツールキット」を開発しました。本セミナーでは、効果的なブレンド型授業を設計するポイントと、リビルド法とツールキットを用いた授業を設計・改善する具体的な方法について紹介します。\n\
      \ \n■ プログラムと配布資料\nセミナー１：効果的なブレンド型授業の設計\n重田 勝介（北海道大学オープンエデュケーションセンター副センター長）\n配布資料\nセミナー２：ツールキットを用いた授業設計\n\
      杉浦真由美（北海道大学オープンエデュケーションセンター）\n配布資料\n【参考サイト】\n北海道大学におけるオンライン授業ガイド -  授業デザインツールキット\n■ 開催情報\n日時：2021年10月29日（金）\
      \ 16:30-17:30\n場所：オンライン（Zoomウェビナー）\n参加人数：107名\n \n※この動画の再生プレイヤーでは、発表者・共有画面・ギャラリービューなどの複数のクリップから視聴画面を選択できます。カーソルを再生プレイヤー上にかざすと画面右側に操作ツールが表示されますので、お好きな画面表示をお選びください。それぞれのツールの機能は、上側がクリップの変更・位置交換、中央が複数クリップの表示方法の変更、下側が複数クリップからのクリップ選択機能です。"
