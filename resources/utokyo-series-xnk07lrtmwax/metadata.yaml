    ja: 科学技術の進歩を制禦する方策としてまず思い付くものは法規整でしょう。でも、法にそれはどこまで可能なのでしょうか？ 法律家が科学技術を誤解しているかもしれませんし、科学技術者が法を誤解しているかもしれません。いずれの場合も制禦はうまく行かないでしょう。そもそも科学・技術・人文・社会科学などの学問ないし知的営為における進歩とは何なのでしょうか？
