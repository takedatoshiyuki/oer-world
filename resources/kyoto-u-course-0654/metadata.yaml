name:
  ja: 医療の質と経済・社会・制度
description:
  ja: この教材は、疫学とEBMの基本的な考え方を手がかりに、健康・医療情報を読み解く視点を扱う。分母と分子、バイアス、交絡、対照群といった概念を説明し、身近な事例を通して情報を読む際の注意点と着眼点を整理する。
quotedDescription:
  text:
    ja: '授業の特色

      講義内容に関する出席メールと返信メールによる双方向の授業。受講生に、社会への関心を呼び覚まし、それに対する考える力を養う。

       

      授業の紹介

      社会健康医学系専攻の教官によるオムニバス講義。その1回として、「健康・医療情報を読み解くために〜疫学・EBMから情報リテラシーへ〜」と題し、疫学とEBMの知識から健康情報リテラシーを講義します。疫学やEBMの考え方の基本である、分母と分子、かたより（バイアス）、交絡、対照群などの考え方を解説し、身近な事例を題材に、情報を読み解く際の落とし穴、目の付け所を整理したいと思います。'
