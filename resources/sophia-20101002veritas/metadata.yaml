name:
  ja: より身近に感じられる科学 「物を切ってゆくと」
description:
  ja: 物を細かく切り分けていくと何が残るのかという問いを手がかりに、物質の分け方とその限界を考える講義資料である。説明では、その考えが原子や元素という見方につながることを扱っている。
quotedDescription:
  text:
    ja: "より身近に感じられる科学 「物を切ってゆくと」\n 物を細かく切ってゆくと最後まで切れるか、最小単位があってそれ以上切れなくなるか、ということに人間は困惑するようになった。或る物質がとんでもない物をいくつか合わせるときに出来ることから、そのいくつかの物が出来た物の中に収まっていることから、分けてゆくときに最後にはその中に残っている筈で、これ等を分けることが出来、その後には異なった物が残される筈であることに気がついた。その物が今日の原子であり、その種類毎に元素という表示を貰うことになる。\n\
      当日のプログラムの詳細は こちら をご覧ください。"
