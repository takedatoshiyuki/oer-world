quotedDescription:
  text:
    ja: '概要

      命と向き合う教室 ～子どもが「命」に見える学校・学級づくり～

      東日本大震災から 4 年、親しい人を失った悲しみを抱えつつも、誰にも打ち明けられずにいる中学生たちに綴方を通して関わり、その心をときほぐす指導をされてきた制野俊弘先生をお迎えして、講演会を行いました。'
