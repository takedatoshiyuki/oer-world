name:
  ja: OECフォーラム2025「つくることで学び会うラーニングコモンズ」
description:
  ja: 北海道大学が2025年度に開催したOECフォーラムの資料で、国内の「つくることで学ぶ」教育やラーニングコモンズの事例を扱う。あわせて、北海道大学のDigital Creative Gridsの取り組みを取り上げ、実践事例紹介やパネルディスカッションを通して学習環境の在り方を議論する内容である。
quotedDescription:
  text:
    ja: "北海道大学大学院教育推進機構オープンエデュケーションセンター（OEC）は、オープン教育資源（Open Educational Resource：OER）を中心とした教材開発、ICT（情報通信技術）を活用した授業支援ならびに教育システムの提供、またこれらを総合した研究開発を行っています。\n\
      \ \n2025年度のフォーラムでは、国内における「つくることで学ぶ」教育やラーニングコモンズの先進事例を紹介しつつ、本学グリッズ（Digital Creative Grids）の取り組みを取り上げながら、「つくることで学ぶ」ことの本質を問い直し、大学等におけるこれからの学習環境の在り方について、幅広く議論しました。\n\
      \ \n【開催概要】\n開催日時：2025年8月22日（金） 14:00 ～ 17:00\n対面会場：北海道大学 北図書館内「Digital Creative Grids （グリッズ）」\n\
      オンライン会場：Zoomウェビナー\n主催：北海道大学大学院教育推進機構オープンエデュケーションセンター\n共催：北海道大学大学院教育推進機構高等教育研修センター\nフォーラム開催報告\n \n\
      【プログラム】\n開会挨拶\n趣旨説明（アーカイブ配信あり）\n基調講演1\n基調講演2\n北海道大学における「つくることで学ぶ」実践事例紹介（アーカイブ配信あり）\nパネルディスカッション\n\
      閉会挨拶\n \n※プログラムの一部をアーカイブ配信しております。"
