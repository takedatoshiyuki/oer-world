name:
  ja: ライフコースの社会学／SOCIOLOGY OF LIFE COURSE
description:
  ja: この講義は、ライフコース論の基本概念とその成立背景を扱い、具体的な分析や世代ごとの動きにも触れる。あわせて、歴史と社会構造を社会学的に捉える視点を学ぶ内容である。
quotedDescription:
  text:
    ja: 高齢化・長寿化が進み、いまや「人生90年時代」と言われる現代社会において、人生や生涯、世代への関心が高まっています。時代や社会、人間関係の影響を受けながら過ごしていく私たちの一生をとらえるため、社会学では「ライフコース」という概念が開発されてきました。本講義では、ライフコース論の諸概念や登場の背景、具体的な分析ならびに世代ごとの動きなどにふれつつ、歴史と社会構造に対する皆さんの社会学的感覚を養ってもらいたいと思います。この講義が、皆さんが今後一生を過ごしていく際のシミュレーションの役割を担えるならば幸いです。
