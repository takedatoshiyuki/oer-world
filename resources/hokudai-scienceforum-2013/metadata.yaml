name:
  ja: 第11回創成シンポジウム 石狩から電力革命 – 目指せ！送電ロス・ゼロの世界 – （2013）
description:
  ja: 北海道大学創成研究機構が「次世代エネルギー」をテーマに開催したシンポジウムである。平成25年1月に経済産業省の委託を受けて始まった「石狩超電導直流送電プロジェクト」を中心に、産・学・官の立場からの講演とパネルディスカッションを扱う。
quotedDescription:
  text:
    ja: '北海道大学創成研究機構ではこのたび、「次世代エネルギー」をテーマにシンポジウムを開催致します。

      講演者達が産・学・官それぞれの立場で平成25年1月に経済産業省の委託（約40億円）を受けスタートした「石狩超電導直流送電プロジェクト」を中心にお話致します。テレビなどでお馴染みの佐藤のりゆき氏のナビゲートによるパネルディスカッションもお届けし、エネルギーを通して北海道の未来について考えます。'
