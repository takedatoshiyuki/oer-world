name:
  ja: 応用バイオインフォマティクス
description:
  ja: バイオインフォマティクスを基礎に、薬学で必要となるケモインフォマティクスやケミカルゲノミクスを扱う講義である。端末を用いた演習形式で、統計計算プログラミングやデータベース利用法を実習し、バイオ情報とケミカル情報を統合して創薬に生かす考え方を学ぶ。
quotedDescription:
  text:
    ja: '授業の特色

      バイオインフォマティクスを基礎として、薬学にとって必要な情報科学であるケモインフォマティクスとその融合であるケミカルゲノミクスについて学ぶ。授業は端末を用いた演習形式であり、統計計算プログラミングやデータベース利用法について実習する。

      授業の紹介

      バイオインフォマティクスは、膨大なゲノム情報を処理するための情報技術として、ヒトゲノム計画とともに発展してきた。ヒトゲノムが解読された今日では、莫大なゲノム情報から創薬への手がかりを発見すること、すなわち「ゲノム創薬」に大きな期待が寄せられている。ゲノム創薬は、ゲノム情報を出発点とし創薬の標的遺伝子探索からリード化合物探索を経て臨床段階に至る広範で高度に専門化した複合領域であり、その実践にはこれらの複合領域を結ぶ総合的なインフォマティクス基盤（創薬インフォマティクス）が必須となる。すなわち単なるバイオインフォマティクスのみならず、バイオ情報を扱うバイオインフォマティクスとケミカル情報を扱うケモインフォマティクスの独立に発展してきた２つの情報科学分野の統合を図り、バイオ情報とケミカル情報の両者を同時に統合的にマイニングする新しい情報技術が必要とされている。本授業では、バイオインフォマティクスの創薬応用を意識した創薬インフォマティクスについて学ぶ。'
