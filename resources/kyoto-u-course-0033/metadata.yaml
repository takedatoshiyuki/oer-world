name:
  ja: 経済英語B
description:
  ja: アメリカ企業とアメリカ航空機産業を例に、インターネットや経済紙誌を使って企業・産業情報を集め、整理する方法を扱う。あわせて、財務諸表の読解、ROI・ROA・ROEの確認、企業分析の進め方、レポート作成までを含む。
quotedDescription:
  text:
    ja: '授業の特色

      経済問題・外交問題について、米英の主要誌の記事・論文を読み、自らの見解を持つことを目的とする。

       

      授業の紹介

      アメリカ企業（The Boeing Company）とアメリカ産業（アメリカ航空機産業）を例に取り、インターネットを通じて、どのように情報を収集し、整理するか、講義を通じて学ぶ。

      具体的には、上記企業・産業についてのFinancial Times, Wall Street Journal, Economist, Forbes, Fortune, Business Weekなどの経済情報紙誌の英文記事を読み進め、1.
      製品・サービスの質、2. 業界内での位置づけ、3. 不況抵抗力、4. 経営者の質などの主要項目について調査し、経営戦略・産業動向を検討する。

      講義で検討した手法をもとに、分析する特定のアメリカ企業・産業を選択し（関心のある企業で、10-K形式の会計報告をSECに提出し、公開している企業）、Form 10-K, Moody’s Company
      Dataおよび各種経済紙誌を素材として、経営戦略と将来性を日本語でレポートにまとめる。'
  source: https://ocw.kyoto-u.ac.jp/course/33/
