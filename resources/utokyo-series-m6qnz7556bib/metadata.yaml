name:
  ja: 歴史的建築工学
description:
  ja: 歴史的建築物の活用と改修を対象に、文化財建造物から既存住宅までの古い建物をどう扱うかを工学的に考える。修理や増改築を通じて使い続けるために必要な、構造・防火・省エネ・意匠などの論点を取り上げ、専門家の知見をもとに基礎と最新の話題を学び、議論する。
quotedDescription:
  text:
    ja: '現在、歴史的建築物の活用と改修の需要が急増している。文化財建造物からごく普通の既存住宅まで、多様な「古い建物」との付き合い方が、連続的に考えられるようになってきた。

      修理・増改築を行い、建物を使い続けるためには、構造・防火・省エネ・意匠など様々な分野で新築とは異なる知識を持った専門家の協働が求められる。

      本講義は、歴史的建築物の工学的な側面を対象とし、当該分野の専門家をお招きして、基礎的な知識と最新の知見について学ぶとともに、議論を行う。'
