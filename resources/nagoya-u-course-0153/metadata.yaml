description:
  ja: 都市の温熱環境・微気象を中心に、地球温暖化と都市温暖化の違いを整理する内容である。あわせて、人間活動に伴うエネルギー消費や都市化が都市の温熱環境・微気象に及ぼす影響と、その解析方法を扱う。
quotedDescription:
  text:
    ja: 主として、都市の温熱環境・微気象について取り上げる。まず最初に、地球温暖化と都市温暖化の違いについて整理する。次に、人間活動に伴うエネルギー消費や都市化が都市の温熱環境・微気象に及ぼす影響について学習する。また、温熱環境・微気象を解析する方法についても学習する。
