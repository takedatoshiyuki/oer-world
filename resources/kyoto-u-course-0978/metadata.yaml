description:
  ja: 映画を媒介にして教育を考える講義であり、映画テクストを分析しながら、経験や教育の理解に映画がどう関わるかを扱う。あわせて、デジタル化やテクスト性、会話の変化といった現代社会の特徴との関係を見て、映画を通じた教えと学びにも触れる。Stanley
    CavellとGilles Deleuzeの異なる哲学的立場を参照し、関連する研究コロキウムでの成果を踏まえている。
quotedDescription:
  text:
    ja: 'Course Description

      Thinking about education through film

      This course will follow ground-breaking work in film as a medium of philosophical enquiry into education.
      It will examine film texts to explore the ways in which film as a medium aids the understanding
      of experience and education in what has been called a post-literate, image-driven society. It will
      explore the potential of film analysis in relation to such features of contemporary society as digitization,
      textuality, and changing patterns of conversation. The course has relevance not only to the understanding
      of the changing world in which young people grow up but to questions of teaching and learning through
      film. In particular, it builds on work undertaken by the UCL Institute of Education-Katholieke Universiteit
      Leuven Philosophy of Education Research Colloquium. Over the past ten years, this colloquium has
      researched education by means of film analysis in an innovative and highly productive way. This
      work draws on the distinctive approaches of two contrasting philosophers: Stanley Cavell and Gilles
      Deleuze. It thereby brings together different traditions of thought in a dynamic way. The processes
      of teaching and learning adopted on the course are themselves occasions for reflections on pedagogy
      and introduction to productive ways of teaching.'
