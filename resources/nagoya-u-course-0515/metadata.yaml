name:
  ja: 教師発達論講義Ⅰ
description:
  ja: 教員養成教育、現職教育、教師教育者に関する理論的・実践的な知識と技能を扱う講義である。具体的な実践事例を基に、個人の考察やペア学習、グループ学習、全体討論、個人発表を通して教師発達を考える。公開教材には講義ノートに加え、学生が提出した感想や宿題が含まれる。
quotedDescription:
  text:
    ja: 受講者は、教員養成教育、現職教育、教師教育者に関する理論的・実践的な知識と、基本的・専門的な技能を習得する。授業方法の特徴としては、具体的な実践の事例 (エビデンス) を基に個人の考察、ペア学習・グループ学習を行い、全体討論や個人の発表の機会を通してさまざまな考え・アイデアを交換し、教師発達について理解を深める。
