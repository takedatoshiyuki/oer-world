name:
  ja: 経営組織
description:
  ja: 本講義は、経営学における環境適応を軸に、外部環境と組織目標の関係を前半で扱う。後半では、組織目標の実現に必要な内部環境適応の諸理論を詳しく扱う。あわせて、組織内で課題を発見し解決する力の育成を目指す。
quotedDescription:
  text:
    ja: 本講義では、経営学の基本である環境適応について正しく理解することで、組織の中で自ら課題を発見し、解決ができる力 (自主的探求力) を育成する。前半では、外部環境と組織目標の関わりを中心に講義する。後半では、そうした組織目標の実現に必要とされる内部環境適応のための諸理論について詳説する。
