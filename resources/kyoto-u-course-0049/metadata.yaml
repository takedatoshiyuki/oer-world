name:
  ja: 第40回 京都大学品川セミナー「ジュゴン、ウミガメ、オオナマズを追いかける～希少水圏生物の保護と共存」
description:
  ja: 東南アジアの希少な水圏生物を対象にした研究を扱い、ジュゴン、ウミガメ、メコンオオナマズの生態解明に向けてタイで行った調査を紹介する。あわせて、発信機や記録計を用いて生物の行動を明らかにするバイオテレメトリー／バイオロギングの手法に触れる。
quotedDescription:
  text:
    ja: '私たちの研究室では、東南アジアをフィールドに絶滅のおそれがある希少な水圏生物を追いかけて来ました。水圏生物の行動は肉眼で観察することは大変むつかしいことです。しかし、近年、電子情報通信技術の発展にともなって、超小型の発信機は記録計を生物に装着することで、こうした水圏に住んでいる生き物の行動を明らかにすることが可能となってきました。こうした研究手法をバイオテレメトリー（生物遠隔測定）と読んでいますが、最近では新しい学術用語としてバイオロギング（バイオ（生物）　＋　ロギング（記録））が定着しています。

      本セミナーでは、ジュゴン、ウミガメ、メコンオオナマズの生態を解明するために、私たちがタイのフィールドで取り組んできた研究の紹介とバイオロギングの可能性を語ります。

      映像内引用資料:国立極地研究所「極」No.9 2013夏号 (http://www.nipr.ac.jp/publication/PDF/Kyoku-no09.pdf）'
  source: https://ocw.kyoto-u.ac.jp/course/49/
