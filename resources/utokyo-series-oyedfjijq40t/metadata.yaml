description:
  ja: 本講義は、ICAOの設立経緯と、国際民間航空の発達や国際協力、国際ルールの策定における役割を扱う。あわせて、感染症へのレジリエンス強化、カーボンニュートラル、新技術への対応といった近年の課題も取り上げる。
quotedDescription:
  text:
    ja: 'ICAO（国際民間航空機関）は、1944年にシカゴ条約に基づき国連専門機関として設立され、2024年に設立80周年を迎えました。これまで、国際民間航空の発達や国際協力を促進し、国際ルールの策定において、ICAOが果たしてきた役割について理解を深めます。

      また、近年、国際民間航空は、感染症に対するレジリエンス強化やカーボンニュートラルなどの世界規模の課題、新技術への対応も求められていますが、ICAOではどのような戦略を…'
