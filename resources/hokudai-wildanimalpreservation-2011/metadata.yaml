name:
  ja: 全学教育 野生動物保全と人間社会（2011）
description:
  ja: 野生動物と人類の関係を、歴史的・生態学的な視点から整理しながら扱う講義である。あわせて、野生動物とのつきあい方や共存の可能性を取り上げ、具体的な事例を通して保全に関わる人的・社会的要素を考える。受講者が自分と野生動物の関わり方を考えるための機会も設ける。
quotedDescription:
  text:
    ja: 野生動物と人類の関係を歴史的および生態学的観点から整理し，野生動物とのつきあい方、「共存」の可能性を、多様な側面から検討します。また、具体的な事例をもとに、「野生動物保全」にいかに多くの人的・社会的要素がかかわっているかを理解し，自らと野生動物とのつきあい方を考える機会を提供します。
