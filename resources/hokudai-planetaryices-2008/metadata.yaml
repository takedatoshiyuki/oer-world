  ja: 宇宙に存在する氷が、どこにどのような形で見られるのかを取り上げる講義である。さらに、それらの氷が惑星や彗星の形成にどう関わったかを、暗黒星雲の氷微粒子が集まって太陽系の惑星が生まれていく流れとしてたどる。
