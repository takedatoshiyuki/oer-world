name:
  ja: コミュニケーション英文法
description:
  ja: 口語英語のコミュニケーションを分析するための基礎を扱う講義である。文の構造を確認したうえで、コミュニケーションの種類に応じた文の形式、典型的な言語行為の表現、連接する発言を捉える枠組みを学ぶ。授業は教材の読解と簡単な英語での質疑応答で進め、毎週リアクション・ペーパーを課す。
quotedDescription:
  text:
    ja: "口語英語におけるコミュニケーションを分析するための基礎を学ぶコースです。 \n 文の構造を概観したあとに、コミュニケーションの種類に従ってどのような要素を組み合わせた文の形式が使用されるか、使用に関する標準的な場合とそうでない場合の区別を見る。コミュニケーションにおける典型的な言語行為を概観して、その表現方法を見る。さらに、連接する発言を図式的に捉える枠組みを学習する。\
      \ \n 授業は教材を読みながら簡単な英語による質疑応答で進められる。 \n 毎週リアクション・ペーパーが要求される。"
