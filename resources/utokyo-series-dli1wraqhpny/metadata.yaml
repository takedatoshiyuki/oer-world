name:
  ja: 歴史とは何か（学術俯瞰講義）
description:
  ja: この講義は、歴史学の基本的な考え方として、史学概論、史料論、歴史認識論に相当する論点を扱う。続いて、個々の研究者が人物、モノ、フィールドワークに即して歴史を描く方法を紹介し、歴史学の研究の進め方にも触れる。
quotedDescription:
  text:
    ja: この俯瞰講義では、大学で展開されている歴史学という学問の、基本的なあり方とおもしろさ、魅力を考えてみたい。まずは、歴史学の基本的なあり方に関する三人の講師の三回ずつの講義が行われる。これは、やや硬い表現を使うと、史学概論、史料論、歴史認識論だが、これらの領域の基本的な課題をできるだけわかりやすく提示したい。これに続いて、三人の講師がそれぞれ一回の講義で、自分自身の歴史研究の魅力を、具体的な人物、モノやフィールドワークに即して歴史を描いていく「作業場」を紹介しつつ語ることを予定している。歴史とは「現在と過去との対話である」というのは、２０世紀を代表する歴史家E.H.カーの議論だが、この俯瞰講義を通じて、「歴史とは何か」について、ともにじっくり考えてみたい。
  source: https://ch.u-tokyo.ac.jp/series/?id=Dli1wrAQhpnY
