description:
  ja: 現代代数学の基礎を扱い、群論や環論を含む講義である。毎週の講義1時限と演習2時限で構成され、線形代数学IIの既修が求められる。公開教材として講義資料が5件あり、出典サイトには12回の講義と3本の動画の記載がある。
quotedDescription:
  text:
    ja: '現代代数学の基礎を学ぶ。群論，環論など。 毎週講義1時限，演習2時限。

      線形代数学 II を既修のこと。さらに数学通論 I の既修が望ましい。

      Introduction to modern algebra. Includes group theory and ring theory.

      One period of lecture and two periods of recitation weekly. Prerequisite: Linear Algebra II. Recommended
      to be taken after Basic Concepts in Mathematics I.

      Contents of Lectures

      12

