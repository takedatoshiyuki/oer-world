name:
  ja: Development and Education 開発と教育
description:
  ja: 開発と教育の関係を入門的に扱い、開発課題の中で教育がどのように位置づけられてきたかを考える。あわせて、データやケースを用いて、地域・国・社会ごとの違いや共通点を比較する。講義では、理論とアプローチに加え、ジェンダー、教育の分権化、参加型学校運営、平和構築と教育などの事例を扱う。
quotedDescription:
  text:
    ja: 'This course is an introduction to development and education. The course discusses issues of development
      and how education has been perceived to play a role in “development.” The course also looks at empirical
      evidence and discusses similarities and differences across regions, countries, and societies.

      開発と教育に関する入門コース。国際的な開発課題とそれに対する教育の役割がどのように認識されてきたか、その変遷と課題を概説する。また、具体的なデータやケースを用いて地域、国、社会による課題の類似点や相違点についても議論する。

