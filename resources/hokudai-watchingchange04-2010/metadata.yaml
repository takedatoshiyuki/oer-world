description:
  ja: ウェブを中心に拡大する情報環境を背景に、文章・画像・映像・音楽の広がりを取り上げる。あわせて、情報技術がもたらす「光」と「影」を見て、自分を守るために影を理解する視点を扱う。
quotedDescription:
  text:
    ja: いまや、世界はウェブを中心に回っています。あらゆる種類の文章、画像、映像、音楽が猛烈な勢いで増え続けています。それらは誰でもが自由に手に入れられ、何の価値もなかった”つぶやき”が社会を変えるかもしれません。プロメテウスが人間に与えた火の如く、情報技術が若い世代に与えた新しい「光」は「影」をも生み出します。本講義では、光のもたらす変革の予感を知る一方で自分を守るために影を理解します。
