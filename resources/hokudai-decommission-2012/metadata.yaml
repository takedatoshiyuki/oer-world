name:
  ja: 土曜市民セミナー 原子力発電所の廃炉と放射性廃棄物の処分（2012）
description:
  ja: 福島第一原子力発電所事故後に生じる廃炉関連の課題を扱い、除染廃棄物や汚染水、溶融燃料、原子炉解体で生じる廃棄物の処理・処分を取り上げる。あわせて、原子炉の廃炉方法、解体廃棄物の種類と量、使用済核燃料の再処理、放射性廃棄物の処分方法と安全性を解説する。
quotedDescription:
  text:
    ja: 福島第一原子力発電所の事故から２年。福島の環境修復から生じる除染廃棄物、発電所内の溶融燃料、汚染水、原子炉の解体で生じる廃棄物等の安全な処理・処分が大きな課題となっている。ここでは、通常の運転の末に役目を終えた原子炉の廃炉方法とその技術、廃炉で発生する解体廃棄物の種類と物量、使用済核燃料の再処理方法とその利点などを解説する。また、現在進められている放射性廃棄物の処分方法とその安全性を整理した上で、福島の復興と未来の地球環境のために我々が為すべきことを考えたい。
