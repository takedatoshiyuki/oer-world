  ja: 第2次世界大戦後の日本における政治と行政の歴史を概略的に扱い、参考文献やヴィデオ教材、日々の新聞も参照しながら現代日本政治への理解を深める内容である。公開されている教材は、第2講、第3講、第10講の予習プリントである。
