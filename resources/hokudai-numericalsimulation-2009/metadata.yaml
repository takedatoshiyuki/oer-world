name:
  ja: 大学院教育 広域シミュレーション特論(2009)
description:
  ja: 大型構造物や地殻の運動・破壊挙動、地殻中の移動現象を計算する広域シミュレーション手法を扱う講義である。移動現象の方程式と数値解法に加え、DEMによる離散系力学の計算方法、FEMの基礎理論と計算手法の概要、大規模計算に向けた計算容量削減法と連立方程式の高速解法まで学ぶ。
quotedDescription:
  text:
    ja: '大型構造物・地殻の運動・破壊挙動や、地殻中の移動現象を計算する広域シミュレーション手法について学習します。さまざまな移動現象を記述する方程式と数値解法について理解するとともに、離散要素法（DEM）に代表される離散系力学の計算方法について学びます。さらに有限要素法（FEM）の基礎理論と計算手法の概要を理解した上で、大規模計算のための計算容量削減法と連立方程式の高速解法についても学びます。

      本編撮影年度：平成20年度前期（第8～13回）

      第2回以降の講義はこちら

