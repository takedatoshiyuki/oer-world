name:
  ja: 農業機械学専門外書講義
description:
  ja: 『Agricultural Robots』をテキストに、担当箇所の内容を英語で発表し、討議する形式の講義である。PowerPoint作成や英語論文の書き方、英語での発表用資料の作成方法も扱う。国立台湾大学とのジョイントクラスとして、遠隔講義室から台湾大学の学生・教員とリアルタイムで議論する。
quotedDescription:
  text:
    ja: '英語の専門用語力，発表能力，論文作成能力を高めるため，”Agricultural Robots”をテキストとして使用し，自分の担当部分に関してパワーポイントの作成と英語でのプレゼンテーション，討議を行う。これにより，英語でのプレゼン能力だけでなく，議論する能力，コミュニケーション能力を養う。さらに，英語論文の書き方および英語での発表用資料の作成方法を身につける。

      本授業は国立台湾大学とのジョイントクラスとし，遠隔講義室でビデオ会議システムを用いてリアルタイムの英語による議論を台湾大学の学生，教員とも行う。'
