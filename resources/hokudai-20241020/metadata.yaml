name:
  ja: 第2回 高等教育研究セミナー 「ミネルバ大学を解剖する」
description:
  ja: 北海道大学が実施する高等教育研究セミナーの第2回の記録映像で、ミネルバ大学を題材にした話題提供と指定討論を収録する。ミネルバ・モデルを構成する要素として、汎用性と専門性、反転授業、学生のキャリア、教職員のあり方などが取り上げられる。参加者との議論も含み、関連論点を複数の観点から扱う。
quotedDescription:
  text:
    ja: '北海道大学 高等教育推進機構 高等教育研究部では、国内外の高等教育研究及び実践の共有を目的として高等教育研究セミナーを実施しております。この動画は、第2回 高等教育研究セミナー「ミネルバ大学を解剖する」の記録映像です。

      本セミナーでは、松下佳代編著『ミネルバ大学を解剖する』（東信堂、2024年）の著者による話題提供と、本学情報基盤センターの重田勝介教授による指定討論が行われ、参加者との間でインタラクティブな議論が展開されました。参加者からは、ミネルバ大学が掲げる汎用性と専門性の関係、反転授業において事前学習に取り組まない学生への対応、大学卒業後の学生のキャリア、特殊な環境での教職員のあり方など、ミネルバ・モデルを構成する各要素についてさまざまな論点が提起されました。

      >>　活動報告'
