  ja: '防災研究所特別講演会「気候変動への挑戦－Tackling Climate Change: A System of Systems Engineering Perspective」'
description:
  ja: この講義は、気候変動への対応をSystems of Systems Engineeringの枠組みから捉え、統合的・適応型のアプローチを扱う。参加型の方法を通じて、ステークホルダーの価値観を反映しながら持続可能性や公平性を目指す考え方を示す。後半では、講演者自身の研究者・教育者としての姿勢についても述べる。
quotedDescription:
  text:
    ja: '講演概要

      気候変動に取り組む責任ある統制に向けた、Systems of Systems Engineering の枠組みをベースとした統合的・適応型アプローチを提唱します。System of Systems
      Engineering の枠組みは、参加型アプローチを用いて様々なステークホルダーの価値観を反映しつつ、持続可能性や公平性といった目標を達成することが可能です。セミナー後半には、講演者が研究者・教育者として心がけていることについてお話しいただきます。'
