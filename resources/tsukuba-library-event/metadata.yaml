description:
  ja: 公共図書館で行われる乳幼児向けサービスのうち、講座や展示会などのイベントに注目し、乳幼児のいる家庭で実際に評価されている内容を調べる研究発表である。そこで得た結果をもとに、今後の公共図書館でのイベント提案につなげることを目的とする。
quotedDescription:
  text:
    ja: '坪井優美さん（筑波大学 大学院 図書館情報メディア研究科 博士前期課程）による「乳幼児のいる家庭向けのイベントの評価」の研究発表。

      公共図書館で行われている乳幼児サービスの中で、講座や展示会などのイベントにはまだ検討すべき課題がある。乳幼児のいる家庭で実際に評価されているイベントは何かを明らかにし、今後の公共図書館でのイベント提案を目的として研究を行っている。'
