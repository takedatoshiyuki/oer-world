name:
  ja: サステナビリティ・ウィーク サステイナブルキャンパス 国際シンポジウム 地域と連携したサステイナブルキャンパスの構築 （2013）
description:
  ja: 本講義は、北海道大学のサステイナビリティ・ウィークで行われた国際シンポジウムを扱い、地域と連携してサステイナブルキャンパスを構築することを主題とする。日欧の大学による事例紹介に加え、北海道大学とEUの3大学による国際交流プロジェクト「UNI-Metrics」の成果も取り上げる。あわせて、地域や民間企業との連携を通じた将来像と構築の展望を議論する。
quotedDescription:
  text:
    ja: 'サステナビリティ・ウィークの一環として開催されるサステイナブルキャンパス国際シンポジウムは、今回で3回目を迎えました。昨年のシンポジウムでは、キャンパスを"Living Laboratory"として活用し、大学と地域が協働した持続可能な社会を構築する重要性に関する認識が共有されました。今回は「地域と連携したサステイナブルキャンパスの構築」をテーマに、日欧の大学からサステイナブルキャンパス構築の先進的な活動事例紹介や、今年12月に終了する本学とEUの3大学との国際交流プロジェクト"UNI-Metrics"の成果も発表します。地域や民間企業と連携したサステイナブルキャンパスの将来像と、その構築のための展望を描きます。

      サステイナブルキャンパス国際シンポジウム2013（オフィシャルサイト）

      13:00-13:15 　開会挨拶

      三上 隆（北海道大学理事・副学長）

      来賓挨拶

      都外川 一幸（文部科学省）

      13:15-13:30 　趣旨説明

      小篠 隆生（北海道大学大学院工学研究院）

      13:30-15:05 　講演―地域と大学との協働プログラムの紹介

      ・UDCK as a Collaboration Hub for Sustainable Urban Design

      出口 敦 (東京大学)

      ・North West Cambridge

      Heather Topel (University of Cambridge)

      ・社会に開かれた個性輝く大学キャンパス形成

      都外川 一幸（文部科学省）

      15:20-16:35 　講演―UNI-Metrics"の成果と今後

      ・サステナビリティに関する大学評価指標の適用：北大とトリノ工科大の場合↓藤井 賢彦（北海道大学大学院地球環境科学研究院）

      ・Knowledge

      Place and Economy: Smart Specialization and the Triple Helix framework in Amsterdam and Sapporo

      Joao Romao (VU University Amsterdam)

      ・University Campus Energy Management: the POLITO case study and the UNI-metrics indicators application

      Giulia Sonneti (Polytechnic of Turin)

