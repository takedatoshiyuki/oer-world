  ja: THINKING PROCESSES
description:
  ja: 思考スキルを伸ばし、考え同士を論理的につなぐための方法を扱う講義である。さらに、アイデンティティに関わる社会的・文化的な問題を踏まえつつ、批判的な議論を行う。読解、執筆、発表、反論、意見交換の学術的な作法も継続的に扱う。
quotedDescription:
  text:
    ja: This course will focus on the development of thinking skills and strategies for creating logical
      relationships between thoughts. Critical arguments will be required and developed, and this will
      be done with consideration to social and cultural issues surrounding identity. Assessment is based
      on written assignments, discussions, and presentations; the class will serve as an ongoing workshop
      on academic protocols in reading, writing, presenting, challenging, and exchanging ideas.
