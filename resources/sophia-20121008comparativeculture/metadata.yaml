name:
  ja: China’s Development Prospect beyond the Middle-Income Level
description:
  ja: 中国が上位中所得国に位置づけられたことを踏まえ、その発展段階における課題を扱う講義資料である。社会経済構造の転換や中所得国の罠に関わる論点を取り上げ、国際比較の視点から中国の対応可能性を検討する。
quotedDescription:
  text:
    ja: Earlier this year, China was officially upgraded by the World Bank to the rank of the “upper middle-income
      countries”. This is a milestone of the country’s remarkable achievements over thirty years of rapid
      and persistent economic growth. Nevertheless, China now faces a series of challenges in a profound
      transition of its social-economic structure. Whether China is able to meet these challenges will
      determine its chance to avoid the so-called “middle income trap” in the coming decades. This seminar
      will discuss these challenges and assess China’s ability to meet the challenges in an internationally
      comparative perspective.
