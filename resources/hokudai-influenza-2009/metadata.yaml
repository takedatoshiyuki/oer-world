name:
  ja: 北海道大学プロフェッサー・ビジット インフルエンザウイルスの生態（2009）
description:
  ja: 鳥インフルエンザや豚インフルエンザウイルスの人への感染を取り上げ、人獣共通感染症の予防と制圧を考える講義である。インフルエンザを含む感染症に対して、先回りして克服するための考え方を説明する。
quotedDescription:
  text:
    ja: '鳥インフルエンザが世界各地で発生し、最近ではメキシコ他で豚インフルエンザウイルスが人に感染し、社会を脅かしています。

      インフルエンザを含む人獣共通感染症を予防・制圧するための「先回り克服戦略」を説明し、理解を深めてもらいます。

      訪問校：滝川高等学校 2009年11月9日'
