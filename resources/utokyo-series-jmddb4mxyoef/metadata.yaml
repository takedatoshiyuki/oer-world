description:
  ja: 本講座は、「防ぐ」を手がかりに、さまざまな分野の話題を扱う東京大学の公開講座である。科学がどのように人を守るかという観点から、関連する最先端の内容とその広がりを紹介する。
quotedDescription:
  text:
    ja: 私たちはリスクの中で生きています。しかし、日々の暮らしの中でその存在に気づくことは少なく、むしろ、何か予想しない事故や事態が起こってしまったときに初めて驚き、慌てふためき、なぜそれを未然に防げなかったかと悔みます。
      本講座では様々な視点から「防ぐ」を対象とした最先端の話題をわかりやすく紹介し、科学が私たちを守ろうと奮闘しているようすをご覧いただくとともに、「防ぐ科学」の広がりとその魅力を共有する機…
