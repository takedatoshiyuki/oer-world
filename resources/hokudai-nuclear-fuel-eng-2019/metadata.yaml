  ja: 核燃料工学を主題に、軽水炉燃料のふるまいから照射挙動、ペレットや被覆管の挙動、相互作用と破損までを段階的に扱う。後半ではシビア・アクシデントとTMI事故を取り上げ、最後に照射試験と照射後試験を扱う。
