name:
  ja: 火災発生時の対応について
description:
  ja: 学内で火災が起きた場合の対応を扱い、警備員がすぐに来られない場合を含めて、通報や初期消火などの行動を整理する教材である。火災発生時に行うべきことを事前に確認する内容で、英語で提供される学内向けの研修・ガイダンスとして作られている。
quotedDescription:
  text:
    ja: '学内で火災が発生した場合、キャンパスに常駐する警備員が急行することになっています。

      しかし、構内全ての建物に警備員が常駐しているわけではありません。

      遠方の待機場所から駆けつけるまでに時間がかかる場合もあり、その場合は通報や初期消火を自分たちで行う必要が生じます。この動画では、火災が発生した場合に私たちが行うべき行動をまとめています。

      いざというときに慌てないよう、事前に対応を確認しておきましょう。'
