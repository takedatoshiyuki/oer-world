name:
  ja: International History 国際関係史
description:
  ja: 1648年から1948年までのヨーロッパを中心とする国際関係史を扱う講義で、近代国際社会の成立から冷戦初期までを射程に入れる。講義では、ウエストファリア体制、第一次世界大戦、パリ講和条約、第二次世界大戦に至る過程などをたどる。履修者数によっては学生の口頭報告も組み込む。
quotedDescription:
  text:
    ja: 'International history in Europe from 1648 to 1948.

      近代国際社会の成立から冷戦初期にいたる間のヨーロッパを中心とする国際関係の歴史を講述する。履修者数により学生の口頭報告も組み込む。

      Contents of Lectures

      10

      Lectures /

      3

      Videos

      WK1

      6 SEPTEMBER

      INTRODUCTION: “WHAT IS HISTORT AND IS IT BORING?”

      WK2

      11 & 13 SEPTEMBER

      HOW ‘INTERNATIONAL’ IS INTERNATIONAL HISTORY?

      WK3

      18 & 20 SEPTEMBER

      WESTPHALIA AND THE ‘PRE-INTERNATIONAL’ SYSTEM

      WK4

      25 & 27 SEPTEMBER

      GREAT POWER RIVALRY AND THE FIRST WORLD WAR, 1900-17

      WK5

      9 & 11 OCTOBER

      THE PARIS PEACE TREATY AND THE SEARCH FOR EUROPEAN STABILITY, 1917-29

      WK6

      16 & 18 OCTOBER

      EAST ASIA AND THE ORIGINS OF THE PACIFIC WAR, 1900-41

      WK7

      23 & 25 OCTOBER

      COLONIALISM, IMPERIALISM, AND WORLD WAR, 1900-45

      WK8

      30 OCTOBER & 1 NOVEMBER

      THE PATH TO THE SECOND WORLD WAR, 1930-39

      WK9

      6 NOVEMBER

      THE SECOND WORLD WAR (1)

      THE SECOND WORLD WAR (2)

      THE SECOND WORLD WAR (3)

      WK10

      13 & 15 NOVEMBER

      A ‘NEW’ INTERNATIONAL SYSTEM, 1945-2018'
