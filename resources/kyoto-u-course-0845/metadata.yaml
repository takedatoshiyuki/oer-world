name:
  ja: 第8回国際シンポジウム “Human Survivability Studies (HSS) and the Sustainable Development Goals (SDGs) in Asia”
description:
  ja: アジアにおける持続可能な開発目標を主題に、人口増加や経済成長、環境悪化、自然災害、社会不安定性などの状況を背景として扱う国際シンポジウムである。基調講演者を交え、京都大学総合生存学館の教員と学生が各自の研究関心をSDGsと結びつけて議論する。あわせて、人間の生存可能性研究を今後どのように発展させるかを検討する。
quotedDescription:
  text:
    ja: 'Short Summary

      This international symposium focuses Sustainable Development Goals (SDGs) in Asia, which is the
      most developing area in the world in terms of population growth, industrial and agricultural development,
      and economic growth. The area also has many risks such as environmental degradation, natural disasters,
      and social instability. Inviting a couple of keynote speakers who provide insights about hot issues
      in Asia, the GSAIS faculty members and students of GSAIS will discuss their own research interests
      in relation to SDGs with the keynote speakers and other participants and will achieve some conclusion
      how to further enhance human survivability studies for solving global issues.'
