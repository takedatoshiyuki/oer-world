name:
  ja: Physics of Transition Metal Oxides
description:
  ja: 遷移金属酸化物の結晶構造と基本的な物性を概観し、絶縁性、金属性、半導性、超伝導性、磁性、強誘電性などの酸化物の振る舞いを扱う講義である。さらに、欠陥、表面、界面がそれらの性質に及ぼす要因にも触れる。
quotedDescription:
  text:
    ja: 'This lecture covers the structure and physics of transition metal oxides on a general level.

      We will review the crystal structures of transition metal oxides and discuss the various properties
      that oxide materials can have, covering insulating, metallic, semiconducting, superconducting, magnetic,
      ferroelectric, and other oxide materials. We will also look at factors that influence the properties
      of oxides, namely the effects of defects, surfaces, and interfaces.'
