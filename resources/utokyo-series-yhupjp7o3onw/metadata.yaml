description:
  ja: 19世紀後半のフランスで活躍した印象派画家を取り上げ、西洋絵画がどのように変化したかを考える講義である。作品の紹介を通して、主題やモチーフ、様式、技法、展示方法までを対象にし、印象派の絵画が従来の常識や価値基準に及ぼした変化を扱う。
quotedDescription:
  text:
    ja: 19世紀後半のフランスで活躍した印象派の画家たちは、西洋絵画を根本的に変革していきました。作品をスライドで具体的に紹介しながら、主題やモチーフ、様式や技法、さらには展示方法にいたるまで、印象派の絵画がもたらした革新性がそれまでの西洋絵画の常識や価値基準を転覆させるものであったことを浮き彫りにしていきます。
