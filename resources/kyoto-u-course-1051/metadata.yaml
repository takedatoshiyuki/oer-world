name:
  ja: スーパーグローバルコース数学オンライン集中講義２ “Spectrum of random graphs”
description:
  ja: 有限ランダムグラフと群のケイリーグラフにおける隣接作用素・ラプラシアン作用素のスペクトルを扱う講義である。スペクトル測度の定義とBenjamini-Schramm位相に対する連続性を導入し、さらに量子パーコレーションの枠組みでその正則性を考察する。最後に、ランダムグラフの極値固有値の収束を取り上げる。
quotedDescription:
  text:
    ja: 'We will study the spectrum of the adjacency and Laplacian operators of finite random graphs and
      Cayley graphs of groups. We first introduce their spectral measures and study their continuity properties
      with respect to the Benjamini-Schramm topology which we will define. We then explore the regularity
      properties of the spectral measure and put that into the framework of quantum percolation. The final
      part of the course is devoted to the convergence of extremal eigenvalues of random graphs.

      1回目から5回目までの講義資料（板書）を、以下の資料（6）よりご覧いただけます。'
  source: https://ocw.kyoto-u.ac.jp/course/1051/
