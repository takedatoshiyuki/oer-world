description:
  ja: 本教材は、RRIとELSIを扱う研究倫理セミナーである。責任ある研究とイノベーションをめぐる講演に加え、複数の学問分野からの視点の共有と議論、学内各部局の取り組み紹介を含む。
quotedDescription:
  text:
    ja: '2023年度研究倫理セミナーでは、「責任ある研究とイノベーションを考える―取組に向けて―」をテーマに、RRI(Responsible Research and Innovation：責任ある研究とイノベーション)やELSI
      (Ethical, Legal and Social Issues：倫理的・法的・社会的観点)に関する講演を行います。

      また、RRIやELSIについて、様々な学問分野からの視点を共有、議論します。

      学内の各部局における良い取り組みについても紹介します。

      登壇者：岸本充生、藤垣裕子、松田康弘、新野俊樹、福永真弓、池谷裕二、馬場紀寿'
