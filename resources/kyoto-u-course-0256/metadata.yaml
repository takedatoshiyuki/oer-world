name:
  ja: 第113回 京都大学丸の内セミナー「人類に脅威にも福音にもなるアルファ放射体（アクチノイド系列元素）」
description:
  ja: アルファ放射体（アクチノイド系列元素）をめぐり、放射性廃棄物の長期毒性とがん治療への応用を同じ視点で扱う講義である。伝播性がん治療薬、Ac-225 を用いる DDS、マイナーアクチノイドの短寿命化研究、さらに事故デブリを含む研究上の課題までを紹介する。
quotedDescription:
  text:
    ja: '放射性廃棄物の長期毒性と伝播性がん治療薬は相反するように見えますが、 アルファ放射体が発生するアルファ粒子の確実な細胞致死性という点で 一致します。

      　このアルファ放射体の学術体系構築が急務となっています。 ここ2-3年、伝播性ガン治療薬用の放射性医薬品分子が末期ガン患者の 治療に成功する成果を上げています。

      　原子炉からの放射性廃棄物から集められたウラン（U-233）の孫の核種である アルファ放射体のアクチニウム（Ac-225）はドラッグデリバリーシステム （DDS）に装荷して投与すると、伝播性がんに最高の治療効果をもたらすと
      されます。

      　他方、核燃物質の極微少量研究手法の提供も必要とされています。 放射性廃棄物中の超長寿命（100万年程度）のアルファ放射体（マイナー アクチノイド）を破壊し人類が管理可能に短縮（200年程度）する研究が
      求められていますが、規制厳格化のため極微少量の研究手段が必要です。

      　福島第一原子力発電所の事故デブリを含め、研究や人材供給における 先端的関わりが求められます。

      講演では、このようなアルファ放射体（アクチノイド系列元素）の研究に ついてご紹介したいと思います。'
