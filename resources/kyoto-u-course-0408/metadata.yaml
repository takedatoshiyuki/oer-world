  ja: 第24回 知的コラボの会「教育・学習データの利活用における国内外の研究動向と課題」
description:
  ja: 大学教育における教育の情報化と、それに伴って蓄積される教育・学習データを扱う。講義では、教育・学習データの蓄積と分析を目的とするラーニング・アナリティクス研究の概要を示し、今後の課題を議論する。
quotedDescription:
  text:
    ja: 'コース概要

      近年の情報通信技術の発展により、大学教育において、e-Learning の導入など、教育の情報化が推進されており、教育・学習活動に関する膨大な量のデータが急速に蓄積されつつあります。今回はこのような教育・学習データの蓄積と分析を目的としたラーニング・アナリティクスの研究の概要を紹介し、今後の課題について議論します。'
