name:
  ja: 北海道大学公開講座 ２０３０年へのシナリオ 日本の物価を考える（2013）
description:
  ja: 本講義は、日本経済の転換点として第2次安倍政権の発足と政府・日銀の関係を取り上げる。物価を手がかりに、日銀の金融政策と政府の累積債務問題の今後を考察する。
quotedDescription:
  text:
    ja: '第2次安倍政権発足によって日本経済は大きな転換点を迎えています。特に注目されているのが政府と日銀との関係です。安倍政権の目指す「レジームチェンジ」によって日本経済はどこへ向かうのでしょうか。本講義では、日銀の金融政策と政府の累積債務問題の未来を「物価」という視点から考えます。

      教員紹介

      工藤 教孝

      1973年山口県生まれ。1996年立命館大学経済学部卒業。2000年ニューヨーク州立大学大学院経済学研究科修了。Ph.D.(経済学)。一橋大学経済学研究科講師、関西大学経済学部助教授を経て、2005年度より北海道大学経済学研究科助教授(2007年度より准教授)。
      2015年10月より名古屋大学経済学研究科教授。

      専門はマクロ経済学。共著書『サーチ理論』(東京大学出版会、2007年)。『日経ビジネス』や『日本経済新聞』などへの寄稿も行う。'
