  ja: Special Seminar:”Effect of Fukushima Nuclear Power Plant Accident, Explanation and Q&A session”
description:
  ja: 東日本大震災による福島第一原子力発電所事故を題材に、事故の影響について説明し、その後に質疑応答を行う講演会の記録である。公開資料として講義資料が2件付属しており、事故に関する説明と参加者からの質問への応答を含む内容になっている。
quotedDescription:
  text:
    ja: "Special Seminar: “Effect of Fukushima Nuclear Power Plant Accident, Explanation and Q&A session”\
      \ \n The Fukushima nuclear power plant accident caused by the east Japan Earthquake is causing anxieties,\
      \ not only for Japan but also all over the world. The Faculty of Liberal Arts and Faculty of Science\
      \ and Technology have invited Dr. Matsumoto, who is a leading authority in this field to speak.\
      \ The presentation is open for all Sophia members interested in receiving correct information, asking\
      \ questions and understanding what is really happening and how we should react to it."
