name:
  ja: 第9回 地球研地域連携セミナー HOKKAIDO ユーラシアへのまなざし（2011）
description:
  ja: 2011年6月12日に北海道大学学術交流会館で開催された第9回地球研地域連携セミナーの資料をまとめた教材である。国境、シベリア永久凍土、中央ユーラシア、シベリアの村、環境共同体構築をめぐる講演とパネルディスカッションを収録する。
quotedDescription:
  text:
    ja: '2011年6月12日 北海道大学学術交流会館で開催された、第9回 地球研地域連携セミナーの資料をご覧いただけます。

      主催：北海道大学、総合地球環境学研究所

      プログラム

      13:00-13:10　開会挨拶

      13:10-13:20　趣旨説明

      13:20-14:00　基調講演1:国境について考える

      14:00-14:40　基調講演2:シベリア永久凍土と地球環境

      14:40-14:55　休憩

      14:55-15:20　講演1:中央ユーラシアの今を生きる

      15:20-15:45　講演2:途絶化するシベリアの村─ソ連崩壊と温暖化

      15:45-16:10　講演3:川下・風下から取組む環境共同体構築の試み

      16:10-16:25　休憩

      16:25-17:20　パネルディスカッション

      17:20　　　　　閉会挨拶

      ＜関連情報＞

      第2回アムール・オホーツクコンソーシアム国際会合： 環オホーツク地域の環境データ共有化にむけて'
