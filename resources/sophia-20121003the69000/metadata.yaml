name:
  ja: 宗教的共生の思想／SOPHIA FOR RELIGIOUS CONVIVIALITY
description:
  ja: この講義は、宗教的共生というテーマのもとで、宗教的知恵に向き合いながら共生のあり方を考える。輪講形式で進み、各分野の教員がそれぞれの視点から語る構成になっている。
quotedDescription:
  text:
    ja: 3：11の自然災害と原発の暴発による自然と人間の破滅的状況は、現代世界における地球環境の破壊と民族・国家間の平和の破綻を象徴するかのようである。このような人間と人間、人間と自然との深い絆が引き裂かれた終末的状況において、新しい生活の仕方や和解と共生の生き方が深く問われている。|本講義は、その問いに応じて人間に示された宗教的知恵に耳を傾け、問いを深めると同時に共生の新しい次元を披こうと試みる。その意味で「宗教的共生の思想」というテーマの下に、各分野で思索と実践に富んだ先生方が皆さんに語りかける輪講形式をとる。多彩で深い講義群に期待あれ。
