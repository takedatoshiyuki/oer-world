name:
  ja: GCOE総合博物館市民セミナー 詩人ゲンナジイ・アイギと言語の境界（2011）
description:
  ja: この講義は、詩人ゲンナジイ・アイギの作品と言語使用を扱う。ロシア語とチュヴァシ語の二言語で詩を書いた経緯と、それぞれの言語が詩の世界にどう関わるかを取り上げる。
quotedDescription:
  text:
    ja: 'チュヴァシ民族出身の詩人ゲンナジイ・アイギは、ロシア語の詩作品を通してその名が広く知られるようになりました。その一方で、彼は母語であるチュヴァシ語でも創作を続け、これら二つの言語を使って、それぞれ異なる作風の詩を書き分けていました。セミナーでは、アイギのことをよく知るアトネル・フザンガイ氏が、詩人の二言語使用にいたるいきさつや、用いられる言語と詩の世界の関係について、詳しく解説します。

      ‡ これらの資料は制限資料です。'
