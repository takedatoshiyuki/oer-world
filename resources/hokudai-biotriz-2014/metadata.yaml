name:
  ja: バイオミメティクス市民セミナー 生物の不思議を工学に生かす －バイオＴＲＩＺという考え方－（2014）
description:
  ja: 自然界に見られる生物機能を工学技術へ移すための手法として、バイオTRIZを扱う。講義では、その基礎から最新の研究動向までを紹介し、生物の知恵を手がかりに技術上の矛盾を解決する考え方に触れる。
quotedDescription:
  text:
    ja: '近年、高効率・高性能な生物機能を材料設計に取り入れる生物模倣工学の研究が活発に進められています。

      しかしながら、発明者の発想に頼ったケースバイケースでの材料設計が主となっており、生物の機能を工学技術に移転する手法の体系化は、非常に困難なのが現状です。

      本講演では、自然界に見られる高効率な生物機能を簡便かつ能率良く、工学技術に移転できる手法「バイオＴＲＩＺ」について、基礎から最新の研究動向までを紹介します。

      この方法では、生物の知恵をヒントにすることで、研究者が抱える技術矛盾を解決することが期待できます。'
