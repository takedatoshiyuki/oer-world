description:
  ja: 北海道大学の奥聡による、英語科教員対象セミナーの講演資料を公開する教材である。英語テキストを「ただ訳す」だけでなく、書き手とのコミュニケーションとして読む考え方を扱う。公開資料としては配布資料1件が含まれる。
quotedDescription:
  text:
    ja: "2022年 1月11日（火）に実施された、「2021年度 第2回 英語科教員対象 英語教育セミナー Reading beyond “Translation” : How to Read\
      \ English Texts Creatively to Communicate with the Author（｢ただ訳す」のではない：書き手との創造的なコミュニケーションのために）」より、北海道大学\
      \ 奥聡先生の講演を一般公開いたします。講演は、英語科教員に向けて英語で実施されました。\n \n■ プログラムと配布資料\nReading beyond “Translation”: How\
      \ to Read English Texts Creatively to Communicate with the Author\n｢ただ訳す」のではない：書き手との創造的なコミュニケーションのために\n\
      北海道大学教授　奥　聡　氏（理論言語学）\n>> 配布資料（handout）\n \n■ 開催情報\n第2回　英語科教員対象　英語教育セミナー Reading beyond “Translation”\
      \ (2021)\n開催日時：２０２２年１月１１日（火）　15：00～17：30（14：30受付開始）\n開催会場：クラーク記念国際高等学校　札幌大通キャンパス\n対象者：英語科教員、小・中・高等学校教員、教育関係者等\n\
      ※ 英語4技能や今後の英語教育に興味・関心のある方はどなたでも参加可"
