name:
  ja: 電気電子回路演習
description:
  ja: この教材は、USB実験装置を使って自宅でも回路実験を行える電気電子回路の演習である。線形代数や微積分の基礎知識を土台に、LTspiceやOctaveを用いながら、回路のシミュレーションから実際の装置の作成までを扱う。例題資料として結合共振器、昇圧コンバータ、移相型発振回路が公開されている。
quotedDescription:
  text:
    ja: 学生１人に１台のUSB実験装置を貸与し、自宅においても回路実験が可能な環境を整えることにより、主体的な学びを実現することを目的とした演習。線形代数や微積分の基礎的な数学の知識から、回路シミュレータLTspiceや数値計算ツールoctaveも利用しながら、実際に動作する装置を作るところまで、自ら課題設定をしながら実施する。
  source: https://ocw.kyoto-u.ac.jp/course/3/
