name:
  ja: 第83回 京都大学丸の内セミナー「花はなぜ春がわかるのか？～季節を測る分子メカニズム～」
description:
  ja: 植物が、変化する環境の中で決まった時期に花を咲かせる仕組みを、開花時期を調節する遺伝子のはたらきから考える講義である。さらに、数週間前の気温情報が花の時期の制御にどう関わるかを取り上げ、季節の変化を測る分子メカニズムを扱う。
quotedDescription:
  text:
    ja: '自然の中では、環境が刻々としかも複雑に変化します。植物は、こうした変動する環境下で決まった時期に花を咲かせます。じっとして動かないように見える植物ですが、生きるための様々な機能を持ち、それらを駆使して、葉を広げ、水を吸収し、花を咲かせて実を結びます。その機能が、少々の環境変動で誤作動していては、自然界で生きていくことは難しいでしょう。そのためこれらの機能を支える遺伝子の働きにも、自然の中で十分能力を発揮できるような仕組みがあるはずです。

      　遺伝子の研究というと、高度な設備が整った研究所の実験室内だけでおこなわれていると考えるかもしれません。しかし、分子遺伝学的手法の発達とともに、遺伝子を野外で研究することができるようになりました。

      　本講演では、開花の時期を調節する遺伝子の「生態学」を紹介します。特に、植物が、数週間前に経験した気温を覚えているかのように、花の時期を調節することについてお話したいと思います。皆さんは、2週間前は温かかったか、寒かったか、覚えていますか？6週間前ならどうですか？'
