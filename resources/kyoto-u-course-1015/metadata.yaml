name:
  ja: KURA「研究者の歩きかた」セミナー；L-INSIGHT/KURA連携プログラム パブリッシングセミナー 「ジャーナルを可視化する」
description:
  ja: ジャーナルを多くの人に届けるための可視化と広報の手法を扱うセミナーである。Google検索で上位表示を目指す対策や、国際的なOAジャーナルデータベースへの登録、SNSを通じた情報発信を取り上げる。ジャーナル実務に関わる編集スタッフ、研究者、大学院生、図書館員を主な対象としている。
quotedDescription:
  text:
    ja: '自分たちのジャーナルをもっと多くの人に届けたい！ 国際的なオープンアクセスジャーナルとしてきちんと認められたい！ 広報手段として今や欠かせないSNS。安全に、効果的に活用したい！ でも、何から始めればよいものか……？
      そんなお悩みをお持ちの方も多いのではないでしょうか。

      本セミナーでは、Googleで検索上位になるための対策、国際的なOAジャーナルデーターベースへの登録、SNSを通じた情報発信など、すぐに使えるテクニックが学べます。ジャーナルを担当する編集スタッフ、担当になってしまった研究者や大学院生などジャーナル実務に関わる方、実務担当者へのアドバイスをお考えの図書館員の方にもオススメです。

      京都大学 学術研究支援室https://www.kura.kyoto-u.ac.jp/event/20210119/'
