name:
  ja: 現象学へのプロレゴメナー ーフッサール現象学を中心として
description:
  ja: フッサールの現象学を、ハイデッガーを含む20世紀ヨーロッパの思想の流れの中に位置づけて扱う講義である。あわせて、その方法と理念を取り上げ、14回の連結講義として現象学の全体像に迫る。
quotedDescription:
  text:
    ja: '授業の特色

      フッサール現象学をハイデッガーやその他20世紀のヨーロッパの思想運動の中でとらえながらその方法と理念をテーマ化している。

       

      授業の紹介

      この講義はフッサールの現象学を20世紀の思想運動の中に位置づけつつ、しかも理念と方法に立ち入って明らかにした。講義は14回の連結であり、最終的にフッサールの現象学の全ぼうを明らかにする。'
