description:
  ja: 現代代数学の基礎を扱い、群論と環論を含む講義である。毎週の講義1時限と演習2時限で構成され、線形代数学IIの既修を前提としている。講義資料と13本の動画が公開されている。
quotedDescription:
  text:
    ja: 'Introduction to modern algebra. Includes group theory and ring theory. One period of lecture
      and two periods of recitation weekly. Prerequisite: Linear Algebra II.

      Recommended to be taken after BASIC CONCEPTS IN MATHEMATICS I.

      現代代数学の基礎を学ぶ。群論，環論など。 毎週講義1時限，演習2時限。線形代数学 II を既修のこと。

      さらに数学通論 I の既修が望ましい。

      Contents of Lectures

      2

      9

      Lectures / 13 Videos'
