name:
  ja: 量子力学 第3
description:
  ja: 量子力学第一、第二に続く講義として、学部から大学院初等レベルの量子力学を一通り扱う。内容は散乱理論、相対論的量子力学とスピン、多電子系の量子力学、第2量子化、多電子原子、光と物質の相互作用で構成される。
quotedDescription:
  text:
    ja: '現代科学技術の多く側面は量子力学を含む物理学に基礎を  おいている。本講義は、量子力学第一、第二に引き続くもので、この講義によって学部ないし大学院初等レベルの量子力学が完結する。

      本講義  の内容は、固体物理学、統計力学、量子エレクトロニクスなどに引き継がれるものであり、また数学的側面は、微分方程式論、積分方程式論、  固有関数理論、代数学などと密接に関連している。

      具体的な議論のテーマは、次のものである。

      ・散乱理論

      ・相対論的量子力学とスピン

      ・多電子系の量子力学

      ・第2量子化

      ・多電子原子

      ・光と物質の相互作用'
