description:
  ja: 社会構造、社会的機能、社会変動の理論的なつながりを押さえたうえで、日本社会と宗教制度・教団の関係を歴史的に扱う。さらに、近年の動向も踏まえつつ、現代のカルト問題を事例として日本社会の社会秩序を検討する。
