name:
  ja: 東京大学公開講座「想像力」
description:
  ja: この講座は、想像力を現在の知覚や過去の記憶、仮想世界との関係から考える。さらに、想像力を現実に根ざしてあるべき姿を探る働きとしても捉え、多面的に扱う。
quotedDescription:
  text:
    ja: 「想像力こそは諸能力の女王」と言ったのは、19世紀フランスの詩人・批評家ボードレールです。 想像力は、現在の知覚や過去の記憶を糧としながらそれらの限界を押し広げ、仮想世界へと人間を解き放ちます。しかしそれはまた、空想や幻想とは違い、あくまでも現実的所与に立脚しながらあるべき様態を探る、真理探究の能力でもあります。
      本公開講座では、この諸能力の女王の仕事ぶりを多面的に探ります。
