  ja: 分子コンピューティング
description:
  ja: 分子コンピューティングを、計算機科学と化学・生物学の接点にある分野として扱う講義である。DNAを中心とした生体分子の化学反応による情報処理と、情報技術を用いた生体分子の設計・反応制御を取り上げる。あわせて、関連分野を通じて計算機科学の化学・生物学への展開を概観する。
quotedDescription:
  text:
    ja: 分子コンピューティングは、計算機科学と化学・生物学の境界領域として勃興しつつある研究分野である。DNAを中心とした生体分子の化学反応により情報処理機構を実現するとともに、情報技術を駆使して生体分子の設計やその化学反応の制御を行うことを目標としている。本講義は、分子コンピューティングとその関連分野について解説することにより、計算機科学の化学・生物学への展開について眺望する。
