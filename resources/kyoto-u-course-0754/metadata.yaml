name:
  ja: Generic vanishing and the birational geometry of irregular varieties
description:
  ja: この講義は、generic vanishing の結果とその双有理幾何への応用を扱う。対象は不規則多様体で、アーベル多様体のコホモロジー的特徴付け、アーベル多様体上の因子の特異点、pluricanonical
    maps などを議論する。さらに、最大 Albanese 次元をもつ底空間を持つ fiber space に対する Iitaka 予想の結果にも触れる。
quotedDescription:
  text:
    ja: 'Course Description

      In these lectures we will survey the generic vanishing results of Green, Lazarfeld, Hacon, Popa,
      Pareschi and others and discuss their applications to the study of the birational geometry of irregular
      varieties i.e. smooth projective varieties such that \(H^0(\Omega^1_X) \neq 0 \). In particular
      we will discuss results concerning the cohomological characterization of abelian varieties, the
      singularities of divisors on abelian varieties, the pluricanonical maps of irregular varieties and
      a recent result of Cao-Paun which proves the Iitaka conjecture for fiber spaces \(f:X \to Y \) where
      \(Y\) is a variety of maximal Albanese dimension (eg. an abelian variety).'
