name:
  ja: 原子力規制人材育成事業（*）オープン教材を活用した原子力規制人材育成プログラムの拡充「新型軽水炉安全工学」
description:
  ja: 原子力安全マネジメントの原理原則を、安全論理との関係の中で整理する講義資料である。放射線安全、プラントや環境における安全の考え方、リーダーシップとマネジメント、規制基準の基盤となる安全論理、深層防護に基づく安全設計の具体例までを扱う。
quotedDescription:
  text:
    ja: "新型軽水炉安全工学\n原子力安全マネジメントの基本となっている原理原則を他の分野における安全論理との関係の中で理解する。\n原子力・放射線に限らず、安全関係の実務に直面したときに、ルールや慣習が「なぜ、そのように決まっているのか」を推論できる能力を身に着ける。\n\
      \ \n■講義内容\n \n「新型軽水炉安全工学」の教材は全てCC BY-NCのライセンスで公開しています。\n \n講義１：安全と工学\n \n講義２：放射線安全の原則\n \n講義３：プラントにおける安全の論理\n\
      \ \n講義４：環境における安全の論理と廃棄物\n \n講義５：リーダーシップとマネジメント\n \n講義６：規制基準の基盤となる安全論理（1/2）\n \n    規制基準の基盤となる安全論理（2/2）\n\
      \ \n講義７：深層防護別にみる安全設計の具体例（1/2）\n \n    深層防護別にみる安全設計の具体例（2/2）"
