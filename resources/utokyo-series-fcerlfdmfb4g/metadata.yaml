name:
  ja: ワンヘルスの概念で捉える健全な社会（学術俯瞰講義）
description:
  ja: 人・動物・環境の相互関係を踏まえて健康を捉えるワンヘルスの考え方を基軸に、環境、食糧、感染症といった課題を地球規模で考える講義である。多分野の専門家を交えながら、健全で持続可能な社会を築くために必要な視点と課題を扱う。
quotedDescription:
  text:
    ja: 'コーディネータ：芳賀 猛

      ナビゲータ：梶谷 真司

      ワンヘルス（One Health）は、人、動物、環境は相互に密接な関係があり、それらを総合的に良い状態にすることが真の健康である、という概念です。グローバル化が加速し、世界的な人口増加の中、環境・食糧・感染症といった、人類共通の課題がクローズアップされてきます。このような課題の克服には、世界は一つ、健康も一つ
      ”One World, One Health” の観点から、地球規模で、分野横断的なアプローチが求められます。この講義では、広い分野から専門の先生を招き、ワンヘルスの概念を念頭に、健全で持続可能な社会を構築していくには、これからどのようなことが求められるか、考えていきます。'
