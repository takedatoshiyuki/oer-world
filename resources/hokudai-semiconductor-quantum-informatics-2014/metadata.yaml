name:
  ja: 大学院教育 半導体量子情報特論 [Semiconductor Quantum Informatics]（2014）
description:
  ja: 量子情報処理を題材に、量子ドットを含む半導体ナノ構造の基礎物理を扱う大学院講義である。関連論文の紹介と説明を学生が行う構成で、量子情報処理の基礎と、半導体ナノ構造をその実現にどう結びつけるかを学ぶ。
quotedDescription:
  text:
    ja: '//Course Objectives

      There is a growing interest in quantum information processing，in which semiconductor nano-structures
      represented by quantum dots are the candidates for the practical applications. We first review the
      semiconductor nano-structures where quantum mechanics is the physics characterizing essential properties.
      A special emphasis is on the presentation by students on introduction and explanation of related
      scientific papers.

      //Course Goals

      The final goal of this course is to understand the basic physics for quantum information processing
      and the potential use of semiconductor nano-structures for its realization.

      //Reading List

      ComputingExplorations in Quantum Computing／C. P. Williams，S. H. Clearwater，NY，1998

      Quantum Computaion and Information／M.A. Nielsen，I.L. Chuang:Cambridge University，2010

      ※この教材は工学系教育研究センター(CEED)から提供されています。

      工学系教育研究センター(CEED)では、工学院・情報科学研究科・工学部のｅラーニング教材を制作しています。

      CEEDの配信システムでは、細かなチャプターの設定、自動的な言語翻訳、講師が発言した内容のテキスト表示等、視聴者を支援する機能が備わっています。原則として北海道大学の学生向けに公開していますが、自己研鑽の学びを希望される方は科目等履修生や社会人大学院生等で学籍を取得し、正規の学生以外でも視聴可能となる手順がありますので、詳しくはCEEDのホームページを参照いただき、手順についてお問い合わせください。'
