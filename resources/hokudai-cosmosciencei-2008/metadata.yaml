  ja: 大学院教育 宇宙理学特別講義1 不安定核への平均場アプローチ（2008）
description:
  ja: 自己無撞着平均場理論を軸に、広い質量領域の原子核構造を扱う講義である。不安定原子核で見られる核変形、集団励起、対相関現象について、基礎的な知識とそれを記述する理論的方法を学ぶ。
quotedDescription:
  text:
    ja: 広範な質量領域での原子核の構造を包括的記述する理論的枠組みとして有望視されている自己無撞着平均場理論の骨格を習得することは目的である。特に、近年の原子核物理での中心的課題となっている不安定原子核において現れる特徴的な核変形、集団励起や対相関現象の基本的知識とこれらを記述するための理論的方法を習得することを目的とする。
