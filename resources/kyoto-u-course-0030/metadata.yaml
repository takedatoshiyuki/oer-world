  ja: 経済史・思想史入門
description:
  ja: 19〜20世紀の生産システムの展開を、イギリス、アメリカ、日本の事例を通してたどる講義である。公開教材では、ミュール紡績工場、アメリカ式の大量生産・大量販売、トヨタ生産方式からリーン生産方式への流れを扱う。地域や時代ごとの生産方式の違いと相互作用を手がかりに、資本主義的生産様式を考える。
quotedDescription:
  text:
    ja: '授業の特色

      経済史・思想史入門世界を変えた工場を、（１）ミュール型紡績工場（1820年代イギリス）（２）アメリカン・システムからフォード・システムへ（1900年代アメリカ）（３）トヨタ生産方式（リーン生産方式）と対比し、１９−２０世紀の生産システムの発展を整理します。

      授業の紹介

      本講義は、ヨーロッパ・アメリカ・日本の生産システムの歴史的展開を概説するとともに、近年注目されている新たな生産方式について紹介します。各地域・時代の様々な生産方式の諸相とその相互作用を吟味することを通じて、資本主義的生産様式における「生産力の特質を検討します。'
