name:
  ja: 東京大学公開講座「無駄」
description:
  ja: 古代ギリシア、とくにアテネに見られる「無駄」と思われる事例を手がかりに、その社会の慣習や制度を扱う講座である。シュンポシオン、裁判、神々への犠牲を取り上げ、それぞれにどのような要素が含まれるかを述べる。
quotedDescription:
  text:
    ja: 古代ギリシア（特にアテネ）には、現在から見ると時間やお金の「無駄」のように思われるものが少なくとも三つあります。第一は「シュンポシオン（饗宴）」。これは貴族ないし裕福な人が好んで行う社会的・文化的慣習です。第二は「裁判」。アテネの裁判は、手当をもらう数百名の裁判人が多数決で決めます。コストは小さくありません。最後に、神々に捧げる犠牲。これには大量の家畜が使われます。これもやはり「無駄」なのでしょ…
