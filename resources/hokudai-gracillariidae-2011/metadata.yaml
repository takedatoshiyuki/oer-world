name:
  ja: 土曜市民セミナー 葉に潜る昆虫ーホソガ科（2011）
description:
  ja: ホソガ科を中心に、葉の中を食べて成長するガの仲間の特徴を扱う。幼虫が成長に伴って食べ方や形態を変える例と、それらの形態変化が分類とどう関わるかを取り上げる。あわせて、担当者自身の研究の道筋も織り込んで解説する。
quotedDescription:
  text:
    ja: 鱗翅目（チョウ目）は顕花植物と共に進化してきた昆虫です。その幼虫の大部分は顕花植物を食べて成長し、成虫は花の蜜を吸うものが多く、顕花植物とは切っても切れない関係にあります。したがって、あの薄い葉の中の組織だけを食べて成長するガの仲間がいてもなんら不思議は無いのですが、ハモグリガ類の話をすると信じられないと思う人が多いのも事実です。今回、お話するホソガ科も、その殆どの種類の幼虫が葉の中の組織だけを食べて成長を完了するハモグリガ類の仲間です。したがって、成虫（ガ）になっても非常に小さく、世界最小のガの一種も、このホソガ科にみられます。しかも、幼虫は成長に伴って葉の中の食べる部分を変え、形態や摂食方法を変える種類もいます。鱗翅目（チョウ目）の中で、このように形態変化（可変態）をしながら成長することが知られているのは、ホソガ科を含めてわずかのグループに限られています。この講座では、ホソガ科の様々な形態変化と分類の関係を中心に、私がたどってきた研究の道筋を織り交ぜながらホソガ科の話をしたいと思います。
