name:
  ja: Hot Topics in Physics 最先端の物理学
description:
  ja: 物理学と応用物理学の複数の研究分野を取り上げ、材料科学・工学、天文学、量子物性、数理物理、量子光学などの話題を扱う講義である。各回では、現在活発に研究が行われているテーマを紹介する構成になっている。
quotedDescription:
  text:
    ja: 'This course will introduce students to active areas of research in physics and applied physics.
      The topics will be introduced in such a way that even those without a strong background in science
      will be able to gain a glimpse of the what is going on at the forefront of science.

      物理学、応用物理学の様々な分野から、現在活発に研究が行われている分野を紹介する。

