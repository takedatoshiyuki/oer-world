name:
  ja: 第10回国際シンポジウム「“幸せを支えるイノベーション”を考える」
description:
  ja: 本講義は、ウェルビーイングを支えるイノベーションを主題にした国際シンポジウムである。工学研究科、学際融合教育研究推進センター、総合生存学館のスピーカーが参加し、関連する論点をクロストーク形式で扱う。
quotedDescription:
  text:
    ja: 第６期科学技術・イノベーション基本計画において、人文・社会科学系分野に対する必要性への明示的な言及は、科学技術とイノベーションとの関係性における学際融合研究への期待の高まりを示していると言えます。
      その背景には、人類が、エネルギー、気候変動、貧困といったグローバル課題を解決し、持続的に共存しうる社会を構築する責任を負っていることがあり、したがって、イノベーションへのアプローチも大きく変わる必要があります。
      ウェルビーイングはそのような持続的共存のために不可欠な要素であり、より多くの人々がウェルビーイングを推進しうるテクノロジーを追求することは人類の挑戦でもあります。 このシンポジウムでは、京都大学工学研究科と学際融合教育研究推進センターから代表的なスピーカーを招待し、総合生存学館からのスピーカーとともにウェルビーイングを支えるイノベーションについてクロストークを行います。
  source: https://ocw.kyoto-u.ac.jp/course/1104/
