name:
  ja: E.FORUM 学力評価スペシャリスト研修 第2回 フォローアップ研修
description:
  ja: 京都大学が提供する、学力評価スペシャリスト研修の第2回フォローアップ研修である。公開教材には、オリエンテーションに加えて、目標に準拠した評価の実現や、カリキュラム改善と校内研修のあり方を扱う資料が含まれる。文部科学省の委託事業に関連し、現場での実践改善に取り組む教員向けに提供される。
quotedDescription:
  text:
    ja: '教育実践コラボレーション・センター

       

      概要

      E.FORUMでは、文部科学省「教員の養成・採用・研修の一体的改革推進事業」の委託により、「学力評価スペシャリスト研修プログラムの開発・施行・改善」に取り組むことになりました。この事業の一環として、E.FORUM「全国スクールリーダー育成研修」の成果を活かしつつ、現場での実践改善に取り組んでおられる先生方に、フォローアップ研修を提供します。'
