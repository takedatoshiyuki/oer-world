name:
  ja: 第14回 上智大学全国高校生英語弁論大会ジョン・ニッセル杯
description:
  ja: AI時代に外国語を学ぶ意義をテーマにした高校生英語弁論大会を扱う。全国から集まった参加者が、自身の経験を含むさまざまな視点からスピーチを行う様子を収録する。あわせて、審査と表彰の結果も示す。
quotedDescription:
  text:
    ja: "第14回を迎える今回の大会テーマは、“What is the Point of Learning Foreign Languages in the Age of AI?”。 283人の応募者のなかから厳しい一次審査を通過した21人の高校生が全国から集まり、自分自身の経験を含めた様々な視点から、内容・語学力ともに見事なスピーチを披露しました。\
      \ \n 審査の結果、上位6名と特別賞「英検賞」1名の合計7名が表彰され、トロフィー、表彰状、副賞が授与されました。"
