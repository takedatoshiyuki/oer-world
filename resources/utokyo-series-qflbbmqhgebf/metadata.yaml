name:
  ja: 見えないものを見えるようにする（梅澤喜夫最終講義）
description:
  ja: 生きた単一細胞内の情報伝達過程を可視化する光プローブ、分子間電子トンネル効果に基づく選択的な可視化検出法、膜界面でのイオン・分子認識と化学センサーを扱う。研究概要として、可視化検出法と化学センサーに関する三つのテーマを取り上げる。
quotedDescription:
  text:
    ja: '【研究概要】

      １）生きた単一細胞内の情報伝達過程を可視化検出する光プローブ

      ２）分子間電子トンネル効果に基づく化学種，官能基の選択的可視化検出法の開発

      ３）膜界面でのイオン・分子認識と化学センサー

      【略歴】

      生年月日　1944年6月5日

      1967年　東京大学理学部化学科卒業

      1967年　東京大学大学院理学系研究科化学専攻修士課程入学

      1972年　同博士課程修了，理学博士

      1973年　東京大学理学部助手

      1974年　シンシナティー大学博士研究員

      1975年　ノースカロライナ大学（チャペルヒル）博士研究員

      1982年　ブダペスト工科大学客員研究員（JSPS）

      1983年　オハイオ州立大学客員助教授

      1985年　北海道大学理学部教授（分析化学講座担当）

      同大学院環境科学研究科教授兼担

      1992年　東京大学理学部教授に配置換（分析化学講座担当）

      1993年　東京大学大学院理学系研究科教授（組織変更）

      1999年1月〜2003年12月

      科学技術振興機構 戦略的創造研究推進事業（CREST）研究代表者'
