name:
  ja: 春秋講義「森の生態系と私たちのかかわり－地球温暖化から人のこころまで」
description:
  ja: 人間の営みが森林や地球規模の環境変化に与える影響を取り上げる講義である。コンピュータシミュレーションによる人と自然の相互作用の予測研究に加え、森林が人の心理に及ぼす作用や、電子機器を用いたこころの動きの観測も扱う。
quotedDescription:
  text:
    ja: 人間の営みは直接・間接に自然環境を変化させています。森を伐採すれば直接の影響が、地球温暖化を引き起こせば間接の影響が生じます。コンピュータシミュレーションを使った、人と自然のかかわりを総合的に予測する研究を紹介します。また、森林が人間の心理に与える効果についてもお話します。近年開発された電子機器を用いることで、これまでは漠然としていた、自然環境下での人のこころの動きが解明されつつあるのです。
