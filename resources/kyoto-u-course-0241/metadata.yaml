name:
  ja: 第3回「京大おもろトーク：アートな京大を目指して」〜アート、ゼロの領域
description:
  ja: 京都大学が開催した「京大おもろトーク」の第3回で、テーマは「アート、ゼロの領域」とされている。公開教材には、京大生による展覧会「アートがアートである為に」の記録写真とディスカッションの書き起こしが含まれ、展覧会の記録と議論の内容をたどれる。
quotedDescription:
  text:
    ja: 長い歴史と文化を持つ京都は、同時に常に最先端の動きを取り入れてきた町でもあります。アートはその伝統とモダンをつなぎ、新しい動きを創る力を持っています。京都大学は「おもろいこと」を第3回「京大おもろトーク：アートな京大を目指して」として開催します。第3回目のテーマは、「アート、ゼロの領域」です。京大おもろトークに参加して、その試みを目撃してみませんか？
  source: https://ocw.kyoto-u.ac.jp/course/241/
