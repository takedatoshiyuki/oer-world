name:
  ja: Vertex Operator Algebras and Integrable Systems
description:
  ja: vertex operator algebras の構成法を中心に、screenings や拡張による考え方、基本例、W-algebras までを扱う。さらに、vertex algebras
    と D-modules の関係を通して Hitchin systems や geometric Langlands に現れる話題に触れる。後半では、affine root system に対応する
    screening system から現れる対象と、KdV 型の可換代数を含む integrable system を扱う。
quotedDescription:
  text:
    ja: 'Course Description

      First I plan to discuss the known ways of constructing vertex operator algebras. We can use “screenings”
      – it means that we can find the vertex operator subalgebras into the known ones. Opposite idea –
      extensions of VOA. In this case we are trying to embed the algebra into the bigger. I present the
      basic examples of these constructions. We discuss W-algebras and their applications. Vertex algebras
      produce D-modules on the interesting geometric objects. So we will talk about Hitchin systems and
      D-modules appearing in geometric Langlands – usual and quantum.

      After that I explain what to do if we have the system of screening corresponding to the affine root
      system. They do not define vertex algebra but something which has not good name. The object which
      we get by this way is rather close to the non-conformal field theories and contains the integrable
      system – commutative algebra of KdV type.'
