name:
  ja: グローバリゼーションと大学での学び
description:
  ja: グローバリゼーションの進展を前提に、その様相と社会的な変化を扱う講義である。大学での学びとして、グローバル社会で必要とされる知識、技能、資質を考える内容で、本学教員の講義に加えて学内外の講師による講演も含む。
quotedDescription:
  text:
    ja: 'グローバリゼーションが世界中で進み、好むと好まざるとにかかわらず、我々はその渦中に生きざるをえない。グローバリゼーションとは何だろうか、そのなかで生きる我々はどのような学びを必要とするのだろうか。グローバリゼーションの様々な様相とグローバル化のなかで求められる今後求められるグローバルな人材は何かを考える。授業はグローバル化が進む現代社会について本学の教員による講義とともに、日本社会や経済が直面する変化について、国際的な経営者など様々な分野で活動されている学内外の講師を招聘し、講演をお願いする。

      （授業の目的） １）グローバル社会について議論を深め、自らの言葉で語れるようになる。 ２）グローバル社会で必要な知識、技能、資質を理解し、今後の目標を立てることができる。'
