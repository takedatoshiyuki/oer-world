description:
  ja: この講義は、地球上に最初の生命が生まれたとされる極限環境と、そこで生きる微生物のはたらきに注目する。微生物と地球環境の関わりを取り上げ、生命進化との接点を扱う。
quotedDescription:
  text:
    ja: '地球上に最初の生命が生まれたのはおよそ３５億年前の極限環境下と推定されています。以来、地球環境は比較的穏やかに保たれていますがその陰には過酷な環境に生きる微生物たちのすばらしいはたらきがあります。本講義では、ミクロ生命と地球環境の関わりについて紹介します。

      場所： 函館中部高等学校

      日時： 2009年11月18日'
