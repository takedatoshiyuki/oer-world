name:
  ja: 'H1: The World of Music(A) H1：音楽の世界(A)'
description:
  ja: 音楽を聴く際の基礎知識を扱い、作品の鑑賞を通して音楽様式の特徴を歴史や社会的背景と結びつけて考える。主な対象はヨーロッパの音楽作品だが、日本や非西洋の伝統にも必要に応じて触れる。公開動画は複数回の授業内容をまとめたダイジェスト版である。
quotedDescription:
  text:
    ja: 'This course is designed to deepen understanding of basic knowledge that will help students enhance
      their appreciation of music. The course examines various examples of musical compositions chosen
      mainly from the repertory of the European tradition, discussing the aspects that feature their musical
      styles with emphasis on history and social climate. Works of Japanese and non-Western traditions
      are also cited as necessary.

      音楽を聴くことをより意味深い体験とするために必要な基礎知識を学ぶ。作品を鑑賞し、おもにヨーロッパ地域の音楽様式の特徴を、時代や地域的背景にそって検討する。適宜、日本その他の地域にも言及する。

      ※Videos are condensed version of course.

      ※この動画は複数の授業内容をまとめたダイジェスト版を公開しています。'
