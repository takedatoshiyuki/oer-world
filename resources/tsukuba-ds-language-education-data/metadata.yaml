name:
  ja: データサイエンス講義 言語教育にデータはどのように活用されるのか
description:
  ja: 言語教育、とくに外国語としての英語教育で扱うデータの種類と、その教授・学習・評価への利用を概観する講義である。さらに、語彙データベースや母語話者データ、学習者データの基本的な使い方を示し、英文評価や学習支援ツール、英文理解プロセスの解明への応用例まで扱う。
quotedDescription:
  text:
    ja: 本講義では，言語教育（主として外国語としての英語教育）におけるデータの活用について概説する。まず，言語教育に関わりのあるデータについて説明し，それが教授や学習，評価おいてどのように活用されるかを概観する。その後，データの実例として語彙データベース，母語話者データ，学習者データを取り上げ，その簡単な使用法を実演する。最後に，データの応用的な活用事例として，英文評価，学習支援ツール，英文理解プロセスの解明について説明する。
