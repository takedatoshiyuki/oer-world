name:
  ja: 土曜市民セミナー 高次脳機能障害とリハビリテーション （2014）
description:
  ja: 本講義は、高次脳機能障害について、症状や原因、日常生活・社会生活への影響を扱う。あわせて、早期診断、リハビリテーション、支援が社会復帰にどう関わるかを取り上げる。
quotedDescription:
  text:
    ja: 最近の映画「抱きしめたい －真実の物語－」でも話題になった高次脳機能障害ですが、この障害では日常生活や社会生活がスムーズにできなくなり、社会復帰が妨げられます。記憶障害、注意障害、遂行機能障害、社会的行動障害などの症状があり、脳の外傷や病気が原因で起こります。自分ではその障害に気づかないことが多く、また、他人からも普通に見えるため、「見えない障害」とも言われます。早期に診断を受けてリハビリテーションを行い、適切な支援を受けることが社会復帰には重要です。講演ではこの高次脳機能障害とリハビリテーションについて、できるだけわかりやすく解説をしたいと思います。
  source: https://ocw.hokudai.ac.jp/lecture/higherbraindysfunction-2014
