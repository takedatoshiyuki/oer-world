name:
  ja: 社会学概論（政策社会学史）
description:
  ja: 社会学の中でも政策社会学の歴史を扱う講義で、資本主義が生む孤立や貧困、同業組合、科学と政治の関係、社会調査にもとづく政策立案などを取り上げる。あわせて、戦争から福祉国家への流れ、福祉国家行政を支える社会学、福祉国家の危機、福祉社会とNPOまでを教材として並べている。
