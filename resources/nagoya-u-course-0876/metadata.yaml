  text:
    ja: 社会学は社会問題をどのように捉え、どのような政策形成を支えてきたのか。また、社会問題と向き合うなかで、社会学自体はどのように形成されてきたのか。政策という観点から社会学の歴史を読み直し、古典を未来に活かす道を探りたいと思います。
