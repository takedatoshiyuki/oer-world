name:
  ja: 全学教育 基礎物理学I（2007）
description:
  ja: 科学技術に支えられた現代社会を背景に、物理学を科学の基礎として扱う講義資料である。物理学の基本的知識と考え方の習得を目標にし、デモ実験や演習、小テスト、宿題を通して学習を進める。
quotedDescription:
  text:
    ja: 私たちの生活している現代社会は科学技術の上に成り立っています。その科学を知ることは北大生として必要不可欠です。この授業では、科学の基礎としての物理学を概観します。物理学の基本的知識やその考え方の習得、それに基づいた自然に対する洞察力を涵養することが目標です。デモ実験や演習（小テスト）、宿題で理解を深めます。
  source: https://ocw.hokudai.ac.jp/lecture/basicphysicsi-2007
