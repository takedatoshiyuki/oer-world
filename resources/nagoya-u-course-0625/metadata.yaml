  ja: 情報を数学的に扱うための基礎事項として、情報量とエントロピーから通信理論、誤り訂正符号までを学ぶ。さらに、情報理論的暗号理論と計算量理論を踏まえ、一方向性関数や公開鍵暗号を含む計算量的暗号理論へ進む。
