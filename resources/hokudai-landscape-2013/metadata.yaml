name:
  ja: 土曜市民セミナー 豊平川がつくりだした自然景観（2013）
description:
  ja: 札幌の地形が豊平川の作用によってどのように形づくられてきたかを扱う講義である。扇状地だけでなく、源流から石狩川との合流点までに見られるさまざまな地形を取り上げ、その成り立ちに関わる地質と川の働きをたどる。日常で見慣れている景観と豊平川との関係を見直す内容である。
quotedDescription:
  text:
    ja: 札幌は豊平川がつくった扇状地の上に発展してきた街であることはよく知られています。扇状地ばかりではなく、源流の小魚山から石狩川への合流点まで、豊平川沿いには様々な地形が見られます。これらは、一千万年以上の時間をかけて、大地をつくる地質とそれを削り堆積させる豊平川のはたらきによってできあがってきたもので、この豊かな自然景観は豊平川の恵みといっても過言ではありません。ふだん見慣れているこれらの景観と豊平川とのかかわりを改めて見直していくことにしましょう。
  source: https://ocw.hokudai.ac.jp/lecture/landscape-2013
