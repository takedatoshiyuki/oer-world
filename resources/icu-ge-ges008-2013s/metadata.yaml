name:
  ja: 'S1: Religion and Global Politics Ｓ１：宗教と国際政治'
description:
  ja: 宗教が国際政治に与える影響をテーマに、アイデンティティや信念、普遍的価値、人権との関係を検討する。さらに、異なる信念間の対立や『文明の衝突』『War on Terror』をめぐる事例を通して、国際関係への影響を考える。ポスト世俗的な国際関係にも触れる。
