name:
  ja: 'X: Introduction to Christianity Ｘ：キリスト教概論'
description:
  ja: 聖書に即してキリスト教信仰の基本概念を学び、その神学的意味を現代文化との関係の中で考察する講義である。学習内容には、マルコによる福音書の読解や『Scapegoat』各章の検討に加え、クイズ、学習ログ、参加記録、神話分析のレポート、試験が含まれる。
quotedDescription:
  text:
    ja: 'The basic concepts of the Christian faith. The study, based on the Bible, is directed toward
      understanding Christianity”s theological significance in relation to various fields of modern culture.
      Required of all students seeking a degree. Language of instruction differs by term or section.

      キリスト教信仰の基本的内容を，旧約および新約聖書に即して学びながら，その神学的意味と思想的意義を，とくに現代の文化諸領域との関連において考察する。全学必修。学期およびセクションにより開講言語が異なる。

      Contents of Lectures

