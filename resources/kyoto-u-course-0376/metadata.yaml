description:
  ja: 本講義は、グローバルヘルスの文脈で栄養と感染症の関係を扱う。栄養が感染症へのかかりやすさや病状の転帰にどう関わるかを踏まえ、低・中所得層に向けたエビデンスに基づく栄養介入の設計まで扱う。
quotedDescription:
  text:
    ja: 'Course Description

      Kyoto University School of Public Health (KUSPH) invites you to the special lecture series on “Nutrition
      and Infection in Global Health” by Professor Sharon Cox, School of Tropical Medicine and Global
      Health, Nagasaki University & London School of Hygiene & Tropical Medicine. She has a particular
      interest in understanding how nutrition underlies susceptibility to and outcomes of infectious diseases
      and the design of evidence based nutrition interventions in low and middle income populations. She
      is an elected trustee of the Royal Society of Tropical Medicine and Hygiene, UK and a member of
      the Japanese society of Tropical Medicine.'
