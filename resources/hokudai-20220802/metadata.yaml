  ja: 外国語教育センター高大連携プロジェクト：中高英語教員対象セミナー「ワラヤガナドゥ 英語音の特徴：本当はどうなっているの？」 (2022)
description:
  ja: 北海道大学で実施された英語科教員対象セミナーの講演をもとにした教材で、奥聡が英語で講演した内容を公開している。配布資料が1件あり、英語音の特徴を扱う講演内容に触れられる。
quotedDescription:
  text:
    ja: "2022年 8月2日（火）に実施された、「2022年度 第3回 英語科教員対象 英語教育セミナー」より、北海道大学 奥聡先生の講演「ワラヤガナドゥ　英語音の特徴：本当はどうなっているの？」を一般公開いたします。講演は、英語科教員に向けて英語で実施されました。\n\
      \ \n■ プログラムと配布資料\nワラヤガナドゥ　～Why don't English speakers say what they are supposed to say? ～　英語音の特徴：本当はどうなっているの?\n\
      北海道大学教授　奥　聡　氏（理論言語学）\n>> 配布資料（handout）\n \n■ 開催情報\n第3回　英語科教員対象　英語教育セミナー\n開催日時：２０２２年８月２日（火）\n開催会場：専修学校クラーク高等学院\
      \ 札幌大通校\n対象者：英語科教員、小・中・高等学校教員、教育関係者等\n※ 英語4技能や今後の英語教育に興味・関心のある方はどなたでも参加可"
