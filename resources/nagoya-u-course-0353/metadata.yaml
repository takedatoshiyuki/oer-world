name:
  ja: 計量経済II
description:
  ja: 計量経済Iで学ぶ単回帰モデルと重回帰モデルを前提に、その先の計量経済の話題を扱う講義である。ガウス・マルコフの定理などの統計理論的な説明に加え、標準的な仮定が成り立たない回帰分析や、同時方程式モデル、時系列モデルを取り上げる。公開教材としては、講義ノート「ダミー変数（１）」がある。
quotedDescription:
  text:
    ja: 計量経済学ではデータに基づいて経済を分析するための統計的方法を学ぶ。本講義では、「計量経済 I」で習った単回帰モデル、重回帰モデルの基礎的知識をもつ者を対象に、その先の話題を解説する。具体的には、やや統計理論的な観点からの説明（ガウス・マルコフの定理など）、標準的な仮定が成り立たない場合の回帰分析（不均一分散、系列相関）、
      回帰モデル以外のモデル（同時方程式モデル、時系列モデル）などを扱う。それにより、データを用いた経済の基礎的分析力を養う。
  source: https://ocw.nagoya-u.jp/courses/0353-%E8%A8%88%E9%87%8F%E7%B5%8C%E6%B8%88II-2012/
