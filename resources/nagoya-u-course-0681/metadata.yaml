description:
  ja: 法とは何かという法概念論・法理論と、法はどうあるべきかという正義論を扱う。自然法論や法実証主義、リベラリズムなどの基本概念を押さえたうえで、具体的な問題を考察するための基礎を築く内容である。
quotedDescription:
  text:
    ja: 法とは何かと法はどうあるべきかという法哲学上の問題を説明する。前者は法概念論や法理論を内容とする。後者は正義論を内容とする。キーワードとしては、自然法論、法実証主義、リベラリズム、リバタリアニズム、コミュニタリアニズムなどの基本概念を理解し、そのうえで、具体的な問題を考察できるようにすることが狙いである。そうすると、さまざまな公共政策をめぐる問題にアプローチするための基礎が獲得できるだろう。
      第0
