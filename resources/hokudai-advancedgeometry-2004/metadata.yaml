name:
  ja: 学部専門教育 幾何学続論1 写像空間のトポロジーと幾何と特異点（2004）
description:
  ja: 多様体とその間の可微分写像を基盤に、写像の集まりに位相や微分構造を入れて解析する考え方を扱う。そこから、幾何学や大域解析の問題をどのように記述し、写像空間の議論へつなげるかを説明する。あわせて、関連する幾何学の問題や特異点論との関係も論じる。
quotedDescription:
  text:
    ja: '「写像空間のトポロジーと幾何と特異点」について講義する． 幾何学や大域解析の諸問題は，多様体と多様体間の可微分写像の言葉で記述される．その際の常套手段として，扱うクラスの写像の全体に位相や微分構造を入れて，その写像空間を解析することにより，もともとの問題にアプローチするという方法がある．この方法を説明する．

      その過程で，関連する幾何学の問題，大域解析の問題，さらに特異点論との関係を論じる．

      幾何学や大域解析，非線形問題，特異点論に興味を持つ人に最適である．

      「美しいものは皆，写像空間の特異点である」'
