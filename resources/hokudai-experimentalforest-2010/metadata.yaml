name:
  ja: サイエンス・カフェ札幌から Pick up! 下を向いて歩こう♪ ～科学者と見る北大研究林～ （2010）
description:
  ja: 北海道大学の雨龍研究林を舞台に、森林の土壌に注目して研究内容を紹介する講義である。森林における土壌の役割や、二酸化炭素を含む炭素・養分の循環をテーマに、研究林での映像を交えながら森と土の関係をたどる。
quotedDescription:
  text:
    ja: 最後に森の土を踏みしめたのはいつですか？森の土の手触りや香りを覚えていますか？北海道大学は世界一の規模を誇る研究林を持っています。札幌から北へ約200km、幌加内町に広がっているのが、1901年に北大で最初に創設された雨龍研究林です。今回のカフェでは、その北大雨龍研究林で「森林における土壌の役割」や「二酸化炭素を含む炭素や養分の循環」などの研究をしている柴田英昭さんに、森や土の魅力を語っていただきます。普段森を歩くとき、私たちは木々や草花、野鳥など、地上に目がいきがちですが、本当の森の魅力は土にある、と柴田さんは言います。ミミズや地中の無数の微生物は豊かな土壌を生み出しています。でも実際にどのようなメカニズムで森が維持されているかは、意外と謎が多いそうです。カフェでは雨龍研究林で撮影した映像を見ながら、柴田さんと一緒に森を散歩するような感じで、森林と土の秘密をひもといていきます。カフェの後には、下を向いて森を歩くのが楽しみになること、間違いありません♪
  source: https://ocw.hokudai.ac.jp/lecture/experimentalforest-2010
