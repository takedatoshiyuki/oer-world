name:
  ja: 論理回路基礎
description:
  ja: この講義は、ディジタル論理回路の初学者向けに、2進数や論理演算から組合せ回路・順序回路の設計、さらにメモリや論理回路の実現までを順に扱う。あわせて、クワイン・マクラスキー法にも触れ、ディジタル回路からコンピュータへつながる構成を示す。演習問題とその解答も提示する。
quotedDescription:
  text:
    ja: この講義は、はじめてディジタル論理回路を学ぶ人を対象とし、回路の理解と設計の基本を学ぶことを目的とする。具体的な流れは、２進数の算法、論理演算、組合せ回路の設計法と代表的な組合せ回路、フリップフロップ、順序回路の設計法と代表的な順序回路、論理回路の実現、メモリ、ディジタル回路からコンピュータへ、という具合である。この授業の特徴は、(1)回路設計などのわかりやすい実例を多数示すことで受講者の理解を容易にした点、(2)クワイン・マクラスキー法などを入れて一般性を高めた点、(3)適切なレベルの演習問題を出し、全問題の解答を示す点、(4)例示した回路を組み合わせることによってコンピュータの基本をボトムアップ的にわかるようにした点、などである。
