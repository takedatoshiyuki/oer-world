name:
  ja: 水の環境学
description:
  ja: 水をめぐるテーマを、地球水循環、地域との関係、社会・制度・文化、世界の話題といった複数の観点から扱う講義である。理学、工学、社会科学の領域をまたぎ、オムニバス形式で講義を行う。公開教材には、講義要旨のほか、都市環境や水都再生、水に関する環境政策を扱う資料が含まれる。
quotedDescription:
  text:
    ja: 「水の環境学」は体系理解科目として本学の環境学研究科教員を中心として、オムニバス形式にて講義を行います。理学、工学、社会科学の様々な領域から地球水循環、地域と水、社会・制度・文化と水、水に関する世界の話題など幅広く講義し、水に関する様々な知見を広げてもらい、各々の研究や生活の中での実践に反映させてもらうことを期待しています。
  source: https://ocw.nagoya-u.jp/courses/0410-%E6%B0%B4%E3%81%AE%E7%92%B0%E5%A2%83%E5%AD%A6-2013/
