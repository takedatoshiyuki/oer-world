name:
  ja: バイオミメティクス市民セミナー ものつくりと暮らし方の新潮流を創る ネイチャー・テクノロジー（2012）
description:
  ja: この講義は、自然に見られる仕組みを手がかりに、暮らしに必要な技術を考えるネイチャー・テクノロジーを扱う。東日本大震災を契機に、豊かに暮らすことや地球環境問題、テクノロジーの役割を問い直しながら、バックキャスト思考に基づくライフスタイルと技術の関係を考察する。
quotedDescription:
  text:
    ja: 2011年3月11日に発生した東日本大震災は、私たちにあらためて豊かに暮らすこととはどういうことなのか？地球環境問題とはなにか？そして、そのためにテクノロジーはどのように貢献できるのかを問うています。次の世代のためにも、今私たちはこの問いに答えを出さねばなりません。それは、何かと何かを置き換えるテクノロジーであったり、今までの延長である、物質的な豊かさを求めることではありません。自然のすごさを賢く活かし、ワクワクドキドキする心豊かな暮らしのかたちを創り上げることなのです。このセミナーでは、厳しい地球環境制約の中で、バックキャスト思考により創出されたライフスタイルに必要なテクノロジーを自然の中から見つけ出すネイチャー・テクノロジーについて考えてみたいと思います。
