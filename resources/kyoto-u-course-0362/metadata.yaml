name:
  ja: 市民講座「物理と宇宙」第６回
description:
  ja: 物理学と宇宙物理学を扱う市民講座で、京都大学の研究者3人が最新の研究成果を紹介する。最先端の内容を市民向けに説明する構成で、過去に10回続いた講座の流れを受け継ぐ回として案内されている。
quotedDescription:
  text:
    ja: '主催：京都大学大学院理学研究科 物理学・宇宙物理学専攻、京都大学基礎物理研究所

      共催：日本物理学会京都支部

      後援：京都新聞、京都市教育委員会、京都府教育委員会、滋賀県教育委員会

       

      概要

      京都大学では物理学と宇宙物理学についての市民講座「物理と宇宙」を開催します。京都大学の3人の研究者が最新の研究成果を発信し、その最先端を分かりやすく説明します。本講座は 21世紀COEプログラム「物理学の多様性と普遍性の探究拠点」（2003～2007年度）とグローバルCOEプログラム「普遍性と創発性から紡ぐ次世代物理学」（2008～2012年度）の主催で10回にわたり開催してきた市民講座の後を引き継ぐものです。'
