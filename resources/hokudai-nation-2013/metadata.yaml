name:
  ja: 土曜市民セミナー 破綻国家の教訓から考える持続的国家（2013）
description:
  ja: アフリカの破綻国家の例としてコンゴ・ザイールの歴史を取り上げ、民主主義や政治的安定のあり方を考える講義である。植民地化後に生じた流動的な社会階層や集団と、ヨーロッパ発祥の国民国家との適合の問題を扱う。画一的な国家ではなく、社会の実情に合う民主主義国家について考察する。
quotedDescription:
  text:
    ja: 民主主義とは何でしょうか。どうしたら政治的安定を得られるのでしょうか。統合できない多様な社会は、強権的に統制した方が得策なのでしょうか。セミナーでは、アフリカの破綻国家の例としてコンゴ・ザイールの歴史を取り上げます。実際、アフリカでは植民地を経て、流動的な社会階層やグループが出現してきました。これらの人々は、ヨーロッパ発祥の国民国家に適合できない性格を持っていました。では、これら規格外の国家「不適合者」を放っておいていいのでしょうか。彼らは差別を受け、経済的困窮からテロリストや暴力集団に変容していくのです。画一的な国家ではなく、社会の実情に適合できる民主主義国家について考えて行きます。
  source: https://ocw.hokudai.ac.jp/lecture/nation-2013
