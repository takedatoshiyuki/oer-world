name:
  ja: 農学部公開セミナー 第47回「農学に役立つ千里眼と透視」
description:
  ja: 植物を伐採したり擦り潰したりせずに状態を調べる方法として、リモートセンシング技術を扱う。可視光、衛星画像、熱などを使って植物や周辺環境の情報を取得し、農業技術研究の事例を紹介する。細胞レベルから広域空撮まで、さまざまなスケールの観測を取り上げる。
quotedDescription:
  text:
    ja: "植物を伐採したり擦り潰したりせずにその状態を知ることはできないか？近年、可視光や衛星画像、熱などといった情報を活用して植物や周辺環境の状況をデータで取得するリモートセンシング技術が進化してきました。この講義では、リモートセンシングを活かした最先端の農業技術研究の事例を紹介していきます。細胞から広域空撮まで、千里眼のような研究の世界観を垣間見ることができるでしょう。\
      \ \n \n  00:43 研究の背景と目的  \n…"
