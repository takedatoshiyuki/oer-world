description:
  ja: 本講義は、波動関数で表される連続的な系と、スピンのような不連続な系を、つながりのある概念として扱う構成になっている。電気系の学生を対象とし、量子力学を専門に使わない学生にも線形代数を学ぶ機会を与えることを意図している。
quotedDescription:
  text:
    ja: 私が量子力学を初めて学んだとき、波動関数の概念とスピンの概念が連続的に理解できなくて、大変困った経験がある。この経験から、本講義は、スピンのよう な不連続系と波動関数で記述されるような連続系が連続的な概念で繋がっていることを感じられるような構成とした。また、この講義は電気系の学生を対象とし
      ているが、将来、量子力学を専門として利用しない学生も、線形代数を学ぶことができるように、ぜひとも履修することを薦める。
