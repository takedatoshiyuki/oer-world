description:
  ja: この講義は、動物医療での再生医療の取り組みを扱い、講演者の研究室で進める研究活動を中心に紹介する。講義内では犬の椎間板ヘルニアなどの話題が含まれ、動物の症例写真も一部用いられる。
quotedDescription:
  text:
    ja: "iPS細胞などを使った再生医療は、人の医療で最も期待されている分野の一つですが、動物の医療でもその期待度は大きく、その進展を待ち望んでいる動物と飼い主がたくさんいます。この講演では、動物医療における再生医療の取り組みについて、講演者の研究室における研究活動を中心に紹介します。\
