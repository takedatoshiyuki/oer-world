name:
  ja: ドイツ語1
description:
  ja: 教科書のテクスト、単語集、文法表、練習問題を用いてドイツ語を学ぶ授業である。受講生は本文読解と練習問題へのドイツ語での応答を通して、文法説明を踏まえた運用を行う。授業中には、用意した答えだけでなく、その場で考えて答えるやり取りも組み込まれている。
quotedDescription:
  text:
    ja: '授業は基本的に教科書に沿って進められます。教科書は、１）テクスト、２）単語集、３）文法表、４）練習問題から成っています。受講生は授業で文法の説明を聞いたあと、家で単語集を参考にしてテクストを読み、練習問題の答えを用意します。練習問題は、テクストの内容に関する質問にドイツ語で答えるものです。

      次の授業では、まず、練習問題の質問を私が口頭で行い、指名された受講生がそれに口頭で答えるようにします。家で用意した答えを見てもかまいません。当たっていない人はそれをよく聞いて、自分が用意した答えを添削します。そして、ここが肝心なのですが、切りのいいところで、私から似たようなことをいきなり問いかけます。指名された人はその場で考えて、ドイツ語で答えなければなりません。

      練習問題でも授業中の質問でも、原則として誤答は逐一直さず、次の人を指名します。指名された人は前の答えのどこが違っていたかを考えて答えるようにします。そうすれば、３人目か４人目で必ず正答にたどり着きます。正答はさらに数名の受講者に繰り返していただきます。ぼやぼやしている暇はありません。このような作業を通じてドイツ語では何をどう言うかを体験的に学習します。'
