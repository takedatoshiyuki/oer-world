name:
  ja: サステイナビリティ ― 未来をデザインするコンセプト（学術俯瞰講義）
description:
  ja: サステイナビリティを、人類の将来に関わる課題を考えるための概念として扱う講義である。気候変動やエネルギー、食糧、安全保障、財政危機、民族対立、貧困などを題材に、課題を理解し対処する視点や考え方を論じる。あわせて、俯瞰的な視野、長期的視点、技術開発と社会的改革の両面に触れる。
quotedDescription:
  text:
    ja: 'コーディネータ　味埜俊（工学部）

      ナビゲータ　　　芳村圭（大気海洋研究所）

      　「サステイナビリティ」という概念は「持続可能性」などと訳され、人類が未来に向かって生存してゆくための目指すべき姿を論じるときに使われる。気候変動、将来のエネルギー、食糧の安全保障、財政危機、民族対立、貧困など、サステイナビリティに関わる、言い換えれば人類の将来に危惧を抱かせるようなさまざまな課題が世界中にあふれている。それらの課題の複雑さから、その解決には俯瞰的な視野や長期的視点が必要であり、また技術開発と社会的リフォームの両面が重要と言われてきた。この講義では、人類が未来に向かって生存してゆくために目指すべき姿を記述する概念として「サステイナビリティ」をとらえるだけではなく、課題の持つ複雑さを見極め、理解し、対処するための視点を与える概念として見直してみたいと考える。具体的には、以下のような視点から、サステイナビリティに関わる課題を扱うときの視点・考え方・理念・態度を論じる。'
