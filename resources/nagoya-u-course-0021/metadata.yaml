name:
  ja: 宇宙物理学γ-(宇宙論)
description:
  ja: この教材は、宇宙論の基礎となる一般相対論的な幾何学量やロバートソン・ウォーカー計量、フリードマン方程式を扱う。さらに、宇宙の大局的ふるまい、宇宙論パラメータ、線形摂動、ボルツマン方程式、インフレーション由来のゆらぎ、宇宙背景放射、銀河分布、弱重力レンズ場までを講義ノートで扱う。レポート課題も付属する。
quotedDescription:
  text:
    ja: 宇宙論は、この宇宙全体がどのようにはじまり、どのように進化するのか、そもそも宇宙とはなにものなのかを明らかにしようとする研究分野である。最近のめざましい観測の進展を背景として、宇宙論の研究は大きく発展している。本講義では宇宙論の最近のトピックのいくつかに焦点を当てて紹介する。
  source: https://ocw.nagoya-u.jp/courses/0021-%E5%AE%87%E5%AE%99%E7%89%A9%E7%90%86%E5%AD%A6%CE%B3-(%E5%AE%87%E5%AE%99%E8%AB%96)-2006/
