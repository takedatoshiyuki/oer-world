quotedDescription:
  text:
    ja: '「東大院生・教職員によるミニレクチャプログラム」は、東京大学フューチャーファカルティプログラム（大学で教えることを学ぶプログラムです：東大FFP）を修了した大学院生・教職員による、約10分間のレクチャです。東大FFPの授業で優秀なレクチャをした6名が、学びの成果を活かして専門外の人にもわかりやすく伝えます。

      ★あなたのシェアが、ほかの誰かの学びに繋がるかもしれません。

      お気に入りの講義・講演があればSNSなどでシェアをお願いします。

      運営・著作権処理・映像編集：東京大学 大学総合教育研究センター'
