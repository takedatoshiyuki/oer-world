name:
  ja: 女性も頑張ってます！〜“土木”の世界〜
description:
  ja: 土木分野の中でも、地盤に関係する研究を取り上げる講義である。高速道路の建設を例に、トンネルや橋、盛土などの要素を通して土木の研究内容を紹介する。
quotedDescription:
  text:
    ja: 土木というと皆さんそれぞれイメージすることがあると思いますが、「土木」分野における研究についてはどのようなイメージを持っていますか？ 今回は土木のうち、「地盤」に関係する研究について紹介します。
      例えば高速道路を新しく建設することを考えてみましょう。  　高速道路は、山にトンネルを掘ったり谷に橋を架けたりする他に、地盤の上に土を盛って建設します。これを「盛土」と言います。  　水
