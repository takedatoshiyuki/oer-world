name:
  ja: 国際経済法
description:
  ja: 経済のグローバル化に関する国際法を扱い、WTO法とそれに関連する貿易・投資協定を中心に構成する。貿易自由化と投資保護の法的枠組みの歴史をたどったうえで、GATTやDSUを中心とするWTO協定、さらにGATS、金融サービス、知的財産にも触れる。加えて、国際貿易法の知識をもとに、貿易に影響する規制措置がこれらの法に適合するかを分析する視点を扱う。
quotedDescription:
  text:
    ja: This course provides an examination of international law concerning economic globalization, in
      particular the law on the World Trade Organization (WTO) and related trade and investment agreements
      as the main aspects of global economic order.It first provides a brief introduction to the history
      and evolution of the legal framework for trade liberalization and investment protection.It then
      proceeds to examine WTO law, focusing primarily on the WTO Agreement on Goods (GATT) and on the
      WTO Dispute Settlement Understanding (DSU), while a brief overview of topics such as the General
      Agreement on Services (GATS) and financial services in the GATS as well as intellectual property
      under the WTO will also be provided.The purposeof this course is for students to obtain both the
      knowledge of international trade law –including a critical mass of case-law –and the skills which
      will enable them toanalyze to what extent regulatory measures that have impact on international
      trade are consistent with these laws.It also provides the basis for the analysis of issues of controversy
      such as the role of these fields of law in the global legal order.
