name:
  ja: 2023年度：高校生と大学生のための金曜特別講座
description:
  ja: 植物の病原菌と共生菌を取り上げ、両者が植物に及ぼすはたらきの違いと、見かけ上は異なっていても近い存在である点を扱う。さらに、病原性を抑えながら共生菌を農業に生かす考え方まで触れる。
quotedDescription:
  text:
    ja: '植物の病原菌や共生菌について知っていますか？　病原菌は、植物の成長を阻害して病気を起こす一方で、共生菌は植物の成長を促します。 これらは、植物に対して真逆な結果を引き起こすことから、全く異なる存在のように考えられてきましたが、本当にそうなのでしょうか？　

      本講座では、病原菌と共生菌は、一見違うように見えて非常に近い存在でもあることや、そのことを踏まえてどのように病原性を抑えつつ共生菌を農業に活用し…'
