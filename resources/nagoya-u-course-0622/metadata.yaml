name:
  ja: 東洋政治思想史
description:
  ja: 日本・中国・朝鮮半島における国内・国際政治に関わる思想の歴史を、当時の文脈に即して扱う講義である。2016年度は「概念史としての政治思想史」をテーマとし、思想家そのものに加えて、政治思想の継承や断絶に関わる概念の歴史を中心に取り上げる。
quotedDescription:
  text:
    ja: '東洋政治思想史は、東アジア地域－ただし、日本・中国・朝鮮半島に限定－に存在した国内・国際政治にかかわる精神的営みの歴史を当時のコンテクストから理解することを目指す。ところが、対象になる地域や歴史が広範囲にわたることから、「近世東アジア政治思想史」、「近現代東アジア政治思想史」、「中国政治思想史」、「日本政治思想史」、「韓国政治思想史」、「概念史としての政治思想史」に細分化して、毎年の講義の対象としている。2016
      年度は、「概念史としての政治思想史」の順番になるため、主体としての思想家とともに、政治思想の継承と断絶において重要な役割を担っている概念の歴史を中心に東アジアの政治思想を取り扱う。

      一. 概念史の意義と方法を理解する。

      二. 東アジアの重要な政治関連概念について知見を獲得する。

      三. 政治概念の文明的な再構成の展望を獲得する。'
