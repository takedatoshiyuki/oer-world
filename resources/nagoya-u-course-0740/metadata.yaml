  ja: インフォマティクス２
description:
  ja: この教材は、情報化が人間や社会にもたらす変化を、複数の学問分野の視点から扱う。公開されている教材では、哲学・倫理学、心理学・認知科学、美学・芸術学、複雑系科学の観点から変化を考える内容がそろっている。
quotedDescription:
  text:
    ja: 情報社会をさらに進め、人々に幸せをもたらすには、さまざまな分野の力を結集することが必要です。この授業では、情報化による人間・社会の変化について、倫理学・芸術学・心理学・メディア研究・情報社会デザイン、そして複雑系科学の視点から語ってもらいます。それぞれの分野は情報化とそれによる変化をどう捉えようとしているのか、その方法に注目してください。
