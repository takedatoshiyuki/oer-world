name:
  ja: 2017年度 特別講義「科学と芸術の融合 ”宇宙芸術 ― 光・水・生命”」
description:
  ja: 宇宙ステーションJAXA JEM "KIBO"で2008年から行われた芸術実験を取り上げ、無重力環境と地球外からの視点がもたらす世界観を考察する講義である。あわせて、宇宙飛行士の体験やピラミッドなどの巨大遺構の検証、航空機による学生無重力フライト実験も扱う。
quotedDescription:
  text:
    ja: 「なぜ、人は宇宙を目指すのか」この問いに挑戦すべく、2008年から実施された宇宙ステーションJAXA JEM "KIBO"に於ける芸術実験について報告する。そして、無重力環境と地球外からの視点が新たな世界観を生むことを宇宙飛行士の体験やピラミッドなどの巨大な遺構の検証に基づいて考察する。また、航空機による学生無重力フライト実験についても紹介する。
