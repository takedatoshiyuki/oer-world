name:
  ja: 動物感覚情報学
description:
  ja: 動物が生き残るうえでの感覚器の役割を扱い、食物の確保や配偶相手の探索といった生物過程との関係を考える。あわせて、感覚器だけで処理できる問題、脳を動員して成立する感覚、錯覚が生じる理由にも踏み込む。理科系の内容を軸にしつつ、文理融合型として構成された授業である。
quotedDescription:
  text:
    ja: 動物が生き残るために必要なものは何か？ 食べ物がまず第一に必要だろう。ついで、配偶相手を見つけ子供を残すことが必要だ。これがうまく行けば、当面その動物種は地球上に生き残ることができる。動物の感覚器は、この２つの生物過程をうまく行うためにあると考えても間違いは無いと思う。感覚器は情報と知識の窓口になる。生きてゆくためには常に感覚を研ぎすましておかなければならない理由はここにある。授業では、感覚器だけで処理できる問題と脳を動員してまで感覚を成立させる点にも注目する。錯覚が生まれる理由はそこにある。授業は理科系だが、大学で学んで生きてゆくためには、物事を総合的に見る必要があることを強調したい。そこで授業は文理融合型のものとなる。「エー！ソウナノ！」「もっと、自分で勉強してみるか！」となってくれたら、うれしいなー。と思いながら、授業をやっています。
