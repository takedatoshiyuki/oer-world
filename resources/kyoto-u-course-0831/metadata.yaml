  ja: 高校/大学から仕事へのトランジション－自己形成の場としての学校教育の到来－
description:
  ja: 高校・大学から仕事へ移る過程を手がかりに、若者にとっての学校教育の意味と機能を考える講義である。アイデンティティ資本、主体、多元的自己、アイデンティティ形成を軸に、学校での過ごし方と自己形成の関係を議論する。
