  text:
    ja: '主催：京都大学高等教育研究開発推進センター・自己意識研究会

      協賛：関西地区FD連絡協議会

       

      趣旨

      若者にとって学校（高校/大学）の過ごし方、学校から仕事へのトランジションが変わってきています。当日は、「アイデンティティ資本」「主体」「多元的自己」「アイデンティティ形成」などをキーワードに、若者にとっての学校教育の意味・機能を議論します。'
