  ja: Venki Ramakrishnan 博士 ノーベル賞講演会 The Ribosome（2010）
description:
  ja: リボソームの働きと、それを阻害する抗生物質の作用を扱う講演である。学生と一般市民を対象に、北海道大学の学術交流会館で行われた。
quotedDescription:
  text:
    ja: 英国MRC研究所のVenki Ramakrishnan 博士は、細胞のタンパク質合成装置リボソームの立体構造を決定し、その機能を個々の原子配置に基づいて解明した功績により、2009年度ノーベル化学賞を受賞しました。この度、北大の学術交流会館にて、学生・一般市民対象の講演をお願いしました。今回の講演では、リボソームの働きと、それを阻害するさまざまな抗生物質の働きについて、わかりやすく説明していただきます。
