name:
  ja: バイオミメティクス市民セミナー 生物画像から工学的「きづき」を 生み出す新しいデータベース （2012）
description:
  ja: 大量のデジタルデータから価値を見出すデータベースの役割を背景に、生物画像から工学的な「きづき」を得るための新しいデータベースを扱う。あわせて、画像・映像・音響信号の処理技術の最先端と、そのようなデータベースが実現する未来について述べる。
quotedDescription:
  text:
    ja: '我々の身の周りには、ディジタルデータが溢れています。画像、映像、音楽、書籍に代表されるマルチメディアデータは勿論のこと、地球規模の気象データや我々が日常生活において生み出しているデータは膨大な量となっています。その一方で、大量のデータに内在する価値を見出すことが可能な、そして、人間に新たな「きづき」を与えるデータベースを構築していくことは、非常に有益であり、情報科学がその役割を担っています。

      ところで、近年、「生物の技術体系」を模倣することで技術革新の着想を得、工学的新材料を生み出していく研究が進められています。これを実現するためには、大量の生物画像から工学的「きづき」を生み出すデータベースを構築していく必要があり、ここでも情報科学の力が必要となります。

      本セミナーでは、画像や映像、音響信号の処理技術の最先端を紹介するとともに、生物画像から工学的「きづき」を生み出す新しいデータベースが実現する未来についてお話します。驚くような素材が生物を模倣することで、次々と生み出される時代の到来を予感してください。'
