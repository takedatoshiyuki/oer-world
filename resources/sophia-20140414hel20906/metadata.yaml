name:
  ja: ＩＮＴＥＧＲＡＴＥＤ ＳＫＩＬＬＳ １／INTEGRATED SKILLS 1
description:
  ja: 文学作品を題材に、議論や口頭・筆記での表現を通して内容を考える授業である。Ted HughesとSylvia Plath、Beat Generation、TolkienのMiddle-earthを主な対象とし、言語使用や歴史的・文化的参照、文学理論、解釈の方法まで扱う。授業ではクラスジャーナルの共同制作や、受講者による進行・発表も行う。
quotedDescription:
  text:
    ja: "This course is designed to allow students the chance to combine what they learned in the first\
      \ year skills classes and apply them to join in discussions and express themselves on topics in\
      \ literature both in spoken and written language. As part of the class, we will work together and\
      \ collaborate on a class journal project which each student will contribute to. Class work will\
      \ be conducted in groups and individually and students will often be required to lead sessions and\
      \ present their own research.\n Assessments are based on a set of options which students choose\
      \ from in order to gain enough credits to pass the course. Therefore, the emphasis is very much\
      \ on the students making decisions for themselves and demonstrating their own independence as learners\
      \ and researchers. |The main works we will examine in the course will be Ted Hughes and Sylvia Plath,\
      \ The Beat Generation and Tolkien’s High Fantasy world of Middle-earth. We will explore themes of\
      \ language use, historical and cultural references and also literary theory and ways of interpreting\
      \ literature."
