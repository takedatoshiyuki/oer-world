name:
  ja: GCOE総合博物館市民セミナー ハイドンの境界性（2011）
description:
  ja: このセミナーは、ハイドンをマリア・テレジア時代のハプスブルク帝国に位置づけながら、その活動の幅広さと越境的な性格を扱う。オーストリア、ハンガリー、スロヴァキアにまたがる行動範囲にも触れつつ、演奏を交えてハイドンの実像を考える内容である。
quotedDescription:
  text:
    ja: 'ハイドンは、マリア・テレジア時代のハプスブルク帝国で活躍した作曲家です。彼はウィーン古典派の巨匠とも、俗に「交響曲の父」と も呼ばれていますが、その活動は現在一般的に知られているよりもはるかに多彩なものでした。また、ハイドンの行動範囲は現在のオーストリア、ハンガリー、
      スロヴァキアにまたがっており、多文化が交錯する地点でもありました。このセミナーでは、実際の演奏も交えつつ、越境するハイドンの実像に迫ってみたいと思います。

      ‡ これらの資料は制限資料です。'
