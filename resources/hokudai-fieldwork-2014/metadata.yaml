name:
  ja: 人文学カフェ 南の島から世界を描く （2014）
description:
  ja: ソロモン諸島を手がかりに、島国の自然や人びとの暮らし、民族紛争やグローバル化の状況を取り上げる。あわせて、現地で話を聞き、観察するフィールドワークの方法と、その進め方に伴う見方を扱う。
quotedDescription:
  text:
    ja: '太平洋の中に、ソロモン諸島という小さな島国があります。熱帯林豊かなこの島国は、多くの人々が自給自足に近い生活を送っている国であると同時に、民族紛争も経験し、また、グローバル化の波にもまれている国でもあります。南の島は、世界の縮図でもあり、私たちの鏡でもあるのです。

      人と自然の関係はどうあるべきなのか。人びとは何に困り、何に喜んでいるのか。そうしたことは、現地に足を運び、話を聞いたり、観察したりすることでわかってきます。こうした研究の方法をフィールドワークと言いますが、この方法のおもしろさや難しさについては、案外よく知られていません。現地に行きさえすれば何かが見えてくるというわけではありません。そもそも現場で何かが見えてくるとはどういうことなのか。その「発見」のおもしろさをお伝えしたいと思います。

      関連リンク

      北大人文学カフェ アーカイブ'
