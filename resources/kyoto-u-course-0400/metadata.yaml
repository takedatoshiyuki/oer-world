name:
  ja: 平成29年度（第21回）京大病院臨床懇話会
description:
  ja: 京大病院臨床懇話会として、ロボットテクノロジーの応用を全体テーマにした講演と、地域連携の展望をテーマにしたパネルディスカッションを収録する。内容は、手術支援ロボットを用いた泌尿器科手術、HALを用いた取り組み、SaCoNによるケア、外来完全予約制、診療情報提供の取組みで構成される。
quotedDescription:
  text:
    ja: '講演【全体テーマ】未来を拓く京大病院―ロボットテクノロジーの応用

      1 「手術支援ロボットを使った泌尿器科手術の現状と評価」

      小川 修（泌尿器科 教授）

      2 「HALを用いた取り組みから拓く未来」

      菊池 隆幸（脳神経外科 助教）

      3 「ロボットテクノロジーで進化するケア～SaCoN」

      山中 寛惠（看護部管理室 副看護部長）

      パネルディスカッション【テーマ】京大病院における地域連携の展望

      4 「外来完全予約制の試み」

      妹尾 浩（消化器内科 教授）

      5 「本院における診療情報提供の取組み」

      近藤 祥司（地域ネットワーク医療部 准教授）'
