    ja: '附属生態調和農学機構は、東京都西東京市にある、約30haの研究農場で、水田、果樹園、畑地、ハスのコレクションなどを有しています。環境と調和した持続可能方法による世界の食料問題の解決を目指した農学研究を行っています。

