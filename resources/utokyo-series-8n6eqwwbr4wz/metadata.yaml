description:
  ja: 東京大学の農学部・農学生命科学研究科が2021年に開講した、中高生向けの公開セミナーである。スマート農業とICT技術をテーマにし、附属生態調和農学機構の研究農場や、環境と調和した持続可能な方法をめざす農学研究に触れている。
quotedDescription:
