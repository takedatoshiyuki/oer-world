name:
  ja: 制御基礎／FUNDAMENTALS OF CONTROL ENGINEERING
description:
  ja: 制御工学における古典制御理論を中心に、制御系の解析と設計法を扱う講義である。周波数特性を使ったシステム表現と、その特性に基づくフィードバック系の設計を主な内容とする。授業では毎回、簡単な演習を行う。
quotedDescription:
  text:
    ja: 現在，工学系のどの分野においても，「制御」という概念が極めて重要になっている．制御工学は大きく分けて，周波数特性を利用した古典制御理論と，状態微分方程式を利用した現代制御理論とがある．制御工学１では古典制御理論に基づく制御系の解析と設計法を概説する．これらは産業界において現在最も多く利用されている制御系設計手法である．内容は，周波数特性を用いたシステムの表現と，周波数特性に基づいたフィードバック系の設計法が中心的話題である．講義の理解を深めるために，毎回，簡単な演習を行う予定である．制御工学２で扱う現代制御理論と合わせて制御工学の基礎を一通り行うことになる．なお，制御工学１，２，３は特にこの順に履修する必要はない．
