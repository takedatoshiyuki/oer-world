name:
  ja: 土曜市民セミナー 北海道の博物館の未来－将来構想を考える－（2010）
description:
  ja: 北海道の博物館の将来構想を考えるシリーズの第1回として開かれる合同セミナーである。博物館におけるスクールサービスを題材に、複数の講演者が北海道の博物館の在り方について述べる。
quotedDescription:
  text:
    ja: '今回の土曜市民セミナーは、北海道立開拓記念館・札幌市博物館活動センター・北大総合博物館の３館の共催によるフォーラムの「第１回合同セミナー」となります。

      「北海道の博物館の未来－将来構想を考える－」というシリーズセミナーを展開していきます。

      １回目は「博物館におけるスクールサービスについて」をテーマに、複数の講演者を交え、北海道の博物館の在るべき未来構想について語っていただきます。'
