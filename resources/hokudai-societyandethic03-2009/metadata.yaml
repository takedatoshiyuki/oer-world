name:
  ja: 北海道大学公開講座 現代社会と倫理 「循環型社会における安全・安心な社会基盤構造物」（2009）
description:
  ja: 防災、都市再生、生活環境、国土保全、交通輸送に関わる社会基盤構造物を対象に、循環型社会や少子高齢化社会への対応を考える講義である。コンクリートを用いる場合の設計・施工の論点に加え、更新時期を迎える構造物を延命しながら使い続ける考え方も扱う。
quotedDescription:
  text:
    ja: 防災、都市再生、生活環境、国土保全、交通輸送などに資する社会基盤構造物は、莫大な予算の下、大量の資材、人材、時間をかけて構築される。循環型社会や少子高齢化社会に対応した社会基盤構造物の設計、施工はどうあるべきか、技術的な解決策はどのようなものかについて、建設基幹材料であるコンクリートを使用する場合について述べる。また、大更新時期を向かえる社会基盤構造物をどのように延命させ、使いこなしていくかについても述べる。
