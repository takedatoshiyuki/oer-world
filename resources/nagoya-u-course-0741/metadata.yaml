name:
  ja: 象徴天皇制の形成と展開
description:
  ja: 象徴天皇制の歴史を手がかりに、退位問題や天皇の位置づけ、「象徴」という語の意味を考える講義である。講義を通じて、天皇制をめぐる論点を歴史的に検討するための素材を示す。
quotedDescription:
  text:
    ja: 2016 年、天皇の退位問題が話題となりました。それ以降、象徴天皇制に関する議論や話題は新聞・テレビなどで盛んに取り上げられています。これを見ても、日本社会にとって、天皇制は重要な問題だということがわかります。そもそも、なぜ天皇制をめぐる議論が起こるのでしょうか。日本社会において、天皇とはどのような存在なのでしょうか。退位にはどのような意味があるのでしょうか。象徴天皇の「象徴」とは何なのか。こうした問題を、象徴天皇制の歴史を検討するなかで考えたいと思います。講義を通じて、私たちと天皇制との関係や今後の天皇制のあり方を、受講生自身が考えていくための素材を提供することが目的です。
  source: https://ocw.nagoya-u.jp/courses/0741-%E8%B1%A1%E5%BE%B4%E5%A4%A9%E7%9A%87%E5%88%B6%E3%81%AE%E5%BD%A2%E6%88%90%E3%81%A8%E5%B1%95%E9%96%8B-2018/
