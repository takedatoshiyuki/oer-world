name:
  ja: 防災研究所 第49回総合防災セミナー“Multi-voiced and Multi-angle Reality of Disaster Risk Reduction Action Research
    ―Perspective of Chained Visual Ethnography”
description:
  ja: 防災分野のアクションリサーチを対象に、研究者や地域住民、行政、教師、学生など複数の関係者が関わる実践を扱う。メキシコの防災実践をもとにした visual ethnography を土台に、参加者のコメント動画を重ねていく
    chained visual ethnography の方法を示す。研究者側だけでなく参加者側の視点も映像化し、その記録をウェブサイトで共有する流れまでを扱う。
quotedDescription:
  text:
    ja: 'Disaster risk reduction action research involves various stakeholders such as researchers, government
      officers, community people, teachers and students. Stakeholders collaboratively carry out the action
      research, for example, making community plans, evacuation drills and educational activities. Since
      all the stakeholders are proactively involved in the action research, each stakeholder has their
      own way of looking/analyzing the action research progress and outcomes. In other words, a researcher
      has his/her own way of looking at the action research while community people have their own way
      of looking at the action research, thus there exists a multi-voiced and multi-angle reality of action
      research. However, evaluation of action research often reflects only the voice of researchers and
      is published in the form of academic paper and/or book chapters. The multi-voiced and multi-angle
      reality of action research remains as researcher’s single-voice and single angle.

      This presentation aims to propose chained visual ethnography of action research that depicts multi-voiced
      and a multi-angle reality. The visual ethnography (VE) that reflected the author’s reality was developed
      based on the disaster risk reduction practices in Mexico. The VE was viewed with the action research
      participants and their comment videos were developed. Thus, the multi-voiced and multi-angle reality
      of the practices from the standpoint of the researchers and the participants are visualized. The
      VE and videos are posted on a website to stimulate advanced practices which lead to further VE and
      comment videos as chained visual ethnography.'
