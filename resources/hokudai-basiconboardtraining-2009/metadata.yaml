name:
  ja: 学部専門教育 基礎乗船実習（2009）
description:
  ja: 北海道大学水産学部の基礎乗船実習では、練習船「おしょろ丸」に乗船し、海というフィールドを実地で扱う。あわせて、航法や海図を通した地学の理解、生物採取や海洋生物の観測、船内でのグループ学習による共同生活も含む。
quotedDescription:
  text:
    ja: 水産学部附属練習船「おしょろ丸」に乗船し，水産学の対象となる海というフィールドを実体験すると同時に，フィールドに出るために必要な船の航法や海図等を通した地学の理解，またイカ等の生物採取，イルカ等の観測等により生きた海洋生物に接し，海洋生物の生息を理解します。全体にグループ学習を通して船という空間での規則正しい共同生活を体験します。
