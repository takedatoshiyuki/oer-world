name:
  ja: 第3回 京都大学 − 稲盛財団合同京都賞シンポジウム (KUIP Symposium)
description:
  ja: バイオテクノロジーおよびメディカルテクノロジー、数理科学、美術の3分野を、共通テーマのもとで扱うシンポジウムである。2日間にわたり、各分野の専門家が最先端の話題やテーマについて講演する。一般市民、学生、研究者などが参加する場として構成されている。
quotedDescription:
  text:
    ja: 'ウェブページ http://kuip.hq.kyoto-u.ac.jp/ja/archives/2016/about

      概要

      第3回目となる2016年は、2年後の京都賞授賞対象分野である「バイオテクノロジーおよびメディカルテクノロジー」、「数理科学」、「美術」の3分野を取りあげ、「未来への窓 －バイオ・メディカルテクノロジー、数学、美術の眼を通して－」の統一テーマのもと、2日間にわたって開催しました。シンポジウムでは、世界の最先端で活躍中の11名の専門家（うち美術分野の1名はビデオ講演による参加）が一堂に会し、一般市民、学生、研究者などの参加者に対し、学術界と社会の双方から注目されている最先端の話題や興味深いテーマについて熱く語りました。'
  source: https://ocw.kyoto-u.ac.jp/course/801/
