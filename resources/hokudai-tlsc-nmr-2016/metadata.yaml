  text:
    ja: 'ここでは、「溶液NMR」および「固体NMR」に関する動画をご覧いただけます。

      これらの教材は、平成28年3月24日に開催された「北大・JEOL　第1回NMR技術演習セミナー」を収録・編集したものです。

      【溶液NMR】

      ・溶液NMR測定のキモ

      朝倉克夫（日本電子株式会社）

      ・有効な応用測定 複雑なスペクトルをシンプルにする

      朝倉克夫（日本電子株式会社）

      【固体NMR】

      ・始めよう固体NMR～基礎から最新の応用例まで～

      矢澤宏次（株式会社 JEOL RESONANCE）'
