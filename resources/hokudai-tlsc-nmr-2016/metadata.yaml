  ja: 溶液NMRと固体NMRに関する動画を収録した教材で、2016年3月24日の「北大・JEOL 第1回NMR技術演習セミナー」を編集したものである。溶液NMRでは測定の要点と応用測定を、固体NMRでは基礎から最新の応用例までを扱う。
