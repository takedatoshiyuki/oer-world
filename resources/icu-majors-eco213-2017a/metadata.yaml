name:
  ja: ECO213 Introduction of Mathematics to Economics 経済学のための数学入門
description:
  ja: 中級レベルのミクロ経済学・マクロ経済学を学ぶために必要な数学を扱う。関数、集合、極限、微分、偏微分、ラグランジュ法、積分、確率統計の基礎を、経済学の事例とともに学ぶ構成である。
quotedDescription:
  text:
    ja: 'This course covers basic level mathematics so as to prepare to study intermediate micro/macro
      economics. Topics that this course deals with are as follows: function, (basic concept of) set,
      limitation, differentiation, partial derivative, Lagrangean, (basic concept of) integration, (basic
      concept of) probability and statistics. Since examples are drawn from economics, students are highly
      recommended to take after PRINCIPLE OF MACROECONOMICS and PRINCIPLE OF MICROECONOMICS.

      中級レベルのミクロ経済学・マクロ経済学を学ぶために必要な数学を学ぶ。内容は、関数、集合（の基礎）、極限、微分、偏微分、最適化（変分法）、積分（の基礎）、確率統計（の基礎）である。経済学からの事例を使用するため、マクロ経済学原論、およびミクロ経済学原論の既修が望ましい。'
