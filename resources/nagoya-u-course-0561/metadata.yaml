name:
  ja: 生物情報工学
description:
  ja: 生命科学で扱う各種データベースを対象に、情報の検索と収集、遺伝子配列の相同性解析、ゲノム解析を扱う。あわせて、立体構造データベースの利用と分子グラフィックスも取り上げる。公開教材には、文献・特許、遺伝子、ゲノム、解析ツール、KEGG、立体構造に関する項目が含まれる。
quotedDescription:
  text:
    ja: '現在、生命科学分野は、遺伝子の一次配列情報、遺伝子発現情報や、蛋白質・核酸の立体構造情報など、様々な情報がデータベース化されており、その量は毎年凄まじい勢いで増大しています。現代生物学およびそれと関連する学問領域において、それらのデータベースにアクセスし、情報を正しく収集し、それを科学手的に解析することは、必要不可欠な技術と言ってよいでしょう。

      本講義では，これら生物情報工学の基礎となる概念・手法の中で、主にデータベース検索、遺伝子配列情報に対する相同性解析，およびゲノム解析に関して解説します。また 立体構造データベースの利用，および分子グラフィックスについて解説します。

      最大の特徴は、実際にコンピューターを用いた実習形式の授業を行っていることです。ともすれば教科書からの一方的知識の積み上げになりがちな生命現象を、コンピューターの力を借りることで、「手のひらの上で転がしてみる」体験をすることにより、より一層理解が深まることを期待しています。'
  source: https://ocw.nagoya-u.jp/courses/0561-%E7%94%9F%E7%89%A9%E6%83%85%E5%A0%B1%E5%B7%A5%E5%AD%A6-2015/
