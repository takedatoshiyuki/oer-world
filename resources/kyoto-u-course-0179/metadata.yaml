name:
  ja: 情報と社会
description:
  ja: 情報技術と社会の接点をテーマに、情報コンテンツの共有、ネットワークによるチーム・マーケット・コミュニティの形成、さらに情報メディアが社会変革に与える影響までを3部構成で扱う。公開教材には第1回から第4回までの講義資料とレポート課題が含まれる。
quotedDescription:
  text:
    ja: 「情報と社会」は、高等学校の教職免許「情報」を得るために必要な科目である。本講義では、情報技術と社会接点について解説する。講義は3部に分かれてい る。第１部では情報コンテンツ（データ、ＷＥＢ情報、映像など）の社会的共有を、第２部では情報ネットワークのコミュニケーションが可能とする電子的な組
      織（チーム、マーケット、コミュニティ）の形成を講義する。第３部では第１部、第２部を踏まえて、情報メディアが今後の社会変革に与える影響を解説する。
  source: https://ocw.kyoto-u.ac.jp/course/179/
  note: 京都大学OCW 「講義概要」より（同サイトの利用条件に基づく転載）
