name:
  ja: 計量経済-I
description:
  ja: 回帰モデルを中心に、最小二乗法による推定の基礎を扱う講義である。講義ノートでは、単回帰から重回帰、仮説検定、統計的推測、ダミー変数までを順に学ぶ構成になっている。
quotedDescription:
  text:
    ja: 本講義では、興味のある変数(例えば労働者の時給)を他の変数(例えば教育を受けた年数，仕事の経験，年齢，性別)で説明する「回帰モデル」に焦点をあて、その最も基本的な推定法である「最小二乗法」について学ぶ。また，この方法にもとづく統計的推測(例えば教育を長く受けるほど労働者の時給は上がるのか，男女間で労働者の時給に差はあるのか)の方法についても学ぶ。
  source: https://ocw.nagoya-u.jp/courses/0254-%E8%A8%88%E9%87%8F%E7%B5%8C%E6%B8%88-I-2010/
