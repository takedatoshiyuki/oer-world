name:
  ja: GCOE「親密圏と公共圏の再編成をめざすアジア拠点」人口ボーナスとアジアの未来
description:
  ja: この講義は、人口ボーナスとアジアの将来をテーマに、人口転換が経済発展や人間開発とどう関わるかを扱う。公開教材には、第1回から第3回までの講義資料があり、各回で人口配当や人口動向、人的資源の移動を取り上げる。英語で実施され、京都大学文学研究科で2009年度に開講された。
quotedDescription:
  text:
    ja: '京都大学グローバルCOEプログラム「親密圏と公共圏の再編成をめざすアジア拠点」

      グローバル化、高齢化など社会の基本条件を揺るがす大きな変動が起きている現代世界では、国家や労働市場などマクロな制度の再編成と、家族や親密な人間関係など私的な領域の変容が同時進行している。本COEではその両端の変化と相互関係に注意を向けながら、とりわけアジアに特徴的な諸問題（超低出生率、急速な高齢化、家族主義的福祉、国際移動の女性化等）の分析と解決をめざしている。

      拠点ページ：http://gcoe-intimacy.bun.kyoto-u.ac.jp/'
