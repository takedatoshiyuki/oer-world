name:
  ja: 土曜市民セミナー 食快感の解剖学 （2013）
description:
  ja: 味の基本要素として甘味、塩味、酸味、苦味、うまみを取り上げるほか、辛み、のどごし、温度感覚のような口や喉で感じる要素も扱う。さらに、飲み込んだ後に胃や腸にあるセンサー細胞がどのように認識し、消化吸収へつながるかにも触れ、食快感を多面的に考える。
quotedDescription:
  text:
    ja: 私達は味を感じるために、われわれは舌の表面に５種類の味、すなわち甘味、塩味、酸味、苦味、うまみを識別することができる味蕾（みらい）をもっています。さらに辛み、のどごし、温度感覚などの複雑な味覚要素を口や喉の神経を通して直接感じていると考えられています。ビールの喉越しや麺食での喉を通過するときの快感は重要ですよね。飲み込んだ後は胃や腸に存在するセンサー細胞がそれらを認識して、効率のよい消化吸収を導いています。このセンサー細胞は神経との連絡がなく興奮しても意識にはのぼらないため、私達は飲みこんだ後のことまで感知していないのです。本講義では食快感について改めて考えます。
  source: https://ocw.hokudai.ac.jp/lecture/feeling-good-taste
