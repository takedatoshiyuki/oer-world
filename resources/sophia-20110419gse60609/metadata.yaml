name:
  ja: 情報フルエンシー（情報科学と人間）
description:
  ja: 情報社会の功罪を見極めつつ、携帯電話、メール、SNS、BBSなどを題材に、情報の発信と受信が過多な社会でのコミュニケーションを扱う。技術面だけでなく、コンピュータを通信機器として使う際の人間的な自覚についても学ぶ内容である。
quotedDescription:
  text:
    ja: "人間の可能性は限りがない。インターネットとコンピュータによる闇の部分が強調される昨今であるが、嘆いてばかりでも仕方がない。この授業では、情報社会の功罪をしっかり見極める。また、人間の発信する情報、受信する情報が過多になっているこの社会で人間らしい社会的コミュニケーションを身につけるために我々のすべきことを、情報科学を通して学んでいく。技術的な面を強調するのではなく、携帯電話、メール、ＳＮＳやＢＢＳなどを取り上げ、コンピュータを通信機器として使う際の人間的な自覚を磨くための内容を扱う。\
      \ \n※この科目では、毎回情報倫理に関するビデオを見るため、その部分はカットしております。したがって、通常の講義時間に比べ、毎回の収録時間が短くなっております。\nご了承ください。"
