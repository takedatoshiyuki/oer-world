name:
  ja: オンライン教育セミナー「ハイフレックス型授業の実施方法」（2021.04.23）
description:
  ja: 対面授業とオンライン授業を組み合わせるハイフレックス型授業をテーマに、設計上のポイントを扱う。あわせて、使用する機材や実践例にも触れ、同時配信授業・対面授業・オンデマンド授業の受講形態を前提にした授業実施を紹介する。
quotedDescription:
  text:
    ja: '2021年度は、「新型コロナウイルス感染症への対応が当面続くことを前提とした教育」と「コロナ禍に関わらずオンライン教育の有効性を活かした新たな教育」の両立を図りながら授業を実施する方針であり、対面授業とオンライン授業（同時配信授業、ブレンド型授業）など、多様な形態で授業を実施する必要があります。また学生が同じ授業を「同時配信授業」と「対面授業」と「オンデマンド授業」の3つから選んで受講できる、柔軟性の高い「ハイフレックス型授業」が注目されています。本セミナーでは、ハイフレックス型授業を設計するポイント、使用する機材、実践例などについて紹介いたしました。

      この動画の再生プレイヤーでは、発表者・共有画面・ギャラリービューなどの複数のクリップから視聴画面を選択できます。カーソルを再生プレイヤー上にかざすと画面右側に操作ツールが表示されますので、お好きな画面表示をお選びください。それぞれのツールの機能は、上側がクリップの変更・位置交換、中央が複数クリップの表示方法の変更、下側が複数クリップからのクリップ選択機能です。

      >> スライド資料'
