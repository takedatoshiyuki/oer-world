quotedDescription:
  text:
    ja: '導入：苛酷原子炉事故におけるソースターム評価

      「導入：苛酷原子炉事故におけるソースターム評価」の教材は全てCC BY-NCのライセンスで公開しています。

      本教材の内容は以下の通りです。

      ・ 原子炉内での原子核反応

      ・ 苛酷原子炉事故（Severe Reactor Accident）時の諸現象

      ・ ソースタームの定義とその評価の必要性

      ・ ソースターム評価で重要となる放射性核種

      「解説：苛酷原子炉事故におけるソースターム評価」の教材はこちらから視聴可能です。'
