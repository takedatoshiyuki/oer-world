name:
  ja: 英語-(中級)
description:
  ja: 英語の読解と文章作成を中心に、記事を読んで議論し、グループで発表する活動を扱う。課題では、科学的な話題ごとに、段落構成、レポート執筆、剽窃、論述、論理的な議論、スピーキングなどのテーマを取り上げる。英語を学ぶ対象としてではなく、科学的なコミュニケーションに用いる手段として英語を使う構成である。
quotedDescription:
  text:
    ja: 'This class focuses on English reading and writing. Students read articles and discuss them in
      class. They work in groups to give presentations. Students write two papers and read extensively
      outside of class.

      The course is taught entirely in English. Students do not study about English; they use English
      as a tool to learn about scientific communication. Students are required to read, write, and speak
      English as much as possible.'
