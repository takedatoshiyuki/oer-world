name:
  ja: 計算数理Ⅰ・計算数理
description:
  ja: この講義は、数値解析への入門として、微分積分学や線形代数学に現れる問題をコンピュータで数値的に解くための方法を扱う。連立一次方程式、非線形方程式、定積分、常微分方程式、最適化について、その計算法と背景の理論を学ぶ。
quotedDescription:
  text:
    ja: 線形代数学では、正則な行列を係数行列とする連立一次方程式は、一意な解を持ち、それはクラメールの公式を用いて表現できることを学んだ。しかし、もし、クラメールの公式をそのまま用いて、未知数が30個の連立一次方程式を解こうとすれば、現在利用できる最も速いスーパーコンピュータを用いても、100億年以上かかる見積もりになってしまい、現実的でない。一方、それをガウスの消去法で求めれば、手頃なラップトップ型パーソナルコンピュータを用いても、
      1/100秒もかからない。このように、数学的に解が表現できる、あるいは解が存在するということと、実際に数値を得ることの間には、大きな溝があるのである。数学的な概念や方法を通じて、現実問題を研究する際には、当然、数値的な答えが要求される。そのような問題に対処するために、様々な数学的な概念を、具体的に数値を計算するという立場から研究する分野を数値解析と言う。本講義は、数値解析への入門を目的とし、1年および2年次に学んだ微分積分学や線形代数学に現れる諸問題、例えば、連立一次方程式、非線形方程式、定積分、常微分方程式、最適化（関数の最小化）などを、コンピュータを用いて数値的に解くための方法とその背景にある数学理論の解説を行う。
