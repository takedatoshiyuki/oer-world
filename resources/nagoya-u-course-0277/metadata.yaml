description:
  ja: 英語の総合力を高めることを軸に、英字新聞・雑誌の読解やテレビ・ラジオの英語放送の理解に必要な力を扱う。さらに、PowerPointを用いた英語発表と、英語で議論するための技能も目標に含む。
quotedDescription:
  text:
    ja: 授業を進めてゆくにあたり、主に 4 つの目的がある。1 つ目は、学生の総合的な英語能力を高める。2 つ目は、英字新聞・雑誌の読解およびテレビやラジオの英語放送を理解するのに必要な英語力を身につける。3
      つ目はパワーポイントを使用して英語で発表を行うのに十分なスキルを身につける。そして 4 つ目は、英語で自信を持って議論ができるようになる。
