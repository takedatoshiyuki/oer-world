name:
  ja: 京都大学教育学部で学びませんか？ – 特色入試説明会 -, 2014
description:
  ja: 高校生向けの京都大学教育学部説明会で、教育、心、人間、社会に関わる事象を対象にどのような学びを行うかを扱う。あわせて、教育学部での学びの様子と平成27年度から実施予定の特色入試の内容を紹介する。
quotedDescription:
  text:
    ja: '趣旨

      教育とは何か？心はどのように働くものなのか？教育に関わる社会の仕組みはどうなっているのか？どうすれば、よりよい教育を実現できるのか？――そんな「問い」を抱いている高校生の皆さん、京都大学教育学部で学んでみませんか。

      京都大学教育学部では、教育と心・人間・社会にかかわる多様な事象を対象とした諸科学を探究しています。この説明会では、京都大学教育学部での学びの様子を紹介するとともに、平成27年度から実施予定の特色入試についてもご説明します。'
  source: https://ocw.kyoto-u.ac.jp/course/879/
