quotedDescription:
  text:
    ja: '本授業は、国際政治の現実と理論を踏まえつつ、大局的見地に立ってものごとを理論的・戦略的・戦略的に判断する能力を養うことです。

      日本、アメリカ、中国などの外交をはじめとする国際政治に関心を持っていても、それらをどう読むかは難しいと感じる人は多いかもしれません。本授業は、そのような受講者を対象として、国際政治について、単なる感情や感想を越えて学術的に分析する能力を養います。

      本講義の到達目標は以下の3点です。

      国際政治とグローバル・ガバナンスへの関心を高め、関連する新聞記事や資料を受講前よりも深く読める。

      国際政治とグローバル・ガバナンスについての一定程度の知識と分析能力を身につける。

      卒業後を見据え、ディスカッションや共同作業に慣れる。

      以上の目標を踏まえ、本授業では受講者によるグループ・ディスカッションとグループ・ワークを取り入れます。'
