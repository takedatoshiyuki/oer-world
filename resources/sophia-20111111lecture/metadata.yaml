  ja: ヒトクローン技術、ES細胞研究、生殖補助医療技術の進展を背景に、ヒト胚が科学研究の対象として扱われる状況を取り上げる。そこから、個人主義生命倫理と人格主義生命倫理という二つの立場のあいだで展開する国際的な論争を読み解く。
