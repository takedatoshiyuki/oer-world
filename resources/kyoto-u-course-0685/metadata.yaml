  ja: 中国文字文化論
description:
  ja: 人間の歴史を文字との関係から見直し、中国を主な舞台に文字による記録の移り変わりをたどる。あわせて、文化と学問の歩みや、電子機器による漢字表記が一般的な時代における手書き文化の様相も扱う。
quotedDescription:
  text:
    ja: これまでの人間の歴史を文字との関連においてとらえる。文字による記録が歴史的にどのようにうつり変わってきたか、主として中国を舞台とする観察を通じて、文化と学問の歩みを考える。電子機器での漢字表記が当たり前の時代において、かつての手書き文化の様相を考察することはまことに重要であると考える。
