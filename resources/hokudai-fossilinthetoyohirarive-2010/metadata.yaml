name:
  ja: 土曜市民セミナー 豊平川の化石が語る札幌・海の時代～サッポロカイギュウと賑やかな仲間たち～（2010）
description:
  ja: 豊平川で見つかった化石を手がかりに、札幌の人類以前の歴史を地層から読み解く内容である。2003年に小金湯で発掘されたカイギュウ化石を起点に、北太平洋の大型カイギュウ類の進化や系統、さらに札幌の海の時代に生きた生物の姿を扱う。
quotedDescription:
  text:
    ja: 人類が登場するはるか以前の札幌の歴史は、地下の地層に閉じ込められています。その世界を垣間見せてくれるのぞき窓となるのが、地表を削り地層を露わにしてくれる日本有数の急流豊平川です。 2003年、豊平川の中流域（小金湯）からカイギュウという大きな動物の化石が発掘され北太平洋に生息した大型のカイギュウ類の進化と系統を明らかにしました。豊平川からはその後も次々と新たな化石が発見され、札幌の海の時代とそこに生きた仲間たちの姿を明かにしつつあります。
  source: https://ocw.hokudai.ac.jp/lecture/fossilinthetoyohirarive-2010
