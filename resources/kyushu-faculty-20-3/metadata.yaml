name:
  ja: 情報処理演習II
description:
  ja: この教材は、パソコンやネットワークの基本操作、電子メールや文書作成、情報倫理といったリテラシの内容を扱う。あわせて、DrScheme(racket)を用いたScheme言語の初歩的なプログラミング演習も行う。プログラミング論Iと連携し、問題の分析からアルゴリズムを作って表現する流れを学ぶ。
quotedDescription:
  text:
    ja: '電気情報工学科のプログラミング論I（低年次専攻教育科目）の講義とリンクして、その演習を中心に行います。

      この科目では、リテラシに関する内容とプログラミングに関する内容の大きく2つのことを学びます。

      リテラシに関する内容では、インターネットやその上でのサービスである電子メールなどのしくみ、

      ワープロによる文書作成、情報倫理に関することを学びます。

      Webブラウザや電子メール、日本語ワードプロセッサを利用し、道具としてのパソコンの基本的操作を身につけます。

      これらを通して、一般的な計算機システム(ネットワーク接続を含めて)利用のための知識を身につけることができます。

      プログラミングに関する内容では、パソコン上の DrScheme(racket) を使用して、Scheme言語での初歩的なプログラミングの演習を行います。

      プログラミングとは、与えられた問題を分析し、それを解くための手順、すなわち、アルゴリズムを見つけ、これをプログラミング言語で表現する作業です。実際にプログラムを作成することにより、プログラムの本質であるアルゴリズムの概念を理解することをめざします。'
