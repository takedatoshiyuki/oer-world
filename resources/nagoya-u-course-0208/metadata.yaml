  text:
    ja: 近年、遺伝子組換え食品や遺伝子診断などに代表されるように、生物学に関連する様々な問題が広範な分野において顕在化しつつあり、日常的な話題にも上るようになってきている。本講義では、それらの問題を平易に解説する。これによって、日常生活で遭遇する生物学的な諸問題を正確に理解し適切な判断を行うための素養を養成し、また、生命現象の基本について理解を深める。
