name:
  ja: GCOE総合博物館市民セミナー ナボコフとジャンル越境（2011）
description:
  ja: ウラジーミル・ナボコフがロシアからヨーロッパ、アメリカへ移った経歴と、言語面や知的活動にまたがる横断を取り上げる。あわせて、文学作品におけるジャンル越境の問題を、ナボコフの自伝を中心に論じる。
quotedDescription:
  text:
    ja: 'ウラジーミル・ナボコフは、ロシアからヨーロッパを経てアメリカへと、文字どおりの越境を果たしただけではなく、言語面や知的活動の諸分野においても横断を行った作家でした。ここでは、彼のそのような多領域にまたがる横断を紹介しつつ、文学作品におけるジャンル越境の問題を、特に彼の自伝を取り上げながら論じます。

      ‡ これらの資料は制限資料です。'
