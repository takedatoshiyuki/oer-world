  ja: 細胞の構造や機能から、代謝、細胞周期、シグナル伝達、免疫、脳・神経系、遺伝子と病気、遺伝子工学までを扱う講義である。各テーマに対応する教科書の章が示され、教科書外の内容は配布資料や参考書で補う。
quotedDescription:
  text:
    ja: '細胞の構造と機能（第1章）

      細胞骨格と運動（第13章）

      タンパク質と酵素（第4章）、代謝と生体エネルギー生産（第10章）

      がん（第24章）

      神経・ホルモンによる調節（第2章（5,6）、第14章、第16章（3））

      シグナル伝達（第15章）

      細胞周期（第17章）

      免疫の仕組み（第23章）

      免疫と病気

      脳・神経系の機能（第28章、第16章(1,2)）

      生活・環境と微生物（第26章）

      遺伝子と病気（第5章、第6章）

      遺伝子工学（第8章、第20章）

      *3-13は別の教員が担当

      授業は上記の内容を取り上げながら進めますが、順序は前後する場合があります。

