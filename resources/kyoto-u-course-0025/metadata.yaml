name:
  ja: 認知心理学概論Ⅱ
description:
  ja: 人間の高次認知過程の基本的特性を、認知心理学と認知科学の主要な理論・モデル、実験データに基づいて扱う講義である。あわせて、教育への応用も検討し、講義資料には学習、知能、思考、言語、推論、批判的思考、意思決定などのテーマが含まれる。
quotedDescription:
  text:
    ja: '授業の特色

      教員の講義とデモ実験とともに、学生の話題提供や問題提起、指定討論、リンク集の紹介をおこなう双方的な授業です。また、eLearningシステムmoodleを活用しています。

      授業の紹介

      人間の高次認知過程の基本的特性とそれをとらえる認知心理学、認知科学研究の主要な理論とモデルに関して、実験データに基づいて検討します。あわせて、教育における応用についても検討します。'
