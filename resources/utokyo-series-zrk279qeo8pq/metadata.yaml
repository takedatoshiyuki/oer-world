name:
  ja: 物質の科学 ‐その起源から応用まで（学術俯瞰講義）
description:
  ja: 物質を手がかりに、その起源を探る学問、性質を解明する学問、工学的に利用する学問を横断して扱う講義である。物質の科学に関わる学術の流れを通して、現代の物質の科学の全体像を示す内容になっている。
quotedDescription:
  text:
    ja: '現代の科学・技術は、素粒子から生命体に至るまで、あるいは個人から社会全体に至るまで、さまざまな階層における基礎的な現象、応用に関わる事柄を対象にしている。そして、対象とすべき現象・事柄は、科学・技術の発展にともなって増加の一途をたどっている。

      この講義では、われわれの身の回りの全ての現象・事柄の根源にある「物質」をキーワードとして、物質の起源を探る学問分野、物質の性質を明らかにする学問 分野、物質を工学的に利用する学問分野を繋いで、「物質の科学」を貫く学術の流れを解説する。この講義によって、学生が現代の「物質の科学」の全体像を掴
      み、さらには、前期課程で学んでいる授業科目の重要性や位置付けを再考し、将来の勉学に向けて展望を得ることができればよいと考えている。'
  source: https://ch.u-tokyo.ac.jp/series/?id=Zrk279Qeo8PQ
