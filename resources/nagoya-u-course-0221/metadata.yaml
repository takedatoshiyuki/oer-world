name:
  ja: 人間形成学講義-III
description:
  ja: アメリカを中心に、教育思想と教育実践の展開を歴史的にたどる講義である。公開講義ノートでは、植民地期から独立期、フランクリンやエマソンの思想、公教育制度の成立、多民族社会、プラグマティズムまでを扱う。
quotedDescription:
  text:
    ja: 'アメリカの歴史一般、教育思想、教育哲学を学びながら、資本主義社会の変遷とポスト資本主義社会の行方、それらの社会における教育のあり方について基本的な知見と理解を得る。

      今年度は、アングロサクソン圏の教育思想と歴史をたどりながら、社会・文化・経済と教育の発展についてともに考えていく。特にアメリカに誕生した哲学、教育思想、教育実践を概説する。'
