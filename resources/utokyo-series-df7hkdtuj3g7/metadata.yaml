name:
  ja: 欧州の研究マネジメント専門家から学ぶ：国際連携研究で求められるスキルと役割
description:
  ja: 海外と連携した研究事業を進める際の進め方や、研究推進を支える役割に関心を向けたワークショップである。オランダで国際連携研究や外部資金獲得の調整、戦略策定に携わってきた専門家を招き、欧州の国際連携研究と研究助成の動向を扱う。
quotedDescription:
  text:
    ja: "「国際連携研究は正直どうやって進めればいいの？」 海外と連携した研究事業の重要性が高まる中で、研究自体や研究推進の支援を実際どう進めればいいのか知りたいというニーズが研究者そして研究マネジメント人材の中で高まっています。\
      \ \n  本ワークショップでは、オランダから国際連携研究や外部資金獲得のコーディネート、戦略策定を長年行ってきた研究マネジメント専門家を招き、欧州の国際連携研究や研究助成の動向をお話い…"
