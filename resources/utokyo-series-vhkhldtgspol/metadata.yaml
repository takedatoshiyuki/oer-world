description:
  ja: VR（バーチャルリアリティ）技術を、感覚との関係から捉え直し、新しい感覚の技術として扱う講義である。触力覚、嗅覚、味覚を中心に、人工的な感覚刺激を生み出すしくみについて語る。
quotedDescription:
  text:
    ja: VR（バーチャルリアリティ）技術とは、デジタル技術を駆使して疑似的体験をつくり出す技術のことを指します。体験は感覚と不可分の関係にあり、VR技術を感覚の技術と呼ぶ人もいます。感覚間の相互作用を利用することによって、おどろくほど単純な仕組みで人工的な感覚刺激を作り出すこともわかってきました。本講義では、これまで難しいとされてきた触力覚、嗅覚、味覚などを中心に新しい感覚の技術について語ります。
