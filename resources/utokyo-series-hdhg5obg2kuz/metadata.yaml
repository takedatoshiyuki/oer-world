description:
  ja: 生鮮水産物の鮮度をめぐり、消費者が重視する一方で正確に判別しにくいという点を扱う。鮮度の価値と、鮮度を可視化したときに何が起きるかという問いに関する研究を紹介する。
quotedDescription:
  text:
    ja: '鮮度は、生鮮水産物に関して消費者が最も重視する属性の一つです。それにもかかわらず、多くの消費者は鮮度を正確に判別することができません。このことは、日本人の魚離れの一因になっている可能性があります。鮮度にはどれほどの価値があるのか、鮮度を可視化すると何が起きるのか、これらの問いに迫る一連の研究について紹介します。

      ★あなたのシェアが、ほかの誰かの学びに繋がるかもしれません。

      お気に入りの講義・講演…'
