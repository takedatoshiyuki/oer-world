name:
  ja: 特別プログラム 第1回 福島第一原子力発電所における事故の影響に関する説明会 （2011）
description:
  ja: 福島第一原子力発電所の事故に関連して、原子炉や放射線、チェルノブイリ事故との違い、環境中の放射性物質の測定データ、東日本沖の海洋循環を扱う。公開資料には開会挨拶を含む5件の講義資料があり、事故の影響を複数の観点から整理する構成になっている。
quotedDescription:
  text:
    ja: 福島第一原子力発電所における事故の発生以降，英語による情報提供が不足しており，留学生をはじめとする在留外国人にとって不安要素となっているところであり，正しい知識を獲得できるようにし，情報不足による不安を軽減するため，本学等の専門家から現在の状況に関する情報を提供します。
