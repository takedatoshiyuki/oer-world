description:
  ja: 学術的なトピックと読解を通して、英語での多読・精読、論文作成、討論を扱う講義である。リベラルアーツ英語プログラムの中核科目として位置づけられ、批判的思考の育成に重点を置く。1学期から3学期までを順に履修する構成で、公開動画は授業の一部を示している。
quotedDescription:
  text:
    ja: 'English for Liberal Arts Program(Stream 4): Academic Reading and Writing Along with Reading and
      Content Analysis 4, ARW4 is a core course in the ELA Program. By engaging important intellectual
      issues through core topics and readings, this course develops students academic English proficiency
      in extensive reading, writing, and discussion. Particular emphasis is placed on developing critical
      thinking skills, a cornerstone for further coursework in the liberal arts. This course is taught
      over three terms which must be taken in sequence.

      「精読と英文構成法」と共に、リベラルアーツ英語プログラム(Stream 4)の中核となる科目である。学問的テーマに沿って選ばれたトピックの学習を通して、大学課程で要求される英語運用能力（多読・精読、論文作成、討論)の
      向上と、学習スキルの獲得を図る。基礎的学問能力としての批判的思考能力の修得に重点をおく。1、2、3学期の順に履修すること。

      Contents of Lectures

      2 Lectures / 2 Videos

