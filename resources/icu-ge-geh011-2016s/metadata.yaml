name:
  ja: H1：Music and Society 音楽と社会（Ａ）
description:
  ja: 音楽や音と社会の関係を扱い、人間の社会活動のなかで音楽が果たす役割と存在意義を考える講義である。題材は主に西洋音楽の伝統から選ばれ、サウンド・スケープ、メセナ、ジェンダー、音楽社会学を軸に進む。講義内ではグループ・ディスカッション、エッセイ、プレゼンテーションも行う。
quotedDescription:
  text:
    ja: 'This course inquires into the relationship of music, or sound in general, to society, and reviews
      the role of music and its raison d”etre in the social activities of humankind. The topics are chosen
      mainly from Western traditions of music.

      音楽（あるいは音一般）と社会との関係を探り、人間の社会活動における音楽の役割と存在意義について考える。

