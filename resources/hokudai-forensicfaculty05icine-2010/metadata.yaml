name:
  ja: 土曜市民セミナー 法医学と博物館（2010）
description:
  ja: 法医学の基本的な考え方と、その対象が日常生活に近い場面にも及ぶことを取り上げる講義である。あわせて、北海道大学の博物館に所蔵されている網走市モヨロ貝塚遺跡出土のオホーツク人骨を検査した事例を通して、法医学で何が分かったかを扱う。
quotedDescription:
  text:
    ja: '法医学は「法律上の問題となる医学的事項を考究し、これに解決を与える医学」と定義されています。一般的には、マスコミで取上げられるような刑事事件の被害者の死因などを調べる仕事をしているものと捉えられていると思いますが、法医学は一般市民の日常生活の意外と近いところにあります。このような法医学について紹介します。

      また、本博物館に所蔵されている網走市モヨロ貝塚遺跡から出土したオホーツク人骨を検査したことがあります。ここで法医学を使ってどのようなことが分かったかを紹介します。'
