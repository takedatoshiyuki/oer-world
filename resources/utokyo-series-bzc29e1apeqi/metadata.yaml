description:
  ja: 東京大学の教養学部前期課程で理系クラス向けに開講される、微積分の講義である。大学で必要な微分・積分の基本知識を扱い、高校までに学んだ内容を前提として進める。数学ⅠAと比べると、数学ⅠBは実践的な計算に重点を置く。
quotedDescription:
  text:
    ja: '数学Ⅰは、教養学部前期課程（1年、2年）において、理系クラスが履修を課せられている講義です。数学Ⅰには数学ⅠAと数学ⅠBがあり、どちらのクラスもほぼ同じ内容ですが、数学ⅠAは、論理的な部分に重点を、数学ⅠBは実践的な計算に重点を置いています。

      数学Ⅰでは、微積分を学び、大学で必要とされる微分・積分の基本的な知識を習得します。そのため、高校までに学習した微分・積分の知識は知っていることを前提として授業は行われます。'
