name:
  ja: 土曜市民セミナー TPPと北海道農業（2012）
description:
  ja: TPPの交渉開始から参加国の拡大、交渉分野の広がりまでを踏まえ、日本の交渉参加をめぐる状況を扱う。あわせて、交渉の対立点や、参加を考えるうえでの問題点を整理して話す内容である。
quotedDescription:
  text:
    ja: TPP＝Trans-Pacific Partnership Agreement（環太平洋連携協定）は、２０１０年３月から交渉が開始され、今年１２月に第１５回の交渉会合が開催される予定です。交渉参加国は米国を含む１１ヶ国に拡大し、２１分野にわたる幅広い交渉分野を設定しています。日本のTPP交渉「参加」をめぐる動向は、昨年１１月１１日の野田首相会見で大きな節目を迎え、それからおよそ１年が経過しています。現在は「参加協議入り」という段階であり、日本はまだ正式な「参加表明」はおこなっていません。TPP交渉は難航していると伝えられています。交渉の対立点や日本のTPP交渉「参加」をめぐって考えなければならない問題点を整理してお話ししたいと思います。
  source: https://ocw.hokudai.ac.jp/lecture/tppfaculty02-2012
