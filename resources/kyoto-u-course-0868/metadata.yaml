  ja: 総合生存学館（思修館）が、エネルギー・環境・人口などの地球規模課題を背景に開催する第4回国際シンポジウムである。国内外から若手の専門家・実務家を招き、エネルギー転換をめぐる論点を扱う。
quotedDescription:
  text:
    ja: '概要

      総合生存学館（思修館）では、高い使命感・倫理観を有するグローバルリーダーとしての責任を持った人材育成を目的として掲げています。また、エネルギー・環境・人口等に関する地球規模の問題について研究を行っています。このたび、その活動の一環として国内外から若手の専門家・実務家を招いて、第4回国際シンポジウム「The
      Global Energy Transformation」を開催します。'
