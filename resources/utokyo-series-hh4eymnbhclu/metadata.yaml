name:
  ja: 共に生きるための知恵（朝日講座「知の冒険—もっともっと考えたい、世界は謎に満ちている」2014年度講義）
description:
  ja: 人や生物、無生物との関係の中で生じる不安定さや衝突を手がかりに、共に生きるための知恵を考える講義である。複数分野の学知を横断し、その到達点と、なお残る課題を確認する。
quotedDescription:
  text:
    ja: 自分をふり返ると、多くの人々そして様々な生物や無生物と関係を持ちながら生きているということに思い当たります。それは、ごく自然なことにも感じられますが、他方で相当な不安定さもはらんでいて、衝突や対立が起こる場合もあります。その不安定さを乗り越えようとする試行錯誤から人類が生みだしてきたのが、共に生きるための知恵ともいうべきものです。実は、様々な分野の学問は、その知恵を結晶させたものと見ることができるでしょう。この授業では、多様な学知を横断しながら、そのような努力の成果・到達点を確認しつつ、今なお残る困難さについて考えてみたいと思います。
  source: https://ch.u-tokyo.ac.jp/series/?id=hH4EymNBhcLU
