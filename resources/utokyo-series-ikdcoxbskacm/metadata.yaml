name:
  ja: 放射能の農畜水産物等への影響についての研究報告会 第8回報告会
description:
  ja: 福島第一原子力発電所事故後の被災地支援研究として続けられてきた報告会の第8回である。福島県の米の全量全袋検査、果樹や作物における放射性セシウムの動き、水田湛水による放射線量低減の試みなど、農畜水産物と周辺環境への影響を複数の観点から報告する。あわせてチェルノブイリの事例も取り上げる。
quotedDescription:
  text:
    ja: "福島第一原子力発電所の事故直後から、3-4ヶ月ごとに開催してきた本学農学生命科学研究科での被災地支援研究も、今回で 8 回目となる。今回は福島県における米の全量全袋検査の取組み、放射性セシウムの果樹樹体内における動態、水田湛水による周辺環境の放射線量低減の試み、放射性セシウム汚染堆肥中で栽培した各種作物における放射性セシウム動態、チェルノブイリの事例等についての研究報告を行う。\
      \ \n \n  農学生命科学研究…"
