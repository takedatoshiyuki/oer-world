description:
  ja: 表計算ソフトウェアを用いて、最小二乗近似や相関解析、自己相関分析、判別分析、気温予測などの時系列データ解析を扱う。続いて、数式処理ソフトウェアを使った基礎数学、代数計算、微分・積分、グラフ作成、2次元アニメーションの操作を扱う。
