name:
  ja: 数学ー革新の歴史と伝統の力（学術俯瞰講義）
description:
  ja: この講義は、数学が歴史の中でどのように革新され、同時にどのような伝統を受け継いできたかを扱う。座標や複素数、微分積分の成立から、幾何学の公理や連続・変換の概念をめぐる展開、さらに確率・統計や数理モデルを通じた社会との関わりまでを取り上げる。数理科学の研究者が、数学の発展と現代の課題への応用の接点を語る構成である。
quotedDescription:
  text:
    ja: 'コーディネータ　坪井俊（理学部）

      ナビゲータ　　　緒方芳子（理学部）

      現代の数学はその長い歴史に支えられている。客観的な状況の評価や合理的な意思の決定のために数学は用いられてきた。人類が様々な事象に出会うたびに、それに対応するために数学は革新されてきた。数学の論理、数の概念は長い歴史の中で何度も問い直された。座標の方法の定着、複素数の発見、微分積分の創始など、高等学校で学ぶ数学の革新の後にも、幾何学の公理、連続の概念、変換の概念などを巡り、数学者の研究は進化し、新しい理論を生み出してきた。

      数学は一方でそれ自体の整合性を求め創造的革新的に発展してきたが、他方で社会との関係の中で様々な飛躍を行ってきた。前世紀には数学の抽象化、形式化が大きく進んだが、これにより数学の応用範囲は拡がった。数学は科学の基礎として人々の事象のとらえ方に大きな影響も及ぼしてきている。

      このような社会との相互作用の中で、数学の革新はそれまでの研究成果を止揚する形で進んだ。時には必要な応用への準備が数学の自体の中で前もって準備されているようなこともあり、現実の諸問題への数学の応用は社会から期待されるものになってきている。確率や統計の概念は、客観的な状況の評価や合理的な意思の決定のために現代の社会において重要な役割を果たすようになった。計算情報技術の大幅な進歩の中で、完成度の高い数理モデルの構築へむけて、現象を観測、分析、統合する側と数学の道具を開発する側の協働作業がますます必要とされている。

      この講義では、これまでの数学の革新の歴史を振り返るとともに、そこで培われた伝統の力が新しい現象の理解、社会の問題への対処のためにどのように使われてきたかを、数理科学に関係する第一線の研究者に語っていただき、皆さんに数学の創造の現場の様子をお伝えしたいと思う。'
