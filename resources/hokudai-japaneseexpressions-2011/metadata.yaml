name:
  ja: 人文学カフェ その言い方が人を怒らせる（2011）
description:
  ja: 会話の中で起こる不快感や誤解を手がかりに、ことばによるコミュニケーションの問題を語用論から考える講義である。敬語、方言、流行語などの例を通して、ことばの使い方と文脈の関係を扱う。
quotedDescription:
  text:
    ja: '人と会話していて、なんとなく相手のことばに不愉快になったり、自分の言いたいことがうまく伝わらなくて誤解されたり----誰しもそんなことばの行き違いの経験があるのではないでしょうか。わたしたちは、コミュニケーションがうまくいかない原因を「微妙なニュアンス」、「空気が読めない」といった表現で語りがちです。でも、ニュアンスや空気って一体なんなのでしょう。

      今回の話し手の加藤重広さんは、ことばの専門家。ことばが原因で起こるさまざまなコミュニケーションの問題を、「語用論」というツールを用いて科学的に分析します。語用論とは言語学の中でも新しい研究分野で、さまざまなことばの使い方を「文脈を科学する」ことにより解き明かしていくことができます。加藤さんの手にかかれば、敬語も方言も流行語も、あらゆることばが、あざやかに切り分けられていきます。ことばのコミュニケーションに不安をもつ方も、ことばそのものに興味がある方も、加藤さんと一緒に、ことばについて考えながら楽しいひとときを過ごしましょう。'
