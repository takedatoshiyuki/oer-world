description:
  ja: この動画は、過重労働を含む労働問題を手がかりに、働くことに関わるルールを考える教材である。東京大学を卒業・修了した後に若くして過労自死に至った人々を取り上げ、遺族へのインタビューと弁護士の解説を通じて、労働問題が身近に起こり得ることを扱う。
quotedDescription:
  text:
    ja: "この動画は、過重労働等の労働問題に焦点を当てた、ワークルールを考えるための教材です。\n東京大学を卒業・修了後に、若くして過労自死に追い込まれてしまった方々について紹介しています。\n\
      ご遺族へのインタビュー取材や弁護士による解説から、労働問題は決して他人事ではなく、\n皆さんご自身や身近でも起こり得るということを知っていただき、適切な防止や対処につなげていただきたいと思います。\n\
      \ \n※注意※\nこの動画コンテンツには、自殺に関する描写があります。気持ちが不安定になるおそれのある方は、視聴をお控えください。\n映像提供：学生相談支援課キャリアサポートチーム\n映像製作委託者：土屋トカチ"
