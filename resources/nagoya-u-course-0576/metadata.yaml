name:
  ja: 第二言語習得研究概論a
description:
  ja: 第二言語習得における教室内外のインタラクションを、会話分析の方法論から扱う講義ノートである。会話分析の理論的背景と基本的な考え方を確認したうえで、日常会話の構造を分析するための切り口を示し、収集した会話データの分析につなげる。
quotedDescription:
  text:
    ja: 教室内・外での言語習得のプロセスを理解するためには、教師と学習者、学習者と学習者、あるいは学習者と地域コミュニティの母語話者がどのようなインタラクションを行っているかを詳細に分析する必要があります。本概論では、そうした対人コミュニケーションのプロセスを分析するためのツールとして社会学の分野で確立された「会話分析」（Conversation
      Analysis）の方法論について学びます。まず、会話分析の理論的背景や基本的な考え方を押さえたあと、日常会話の構造を分析するためのさまざまな切り口を紹介し、各自が収集した具体的な会話データを分析できる素地を養成します。
