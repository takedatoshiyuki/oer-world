name:
  ja: 英米法演習（アメリカの裁判と準拠法）
description:
  ja: アメリカの紛争解決において、どの裁判所でどの法律を適用するかという問題を扱う。教材の設問を順に追いながら、アメリカの国際私法の考え方と裁判のルールを、日本との比較を交えて検討する。
quotedDescription:
  text:
    ja: 'アメリカであれどこであれ、紛争が訴訟によって解決されようとする場合、どこの裁判所でどの法律が適用されて解決が図られるかという問題が最初の関門となる。

      この講義では、アメリカにおける国際私法（州際私法、抵触法）を具体的な事例を交えて解説した参考書である Michael H. Hoffheimer, Conflict of Laws (Aspen
      2009)  を教材とする。この教材の全400頁の設問を１つずつ回答していくことで、アメリカにおける裁判のあり方と、それに関するルールについて、日本との比較を交えながら検討する。'
