    ja: 2025年度研究倫理セミナーでは、「責任ある研究とイノベーションの浸透と実践－その２－」をテーマに、RRI（Responsible Research and Innovation：責任ある研究とイノベーション）やELSI
      （Ethical, Legal and Social Issues：倫理的・法的・社会的観点）に関する講演を行います。 また、RRIやELSIについて、様々な学問分野からの視点を共有、議論し、４部局における良い取り組みについても紹介します。
