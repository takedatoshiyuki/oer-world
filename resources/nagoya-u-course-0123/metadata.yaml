name:
  ja: 情報デバイス工学特論
description:
  ja: 情報処理に利用される電子デバイスの役割と、CMOSテクノロジーの動向を扱う講義である。CMOSデバイスの構造と動作原理を基礎から復習し、CMOS集積回路の設計法まで学ぶ内容になっている。公開教材には、CMOSFETの特性、基本回路、シミュレーション技術、演習問題、レポート問題が含まれる。
quotedDescription:
  text:
    ja: 1. 情報処理に利用される電子デバイスの役割と、最新のCMOSテクノロジーの動向を把握する。  2. CMOSデバイスの構造と動作原理を基礎から復習し、素子の動作を明確に理解する。  3.
      CMOS集積回路の設計法を学ぶ。
