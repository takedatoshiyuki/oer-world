  ja: 2015年度にCedepが実施した2つの大規模調査の結果を手がかりに、日本の保育の実態を読み解く公開シンポジウムである。現場の声を踏まえ、保育・幼児教育の質の保証と向上に向けた今後の方策を検討する。
quotedDescription:
  text:
    ja: "東京大学大学院教育学研究科附属・発達保育実践政策学センター（Cedep）では、子ども・子育て支援新制度施行元年である2015年度に2つの大規模調査を実施しました。この公開シンポジウムでは、調査で明らかになった「現場の声」をもとに日本の保育の実態をひもときながら、保育・幼児教育の質の保証と向上にむけた「次の布石」を探っていきます。\
      \ \n  開催報告は     こちら   \n  ★あなたのシェアが、ほかの誰かの学びに繋がるか…"
