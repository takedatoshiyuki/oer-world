name:
  ja: フィールドセミナーI
description:
  ja: 地球惑星科学の講義で得た知識を、野外での観察を通して確かめる実習である。岩石や地層に含まれる情報を読み取り、自然の多様さや地球の歴史を観察から考える内容を扱う。
quotedDescription:
  text:
    ja: 'フィールドセミナー Ⅰ は、講義で得た地球惑星科学に関する知識について、野外で実際に観察し、理解を深める実習です。授業では岩石はシンプルに数種類に分類されることを教わりますが、野外で実際に観察すると、同じ種類の岩石でも多様な特徴があり、自然界の多様性を認識します。

      地球が数万年、数億年とかけて営んできた歴史は、これらの岩石や地層に様々な情報として刻まれています。その情報をできるだけ多く読み取ることが、地球の理解へとつながります。この実習では、講義で得た知識の理解を深めるとともに、野外における観察力を身につける授業です。'
