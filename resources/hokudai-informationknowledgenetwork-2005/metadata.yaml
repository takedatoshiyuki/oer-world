name:
  ja: 大学院教育 情報知識ネットワーク特論（2005）
description:
  ja: ネットワークを通じて情報や知識を扱うための技術を学ぶ講義で、情報検索、データマイニング、ウェブ情報システムを中心に据える。対象はウェブデータやテキストデータなどの大規模な非定型データであり、テキストパターン照合やパターン発見、HTMLやXMLを含む半構造データ処理まで扱う。これらをアルゴリズムとプロトコルの観点から学ぶ。
quotedDescription:
  text:
    ja: 高度なネットワークと大規模記憶装置の急速な発達によって、現在、膨大な量のデータがネットワーク上で利用されている。本講義では、ネットワークを介して情報や知識を伝達し、共有するために必要な技術について講義する。具体的には、ウェブデータやテキストデータなどの大規模非定型データ処理のための基礎技術として、情報検索および、データマイニング、ウェブ情報システムに焦点をあてて、テキストパターン照合技術、パターン発見技術、HTMLやXML等の半構造データ処理について、とくにアルゴリズムとプロトコルの視点から学ぶ。
  source: https://ocw.hokudai.ac.jp/lecture/informationknowledgenetwork-2005
