name:
  ja: 'N1: Senior Integrating Seminar in Natural Sciences N1: 自然科学総合演習'
description:
  ja: 自然科学と数学の各分野の特徴や相互関係、さらに他分野との関係を扱う。少人数での書籍講読、特別講義、討論を通して学ぶ構成で、第4年次向け科目として開講されている。公開教材には「人間世におけるエコロジカルな文明の展望」に関する講義資料が含まれる。
quotedDescription:
  text:
    ja: 'A study of the characteristics and interrelationships of the different branches of the natural
      sciences and mathematics, and their relation to other disciplines. Small group study of important
      books on these topics, special lectures and general discussion. Course for senior students who have
      already taken more than two foundation courses of the natural science majors.

      自然科学や数学の種々の分野の特徴，相互関係，他の学問等との関係について，主要な著書の少人数グループによる講読，特別講義，履修学生全員参加の討論などを通して学ぶ。自然科学系基礎科目を2科目以上履修済みの第4年次向け科目。

      Contents of Lectures

      7

