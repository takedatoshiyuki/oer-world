  ja: ウナギの資源減少とニホンウナギの絶滅危惧種指定を背景に、何が減少の要因なのか、どう回復させるのかを考えるシンポジウムである。日本のウナギ食文化を続けるために、複数の視点を持ち寄って議論する内容を扱う。
quotedDescription:
  text:
    ja: ウナギは今、慢性的な資源減少に直面しています。2014年6月12日、環境省に次いでIUCNもニホンウナギを絶滅危惧種に指定しました。なぜ資源はこんなにも減ってしまったのでしょうか？どうすれば回復させることができるのでしょうか？私たちはこれからもうな丼を食べ続けることができるのでしょうか？問題は山積しています。このシンポジウムは、日本人がこよなく愛するウナギの食文化を絶やさないために様々な考えを持ち寄り、人と…
