  ja: 情報システムの中心となるプログラミングと計算機の仕組みを学んだうえで、組み込みシステム、ハイパフォーマンスコンピューティング、ネットワーク、データベース、オートマトン・形式言語へと内容を広げる。基礎理論と具体的な処理方法を扱い、全7回の授業として構成されている。
