    ja: 'まず，情報システムの中心部分であるプログラミングおよび計算機の仕組みについて学んだ後に，関連技術である，組込みシステム，ハイパフォーマンスコンピューティング，ネットワーク，データベース(Web)，オートマトン・形式言語について，基礎となる理論と具体的な処理方法について学ぶ。

