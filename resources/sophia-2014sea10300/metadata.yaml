description:
  ja: 春学期の基礎物理学で学ぶ力学の基礎を土台に、熱力学と電磁気学の基礎を扱う講義である。熱力学では第1法則、第2法則と熱機関の効率を学び、後半では電磁気学の基礎を基礎から学ぶ。
quotedDescription:
  text:
    ja: 春学期の基礎物理学において，力学を通して学んだ物理学の基礎概念を生かし，熱力学と電磁気学の基礎を学ぶ。熱力学においては熱力学の第１法則，第２法則を学んだ後，熱機関の効率を講義する。これらはエネルギー問題の議論に書かせない概念なので基礎から理解できるようにする。後半は現代の文明社会を理解する上で書かせない電磁気学を基礎から学ぶ。
