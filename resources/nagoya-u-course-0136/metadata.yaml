name:
  ja: 古代国家と手工業
description:
  ja: 日本古代の律令国家が手工業生産をどのように統制しようとしたかを、瓦生産を例に扱う講義である。六国史・律令格式・正倉院文書と、発掘調査で出土した文字瓦の分析を通じて、生産の実態と国家の関与を検討する。文字瓦から生産現場の情報を読み取り、国家が把握していない生産のあり方にも目を向ける。
quotedDescription:
  text:
    ja: この講義は、文献史学の方法により、日本古代の律令国家が手工業生産をどのように支配しようとしたのか、という問題について、国家が掌握していない部分も視野に入れながら考えることを目的とします。今回は、その中でも瓦の生産を題材とします。まず、六国史、律令格式、正倉院文書などから、古代における瓦生産の基本的なあり方について整理した上で、次に発掘調査によって出土した文字瓦の分析を行います。瓦に記された箆書きの文字は、瓦を焼く前にしか記すことはできません。従って、箆書文字瓦の内容からは、生産現場の情報を知ることができます。文字瓦の分析に基づいて、国家による瓦生産の支配や、国家掌握外の瓦生産の問題について検討したいと思います。
  source: https://ocw.nagoya-u.jp/courses/0136-%E5%8F%A4%E4%BB%A3%E5%9B%BD%E5%AE%B6%E3%81%A8%E6%89%8B%E5%B7%A5%E6%A5%AD-2011/
