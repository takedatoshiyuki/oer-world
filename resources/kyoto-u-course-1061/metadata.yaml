name:
  ja: ILASセミナー ：京都の文化を支える森林－地域の智恵 と生態学的知見
description:
  ja: この講義は、京都の文化を支える森林をテーマに、地域の知恵と生態学的知見を扱う。説明文では北白川試験地を取り上げ、その設置の経緯や植栽されている樹木の種類、材鑑室の標本構成を示している。
quotedDescription:
  text:
    ja: '※一部、口頭での説明とテロップ内容に違いがございます。ご了承いただけますと幸いです。

      【北白川試験地】農学部が創設された翌年の1924年に苗畑として，吉田キャンパス北部構内の北東部に設置されました。亜寒帯から暖温帯に至る国内産250種と，外国産170種，その他栽培品種80種が見本樹として植栽されています。材鑑室には，各研究林および試験地から集められた裸子植物5科23種，被子植物33科103種の材鑑標本が収められています。'
