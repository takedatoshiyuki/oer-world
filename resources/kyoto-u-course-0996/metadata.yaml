name:
  ja: 【オンライン公開講義】“立ち止まって、考える” – 連続講義（4）地域研究・メディア学　メディアとコミュニティ―東南アジアから考える
description:
  ja: 東南アジアを題材に、自然災害、独立・建国、大量移住などで社会の秩序が変化した場面を取り上げる講義である。そこで人びとが問題を解決し、社会のまとまりを育ててきた過程を通じて、地域や時代の特性を踏まえて情報を読み解くことを考える。
quotedDescription:
  text:
    ja: '社会的距離を意識した生活が続く一方で、互いに面識がなく実際に会うこともまずないであろう人どうしがオンラインでコミュニケーションをとる機会が増えている。情報技術の発達によって言葉の壁もある程度乗り越えられつつあり、そうであるからこそ情報をどう解釈するかがますます大切になる。多民族・多言語・多宗教の人びとが暮らす東南アジアでは、考え方や生活習慣が互いに異なる隣人どうしが社会を作る工夫と努力を重ねてきた。この講義では、自然災害、独立・建国、大量移住などによって社会の秩序が大きく変わったときに、東南アジアの人びとがどのように問題を解決して社会のまとまりを育ててきたのかを紹介することを通じて、地域や時代の特性を踏まえて情報を読み解くことの意義について考えてみたい。

      オリジナルのコンテンツは、人社未来形発信ユニットのウェブサイトでご覧いただけます。

      https://ukihss.cpier.kyoto-u.ac.jp/1669/'
