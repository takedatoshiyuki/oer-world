name:
  ja: 農産加工学演習Ⅰ
description:
  ja: 自然界の植物や動物を対象に、画像入力装置やマシンビジョンシステムの構成を演習形式で学ぶ。色の表現、照明、カメラ、スペクトル反射といった基礎に加え、PCを用いた果実の画像処理や欠陥検出などの実習を行う。
quotedDescription:
  text:
    ja: '授業の特色

      複雑で多様な自然現象および動植物を対象とし，その光学的特徴を基に画像入力装置の基本的構成を学び，画像解析を行う演習である。一部，PCならびにソフトウエアを用いて実際の果実の画像処理を行う。全て英語で講義されることも本授業の特色である。

      授業の紹介

      現代は，規格化された工業製品だけでなく，自然界の植物，動物をも計測したり，制御・生産する時代である．一方，近年の電気・電子技術等の発達により，高精度なTVカメラが安価に利用できるようになり，その応用範囲は拡大している。本授業では，不定形で多様な生物を対象としたマシンビジョンシステムの構成要素，構築方法などを演習の形式で学ぶ。これにより，自然界における画像計測に関わる用語，知識を幅広く身に着けること，動植物の成長，挙動に関連する特性およびルールが理解できること，画像計測装置の原理が理解できることを到達目標とする。具体的には，電磁波の基本的性質，X線，THｚなどの特殊な電磁波の発生メカニズム，色の表現方法，マシンビジョンシステムの構成，動植物の光学的特性，イメージング技術の応用事例の紹介などを行った後，PCを用いた画像処理演習を行う。'
