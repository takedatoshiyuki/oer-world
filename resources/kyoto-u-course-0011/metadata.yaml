name:
  ja: 教職実践演習
description:
  ja: 教職課程で培った力量をポートフォリオで見直し、不足する知識・技能や伸ばすべき資質能力を整理する演習である。そのうえで、自主学習会や模擬授業、公開研究会・ワークショップへの参加などを通じて力量形成を進める。最後に、演習の成果を報告し、教員として必要な資質能力の到達を確認する。
quotedDescription:
  text:
    ja: '授業の概要・目的

      本演習では、まず教職課程において各自が身につけてきた力量について、ポートフォリオをもとに検討し、それぞれの受講生に不足している知識・技能等やさらに伸長すべき資質能力を明らかにする。次に、ニーズに応じた学習活動（自主学習会・模擬授業の実施、公開研究会・ワークショップへの参加など）を行うことにより、力量形成を図る。最後に、演習における成果を報告し、教員として最小限必要な資質能力が身に付いているかを確認する。'
  source: https://ocw.kyoto-u.ac.jp/course/11/
  note: 京都大学OCW 「授業の概要・目的」より（同サイトの利用条件に基づく転載）
