name:
  ja: 微分積分学 A
description:
  ja: 極限の厳密化を出発点に、連続関数の性質、微分法、積分法を順に扱う講義ノートである。第1回から第10回までの資料が公開されており、具体例を早い段階で多く示す構成になっている。抽象論は必要最低限にとどめ、後から扱う形をとる。
quotedDescription:
  text:
    ja: '授業の特色

      理論面の一般性・厳密性を保持しつつ、抽象論に偏らず、具体例を通じて「体で覚える微積分」を目指す。

       

      授業の紹介

      極限という概念の厳密化から出発し、連続関数の性質、微分法、積分法について述べる。従来の教程を大胆に見直すことにより、具体例をできるだけ早い段階で、かつ多くの時間をかけて述べられるように配慮し、難解な抽象論は必要最低限、かつ後まわしにする。'
