    ja: "前近代の東アジアで「おしえ」は普遍的で包括的なものとして語られ実践されていました。 「おしえ」は、哲学でもあり、宗教でもあり、文学でもあり、歴史でもあって、またいろいろな境界線を越えていろいろな人々に共有されていました。\
      \  \n  しかし、前近代の教えは十九世紀後半から近代的な知識分類によって再編されることになりました。 \n  この講義では、東アジアで共有されてきた普遍的概念「おしえ」が近世近代日本において…"
