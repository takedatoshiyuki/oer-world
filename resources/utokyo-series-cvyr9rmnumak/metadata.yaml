  ja: 前近代の東アジアで普遍的・包括的なものとして語られた「おしえ」を扱い、それが哲学・宗教・文学・歴史などの境界を越えて共有されてきたことを示す。あわせて、十九世紀後半以降に近代的な知識分類によってそのあり方が再編される過程に触れる。
quotedDescription:
