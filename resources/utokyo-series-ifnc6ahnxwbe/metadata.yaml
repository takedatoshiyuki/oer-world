  ja: 農作物の育種を題材に、長い歴史をもつ育種が生命科学や情報科学によってどう変わろうとしているかを扱う。ゲノム解析技術とデータ科学を用いた育種の高速化について述べる内容である。
quotedDescription:
  text:
    ja: "農作物の育種は、人間が有史以前から行ってきた重要な「業」の一つです。その長い歴史をもつ業が、今、近年急速に発展した生命科学や情報科学を原動力にして新しい進化を遂げようとしています。この進化を成し遂げることは、2050年には90億人を超えると推計される世界人口を支える農業生産の実現にも大きく貢献すると期待されます。ゲノム解析技術とデータ科学をもちいた育種の高速化についてお話しします。\
