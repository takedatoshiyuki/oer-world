name:
  ja: 電磁気学-I
description:
  ja: 固定された電荷がつくる電界と、一定速度で運動する電荷のまわりに生じる磁界を扱う講義である。公開されている講義ノートでは、電磁気学の歴史や必要な数学から始め、クーロンの法則、ガウスの法則、電位、導体、コンデンサ、電流回路、ローレンツ力までを順に扱う。
quotedDescription:
  text:
    ja: 電磁気学 I では、固定された電荷がある場合、その電荷によって影響を受ける、即ち力を受ける別の電荷にとっての電界や、一定の速度で電荷が運動するとき、その周りにどのような磁界ができるかを定式化して、様々な例についての電界・磁界の解析を行います。
  source: https://ocw.nagoya-u.jp/courses/0261-%E9%9B%BB%E7%A3%81%E6%B0%97%E5%AD%A6-I-2010/
