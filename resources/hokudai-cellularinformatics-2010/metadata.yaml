name:
  ja: サイエンス・カフェ札幌から Pick up! 知性が生まれるとき ～粘菌の不思議に学ぶ～（2010）
description:
  ja: 粘菌を題材に、迷路解決や輸送効率の高いネットワーク形成などのふるまいを取り上げる。そうした現象を手がかりに、知性とは何か、また自己組織化とは何かを考える内容である。実物の粘菌を見たり触ったりしながら学ぶ。
quotedDescription:
  text:
    ja: '粘菌といえば、何を思い浮かべますか？ 年配の方は南方熊楠（みなかたくまぐす）や、那須の御用邸で採集していた昭和天皇を思い浮かべることでしょう。また漫画『風の谷のナウシカ』では、腐海の世界に生きる心を持つ重要な生き物として、粘菌は登場します。粘菌は、朽ちた木の下や鉢植えなどの湿った場所を好み、意外と身近に存在するアメーバ状の単細胞生物です。この粘菌が迷路を解いたり、鉄道網のような輸送効率に優れたネットワークを作ったりといった「知性」を持つという研究が、最近脚光を浴びています。いったい知性とは何なのでしょうか？
      粘菌のような原始的な生物でも、本能的に秩序だった行動をとることで生き残ろうとします。このような現象は、「自己組織化」と呼ばれ、雪の結晶の成長や、気象衛星からみた雲の模様、化学反応など自然界にも多く存在しています。あたかも「知性」を持つかのように振る舞う粘菌の謎を解くキーワードが「自己組織化」なのです。

      今回のカフェでは上田哲男先生と一緒に、実際の粘菌を見て、触ってもらいながら、粘菌の不思議な魅力と、そこに潜む「知性」とは何かを考えます。粘菌と知恵比べして遊ぼう！'
