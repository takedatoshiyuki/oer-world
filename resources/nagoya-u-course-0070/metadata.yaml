name:
  ja: 数学展望-II
description:
  ja: 数学と物理の関係をテーマにした講義の資料をまとめた教材である。公開されているのは第1回から第12回までの講義ノートで、数学を学ぶうえで物理との関連に目を向ける内容を扱う。
quotedDescription:
  text:
    ja: 歴史をひもといてみますと、数学と物理は互いに大きく影響をおよぼし合 いながら発展してきたことが分かります。19 世紀以前ですと、ニュートン力学と微分積 分や位相幾何学、電磁気学とベクトル解析などが代表的なものです。20
      世紀そして今世 紀になると、その関係は更に深くなってきています。ですから、数学をより良く理解する ためには、物理を全く無視する訳にはいきません。 本講義では、数学と物理の関わりにつ
  source: https://ocw.nagoya-u.jp/courses/0070-%E6%95%B0%E5%AD%A6%E5%B1%95%E6%9C%9B-II-2006/
