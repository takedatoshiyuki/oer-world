name:
  ja: 土曜市民セミナー Serbia – a crossroad ／ セルビア（2013）
description:
  ja: セルビアを題材に、バルカン半島にある内陸国としての位置や、歴史的背景から生じた民族・宗教・文化の重なりを取り上げる。あわせて、産業、食、音楽、川を中心とした暮らし、伝統芸術や農村観光、ベオグラードや峡谷、要塞都市、祭り、スポーツまでを紹介する。
quotedDescription:
  text:
    ja: セルビアは、ヨーロッパの南東に位置する、バルカン半島にある陸地に囲まれた国です。長い歴史や地理的な位置のおかげで、セルビアには多くの民族、宗教、文化が会い、混ざり、今でも共存しています。様々なサービス、農業、工業が主な国の産業です。美味しい食べ物、にぎやかな音楽、川を中心にした暮らし方、最近の伝統芸術と技術、農村観光の復活等がセルビアで楽しめます。発表では、眠らない町
      ―ベオグラード、ヨーロッパの最大の峡谷、二番目に大きい要塞都市、にぎやかな祭り、スポーツ等について紹介致します。
