quotedDescription:
  text:
    ja: この授業では、人間の健康について、心理学的観点のみならず、医療や保健領域における身体との関連を踏まえて検討していく。心身の問題や疾患の予防、治療、健康の維持と増進について、さらにはライフイベントや災害時の心理社会的問題と支援といった環境要因との関連も含め、健康心理学の包括的な理解を試みる。
      この授業を通して、人間と社会の諸問題への関心を高めることを目的とする。
