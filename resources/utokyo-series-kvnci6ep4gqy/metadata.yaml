name:
  ja: 世界モデル実習/人間の安全保障実験実習
description:
  ja: マルチエージェント・シミュレーションとネットワーク・ゲームを通じて、多数の主体が相互作用する過程を扱う講義である。2005年度は、JAVA版マルチエージェントシミュレータ（kk-MAS）の使い方を学び、簡単なルールから相互作用するエージェントモデルを作成する。国際関係論への適用を念頭に置きつつ、社会・自然現象を対象にしたモデルも扱う。
quotedDescription:
  text:
    ja: '本講義は、マルチエージェント・シミュレーションとネットワーク・ゲームを大きな柱に、国際関係論における新たな方法論の普及と確立を目指した授業であ る。ある行動ルールに従い、多数の主体が相互作用した場合、一体何が起きるだろうか。いかに単純なルールに基づく相互作用であっても、その結果は必ずしも
      自明ではない。マルチエージェント・シミュレーションは、このロジックの交錯が行きつく先を、コンピューターによる数値計算を通して、近似的に確認するこ とができる。一方、ネットワーク・ゲームは、LANを介してつながった複数の人間が、同時進行的にゲームをプレイすることにより、認知的要因や種々の駆け
      引き等が、多主体間の相互作用に及ぼす影響を実験的に探ることができる。いずれも国際関係論への適用を念頭においているが、授業ではそれにとどまらず、広 範な社会・自然現象を相手にしたユニークなモデルが取り扱われている。

      本年度（2005年度）の授業では、去年まで使用していたWindows版に代わって登場したばかりの(株)構造計画研究所「JAVA版　マルチエージェ ントシミュレータ」（JAVA版　kk-MAS）の使用方法を学部および大学院の学生の皆さんに学んでもらう。簡単なルールを記述することで、コンピュー
      タの中に、相互作用する多数のエージェントで構成されるモデルを作ることを試みる。

      ＊ この講義で用いたJava版KK-MASは、2006年3月に「artisoc」へと名称が変更 されました。'
