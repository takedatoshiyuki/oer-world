name:
  ja: 並行分散計算特論
description:
  ja: 並行計算の概念と体系を扱い、通信プロセス計算モデルの表現と意味論を学ぶ講義である。逐次計算モデルとの比較を通じて、並行計算で生じる問題とその対処方法を扱い、さらにモデル検査による信頼性向上にも触れる。
quotedDescription:
  text:
    ja: 並行計算の概念および体系について修得する。特に、通信プロセス計算モデルの表現と意味論について講義し、従来の逐次計算モデルと比較して、並行計算によって生じる問題について、体系的な意味づけとその対処方法について学ぶ。ネットワークを介した情報システムにおける並行計算の具体的イメージを通して信頼性の高い並行ソフトウェアの構築、さらに、具体的な信頼性向上のための形式手法としてモデル検査について述べる。
  source: https://ocw.nagoya-u.jp/courses/0305-%E4%B8%A6%E8%A1%8C%E5%88%86%E6%95%A3%E8%A8%88%E7%AE%97%E7%89%B9%E8%AB%96-2011/
