name:
  ja: 土曜市民セミナー 私達と自然エネルギーの未来(2010)
description:
  ja: 化石エネルギーの燃焼と地球温暖化の関係を取り上げ、温暖化の見方についても触れながら、再生可能エネルギーの利用を考える講義である。市民レベルでの風力発電の事例を紹介しつつ、太陽エネルギーを中心とする利用形態と、その有効性や炭酸ガス削減との関わりを扱う。
quotedDescription:
  text:
    ja: '今日ほとんどの人が化石エネルギ－の燃焼に伴う炭酸ガス排出によって地球温暖化が深刻化することに強い危惧を持っています。地球温暖化のシナリオが、地球環境の数学モデルとして妥当性あるのかどうかは、必ずしも研究者間では一致してはいません。しかしこのままエネルギー消費が指数関数的に継続増大すれば、間違いなく温暖化が到来することは異論のないところです。

      このセミナーでは市民レベルで設置した風力発電システムの経験談などを紹介し、太陽エネルギーを中心とする再生可能なエネルギ－利用の種類とその有効性或いは実効性を探ってみます。同時に私達の生活環境で炭酸ガス削減にどう係わるかなどを一緒に考えてみたいと思います。'
  source: https://ocw.hokudai.ac.jp/lecture/renewableenergy-2010
