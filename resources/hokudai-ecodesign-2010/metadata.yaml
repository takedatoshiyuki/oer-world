name:
  ja: サステナビリティ・ウィーク 都市・農村の地域連携を基礎とした低炭素社会のエコデザイン（2010）
description:
  ja: アジアでの低炭素社会の実現に向けた研究成果を扱い、農村と都市の連携を軸にした資源循環のあり方を示す講義である。農村由来のバイオマスを都市のエネルギー利用につなげる仕組みを取り上げ、北海道や中国の事例を通じて検討する。あわせて、アジアの将来シナリオについて意見交換する。
quotedDescription:
  text:
    ja: 地球温暖化を引き起こす二酸化炭素の排出量が少ない社会（低炭素社会）をアジアに実現させるための研究の成果を報告します。農村から出るバイオマス資源を、都市で使うエネルギーへ効率的に活用するシステムなど、農村と都市の連携のあり方について研究してきました。北海道や中国の事例を通じて見えてきた、エネルギーと物質のあるべき資源循環システムを紹介しつつ、アジアの将来シナリオについて意見交換します。
  source: https://ocw.hokudai.ac.jp/lecture/ecodesign-2010
