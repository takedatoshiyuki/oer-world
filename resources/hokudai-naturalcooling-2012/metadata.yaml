name:
  ja: 北海道大学公開講座 私たちの未来とリスク 次世代分散型電源と 自然冷熱エネルギーの有効利用（2012）
description:
  ja: 次世代分散型電源と自然冷熱エネルギーの利用を扱い、燃料電池の省エネルギー性や地域での節電への導入効果を取り上げる。あわせて、雪氷資源を活用する自然冷熱エネルギーについて、空調・農業・水産業での展開可能性を考える。東日本大震災を契機に、社会のあり方や未来のリスクへの備えという視点も含む。
quotedDescription:
  text:
    ja: '2011年3月11日の東日本大震災を契機として、社会のあり方の再構築、未来のリスクへの備えが求められています。本講義の内容は、次世代分散型電源と自然冷熱エネルギーの有効利用に関するものです。分散型電源の一例として燃料電池を取り上げ、その高い省エネルギー性と、地域全体の節電への大きな導入効果について述べます。自然冷熱エネルギーは主に雪氷資源を活用し、空調分野、農業、水産業などにおける将来的な可能性について考えます。

      濱田　靖弘

      1993年北海道大学工学部衛生工学科卒業、1995年3月同大学院工学研究科衛生工学専攻修士課程修了、1995年9月同大学院工学研究科衛生工学専攻博士課程中退。博士（工学）。北海道大学工学部助手、同大学院工学研究科助教授を経て、現在、同大学院工学研究院准教授。研究分野は、建築環境・設備、環境技術、エネルギー学。所属学会は、空気調和・衛生工学会、日本建築学会、日本太陽エネルギー学会、エネルギー・資源学会、日本雪工学会、人間―生活環境系学会、日本冷凍空調学会。'
