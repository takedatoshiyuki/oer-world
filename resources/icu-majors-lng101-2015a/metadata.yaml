name:
  ja: Introduction to Linguistics I 言語学入門 I
description:
  ja: 人間言語の音韻、語の構成、文の構造、意味の捉え方を通して、言語学の基礎体系を扱う。加えて、現代言語学と応用言語学で用いる基本的な用語や概念を学び、基本的な言語データの構造分析を練習する。
quotedDescription:
  text:
    ja: '人間言語の音韻システム、単語の構成、文の構造、意味のとらえ方などに焦点をあて、言語学の基礎体系を学ぶ。具体的な言語分析になれることによって、人間言語がどのようなシステムになっているか、また、どのように働くのかを理解する。

      The course has two major goals: (1) to introduce basic terminology and concepts commonly used in
      modern Linguistics and Applied Linguistics, and (2) to provide practice in analyzing language. At
      the end of this course, students should be able to conduct a structural analysis of basic linguistic
      data in a scientific and systematic manner.

