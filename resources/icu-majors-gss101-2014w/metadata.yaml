name:
  ja: Approaches to Gender Studies ジェンダー研究へのアプローチ
description:
  ja: ジェンダー研究の基礎にあたる概念や歴史的背景を扱い、さまざまな専門分野におけるジェンダー分析のあり方を見ていく講義である。国際関係、文化人類学、国際法、文学、日本語表現、美術などの題材を通して、ジェンダー研究の広がりを検討する。
quotedDescription:
  text:
    ja: 'As the foundation course of the Program in Gender and Sexuality Studies, the general frameworks,
      basic concepts, and historical backgrounds of gender studies will be examined. Based on these understandings,
      the accumulation and possibilities of gender research and analyses in various disciplines will be
      described and discussed in order for students to obtain the basic analytical power in dealing with
      gender analysis in interdisciplinary fields.

      ジェンダー研究の基礎科目として必要なジェンダー研究の概要、基本的概念、歴史的背景を理解し，様々な専門分野におけるジェンダー研究の実態を把握し、ジェンダー分析の可能性に関して深く考察する。

