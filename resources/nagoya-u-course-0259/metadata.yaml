name:
  ja: アルゴリズム
description:
  ja: アルゴリズムの基礎と代表的な手法を扱う講義で、課題とともに基本アルゴリズム、再帰、リスト処理、ハッシュ処理を学ぶ構成になっている。さらに、グラフ処理、木構造、整列などのテーマに分かれた講義ノートが公開されており、計算手法の具体的な扱いまで含む教材である。
quotedDescription:
  text:
    ja: '問題を解くための計算法であるアルゴリズムについて、それを理解する素質と、代表的なアルゴリズムについての知識を得ます。

      アルゴリズムを利用して、具体的に問題解決を行うための力を身に付けます。

      コンピュータの機能と、プログラミングに関する見識を深めます。'
