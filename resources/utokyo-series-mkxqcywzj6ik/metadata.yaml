name:
  ja: 「青い鳥」はいるか－経済学で考える（学術俯瞰講義）
description:
  ja: 青い鳥を探す物語を導入に、停滞社会の中で「青い鳥」と呼べるものは何かを経済学の視点から考える講義である。社会の状況を踏まえて、何を目指し、どのように探すのかを問い直す内容を扱う。経済学を、情熱と冷静さを両立させるための思考の道具として位置づけている。
quotedDescription:
  text:
    ja: 'チルチルとミチルはクリスマスイブに妖女と出会い、幸せをもたらしてくれるという青い鳥を探しに出かける。青い鳥を見つけられないまま、夢から醒めると、自分の家に青い鳥がいたことに気づく――。

      貧しくても夢や希望があった高度成長期が終焉を迎え、今は停滞社会に向かいつつあると言われる。そのような社会の中で青い鳥とは何なのか。どこにいるのか。青い鳥を見つけることができるのか。そのために私たちがやるべきことは何なのか。

      かつて、経済学の巨星マーシャルは「熱き心と冷静な頭脳(cool heads but warm hearts)」を兼ね備えた人々を世に送り出すことこそ経済学の役割だと語った。社会の不正に憤って叫んでも問題は解決しない。かと言って、熱き心を失えば目的そのものも見失う。あなたの情熱がアクセルでありエンジンなら、経済学はブレーキでありハンドルである。両者を駆使して、あなた自身の青い鳥を探してほしい。'
  source: https://ch.u-tokyo.ac.jp/series/?id=mKXQcyWZj6Ik
