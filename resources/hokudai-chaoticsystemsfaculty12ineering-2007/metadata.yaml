description:
  ja: 社会現象や金融活動の一部を説明するための数理模型と、確率論に基づく解析手法を扱う講義資料である。公開資料には講義ノート、スライド、説明用資料が含まれ、その一部は経済物理学と関係する。
quotedDescription:
