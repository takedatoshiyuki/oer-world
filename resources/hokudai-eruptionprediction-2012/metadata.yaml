name:
  ja: 土曜市民セミナー 火山噴火の中長期予測の手法と現状（2012）
description:
  ja: 火山活動と噴火の予測を扱い、地震や地殻変動の観測技術の進歩にも触れる。とくに、数10〜数100年先を見すえた中長期予測の手法と、その問題点を扱う。
quotedDescription:
  text:
    ja: 火山研究の目標のひとつは、火山活動および噴火の予測を可能にすることにある。地震や地殻変動の観測技術の進歩によって、現在では噴火前の前兆現象は、ほぼ完璧に捉えられるようになっており、その意味で短期的な噴火予測は可能になってきたと考えられる。しかしながら、数10～数100年先、あるいはより長期の火山活動・噴火活動の予測に関しては、まだまだ問題が多い。この長期予測は噴火災害の軽減に必要なだけではなく、例えば放射性廃棄物の処分場の候補地選定にも不可欠であり、この場合は数万から数10万年の予測が要求される。今セミナーでは、火山活動の数10～数100年間の中長期予測の手法と問題点について紹介する。
  source: https://ocw.hokudai.ac.jp/lecture/eruptionprediction-2012
