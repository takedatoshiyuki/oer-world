name:
  ja: 研究教育資料 先住民文化遺産とツーリズム ～アイヌ民族における文化遺産活用の理論と実践～（2012）
description:
  ja: 知床ウトロ地区を題材に、世界自然遺産としての知床を文化遺産の観点から見直す内容を扱う入門用のガイダンスビデオである。先住民族の歴史・文化に関わる評価や、一般旅行者向けの音声ガイド実証実験、モニターツアーの取り組みも含む。
quotedDescription:
  text:
    ja: '知床は世界自然遺産としてUNESCOに登録されていますが、ただ単に自然遺産としての価値を評価するだけでなく、文化遺産としての意義もしっかり考えなくてはなりません。特に先住民族の歴史・文化の面からの評価は現状では不十分であり、今後の改善が望まれます。

      本VTRはこうした事情を踏まえ、知床ウトロ地区を題材として一般旅行者向けに、文化遺産としての知床を知るための入門編ガイダンスビデオとして制作されました。制作は、アイヌ・先住民研究センターの先住民文化遺産ツーリズム・ワーキンググループが行っておりますが、学内連携の推進、研究活動と教育活動の連動を目的として、同ビデオ制作のためのモニターツアーや音声ガイド実証実験は、国際広報メディア・観光学院における特別演習や観光学高等研究センターでの研究活動でも実施されました。

      関連講義

      ・先住民族ヘリテージツーリズム特別演習

      関連情報

      ・先住民族ヘリテージツーリズム・ワーキンググループ報告書等（HISCUP）

      ・アイヌ・先住民研究センター

      ・観光学高等研究センター'
