name:
  ja: International Trade 国際貿易
description:
  ja: 国際貿易を、国境を越える財・サービスの移動として捉え、その背景や影響を分析する講義である。貿易相手や貿易の理由、貿易の勝者と敗者、厚生への効果、国際生産立地、グローバル経済における企業までを扱う。授業では最新の国際貿易関連の出来事を確認しながら、理論モデルや経済データを使って議論を進める。
quotedDescription:
  text:
    ja: 'This course provides an overview of international trade the movement of goods and services across
      national boundaries – developing analytic tools that can be used to analyze world economic policy
      debates. Class meetings are interactive. We will begin most classes with a brief review of current
      events related to international trade. We then work through together, as a class, one of the models
      under study or look at some economic data and how it informs our understanding of the models under
      study.

