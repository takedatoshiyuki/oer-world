name:
  ja: ミクロ経済学-II
description:
  ja: 競争市場における需給均衡分析を前提に、ミクロ経済学の基本事項を学ぶ講義である。公開教材には、第1回から第10回までの講義ノートと、練習問題の解答例が含まれる。
quotedDescription:
  text:
    ja: 経済社会の成り立ちや動きを理解するためには、個々の構成員がどのような動機に基づいて各自の行動を選択しているか、またその意思決定がどのように相互連関しているのかを調べることが重要である。 ミクロ経済学は、行動の選択とその連関を分析し、経済社会の働きについて理解するための学問である。
      本講義では、競争市場における需給均衡分析の理解を前提として、その他のミクロ経済学の基本事項を学ぶ。
