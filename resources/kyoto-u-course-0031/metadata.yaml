name:
  ja: 経済学ⅡB
description:
  ja: マーシャルプランの具体的内容を取り上げ、戦後西ヨーロッパの経済復興と統合の過程でそれがどのような意味を持ったかを考察する。あわせて、ブレトンウッズ協定、スターリング圏、EPU、OEEC、ローマ条約など、戦後欧州経済の再編に関わる論点を扱う。
quotedDescription:
  text:
    ja: '授業の特色

      マーシャルプランと戦後欧州の経済復興について考察します。

       

      授業の紹介

      本講義は、マーシャルプラン‐第二次大戦後にアメリカが西ヨーロッパに対して行った経済復興計画ーの具体的内容を概説し、この計画が戦後西ヨーロッパ諸国の経済復興・統合過程にどのような意義を持ったか、あるいは意義をもたなかったか、最近の論争をふまえて考察します。こうした検討を通じて、第二次大戦後の西ヨーロッパ経済の復興・統合過程と欧米関係の特質に接近します。'
  source: https://ocw.kyoto-u.ac.jp/course/31/
