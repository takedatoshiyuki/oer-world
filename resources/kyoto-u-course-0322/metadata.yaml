description:
  ja: 分子の凸凹を利用して「もの」をくっつけるというテーマを扱い、化合物の構造を示しながら進める講義である。大阪大学産業科学研究所の原田 明教授による講演として公開されている。
quotedDescription:
  text:
    ja: '大阪大学/京都大学/関西大学/NPO法人 知的人材ネットワークあいんしゅたいん

      ジュニアドクター育成塾めばえ適塾 「分子の凸凹で「もの」をくっつける」

       

      概要

      めばえ適塾（JSTジュニアドクター育成塾）とは、科学への強い興味関心を持つ小中学生を対象に、実習などを通し数理系のセンスを身につけることで未来の研究者を育成することを目的とした教育プログラムです。大阪大学を中心として、京都大学、関西大学、NPO法人あいんしゅたいんが連携して実施しています。

      この講義は、受講生である小中学生に科学の最先端の分野を牽引している研究者を知ってもらうだけでなく、めばえ適塾でアシスタントをしている大学生、大学院生の研修のために開催しましたが、多くの人に興味を持っていただける内容なので、公開することにしました。

      今回は、「分子の凸凹で「もの」をくっつける」というテーマで、大阪大学産業科学研究所の原田 明教授にご講演いただきました。化合物の構造を示しながらも、わかりやすく魅力的な講演となっておりますので是非ごらんください。'
