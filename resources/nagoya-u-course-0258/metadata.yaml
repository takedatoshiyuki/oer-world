quotedDescription:
  text:
    ja: '#### ＜前期＞日本語教育学原論a—実証的言語研究法・基礎編 本講義は，言語を対象としたあらゆる研究における実証的方法論を身につけることを目的とする。従来，言語の研究はとかく一個人内の「直感」で行われ，その議論は科学的な「実証」に基づかないまま展開される傾向があった。研究領域の健全な発展のためには，然るべき手法で得られたデータの適切な検証を通して，言語現象が論じられなければならない。本講義で'
