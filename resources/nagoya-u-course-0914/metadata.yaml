quotedDescription:
  text:
    ja: '近年では金銭目的をゴールとする情報セキュリティ侵害が激増しており、情報系学部出身者には情報セキュリティを重視したリテラシが期待されるようになってきている。

      本講義では、近年の情報セキュリティ関係のニュースについて、バックエンドの情報システム側の構造もある程度踏まえた上で理解できる能力を習得することを目的とする。'
