name:
  ja: 土曜市民セミナー クラーク博士の採集した地衣類（2011）
description:
  ja: 地衣類について、基礎的な性質や自然界での役割から、人との関わりまでを扱う講義である。あわせて、日本の地衣類学や、クラーク博士の研究が北海道の地衣類学に果たした役割、絶滅の恐れがある地衣類にも触れる。企画展示『クラーク博士と札幌の植物』に関連している。
quotedDescription:
  text:
    ja: 「地衣類（ちいるい）とは何か？」「自然界における地衣類の役割」といった、ごく基本的な知識から「ひとに与える地衣類の価値と役割」「有名な日本の地衣類学」また、3月3日より開催される企画展示『クラーク博士と札幌の植物』に関連し、「北海道の地衣類学におけるクラークの研究の役割」「絶滅の恐れがある地衣類」など、普段あまり聞くことのない『地衣類』の世界について、詳しく、そしてわかりやすくお話します。
