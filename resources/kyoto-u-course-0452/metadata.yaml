name:
  ja: 資源生物科学実験及び実験法Ⅰ・Ⅱ
description:
  ja: 資源生物科学に関する実験法と観察・解剖の教材を扱う。植物の器官や生殖、動物の発生、昆虫幼虫の解剖に加え、スケッチ法、組織切片の作製、染色、電子顕微鏡の扱いも含む。通年履修を前提とし、履修スケジュールや班分け、レポート提出要領の説明がある。
quotedDescription:
  text:
    ja: 「資源生物科学実験及び実験法Ⅱ」と合わせて通年の履修が前提となっている．3回生初頭のガイダンスにおいて，履修スケジュール・班分け・レポート提出要領など重要な説明を行なうので，必ず出席すること．
  source: https://ocw.kyoto-u.ac.jp/course/452/
  note: 京都大学OCW 「講義概要」より（同サイトの利用条件に基づく転載）
