name:
  ja: シンポジウム「うな丼の未来」
description:
  ja: ウナギの資源減少をめぐり、現在の状況とその背景、回復の方法、今後の付き合い方を扱うシンポジウムである。ニホンウナギの絶滅危惧種指定やシラスウナギの不漁にも触れ、資源と食文化の行方を考える内容になっている。
quotedDescription:
  text:
    ja: "ウナギは今、未曾有の危機に直面している。2013年2月、環境省はニホンウナギを絶滅危惧種に指定した。また、4年連続のシラスウナギ（養殖ウナギの種苗）大不漁も問題となっている。 \n  これからウナギはどうなるのか？なぜ資源はこんなにも減ってしまったのか？どうすれば資源を回復させることができるのか？これからウナギとどのようにつきあっていくのが良いか？問題は山積している。日本人がこよなく愛すウナギの食文化を絶や…"
  source: https://ch.u-tokyo.ac.jp/series/?id=3nNLW2XzYlUn
