description:
  ja: 気体や液体の流れを手がかりに、身の回りの空気や水が機械の性能や快適さにどう関わるかを扱う講義である。流れを理解し制御することを目的に、工学機器の設計で機能的な形を生み出す試みを紹介する。さらに、生物の体の中で行われる形の最適化にも触れる。
quotedDescription:
  text:
    ja: 物質は、気体、液体、固体の３つの状態で存在するが、そのうち気体と液体は流れる性質を持つ。身の回りの空気や水の流れは、様々な機械の性能や人が感じる快適さなどに大きな影響を与える一方で、それらは透明であるためその運動を直接目にすることは少ない。この講義では、流れを理解し、制御することを目的として、工学機器の設計において、機能的な形を生み出す試みを紹介する。また、生物の体の中においても形の最適化が行わ…
