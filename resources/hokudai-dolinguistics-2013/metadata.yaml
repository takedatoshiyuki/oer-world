name:
  ja: 全学教育 ことばを科学する 人間の再発見 (2013、2014)
description:
  ja: この講義は、生成言語理論を手がかりに、人間の言語がもつ性質を多面的に考える。ことば以外では表しにくい意味や、人間以外の動物との違いを取り上げながら、言語能力の研究方法にも目を向ける。あわせて、その分析を通じて科学的な研究とは何かを考える。
quotedDescription:
  text:
    ja: '「私の隣にキリンはいない」。「昨日雨が降らなかったら、公園でサッカーができたのに」。これらの文と同じ情報をことば以外の方法（たとえば、図や絵）で簡単に表すことはできないでしょう。また、人間以外の動物のコミュニケーションでもこのような意味を表す仕組みはないと考えられています。しかし、人間であればどの言語の話者でも3歳にもなれば上記のような表現を簡単にすることができます。

      この授業では、1950年代から始まった新しいことば研究の方法論（生成言語理論）を基調に、人間が持つことばのさまざまな側面について考えてみます。特に、自分の母語は自分にとってあまりにも当たり前のものなので、それを客体化してあらためて考えるということをしないばかりか、自分のことばのことは自分がよく知っていると思い込んでしまいがちです。人間のことばを操る能力は実際には大変不思議で、奥が深いものです。その特徴を少し知ることによって、自分自身を含めた人間というものを「再発見」する機会にすると同時に、人間の言語能力の研究方法を通して、科学的な研究の本質とは何かを考えます。'
  source: https://ocw.hokudai.ac.jp/lecture/dolinguistics-2013
  note: 北海道大学OCW 「概要」より（著作権法32条の引用）
