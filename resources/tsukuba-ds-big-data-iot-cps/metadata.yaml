name:
  ja: データサイエンス講義 高度なデータの管理と活用：ビッグデータとIoT／CPS
description:
  ja: 大量のデータを集めて分析し、知見の発見や社会・組織・業務の改善につなげるビッグデータの考え方を扱う講義である。あわせて、IoTやCPSをビッグデータ分析を支える情報システムとして位置づけ、その概要や関連する問題点まで解説する。
quotedDescription:
  text:
    ja: 大量のデータを収集・分析することで、これまでにない新たな知見や知識を発見し、社会・組織・業務を改善するビッグデータの手法が広く用いられている。また、ビッグデータ分析を実現する情報システムとしてIoT（Internet
      of Things）やCPS（Cyber-Physical System）が注目されている。本講義では、ビッグデータやIoT / CPSについて概要を述べるとともに、それらを支える情報システム、また、ビッグデータ活用における問題点について解説する。
