name:
  ja: 変化する都市－政治・技術・祝祭（学術俯瞰講義）
description:
  ja: 東京を主題の一つにしながら、都市の本質や変化の要因、将来像を多面的に考える講義である。都市を建物やインフラの集合として見るだけでなく、文化や権力の基盤として捉える視点も扱う。
quotedDescription:
  text:
    ja: 'われわれは都市文明のなかに暮らしている。都市は生活の場であり、表現の場であり、文化の母胎であり、記憶の容器である。また、われわれの都市は建物の集合体であり、道路やライフラインなど、インフラ・ストラクチュアといわれるものの集合体であり、また、目に見えない文化や権力の基盤である。何がこうした都市を生み出してきたのか。何が都市を変化させてゆくのか。そして今、都市はどこに向かっているのか。われわれをとりまく都市の本質とその将来像を、東京をひとつの主題としながら、さまざまな視点に立って考えてみたい。

      都市には，自らをつくり出し，変化させてゆく多くの力が働いている。そして都市には、それが発する多様なメッセージが充満している。都市は物理的構造体であると同時に、文化的・政治的現象でもある。多面的な都市を多面的に問おうとするこの講義のなかから、みなさんにとっての都市をつかまえていただきたい。'
  source: https://ch.u-tokyo.ac.jp/series/?id=PdjADFZQWIRt
