name:
  ja: 土曜市民セミナー 定年退職記念講演 身近な岩石・鉱物と資源の話(2011)
description:
  ja: 日常生活の中で使われている身近な岩石・鉱物を取り上げ、その利用例や関連する話題を扱う講義である。あわせて、特殊な岩石に関係する資源問題にも言及する。
quotedDescription:
  text:
    ja: とかくつまらないもの、役に立たないものの例えに使われる“ 石” ですが、私たちの身近にある岩石・鉱物は人間にとって色々な意味で重要な存在でもあります。今回は、私たちの日常生活の中で意外なところで利用され恩恵を被っている身近な“
      石” について、幾つかの例やエピソードを交えて紹介すると共に、今や21 世紀の人類にとって最大の課題でもある特殊な岩石が関係した資源問題についても言及します。
