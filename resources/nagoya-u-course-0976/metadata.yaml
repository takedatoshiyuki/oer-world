quotedDescription:
  text:
    ja: '本授業科目は、専門的学習のツールとして外国語の能力を高め、異文化理解を深めて、国際社会に相応しい教養を育むことが目的である。本授業では、リスニングとスピーキングを主としたコミュニケーションの能力を高め、ディスカッションやプレゼンテーションのための基礎力を養成する。

      リスニングとスピーキングを主としたコミュニケーションの能力を高める授業活動を通じて、ディスカッションやプレゼンテーションのための基礎力を身につける。'
