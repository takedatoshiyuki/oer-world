name:
  ja: 第31回 知的コラボの会「PISA「読解力」の再考：サンプル問題作成者の経験から」
description:
  ja: OECDのPISAにおける読解力測定を題材に、問題がどのような過程で作成されたかを扱う講義である。サンプル問題の作成に直接かかわった人への聞き取り調査を手がかりに、作成の舞台裏にある矛盾や力関係を検討する。あわせて、PISAを支える科学的合理性の前提を問い直す。
quotedDescription:
  text:
    ja: 'コース概要

      2000年にスタートしたOECDのPISA。3年に一度行われるこの「世界の学力テスト」の結果がメディアを賑わせる風景は、すでにお馴染みのものとなりました。その最新の調査結果（PISA2018)が先日12月3日に公表され、リーディング・リテラシー（読解力）において日本の１５歳の順位が１５位まで「転落」したと大々的に報道されています。子どもたちがスマホに依存し、読書量が大幅に減っていることが有力な原因の一つとして挙げられているようです。ですが、この「普遍的」とされる言語操作能力を測るとされるPISAの問題は、そもそもどのようなプロセスを経て作成されたのでしょうか。この講演では、「日本代表」としてPISAのリーディング・リテラシーのサンプル問題の作成に直接かかわった方々からの聞き取り調査を基に、舞台裏から見える矛盾、混乱、不均衡な力関係を明らかにします。そうすることで、PISAの政治的正当性を担保する「科学的合理性」の前提に疑問を呈してみたいと思います。'
  source: https://ocw.kyoto-u.ac.jp/course/267/
