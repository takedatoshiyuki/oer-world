name:
  ja: 京都大学経済研究所先端政策分析研究センター 国際シンポジウム  再生可能エネルギーが開く未来－欧州の経験と日本の挑戦－
description:
  ja: 再生可能エネルギーの普及をめぐり、ドイツとデンマークの経験を手がかりに、制度設計と導入の状況を扱うシンポジウムである。日本の固定価格買取制度の最新動向や地域ごとの取り組みも取り上げ、普及策を議論する。
quotedDescription:
  text:
    ja: '概要

      今年は７月に再生可能エネルギーを普及させる新しい制度として 固定価格買取制度が始まり、再生可能エネルギー時代の幕開けともなる年です。本シンポジウムでは、この分野での先進国であるドイツ、デンマークの経験を紹介し、日本の固定価格買取制度の最新動向や各地域の挑戦を取り上げ、普及策について議論を深めます。'
