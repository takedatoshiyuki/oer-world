description:
  ja: 1変数の微分積分学の基礎を扱う講義で、高校での微分積分の既修を前提としない。関数から始まり、極限と連続、微分、積分、積分法、1階微分方程式までを順に扱う。毎週の講義2時限と演習2時限で構成され、英語と日本語で提供される。
