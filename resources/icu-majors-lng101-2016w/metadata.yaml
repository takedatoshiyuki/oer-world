name:
  ja: Introduction to Linguistics I 言語学入門 I 2016W
description:
  ja: 現代言語学と応用言語学の基本用語・概念を導入し、言語分析の練習を行う講義である。音韻、語の構成、文の構造、意味の扱いを通して、人間言語の基礎的な仕組みを学ぶ。基本的な言語データを構造的に分析することを目指す。
quotedDescription:
  text:
    ja: 'The course has two major goals: (1) to introduce basic terminology and concepts commonly used
      in modern Linguistics and Applied Linguistics, and (2) to provide practice in analyzing language.
      At the end of this course, students should be able to conduct a structural analysis of basic linguistic
      data in a scientific and systematic manner.

      人間言語の音韻システム、単語の構成、文の構造、意味のとらえ方などに焦点をあて、言語学の基礎体系を学ぶ。具体的な言語分析になれることによって、人間言語がどのようなシステムになっているか、また、どのように働くのかを理解する。

