name:
  ja: 'N2: Experimental Approach to Natural Science Ｎ２：実験付き自然科学入門'
description:
  ja: 物理・化学・生物に関する実験を通して、自然を理解するための科学的方法を扱う講義である。講義、発表・討論、実験を組み合わせ、ピペットマンの操作やDNA抽出、PCR、電気泳動、結果発表までを含む。
quotedDescription:
  text:
    ja: 'To understand nature and learn scientific methods through experiments in the fields of physics,
      chemistry and biology. Lecture (explanation, presentation and discussion) and laboratory.

      自然科学の３分野（物理、科学、生物）に関係する実験テーマに取り組むことによって自然を理解するための科学的方法を体験的に学ぶ。講義（説明、発表／討論）と実験からなる。

      Contents of Lectures

      6

      Lectures  /

      6

      Videos

      Oct 23: Lecture 1

      Introduction オリエンテーション

      Lecture Notes

      Oct 25: Lecture 2

      (1) ピペットマンの使い方を練習しよう

      (2) 毛髪サンプル採集・DNA抽出反応開始

      Lecture Notes

      Oct 30: Lecture 3

      講義・各班テーマの発表

      Nov 1: Lecture 4

      (3) PCR反応

      (4) タマネギからDNAを抽出〜DNAを見てみよう！

