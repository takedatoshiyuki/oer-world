  ja: 上智大学の卒業生を招き、これまでの歩みや仕事、各業界の事情を聞く講義である。英語学科を中心とした卒業生の話を通して、職業選択や人生設計を考えるための材料を扱う。毎回の小レポートと期末レポートが課される。
quotedDescription:
  text:
    ja: この講義では、主に英語学科を中心とした上智大学の卒業生をお招きし、それぞれが歩んでこられた人生の軌跡と、過去から現在に至る仕事や個々の業界の事情などを語っていただく。受講生たちは将来の自分自身の職業選択や人生設計を考える様々な材料を見つけることが出来るだろう。毎回、講義から学び自ら考えたことを８００字程度にまとめた小レポートを提出。それとは別に４０００字程度の期末レポートを課す。|
