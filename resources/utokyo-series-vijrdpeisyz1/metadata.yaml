description:
  ja: 離散時間の確率過程を題材に、確率過程論の考え方を扱う講義である。特にマルチンゲールのアイデアを中心に据え、前半では確率空間が有限集合の場合を取り上げる。測度論や積分論を前提とせず、厳密性よりも直観を重視する構成になっている。
quotedDescription:
  text:
    ja: 時間とともに変化する不確実な現象を記述し理解するには、確率過程論が重要な道具として用いられる。この講義では離散時間の確率過程に関しての講義を行う。 この講義では、数学的に厳密な議論は行わず、確率過程論（特にマルチンゲール）のアイデアを中心として直観を重視した講義を行う。特に前半では確率空間が有限集合である場合を取り扱う。測度論、積分論の知識は前提としない。
