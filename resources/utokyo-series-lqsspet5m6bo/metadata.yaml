name:
  ja: 物質のはじまりとはたらき ―フェムト、ナノ、エクサの世界 (学術俯瞰講義)
description:
  ja: 物質がどのように生まれたのかという問いから出発し、物質の最小単位や宇宙のはじまりまでを扱う講義である。さらに、原子や電子が集まって生じる物質の多様性や先端デバイスのはたらきも取り上げ、極微から宇宙空間までの現象を見通す。物理、化学、電子工学の第一人者が講義する。
quotedDescription:
  text:
    ja: 'コーディネータ：藤森 淳

      ナビゲータ：堀田 知佐

      我々の世界が物質でできているのは周知の事実であるが、では、なぜどのようにして物質はできたのかという疑問を持ち追求していくと、物質の最小単位や宇宙のはじまりを探求する果てしない旅に出ることになる。そこには、とてつもなく高いエネルギーや短い時間の現象が支配する、極微から宇宙空間まで広がる我々の直観を越えたダイナミックな世界がある。一方、我々の周りで見られる様々な物質の多様性や先端デバイスの機能は、

      巨視的な数の原子や電子が集まって個々の粒子にはない新たなはたらきを生み出す創発現象である。

      本講義では、このような広く限りない魅力にあふれた物質科学を、物理、化学、電子工学の第一人者が、さらに広い視野からわかりやすく解き明かす。

      理科I類に限らない広い分野の理系学生に加え、多くの文系学生の聴講を期待する。'
