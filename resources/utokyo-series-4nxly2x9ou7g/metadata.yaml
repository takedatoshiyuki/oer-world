name:
  ja: 脳の科学－シナプスから人生の意味まで（学術俯瞰講義）
description:
  ja: 脳の中で何が起こっているのかを、さまざまなモデル動物と多様な研究手法を通して扱う講義である。神経ネットワークやシナプスの分子機能をめぐる研究を、分野ごとの専門家が紹介する構成になっている。終盤では、脳科学の進展が私たちの存在の理解にどう関わるかを科学哲学の視点から扱う。
quotedDescription:
  text:
    ja: "コーディネータ　多羽田 哲也（分生研）、上田 泰己 (医学部)\nナビゲータ　　　道上 達男（教養学部）\n 私たちが考えたり、昔を思い出したり、あるいは夢を見たりすることは、いうまでもなく脳の働きです。この時、脳の中の膨大な神経ネットワークで何が起こっているのでしょう。それを知るために、ヒトのみならず、サル、マウス、ラット、さらには線虫、ショウジョウバエといった様々なモデル動物が用いられ、これらを対象として、電気生理学、シナプスにある分子の働きを調べる生化学や細胞生物学、顕微鏡やfMRIを用いたイメージング、遺伝子改変動物、数理解析など、様々な手法を駆使した研究が行われています。このような多方面からのアプローチを、それぞれの専門家がわかりやすく紹介し、最後に、脳科学の進展が私たちの存在の理解にどのように寄与するか、科学哲学の立場から講義します。\n\
      \ 脳は脳を知るでしょうか。\n 本講義シリーズの終わりには、脳の働きを細胞の情報伝達のレベルで理解するのはもうすぐ手が届く近未来のことだと、皆さんは楽観的になるでしょう。その研究に自分も身を投じてみたいと思うようになるかもしれません。私たちが生きている意味を理解する一助として、所属や専攻に関わらず駒場の全ての皆さんの聴講を歓迎します。"
  source: https://ch.u-tokyo.ac.jp/series/?id=4nXLy2x9Ou7g
