description:
  ja: 東日本大震災と被災地での経験を手がかりに、山浦玄嗣が医師としての視点から語る講義である。聖書や祈りにも触れながら、災禍を受け止めて生きることを考える内容である。
quotedDescription:
  text:
    ja: "東日本大震災とどう向き合うか 被災地から見た3・11 \n 岩手県大船渡市の医師・山浦玄嗣さんは、聖書を地元の方言「ケセン語」に翻訳したことで知られている。自らも被災し、大津波に見舞われたガレキの町で、医師として人々を支え続けた。惨害の野に立った時、山浦さんの胸に去来したのは、絶望は絶望のままおわらないということ。そして「祈り」とは、目の前の出来事の中にあらわれる神の声を聞くことだ、ということだった。今、聖書を読みながら、災禍を引き受けて生きる希望を語る。"
