name:
  ja: データサイエンス講義 臨床医学・社会医学とデータサイエンス ーヘルスサービスリサーチの視点から
description:
  ja: 医学の3領域に対するデータサイエンスの応用のうち、社会医学における医療介護サービスの質に焦点を当てる講義である。ヘルスサービスリサーチを中心に、患者の受診から介護までの経過や、地域の医療機関・介護サービスの機能と質をデータで捉える視点を扱う。あわせて、疫学・統計や日本の医療介護ビッグデータの現状にも触れる。
quotedDescription:
  text:
    ja: データサイエンスは医学3領域（基礎・臨床・社会）のそれぞれに応用しうる。医学の基礎研究である基礎医学ではゲノム解析など、一人ひとりの患者さんの診療を主とする臨床医学では画像診断のAI活用など多々あるが、本講義では、社会医学、中でも医療介護サービスの質に焦点をあてたヘルスサービスリサーチを中心とする。質の高いサービスの実現には、一人の患者さんが受診し、診療を受け、その後、介護も含めてどう経過していくかーという時間的な視点、そして、地域における各医療機関や介護サービスがどう機能しているか、質はどうかという空間的に広い視点の両者が必要である。それにはデータが必要である。社会医学の基本である疫学・統計についても触れ、わが国における医療介護ビッグデータの現状含め、今後のデータサイエンスに必要な考え方を解説する。
