name:
  ja: 春秋講義「みんなちがって、みんないい －生きる環境に合わせて多様性を獲得した植物」
description:
  ja: 植物が移動できないという前提のもとで、どのように環境に適応しながら生きているかを扱う講義である。自らの変化によって光合成、開花、繁殖を行う仕組みと、その積み重ねとして生じる種分化や種内分化まで触れる。
quotedDescription:
  text:
    ja: '講演内容

      植物は種子が発芽した場所から動くことが出来ません。根を下ろした場所に適合できるか否かが生死を分けます。しかし植物は自らを自在に変身させて、環境に適合し、光合成を行い、適切な時期に花を咲かせ、子孫を残します。このような適応を経て、植物は様々な種分化を起こし、同一種内でさえも土地に合わせた種内分化を起こしています。そんな植物たちの「静かで」「逞しい」多様性の一面をご紹介します。'
