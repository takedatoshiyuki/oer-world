description:
  ja: 溶液NMRの測定とプロセスの基礎を扱う動画教材である。二次元HSQCの測定に向けて、試料管や測定温度、ロック、チューニング・マッチング、シム、90°パルス幅決め、測定、プロセスの各項目を取り上げる。平成29年1月27日に実施したNMRセミナーを収録・編集したものである。
quotedDescription:
  text:
    ja: 'ここでは、「溶液NMR」に関する動画をご覧いただけます。

      これらの教材は、平成29年1月27日に実施した「NMRセミナー　溶液NMRでまずは二次元HSQCをとってみる～測定とプロセスの基礎～」を収録・編集したものです。

      1. 試料管

      2. 測定温度

      3. ロック

      4. チューニング･マッチング

      5. シム

      6. 90°パルス幅決め

      7. 測定

      8. プロセス'
