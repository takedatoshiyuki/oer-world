name:
  ja: 日本経済のこの一年間と今後の見通し
description:
  ja: リーマン・ブラザーズ破たん以降の金融危機と実体経済の落ち込みを背景に、日本の輸出減少、雇用や企業収益の悪化、東海地方への影響を取り上げる。あわせて、この一年間の国内経済動向を振り返り、今回の危機が日本経済にもたらしたものを扱う。
quotedDescription:
  text:
    ja: 昨年９月の、リーマンブラザーズの破たん以来、金融危機と実体経済の落ち込みが相乗的に作用して、世界経済が混乱に陥った。日本は輸出の著しい減少に見舞われ、かつてない不況に直面している。雇用の落ち込みと企業収益の減少が消費の不振を招いているが、東海地方は、自動車生産への影響が大きいため、全国の中でも特に厳しい状況にある。
      この一年間の、国内の経済動向を振り返り、今回の危機が日本経済になにをもたらしたのか
