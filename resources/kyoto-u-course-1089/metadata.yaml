description:
  ja: 比較社会学における日本的特徴を、教育の不平等に関する事例を通じて考える講義である。京都大学グローバル教育展開オフィス主催の2021年度ウェビナーシリーズ第1回として、2021年9月27日にZoomで実施され、英語同時通訳も行われた。
quotedDescription:
  text:
    ja: 'グローバル教育展開オフィス 2021ウェビナーシリーズ

      越境する「日本型」の歴史的・多角的理解に向けて

      概要

      グローバル教育展開オフィス主催2021年度ウェビナーシリーズ『「日本型」教育を再考する：東アジアとの対話を通じて』の第1回講演会を、9月27日（月）にZoom開催いたしました。今回は、法政大学社会学部　准教授　多喜　弘文先生が「比較社会学における日本的特徴の理論と実証：教育の不平等に関する事例を通じて」と題した講演を行い、司会進行は高山敬太教授が務めました。英語同時通訳を導入し、学内外および国内外からも多くの参加がありました。講演会では活発な質疑応答も行われ、盛況のうち閉会しました。'
