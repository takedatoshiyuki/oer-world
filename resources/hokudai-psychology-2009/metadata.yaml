name:
  ja: 全学教育 基礎心理学入門（2009）
description:
  ja: 心理学の歴史を手がかりに、感覚と知覚を中心とした心理学研究の基礎的成果と理論を扱う講義である。あわせて、注意・記憶・学習やパターン認知にも触れ、人間の心的過程についての基礎を学ぶ構成になっている。
quotedDescription:
  text:
    ja: 心理学の歴史を参照しつつ、特に感覚・知覚の過程を主領域とした心理学研究における基礎的成果及び理論について講義します。講義を通じて人間の心的過程に関して基礎的な知識を身につけてもらうと共に、心理学研究の意義や難しさ、面白さを理解してもらうことをねらいとしています。
