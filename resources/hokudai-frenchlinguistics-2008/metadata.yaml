name:
  ja: 学部専門教育 フランス語学 スペイン語文法入門（2008）
description:
  ja: 本教材は、スペイン語の文法を中心に、文章読解に必要な基本事項を集中的に扱う。あわせて、スペイン語がどのような言語かを文法面から把握することを目指す内容になっている。
quotedDescription:
  text:
    ja: '文学部の専門教育において是非とも習得すべき外国語の能力は、その言語で書かれた原典を正確に読み解く読解力である。着実な読解力の土台となるのは、何よりも当該言語の文法の体系的な理解である。

      授業科目名は「フランス語学」となっているが、実際にはフランス語が属するロマンス諸語の一つであるスペイン語の文法を学ぶのが本授業の目的である。本授業は、スペイン語で書かれた文章の読解に不可欠でスペイン語の実践的運用の基盤ともなる文法事項を集中的に学び、スペイン語がどのような言語であるかを把握することを目指す。

      エクセレント・ティーチャー

      本講義を担当している藤田准教授は、平成19年度エクセレント・ティーチャーに選ばれています。

      授業実施上の取組・工夫などについては、こちらをご覧ください'
