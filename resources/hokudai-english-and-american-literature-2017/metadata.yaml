name:
  ja: 学部専門教育 英米文学 Sustainability Studies beyond Holllywood Films (2017)
description:
  ja: 2017年度に行われた講義のファイナルプレゼンテーションを収録し、導入、グループ発表、討議までを含む。各発表では、札幌のヒグマ、キャンパスライフ、LGBT理解、子育て、LGBT教育、札幌における世代間のつながりなどの題材を扱う。コース概要では、英語の理解力を生かしてUNDESDとSDGsに関わる地球規模の課題を考えることを目指す。
quotedDescription:
  text:
    ja: 'この動画では、2017年度に実施された "英米文学 Sustainability Studies beyond Holllywood Films (2017)" のファイナルプレゼンテーションの様子をご覧いただけます。

      動画01：瀬名波 栄潤、"イントロダクション"

      動画02：Group01-Team Solution Squad、"Brown Bears in Sapporo、Hokkaido"

      動画03：Group02-Team Ocean、"Have a good campus life!"

      動画04：Group03-Team IU、"Making both sexual minorities and majorities understand LGBT better"

      動画05：Group04-Love u Kiddo、"Society and Parenting: a reconcilable opposition?"

      動画06：Group05-Team Namilotte、"Introducing LGBT Education at Early Ages?"

      動画07：Group06-Team PASTA、"Intergenerational connections between older and younger LGBT people in
      Sapporo"

      動画08：瀬名波 栄潤、"ディスカッション"

      コース概要：

      The emphasis of this course is placed on achievement of comprehension skills of English language
      and its application to understand global issues raised in UNDESD (United Nations Decade of Education
      for Sustainable Development) and SDGs (Sustainable Development Goals).'
