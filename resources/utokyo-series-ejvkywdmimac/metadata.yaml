name:
  ja: 宇宙・物質・社会－物質の成り立ちから応用まで（学術俯瞰講義）
description:
  ja: 宇宙の始まりから物質の生成、原子や電子のふるまいに基づく物性の成り立ちまでを、複数の専門家の講義で横断的に扱う。さらに、先端的な実験手法や、持続可能な社会での物質機能の利用にも触れ、自然界と現代社会における物質の諸相を俯瞰する。
quotedDescription:
  text:
    ja: 'コーディネータ　家　泰弘（物性研究所）

      ナビゲータ　　　福島　孝治（教養学部）

      　この学術俯瞰講義は、理科Ⅰ類の学生諸君はもちろんのこと、生命科学系や人文・社会科学系の学生諸君の受講も大いに歓迎し、期待します。

      　一連の講義で、自然界および現代社会における「物質」の諸相を俯瞰します。われわれが棲むこの宇宙がどのように始まり、物質がどのように創られたか。物質の性質（物性）がそのミクロな構成要素である原子や電子のふるまいからどのように生じるか。それらを解明するためにどのような先端的実験手法が用いられ、新たな概念が生み出されているか。そして持続可能な社会を営むためにどのような物質の機能がの利用されようとしているか。これらを、第一線の研究を行っている専門家たちによる講義を通じて俯瞰し、自然界の成り立ちや物質の諸相を理解するとともに、われわれが将来にわたって物質を賢く利用するための素養を身につけます。'
  source: https://ch.u-tokyo.ac.jp/series/?id=EJvKyWdmiMAC
