  ja: 哲学における論理を、古典哲学から現代哲学までの流れに沿って扱う講義である。ゼノン、プラトン、アリストテレス、カント、ヘーゲル、フレーゲ、ヴィットゲンシュタインを取り上げ、それぞれの時代の論理の考え方を追う。
