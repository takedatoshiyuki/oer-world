name:
  ja: Peace Studies I 平和研究 I
description:
  ja: 平和と安全保障研究の入門として、平和研究の理論と概念、戦争や暴力的紛争の要因、紛争解決の方法を扱う。個人・集団・国家・国際政治といった複数のレベルから紛争を考え、事例研究やロールプレイも含む。国際レベルの紛争や集団安全保障にも踏み込む。
