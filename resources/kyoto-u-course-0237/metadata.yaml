name:
  ja: 第94回 京都大学丸の内セミナー「中性子で“視る”流れ」
description:
  ja: 中性子を用いて対象内部を可視化する手法を扱い、中性子ラジオグラフィや中性子イメージングの基本を概説する。あわせて、文化財の非破壊検査、植物やコンクリート中の水分分布、流体応用機器内部の流れの可視化といった応用例を取り上げる。さらに、中性子イメージングを用いた最新の応用研究にも触れる。
quotedDescription:
  text:
    ja: 現医療の分野で使われる“レントゲン”は、いわゆる「X線を用いた影絵」であるが、中性子を用いても同様に“影絵”を作ることができる。中性子とX線は、その特性に大きな違いがあり、特に中性子はほとんどの金属を透過することができ、金属の中を“視る”のに極めて有効な手段となる。このような中性子を用いた可視化手法を「中性子ラジオグラフィ」や「中性子イメージング」と呼び、その応用として、文化財の非破壊検査、植物中の水分分布、コンクリート内部の水分挙動などから、様々な流体応用機器内部の流れなどの可視化が挙げられる。本公演では、中性子の性質、イメージングの概説を行い、中性子イメージングを用いた最新の応用研究について述べる。
