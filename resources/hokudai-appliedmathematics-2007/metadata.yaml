  ja: 自然現象を数式で表すための考え方を扱い、常微分方程式、フーリエ変換、ラプラス変換を用いた予測や計算に触れる。あわせて、偏微分の概念と、数値近似での誤差や最小自乗法の活用を学ぶ内容である。
quotedDescription:
  text:
    ja: '1.自然現象を理解しこれを数式表現する能力を身につける。

      2.常微分方程式，フーリエ変換，ラプラス変換などを活用して現象の予測や計算ができる能力を身につける。

      3.偏微分の概念を理解し，ある現象を数値近似する場合の（誤差）最小自乗法などの活用法を理解する。'
