name:
  ja: 教育学研究科 E.FORUM 矢野智司教授講演会
description:
  ja: 人の交流の原理としての贈与・交換・売買を手がかりに、教育の始まりを人類史の中で考える講演会である。『教えること』『伝えること』を行った最初の先生像をたどりながら、教育を別の視点からとらえ直す。あわせて、『教える』『学ぶ』とは何かを根底から考える内容である。
quotedDescription:
  text:
    ja: 贈与と交換と売買という人の交流の形の根本的な原理をもとに、想像力と思考力によって、人類史のなかで「教育」の始まりの瞬間をとらえてみたいと思います。そして、「教えること」「伝えること」という贈与を行った「最初の先生」とは、どのような人物なのかを明らかにします。最後に、この「最初の先生」を手がかりに、これまで見慣れた「教育」の姿を、これまでにない視点からとらえ直してみることになります。「教える」「学ぶ」とはどのようなことなのかを根底から一緒に考えてみましょう。
