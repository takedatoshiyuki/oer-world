description:
  ja: 名古屋大学で開講された地理学の講義で、文系学部の新一年生を対象に南アジアを取り上げる。公開教材には、インドやバングラデシュに関する気候、カースト制度、宗教、生活文化、流通、災害などの講義ノートが含まれる。
quotedDescription:
  text:
    ja: 新一年生用の地理学の講義では、いきなり南アジアに連れていくことにしている。 近くて遠いアジアの中でも、南アジア諸国（インド・バングラデシュ・ネパールなど）となると、気候、人種、言語、そして社会システムなど総てに於いて異質である。そんな国々から名古屋大学への留学生も増えつつあり、キャンパス内で彼らと接する機会も増えてきた。その一方、名古屋大学の学生は欧米、あるいはアジアのなかでも中国・韓国・東南
