name:
  ja: 民法I（民法総則・親族）
description:
  ja: 民法の総則と親族に関する制度を、民法入門から始めて順に扱う講義資料である。能力、意思表示、不完全な意思表示、法律行為の自由と制約といった総則分野の主要な論点を取り上げている。
quotedDescription:
  text:
    ja: 民法の第一編総則と第四編親族に規定されている諸制度について概説する。講義は、具体的な紛争の現れ方に即して基本的な考え方を十分理解することに重点を置き、常に民法全体の中での民法総則の位置に注意を払う。講義項目の順序・日程などの詳細な予定は、教科書等の説明と共に、最初の時間に示す。また、講義の際には、次回講義予定の分についてレジュメを配布するので、予め教科書の該当個所をざっと読む程度の予習はしてきて欲しい。
