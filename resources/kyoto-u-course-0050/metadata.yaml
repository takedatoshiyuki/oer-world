name:
  ja: 第41回 京都大学品川セミナー「クォーク、グルーオンから核力へ」
description:
  ja: 核子に働く核力が原子核の成立にどう関わるかを扱い、湯川の中間子論で提案されたπ中間子交換の考え方を取り上げる。さらに、核子-核子散乱実験から見えてきた遠距離での有効性と近距離での斥力の存在までを述べる。
quotedDescription:
  text:
    ja: '核子（陽子や中性子の総称）には、『核力』と呼ばれる強い力が働き、その結果、銀河や星や我々の体を構成する原子核（陽子と中性子の複合体）が存在できます。

      　湯川秀樹氏は、1935年に発表した中間子論において、この核力が当時未発見であったπ中間子の交換によりもたらされると予言しました。その後、加速器を用いた核子-核子散乱実験の進展により、核子同士が遠く離れている時は湯川氏の考えは正しいが、近距離になるとπ中間子では説明できない大きな斥力（反発力）が働くことが明らかになって来ました（図１参照）。'
