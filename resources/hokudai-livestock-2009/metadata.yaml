name:
  ja: 北海道大学プロフェッサー・ビジット 地球環境と草食家畜生産システム（2009）
description:
  ja: 地球環境と調和した持続的な農業生産システムの中で、草で飼育できる家畜の意義を扱う講義である。草食家畜の生産システムについて、家畜の消化機構と草を食べる行動を手がかりに論じる。開催は弘前高等学校で、2009年11月10日に行われた。
quotedDescription:
  text:
    ja: '地球環境と調和した持続的な農業生産システムが求められています。農業のなかで、私どもが直接食べることができる穀類を使わず、草で飼育できる家畜の意義が重要になってきました。環境調和型の草食家畜の生産システムについて、その消化機構や草を食べる行動をもとにお話しします。

      場所： 弘前高等学校

      日時： 2009年11月10日'
