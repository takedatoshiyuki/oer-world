name:
  ja: 金融特論
description:
  ja: この教材は、金融論のうち金融システム論を扱い、金融市場の構造や金融機関経営を中心に論じる。あわせて、金融システムや金融規制の特徴を情報の経済学の基本概念に沿って説明する。
quotedDescription:
  text:
    ja: '金融論として扱うべき問題は、金融政策論と金融システム論に大別されるが、この講義は後者をカバーしている。経済学部 2 年生向けに講義している「金融システム」の成績優秀者を標準的な受講者と想定して、上級レベル（アメリカの有力大学の
      MBA レベル）の講義を行っている。この講義の目的は、金融市場の構造や金融機関経営について受講者の理解を深めることにある。とくに、金融システムや金融規制の特徴を、情報の経済学の基本概念に沿って解説することを目指している。具体的には、Frederic
      Mishkin,

      Economics of Money, Banking, and Financial Markets

      , (9th Edition Prentice Hall, July 2009) をテキストとして、金融システムに関する第 1、2、8、9、10、11、12 章を各章ごとに 2 回程度のペースで解説していった。'
