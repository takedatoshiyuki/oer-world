name:
  ja: 環境形成論
description:
  ja: 農業を社会の中でどう位置づけるかという観点から、環境問題を考える講義である。さらに、よりよい環境形成に向けて、望ましい社会構造を哲学的に検討する。出席メールと返信メールを用いた双方向の授業形態をとる。
quotedDescription:
  text:
    ja: '授業の特色

      講義内容に関する出席メールと返信メールによる双方向の授業。受講生に、社会への関心を呼び覚まし、それに対する考える力を養う。

      授業の紹介

      環境問題を考えるとき、社会に農業をどう位置づけるかが重要になる。本授業では、農業という側面から環境問題を考え、よりよい環境形成のためにあるべき社会構造を哲学的に考察していく。'
