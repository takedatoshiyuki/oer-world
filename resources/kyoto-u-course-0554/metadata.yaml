name:
  ja: 感染症疫学
description:
  ja: 感染症を人間文明との相互作用として捉え、現代の感染症の人類史的意義を考える講義である。エイズ問題を事例に、流行の世界的な現状や背景、影響に加え、その社会・文化・経済・政治的な文脈を扱う。あわせて、感染症疫学の基礎概念、調査方法、数学的方法と、日本で実施される感染症対策の概要を学ぶ。
quotedDescription:
  text:
    ja: '授業の概要・目的

      感染症の問題を人間文明との相互作用として理解することにより、現代の感染症の人類史的意義を学び、また、エイズ問題を事例としながら、感染症流行の世界的現状・背景・影響を理解することにより、感染症流行の社会・文化・経済・政治的文脈を学ぶ。さらに、感染症疫学という学術分野で用いられる、基礎概念・調査方法・数学的方法を学ぶとともに、具体的にわが国で実施されている感染症対策についてその概要を学ぶ。'
