name:
  ja: Introduction to Service-Learning サービス・ラーニング入門
description:
  ja: サービス・ラーニングの概要を扱い、コミュニティサービス・ラーニングや国際サービス・ラーニング、ワークキャンプなどの活動を対象にする。ICU、NGO、地方自治体、国際機関の事例を紹介しながら、NPOの回や歴史、タイプ別の整理、キャンパス内でのサービスの見つけ方まで扱う。
quotedDescription:
  text:
    ja: 'In order to motivate students to service-learning activities such as community service-learning,
      international service-learning or work camp, various activities of ICU, NGOs, community and international
      organizations will be introduced, and prepare the students for meaningful service activities.

      地域社会サービス・ラーニング、国際サービス・ラーニング、ワークキャンプなどサービス・ラーニングの活動に学生を動機づけるために、ICUやNGO、地方自治体、国際機関等が行っている様々な活動を紹介し、意味のあるサービス活動を行うための準備をおこなう。

