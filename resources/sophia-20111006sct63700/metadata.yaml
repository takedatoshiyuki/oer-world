name:
  ja: データベース
description:
  ja: データベースの基礎理論として、種類、3層スキーマ、概念データモデル、論理データモデル、ERモデル、RDBと正規化、SQL、データベース管理を扱う。あわせて、SQLを用いたスキーマ設計、データベース操作、ビュー設計の実習を行う。さらに、データベース技術の動向も取り上げる。
quotedDescription:
  text:
    ja: "仮想店舗の商品・顧客管理，新幹線やフライトの予約管理，学校の成績管理など，企業や団体における業務に関わるデータを扱うのが基幹業務システムである．この中核技術がデータベースである．本授業ではこのデータベースに関する基礎的な知識や操作スキルを学ぶ．これにより基幹業務システムを実際に設計・構築する基礎を身につける．|具体的に，情報システムの基盤となるデータベースについて，以下の項目を紹介する．実際にSQLを用いて演習も行う。\n\
      (1)データベースの基礎理論（データベースの種類，3層スキーマ，概念データモデル，論理データモデル，ERモデル，RDBと正規化，SQL,データベース管理）\n(2)基礎的なデータベース操作実習（SQLによるスキーマ設計，データベース操作，ビュー設計）\n\
      (3)データベース技術動向 \n ※授業中の課題とするため、資料は穴埋め形式にしております。"
