name:
  ja: 生物学基礎Ⅰ
description:
  ja: 細胞の構成成分、化学反応とエネルギー、細胞膜や細胞内小器官の基本的な構造と機能を扱う。あわせて、遺伝子の構造と機能、遺伝子発現、核酸とタンパク質の構造と機能、多細胞生物の制御や遺伝子異常と疾患・病態までを扱う。
quotedDescription:
  text:
    ja: '生物学の基礎的知識と科学的探究法を学ぶ。Essential Biology を教科書として、章ごとに段階的に学習する。

      よって、将来的に専門とする医学や生物学の学習の基礎を醸成する。

      生物学の基礎となる細胞の細胞構成化学成分

      各高分子の構造と機能

      化学反応とエネルギー論

      細胞の基本構造と機能、細胞膜と細胞内小器官

      遺伝子の構造と機能

      遺伝子発現と遺伝子産物

      核酸及びタンパク質の構造と機能

      多細胞生物としての生命体の成り立ちと制御のメカニズム

      遺伝子異常と疾患・病態'
