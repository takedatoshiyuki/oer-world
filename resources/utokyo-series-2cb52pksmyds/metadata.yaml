description:
  ja: 福島第一原子力発電所事故後に続けられてきた被災地支援研究の第9回報告会である。森林や土壌に加え、イネやダイズなどの作物に対する放射性物質の影響を取り上げ、研究成果を報告する。
quotedDescription:
  text:
    ja: "福島第一原子力発電所の事故直後から、3-4ヶ月ごとに開催してきた本学農学生命科学研究科での被災地支援研究も、今回で9回目を数えました。今回は森林や土壌に加え、イネやダイズといった作物への放射性物質の影響を中心に研究成果を報告しました。\
