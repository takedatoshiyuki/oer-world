quotedDescription:
  text:
    ja: '本授業では、化学生命工学に関連する有機・高分子、応用物質化学および生命分子工学分野について現在進められている研究や産業の発展について俯瞰的に学ぶことを目的とする。

      本講義の受講により

      現在の化学生命工学についての新しい知識が身につく。

      化学や生化学分野における課題や企業における研究者の役割などについて理解できる。'
