  text:
    ja: '授業の特色

      この講義では、生物圏における様々な情報を収集・分析する方法やシステムについて、水圏生物に関する研究を紹介して解説する。

      授業の紹介

      近年、発展が著しい水圏生物の調査手法であるバイオロギングを解説するとともに、具体的な研究事例を紹介する。'
