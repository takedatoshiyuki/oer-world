name:
  ja: History Wars:Reconciliation through Textbooks?
description:
  ja: この教材は、歴史の解釈をめぐる対立を「history wars」として捉え、その争点が国内外の歴史認識にどう現れるかを扱う。ヨーロッパ、近東・中東、東アジアの事例を通して、教科書が対立を生む要因にも、調整や妥協の手段にもなりうることを示す。あわせて、教科書改訂に関する二国間・多国間の取り組みも取り上げる。
quotedDescription:
  text:
    ja: 'Coming to terms with the past is an ongoing conflict about the interpretation of history. Such
      conflicts are commonly called history wars. They take place at a national level as well as between
      various countries. They are essentially differences of opinion about the development of national
      traditions, the maintenance of legitimation and the construction of identity. History wars are not
      about facts but about the meaning of historical phenomena. Debates of this kind are typically not
      confined to their specialist field but meet with broad public resonance and are often the subject
      of vehement debate. Textbooks are highly involved in these debates since they can initiate or illustrate
      ethnic, cultural, religious or political conflicts and, at the same time, also serve as a means
      of conflict resolution and compromise. The goal of this lecture is two-folded: First, it will address
      some of these ongoing history wars in various parts of the world – focusing on Europe, the Near
      and Middle East, and East Asia – and show in which way they shape the public debate on history.
      Second, it will ask which role textbooks play in mediating these conflicts. In choosing a few examples
      of bi- and multilateral activities in textbook revision I will stress the achievements and challenges
      of such endeavours.'
