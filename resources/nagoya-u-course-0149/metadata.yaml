name:
  ja: 現代数学への流れ
description:
  ja: 自然界の「数」に関わる現象を、数学的な論理として捉え直す考え方を扱う講義教材である。文系の研究対象にも数理的現象が関わることに触れ、現代数学の基本的な手法を通してその見方を示す内容である。
quotedDescription:
  text:
    ja: 数学とは自然界における「数」に関わる現象をその背後にある数学的論理とともに人間が認識し抽象化し定式化したものである。そのようなことが可能であることも大きな驚きであるが、数学がわれわれの住む「自然」の中に組み込まれていることから、このような数理的現象が一見数学とは無関係な「文系」の研究対象においても、いろいろな形で結び付いていることはまた「自然」なことである。この講義では、現代数学の基本的な手法であ
  source: https://ocw.nagoya-u.jp/courses/0149-%E7%8F%BE%E4%BB%A3%E6%95%B0%E5%AD%A6%E3%81%B8%E3%81%AE%E6%B5%81%E3%82%8C-2008/
