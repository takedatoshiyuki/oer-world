name:
  ja: 全学教育 パイプオルガンとその音楽（2010）
description:
  ja: パイプオルガンについて、音の出る仕組みや構造、歴史、地域差、宗教的背景、関連作品までを幅広く扱う。受講者全員が実際にオルガンの中に入って楽器に触れ、演奏も交えながらレジストレーションと作品解釈の関係を考える。
quotedDescription:
  text:
    ja: パイプオルガンは数ある楽器の中でも最大の楽器として知られています。コンサート・ホールなどで演奏を聴く機会は増えてきたとはいえ、まだ身近とは感じられないパイプオルガンが北大のクラーク会館には設置されています。北大が音楽大学ではないにもかかわらず比較的大型のパイプオルガンをキャンパスに持つという極めて稀な好条件に恵まれていることをまったく知らずに卒業していく学生も多いでしょう。この講義では、パイプオルガンの音が出る仕組み、楽器の構造、歴史、国や地域による特徴の違い、キリスト教的背景、オルガンのために書かれた音楽などさまざまな視点からパイプオルガンにアプローチするとともに、受講者全員に実際にパイプオルガンの中に入ってもらい楽器に直接接してもらいます。また、レジストレーションという音色の選択によって同じ音楽がまったく異なった響きになるという作品解釈の問題など、パイプオルガンならではのさまざまな問題についても実際のオルガン演奏を交えてお話します。
  source: https://ocw.hokudai.ac.jp/lecture/pipeorgan-2010
