name:
  ja: Introduction to Physics 初級物理学
description:
  ja: 物理学の基礎として、エネルギーと運動に関わる概念や法則を力学を中心に扱う講義である。物理量や単位系から始め、等加速度運動、ニュートンの運動の法則、仕事とエネルギー、運動量保存則、万有引力までを順に学ぶ。講義に加えて適宜演習を行う。
quotedDescription:
  text:
    ja: 'This course provides an introduction to fundamental concepts and laws related to energy and motion
      in the physical science.

      力学を中心として、エネルギーと運動に関わる物理学の基礎的諸概念や法則について学ぶ。ICU献学の理念とその歴史について近代日本社会の歩みの中でとらえる。明治以来のキリスト教の高等教育の歴史に始まり、冷戦時代に創設されたICUの現在までの経験を考察する。

      Contents of Lectures

      以下の項目に沿って授業を進める。授業では講義と共に適宜演習を行う。

      １．イントロダクション：物理量，単位系，有効数字

      ２．速度・加速度（1次元）9/24

      ３．等加速度運動・落下運動 9/29

      ４．速度ベクトル・加速度ベクトル 10/1

      ５．放物運動

      ６．ニュートンの運動の法則

      ７．運動の法則の応用： 静力学・動力学，摩擦力

      ８．円運動

      ９．仕事と運動エネルギー

      １０．仕事とエネルギー，エネルギー保存則

      １１．運動量保存則

      １２．単振動

      １３．剛体力学の基礎

      １４．万有引力

