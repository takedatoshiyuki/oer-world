      【教授略歴】

      1944年　兵庫県西宮市に生まれる

      1967年　京都大学工学部電気工学第二学科卒業

      1969年　京都大学大学院工学研究科電気工学第二専攻修了

      1972年　京都大学大学院博士課程単位取得退学

      1972年　京都大学工学部助手

      1980年　京都大学工学部助教授

      1996年　東京大学大学院工学系研究科教授

      電気学会会長代理・上級会員

      IEEE会員 (Council of Applied Superconductivity)

      低温工学協会理事

      超電導エネルギー貯蔵研究会理事長'
