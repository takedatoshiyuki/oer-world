name:
  ja: すまいと環境
description:
  ja: 「すまい」に関わるテーマを、住宅の歴史や居住のあり方、温熱環境や居住環境評価、さらに建築構造や材料まで含めて扱う講義である。公開教材には、温熱環境と暮らし方、居住環境評価、環境と心理状態に関する回の資料が含まれる。
quotedDescription:
  text:
    ja: '「すまい」に関する歴史・意匠・計画、建築環境・設備・エネルギー、建築構造・材料の各分野から、いくつかのテーマをピックアップして講義する。

      建築学とは

      住宅の歴史、ライフステージ・ライフスタイル、郊外・都心居住、都市インフラ、ユニバーサルデザイン など

      住宅の断熱・気密性能、自然・未利用エネルギー利用等の各種省エネルギー手法、熱環境・空気質環境と健康、換気、快適性、居住環境評価 など

      建築構造システム、各種構造（RC、鉄骨、木）、構造材料・一般材料、建築生産・管理、建築廃棄物・リサイクル、建築維持・管理、耐震診断・補強・改修、防災・防火など'
