  ja: 京都大学大学院医学研究科 社会健康医学系専攻 オープンキャンパス, 2013
description:
  ja: この教材は、京都大学大学院医学研究科の社会健康医学系専攻を紹介し、その大学院教育の位置づけを示す。公開資料としては「健康政策・国際保健学」の分野紹介を収録しており、社会健康医学が扱う学際的な領域の一端を示す。
quotedDescription:
  text:
    ja: '社会健康医学系専攻の大学院教育

      高度化、複雑化する社会における保健・医療には、従来の医学のみでは解決できない種々の側面があります。社会健康医学系専攻では、医学、薬学、生命科学、数理科学、情報科学、社会科学、人文科学を包括した学際的な教育・研究をおこなっています。京都大学大学院医学研究科社会健康医学系専攻は、日本で最も古い伝統を有し、最も充実し（日本最大の専任教官数）、最も高度な（日本で唯一、博士［社会健康医学］を授与できる）School
      of Public Healthです。'
