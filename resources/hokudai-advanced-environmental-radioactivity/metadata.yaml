name:
  ja: 原子力人材育成事業（*） 機関連携強化による未来社会に向けた新たな原子力教育拠点の構築「環境放射能学特論」
description:
  ja: 環境放射能学特論として、環境中の放射能の動きとその関連 विषयを基礎編と福島原発事故関係に分けて扱う講義である。基礎編では土壌・地下環境、大気、海洋を含む環境放射能動態を扱い、後半では福島原発事故後の陸域・海洋環境や生物影響を扱う。
quotedDescription:
  text:
    ja: "環境放射能学特論\n環境放射能動態 基礎編\n１. 環境中の放射能（長尾 誠也・金沢大学 環日本海域環境研究センター）\n２. 土壌・地下環境の放射性核種の動態（長尾 誠也・金沢大学 環日本海域環境研究センター）★準備中\n\
      ３. 大気環境（赤田 尚史・弘前大学 被ばく医療総合研究所）\n４. 海洋環境（乙坂 重嘉・東京大学 大気海洋研究所 海洋化学部門）★準備中\n \n環境放射能動態 福島原発事故関係\n５.\
      \ 福島原発事故関係（赤田 尚史・弘前大学 被ばく医療総合研究所）\n６. 福島第一原子力発電所事故の陸域環境への影響について（長尾 誠也・金沢大学 環日本海域環境研究センター）★準備中\n\
      ７. 海洋環境（乙坂 重嘉・東京大学 大気海洋研究所 海洋化学部門）★準備中\n８. 生物影響（三浦 富智・弘前大学 被ばく医療総合研究所）"
