name:
  ja: バイオミメティクス市民セミナー ゲルとバイオミメティクス （2012）
description:
  ja: この講義は、ゲルの基本的な性質と身近な例を取り上げ、そこからダブルネットワークゲル（DNゲル）へと話を進める。さらに、人の体にある筋肉・腱・軟骨を例に、生体の機能とゲルの関係を扱い、DNゲルがどのように生まれたかを説明する。
quotedDescription:
  text:
    ja: ぷるぷるのプリンやゼリー。水分を９０％以上も含んでいるのに形を保ち、ちょっと触ると崩れてしまいます。こうしたに大量の水を含みながらも水が流れ出さずに形を保つものを「ゲル」といいます。豆腐やコンニャク、ソフトコンタクトレンズもゲルです。そのイメージと正反対に、ハンマーでたたいてもトラックで踏みつぶしても壊れず、後で元の形に戻るゲルもあります。このゲルは「ダブルネットワークゲル」（略称ＤＮゲル）と呼ばれ、この物質で直径数センチメートルのボールを作り、ゴルフクラブで一撃しても、一時的に変形はするものの、元の形に戻ります。実は人の体にも、力を生む筋肉、それを骨に伝える腱、荷重に耐える軟骨といったゲルの部分が沢山あります。こうした生体の素晴らしい機能を深く知ることにより、人類は初めて強靭なＤＮゲルを生み出しました。
  source: https://ocw.hokudai.ac.jp/lecture/biomimetics-gel-2012
