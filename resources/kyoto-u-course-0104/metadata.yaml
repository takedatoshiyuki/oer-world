name:
  ja: 病理学各論
description:
  ja: 諸器官系ごとの病理病態を扱い、まず生理機能と解剖学的特徴を整理してから、各系統に特徴的な病気の原因・病態・転帰を図表や写真で説明する。心血管、呼吸器、消化器、腎臓泌尿器など多様な器官系を主題とし、顕微鏡観察や電子画像を用いた演習も取り入れて、病理診断の根拠となる形態学的変化を学ぶ。
quotedDescription:
  text:
    ja: '授業の特色

      検査技術科学専攻の学生を対象に、諸器官系の病理病態を教えます。器官系毎に生理機能、解剖学的特徴を整理した上で、特徴的な病理病態をとりあげます。顕微鏡観察、電子画像を用いた演習を適宜行い、診断の根拠となる形態学的変化を学びます。

      授業の紹介

      ヒトの器官には統合性と多様性があります。各器官の病理病態を考えるにはこの特性の理解が不可欠です。講義では、心血管、呼吸器、リンパ組織、肝胆膵、消化器、腎臓泌尿器、脳神経、骨軟部、皮膚、女性生殖器、男性生殖器、乳腺といった、諸器官系の病理病態を主題にしますが、まず、諸器官系の生理機能、解剖学的特徴を概説、整理します。続いて諸器官系に特徴的な病気を取り上げ、その病理—原因、病態、転帰を図表、写真を用いて説明します。さらに細かい内容を知りたい学生が自習し易いように、該当する教科書の図表（ロビンス第７版）を取り上げ概説します。また、現代病理学は、病気の最終診断という重要な役割を担っています。講義では、病理診断の根拠となる形態学的変化についても紹介します。形態像を効果的に学べるよう、講義の他、適宜、顕微鏡観察、電子画像、インターネットを用いた演習をとりいれます。私は、多くの学生が病気に対する知識や理解を深め、自信を持って自分の専門分野を進んで行けることを、期待しています。'
