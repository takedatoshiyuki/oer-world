  ja: Curve Counting, Geometric Representation Theory, and Quantum Integrable Systems
description:
  ja: Grassmannian の余接束を例に、有理曲線の数え上げが代数多様体の理論とどう結び付くかを扱う講義である。さらに、量子群による可積分スピン鎖の解析や、Nakajima 多様体を通じた量子群の幾何学的実現にも触れる。時間があれば、理論全体の見通しも述べる。
quotedDescription:
  text:
    ja: 'Course Description

      My goal in these lectures will be to explain, focusing on the simplest example of cotangent bundles
      of Grassmannian, how counting rational curves is certain algebraic varieties is related to several
      branches of mathematics pioneered and developed here in Kyoto, especially to the quantum group analysis
      of integrable spin chains and to the geometric realization of quantum groups provided by the Nakajima
      varieties.

      This connection was discovered by Nekrasov and Shatashvili and the example of the Grassmannians
      is really the most basic example in which the theory can be fully explained. If time permits, I
      will try to describe the general contours of the theory, as we see them today.'
