name:
  ja: 技術は人を不幸にするのか？東大教授たちと考えるELSI/RRI Vol.3 「宇宙×資源で人類の活動領域をどう拡げるか」
description:
  ja: 宇宙開発の進展と資源利用を背景に、宇宙での活動領域の拡大に伴って生じる技術的・社会的な論点を扱う。ELSI/RRIの観点から、現代世代と将来世代を見据えた課題を、登壇者の対話を通して考えるトークセッションである。
quotedDescription:
  text:
    ja: 現代社会において、技術革新は日々進展していますが、その一方で倫理的・社会的な課題も顕在化しています。こうした背景の中、大学における倫理的・法的・社会的課題（ELSI, Ethical, Legal
      and Social Issues）を意識した責任ある研究・イノベーション（RRI, Responsible Research and Innovation）の重要性がますます高まっています。本シリーズの目的は、工学が関わる様々な分野における技術とその社会的影響について、我々が持つ知見を共有し、広く社会に対して理解を深めてもらうこと、つまり、多角的な視点から未来技術のELSI/RRIを探求することです。そして、未来技術の最前線で活躍する研究者の知見と対話を通じて、視聴者に新たな視点を提供することを目指しています。
      vol.3のテーマは「宇宙と資源」。宇宙開発が進み、月や惑星や小天体の資源を利用し、多くの人が宇宙で活動するな時代が近づいています。技術と社会が関わる「新たな課題」がいろいろと出てきそうです。私たちは現代世代と将来世代までを見据えてどのように活動圏を拡げていけばよいのか？
      この答えのない問いに、各分野を代表する4人の登壇者たちが挑みます。あえて答えを出さないトークセッションを、お楽しみ下さい！
