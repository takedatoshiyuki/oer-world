name:
  ja: 第11回上智大学全国高校生英語弁論大会ジョン・ニッセル杯
description:
  ja: 第11回上智大学全国高校生英語弁論大会ジョン・ニッセル杯を扱う。大会テーマや参加者の選抜過程、本選の進め方を通して、高校生による英語スピーチの実施内容を伝える。あわせて、審査結果として入賞者の選出と英検賞の授与までを示す。
quotedDescription:
  text:
    ja: "第11回を迎える今回の大会テーマは、“New Challenges：New Connections Beyond the Pandemic”。279人の応募者のなかから厳しい一次審査を通過した15人の高校生が全国から集まり、自分自身の経験や様々な視点から、深く考え抜かれたスピーチを豊かな表現力で披露しました。\
      \ \n 本年度はコロナウィルス感染防止のため学内での本選は行わず、ビデオ映像による審査となりました。審査の結果、下記の1位から6位の入賞者が選ばれました。また、英検賞が1名の出場者に贈られました。"
