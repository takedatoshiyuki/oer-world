name:
  ja: Mammas, Don’t Let Your Babies Grow Up to Be Samurai
description:
  ja: 徳川日本における武士身分を主題に、武士であることが求められた一方で、それを避ける理由があったことを扱う。あわせて、「samurai」をどう定義するか、だれが本当の武士かを見分ける問題にも踏み込み、徳川の身分秩序が時間の中でどう保たれたかを考える。
quotedDescription:
  text:
    ja: "Mammas, Don’t Let Your Babies Grow Up to Be Samurai \n  Who wouldn’t want to be a samurai? Samurai\
      \ status was indeed coveted by many people in Tokugawa Japan, but there were also good reasons not\
      \ to be a warrior. This talk will introduce some of them, and along the way it will also address\
      \ the surprisingly difficult problem of pinning down the definition of “samurai”: who was a “real”\
      \ samurai, and who was a pretender? This presentation’s larger purpose is to consider how the Tokugawa\
      \ status order maintained its integrity over time."
