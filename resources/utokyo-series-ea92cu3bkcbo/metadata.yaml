name:
  ja: 「かたち」と「はたらき」の生物進化－偶然か必然か（学術俯瞰講義）
description:
  ja: 生物の精妙なつくりや、進化の過程で偶然がどのように関わるかを扱う講義である。生き物の現在の姿を手がかりに、その背後にある生物学の見方を紹介する。
quotedDescription:
  text:
    ja: 生き物はとても精妙にできている。例えば昆虫など、どうしてあんな小さいものが、あんな精密な動きをするのか、不思議である。あまりに精巧にできているように見えるので、しばしば人は、その背景に神のような超絶したものを想定したいという衝動に駆られるものだ。でも本当にそうだろうか。今地球上にあるこれらの存在に満足して良いのだろうか。生き物はそんなに良くできているのだろうか。理想的な生命とは、もっとずっとよくできたものではないのだろうか。またそうだとすれば、それは設計し直したりできないのだろうか。偶然という要素に大きく支配されて進化してきた生き物の本当の姿と、それを扱う生物学の考え方を紹介する。
  source: https://ch.u-tokyo.ac.jp/series/?id=ea92cu3BKcBO
