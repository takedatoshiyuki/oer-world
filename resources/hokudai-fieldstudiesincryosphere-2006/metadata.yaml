name:
  ja: 大学院教育 地球雪氷学実習（2006）
description:
  ja: この講義は、測量や積雪・河川・海氷の観測、低温風洞を用いた雪氷気象観測などを通して、雪氷圏の観測と理解を扱う。さらにスイスアルプスでの氷河実習や研究機関訪問を含み、観測データの処理・解析、報告会、研究者による講義まで行う。
quotedDescription:
  text:
    ja: '【概要】

      地球環境の変動と，環境保全の重要性を体験的に習得する。

      【スケジュール】

      1.測量実習

      2.積雪断面観測実習

      3.河川流量観測実習

      4.低温風洞等を用いた雪氷気象観測実習

      5.サロマ湖海氷実習

      6.スイス氷河実習

      【実習概要】

      目的

      氷河上での実習により野外観測技術を習得する

      氷河や氷河地形を観察して氷河、周氷河現象を理解する

      スイスの研究機関と観測施設を訪ねて地球環境研究の先端を学ぶ

      主な内容

      Aletsch氷河における観測実習

      Gorner氷河での氷河観測を見学

      観測によって得られたデータの処理・解析、結果の報告会

      スイス連邦工科大学の研究者による講義

      日程

      2006年 5月14日(日)～5月26日(金）

      行程

      5/14　札幌→東京→チューリッヒ

      5/15　チューリッヒ：スイス連邦工科大学訪問

      5/16～20 スイスアルプスにて野外実習、見学

      5/21～23　スイス連邦工科大学にて観測報告会・現地研究者の講義を聴講

      5/24　ダボス：雪・雪崩研究所訪問

      5/25～26　ダボス→チューリッヒ→東京→札幌'
