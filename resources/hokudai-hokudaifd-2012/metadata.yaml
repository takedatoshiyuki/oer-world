name:
  ja: FD研修映像資料 「教育能力を高めるために ～北大方式Faculty Developmentの実践～」（2012）
description:
  ja: 北海道大学で実施してきたFDの内容をもとにした映像資料で、教育倫理、カリキュラム、シラバス、学習目標、学習方略、成績評価を扱う。およそ1時間で、シラバスを記述し講義を設計する際の基本知識を学ぶ構成である。
quotedDescription:
  text:
    ja: 'この映像資料は、? FDの目的と教育倫理、?カリキュラムとシラバス、?学習目標、?学習方略、?成績評価を説明しており、およそ１時間で、シラバスを記述し講義を設計する際の基本知識を学ぶことができます。

      本学では、一泊二日の本格的なFDを1998年から毎年1回実施してきました。２日間で教育の基本とシラバスの書き方、およびグループ学習の手法を学べます。この方法はきわめて効果的で、「北大方式」と呼ばれ国内の多くの大学のFDのモデルになり、日本の大学教育の改善に大きな役割を果たしました。2007年度からは毎年2回開催し、70余名の新任教員が参加していますが、毎年100名を超える新任教員全員がその恩恵に浴することはできないことから、映像化が企画されたものです。

      関連動画

      ・第18回 北海道教育ワークショップ'
