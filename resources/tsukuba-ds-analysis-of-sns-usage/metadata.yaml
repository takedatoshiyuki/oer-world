    ja: この講義では、筑波大学・インテル社・つくば市の3者連携プロジェクトで地方自治体と市民社会の連携を強化するために、SNSコミュニティー（フェイスブックコミュニティー：つくば市民活動のひろば）を構築した。プロジェクト実施中、特定時期においてコミュニティー活動の低下の問題に直面し、その解析・解明のために用いたデーターサイエンス的研究手法を紹介する。
