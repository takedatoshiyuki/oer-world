  ja: 筑波大学・インテル社・つくば市の3者連携プロジェクトを題材に、地方自治体と市民社会の連携強化を目指してSNSコミュニティーを構築した経緯を扱う。あわせて、プロジェクト実施中に起きたコミュニティー活動低下をどのように解析し、解明したかに用いたデーターサイエンス的研究手法を紹介する。
quotedDescription:
