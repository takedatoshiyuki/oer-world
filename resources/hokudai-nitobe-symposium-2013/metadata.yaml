name:
  ja: 国際シンポジウム 新渡戸稲造とこれからのグローバル化 – 『武士道』と国際人- （2013）
description:
  ja: 新渡戸稲造とその思想を踏まえ、人文学研究のグローバル化を進めるために何が求められるかを学内外の参加者が討論するシンポジウムである。あわせて、北海道大学大学院文学研究科・文学部の研究力を国内外に発信し、海外の大学との学術交流を進めることを目指す。
quotedDescription:
  text:
    ja: 本シンポジウムでは、札幌農学校第二期生で国際的に活躍した新渡戸稲造とその思想内容を踏まえた上で、今後、人文学研究のグローバル化を推進するには、何が求められ、何をなすべきかについて、学内外の多彩なメンバーが自由に討論します。これを契機として、北海道大学大学院文学研究科・文学部の多様な研究力を国内外に発信するとともに、海外の大学と学術交流の推進を図ります。
  source: https://ocw.hokudai.ac.jp/lecture/nitobe-symposium-2013
