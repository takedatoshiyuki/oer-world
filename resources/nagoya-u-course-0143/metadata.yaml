name:
  ja: 物理学実験
description:
  ja: 実際の物理現象を観察しながら、物理量の測定とその背景にある法則を扱う教材である。基本的な測定の方法や原理、実験技術に加え、測定データの記録、処理、表現まで演習を通して学ぶ。
quotedDescription:
  text:
    ja: 今日の医療技術では，放射線，電子計測器，高磁場，超伝導など，物理的な技術や 測定の知識がますます重要になっている。 本授業ではこのような物理の教養を，実際の物理現象を観察し，様々な物理量を測定し，背景にある法則を理解することによって習得する。この中には，基本的な物理測定の方法と原理，実験の技術などを習得することが含まれる。さらに，演習を通して測定データの記録と処理，表現の方法についても学ぶ。
