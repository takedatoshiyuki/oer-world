name:
  ja: 全学教育 フィールド体験型プログラム 人間と環境科学（1）（2011）
description:
  ja: 北海道大学の調査研究が行われる多様なフィールドを取り上げ、研究室や実験室の外で行う活動を短時間で体験する授業である。複数のフィールドを直接体験しながら、フィールド・サイエンスに触れる構成になっている。
quotedDescription:
  text:
    ja: 北大における調査研究は、理系・文系ともに、研究室・実験室ではないさまざまなフィールドで展開されています。この授業では、それらのフィールドの数種類を短い時間で直接体験してもらうことで、フィールド・サイエンスに興味・関心を持ってももらうことを目的としています。
