name:
  ja: 北海道大学教育GP「博物館を舞台とした体験型全人教育の推進」 次世代FD・TAが支える大学教育の新たな展開(2010)
description:
  ja: 北海道大学で行われてきた教員研修と大学院生向けのTA研修を扱い、その実施状況と成果を取り上げる。あわせて、今後の展開についても述べる内容である。
quotedDescription:
  text:
    ja: 信じられないことですが、つい最近まで大学の教員は研究者であり、教育者としての訓練は受けていませんでした。自分の学生としての経験から、講義を行っていたのです。しかし、北海道大学では10年ほど前から、教育者になるための研修を始めました。その研修対象は、新任教員（FD研修）ばかりではなく大学院生（TA研修）にまで及ぶ、全国でも類を見ないものです。今回の講演では、これまでの研修の状況と成果をお話しするとともに、その将来を展望します。
  source: https://ocw.hokudai.ac.jp/lecture/nextgenerationfd-2010
