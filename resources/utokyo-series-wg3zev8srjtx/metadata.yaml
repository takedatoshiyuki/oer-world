name:
  ja: 守るべきもの、変えるべきもの（朝日講座「知の調和―世界をみつめる 未来を創る」2016年度講義）
description:
  ja: 学問や実業、日常生活のなかで変革や改革が広がる状況を背景に、何を守り、何を変えるかを考える講義である。革新と保守、グローバルとローカルなどの対立を手がかりに、各分野の講師が未来を見据えた話題を扱う。
quotedDescription:
  text:
    ja: '学問でも実業の世界でも、あるいは日常生活においてさえ、変革、革新、改革という言葉がたびたび登場するようになりました。新しい発明や発見を生み出すために、絶えざる変革が必要なことはたしかです。他方で、変革や改革がある種の常套句となり、「改革疲れ」という現象が生じていることも見逃すことはできません。変革や改革が日常化するなか、「何を守るべきか、何を残すべきか」を議論することの重要性が高まっているといえるでしょう。革新と保守、前衛と古典、グローバルとローカル、進歩と共生、集中と多様性、といった様々な対立のバランスシートを見出す姿勢が、いまほど問われている時代はありません。

      　本年度の朝日講座では、第2期5年間のスタートとして、それぞれの学問分野や実業界を担う先生方から、「何を守るべきか、そのために何を変えるべきか」という観点にもとづいた講義を行っていただきます。「10年一昔、30年一世代」といいますが、それぞれの学問分野や対象について、少し先の未来を見据えたお話を伺います。'
  source: https://ch.u-tokyo.ac.jp/series/?id=wg3ZeV8SRjtx
