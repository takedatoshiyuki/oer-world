description:
  ja: 近代から現代にかけての西洋哲学の主要な流れを扱い、カントからニーチェまでの思想家を順にたどる講義である。指定テキストの該当箇所を各回で読み進めながら、理論の展開を確認する構成になっている。いくつかのテーマでは課題の提出も含まれる。
