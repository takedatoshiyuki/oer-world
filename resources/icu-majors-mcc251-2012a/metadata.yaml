name:
  ja: 'Contemporary Japan: From Ramune to Anime 現代日本：ラムネからアニメまで'
description:
  ja: 1945年以降の日本を対象に、現代日本文化の背景と社会的・文化的な表れを扱う講義である。政治・経済の変化を手がかりに、ポピュラーカルチャーや新たな「言語」にそれがどう表現されるかを検討し、漫画とアニメにも注目する。公開されている動画は授業内容をまとめたダイジェスト版である。
quotedDescription:
  text:
    ja: 'This program/course takes students on a multifaceted guided tour through the cultural arena of
      post World War II Japan. The goal is to deepen understanding and develop appreciation of current
      Japanese social and cultural phenomena, including manga and anime.

      このコースは、現代日本文化を紹介することを狙いとし、その歴史的・文化的背景、および、今日の国際的な影響と貢献を探求する。この必修コアコースを通して、受講生は1945年以降の日本でおこった重要な政治的・経済的変化に触れる。また、これらの変化が新たな「言語」とポピュラーカルチャーにどのように表象されているかを検討することにより、その社会的・文化的表示を探る。とりわけ、アニメと漫画という。世界中から注目されている二つの現代メディアに注目する。

      ※Videos are condensed version of course.

      ※この動画は授業内容をまとめたダイジェスト版を公開しています。'
