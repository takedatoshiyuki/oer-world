name:
  ja: 連分数の不思議な世界
description:
  ja: 連分数の基本的な形と、無理数の連分数表示が無限に続くことを扱う講義である。さらに、連分数と幾何学の結びつきに話題を進める。高校生と高校教員を対象とした公開講座の教材として、講義ノートが公開されている。
quotedDescription:
  text:
    ja: 連分数というのは分数の分母がまた分数になっていて,またその分数の分母が分数になっていて…という入れ子の形をした分数のことです.特に無理数(2の平方根とか)の連分数表示は無限に続きます.この連分数は数学のいたるところに現れますが,ここでは幾何学との意外な結びつきについてお話します.身近なところに無限が潜んでいる様を感じ取ってもらえたら,と思います.
