  ja: 本講義は、数学と物理学の関係を起点に、20世紀の物理学の展開をたどりながら、相対性理論、量子力学、ブラックホール物理学へと進む。さらに、素粒子物理学の標準模型関連と弦理論を取り上げ、現代数学とのつながりを扱う。
