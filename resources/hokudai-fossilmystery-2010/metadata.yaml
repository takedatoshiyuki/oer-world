name:
  ja: サイエンス・カフェ札幌から Pick up! 化石に秘められたミステリー ～恐竜からのタイムカプセル～ （2010）
description:
  ja: 化石から恐竜の姿をどのように読み取るかを起点に、恐竜の誕生、進化、絶滅を扱う講義である。担当の小林快次はアラスカやアルゼンチンで発掘調査を行っており、講義ではその調査経験も背景に恐竜の謎を探る。
quotedDescription:
  text:
    ja: 生きている恐竜を見たことがある人は、だれもいません。研究者はその姿を、発掘された化石から想像してきました。大きな体に鋭い歯、低い声で吠えながら、ドスンドスンとものすごい足音で歩いて行く・・・みなさんはどんな恐竜の姿を想像しますか？今回のゲストは、アラスカやアルゼンチンで実際に発掘調査を行っている小林快次さんです。現在開催されている恐竜の企画展、『アラスカの恐竜』（北海道大学博物館）に関わっておられる恐竜のスペシャリストです。恐竜はいったいどのように誕生して、どんな進化をし、そしてなぜ姿を消したのか。今回はそんな恐竜のひみつを探ってみます。大昔の地球で、今の人類と同じように世界を支配していた恐竜。そんな恐竜たちの時代に、小林さんと一緒に思いをはせてみませんか。
  source: https://ocw.hokudai.ac.jp/lecture/fossilmystery-2010
