    ja: ウナギは今、慢性的な資源の低迷に苦しんでいます。絶滅危惧種に指定されたウナギもあります。なぜ資源はこんなにも減ってしまったのでしょうか？ どうすれば回復させることができるのでしょうか？ 私たちはこれからも、うな丼を食べ続けることができるのでしょうか？
