name:
  ja: 病理学総論
description:
  ja: 病気の原因と結果のつながりを軸に、病理学の一般原理を扱う講義である。血行動態の異常、腫瘍、免疫異常、感染、遺伝、代謝栄養、環境因子などの病因を整理し、特徴的な病気の例や図表、写真を通して説明する。臨床症状、診断法、治療法やロビンス第7版の図表にも触れ、病気を総合的に理解する内容になっている。
quotedDescription:
  text:
    ja: '授業の特色

      看護学、検査技術科学、理学療法学、作業療法学などの医療系分野の専門家をめざす学生を対象に、病気の理屈—病気とは何か、その原因、転帰—を教えます。病気についての知識、理解を深め、さらに興味を持てるようにしたいと考えています。

      授業の紹介

      病気には、原因とそれによる結果（表現形）があります。一つの結果（表現形）が原因となり次の結果をもたらすこともあります。病因、結果が多数存在することがあり、病態を複雑にします。全体の因果関係を総合的に理解することが、病気を理解することであり、病理学を学ぶ主要な目的です。病因は、血行動態の異常、腫瘍、免疫系の異常、感染、遺伝、代謝栄養、環境因子、その他の８つにまとめられます。授業では、こういった病気に共通する一般原理をとりあげます。一般原理が理解しやすい特徴的な病気の例をあげ、図表、写真を用いて説明します。病院で実際に遭遇する患者さんの臨床的な症状、診断法、治療法や、社会や身の回りで起きた事象をとりあげ、病気を身近なものに感じられるようにします。さらに細かい内容を知りたい学生が自習し易いように、該当する教科書の図表（ロビンス第７版）を取り上げ概説します。私は、多くの学生が病気に対する知識や理解を深め、興味をもちつつ自分の専門分野を進んで行けることを、期待しています。'
