quotedDescription:
  text:
    ja: '東京大学は、令和4年度科学技術人材育成費補助事業「ダイバーシティ研究環境実現イニシアティブ（女性リーダー育成型）」に新規取組機関として選定され、女性リーダー育成に向けた施策「UTokyo男女＋協働改革＃WeChange」を始動しています。

      この施策を全学を挙げて実施していくことを内外に宣言するとともに、今後のビジョンを議論する機会として、シンポジウムを開催しました。

      講師：林香里・吉江尚子・柿田恭良・鳥居啓子…'
