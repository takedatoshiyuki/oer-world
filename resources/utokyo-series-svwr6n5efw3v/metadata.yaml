  ja: 可燃性ガスや粉じんが着火した際に起こる爆発現象を取り上げ、火炎の伝ぱや圧力上昇、事故との関係を扱う。あわせて、爆発事故の防止と被害軽減に関する技術を、実験動画やムービーを用いて解説する。
quotedDescription:
  text:
    ja: 可燃性ガスと空気の混合気、あるいは空気中に浮遊した可燃性粉体（粉じん雲）に着火が起こるとガス爆発や粉じん爆発が発生します。これらの爆発が発生すると、高速な火炎の伝ぱによる高速な圧力上昇が生じ、しばしば重大な事故となります。これらの現象の解析結果を用いて、爆発事故発生防止および被害軽減の技術が蓄積されています。この講義では、最新の爆発の現象解析と防御技術について実験動画やムービーなどを用いて解説し…
