name:
  ja: 全学教育 英語II 英語音の特徴（2010）
description:
  ja: 日本語音との比較を通して、英語音の特徴に注目するレクチャーシリーズである。英語と日本語の違いを確認しながら、発音や聞き取りに関する基本的なヒントを扱う。
quotedDescription:
  text:
    ja: 'このレクチャーシリーズでは、英語音の特徴を日本語音の特徴と比較しながら、両者の違いに「気づき」、理解することを目指します。英語の発音や聞き取りの力をつけるための基本的なヒントをたくさん紹介します。

      作成は奥聡とPhilip Seaton、Thomas Jaquesです。'
