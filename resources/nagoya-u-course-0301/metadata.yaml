  ja: システムの基本的な考え方を扱い、システム思考やシステムの見方としてトップダウンとボトムアップを取り上げる。あわせて、地球、生態、社会、経済、集団の各システムを例に、要素のつながりや関係を考える内容で構成される。
quotedDescription:
