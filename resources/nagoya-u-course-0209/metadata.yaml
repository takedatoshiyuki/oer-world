  ja: 地球環境学2
description:
  ja: この教材は、生物相が大気・海洋・地殻と関わりながら地球史の中で発展してきたことを扱う。あわせて、生物相と自然環境の変遷を基礎的に整理し、両者の関係を地球史的な視点から考える内容である。
quotedDescription:
  text:
    ja: '生物相は，地球の歴史の中で大気，海洋および地殻と密接な相互関係をもちながら発展し，現在に至っている。本講義の到達目標は， （１）生物相および自然環境の変遷について基礎的な知識を得ること，

      （２）生物相と地球環境の関係を地球史的な観点から理解すること，

      である。'
