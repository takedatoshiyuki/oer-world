name:
  ja: 学部専門教育 生物機能化学実験II – 植物栄養学（2006）
description:
  ja: 植物が根から吸収する養分と、葉での光合成による炭素獲得を前提に、植物の生育を水耕栽培と生長解析から調べる実験を扱う。あわせて、体内の窒素、糖、デンプン、無機成分の分析を通して、これらの成分が生育にどう関わるかを解析する。実験書として、秤量操作やピペット操作、試薬の安全教育も含む。
quotedDescription:
  text:
    ja: '植物は根から炭素以外の養分を吸収し、葉で光合成により炭素を獲得している。

      授業では実際に植物を水耕栽培し、その生長解析を行うのと同時に、体内の窒素、糖、デンプン、無機成分の分析を通して植物の生育にとってこれらの成分がどのように関わり合っているのかを解析する。実験を通して、秤量操作、ピペット操作、試薬に対する安全教育などを徹底的に行い、即実践に役立つ技術、能力を身につける。'
