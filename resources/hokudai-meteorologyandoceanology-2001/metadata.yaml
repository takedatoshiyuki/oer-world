description:
  ja: 大気・海洋の経年変動と数十年変動の特徴、ならびにそのメカニズムに関する学説を扱う講義である。あわせて、こうした変動を解析するためのデータ解析手法を、基礎から応用まで学ぶ内容になっている。公開教材として講義資料の配布資料が8件ある。
quotedDescription:
  text:
    ja: 大気・海洋の経年および数十年変動の基本的な特徴とその提唱されているメカニズムに関する最新の学説を概観する。さらに、それらの大気海洋の変動を解析するためのデータ解析手法の基礎から高度な応用までを学び、各々のデータ解析手法の特徴を把握し、適切な応用を可能とする。
