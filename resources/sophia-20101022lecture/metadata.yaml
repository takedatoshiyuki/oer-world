    ja: "日本人にとってのキリスト教とは何か \n 生涯を通して「日本人にとってキリスト教とは何か」を問い続けた作家・遠藤周作は、「母なるキリスト」こそ日本人の求める神のイメージだとした。遠藤が描いた「母なる神」を、その文学と人生から浮かび上がらせる。\
