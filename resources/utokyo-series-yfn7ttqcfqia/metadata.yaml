name:
  ja: 革新的学びの創造学寄付講座 シンポジウム 第9回 「学びの中の多様性」
description:
  ja: 学びの場における多様性をテーマに、多文化、エクイティ、教育資源、バリアを切り口として事例と研究を紹介するシンポジウムである。東京大学とナガセによる基金に関連する企画として公開されている。
quotedDescription:
  text:
    ja: '東京大学と（株）ナガセは、教育を通じたインクルーシブ社会の構築に資するために「ナガセ東京大学『革新的学びの創造学』未来社会協創基金」を創設しました。第9回シンポジウムでは学びの中の様々な多様性について、多文化、エクイティ（公平性）、教育資源、バリアに焦点を当てた事例および研究をご紹介します。

      ★あなたのシェアが、ほかの誰かの学びに繋がるかもしれません。

      お気に入りの講義・講演があればSNSなどでシェ…'
