name:
  ja: 大学院教育 相転移物性物理学 群論と格子振動（2001）
description:
  ja: 構造相転移のダイナミックスを調べるための散乱・分光・中性子散乱を手がかりに、結晶の空間群の既約表現を学ぶ講義である。点群、群の表現、基準振動、空間群、SrTiO3を順に扱い、測定データの解析と解釈に必要な内容へ進む。
quotedDescription:
  text:
    ja: '構造相転移（対象性の異なる結晶相間の相転移）のダイナミックスを解明するための実験技術として、ブリルアン散乱、ラマン散乱、赤外・遠赤外スペクトル、中性子非弾性散乱などが重要視されている。これらの実験技術により得られるデータを解析、解釈する際に必要となる“結晶の空間群の既約表現”について学ぶ。

      【スケジュール】

      1. 点群

      2. 群の表現

      3. 基準振動

      4. 空間群

      5. SrTiO3'
