name:
  ja: 土曜市民セミナー 札幌の市街地西部山麓にあった温泉(2011)
description:
  ja: 札幌周辺の温泉のうち、市街地の温泉開発と、藻岩山・円山・荒井山・手稲山のふもとにあった温泉利用施設を取り上げる。明治から昭和初期にかけて存在した8施設を対象に、自然湧出や定山渓から引いた温泉を、古い資料をもとにたどる。
quotedDescription:
  text:
    ja: 札幌の市街地から20km以上離れた定山渓温泉は、明治6年にライマンにより報告された「北海道地質測量報文」にも記載されており、歴史があり、北海道を代表する大規模温泉地の一つです。一方、市街地にある温泉は昭和50年代以降にボーリングにより開発されたもので、生活圏内にあり利便なことから急激に増加し、現在では銭湯やマンションなど約50施設で利用されています。ところが、この市街地に隣接した藻岩山、円山、荒井山、手稲山のふもとに、明治から昭和初期にかけて８つの温泉利用施設がありました。温泉は自然湧出や定山渓から引いたもので、古い資料などから、その全貌を明らかにします。
  source: https://ocw.hokudai.ac.jp/lecture/spas-2011
