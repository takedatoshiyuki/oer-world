name:
  ja: 土曜市民セミナー 定年退職記念講演 考古学は何を語れるか？ （2011）
description:
  ja: 考古学が物的資料にもとづいて人間の活動を復原し、歴史を理解する学問であることを扱う講義である。北大キャンパス、札幌の街、石狩低地帯を取り上げ、北海道の歴史を考古学的に考える。
quotedDescription:
  text:
    ja: 人文科学は結局のところ、人間とはなにかを追求する学問であり、自然科学は、人間の存在基盤・条件を解明する学問だと考えられます。考古学は、人間活動の結果残された物的資料によって、その活動を復原・推定し、人間の歴史を理解する学問です。わたしたちの暮らす北大キャンパス－札幌の街－石狩低地帯から考古学的に北海道の歴史を考えてみましょう。
