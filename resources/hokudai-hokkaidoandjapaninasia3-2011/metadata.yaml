    ja: 中国が大国化の一途をたどる一方で、日本は“空白の20年”を総決算するような東日本大震災に見舞われました。日中関係はこれからどうなるのでしょう？　北海道にとって、中国はどのような存在になるのでしょうか？　北海道経済の現状や中国の動向とりわけ中国の政治、社会の動向を踏まえながら考えます。
