name:
  ja: 第6回上智大学全国高校生英語弁論大会ジョン・ニッセル杯
description:
  ja: 全国の高校生が応募し、第一次審査を通過した参加者が英語でスピーチと質疑応答を行う弁論大会である。テーマは「Creating Our Future Together」で、自分の経験や視点をもとに理想の未来像を述べる内容になっている。スピーチは4分以上5分以内で、その後に審査員の質問に英語で答える。
quotedDescription:
  text:
    ja: "第6回を迎える今回の大会テーマは、“Creating Our Future Together”。187人の応募者のなかから厳しい第一次審査を通過した19人の高校生が全国から集まり、自分自身の経験や様々な視点から、それぞれ理想の未来像を熱く語りました。\
      \ \n 大会ルールとして、スピーチの長さは4分以上5分以内、スピーチ後に審査員からの質問に英語で答えることなっています。審査の結果、下記の1位から6位の入賞者が選ばれましたが、惜しくも受賞を逃した皆さんのスピーチも、よりよい未来のために人々ができることのアイデアに溢れていました。若い高校生の皆さんの問題意識の高さと真摯な想いが、明るい明日をもたらすと確信させる素晴らしい大会となりました。"
