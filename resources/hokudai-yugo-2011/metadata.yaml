name:
  ja: GCOE総合博物館市民セミナー 旧ユーゴ圏内における境界を巡る記憶の語り（2011）
description:
  ja: 旧ユーゴスラヴィア連邦の分裂と国境線の形成を背景に、現代作家が共産主義時代やユーゴスラヴィアをどう捉え直すかを扱う。歴史記述と私的な記憶を交差させる語りに注目し、セルビア・クロアチア・ボスニアの作家の表現を考える。
quotedDescription:
  text:
    ja: '旧ユーゴスラヴィア連邦では20年前、民族間の紛争が起こり、連邦内に国境線が引かれていきました。そのような中で現代作家の多くは、独自の視点から共産主義時代にアプローチしています。このセミナーでは、歴史記述と私的な記憶の領域とを取り混ぜる語り口に着目することで、現代のセルビア・クロアチア・ボスニアの作家たちが、どのようにユーゴスラヴィアを捉え直そうとしているか考えたいと思います。

      ‡ これらの資料は制限資料です。'
