  ja: グリーン・ニューディールをテーマに、講演会と討論会を通じて政策立案を考える教材である。第6回ディベート大会と関連し、現状を把握しながら北海道への提言も視野に入れて議論する内容になっている。
quotedDescription:
  text:
    ja: 第6回ディベート大会では、グリーン・ニューディールという日本政府の大局的な政策関心のもとに、終局的には北海道への提言として、現状を正確に把握しつつ、事態に対応するために、独創的な政策立案を競います。今回はこのテーマをより具体的に考えてもらうために、講演会＋討論会を開催いたしました。
