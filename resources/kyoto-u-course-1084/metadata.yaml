name:
  ja: 公開講演会「芦生の森を未来につなぐために」
description:
  ja: 京都大学芦生研究林における原生的な森林と希少植物の生育状況を扱い、近年のシカ害やナラ枯れによる植生の変化にも触れる。あわせて、絵画・写真展や講演会を通じて、芦生の森を守るための活動事例を多様な立場から紹介する。
quotedDescription:
  text:
    ja: 京都丹波高原国定公園の核心地域である京都大学芦生研究林には、原生的な森林が保全されており、希少な植物の一大生育地となっています。しかし、20年以上にわたってシカ害やナラ枯れの影響を受けたことで、豊かだった植生は衰退し、樹木の更新も滞ってきています。絵画・写真展や講演会を通じて、芦生の天然林の希少性を伝えるとともに、芦生の森を守るための活動事例を多様な立場から紹介し、植物及び環境の保全意識の醸成を図る契機としていきたいと思います。
  source: https://ocw.kyoto-u.ac.jp/course/1084/
