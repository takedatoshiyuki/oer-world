name:
  ja: 'S2: Education Projects for Global and Social Change Ｓ２：グローバル・社会変革のための教育プロジェ'
description:
  ja: 教育を通じてグローバル社会に関わる役割を考えながら、教育プロジェクトの企画と実施を進める講義である。欧米やアジアの高等教育の展開、発展途上国の大学事例、高等教育と経済・政治発展の関係を扱い、学外セミナーとグループでのプロジェクト発表につなげる。
quotedDescription:
  text:
    ja: 'This course will challenge students to think about their present and future role as global citizens
      in shaping global society through education and facilitate education project planning and implementation.
      Off-campus seminars will be organized at institutions such as UNICEF, JICA, and local NGOs to provide
      students with an opportunity to learn about other examples of education projects. Students will
      work in groups to plan and implement an education project to effect global/social change.

      教育プロジェクトの計画や実施を通して、地球市民としてグローバル社会の構築にどのような役割を果せるかを考察する。ＵＮＩＣＥＦ、ＪＩＣＡ、草の根ＮＧＯなどで学外セミナーを実施し、様々な教育プロジェクトの事例から学ぶ。受講者はグループでグローバル・社会変革に影響するようなプロジェクトを計画し、実施する。

