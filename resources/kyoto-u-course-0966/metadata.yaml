name:
  ja: 人間・環境学研究科 公開講座 「オンライン授業を覗いてみよう：専門を他者に語る～私たちの教育実践」
description:
  ja: 京都大学人間・環境学研究科の公開講座として、研究活動ではなく教育活動を紹介する内容である。2020年度後期に同研究科教員が担当する全学共通科目と総合人間学部科目の授業をオンラインで取り上げる。
quotedDescription:
  text:
    ja: 本研究科は毎年公開講座を開催し、日々の研究活動の成果の一端を市民の皆様にご紹介しております。ただ、本年（令和二年）は新型コロナウイルスの感染拡大防止のため、公開講座の開催を見送ることとし、代わりにオンライン上で、研究活動と並ぶ大学のもう1つの柱である、教育活動をご紹介することにいたしました。今回ご覧頂きますのは、本研究科教員が担当する、本年度後期の全学共通科目および総合人間学部科目の授業です。
