name:
  ja: 「いのち」のシステムを解き明かす－急展開する生命科学（学術俯瞰講義）
description:
  ja: 生命科学の進展を、ゲノムシステム、細胞システム、脳を含む高次生命システムの3つの階層から整理する講義である。全塩基配列の解読とイメージング技術の進展を手がかりに、生命理解がどのように広がってきたかを扱う。
quotedDescription:
  text:
    ja: '「いのち（生命）」とは何だろう。現在の地球には何百万もの種があり、そのうちの１つの種であるヒトだけで67億の生命がある。土壌や海中の細菌にいたっては、その個体数だけでなく種数も計測不可能なほど多い。私たちヒトは、ヒトの誕生以来、生活の必要性からまた知的好奇心から、この多様な生命を理解しようと努めてきた。歴史的にみると、これまでに生命の理解が飛躍的に進んだ時期がいくつかある。1990年代後半からの現在に至る10数年も、まさにそのような時期で、新たな知識に基づいて生命観も大きく変わりつつある。この変化の大きな潮流をつくったのは、生命の設計図であるゲノムを構成する全塩基配列の解読と生命を生きた状態で観察するイメージングの進展である。

      本講義では、これらの新しい技術・情報により急展開しつつある生命の理解を、３つの階層－ゲノムシステム、細胞システム、高次生命システムの代表としての脳－から俯瞰する。'
