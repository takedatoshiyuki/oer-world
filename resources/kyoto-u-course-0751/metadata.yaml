name:
  ja: Fluctuation-dissipation relations for reversible diffusions in a random environment
description:
  ja: この講義は、統計物理の揺らぎ散逸関係を出発点に、ランダム環境中の可逆拡散へ適用する理論を扱う。小さな外力を受ける拡散の有効ドリフトと、摂動なしの運動の有効分散との関係にも触れる。有限相関長をもつ場合のFDRの証明を説明し、その過程でスケーリング極限の記述まで扱う。
quotedDescription:
  text:
    ja: 'Course Description

      Fluctuation-dissipation relations (FDR) were introduced in statistical physics to describe off-equilibrium
      dynamics; they express the linear response of a perturbed system as correlations for the un-perturbed
      system.

      When applied to reversible diffusions in a random environment, they yield the so-called Einstein
      relation: the derivative of the effective drift of a diffusion in a random environment subject to
      a small external force equals the effective variance of the un-perturbed dynamics in the direction
      of the perturbation.

      The aim of the course will be to explain the proof of FDR for reversible diffusions in a random
      environment with finite range of correlation. The proof also provides a full description of all
      the scaling limits of such processes.'
