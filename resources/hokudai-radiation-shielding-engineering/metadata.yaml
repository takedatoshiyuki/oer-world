name:
  ja: 原子力人材育成事業（*） 機関連携強化による未来社会に向けた新たな原子力教育拠点の構築「放射線遮蔽工学」
description:
  ja: 放射線遮蔽工学の基礎として、遮蔽計算に関わる用語、放射線源、線量体系を扱う。さらに、光子と遮蔽材の相互作用、離散座標Sn輸送計算法による決定論的手法、原子炉施設の遮蔽設計へと進み、軽水炉や使用済燃料乾式貯蔵施設を対象にする。
