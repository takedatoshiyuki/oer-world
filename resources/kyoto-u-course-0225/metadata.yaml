  ja: 英語で科学論文を書く方法と、プレゼンテーションの要点を扱う。対象は、英語を母語としない理科系の学生と研究者で、日本語字幕が付く。内容は、マルコム・フィッツアールの著書をもとにしている。
quotedDescription:
  text:
    ja: 英語による科学論文の書き方ならびにプレゼンテーションのエッセンスを解説する。対象は、日本人を含む英語を母国語としない理科系の学生と研究者である（日本語字幕あり）。本コースの内容は、マルコム・フィッツアール著「マルコム先生の書いて身につく科学英語ライティング（Professor
      Malcolm’s Guide to Scientific English Writing）」（京都大学学術出版会、2015年発行）に基づいている。より詳しく知りたい方は是非このワークブックで学んで欲しい。なおマルコム先生は英国人なので、単語のスペルが米語と異なっている箇所があることを了承されたい。
