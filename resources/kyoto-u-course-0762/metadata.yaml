description:
  ja: Arduinoに各種センサーやアクチュエータを接続し、プログラムで動作させる方法を扱う。あわせて、アイデアを考えて実際に形にする過程を通して、Physical Computing の基本を体験する。
quotedDescription:
  text:
    ja: '授業の概要目的

      小型の組み込み用マイクロプロセッサとその開発環境が安価になり，これにセンサーやアクチュエータなどを接続して能動的に動作するものについてのアイデアを形にすることが Physical Computing
      として注目されている．本授業では実際にArduinoと呼ばれる小型のマイクロプロセッサボードにさまざまなセンサやアクチュエータを接続し，プログラムで動作させることを学習するとともに，自らアイデアを出し，これを実現させることを通して
      Physical Computing について体験的に学ぶ．'
