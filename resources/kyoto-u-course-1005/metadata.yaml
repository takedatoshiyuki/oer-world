name:
  ja: 【オンライン公開講義】”立ち止まって、考える” シーズン2「コロナ禍における外国人住民と質的調査」
description:
  ja: 新型コロナ感染症が外国人住民に与える経済的影響を、国籍や雇用形態、在留資格、職種、年齢、ジェンダーの違いから扱う講義である。NPOフードバンクと連携した対面調査や、行政手続き支援、非正規滞在者への支援を含む調査実践を取り上げる。後半では、その調査を通じて、互恵性にもとづく調査や擁護、政策提言といった質的調査のあり方を論じる。
quotedDescription:
  text:
    ja: '新型コロナ感染症による経済的影響は国籍、雇用形態、在留資格、職種、年齢、ジェンダーによって大きく異なる。もともと正規職員の割合が低い外国人住民にとっては、経済的な影響が強いが、特に女性はパートで生計を立てている割合が高いため、影響は甚大である。脆弱なる者はより脆弱になる傾向が明快である。

      調査はNPOフードバンクと連携して互恵的な対面調査を実施した。その過程において行政手続き支援も行った。また、非正規滞在者（不法滞在者）に対する支援も実施した。後半はコロナ禍における互恵性にもとづく調査、擁護、政策提言といった質的調査のコミットメントについて論じる。

      オリジナルのコンテンツは、人社未来形発信ユニットのウェブサイトでご覧いただけます。

      https://ukihss.cpier.kyoto-u.ac.jp/2313/'
