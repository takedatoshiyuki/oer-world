name:
  ja: 北海道大学公開講座 アジアのなかの日本・北海道 第7回 持続可能な水産業への取り組み ～日韓拠点大学交流から得たもの～ （2011）
description:
  ja: 海洋環境の変化や過剰な漁獲によって水産資源が減少する状況を踏まえ、水産業の持続的利用を考える講義である。資源量の見積もりや海洋環境の把握に加え、養殖や食品加工の技術までを対象に、資源の安定確保に向けた論点を扱う。
quotedDescription:
  text:
    ja: 現在、地球規模での海洋環境の変化や過剰な漁獲が水産資源を減少させています。地球環境の保全と食糧の確保は人類に課せられた21世紀の課題であり、水産資源の持続的利用は水産学に課せられた使命です。水産資源の安定確保のためには、資源量の見積もりや海洋環境変化の把握が不可欠であり、さらに安心、安全な養殖、食品加工技術が求められています。環境へ与える負荷を最少にして、限りある資源を無駄なく、有効に利用する持続可能な水産業を考えます。
  source: https://ocw.hokudai.ac.jp/lecture/hokkaidoandjapaninasia7-2011
