name:
  ja: メディアディスコース分析論
description:
  ja: 批判的言説分析を手段として、マスメディアと社会の力関係の関係を考察する講義である。あわせて、その力関係がメディアテクストにどのように現れるかを扱い、批評的メディアリテラシーの基礎を学ぶ内容になっている。
quotedDescription:
  text:
    ja: 本講義では、批判的言説分析（以下ＣＤＡ：Critical Discourse Analysis）分析方法を研究手段とし、マスメディアが社会の力関係から受ける影響、またマスメディアがそれに与える影響そしてこの力関係がメディアテクストで具現化される様相を考察し、批評的メディアリテラシーの確固たる基礎を学習することを授業のねらいとする。
  source: https://ocw.nagoya-u.jp/courses/0075-%E3%83%A1%E3%83%87%E3%82%A3%E3%82%A2%E3%83%87%E3%82%A3%E3%82%B9%E3%82%B3%E3%83%BC%E3%82%B9%E5%88%86%E6%9E%90%E8%AB%96-2009/
