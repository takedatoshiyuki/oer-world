name:
  ja: サイエンス・カフェ札幌から Pick up! 北大発、金星行き ～惑星探査の新しい時代が始まる～ （2011）
description:
  ja: この講義は、金星にカミナリがあるかどうかという問題と、その観測に向けたカメラ開発を扱う。あわせて、金星や地球の大気現象を雷放電観測で調べる方法を取り上げる。
quotedDescription:
  text:
    ja: 'ゲストの高橋幸弘さんは、金星の「カミナリ」について研究しています。金星にカミナリがあるかどうかは、30年来議論が決着しない大問題であり、これを解明することは、金星の気象を理解する上で大変重要な鍵となります。高橋さんは、金星探査機「あかつき」に搭載するための、LAC（愛称：ウリボウ）と呼ばれるカミナリ観測専用カメラの開発を手がけました。金星のカミナリの性質がわかることで、金星の大気の動きについて理解を深める貴重な手がかりが得られると期待されています。今回のサイエンス・カフェでは、金星のカミナリをはじめとする惑星や地球の大気現象の面白さと、その謎を解き明かす雷放電観測を利用したユニークなアプローチについてご紹介いただきます。

      高橋 幸弘

      1965年、千葉県四街道市生まれ。北海道大学大学院理学研究院教授（宇宙惑星科学分野）。カミナリ放電や電離圏・磁気圏での電気現象を軸に、地球及び惑星の大気を銀河宇宙線や太陽活動など宇宙空間との関連に注目しながら、その物理・化学過程の解明を目指しています。そのために、新設した口径1.6mの望遠鏡、惑星探査機搭載機器、地球周回の大学衛星、世界雷放電観測網などハード及びソフトウェアの開発とそのデータ解析を行っています。趣味は一年前から始めたアーチェリー。忙しい合間を縫って、週末家族が暮らす甲府で息子さんと楽しんでいます。'
