  ja: Introduction to Cultural Studies カルチュラル・スタディーズ入門
description:
  ja: カルチュラル・スタディーズの成立と発展を、異なる社会的文脈の中でたどる講義である。英国で文化批判の理論として生まれたこの分野の歴史と基本概念を扱い、日常の出来事を批判的に考察する方法まで学ぶ。
quotedDescription:
  text:
    ja: 'This course examines history and development of cultural studies in different social contexts

      カルチュラル・スタディーズは、しばしば「文化の政治学」として訳される。それは、文化に向けられる批判的な視線がいやおうなく文化と権力の問題にいきつくからだ。文化は、日々の交渉や抗争が起きる＜場＞でもあり、さまざまな社会的矛盾が露呈する空間でもある。このクラスでは、文化批判の理論として英国において登場し発展してきたカルチュラル・スタディーズの歴史や基本的な概念を学び、私たちの身の回りで日々起きている事象を批判的に考察する方法を学ぶ

      。'
