name:
  ja: 第28回 京都大学品川セミナー「大人になっても神経細胞は増えているの？－その不思議な役割について」
description:
  ja: この講義では、成体になってからも脳で新しいニューロンが生まれる現象を取り上げ、その分布と働きを説明する。海馬・歯状回や側脳室周囲領域でのニューロン新生が、記憶や匂い情報の処理、さらに一部の行動にどう関わるかを、マウスの実験結果に基づいて紹介する。あわせて、子供の時期に生まれるニューロンの役割にも触れる。
quotedDescription:
  text:
    ja: 脳にある神経細胞（ニューロン）は胎児期にのみ産生され、子供や大人になってから一度失われると二度と再生しないと考えられてきました。ところが、ヒトを含めた哺乳動物の脳の海馬・歯状回や側脳室周囲領域では、成体になっても新たなニューロンが生まれ続けること（成体脳ニューロン新生）が明らかになってきました（図１）。海馬・歯状回で生まれたニューロンは記憶や学習に重要な役割を担い、側脳室周囲領域で生まれたニューロンは匂い情報の処理に働きます。遺伝子操作によって、成体になってから新たなニューロンができないマウスを作ったところ、空間記憶（どこが安全か、どこにエサがあるかといった場所に関する記憶）に障害が見られました。しかし、匂いの識別や記憶に関しては、異常は見つかりませんでした。次に、天敵臭に対する反応をしらべたところ、正常マウスもニューロン新生を抑制したマウスもどちらも忌避反応を示しました。ところが、天敵臭と報酬（エサ）を同時に提示すると、正常マウスはやはり忌避反応を示すのに対して、ニューロン新生を抑制したマウスは天敵臭に近付きエサを食べるようになり、さらにエサ無しでも天敵臭に近付くよう条件付けもできました。また、ニューロン新生を抑制したオスはメスに対して明らかな性行動を示さなくなりました。一方、ニューロン新生を抑制したメスは妊娠率の低下や子育て放棄を示しました（図２）。このように、ニューロン新生が抑制されると、嗅覚に依存した応答（匂い応答）の中で先天的にプログラムされたものに異常が見られました。このような大人になってから生まれるニューロンの不思議な役割について、最近の研究成果を紹介します。また、子供の時期に新しいニューロンができないマウスを作ったところ、違った異常が見られることがわかりました。子供のときに生まれるニューロンの不思議な役割についても紹介します。
