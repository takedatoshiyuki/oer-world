name:
  ja: ロシア政治・外交Ａ－１／RUSSIAN POLITICS A-1
description:
  ja: 近現代の日露関係史を、国境画定問題を軸に扱う講義である。国際条約や共同宣言、外交資料、国会議事録、日記などの史資料を取り上げ、それらの読み取りを通じて日露関係を事例とする外交史・国際関係史研究の基礎を学ぶ。
quotedDescription:
  text:
    ja: 近現代日露関係史を国境画定問題を中心に、知られざる日露関係のエピソードもまじえて概説します。講義では、国際条約、共同宣言、外交資料、国会議事録、日記などの史資料を取り上げ、それらについて解説しながら、日露関係を事例とする外交史・国際関係史研究の基礎を学びます。
