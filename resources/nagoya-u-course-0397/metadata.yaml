name:
  ja: 無機化学IV
description:
  ja: 無機化学I, IIで学んだ基礎を土台に、周期表の1, 2, 13〜18族元素の化学を扱う教材である。族ごとの元素の性質や反応性を整理し、代表的な単体や小分子の分子軌道・エネルギー準位を通して、電子構造との関係を学ぶ。
quotedDescription:
  text:
    ja: 'この講義では、先に無機化学 I, II で習得した無機化学の基礎的な知識を基に、周期表における 1, 2, 13〜18 族元素（典型元素）の化学について、更なる理解を目指す。

      周期表の族ごとに元素の性質を整理し、基本的な反応性について学ぶ。

      いくつかの主だった元素の単体および元素を含む小分子の分子軌道とエネルギー準位について学び、単体や小分子の性状・反応性を電子構造と結び付けて理解し、予測する力を習得する。'
