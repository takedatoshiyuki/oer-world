name:
  ja: OE Japan 国際シンポジウム「世界と日本のオープンエデュケーション」
description:
  ja: オープンエデュケーションをめぐる国内外の動向を取り上げ、OERやMOOCの活用が教育機会の均等、専門職育成、リカレント教育、SDGs支援にどう結びつくかを扱う。あわせて、Open Education
    Globalの関係者と日本の実践者を招き、世界と日本の取り組みの現状、可能性、課題を議論する。
quotedDescription:
  text:
    ja: '近年、オープンエデュケーションは初等中等教育、高等教育、生涯学習の課題解決を担う手段として国内外で注目されています。教育機会の均等、専門職育成、リカレント教育の推進、持続可能な開発目標（SDGs）の支援など多様な目的にオープン教育資源（OER）や大規模公開オンライン講座（MOOC）の活用が期待されています。

      本シンポジウムでは、国際的なオープンエデュケーション推進団体Open Education Global（旧Open Education Consortium）のメンバーと、日本においてオープンエデュケーションやオンライン教育を牽引する有識者を招き、世界と日本のオープンエデュケーションのこれから、可能性と課題について議論します。

      Open Education Japan（旧：日本オープンコースウェアコンソーシアム）: https://oe-japan.netlify.app/

      Open Education Global: https://www.oeglobal.org/'
