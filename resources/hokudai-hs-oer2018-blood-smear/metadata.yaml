description:
  ja: この映像教材は、臨床検査で用いる血液塗抹標本の作製手技を扱う。実験台で行う方法と手持ちで行う方法に加え、鏡検に適さない標本例も取り上げる。
quotedDescription:
  text:
    ja: 'この映像教材では、「血液塗抹標本作製（実験台）」「血液塗抹標本作製（手持ち）」「鏡検に適さない血液塗沫標本例」の臨床検査手技について学ぶことができます。

      「血液塗抹標本作製（実験台）」

      監修：政氏伸夫（北海道大学大学院保健科学研究院病態解析学分野）

      演示：七戸加奈（北海道大学医学部保健学院）

      ナレーション：熊原茜（北海道大学医学部保健学科検査技術科学専攻）

      「血液塗抹標本作製（手持ち）」

      監修：政氏伸夫（北海道大学大学院保健科学研究院病態解析学分野）

      演示：七戸加奈（北海道大学医学部保健学院）

      ナレーション：熊原茜（北海道大学医学部保健学科検査技術科学専攻）

      「鏡検に適さない血液塗沫標本例」

      監修：政氏伸夫（北海道大学大学院保健科学研究院病態解析学分野）

      スライド塗沫・染色：熊原茜（北海道大学医学部保健学科検査技術科学専攻）、松岡穂奈実（北海道大学医学部保健学科検査技術科学専攻）

