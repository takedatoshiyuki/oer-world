name:
  ja: 媒介／メディアのつくる世界（朝日講座「知の冒険―もっともっと考えたい、世界は謎に満ちている」2015年度講義）
description:
  ja: 媒介や媒体に注目し、メディア論をはじめとする研究の視点を扱う講義である。書物や媒体を単なる伝達手段としてではなく、世界の見え方を変える対象として考える。こうした観点から、ものの見方そのものを捉え直すことを目指す。
quotedDescription:
  text:
    ja: 媒介とか媒体などというと、ことの本質にあまり関わらない脇役のように思われそうです。たしかに、書物は書かれている内容が主人公であり、その媒体としての紙やインクなどは、そのために奉仕するだけのものに思われるかもしれません。しかし、媒介や媒体の方に焦点を合わせ、そちらの側からみてみることで、時には世界が全く違った見え方をしてくることすらあります。メディア論を筆頭に、近年様々な分野で進んでいる、そのような観点からの研究の一端に触れることは、われわれのものの見方そのものを根本から考え直すきっかけになることでしょう。
  source: https://ch.u-tokyo.ac.jp/series/?id=vBfUUmCVDwEC
