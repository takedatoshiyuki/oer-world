name:
  ja: 電気電子基盤技術の展望 -電気電子基盤技術の研究教育拠点形成-
description:
  ja: 'この講義は、電気・電子基盤技術の全体像を体系的に扱う。公開教材では、半導体材料、イオンビーム技術、量子コンピューティング、ネットワーキング、SoC、超伝導応用などの話題を取り上げる。


    教材は8件の講義資料で構成され、個別テーマごとの講述を通して基盤技術の概要を示す。'
quotedDescription:
  text:
    ja: '授業の紹介

      21世紀における人類の持続的繁栄にとって、地球環境に十分配慮した超高度通信技術および電力供給技術が不可欠である。このような未来社会からの要請を満足する技術を確立するためには、電子材料・デバイス、回路・システム設計、および通信システム・電力システムに関する研究の革新的進展が必須となる。本講座においては、体系的なカリキュラムのもと、電気・電子基盤技術の概要について講述する。'
  source: https://ocw.kyoto-u.ac.jp/course/13/
