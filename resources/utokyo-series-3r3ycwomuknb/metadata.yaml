name:
  ja: 第139回（2024年秋季）東京大学公開講座「宇宙」
description:
  ja: 東京大学の公開講座として、宇宙を自然科学や社会科学の複数の視点から扱う。内容は「宇宙の誕生」「惑星と太陽系」「宇宙探査」の3つのテーマに分かれ、宇宙に関する話題を幅広く取り上げる。
quotedDescription:
  text:
    ja: '東京大学の天文学の歴史は、1877年の東京大学の創立から更に遡り、その起源は江戸幕府の天文方にまでたどり着きます。

      2027年の東京大学創立150周年へのカウントダウンが始まったいま、「宇宙」をめぐる歴史的な発見やできごとが数多く起こっています。本公開講座では、宇宙を自然科学や社会科学のさまざまな分野から多面的に眺め、「宇宙の誕生」「惑星と太陽系」「宇宙探査」という3つのサブテーマのもとお話します。'
