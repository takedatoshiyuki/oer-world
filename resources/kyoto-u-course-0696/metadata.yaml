name:
  ja: 言語科学基礎論 I
description:
  ja: 現代の認知科学の中で、言語をどのような心的能力・生物学的認知機構として研究するかを扱う入門講義である。言語の起源や進化にも触れつつ、生物学としての言語学、自然科学としての言語学の考え方を考察する。講義資料では、生成文法から移動、束縛、語彙・機能範疇、項構造までを扱う。
quotedDescription:
  text:
    ja: '授業の特色

      現代の認知科学における言語の科学的研究に関する入門的講義である。

       

      授業の紹介

      言語は人間という生物種を特徴づける心的能力・生物学的認知機構の一つであり、これを研究・解明することで、人間とはどういう生き物であるのかを理解しようとするのが現代の言語学である。特に近年、学際的研究が推進されている言語の起源と進化の問題にも言及しながら、生物学としての言語学、自然科学としての言語学のあり方を考察する。'
  source: https://ocw.kyoto-u.ac.jp/course/696/
