name:
  ja: International Organization & United Nations Studies 国際連合・国際機構論
description:
  ja: 国際連合と他の国際機構を対象に、その歴史、組織構造、活動を扱う。国連の機能や平和と安全保障、持続可能な開発、人権、国連改革に加え、地域機構、非国家主体、メディア、人間の安全保障まで取り上げる。
quotedDescription:
  text:
    ja: 'This course will study the history of the United Nations and other international organizations,
      their organizational structures and activities, and the solutions of various international problems
      through the framework of international organizations.

      国際連合や他の国際機構の歴史、組織構造や活動、国際機構の枠組みを通じた様々な国際問題の解決などを考察する。

