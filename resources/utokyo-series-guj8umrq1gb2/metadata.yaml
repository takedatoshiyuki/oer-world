name:
  ja: 知の構造化論
description:
  ja: 実社会の問題や課題を対象に、分野や時勢を越えて知を抽出・分析する方法を扱う。実データを用いた処理を踏まえたうえで、共通講義の後にテーマ別のゼミ形式で議論を進める構成である。テーマとして、人文知の構造化と医療情報の構造化を扱う。
quotedDescription:
  text:
    ja: "本講義では、実社会で生じる様々な問題や課題に対して、分野や時勢を越えて知を抽出、分析する手法を学び、実データに対する処理を体現しながら議論を進めることを目的とする。本年度はまず以下のテーマについて開講する。受講生は、共通的な内容の講義の後、いずれかのテーマを選択し、それぞれのテーマに対する議論をゼミ形式で進める。\n\
      \tλ\t人文知の構造化：岩波「思想」を題材に\n岩波書店が1921年に創刊した日本を代表する思想・哲学ジャーナル 「思想」90年分のデジタル化とその知の構造化を実践する。20世紀の日本哲学の歴史的を分析し、議論を進めることで、人文学と情報学との融合を体現する。\n\
      \tλ\t医療情報の構造化\n医療情報分野では、新しい治療法や患者状態など大量の情報を緻密に扱う必要があり、かつ、経営、法律、倫理、患者のQOLなど多くの実際的要素を考慮しなくてならない。実践的な場への情報技術の実装と、価値の創出を試みる。\n\
      （本講義は、講義形式の4回分を公開し、残りの演習形式の回は非公開とします。）"
