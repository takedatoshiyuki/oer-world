name:
  ja: 情報通信政策論
description:
  ja: 情報通信政策の全体像を、通信を軸にして扱う講義である。情報の流通、通信・放送・電波、知財や文化活動までを含む広い領域を対象とし、最新の政策動向や東日本大震災の影響にも触れる。
quotedDescription:
  text:
    ja: 情報通信政策は非常に幅広い内容を含んでおり、情報発信から情報の伝送、情報の受け止め方までを対象とすることから、情報そのものの取り扱いから、通信、放送、電波、さらには知財、文化活動までをも包含する。その中でも、近年の携帯電話、インターネットなどの通信の発達の影響が非常に大きいことから、通信をキーワードとして、情報通信政策の概要を取り扱う。なお、最新の政策動向及びトピックス（東日本大震災の影響を含む。）についても、出来る限り、反映することとしたい。
      従って、情報通信入門としての位置づけともなるが、政策論として取り扱うことから、特に将来的に情報通信関係で働こうとする方々にとって、政策的な基礎知識や産業界の諸課題なども理解できるので有益であろう。
  source: https://ocw.kyoto-u.ac.jp/course/576/
