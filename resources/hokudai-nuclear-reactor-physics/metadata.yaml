name:
  ja: 原子力人材育成事業（*） 機関連携強化による未来社会に向けた新たな原子力教育拠点の構築「原子炉物理学」
description:
  ja: 原子炉物理学の基礎から応用までを全13回で扱う教材である。中性子束や断面積、核反応、核分裂、拡散方程式、臨界、四因子公式、減速、動特性、反応度、燃焼へと進み、最後に原子炉物理の応用を扱う。
quotedDescription:
  text:
    ja: "原子炉物理学\n \n「原子炉物理学」の教材は全て制限資料のライセンスで公開しています。\n \n第1回　導入と基礎知識\n \n第2回　中性子束と断面積\n \n第3回　核反応概論、輸送断面積\n\
      \ \n第4回　核分裂反応\n \n第5回　拡散方程式の導入\n \n第6回　拡散方程式の解\n \n第7回　原子炉の臨界\n \n第8回　四因子公式\n \n第9回　中性子の減速\n \n\
      第10回　原子炉の動特性\n \n第11回　原子炉の反応度\n \n第12回　燃焼\n \n第13回　原子炉物理の応用"
