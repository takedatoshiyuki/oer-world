name:
  ja: 特別プログラム オープン教材の作成・活用による実践的原子力バックエンド教育 「専門教育コース・講義」 （2014）
description:
  ja: 原子力バックエンド分野の人材育成事業の一環として、専門教育コースの講義を扱う。講義に加えて、実験やフィールド実習をオープン教材として共有することを目指す構成が示されている。
quotedDescription:
  text:
    ja: '国際原子力人材育成イニシアティブ事業

      機関横断的な人材育成事業

      本事業では、原子力バックエンド分野において、基礎教育、実践的な専門教育、国際教育の３つを行うことで、原子力バックエンド分野の研究開発を国際的にリードする人材を教育・育成を図ることを目的といたします。

      専門教育コースは、国内の専門家による１～２単位に相当する体系?てた専門教育・講義と、得られた知?の実践を目的とした実験、フィールド実習の受講および?学会の参加ができるコースです。?これらのうち講義、実験、フィールド実習は、基礎教育と同様に可能な限りオープン教材化して後々まで共有できる専門教育システムを構築します。

      国際原子力人材育成イニシアティブ事業'
