name:
  ja: 資源生物科学概論Ⅳ
description:
  ja: この講義は、土壌を生産基盤や生態系の一要素として捉え、栽培環境や雑草管理を含む農業環境の諸問題を扱う。あわせて、植物の病害、線虫や菌類による被害、昆虫の行動と生理、総合的害虫管理など、植物保護に関わる内容を講義資料で示す。
