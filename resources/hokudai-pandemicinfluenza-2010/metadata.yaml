description:
  ja: 鳥やブタに関わるインフルエンザと、パンデミックをめぐる話題を扱う講演である。講演後には、高病原性鳥インフルエンザウイルス、ワクチン、新型インフルエンザウイルスなどについての質疑応答が行われている。
quotedDescription:
  text:
    ja: 10月31日(日)には、人獣共通感染症リサーチセンター長である喜田宏教授が「鳥、ブタ、そしてパンデミックインフルエンザ騒動を斬る」と題した講演を行いました。約６０名の一般市民の方々のご参加を頂き、講演終了後には、稚内大沼のカモ糞から分離された高病原性鳥インフルエンザウイルスをはじめ、ワクチン、新型インフルエンザウイルス等、多岐にわたる質問があり、喜田教授が回答しています。
