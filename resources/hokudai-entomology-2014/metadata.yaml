name:
  ja: バイオミメティクス市民セミナー ミメティクスおもしろネタの源としての昆虫分類学、形態学（2014）
description:
  ja: 昆虫の形や行動の多様性を題材に、分類学・形態学・系統学の観点からその特徴を扱う講義である。未知の昆虫の多様性に関する例として、雄で交尾器が逆転した昆虫と、昆虫の跳躍行動の進化を取り上げる。
quotedDescription:
  text:
    ja: 昆虫は形や行動の多様性の宝庫である。これまでに命名された真核生物の半数以上を昆虫が占めるが、その種多様性の解明度は１０分の１程度とも見積もられており、われわれが目にしたことも無い未知の形を備えた昆虫がまだ沢山いることも間違いない。昆虫分類学者はその多様性の発掘に力を注ぎ、また系統学者・形態学者は、ミメティクスネタの宝庫とも言える多様性を、工学者とは違う観点で見つめている。昆虫の未知の多様性がごく最近明かされた例として、雄で交尾器が逆転した昆虫について、そして形態・系統学的観点からの昆虫の形の研究例として、昆虫の跳躍行動の進化について紹介する。
  source: https://ocw.hokudai.ac.jp/lecture/entomology-2014
