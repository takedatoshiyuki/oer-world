name:
  ja: 発達障害治療学及び実習
description:
  ja: 'この教材は、発達期に障害のある子どもを対象にした作業療法の理論と実践を扱う。講義では実際のビデオをもとに障害特性を学び、実習では評価、課題整理、作業療法計画の立案までを進める。


    公開教材には課題資料と講義ノートが含まれており、広汎性発達障害の評価と治療も扱う。対象は医学部保健学科3年で、後期開講の授業である。'
quotedDescription:
  text:
    ja: 本授業は，18 歳未満の発達期になんらかの障害をもった子どもたちが乳幼児期から成人，老年期に至るまでの作業療法の治療理論と技術を学習し，身につけることを目指しています．病気や事故から生じた障害と共に，子どもたちが自分らしく社会と共生しながら，自己実現できるような支援体制の中で，子どもたちにとって意味のある作業活動(例えば，日常生活活動，遊び，趣味，学習，買い物，レジャーなど)を手段として作業療法を実施します．また，さまざまな障害により身体機能，心理機能が環境との関係性から上手く機能しなくなる要因を科学的に分析し，機能を回復する治療や発達を促す援助，回復した機能をベースにしてより良く環境に適応するための活動や参加の方策を考え出すための理論と技術を学びます．講義では，発達障害をもつ子どもたちの実際のビデオをもとに疾患ごとに障害の特性を学びます．実習では発達障害をもつ子どもの活動制限の様子をビデオから理解し，学生ひとりひとりが適切な評価を実施します．そして実習後のディスカッションを通じて，治療または支援が必要となる課題を整理し，作業療法計画(治療計画や支援計画)を立案するまでを学びます．つまり，作業療法学が実践学であることを知るための扉を叩く授業といえます．
