quotedDescription:
  text:
    ja: 'ヨーロッパの国々の間で、政治体制や政治制度、政策の共通性や差異はどのようにして生まれたのだろうか。また現代のヨーロッパ政治は流動期にあるが、その源流はどこにあるのだろうか。本講義では、①
      民主主義制度、② 政党と政党システム、③ 福祉国家を中心として 20 世紀以降のヨーロッパ政治を検討し、これらの問題について考えることを目的とする。また時々、ヨーロッパ政治に関わる映画なども取り上げ、多面的な形で理解を深める。

      上記の ①②③ を中心に、現在のヨーロッパ政治の確立や安定化の歴史、またその展開や制度に関し、ヨーロッパ諸国間でどのような共通性や違いがあったのかなどについて理解する。また単に政治史の知識を獲得するだけでなく、歴史・比較の理論や概念についても理解を深め、それらを用いて自ら関心を持つ西洋政治史上の事象を分析する能力を身につけることも目標とする。'
