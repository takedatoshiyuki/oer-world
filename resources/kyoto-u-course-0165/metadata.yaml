name:
  ja: 防災研究所公開講座 第24回「“災害のメカニズムを学び、防災対策に役立てよう!”－近年多発する豪雨災害－」
description:
  ja: 豪雨の発生メカニズムと、それに伴って起こる洪水や土砂災害の事例を扱う講座である。あわせて、総合的な防災計画に関する研究成果を紹介し、今後の防災・減災のあり方を議論する内容である。
quotedDescription:
  text:
    ja: '講座内容

      気象庁アメダスの統計資料によると、最近の30年間で時間雨量50mm、80mm以上の雨が降った回数は明らかな増加傾向を示しています。このため、豪雨による洪水などの水象災害や、崩壊・土石流などの土砂災害のリスクは年々増加していると言えるでしょう。実際、平成23年には台風12号によって、わずか3日の間に日本の年平均降水量に匹敵する約1,700mmもの記録的な雨が降り、紀伊半島に大きな災害をもたらしました。また、昨年の7月には九州北部で集中豪雨による大規模な災害が、そして7、8
      月にも京都府で洪水や土砂災害が発生したことは記憶に新しいところです。本公開講座では、これらの背景を踏まえ、第一線で活躍する専門家が、豪雨の発生メカニズムやそれに伴う災害の事例、さらに総合的な防災計画に関する最新の研究成果を紹介するとともに、今後の防災・減災のあり方について議論します。'
  source: https://ocw.kyoto-u.ac.jp/course/165/
