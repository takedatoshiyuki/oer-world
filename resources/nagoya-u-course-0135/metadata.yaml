name:
  ja: 社会システム情報学特論
description:
  ja: この教材は、社会システムに関わる情報科学・情報学の論点を扱う講義資料群である。知識管理やコミュニケーションサイエンス、情報学の構想、情報科学の哲学的基礎などの資料に加え、交通システム、地域プロジェクト、高齢化社会とITの活用に関する参考資料も含む。
quotedDescription:
  text:
    ja: 知能は人固有のものではなく、環境が知能を持つ時代が到来している。知能社会は総ての「もの」が相互協同的に創生し、共生していくメカニズムに支えられ、今後益々我々の社会を豊かに、知的に支えてくれる。このような認識の基に人の活動、人と人とのインタラクション、人と環境の相互作用、環境の仮想化などの視点から情報科学、情報学の果たす役割を明らかにし、広く、かつ深い視点を有した知識人を育成する。
