name:
  ja: 非線形有限要素法特論
description:
  ja: 有限要素法の基礎から応用までを、演習とプログラミング演習を交えて扱う講義である。解析の全体像を見渡せるように構成されており、基礎と応用の両方を学ぶ内容になっている。
quotedDescription:
  text:
    ja: 今日、有限要素法は工業製品の設計において必須のツールであり、完成度の高い汎用プログラムも多数販売されている。しかしながら、これらはブラックボック スとして使うにはあまりに複雑で、使用するエンジニアは、得られた答えが正しいかどうかを見極める目を要求される。また、汎用プログラムが対応できないよ
      うな複雑な現象を解析するには、自らプログラミングする必要がある。本講義では、有限要素法の基礎から応用までを、演習および、プログラミング演習を交え て解説し、有限要素法の全体像が概観できるような構成とした。有限要素法を専門とする学生のみならず、設計実務に就きユーザーとなる学生も、履修すること
      をすすめる。
