description:
  ja: 環境問題を対象に、複数の側面から一つの問題を検討し、その相互関係を考える内容である。あわせて、環境問題を地球と社会にまたがるシステムとして捉える視点を扱う。
quotedDescription:
  text:
    ja: 環境問題については多くの学生諸君が興味関心を持っているものの、マスメディアからの情報だけでは正確な理解を得られないことが多い。環境問題の「常識」をひとつひとつ検討しながら、いろんな側面から一つの問題を考えること、一つの問題は他の問題と関連しあっているものととらえること、環境問題とは地球と社会にまたがる一つのシステムの問題であるという見方ができること、を目標とする。
