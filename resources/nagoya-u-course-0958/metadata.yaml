quotedDescription:
  text:
    ja: この授業では、教員がフィールドワークの方法を説明するだけでなく、学生がチームを組んで実際に行動する時間を重視しています。授業の前半は講義にあて、後半はチームに分かれてグループワークに取り組みます。グループワークでは、各グループに対して、インタビューの計画や質問の仕方などの具体的なスキルを講師が直接指導します。学生は、2種類のインタビューを自分たちで計画し実施します。一つは、家族や親しい友人に対して行うライフストーリーを中心とした「非構造化インタビュー」、もう一つは、特定のテーマに沿った職業人に対する「半構造化インタビュー」です。これらの実践を通じて、学生はフィールドワークの疑似体験を積むことができます。最終的には、インタビュー結果を基にしたレポートや論文を作成する力を養うことが、この授業の最大の目標です。
  source: https://ocw.nagoya-u.jp/courses/0958-%E3%83%95%E3%82%A3%E3%83%BC%E3%83%AB%E3%83%89%E3%83%AF%E3%83%BC%E3%82%AF%E5%85%A5%E9%96%80-2024/
