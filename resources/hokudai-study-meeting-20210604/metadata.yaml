name:
  ja: オンライン勉強会「米国におけるコロナ禍のオープンエデュケーションと展望」（2021.06.04）
description:
  ja: 米国における新型コロナウイルス感染拡大が教育現場にもたらした変化を概観し、その中で高等教育機関と中等教育におけるオープンエデュケーションの取り組みを取り上げる勉強会である。発表者・共有画面・ギャラリービューなど、複数の映像クリップを切り替えて視聴できる。
quotedDescription:
  text:
    ja: '新型コロナウイルスの感染拡大は、世界の教育現場に著しい変化をもたらしました。本勉強会では、オープンエデュケーションセンターの職員として勤務のご経験があり、現在もオンライン教育やオープン教材開発の研究を続けている永嶋知紘氏（カーネギーメロン大学
      Ph.D. in Human-Computer Interaction）にご登壇いただき、米国におけるコロナウイルス感染症による教育現場の変化を概観していただくとともに、高等教育機関や中等教育の現場でのオープンエデュケーションに関する取り組みを紹介していただきました。

      この動画の再生プレイヤーでは、発表者・共有画面・ギャラリービューなどの複数のクリップから視聴画面を選択できます。カーソルを再生プレイヤー上にかざすと画面右側に操作ツールが表示されますので、お好きな画面表示をお選びください。それぞれのツールの機能は、上側がクリップの変更・位置交換、中央が複数クリップの表示方法の変更、下側が複数クリップからのクリップ選択機能です。'
