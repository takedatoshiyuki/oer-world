name:
  ja: フィンランド語文法
description:
  ja: この教材は、フィンランド語の文法の初歩を学ぶ講義資料である。名詞や動詞の語形変化をはじめ、格の用法、疑問文・否定文、存在文・所有文、不定人称受動文までを扱う。講義ノートや配布資料が公開されている。
quotedDescription:
  text:
    ja: '言語学は人間の言語のしくみを考える学問ですが、言語のしくみを解明するためには、できるだけ多くの、しかも異なるタイプの言語を知っておく必要があります。なぜなら、世界中の言語は何らかの共通性を持っているのですが、それが何であるのかを理解するためには、言語の多様性についての認識が欠かせないからです。この講義では、フィンランド語の文法の初歩を学びます。フィンランド語はヨーロッパで話されている言語ですが、英語やドイツ語、フランス語、ロシア語など他のヨーロッパの言語とは著しく異なる特徴を持っています。世界の多様な言語の一つとして、フィンランド語の特徴を知ることにより、人間の言語の多様性や普遍性について考えるきっかけにしたいと思います。

      フィンランド語は、英語に比べると、はるかに語形変化の多い言語です。そのため、最初は大変に思うかもしれませんが、語形変化には一定のパターンがあり、そのパターンさえ覚えてしまえば、例外はほとんどありません。文法事項としては、名詞や動詞の語形変化の他、格の用法、疑問文や否定文の作り方、存在文や所有文、不定人称受動文の用法などを学びます。'
  source: https://ocw.nagoya-u.jp/courses/0122-%E3%83%95%E3%82%A3%E3%83%B3%E3%83%A9%E3%83%B3%E3%83%89%E8%AA%9E%E6%96%87%E6%B3%95-2008/
