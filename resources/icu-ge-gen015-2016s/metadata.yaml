name:
  ja: 'N1: Invitation to Astronomy Ｎ1：天文学への招き'
description:
  ja: 宇宙の特徴や構造を、最新の天体観測と理論的研究に基づいて扱う講義である。太陽系から恒星、銀河、遠方宇宙へと話題を広げ、宇宙論や人間と宇宙の関係まで踏み込む。
quotedDescription:
  text:
    ja: 'In this course, we scientifically discuss what the universe is. We learn the feature and the
      structure of the universe, which are discovered through the latest observational and theoretical
      researches of astrophysics. Why can we understand the world at such great distant where we cannot
      visit in actual? That is because the universe also follows the universal laws of nature. Considering
      this fact, we understand the scientific providence of the universe and learn the past, the present,
      and the future of the universe. Finally, we attempt to discuss why we human being could come into
      this universe.

      宇宙とはどのような存在であるかを科学的に考察する．まず，最新の天体観測や理論的研究によって明らかにされつつある宇宙の姿を学ぶ．私達が，実際に行くことができないような遠方の世界のことを把握できるのは，この宇宙も共通の自然科学の法則に従っているからである．その事実に基づいて，宇宙の摂理を理解し，宇宙の過去・現在・未来について学ぶ．その上で，なぜ私達がこの宇宙に誕生したのかを議論する．

