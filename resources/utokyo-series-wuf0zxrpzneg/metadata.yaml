name:
  ja: 労働法（2011年度）
description:
  ja: 雇用をめぐる身近な事象を手がかりに、それらが日本の雇用システムでどのように位置づけられ、法的にどう捉えられるかを検討する講義である。あわせて、雇用システムの変化を背景に、労働法の役割を諸外国との比較も交えながら考える。
quotedDescription:
  text:
    ja: 労働法は、マスコミでしばしば目にするような雇用をめぐる身近な事象（例えば、内定取消、派遣切り、名ばかり管理職、セクハラ・パワハラ、ワーク・ライ フ・バランス、過労死・過労自殺、リストラ、春闘など）を対象としている。本講義では、こうした卑近な事象が日本の雇用システムのなかでどのように位置づ
      けられ、そして法的にはどのような問題として把握されるのかの検討を通じて、労働法の体系的理解へと誘う。また、雇用システムが大きく変化しつつある現 在、労働法がいかなる役割を果たすべきかという立法政策上の課題についても、諸外国との比較を交えて言及し、学生諸君と共に考えたい。
