name:
  ja: 'S2: Environmental Studies S2：環境研究 2014S'
description:
  ja: 環境研究を、自然科学・社会科学・人文科学の複数の視点から扱う講義である。自然と人間の関係に加え、環境汚染、地球温暖化、生物多様性、環境と社会の変化、ICUキャンパスの事例、日常生活に関わる環境問題を取り上げる。最後にはポスターセッションも含まれる。
quotedDescription:
  text:
    ja: 'This course seeks to promote the sort of environment literacy necessary for cultivation of responsible
      global citizens. It seeks to help students understand the basic relationship between humans and
      the natural environment and introduces pressing issues, ranging from environmental pollution, global
      warming, conservation of biological diversity, and extending to the relationship between the environment
      and societal changes. It encourages students to envision what they can do to promote environmental
      health and sustainability.

      この科目は、地球市民のための環境リテラシーである。まず自然と人間との基本的関係について考え、人間の活動と密接に関係する環境汚染、地球温暖化、生物多様性の保全などの差し迫った自然環境問題、さらに、環境と社会の発展との関係について総合的に考察する。それによって、学生が、責任ある２１世紀の地球市民として健全な自然環境と持続可能な世界を造り出すために何ができるかを考える。

