name:
  ja: 応用行動学講義-II-産業・組織の心理学
description:
  ja: 大学卒業後に職業や組織に入る場面を念頭に、産業・組織に関わる心理学の知見を扱う講義である。組織で起こる現象を心理学の視点から検討し、その理解を深めることを目的とする。
quotedDescription:
  text:
    ja: 大学を卒業後、多くの人は何らかの職業に就き、組織に参入することになる。このため、産業・組織におけるさまざまな心理学的知見について、学んでおくことは有用である。こういった視点を持つことで、実際に働き始めた後の組織現象の理解につながると考えられるからである。本講義では産業・組織について心理学的知見から検討し、理解を深めることを目的とする。
