  ja: 本シンポジウムは、哲学、自然科学、社会科学、神学などの研究を結びつける場として企画されている。自然や他文化・他宗教との調和の中で生きる人間の知恵としてのEco-Sophiaを手がかりに、文明の未来をめぐる議論を扱う。
