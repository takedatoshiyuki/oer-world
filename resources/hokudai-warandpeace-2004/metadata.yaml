name:
  ja: 全学教育 戦争と平和 – 政治経済学的アプローチ（2004）
description:
  ja: 国家を主体とする国際関係の構造と変動から、戦争と平和の原因を考察する講義である。あわせて、国際関係の特質をめぐる3つの立場と、国際関係の中での政治と経済の関係を扱う。さらに、同時多発テロや国際緊張、安全保障問題に対する日本のかかわり方を検討する。
quotedDescription:
  text:
    ja: '１．戦争と平和の原因を、国家を主体とする国際関係の構造と変動から考察し、平和の実現と維持をリアルに追求する社会科学的な考え方への案内を行う。

      ２．国際関係の特質をめぐる主な立場である（１）ホッブズ的無政府社会、（２）自由貿易平和主義的調和社会、（３）グロチウス的秩序社会の３者の対立と関係を理解することと、国際関係の中での政治と経済のダイナミックな関係を理解することとを通じて、国際関係をみる基本的視点を養う。

      ３．同時多発テロやさまざまな国際緊張、安全保障問題への日本のかかわり方を主体的に検討する知的基盤を養う。'
