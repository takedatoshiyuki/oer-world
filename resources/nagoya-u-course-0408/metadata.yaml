description:
  ja: 野外観察と顕微鏡観察を軸に、岩石学・構造地質学・堆積学の実習を行う。あわせて、数回の野外実習と室内実験を通じて、測定したデータの解析法を扱う。公開教材として講義ノートがある。
quotedDescription:
  text:
    ja: 野外・顕微鏡観察は岩石学・構造地質学・堆積学において重要な位置を占めている。本実験では、それぞれの分野を中心とした実習を行う。数回野外実習も行い、室内実験でデータの簡単な解析法を修得する。本授業では、学生が自分で野外と室内で測定したデータを解析することによって広い意味での岩石学実験法の基本を身につけ、この分野の理解を深めることが目標である。
