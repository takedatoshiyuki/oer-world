name:
  ja: 物理環境設計学
description:
  ja: 室内温湿度や温熱環境の評価法を基に、温熱・空気環境の設計で必要となる室内設計条件の考え方を扱う講義である。建物の用途ごとの条件を踏まえ、空調設計や気流分布設計に用いる室内熱負荷や室内気流分布の予測・評価方法まで解説する。さらに、予測・解析技術の適用性や運用事例も扱う。
quotedDescription:
  text:
    ja: 室内温湿度の動的評価，室内温熱環境の評価法，温熱環境の設計法などを基に，温熱・空気環境の設計に必要となる室内温湿度や空気清浄度，室内気流分布などの室内設計条件の 考え方を各種の用途の建物について解説し，それを基に空調設計，気流分布設計などを行うための室内熱負荷や室内気流分布の各種の予測・評価方法についての知識と，現在行われているそれらの予測・解析技術の実際の空間設計に対する適用性・運用事例と将来の
