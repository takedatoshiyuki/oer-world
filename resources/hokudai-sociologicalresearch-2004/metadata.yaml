name:
  ja: 学部専門教育 社会学研究法 質的社会調査の方法と実際（2004）
description:
  ja: 社会学における分析の考え方を手がかりに、質的分析に関わる研究法を扱う講義である。学部段階の社会調査や卒業論文で用いられる質的調査について、基本的理解を目指す内容になっている。
quotedDescription:
  text:
    ja: '社会学における分析とは何か。とりわけ質的分析に関わる研究法について考える。

      社会学の学部段階における卒業論文では、殆どが質的調査を行う。しかしながら、突撃調査の域を出ていないものが多い。社会調査実習においては量的調査の分析法を習得するわけであるが、質的調査の授業科目はない。そこで、この授業科目において質的調査の基本的理解を目指す。'
  source: https://ocw.hokudai.ac.jp/lecture/sociologicalresearch-2004
