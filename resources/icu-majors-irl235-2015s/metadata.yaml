name:
  ja: Politics and International Relations in Europe 欧州の政治と国際関係
description:
  ja: この講義は、EUの制度、域内の統合政策、対外関係を扱う。授業にはEU機関や加盟国に関わるゲスト・スピーカーの講演が含まれ、学生の研究報告が行われる場合もある。講義内容には、EUと日本の関係、ドイツとEU、地政学的混迷の時期のEUが含まれる。
quotedDescription:
  text:
    ja: 'This course includes institutions of the EU, its integration policy as well as its external relations.
      Guest speakers from EU Institutions and its member-states will be invited. Students may present
      their research outcome.

      EUの仕組みを概説し、EU域内の統合政策およびEUの対外関係を講述する。EU機関およびEU加盟国など、EUに直接関わっているゲスト・スピーカーによる講演も授業に組み込む。受講者数にもよるが、学生の研究報告も行う。

      Contents of Lectures

      3

      Lectures / 3 Videos

      May 21

      EU-Japan Relations EUと日本の関係

      Guest Speaker : Ambassador of EU to Japan 駐日EU大使 H.E. Mr.Isticioaia Budura

      May

      28

      Germany and EU ドイツとEU

      Guest Speaker :

      University of Bonn ボン大学教授 Professor Dr.Ludger Kühnhardt

      May 28

      EU in Times of Geopolitical Turmoil 地政学的混迷の時期のEU

      Guest Speaker : University of Bonn ボン大学教授 Professor Dr.Ludger Kühnhardt'
