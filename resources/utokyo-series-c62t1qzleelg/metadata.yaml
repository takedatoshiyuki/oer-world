name:
  ja: 規制政策
description:
  ja: 政府による民間活動の規制を、経済学の枠組みで分析する講義である。前半では料金規制やインセンティブ規制、情報の非対称性を含む基礎理論を扱い、後半ではエネルギー、通信、石油、運輸などの産業別規制と環境・安全規制を検討する。
quotedDescription:
  text:
    ja: '政府による民間活動の規制に関して、規制の意義、方法、規制形成のメカニズムなどを学び、経済学的分析を行う。経済的規制と社会的規制の双方を取り扱う。 講義は大きく２つの部分に分かれる。

      第１部では、基礎となる経済理論を概観し、この分析道具を駆使して、 規制政策の背後にある基本的な原理を経済学的に明らかにする。ここで扱うトピックは、混雑料金、ピークロード料金、 ラムゼイ料金、規制の政治経済学、公正報酬率規制、プライス・キャップ規制とインセンティブ規制、情報の非対称性のもとにおける規制政策である。
      第２部では、エネルギー、通信、石油、運輸産業などの具体的な規制産業を取り挙げて、なぜそもそも規制が必要か、規制がどのような経済効果を持つか、現行の規制の問題点は何か、 望ましい規制の体系はどのようなものであるか等を解説する。更に産業横断的な環境規制、安全規制の問題も取りあげる。'
