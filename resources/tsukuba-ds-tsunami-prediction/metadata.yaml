  ja: 津波高予測を題材に、データサイエンスと高度計測機器、大規模シミュレーションの関係を扱う講義である。Society5.0やデータ駆動型社会に向けて、これらの要素がどのように結びつくかを学ぶ。
quotedDescription:
  text:
    ja: 昨今、IOTで全ての人とものが繋がり、新たな価値を生み出すSociety5.0によるデータ駆動型社会に向けた取り組みが様々な分野で起きつつあります。本講義では、身近な話題として、津波高予測を取り上げます。この題材を通して、高度計測機器、大規模シミュ−レーションにデータサイエンスが融合することで、どうやってデータ駆動型社会実現が可能になるのかを学んでもらえればと思います。
