name:
  ja: 農業機械学実験Ⅱ
description:
  ja: 植物、農産物、土壌を対象に、工学的な計測手法を実習を通して学ぶ講義である。実験手法の説明に加え、実験計画、測定、データ処理、レポート作成までの一連の手順を扱う。公開教材には、乾燥や脱ぷ、光合成の実験、AVRマイコンによる制御、マシンビジョン、レーザー距離計による非接触計測の資料が含まれる。
quotedDescription:
  text:
    ja: '授業の特色

      植物，農産物，土壌といった複雑な対象物に対して，工学的な各種の手法を用いて計測を行うことにより，農業，生物，土壌等と機械・計測との接点についてその基礎を実習を通して学び，農業生産を支える工学技術の基本について体験することができる．

      授業の紹介

      農業機械学が取り扱う対象物に関して実験手法を講述し，基礎的な実験を通して実験計画，測定，データ処理及びレポート作成などの一連の実験手順を習得する．'
  source: https://ocw.kyoto-u.ac.jp/course/676/
  note: 京都大学OCW 「講義概要」より（同サイトの利用条件に基づく転載）
