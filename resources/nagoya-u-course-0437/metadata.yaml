name:
  ja: 産業社会と企業
description:
  ja: 企業や市場の成立と変化を、古代から現代までの歴史の流れの中で扱う講義である。市場経済の発展が生んだ問題として、公害や格差にも触れ、現代社会を複数の側面から考える視点を扱う。
quotedDescription:
  text:
    ja: 現代の経済では企業が中心的な役割を果しており、市場経済や資本主義（資本制）経済などと呼ばれている。しかし、人類の誕生時から企業や市場があったわけではないし、これらが誕生してからも、その中身は時代を通じて変化してきた。また、企業や市場の発展によって多くの問題が解決されてきた半面、公害や格差のように新たに深刻化した問題もある。この講義では、企業や市場の誕生・発展プロセスを歴史的に学ぶことで、現代社会をプラスとマイナスとの両面から考察できる姿勢を養うことを目指す。
