name:
  ja: 第73回人環国際交流セミナー “Human and Animal Wisdom-An Intercultural Perspective”「人間と動物の叡智 – 異文化間比較の観点から」
description:
  ja: 古代ヨーロッパとアジアの思想・文学に見られる動物表象を手がかりに、人間の知恵のあり方を考察する講義である。Aesop’s Fables、『荘子』、Hegelの「ミネルヴァの梟」への言及を通して、動物の知恵の描かれ方と、それが人間理解に与える含意を扱う。
quotedDescription:
  text:
    ja: '概要

      Philosophical and literary works in the classical European and Asian traditions have repeatedly
      drawn on animal representations when deliberating about the nature and scope of human wisdom. Departing
      from a close reading of selected stories from Aesop’s Fables, Hegel’s reference to the Owl of Minerva
      and bird Peng in the Daoist classic Zhuangzi, the paper reconstructs diverse depictions of animal
      wisdom and their implications for a revised conception of being human. The capacity of animals to
      know intuitively, to undergo transformation processes and to effortlessly move in their natural
      habitat calls into question the pretentiousness behind human claims to absolute knowledge. One major
      function of imaging animal wisdom, the paper demonstrates, is to bring about an often humorous switch
      of perspective. It allows for the cultivation of humility and the capacity of honoring forms of
      life one does not completely understand. （講義は英語で行なわれました）'
