name:
  ja: 土曜市民セミナー 男らしさの神話と実話（2013）
description:
  ja: 男女の役割の変化や、「男」について見直す議論を背景に、理想化された男性像と現実の男を検証する講義である。英米文学作品やハリウッド映画を手がかりに、男性像をめぐる考え方を扱う。神話そのものを紹介する内容ではなく、事前準備は必要ないとされている。
quotedDescription:
  text:
    ja: 女性の社会進出が進み、男女の役割にも変化が起きています。男女平等を求める一方で、おとなしい男性を草食系と揶揄したりするのは好例でしょう。こうしたなか、最近では「男」について考え直す議論が盛んに行われています。本講義では、まずこれらの背景を説明し、それから文学作品や映画などを紹介したいと思います。講師の専門分野上、英米文学作品やハリウッドの映画作品が中心になると思います。が、事前準備は必要ありません。また、本講義では、男性が登場する神話を紹介するわけでもありません。ご承知おき下さい。それでは、「理想化された男性像」と「現実の男」について検証し、今後のオトコについて考えましょう。
  source: https://ocw.hokudai.ac.jp/lecture/manhood-2013
