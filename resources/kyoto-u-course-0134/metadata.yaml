name:
  ja: 農村土地利用計画論
description:
  ja: 農村計画における土地利用計画を扱い、京都府下を対象とした土地利用上の諸問題や課題を取り上げる。あわせて、景観や重層性に対応した総合計画、市町村総合計画と土地利用規制、住民参加、緊張モデル、神出方式などの計画方法を示す。
quotedDescription:
  text:
    ja: '授業の特色

      農村計画において、土地利用秩序の形成や景観形成面から土地利用計画の果たす役割は大きい。しかしその実効性面で多くの問題を抱えている。この授業では、土地利用計画を有効ならしめる大きな要素としての、住民参加や計画体系、計画方法について述べる。

      授業の紹介

      （１）京都府下を対象に土地利用上の諸問題と諸課題

      （２）重層性に対応した総合計画の必要性

      （３）総合計画における土地利用計画の位置づけ

      （４）計画づくりにおける住民参加の有り様

      （５）計画体系としての緊張モデルの紹介と適用例

      （６）地区総合計画の計画方法としての神出方式の紹介と適用例

      （７）ヨ−ロッパの土地利用計画の紹介'
