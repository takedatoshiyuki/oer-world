name:
  ja: 全学教育 社会体験ワークショップ（2022）
description:
  ja: 北海道大学が2022年度に開講した「全学教育 社会体験ワークショップ」の教材で、経済学部が担当する。北海道を代表するゲスト企業等10社との対談を通じて、実社会の課題や展望を扱う授業であり、公開資料は講演動画と講義資料の一部からなる。
quotedDescription:
  text:
    ja: '北海道を代表するゲスト企業等10社との対談形式で実社会の課題や展望についてディスカッションを行う「社会体験ワークショップ」を2022年度から開講しました。

      >> 取組紹介動画（北洋銀行YouTubeチャンネル）

      オープンコースウェアでの公開内容は、講演動画3社（北大生とのディスカッションを除く）、講義資料7社と授業の一部ですが、各企業等の取組やゲスト講師の体験談（これまでのキャリアや学んだこと）を中心に、道内企業等の魅力を実感できる内容です。

      ぜひご覧ください！'
