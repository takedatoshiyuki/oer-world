  ja: 幾何学 II
description:
  ja: 位相空間を区別するための基本的な道具として、（特異）ホモロジー群と基本群を扱うトポロジーの入門講義である。ホモロジー群については、定義よりも基本的な性質を先に見て、存在を仮定したうえで具体例の計算を行う。群と位相空間の初歩的な事項を前提にする。
quotedDescription:
  text:
    ja: トポロジーの入門講義。幾何学の大切な目的の一つは、与えられた二つの図形の違いを明確に述べることである。この講義では、図形すなわち位相空間を区別す るための最も基本的な道具である（特異）ホモロジー群と基本群を解説する。積分路の抽象化であるホモロジー群は、定義それ自身よりもマイヤー=ヴィエトリ
      ス完全列などの幾つかの基本的な性質の方が重要である。そこで、定義を行う前に、幾つかの基本的な性質をみたすものとしてホモロジー群の存在を仮定し具体 例の計算を幾つか行う。群と位相空間についての初歩的な事項は予備知識として仮定する。
