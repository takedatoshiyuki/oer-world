name:
  ja: Paving over arbitrary MASAs in von Neumann algebras
description:
  ja: Kadison–Singer 問題を出発点に、von Neumann 因子の MASA に対する一般化された paving 性質 so-paving を導入する講義である。so-位相による近似の考え方を用い、B(H)
    の diagonal MASA との関係も扱う。さらに、任意の因子の任意の MASA で so-paving が成り立つという予想と、その一部のケースでの確認を述べる。
quotedDescription:
  text:
    ja: 'Course Description

      Motivated by an intriguing claim in Dirac’s 1947 book on “Quantum Mechanics”, Kadison and Singer
      have asked the question of whether any pure state on the diagonal maximal abelian subalgebra (MASA)  \(
      D \) of \(B(H) \) extends to a unique state on \(B(H) \). They also showed that this unique pure
      state extension property is equivalent to norm paving over \( D \) for operators in \(B(H) \). The
      Kadison–Singer paving problem has been recently solved in the affirmative by Marcus–Spielman–Srivastava.

      In these lectures, we will introduce a general paving property for a MASA \( A \)  in a von Neumann
      factor \( M \)  , called so-paving, involving approximation in the so-topology, rather than in norm,
      but which coincides with norm-paving in the case \( D \subset B(H) \)  . We conjecture that so-paving
      holds true for any MASA in any factor. We check the conjecture in many cases, including singular
      and regular MASAs in hyperfine factors. Related problems will be discussed.'
