name:
  ja: Introduction to Indian Culture and Society（STSI）
description:
  ja: インドの社会と文化を、文化・宗教・歴史・政治経済・社会問題まで含めて広く扱う講義である。衣食住や建築、芸術、スポーツ、自然との関わりに加え、日印関係の歴史や文化比較、さらにヒンディー語の基礎文法と表現も取り上げる。
quotedDescription:
  text:
    ja: "【Outline】\n \n本授業では、インドの社会と文化についての基礎知識を学びます。インドの多様な文化、宗教、歴史、政治経済、カースト問題を含む社会問題、インド人のものの考え方まで、インドを包括的に紹介します。これらの学びの中から、「なぜインドからは世界的な人材が出るのか」、また「なぜインド人はバイタリティに溢れているのか」の答えが浮かびあがってくるでしょう。\n\
      \ \nまた、本講座は以下の特徴を備えています。\n・インドの衣食住、建築、芸術、スポーツ、自然との付き合い方等インド文化の多様性を「楽しむ」という視点も取り入れています\n \n・日印関係の歴史と日印文化比較の学びによって、今後の交流促進に必様なインド文化理解だけではなく、日本文化のメタ認知も深めることができます\n\
      \ \n・ヒンディー語の基礎文法と、インド人と交流するのに大変役に立つヒンディー語表現も学べます"
  source: https://ocw.hokudai.ac.jp/lecture/introduction-to-indian-culture-and-society
