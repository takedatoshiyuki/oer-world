description:
  ja: 人間の生涯にある誕生・成長・成熟・衰退・死の循環を手がかりに、自然現象や社会にも見られる変化のあり方を考える講義である。説明文では、そのサイクルを理解することの意味を、人間・自然・社会を考える観点から扱うことが示されている。
quotedDescription:
  text:
    ja: "誕生―成長―成熟―衰退・死。このサイクルは人間にあてはまるだけでなく、自然に関わるさまざまな現象に、あるいは社会そのものにもあてはまります。そのサイクルを理解することは、人間や自然、社会を考えるうえで重要なことは言うまでもありません。\
      \ \n  そのサイクルの中で、もっとも我々の注目をひいてきたのは誕生と成長でしょう。人の誕生はもっとも劇的で、成長は希望に満ちています。あるいは社会や経済の成長は人に希望を…"
