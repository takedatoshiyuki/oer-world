description:
  ja: 民族、民族主義、国民国家形成、多数派・少数派関係など、民族に関わる概念と論点を扱う講義である。講義ノートには、国籍と市民権、マスメディア、言語、先住民族と開発、事例研究などの項目が含まれる。
quotedDescription:
  text:
    ja: This course will deal with ethnicity-related issues. Starting from key concepts (ethnicity, nationalism,
      etc.), it will cover various topics and cases of nation-state building and majority-minority relations
      mainly from a sociological viewpoint. Students may be requested to make presentations on case studies
      depending on their research interests.
