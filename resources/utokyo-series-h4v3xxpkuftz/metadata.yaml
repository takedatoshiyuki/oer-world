description:
  ja: この講義は、日常で目にする確率や割合の数値を手がかりに、統計が過去のデータをどう扱い、未来の見通しにどう結びつくかを考える内容である。さらに、科学実験や経済・社会現象の分析で大量のデータを分析する手法にも触れる。
quotedDescription:
  text:
    ja: "新聞を開いてもテレビを見ても、視聴率、降水確率、合格率、投票率、経済成長率というようにパーセントで表された数字をよく目にします。これは過去のデータの評価であり、過去から未来を予測しようとする数値でもあります。最近では科学実験においても経済や社会現象の分析においても、膨大なデータを分析してその意味を探る手法が極めて重要になっています。\
      \ \n  世界統計年（The International Year of  Statistics）とされて…"
