name:
  ja: 地球資源経済論
description:
  ja: 資源の利用と保全を、環境と経済の関係や外部性の内部化方策から扱う講義である。続いて、再生可能資源と再生不可能資源をそれぞれ分析し、農業と環境政策にも触れる。
quotedDescription:
  text:
    ja: '授業の特色

      最大講義回数７回の講義なので、重要論点を絞ってコンパクトな内容にすることを心がける。

       

      授業の紹介

      資源の利用と保全に関して、その現状と地球環境に配慮した望ましい方向について、異時的な効率的資源配分の観点から講述する。すなわち、まず、環境と経済の関係および外部性の内部化方策について明らかにする。次いで、再生可能な資源については生物資源経済学に依拠しつつ、また再生不可能な資源については枯渇性資源経済学に依拠しつつ、それぞれその論点を講述する。'
