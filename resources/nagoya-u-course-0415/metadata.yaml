name:
  ja: 経営労務
description:
  ja: 企業における労働と人事管理を扱う講義で、人事管理がどのような目的で行われ、どのように成り立ってきたかを考える。あわせて、その課題を検討し、企業と人々の関係をめぐる実践へつなげることをめざす。
quotedDescription:
  text:
    ja: '企業経営は、労働者を従業員として雇用し、労働力を引き出すことで成立する。

      また、多くの人々にとって、人生を営み自らを成長させる最大の手段が企業での労働である。

      企業と人々のマッチングを図る人事管理は、近年変化の最中にある。

      この講義では、人事管理の目的、成り立ち、課題を検討することを通じ、受講生が自らのみならず他者の生き方、働き方をよりよいものとするような実践に踏み出すきっかけを共有することを目指す。'
