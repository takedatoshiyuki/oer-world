name:
  ja: 土曜市民セミナー ベーリング海峡を渡った恐竜(2010)
description:
  ja: 白亜紀のベーリング海峡に現れた陸橋を手がかりに、北米とアジアの間で恐竜がどのように行き来したかを扱う。あわせて、極域に位置するアラスカを中心に、その地域に生きた恐竜の生態を紹介する。
quotedDescription:
  text:
    ja: 白亜紀のベーリング海峡には、しばしば北米とアジアとつなぐ陸橋が出現し、北米とアジアの間を恐竜が行き来したと考えられている。北米大陸の最西端に位置しているアラスカは、北米―アジア間の恐竜の関係を研究する上で、非常に重要なフィールドである。また、極域という特殊な環境のため、そこに生きていた恐竜の生態にも注目が集まっている。本セミナーでは、極域に位置するアラスカ州を中心に、恐竜の移動と生態について紹介する。
