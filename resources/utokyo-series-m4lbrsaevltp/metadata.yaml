name:
  ja: 生命の堅牢性と可塑性（学術俯瞰講義）
description:
  ja: ゲノムから生命活動にいたる情報の制御を軸に、生命の堅牢性と可塑性を考える講義である。個体の発生、細胞内タンパク質の入れ替え、iPS細胞を用いた再生医療、生体の時計、脳神経の活動の解析を通して、この主題を扱う。
quotedDescription:
  text:
    ja: 'コーディネータ：　多羽田哲也（分生研）、水島　昇（医学部）

      ナビゲータ：　大杉美穂（教養学部）

      iPS細胞は、たった一つの細胞から個体を再生することを可能にした偉大なる発見です。この発見によって、生命の二面性があらためて浮き彫りになりました。ゲノムが、すべての情報を世代を越えて伝えるという非常に堅牢な側面。一方で、その情報が多様な細胞を生み出す可塑的な側面も持っています。堅牢性と可塑性、この二面性こそが、40億年という長い間、生命の連鎖が一度も途切れずに脈々と続いてきた理由です。

      本講義では、ゲノムから生命活動にいたる情報の制御を軸に、個体の発生、細胞内タンパク質の入れ替え、iPS細胞を用いた再生医療の可能性、生体に備わる時計、脳神経の活動の解析を通して、堅牢性と可塑性という一見矛盾する性質を内包した生命の営みについて、考えてみたいと思います。'
