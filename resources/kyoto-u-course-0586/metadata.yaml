name:
  ja: 農学の新戦略－増収と環境の調和をめざして－
description:
  ja: 農学を軸に、増収と環境の調和、作物の起源、栽培の基礎、育種、植物保護、遺伝子組換え植物、肥料と有機農業、遺伝子多様性の保全までを扱う。農学の変遷や安全性にも触れ、農業生産と環境・生物多様性の関係を幅広く取り上げる。
