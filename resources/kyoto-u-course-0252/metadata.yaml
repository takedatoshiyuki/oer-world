name:
  ja: 第11回 MACSコロキウム「弦の場の理論とその数理」
description:
  ja: 弦理論の記述法の一つである弦の場の理論を取り上げ、弦場を力学変数とする定式化として扱う。あわせて、弦理論と弦の場の理論の入門的な内容に触れつつ、その数理と課題を紹介する。
quotedDescription:
  text:
    ja: '概要

      「ひも」がこの世の最も基本的な構成要素であるとする弦理論の一つの記述法として「弦の場の理論」がある。これはひもの形と位置をあらわす弦座標の汎関数である弦場を力学変数とする定式化であり、弦理論的なゲージ対称性を持った
      ゲージ理論である。ここでは、弦理論、そして、弦の場の理論についての素人向けの（しかし、それなりに数学的な）お話をする。特に、物理屋的な”適当な数学”に基づいた弦の場の理論の数理とその課題を紹介したい。'
