name:
  ja: 全学教育 平和の学際的研究（2008）
description:
  ja: 北海道大学の全学教育として開講された「平和の学際的研究」で、複数の担当教員が関わる。公開教材には、佐々木隆生による「戦争と平和の政治経済学」の講義資料PDFが含まれる。出典文では、平和に関する問題を経済学、国際関係論、憲法学、物理学、教育学の観点から扱う講義とされている。
quotedDescription:
  text:
    ja: 平和の重要性を否定するひとは稀であろう。しかし、平和の具体的姿は必ずしも自明ではない。また、その内容は多様である。しかも、戦争の進行は平和の旗印と一体のことが多かったのである。この講義では、平和に関する諸問題を、経済学、国際関係論、憲法学、物理学、教育学の立場から考察を加え、国家と個人の関係、世界と日本、そしてひとひとりのよりよい在り方の可能性を探る。平和と人類の未来を探るといってもよい。
  source: https://ocw.hokudai.ac.jp/lecture/researchofpeace-2008
  note: 北海道大学OCW 「概要」より（著作権法32条の引用）
