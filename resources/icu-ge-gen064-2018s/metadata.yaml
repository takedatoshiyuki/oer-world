name:
  ja: 'N2: Foundation of Global Informatics Ｎ２：グローバル情報学基礎'
description:
  ja: 情報リテラシ、情報セキュリティ、情報倫理の基礎を扱い、図書館資料とWebを用いた情報検索や、データを統計的に扱うための基本技能を学ぶ。講義内容には、インターネット、ネットワーク・セキュリティ、著作権、データ分析、GIS、デジタルアースなどが含まれ、実習も行う。
quotedDescription:
  text:
    ja: 'Students aim to acquire minimum body of knowledge and skills for information literacy, information
      security measure, and information ethics. They are required to learn basic skills to retrieve global
      information from combined library and Web resources and to handle data for humanity,social and natural
      sciences in a statistically proper way.

      情報リテラシ、情報セキュリティ対策、情報倫理の最低限の知識とスキルの獲得を目指す。図書館資料とWeb情報からグローバルな情報および人文・社会・自然科学のデータを統計的に正しく取り扱う基礎的な技能を習得する。実習を含む。

      Contents of Lectures

      9

      Lectures /

      3

      Videos

      1. Overview of ‘Information Literacy’ 情報リテラシのあらまし

      Apr 19

      2. Internet and World Wide Web インターネットとWeb(WWW)

      Lecture Notes

      Apr

      26

      3. Network security ネットワーク・セキュリティ

      Period5

      Period6

      Lecture Notes

      4. Internet-based electronic commerce and social media ネット上の商取引とソーシャルメディア

      5. Copyright of things and its infringement 著作権とその侵害

      6. Data/Information handling and processing (Data Science) データあるいは情報の取り扱い(Data Science)

      7. Data analysis データ分析

      8. Geographical Information System 地理情報システム

      9. Digital earth デジタルアース'
