name:
  ja: メタバース工学部ジュニア講座 2023秋講座「東大工学部×ポーラ・オルビスホールディングス 科学と美しさの未来を探求しよう」
description:
  ja: 東京大学工学部とポーラ・オルビスホールディングスの研究者が、化粧品づくりや触感を題材に、美しさを科学の視点から考える講義である。あわせて、ポーラ文化研究所の美しさに関するデータや、自分らしく働くことについても取り上げる。
quotedDescription:
  text:
    ja: あなたにとって“美しさ”とは？この講座では、東京大学工学部とポーラ・オルビスホールディングスの研究者が、様々な視点から専門分野の講演・デモを行います。「粉を混ぜてどうのように化粧品を作る？」「さわり心地って何？」を東京大学の2名の教員が科学的に説明します。また、ポーラ文化研究所で長年にわたり蓄積された“美しさ”に関するデータなどをご紹介します。また、自分らしく働くことの大切さについてもお話します。
