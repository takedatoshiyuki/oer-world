name:
  ja: 2016年度 特別講義「子どものウソは「嘘」か?―肝心なのは問うのを止めないこと―」
description:
  ja: 子どもと大人のウソを題材に、子どもの発話を「嘘」とみなせるかを問い直す講義である。記憶、想起、想像、語りの働きを手がかりに、心理学実験や観察を通して虚構の成立に関わる要素を検証する。
quotedDescription:
  text:
    ja: 子どもも大人もウソをつく。 子どものウソは人の思いの裏をかくような『嘘』なのだろうか?そもそも子どもは作偽の嘘をつけるのであろうか?これらの 問いに答えるために、記憶、想起、想像、語りのメカニズムから検証する。心理学実験や観察を通して「嘘」という高次の虚構の創生に不可欠なpsychological
      essentialsを明らかにすることによって人間のこころの不思議を解き明かす。この検証の過程を支えているのは第一に、問いをもち、第二に、研究方法論を身につけ、第三に、探究し続けることである。
