name:
  ja: 全学教育 グローバル化社会の基礎構造（2006）
description:
  ja: 現代社会を考えるための基礎的な概念を整理し、社会科学における「理論」と「歴史」の関係を考える講義である。あわせて、現代社会科学が抱える問題群を示し、哲学、歴史学、心理学、数学、物理学、生物学などとの関わりにも触れる。公開教材には、グローバル化社会、国家、国民とナショナリズム、資本主義的市場社会に関する講義資料が含まれる。
quotedDescription:
  text:
    ja: '1.現代社会を考えるときの基礎的な概念を明らかにする。

      2.社会科学における「理論」と「歴史」の意味，その相互関係を把握する。

      3.現代社会科学が直面する問題群を提示する。

      4.哲学，歴史学，心理学，数学，物理学，生物学などと社会科学の関わりを理解する。'
