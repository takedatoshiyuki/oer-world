name:
  ja: オープンコースウェア･セミナー Openness and the Disaggregated Future of Higher Education（2008）
description:
  ja: オープン教育資源の広がりが、教育資料の共有や学習支援のあり方をどう変えるかを扱う講義である。あわせて、メールやSNSなどを通じた学習者間のつながり、複数機関に分かれて提供される高等教育サービスの将来像にも触れる。
quotedDescription:
  text:
    ja: Open educational resources such as MIT OpenCourseWare demonstrate that educational materials are
      increasingly becoming a free，ubiquitous infrastructure for teaching and learning. Leveraging free
      and open access to a wide range of high quality educational resources can allow the faculty member
      to drastically change their role in supporting learning. The increasing connectivity of teachers
      and learners via email，SMS，instant messenger，Twitter，and other tools allows us to move beyond "groups"
      in our thinking of multi-person assignments to a broader，more loosely knit notion of networks of
      learners. Large-scale，collaborative social networks challenge our ideas of academic honesty but
      are a simple fact of life that instructors can either fight or leverage. Open educational resources
      and social networks point toward a future for higher education in which services traditionally consolidated
      within a single institution (e.g.，providing content，providing learning support，providing assessments，providing
      degrees) are disaggregated and provided by a number of institutions that compete on quality of service
      and price for learner business.
