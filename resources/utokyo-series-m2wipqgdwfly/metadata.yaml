quotedDescription:
  text:
    ja: "英語は、24の子音と約15の母音を使い分けています。これは日本語が使い分ける音よりもずっと多く、当然のことながら日本語の音（カタカナなど）に置き換えて覚えることはできません。しかも、英語ではつづりで発音が決まらないので、つづりで発音を覚えるわけにもいかないのです。東京大学教養学部英語部会が作成したこの教材を使って、英語の発音の基礎と発音記号について実践的に学んでみましょう。\
