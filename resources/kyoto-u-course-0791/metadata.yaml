name:
  ja: 春秋講義『火の山の脅威』
description:
  ja: 日本の活火山の定義と分布を踏まえ、噴火の規模の幅や災害へのつながりを扱う。さらに、火山災害が複合化・長期化しやすいことを前提に、観測に基づく事前避難の必要性まで述べる。
quotedDescription:
  text:
    ja: 日本には110の活火山があります。活火山とは1万年以内に噴火が発生したことのある火山で、今後も噴火発生の可能性があります。火山噴火は火口周辺に噴出物がとどまるものから日本列島を火山灰で覆いつくす巨大なものまであり、噴火の発生は必ず災害に結び付きます。火山災害は複合災害であること、長期化しやすいことから対策が困難です。火山観測に基づく噴火発生前の避難は必須の課題です。
