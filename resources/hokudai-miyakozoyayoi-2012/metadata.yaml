name:
  ja: 土曜市民セミナー 都ぞ弥生 これまでの百年 これからの百年（2012）
description:
  ja: 恵迪寮寮歌「都ぞ弥生」の誕生百年を軸に、その背景にある恵迪寮と札幌農学校の歴史をたどる。明治期の成立から、戦中・戦後や高度経済成長期を経て歌い継がれてきた経緯を扱い、歌に込められた若者たちの歩みを振り返る。
quotedDescription:
  text:
    ja: 明治４５年に恵迪寮寮歌「都ぞ弥生」が誕生して今年で百年になる。しかし、「都ぞ弥生」は一日にして成ったのではない。明治５年に札幌農学校の前身「開拓使仮学校」が芝増上寺内に設置されて以来４０年にわたる若者たちの苦闘と希望が、作歌の横山芳介と作曲の赤木顕次によって結晶されたものである。恵迪寮の名は「都ぞ弥生」のメロディーにのって満天下に広まり、多くの青年たちを北の大地に招いてきた。そして、今もなお、かつて寮生だった者たちの胸に万感を呼び起こす。戦中・戦後の激動する時代においても、高度経済成長を経てバブル経済へと至る飽食の時代にあっても、恵迪寮生たちは「都ぞ弥生」を歌い続けてきた。「都ぞ弥生」は、厳しい北の自然の中で、自らを高め、自らを律し、自らを成長させようと願う若者たちの歌であった。札幌農学校の寄宿舎として開舎され、明治３９年に命名された恵迪寮の歴史をたどりながら、あらためて「都ぞ弥生」これまでの百年とこれからの百年に思いをはせる。
  source: https://ocw.hokudai.ac.jp/lecture/miyakozoyayoi-2012
