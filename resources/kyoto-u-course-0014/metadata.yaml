name:
  ja: 言語構造論A
description:
  ja: 人間言語の構造を、普遍文法や最適設計、経済性原理、生物学的アプローチから考える講義である。統語現象の具体的な分析を通じて、計算系としての統語派生システムのしくみを扱い、あわせて言語の起源や進化にも触れる。
quotedDescription:
  text:
    ja: 普遍文法とは何か、人間言語の最適設計や経済性原理、言語への生物学的アプローチなどを概述した上で、いくつかの統語現象をとりあげ具体的な分析を紹介しながら人間言語の主に計算系(統語派生システム)のしくみを理解できるよう努める。また近年、学際的研究が推進されている言語の起源・進化についても考察する。
  source: https://ocw.kyoto-u.ac.jp/course/14/
