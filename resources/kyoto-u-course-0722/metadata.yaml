name:
  ja: 遺伝学
description:
  ja: 遺伝の仕組みとその物質的基礎を、細胞分裂を起点にして扱う講義である。染色体に焦点を当て、遺伝の法則、染色体の構造や異常、染色体工学、ゲノム分析、突然変異、遺伝子解析までを順に学ぶ構成になっている。
quotedDescription:
  text:
    ja: '授業の特色

      本授業では、生物学の基礎知識が無くても遺伝の仕組みや物質的基礎をを学べるように、細胞分裂から講述する。

      授業の紹介

      遺伝とは、遺伝情報、すなわち遺伝子 (gene) が親から子に伝わるこどであり、ヒトを含むすべての生物にとって最も重要な事象である。Ｇ.メンデルが1865年に正しい遺伝の法則を最初に発表した。1900年におけるメンデルの業績の再発見以降、遺伝学
      (genetics) は科学の一分野となり、その後、人類遺伝学、バクテリア遺伝学、分子遺伝学など、いろいろな遺伝学に発展を続けている。本講義では、遺伝の仕組みと物質的基礎を、遺伝子の集合体である染色体という細胞構造に焦点を当てて講述する。以下の項目について講義を行う。(1)
      細胞分裂、(2) 遺伝の法則、(3) 染色体、(4) 染色体の異常、(5) 染色体の操作、(6) 遺伝子突然変異、(7) 遺伝子の操作'
  source: https://ocw.kyoto-u.ac.jp/course/722/
  note: 京都大学OCW 「講義概要」より（同サイトの利用条件に基づく転載）
