name:
  ja: 北海道大学公開講座 「変化」を見つめる－私たちや地域の未来のために－ 第3回環境変化と越境的取り組み(2010)
description:
  ja: オホーツク海と親潮域の高い海洋生産性を支える要因として、アムール川由来の鉄に注目し、その供給源と減少要因を扱う。さらに、上流域の農地開発と日本の漁業資源との関係を踏まえ、国境を越えた協同の取り組みを紹介する。
quotedDescription:
  text:
    ja: オホーツク海と親潮域は、世界的にも突出して生産性の高い海洋です。近年、この理由としてアムール川がこれらの海洋にもたらす豊かな鉄の存在が明らかとなりました。鉄はアムール川流域の湿原を主たる起源としますが、急速に進む土地利用変化がこの鉄を減少させています。鉄の減少に関わる上流域の農地開発と漁業資源を享受する日本がいかに協同してこの問題に取り組むのか、国境を越えた取り組みを紹介します。
