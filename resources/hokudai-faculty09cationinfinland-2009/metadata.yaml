name:
  ja: 北海道大学教育GP「博物館を舞台とした体験型全人教育の推進」 フィンランドの教えない教育（2009）
description:
  ja: 博物館を舞台にした体験型教育の文脈で、フィンランドの学校での学び方を扱う講義である。モノだけでなく、生き物や人々、本、インターネットと対話しながら学ぶ様子を通して、フィンランドの学校生活を考える内容である。
quotedDescription:
  text:
    ja: 様々なモノと対話ができて、それらが生まれた世界を想像できたら、博物館ほど楽しい場所はないでしょう。そんなことのできる子どもたちがフィンランドにはたくさんいるかもしれません。彼らは学校で，モノだけでなく、様々な生き物や人々、本やインターネットと対話しながら学んでいるからです。日本のように「正解」が求められることも、個人の知識が測られることも、ありません。フィンランドの子どもたちはどんな授業を受けているのでしょう？彼らの学校生活を体験してみましょう。
