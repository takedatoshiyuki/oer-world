name:
  ja: '[ポケット・ゼミ] Physical Computing 入門, 2013'
description:
  ja: Arduinoという小型のマイコンボードに、センサやアクチュエータを接続してプログラムで動作させる方法を扱う。あわせて、作品のアイデアを出し、実際に形にする流れを通してPhysical Computingを学ぶ。公開教材には、Arduino/Suwanoをはじめよう＠KYOTO-Uの資料が複数含まれる。
quotedDescription:
  text:
    ja: '授業の概要・目的

      小さなコンピュータ（組み込み用マイクロプロセッサ）とその開発環境が安価になり、これに光や接触など外界の状況を感知するセンサーとモーターやランプなど外界に働きかけるアクチュエータを接続して「能動的に動作するもの（作品）」についてのさまざまなアイデアを形にすることが
      Physical Computing として注目されています。本授業では実際に Arduino と呼ばれる小型のマイコンボードにさまざまなセンサやアクチュエータを接続し、プログラムで動作させることを学習するとともに、自ら作品のアイデアを出し、これを実際に作ってみることを通して
      Physical Computing について体験的に学びます。'
  source: https://ocw.kyoto-u.ac.jp/course/644/
