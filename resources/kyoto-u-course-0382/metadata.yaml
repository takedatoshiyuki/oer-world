quotedDescription:
  text:
    ja: 'Course Description

      Kyoto University School of Public Health (KUSPH) invites you to the special lecture series on “Health
      Economics and Social Capital” by Professor John Cairns, London School of Hygiene & Tropical Medicine.
      John Cairns is Professor of Health Economics at the London School of Hygiene & Tropical Medicine.
      He has a particular interest in the use of economic information to inform health care decision-making,
      and has been a member of the NICE Appraisal Committee since 2003.'
