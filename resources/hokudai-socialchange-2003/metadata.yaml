name:
  ja: 学部専門教育 社会変動論 日本社会の変動と家族（2003）
description:
  ja: 近現代日本の社会変動の中で、家族と家族観がどのように移り変わるかを扱う講義である。家族を捉えるための複数の分析視角を簡単に整理したうえで、家族の変動をみていく。
quotedDescription:
  text:
    ja: '社会学固有の研究対象が「家族」であるといっても言い過ぎではない。しかし、誰もが知っており、経験もしている家族を学問の対象とすることはことのほか難しいことでもある。

      近現代日本における社会変動の中で家族、家族観の移り変わりを考えたいのであるが、それには、家族を捉える様々な分析視角が必要となる。それらを簡単に解説した上で、家族の変動をみていきたい。'
  source: https://ocw.hokudai.ac.jp/lecture/socialchange-2003
  note: 北海道大学OCW 「概要」より（著作権法32条の引用）
