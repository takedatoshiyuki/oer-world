description:
  ja: 全国の大学生を対象に、世界に革新をもたらす新型ビジネスプランを構想するコンテストである。書類選考を通過した参加者は京都市内で3泊4日の合宿を行い、京都大学時計台百周年記念ホールで最終コンテストに臨む。
quotedDescription:
  text:
    ja: グローバルリーダー育成カップ2010は、全国の大学生から募集を募り「Global Future Innovation」をテーマに世界に革新をもたらす新型ビジネスプランを立案するコンテストです。今回、全国から1,002名ものエントリーがあり、
      国内からは京都、東京、早稲田、慶応など全国の大学から、また海外からもアメリカ、中国、韓国、イランなど幅広い国籍の学生の応募がありました。応募の中 から書類選考を通過した48名が京都市内に集まり、3泊4日の合宿を経て、京都大学時計台百周年記念ホールでの最終コンテストに臨みました。
