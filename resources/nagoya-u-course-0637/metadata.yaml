      2017年度 春1期

      対象者

      情報学部／情報学研究科 1年

      タグ

      情報学

      講義概要

      本講義の目的は，情報学を身につけた人材が社会でどのような役割を求められているかについて理解し，学生自身が自分の社会での活躍の場を構想することである。

      そのために，情報学を駆使して課題発見・解決できる人材，情報社会基盤を構想・設計できる人材，情報学を駆使して組織をマネジメントできる人材について，情報学の外部有識者に講演をお願いし，教員と学生が参加してフリーディスカッションを行うことで理解を深める。'
