name:
  ja: 'S2: Media and Identity Formation Ｓ２: メディアとアイデンティティ形成'
description:
  ja: この講義は、アイデンティティ形成を中心に、メディアやコミュニケーション、教育、心理学の観点から関連する問題を扱う。内容には、デジタル時代の自己やメディアと行動の関係、アイデンティティとウェルビーイング、文化や学習、広告やソーシャルネットワーキングとの関わりが含まれる。
