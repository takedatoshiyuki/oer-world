name:
  ja: 北海道大学教育GP「博物館を舞台とした体験型全人教育の推進」 看護学教育におけるOSCEの実際 －市民の模擬患者と共に－ (2010)
description:
  ja: 看護学教育におけるOSCEを題材に、学修到達度の設定や自己学修の促進、看護実践力の育成をめざす取り組みを扱う。市民を模擬患者として演習や技術試験に参加させる実践を通して、その運用例を紹介する。札幌市立大学での取り組みの一部も取り上げる。
quotedDescription:
  text:
    ja: '札幌市立大学は平成１８年度にスタートしたばかりの大学で看護学部とデザイン学部の２学部で運営しています。平成２０年度の教育ＧＰに採択された「学選別ＯＳＣＥの到達度評価と教育法の検討」は各学年毎の学修到達度を設定し、学生の自己学修を促進されると共に、看護実践力を育成しようとするものです。この中では一般市民の方々に「模擬患者」として教育に参画して貰っています。

      今回は模擬患者の要請や模擬患者の皆様が演習や技術試験に参加して頂きながら　進めている、本学の取り組みを紹介します。

      この度、北大の教育ＧＰ　２０１０年度の議場成果と報告で共催させて頂く機会を頂きましたので、札幌市立大学の一部をご紹介します。'
