name:
  ja: 教育社会学講義II
description:
  ja: 教育社会学の理論や考え方を、教育学や心理学との比較も交えながら扱う講義である。あわせて、社会調査の危うさや基礎的な考え方、教育に関する常識や思い込みを問い直す視点を学ぶ。公開教材として、講義ノートが3件ある。
quotedDescription:
  text:
    ja: 'この授業のねらいは、教育社会学・社会学の理論や知見、そして社会調査の基本的な考え方を学習することをとおして、教育に関する「常識」や「思い込み」を一旦停止させ、一歩引き下がった広い視野から冷静な分析ができるような態度を身につけることです。自分自身の意見の相対化を出発点とするクリティカルな思考過程をとおして、教育と社会の新しい世界像へと迫っていきます。

      「教育社会学」のおもしろさに迫るために、授業では次の 3 つのことにこだわります。

      第一に、「学問」（discipline）にこだわります。社会学あるいは教育社会学の理論や考え方とはどのようなものか、さまざまな例を用いながら、またときに教育学や心理学との比較をおこないながら、描き出していきます。

      第二が、「調査」（research）にこだわります。社会を知るには調査が不可欠です。ただしこの授業では、社会調査の技術をマジメに学ぶことはありません。調査の危うさや裏側を学ぶ（＝「黒」を知る）ことをとおして、調査の基礎的な考え方を習得する（＝「白」を知る）ことを目指します。numeracy
      を鍛える場です。

      第三が、「常識」（common sense）にこだわります。私たちは社会の成員である以上、誰でも社会について容易に語ることができます。したがって、社会学がそうした語りに準じていては、学問になりません。皆が容易に語る「常識」からはみえてこない、もう一つの社会の姿に到達すること、これが社会学の最大の魅力です。

      授業では、上の 3 つのこだわりを柔軟に使いこなしながら、教育と社会の新しい世界像へと迫っていきます。'
