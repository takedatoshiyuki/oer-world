  ja: データサイエンス講義 だめな事例から学ぶデータ可視化のテクニック
description:
  ja: データ可視化を題材に、視覚特性、対象データ、表現手法の関係を取り上げる講義である。ダメな事例を通して、それらの関係を意識することの重要性を説明する。
quotedDescription:
  text:
    ja: データ可視化とは、データを人に見せるために表現を変えることです。データの視覚的表現を人に見せることで、データの理解、発見、洞察を助けることが可能になります。しかしながら、そのような目的に役立たないダメな可視化を見掛けることも多々あります。この講義では、ダメな事例を通して、人間の視覚特性、対象データ、視覚的な表現手法の関係を紹介し、それらの関係を意識することの重要性を説明します。
