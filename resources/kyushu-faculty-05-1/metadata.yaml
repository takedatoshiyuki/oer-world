name:
  ja: 数値解析
description:
  ja: 自然現象や科学的諸問題を数式で表し、その方程式をコンピュータで解くための数値計算法を扱う。教材では、そうした計算法とその性質について述べる。
quotedDescription:
  text:
    ja: '自然現象や科学的諸問題は、しばしば数式を用いてモデリングされます。

      このような数式はほとんどの場合、複雑な方程式の形をしており、コンピュータを援用しなければ解けません。

      したがって、このような方程式をコンピュータで効率よく解くための計算法が必要になります。

      この授業の目的は、このような数値計算法やその性質などを述べることです。'
