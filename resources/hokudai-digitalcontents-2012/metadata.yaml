name:
  ja: 北海道大学情報基盤センター共同研究公開講演会 「教育におけるデジタルコンテンツとコミュニケーション・デザイン」（2012）
description:
  ja: 教育で用いるデジタルコンテンツを対象に、教授者と学習者のあいだで生じるやり取りをインストラクショナル・デザインの観点から検討する講演会である。教授プロセスと学習プロセスを双方向のコミュニケーションとして捉え、コンテンツに求められる機能や構成要素を扱う。あわせて、韓国のデザイン教育や人材養成、産業デザインとロボットデザインに関する話題を取り上げる。
quotedDescription:
  text:
    ja: '本研究は、昨年度に実施した研究課題「クリエイティブ・デジタルコンテンツとコミュニケーション・デザイン」で検討した内容を踏まえて、教育の分野で制作・活用されるデジタルコンテンツを対象として、教授者と学習者の間に生まれるコミュニケーション・プロセス全体のなかでコンテンツに求められる機能をインストラクショナル・デザインの視点から検証をおこなった。この研究においては、教授者の狙いを達成しようとする教授プロセスと学習者のニーズ及び動機に支えられた学習プロセスを、双方向で重なり合うコミュニケーション・プロセスであると捉える。そのプロセスにおいて、教材としてのデジタルコンテンツが学習者の動機を強化するために必要とする機能に対応する構成要素を明らかにすること、あわせてそこに昨年度検討したクリエイティブなコンテンツに伴う感性的なコミュニケーション・プロセスのデザインという視点を組み込む可能性を検証することを目的とした。

      この研究を推進することにより、関連分野である教育工学、インストラクショナル・デザイン、感性情報学、情報デザインなどの領域の未開拓の研究課題に取り組むための有効な方略を示すことが期待された。そこで、インストラクショナル・デザインの専門家を招いて公開講演会を開催し、関連分野の研究者と共同討議を行った。

      ＜公開講演会・成果＞

      環境デザイン、感情デザイン、ロボットデザインの専門家であり、韓國科学技術院（KAIST)で韓国における最新のデザイン教育をおこなわれている Kim Myung Suk 氏と韓国職業能力開発院研でデザイン人材養成のための方案について研究されている
      Jung Hyang Jin 氏を招き、北海道大学情報基盤センター共同研究講演会「教育におけるデジタルコンテンツとコミュニケーション・デザイン」を開催した。Kim Myung Suk 氏からは産業デザインにおける、ここ３０年のデザイン進化と最近のロボットデザインについて紹介頂いた。また、Jung
      Hyang Jin 氏からは、国としての韓国デザイン産業界人材養成の現状についての報告があり、日本の現状との比較・検討が行われた。'
