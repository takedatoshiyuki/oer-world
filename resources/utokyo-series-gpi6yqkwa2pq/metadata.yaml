  ja: 東洋文化研究所公開講座 第16回 アジアの策
description:
  ja: 中国の台頭がアジア、とくに日本との関係にどのような変化をもたらしたかを扱う講義である。経済や人的交流の拡大と、外交・安全保障上の摩擦の両面を取り上げたうえで、周辺地域の人々の受け止め方にも目を向ける。
quotedDescription:
  text:
    ja: "近年の中国の台頭はアジアにいろいろな変化をもたらしました。日本との関係で言えば、経済的な結びつきが強まり、旅行者などの人的交流は拡大しつつも、外交・安全保障上の摩擦が顕在化するようになりました。中国に対して「親しみをもつ」とする回答は減り、中国の台頭を警戒する声も強まっています。\
      \ \n  では、アジアの周辺地域の人々はどうなのでしょう？彼らもまた、日本と似たようなスタンスから中国の台頭を眺めているので…"
