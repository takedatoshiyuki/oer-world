name:
  ja: ひらめき☆ときめきサイエンス タンパク質の結晶を作ろう（2010）
description:
  ja: タンパク質の働きと立体構造をテーマに、結晶を作る実験を通してその調べ方を扱う。講義ではタンパク質の役割や結晶化の方法・原理、X線結晶構造解析について学び、実験では結晶化と観察を行う。研究室見学も含め、タンパク質の「カタチ」を調べる流れを体験する。
quotedDescription:
  text:
    ja: '私達の体の中には何万種類というタンパク質が存在しています。食べ物を消化する時、バイ菌をやっつける時、筋肉を動かす時、タンパク質はいつも忙しく体の中で働いています。私達の研究室ではタンパク質の結晶を作って、タンパク質の立体構造“カタチ”を調
      べています。当日は、最初に講義室でセミナー「タンパク質とは何か」を行い、タンパク質の生命現象における役割をご紹介します。その後実験室に移動し、皆さんにタンパク質の結晶化を体験してもらいます。昼食後は当日作製した結晶と塩化ナトリウムの結晶の観察を行います。最後にセミナー「タンパク質のＸ線結晶構造解析」を行い、タンパク質の立体構造がどのようにして得られるのかについてご説明します。さあ、私達と一緒にタンパク質の結晶を作って、タンパク質の“カタチ”を調べる仕組みを勉強してみませんか？！

      ・2010年9月23日

      8:30　 集合

      8:30-9:00　　 実験室へ移動・自己紹介

      9:00-9:15　　 科研費の説明

      9:15-9:50　　 実験「ピペッターの使い方の説明・練習」

      9:50-10:10　 講義「結晶化方法の説明」

      10:10-11:30　 実験「結晶化」

      11:30-11:50　 講義「結晶化の原理説明」

      11:40-13:00　 昼食・研究室見学

      13:00-13:20　 講義「タンパク質とは？」

      13:20-13:40　 講義「X線結晶構造解析について」

      13:40-14:40　 実験「結晶観察」

      14:40-15:00　 考察

      15:00-15:30　 クッキータイム

      15:30-16:00　 修了式

      16:00 解散'
