name:
  ja: HUSTEP/国際交流 The Real Story of Child Language Acquisition ／ 学部専門教育 英語学 生成文法の研究(1) （2014）
description:
  ja: 子どもが母語をどのように獲得するかを扱い、その過程について議論する教材である。あわせて、人間言語の研究に関する基本概念と方法論を学ぶ内容を含む。
quotedDescription:
  text:
    ja: Every child acquires their native language effortlessly and in a very short period. This looks
      so natural that people do not realize how amazing it is. Current studies of language and language
      acquisition have revealed several interesting aspects of child language acquisition，many of which
      do not coincide with what we normally believe about language. In this course，we are going to discuss
      how actually children acquire their native language. The students also learn basic concepts and
      methodology of study of human language.
