name:
  ja: 七夕講演会 星のふるさとをながめよう -電波で見た天の川-（2009）
description:
  ja: 北海道大学で2009年7月7日に行われた七夕講演会に関する教材である。出典文からは、世界天文年を記念した全国同時企画の一環として実施されたことと、天の川を電波観測の視点から扱う内容であることが読み取れる。
quotedDescription:
  text:
    ja: '今年は、ガリレオ・ガリレイが望遠鏡を宇宙に向けてから400年です。ユネスコと国連はこれを記念して今年を「世界天文年」としました。

      日本天文学会は、これに協賛して7月7日の七夕前後に全国各地で「世界天文年全国同時七夕講演会」を企画しました。

      北海道大学でも、七夕講演会を行います。あなたも一緒に、宇宙のなぞを楽しんでみませんか。

      主催： 北海道大学理学研究院、 北海道大学総合博物館

      場所： 北海道大学総合博物館

      日時： 2009年7月7日

      七夕講演会

      ・宇宙とブラックホール

      早崎 公威（北海道大学大学院理学研究院）'
