name:
  ja: GCOE総合博物館市民セミナー 中国怪獣総進撃（2011）
description:
  ja: 中国に伝わる怪獣話を、古代から現代までの流れの中で扱う講義である。文化大革命末期の〈野人〉〈水怪〉の物語や、現代映像メディアに現れる怪獣図像を取り上げ、フィクションとノンフィクションの間を行き来する怪獣イメージを考える。
quotedDescription:
  text:
    ja: '「子、怪力乱神を語らず」とは、怪しげな話をすることを戒めたとされる『論語』の中のことばですが、古代から21世紀の現代にいたるまで中国には謎の怪獣話が絶えません。文化大革命末期に突如「実話」として大陸を騒がした〈野人〉〈水怪〉の物語や、現代映像メディア等に登場した怪獣図像などを眺めながら、フィクションとノンフィクションの間を自在に行き来する不思議な怪獣イメージの世界へ、皆様をご招待いたします。

      ‡ これらの資料は制限資料です。'
