name:
  ja: 工学部公開講座・オープンセミナー「ひと・社会・工学 －工学のいまを知る－」, 2021
description:
  ja: 本講座は、工学が医療や社会の測定技術にどう関わるかを二つの話題から扱う。前半では、医学・工学・臨床医が連携する先端医工学の一端を紹介し、後半では測量の歴史と衛星・航空機を用いた最新の測量技術、そこに共通する原理を取り上げる。
quotedDescription:
  text:
    ja: '「工学から医療への貢献」 工業化学科 教授 近藤 輝幸

      京都大学において、医学と工学、さらには臨床医が一体となり進めている先端医工学の一端を紹介します。また、様々な学問に興味を持つことで皆さんの将来にどんな“知的世界”が拡がっているかをお伝えします。

      「地球をはかる ―衛星や航空機を使った最新の測量―」 地球工学科 教授　須﨑 純一

      古くから国内外で、土地の高さや面積を精確に測る測量技術は重要であり、精度を高める工夫がなされてきました。測量の歴史を振り返り、衛星や航空機を使った最新の測量技術を紹介し、機器が発達しても変わらない原理に焦点を当てます。'
