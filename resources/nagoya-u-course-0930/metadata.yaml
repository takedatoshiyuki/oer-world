name:
  ja: プラズマ理工学
description:
  ja: プラズマの生成から基本的性質、荷電粒子の運動、衝突と電気抵抗、電磁流体力学、波動、平衡、輸送までを扱い、さらにプラズマ・材料相互作用や核融合プラズマにも触れる。公開教材は第1回から第12回まで用意されており、レポート返却時には解答の説明を行う。
quotedDescription:
  text:
    ja: 'プラズマの物理と工学の基礎を習得する。特に、プラズマを構成する荷電粒子の単一粒子としての運動とプラズマの流体としての運動を理解する。

      原子分子過程とプラズマの生成

      プラズマの基本的性質

      単一荷電粒子の運動

      クーロン衝突と電気抵抗

      電磁流体力学とプラズマの流体としての運動

      プラズマ中の波動

      プラズマの平衡

      プラズマにおける熱・粒子の輸送

      プラズマ・材料相互作用

      核融合プラズマ

      レポート返却時の授業でレポートの解答を説明するので、理解を深めること。'
