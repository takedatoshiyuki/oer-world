    ja: "UTalkとは、情報学環・福武ホール主催のカフェイベントです。さまざまな領域で活躍している東京大学の研究者をゲストとして招き、毎月開催しています。カフェならではの雰囲気、空気感を大切にし、気軽にお茶をする感覚のまま、ゲストとの会話をお楽しみいただける場となっています。そのUTalkの第100回を記念して、2016年7月9日に開催された「流れをつかむ日本の歴史」を特別に東大TVでお届けします。\
