name:
  ja: 大学図書館の活用と情報探索, 2015
description:
  ja: 理系・文系の複数教員が、情報の組織化と活用方法の歴史と現在を扱う講義である。あわせて、図書館職員の支援のもとで図書館やデータベースを使った文献検索の演習を行う。公開教材には、資料調査、検索の理論と実際、インターネット検索、総合演習に関する資料が含まれる。
quotedDescription:
  text:
    ja: 本授業では、理系・文系双方にわたる専門分野の異なる教員陣によって、各分野における情報の組 織化と活用方法の歴史や現在について講義を行う。その上で、図書館職員のサポートのもと、図書 館やデータベース
      などの文献検索ツールの演習を行い、レポート作成や発表などのアウトプットに つなげる。
