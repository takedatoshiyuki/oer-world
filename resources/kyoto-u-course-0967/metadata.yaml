name:
  ja: 国立大学附置研究所・センター会議　第3部会（人文・社会科学系）シンポジウム 「データからみる地域研究」
description:
  ja: 本教材は、地域研究におけるデータサイエンスの導入を扱うシンポジウムである。従来のフィールド調査とは異なる方法を取り上げ、複数の学問領域でのデータサイエンスを通して人文社会科学のあり方を考える。
quotedDescription:
  text:
    ja: 近年のデータサイエンスの進歩はめざましく、「ビッグデータ」や「AI」という言葉がよく聞かれるように、その影響はよい意味でも悪い意味でもわれわれの日常生活でも感じられるほどである。このシンポジウムでは、従来のフィールド調査とは異なる、様々な学問領域でのデータサイエンスを取り入れた地域研究に焦点を当てて、人文社会科学の新しい姿を探ってみたい。
