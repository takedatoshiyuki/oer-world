name:
  ja: GCOE総合博物館市民セミナー ポーランド文学と越境 （2011）
description:
  ja: ポーランドが分割・侵略・占領を経験するなかで生まれた亡命や移住の歴史を背景に、作家の経験と文化活動を通じて境界の問題を扱う講義である。社会・文化・民族のあいだにある境界が、どのように知覚され、越えられてきたかを考える。
quotedDescription:
  text:
    ja: '列強諸国による分割、侵略、占領－ポーランドは、政治的歴史的変動が起こるたびに数多くの亡命者や移民を世に送り出してきた国です。

      本講演は、亡命や移住の経験を持つ作家と彼らの文化活動を通して、社会・文化・民族の間を横切る様々な「境界」がどのように知覚され、踏み越えられてきたかを紹介します。

      ‡ これらの資料は制限資料です。'
