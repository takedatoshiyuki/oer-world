name:
  ja: 植島啓司X土佐尚子 トークショー 土佐琳派トークイベント メディアアートのクールジャパン
description:
  ja: 日本人の伝統的な美意識を手がかりに、土佐尚子の映像作品群「TOSA RIMPA」を取り上げる。CGを使わないハイスピード撮影やプロジェクションマッピングによる表現を通して、季節の景物や拡大された時間感覚をどのように映像化するかを扱う。あわせて、植島啓司を交え、作品から読み取れる現代日本の祝祭空間について語る。
quotedDescription:
  text:
    ja: '概要

      日本人の伝統的な美意識をテーマに、デジタル技術を駆使して息を飲むような新しい日本美の映像作品を作成する土佐尚子。 「TOSA RIMPA」は、京都府の琳派400年記念事業のイベントとして今年京都国立博物館にて、CGを使わず全編ハイスピードカメラで撮影されプロジェクションマッピング上映された「21世紀の風神・雷神伝説」を含む作品集です。　
      実時間を約100倍に伸ばして見えてくる裸眼で見えない世界が、生命のような液体の動きや、散る花びら、秋の月、冬の雪などで表現されます。四季おりおりの風雅な眺めを捉えた驚きの日本美を、4K対応のプロジェクター&スクリーンで実際にご覧頂ながら、そこから感じ取れる現代日本の祝祭空間について、宗教人類学の植島啓司先生を迎えて語っていただきます。'
  source: https://ocw.kyoto-u.ac.jp/course/954/
