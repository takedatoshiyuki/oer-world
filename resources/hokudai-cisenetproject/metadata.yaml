name:
  ja: CISEネットプロジェクト きっと役に立つキット教材開発セミナー 教育デリバリーシステム「トランクキット」の開発と普及(2012)
description:
  ja: 札幌周辺地域の教育施設が連携して進めるCISEネットの活動を背景に、教育デリバリーシステム「トランクキット」の開発と普及を扱うセミナーである。道内の施設や団体で使われている教材の紹介を通じて、教材プログラムの開発や今後のトランクキットのあり方について意見交換する内容になっている。
quotedDescription:
  text:
    ja: '「CISE（Community for Intermediation of Science Education）ネット」は、札幌周辺地域の教育施設が連携し、地域住民への実物科学教育を進めるネットワークです。連携する教育施設の特性に応じた実物教育をおこない、その成果をまとめ地域の知財とし発信します。連携施設が協同して効果的な教育を行うため、教材プログラムの開発を進めています。その主となる活動のひとつが、トランクキットです。

      今回のセミナーでは、道内の施設や団体によって活用されている教材を紹介し、今後のトランクキット開発についての意見交換の場とします。

      主催： CISEネット（運営機関：北海道大学総合博物館）'
