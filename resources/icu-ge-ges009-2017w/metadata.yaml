name:
  ja: 'S1: Debates in International Relations Ｓ１：国際関係ディベート2017 W'
description:
  ja: 国際関係論の主要な理論を土台に、政策ディベートを通じて議論を進める講義である。日本の国際関係に関する現代的な論点に加え、国際交渉、国連での持続可能な開発と気候変動交渉、ディベートの基礎と実践を扱う。
quotedDescription:
  text:
    ja: 'Based on the basic knowledge of contending theories of international relations reviewed in the
      course, students are encouraged to develop their critical thinking skills through policy debate
      on the current topics of Japan”s international relations.

      国際関係論の主要な理論を概観し基本的な知識を習得する。その理論をもとに討論を通じて国際関係理論のロジックを実践的に身につける。

      Contents of Lectures

      21

      Lectures  /

      1

      Video

      Dec 05

      ディベートで学ぶ国際関係

      Dec 07

      政策ディベート基礎編

      Dec 12

      国際交渉とディベート

      Dec 14

      Sustainable Development and Climate Change Negotiations in the United Nations 持続可能な開発と気候変動をめぐる国連交渉

      Guest Speaker : André Corrêa do Lago アンドレ・コヘーア・ド・ラーゴ [ 駐日ブラジル特命全権大使]

      Dec 19

      ディベートで使える国際関係学の理論

      Dec 21

      政策ディベート実践編（予行演習）

      Jan 09

      What makes a good debater? (Guest Speaker, The Cambridge Union)

