name:
  ja: 基礎情報処理
description:
  ja: この講義は、コンピュータの仕組みや動作原理を基礎から扱い、特定の機器やソフトウェアに依存しない情報技術の考え方を学ぶ内容である。あわせて、実験データの処理・解析や物理現象の計算機シミュレーション、物理工学分野での情報技術の活用例を取り上げる。教材には、論理回路、プログラム基礎、UML、コンピュータネットワーク、情報倫理などの回が含まれる。
quotedDescription:
  text:
    ja: '授業の特色

      コンピュータの仕組みや動作原理を学び、実験結果の処理・解析手法や物理現象の計算機シミュレーション手法など今後の研究手段としてコンピュータを活用できるようにする。

      授業の紹介

      本講義では、コンピュータの特定のハードウェアやソフトウェアに依存しない情報技術の基礎について理解させる。２回生以降の学びの動機付けとなるよう物理工学科と関連のある分野で情報技術がどのように活用されているかについての紹介も合わせて行う。例えば、簡単な自動販売機を設計させたり、簡単な機器の性能評価を行わせたりすることにより論理回路や数値解析手法を体験的に理解させる。'
