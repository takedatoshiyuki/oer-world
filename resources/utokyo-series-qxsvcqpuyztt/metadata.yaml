description:
  ja: セシウム原子時計と光格子時計を題材に、秒の定義に関わる研究を扱う講義である。高精度な原子時計をなぜ作るのかという問いから、新しい秒の定義を目指す研究の内容を取り上げる。
quotedDescription:
  text:
    ja: "現在、秒の定義に使われているセシウム原子時計は、3000万年に1秒の誤差しか生じません。しかし、香取教授の研究室が作った超高精度の原子時計（光格子時計）は、なんと宇宙の年齢の2倍にあたる約300億年に1秒の誤差しか生じないといいます。それほど高精度の時計をなぜ、なんのために作るのでしょうか？\
      \  新しい「秒の定義」を目指す最先端の研究をわかりやすく説明します。 \n \n  ★     東京大学工学部オープンキャンパス2016 …"
