name:
  ja: 令和6年度「東京大学安全の日」講演会
description:
  ja: 東京大学が毎年実施する「東京大学安全の日」講演会で、学内の安全衛生、事故災害の防止、安全意識と安全文化に関わる内容を扱う。本年度は「現代社会に内在するリスクへの対応」をテーマに、7月9日に開催された。
quotedDescription:
  text:
    ja: '本学では、平成17年に構成員が潜水作業中に亡くなる事故が発生した7月4日を「東京大学安全の日」と定め、安全の日を迎えるこの時期に、事故の記憶を風化させることなく、教育研究活動における安全衛生の向上、事故災害の発生防止、安全意識の向上及び安全文化の定着を図ることを目的として、毎年「東京大学安全の日」講演会を実施しています。

      第19回となる本年度の講演会は、「現代社会に内在するリスクへの対応」をテーマとして7月9日（火）に開催いたしました。'
