  ja: 本講義は、責任ある研究とイノベーション（RRI）と、倫理的・法的・社会的観点（ELSI）を扱う研究倫理セミナーである。複数分野の視点を交えながら、これらの論点を議論し、学内での3年間の取組の総括や各部局の取り組みも紹介する。
