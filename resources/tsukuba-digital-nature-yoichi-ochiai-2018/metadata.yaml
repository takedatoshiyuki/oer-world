name:
  ja: 2018年度 特別講義「ユビキタスからデジタルネイチャーへ：アート・エンターテイメント・デザイン」
description:
  ja: ユビキタスコンピューティングの先にある計算機自然（Digital Nature）を主題に、人と機械、物質世界と実質世界の関係を考える講義である。計算機応用の選択肢を計算機科学的に実装する話題を通じて、産業・学問・芸術に関わる問題解決や文化的価値の創成を扱う。あわせて、ケーススタディとメディア史を紹介する。
quotedDescription:
  text:
    ja: 我々はユビキタスコンピューティングの先に計算機自然（Digital Nature）の到来を見据えている。計算機自然では、人と機械、物質世界（Material World）と実質世界（Virtual
      World）の間に、今までの工業化社会よりも多様な未来の形が起こりうると考えられる。本研究室は、そういった物質性と実質性の間で、計算機応用のもたらす様々な選択肢を想定し、それらを計算機科学的に実装することで、産業・学問・芸術にいたる様々な問題解決に挑戦し、人・計算機・自然における新たな文化的価値の創成を目指しており、そのケーススタディや現在に至るメディア史などを紹介する。
