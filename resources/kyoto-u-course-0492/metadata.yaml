name:
  ja: 平成21年度 京都大学図書館機構 第2回講演会 「次世代OPACを考える-目録情報の視点から-」
description:
  ja: この講演会は、次世代OPACを機能や画面だけでなく、目録情報の構造や内容、情報検索の考え方から捉える。目録、情報検索、OPAC設計の各分野の専門家がそれぞれの視点を示し、議論と質疑応答を通じて課題を共有する構成である。
quotedDescription:
  text:
    ja: '昨今、日本の図書館界において“次世代OPAC”と呼ばれるWeb サービス及びそのシステム に注目や期待が集まっています。 “次世代OPAC“というと、そのシステムの機能やインターフェースに注目が集まりがちです
      が、“次世代OPAC“をとらえる上では、OPAC の利便性とともに、資料検索ツールとしての有 用性を高める根本的な要素である「目録情報」の構造や内容、さらには情報検索そのものへの考 え方や情報検索技術など、これまでの「OPAC」の枠にとらわれない発想や視点にも注目する必
      要があるでしょう。 そこで当講演会では、「目録情報」の視点から“次世代OPAC”をとらえることを主題とし、 “次世代OPAC”について「目録」「情報検索」「OPAC 設計者」それぞれの専門家をお招きし
      て知見を得るとともに、各専門分野における情報検索に対する考え方や今後の課題について、講 演者間の議論及び参加者からの質疑応答を通じて共有したいと考えています。

      主催：京都大学図書館機構

      共催：国立大学図書館協会近畿地区協会

      協賛：大学図書館近畿イニシアティブ'
