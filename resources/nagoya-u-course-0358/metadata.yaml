  ja: 比較文化論
description:
  ja: フィリピンを主な題材に、歴史、言語、民族、宗教、社会、都市と地方の様子を扱う。さらに、マニラの貧困と発展、ロハスの日常風景やカトリック生活、日本とフィリピンの関係にも触れる。講義では映像資料などを用いて進める。
quotedDescription:
  text:
