name:
  ja: 全学教育 英語演習 中級：言語音声を信号処理ソフトウェアを用いて分析する――毎週英語で実習し発表する (2014)
description:
  ja: 人間の話し言葉を収録し、分析するためのコンピュータ技術を実習する講義である。受講者は各自のパソコンを使って授業中に英語で発表し、前後にはCALLと音声分析ソフトを用いた予習・復習を行う。
quotedDescription:
  text:
    ja: '◆ この授業では、人間の話し言葉を収録し分析するためのコンピュータ技術を手を動かして学ぶ。

      ◆ この授業では、各自が持参するパソコンをプロジェクタに接続し英語による発表を授業中に実施する。授業の前後に各自でCALLと音声分析ソフトを用いた予習・復習をする。

      ◆ この授業に向く学生は (a) 技術英語を使いたい、(b) コンピュータを用いた技術プレゼンテーションを実施したい、(c)時系列信号を分析したい人である。学会発表や技術プレゼンを英語で実施するための説明能力の基礎が身につく。

      講師ウェブサイト

      http://goh.kawai.com/'
