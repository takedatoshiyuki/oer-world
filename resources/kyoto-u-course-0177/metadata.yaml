name:
  ja: 動物環境生理学特論
description:
  ja: 動物の環境生理をテーマに、地球温暖化や環境変動、環境汚染が動物の生理・生産機能に及ぼす影響を扱う講義である。公開されている講義資料では、高泌乳牛の周産期の代謝や疾病、ミネラル・水代謝、免疫、暑熱ストレス、繁殖機能などを取り上げている。
quotedDescription:
  text:
    ja: '授業の特色

      動物の環境生理に関連した授業を行う。

      授業の紹介

      動物の生理・生産機能に及ぼす地球温暖化、環境変動、環境汚染などの影響について、哺乳動物、反芻動物を中心に論述する。'
