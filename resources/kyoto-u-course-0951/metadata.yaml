name:
  ja: ILASセミナー：工学系アートのススメ, 2017
description:
  ja: アートとテクノロジーを組み合わせ、感情や意識、言語化しにくい情報をどう表現し、どう伝えるかを扱う。ITを使ったインタラクティブな表現を通じて文化を理解する方法を考え、日本文化に関わる題材を研究対象としている。公開資料には、学生レポートや学生作品の教材が含まれる。
quotedDescription:
  text:
    ja: '授業の概要目的

      このゼミでは、感情、意識、ノンバーバルな情報を扱ったコミュニケーションを テーマにアート＆テクノロジー領域を研究、作品制作を行います。さらに、未来のコンピュータの不可欠なコミュニケーション能力である定量化できなかった個人の感情・意識・民族性・物語性といった人々に内属する文化の本質を表現し、文化の精神に触れるインターフェースを研究します。文化には、固有のまたは共通の形式があります。人間が歴史の中で行為や文法などの形で蓄えてきたものをモデル化し、ITを用いてインタラクティブな表現、文化理解体験をする方法を、「カルチュラル・コンピューティング」と定義します。
      特に日本文化のコンピューティングに注目し、ほとんどコンピューティングの対象となって来なかった 1.日本の移ろいやすい気象・自然風土「もののあわれ」などの無常思想、「わび、さび」などの美意識　2.日本文化とアジア文化との関係性　3.神仏習合を根底とした文化構造　4.和歌、俳譜や能などの日本語独特の特性　5.日本的意匠（紋、織、色、型、能、歌舞伎）を研究します。'
  source: https://ocw.kyoto-u.ac.jp/course/951/
  note: 京都大学OCW 「授業の概要目的」より（同サイトの利用条件に基づく転載）
