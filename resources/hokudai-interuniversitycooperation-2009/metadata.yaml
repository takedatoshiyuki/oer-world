name:
  ja: サステナビリティ・ウィーク 持続的アジア社会構築に向けた日中の総合的大学間協力（2009）
description:
  ja: 北海道大学と立命館大学のサステイナビリティ学の取り組みを背景に、中国と日本の大学連携を通じた持続的アジア構築を扱うシンポジウムである。中国の永続社会構築、アジアにおける循環社会、立命館大学の中国連携と孔子学院を題材に、日中大学間交流の成果と連携の可能性を議論する。
quotedDescription:
  text:
    ja: '北海道大学と立命館大学は、サステイナビリティ学の創成とその研究・教育を行うために、それぞれ独自にサステイナビリティ学の研究・教育を行うセンターを大学内に立ち上げてきました。

      昨今の世界状況から、世界の持続的な発展にはアジア地域、特に中国と日本の連携が多くの分野で欠かせません。

      本シンポジウムでは、持続的アジア構築に向けて、日本の大学が今後どの様に中国と連携をしていくべきかを探ります。

      プログラム

      ・2009年11月12日

      13:30 開会の挨拶

      大崎 満 （北海道大学サステイナビリティ学教育研究センター副センター長）

      13:40 趣旨説明

      田中 教幸 （北海道大学サステイナビリティ学教育研究センター教授）

      13:50 挨拶

      本郷 真紹 （立命館大学副総長）

      第一部 基調講演

      14:00 中国の永続社会構築への取組み

      張 国有 （北京大学副学長）

      14:40 持続的循環社会構築への道－アジアの重要性－

      吉田 文和 （北海道大学大学院公共政策学連携研究部教授）

      15:20- 15:30 休憩

      第二部 日中大学間連携協力交流で得たもの

      15:30 立命館大学の中国連携と孔子学院

      周?生 （立命館大学孔子学院学院長）

      第三部 パネル討論

      16:00 持続的アジア構築実現の日中大学連携の可能性

      司会：田中 教幸 （北海道大学サステイナビリティ学教育研究センター教授）

      パネリスト：講演者全員、野沢 俊敬 （北海道大学北京事務所所長）、張 偉雄 （札幌大学孔子学院学院長）

      17:00 閉会の挨拶

      佐々木 隆生 （北海道大学サステイナビリティ学教育研究センターセンター長）'
