quotedDescription:
  text:
    ja: '東京大学は、本年6月に「ダイバーシティ＆インクルージョン宣言（D&amp;I宣言）」を制定しました。

      本シンポジウムではこれを記念し、本学構成員、本学卒業生がそれぞれの視点から多様性と包摂性をテーマに課題を共有し、今後の取り組みと方向性を考えました。

      登壇者：藤井輝夫、矢口祐人、高野明、小川真理子、中野円佳、相原博昭、李美淑、Woodward, Jonathan、近藤武夫、星真梨子、林香里'
