name:
  ja: 大学院教育 現代都市文化論演習（2009）
description:
  ja: 現代都市文化と地域社会活性化を主題に、都市内部の地域共同体の営みを観察し、その価値意識を整理する講義である。教材には研究方法、リスク社会論、まちそだての基礎概念に加え、富良野・十勝・長沼の事例解説が含まれる。
quotedDescription:
  text:
    ja: 「持続的地域社会活性化」の営為について、基礎科学の知見に立脚した応用科学の方法を通じて考察する。具体的には、都市内部の地域的共同体（まち）構成員の営為の観察・考察を基づいて、その価値意識を類型化します。
  source: https://ocw.hokudai.ac.jp/lecture/urbanculture-2009
