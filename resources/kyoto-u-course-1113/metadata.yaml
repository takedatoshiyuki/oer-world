description:
  ja: ガリレオの言葉を手がかりに、新しい知見が新しい数理と結びついて生まれることを扱う。あわせて、赤外線天文学の成立から1960年代以降の進展までをたどる。
quotedDescription:
  text:
    ja: '1609年に望遠鏡で初の重要な天文観測を行なったガリレオが「最も偉大な書物、

      宇宙は数学という言語で書かれていて、その修得なしに宇宙を理解することはで

      きない」と書いたように、新しい知見はしばしば新しい数理とともに得られてき

      た。赤外線天文学はハーシェルの1800年の赤外線発見にさかのぼるものの、1960

      年代になってついに目覚ましい成果を生み始めた。私たちはそれを目撃し楽しめ

      る幸せな時代にいる！'
