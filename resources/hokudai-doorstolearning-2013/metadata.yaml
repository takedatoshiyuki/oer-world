name:
  ja: 全学教育 学問の世界（2013） ※学内限定
description:
  ja: 北海道大学の各学部・学科で扱う学問の概論を示し、学内の研究や問題意識にも触れる講義である。総合入試で入学した1年次学生を対象に、学問分野の全体像を把握し、移行先の学部・学科を考える手がかりを与える。
quotedDescription:
  text:
    ja: '総合入試で入学した1年次学生に対して，北海道大学の各学部・学科等における学問について，その概論を学ぶ。また，様々な学部の最新の研究あるいは問題意識を知ることによって，本学の学生としての自覚を持ち，本学でのこれからの勉学への意欲を高めます。

      本学で行われている様々な学問のおおよその全体像を理解し，同じ学部でも学科によって学ぶ内容が大きく異なったり，異なる学部でも同じような内容が学べたりすることを理解します。その上で，自分が本当に学びたいことは何なのか，将来どのようなことをしたいのか，どの学部が自分にあっているのかを十分に考えて，移行する学部・学科を決める参考にします。'
  source: https://ocw.hokudai.ac.jp/lecture/doorstolearning-2013
  note: 北海道大学OCW 「概要」より（著作権法32条の引用）
