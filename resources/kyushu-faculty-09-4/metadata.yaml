name:
  ja: コンピュータアーキテクチャI
description:
  ja: コンピュータの動作原理や、その実現に関わる構成要素、CPUの動作と構造を扱う講義教材である。あわせて、ハードウェアとソフトウェアの関係をOSやコンパイラも含めて考える視点を示す。教科書として『パターンソン＆ヘネシー
    コンピュータの構成と設計（上）第2版』を用いる。
quotedDescription:
  text:
    ja: "コンピュータの動作原理と、それを実現する構成要素、CPU の動作と構造を理解することが目的です。\nまた、 ハードウェアとソフトウェア (OS やコンパイラを含む) との関係という視点からの講義を行います。\n\
      なお、この講義では、\nDavid A. Patterson, John L. Hennessy（著） 成田 満彰（訳）\n『パターソン＆ヘネシー コンピュータの構成と設計（上）第２版』\n\
      \ （日経 BP 社 ISBN4-8222-8056-X ）\nを教科書として使用します。"
