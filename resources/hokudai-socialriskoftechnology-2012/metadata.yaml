name:
  ja: 北海道大学公開講座 私たちの未来とリスク 福島原発事故からみる科学技術の社会的リスク（2012）
description:
  ja: 福島原発事故を手がかりに、科学技術が社会にもたらすリスクと、その管理のあり方を考える講座である。安全規制や「原子力ムラ」、IT技術とロボット技術による無人兵器、遺伝子組み換え食品などを取り上げ、科学技術を社会がどう制御するかを扱う。
quotedDescription:
  text:
    ja: '科学技術は誰のものであり、誰が管理するものなのでしょう。福島原発事故は、人間が科学技術をコントロールしきれず、社会に多大な損害を与えましたが、その原因として安全規制の甘さや「原子力ムラ」の存在が指摘されました。IT技術とロボット技術の発達は、無人兵器を生み出す危険もはらんでいます。遺伝子組み換え食品のように、その技術の危険性がはっきりしていないものもあります。科学技術のリスクを社会はどうコントロールするべきなのでしょうか。

      鈴木　一人

      1993年立命館大学国際関係学部（飛び級のため）中退、英国サセックス大学欧州研究所博士課程修了。Ph.D（現代欧州研究／国際関係）。筑波大学国際総合学類専任講師、助教授を経て、2008年に北大公共政策大学院准教授、2011年に同教授。2012年3月から法学研究科教授。専門は国際政治経済学、科学技術政策。「民間事故調」のWGメンバーとして福島原発事故調査に参画。著書に『宇宙開発と国際政治』（岩波書店）、共著に『EUの規制力』（日本経済評論社）など。'
