name:
  ja: 公開講座 第4回環オホーツク海シンポジウム ～環境と水産資源の持続可能性：中国と北海道の研究協力に向けて～ （2008）
description:
  ja: 環オホーツク海地域の環境と水産資源を軸に、河川や海洋の汚染、海の恵み、持続可能性、研究ネットワークの構築を扱うシンポジウムである。中国側の事例と北海道側の事例を並べ、漁業への影響や環境支援、魚付林の保全、サケへの影響などの話題を含む。プログラムの一部を映像で紹介する。
quotedDescription:
  text:
    ja: '本シンポジウムでは、環オホーツク海地域の環境を広域に論じました。

      河川や海洋の環境汚染を防ぐことのみならず、川がもたらす海の恵みにも着目し、国境を越えた広大なシステムを将来にわたって持続可能な状態に保っていくことが極めて重要であるという認識を共有し、国際的な協調に向けた環オホーツク海の研究ネットワークの構築を模索します。

      ここでは、プログラムのうちいくつかを映像でご紹介しています。

      【プログラム】

      2009年3月24日

      13:00　開会の挨拶

      本堂武夫（北海道大学副学長・理事）

      森田康志（北海道開発局開発監理部次長）

      13:15　ニトロベンゼン漏洩事故による漁業への影響の調査および評価

      劉海金（中国水産科学研究院教授）

      14:00　揚子江と珠江の環境変化が水産業にもたらす影響

      李継龍（中国水産科学研究院教授）

      14:45　中国における環境支援

      加藤俊伸（国際協力機構（JICA）東・中央アジア部次長）

      15:30　休憩

      15:45　"巨大"魚付林の保全

      白岩孝行（総合地球環境学研究所／北海道大学低温科学研究所准教授）

      16:30　オホーツク海の環境が日本のサケに及ぼす影響

      帰山雅秀（北海道大学水産科学研究院教授）

      17:15　閉会の挨拶

      【関連情報】

      第2回　アムール・オホーツクコンソーシアム国際会合 (サステナビリティ・ウィーク2011オフィシャルサイト）'
