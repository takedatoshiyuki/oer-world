  ja: 映像研究の方法I
description:
  ja: 映像作品を分析するための方法を扱い、セグメンテーションとデクパージュの手引きや例を通して、分析の書き方を学ぶ教材である。課題と学生のエッセイ例も公開されており、映画作品の分析を繰り返し扱う構成になっている。
quotedDescription:
  text:
    ja: この演習では、論理的な文章の書き方、映像分析の方法を学び実際に練習を行いながら、文章力と分析力を養うことを目的としています。最初に、パラグラフの組み立て方、導入の仕方、論理展開の方法について基本的なことを練習します。そのあとで、4つの映画作品の分析エッセイを4回にわたって繰り返し書き、討論を積み重ねることで能力を高めます。同時に、セグメンテーション、デクパージュの書き方を習得するとともに、既成の論
  source: https://ocw.nagoya-u.jp/courses/0372-%E6%98%A0%E5%83%8F%E7%A0%94%E7%A9%B6%E3%81%AE%E6%96%B9%E6%B3%95I-2012/
