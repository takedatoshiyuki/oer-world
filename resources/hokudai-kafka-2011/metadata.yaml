name:
  ja: GCOE総合博物館市民セミナー プラハの作家カフカ（2011）
description:
  ja: ユダヤ系のドイツ語作家カフカの生涯と作品を、プラハという都市の歴史的背景とあわせて扱う講義である。ドイツ人とチェコ人の民族抗争があった時代状況のなかで、ドイツ語で創作したカフカの文学に現れる言語と民族の問題を考察する。
quotedDescription:
  text:
    ja: '「変身」や「審判」で知られる小説家カフカは、現在のチェコ共和国の首都プラハで生涯を送った、ユダヤ系のドイツ語作家です。彼の生まれた時代、チェコはまだハプスブルク帝国領で、プラハはドイツ人とチェコ人の深刻な民族抗争の舞台でした。そうしたなか、ドイツ語で創作する道を選んだユダヤ人カフカの文学に深く刻みこまれた、言語と民族の境界地帯を生きる人間のありようについて、考えてみたいと思います。

      ‡ これらの資料は制限資料です。'
