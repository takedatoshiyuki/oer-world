name:
  ja: Global Governance グローバル・ガバナンス論
description:
  ja: グローバル・ガバナンスの理論と主要論点を扱い、国家と非国家主体がどのように世界の統治に関与するかを概観する講義である。平和と安全保障、人権、金融、貿易、開発、環境などのテーマを通して、国家中心の国際関係を超える統治のあり方を取り上げる。
quotedDescription:
  text:
    ja: 'Introduction to the key theories and issues in global governance. It provides a comprehensive
      overview of the ways in which the world is governed by a variety of actors.

      平和と安全保障、民主主義と人権、通貨と金融、貿易と投資、開発と環境など多岐にわたるグローバル・イシューについて、国家や非国家主体が従来の国家中心の国際関係を超えてどう統治しようとしているのかを概観する。

