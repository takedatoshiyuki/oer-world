name:
  ja: Javaによるプログラミング入門
description:
  ja: Javaを使ったプログラミング入門の講義資料と参照コードをまとめた教材で、基礎文法から制御構造、メソッド、APIの利用までを順に扱う。さらに、オブジェクト指向の基礎概念、クラスの整理、入力処理や例外処理まで進み、写経型実習を通して学ぶ構成になっている。
quotedDescription:
  text:
    ja: '授業の特色

      興味を持つ人は多いが、一人で取り組むには敷居が高いプログラミング。本講習では写経型実習を通してそれに親しみ、オブジェクト指向の基礎概念の理解を目指す。

      授業の紹介

      プログラミングというと、「面白そうだ、役に立ちそうだ」「でも、難しそうだし、どうやって勉強したらいいのか分からない」という方は多いはずです。本講習では、中身を完全に理解できなくとも実際にプログラムを打ち込んで実行する写経型実習によって、プログラムに親しんでもらい、“最初の一歩”
      を踏み出すお手伝いを狙います。基礎的な文法と概念を学んだあと、最大の難関となる “オブジェクト指向” について、具体的な例と実習によって理解してもらうことを目指します。'
