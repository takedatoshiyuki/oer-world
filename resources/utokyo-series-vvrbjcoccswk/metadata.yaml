name:
  ja: 多彩な物質の世界－宇宙から地球への遥かな旅（学術俯瞰講義）
description:
  ja: 宇宙創世と質量の起源をめぐる素粒子実験や宇宙研究から、物質の性質を支配する法則、物質合成、創薬、材料開発までを「物質」を軸に概説する講義である。あわせて、物質科学の発展と人類・社会の活動を踏まえ、有限な地球環境を持続させるための考え方にも触れる。
quotedDescription:
  text:
    ja: '地球上の物質や我々の身体を構成するすべての原子は宇宙で作られた。私たちの物質に対する興味は広範囲にわたる。宇宙創世のその瞬間はどうなっていたか、身の周りに在る物質はどうして多彩な性質を持つのか、魅力ある性質を持つ天然には存在しない物質をどうしたら創れるか、生活をより便利にするための材料をどのように作ったらよいか、さらには、私たち人間は何処まで物質なのか、などなど限りがない。

      本講義では、「物質」をキーワードとして，宇宙創世の謎と質量の起源を解き明かす国際規模の素粒子実験、宇宙の果てを探る基礎研究、物質の性質を支配する法則とそれを応用した物質合成の科学、人のからだに作用する物質群と創薬研究，新たな物質社会を切り拓いていく材料開発の世界を概説する。最後に、物質科学の発展に支えられた人類・社会の活動によって、有限になりつつある地球の環境を持続させる智慧について考える。

      本講義はきっと皆さんに新しい物質観をもたらすに違いない。’狭い意味での理系’以外に、広い分野の理系学生はもとより、多数の文系学生の聴講を期待している。'
