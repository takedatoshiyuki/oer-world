name:
  ja: スーパーグローバルコース数学オンライン集中講義1 “Loop space decompositions in homotopy theory with applications to Poincaré
    Duality spaces”
description:
  ja: ホモトピー論におけるループ空間の分解方法を扱い、基礎的なCW複体の性質の理解に向けて議論を進める講義である。とくに Poincaré Duality complexes に焦点を当て、関連する予想やその結果にも触れる。公開資料として、講義資料が10件付属する。
quotedDescription:
  text:
    ja: 'A great challenge in homotopy theory is determining properties of the homotopy groups of finite
      simply-connected CW-complexes. One approach is to try to decompose the based loops on such a space
      into a product of more recognizable factors. In these talks we will investigate a new loop space
      decomposition method that applies to many interesting families of spaces, with special focus on
      various classes of Poincaré Duality complexes. Among the consequences are resolutions of instances
      of famous conjectures: by Moore on the relation between the torsion and rational homotopy groups,
      and by Gromov and Vigué-Poirrier on exponential growth in the rational homology of free loop spaces.

      1回目から5回目までの講義資料（板書）を、以下の資料（10）よりご覧いただけます。'
