name:
  ja: 2015年度 特別講義「大学と学問」
description:
  ja: 現代社会で生じているエネルギー・資源、産業・経済、食料、人口構成、格差社会といった問題を背景に、大学と学問の役割を考える講義である。科学と技術の進歩がもたらした影響を踏まえつつ、地球規模で捉える必要のある課題にどう向き合うかを扱う。基礎科学から創薬までの研究経験をもとに、大学における学問のあり方を考察する。
quotedDescription:
  text:
    ja: 課題の多い現代社会における、これからの大学と学問の在り方とは。 科学と技術の進歩は、人類社会に大きな発展をもたらした。しかし、一方ではエネルギー・資源に関する問題、産業・経済に関する問題、食料、人口構成、格差
      社会の問題などを生んだ。いずれの問題についても地球規模での認識と解決が必要である。基礎科学から創薬にまで繋がる研究に携わってきた経験と実感を交え て、これからの大学の役割と大学における学問について考える。
