name:
  ja: 第48回人環国際交流セミナー「三人の日本のランボー：石川啄木・宮沢賢治・中原中也」イブ-マリ・アリュー (Yves-Marie Allioux) 先生
description:
  ja: 石川啄木・宮沢賢治・中原中也の3人を、フランスの詩人アルチュール・ランボーと結びつけて考察する講義である。出典文では、3人の詩人をランボーと比較しながら論じる視点を示しつつ、想像力を一つの側面に限定する意図ではないとしている。
quotedDescription:
  text:
    ja: '概要

      石川啄木・宮沢賢治・中原中也、この３人の日本の大詩人は、しばしば、日本でもフランスでもランボーと比較されている。しかしながら、３人も日本にランボーがいて、さすがに少し度が過ぎるのではなかろうか。いずれにしても、私がこの日本の３人の詩人とフランスの詩人アルチュール・ランボーを結びつけて考察しようと思ったのは、決してそれらの想像力を一つの側面に限定しようとする意図からでもなければ、ヨーロッパ中心の解釈を押しつけようとするものでもない。'
