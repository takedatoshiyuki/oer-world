name:
  ja: オープンキャンパス アドミッションセンター 総合入試特別プログラム（2010）
description:
  ja: 北海道大学のオープンキャンパス当日の様子を映像で記録した教材である。講演と、2010年に導入される新入試制度「総合入試」の説明を中心に、入試や学生生活に関する個別相談会の内容も収める。
quotedDescription:
  text:
    ja: '北海道大学で行っているオープンキャンパスの模様を映像でご紹介しています。 当日お越しになれなかったみなさまも北海道大学の雰囲気を感じることができます。 どうぞご覧ください。

      ・2010年8月1日

      10:00　講演「学問のおもしろさとは」

      10:40　北大の新入試制度「総合入試」に関する説明

      ※北大の入試制度が新たに大きく変わります。受験生・保護者等にわかりやすく解説します。

      11:10　個別相談会（入試、学部所属前の初年次教育、授業料の免除制度、各種の奨学金制度、学生寮、学生生活、就職等）

      ※本学教職員及び在学生が北大に対する質問にお答えします。大学案内誌等の各種パンフレットもご用意しています。

      13:00　北大の新入試制度「総合入試」に関する説明

      ※北大の入試制度が新たに大きく変わります。受験生・保護者等にわかりやすく解説します。

      13:40　講演「学問のおもしろさとは」

      14:10　個別相談会（入試、学部所属前の初年次教育、授業料の免除制度、各種の奨学金制度、学生寮、学生生活、就職等）

      ※本学教職員及び在学生が北大に対する質問にお答えします。大学案内誌等の各種パンフレットもご用意しています。'
