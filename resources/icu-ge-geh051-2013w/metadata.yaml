name:
  ja: 'H2: Behavioral Sciences and Humanistic Sciences (A) Ｈ２：行動の科学・人間性の科学（Ａ）'
description:
  ja: 行動科学と人間性科学の知見を手がかりに、人間の行動の意味や社会生活、人間性を考察する講義である。あわせて、知覚、動機づけ、ストレスなど、人間行動を支える要素についても検討する。
quotedDescription:
  text:
    ja: 'Students are expected to gain a deeper understanding of the meaning of human behavior and various
      cues so as to consider the human nature and social life as revealed by recent development in the
      behavioral and humanistic science. This course aims to examine various issues such as perception,
      motivation and stress that underline human behavior.

      現代の行動科学と人間性科学の諸知見に照らして、人間の行動が持つ意味を深く理解し、社会生活や人間性についての考察を行うと同時に、人間行動を基礎づけている環境の知覚や動機づけ、ストレスなどの問題についても検討する。

      ※Video is partial recording of Course.(Recording on Febrary 20.)

      ※この動画はコースの一部を公開しています。(2月20日収録）

      ※Videos are condensed version of course.

