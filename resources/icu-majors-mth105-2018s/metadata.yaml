name:
  ja: Hot Topics in Mathematical Sciences 最先端の数理科学
description:
  ja: 数理科学の先端的な話題を取り上げ、大学数学の基礎から解析、幾何、代数、情報科学、物理学までを横断して扱う講義である。講義は、基礎的な概念の確認と研究トピックスの紹介を組み合わせ、数学の広がりと深さを示す構成になっている。
