name:
  ja: GCOE総合博物館市民セミナー 越境する中国のメディア（2011）
description:
  ja: 中国のメディアを対象に、インターネット、テレビ、新聞といった複数の媒体の動きを取り上げる。中国社会を映すメディアの現状を手がかりに、その最前線を紹介する講義である。
quotedDescription:
  text:
    ja: '『中国のメディア』と聞くと、皆さんはどのようなイメージをもたれるでしょう？ 中国共産党の強い統制…、インターネットに横行する海賊版コンテンツ…、尖閣諸島の漁船衝突など外交問題が発生すると、蔓延する排外的な言論…
      これらは確かに中国メディアの現状ではありますが、急速に拡大するインターネット上や、また、テレビや新聞などの伝統メディアでさえも、私たちの想像を超える新しい動きがあります。むしろ日本のメディアより、境界を越えようとするエネルギーに満ちあふれているようにも見えます。この講演では、中国社会を写すメディアの最前線をご紹介いたします。

      ‡ これらの資料は制限資料です。'
