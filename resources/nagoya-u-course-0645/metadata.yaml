name:
  ja: ミクロ経済学Ⅰ
description:
  ja: 効率的な資源配分と市場メカニズムを考えるための価格理論を扱う。前半では消費者の意思決定と需要、価格変化が需要や厚生に与える影響を分析し、後半では生産者の意思決定と供給、生産技術や費用構造の関係を数式やグラフで扱う。最後に競争均衡を導入し、市場を通じた取引がどのように機能するかをモデル化する。
quotedDescription:
  text:
    ja: 本講義では、効率的な資源配分と市場メカニズムの機能を分析する価格理論を扱います。講義の前半では、市場の需要サイドを決定する消費者の合理的意思決定を分析し、価格の変化が需要や消費者の厚生に与える効果を厳密に議論するための道具を提供します。講義の後半では、供給サイドを決定する生産者の合理的意思決定を分析し、生産技術や費用構造がどのように供給を決定するか数式やグラフを用いて分析します。これら需要と供給に関する理論を前提に、市場を通じて自由に取引が行われる状況をモデル分析するために「競争均衡」というコンセプトを導入し、市場メカニズムの機能を議論します。
