name:
  ja: 土曜市民セミナー 考古動物学から考えるアホウドリの歴史（2012）
description:
  ja: 本講義は、アホウドリの歴史を考古動物学の観点から扱う。遺跡から出土した骨の分析やDNA解析を通して、過去の日本列島における人とアホウドリの関わりを考える。
quotedDescription:
  text:
    ja: アホウドリ。この気の毒な鳥の名前をみなさん一度は耳にしたことがあるでしょう。翼を広げると2 ｍを超えるこの海鳥は、地上では動きが鈍く、またヒトを恐れません。19世紀末ごろから羽毛採取のために乱獲され、一時は絶滅したと考えられました。現在、主に伊豆諸島の鳥島と尖閣諸島の南小島・北小島で約3,000羽が繁殖しています。遺跡から発掘された骨の分析から、アホウドリは過去に日本列島に住んでいた人々にも盛んに利用されていたことが明らかになりました。DNA解析など様々な視点で遺跡から出土した骨を分析する科学、考古動物学からこの鳥の歴史について考えます。
  source: https://ocw.hokudai.ac.jp/lecture/albatross-2012
