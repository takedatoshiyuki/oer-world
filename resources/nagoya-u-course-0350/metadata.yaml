name:
  ja: 「よむ」って何？
description:
  ja: この教材は、表現された内容を受け止めるときに、媒体ごとの特質を踏まえる必要があることを扱う。文章に限らず、音や線など、異なる表現媒体に対して「よむ」ことを考える内容である。表現する側が理解されるために工夫する点にも触れる。
quotedDescription:
  text:
    ja: '誰かが表現しようとした内容をそのまま受け止めること、それは思いのほか簡単なことではありません（「現代文」の授業で悩んだことはありませんか？）。また文章だけでなく、表現の媒体には様々なものがあります。音（音楽、はなしことば・・・）線（まんが、デザイン、パフォーマンス、演劇・・・）などなど。媒体にはそれぞれ特質があり、そこに表現された内容を受けとめるためには、その特質を充分理解したうえで内容に到達しなければなりません。

      一方表現する人たちは「よむ」人たちに理解してもらうために、様々な工夫をします。そんな工夫を了解したうえで「よむ」ことを進めれば今まで気づかなかった世界が眼前に開けてくるかもしれません。'
