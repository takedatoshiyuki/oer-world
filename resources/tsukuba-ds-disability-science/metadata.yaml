name:
  ja: データサイエンス講義 障害科学におけるデータに基づく意思決定
description:
  ja: 障害科学においてデータが必要とされる理由と、障害に関係するデータの扱い方を取り上げる。あわせて、障害の見えやすさ・見えにくさを外れ値として捉え、福祉施設の事例を通して実践現場でのデータに基づく意思決定を扱う。
quotedDescription:
  text:
    ja: 障害のある人々への具体的なサポート、その基盤となる基礎的な研究を通して、人間の本質そのものを探究する学問が「障害科学」である。障害科学にデータが必要とされる理由や社会の側にある障害に焦点を当てるデータの性質を取り上げ、「障害」という言葉に関係するデータの繊細な取り扱いや「外れ値」としての障害の見えやすさ・見えにくさを解説する。そして、研究の文脈のみならず、データを実践現場で用いる「データに基づく意思決定」について福祉施設における事例を紹介する。
