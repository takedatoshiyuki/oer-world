  ja: 応用言語学方法論b
description:
  ja: 統語と意味の接点をめぐる複数の理論的枠組みを取り上げ、それらを比較する。語彙概念意味論、構文文法、フレーム意味論、生成語彙論などを通して、個別言語の事例研究を理論と結びつけて考える。
quotedDescription:
  text:
    ja: 'この授業では、「統語と意味の接点」(syntax-semantics interface) に関する代表的な理論的枠組み (語彙概念意味論、構文文法、フレーム意味論、生成語彙論など) を比較検討します。一般に、似た意味の語は似た振る舞いを見せます。例えば、「壊す」と「切る」という動詞は、ともに「～を壊す/切る」のように他動詞として用いられます。こうした統語と意味の関係をきれいに矛盾なく捉え切るのは、簡単そうに見えて実はものすごく難しい仕事で、そのため、これまでにいくつもの理論が生まれては消えてきました。この授業では、そうした複数の理論を見比べることで、言語研究において理論的枠組みを持つことの意義を学びます。「意義」には以下が含まれます。

      個別言語の事例研究 (例: 日本語の動詞研究) に一般言語学的な価値を与える。

      理論を通して見つめることで初めて気づくことがあることを体験する。

      複数の理論を見比べることで批判的・論理的思考を養う。'
