  ja: 基礎セミナージェンダーを学ぶ
description:
  ja: この教材は、ジェンダーを社会・文化的に構成された性として捉え、日常生活や社会の現象をその視点から問い直す内容を扱う。あわせて、文献検索、レジュメ作成、発表、討議といった基礎的な学習方法も取り上げる。公開資料には、ワークシート、課題、講義ノート、プレゼン資料、レジュメが含まれる。
quotedDescription:
  text:
    ja: ジェンダーとは、生物学的な性＝セックスに対して、社会・文化的に構成された性のことです。 本セミナーでは、日常生活や社会の様々な現象をジェンダーの視点から問い直す過程で、文献の検索方法、レジュメの作成方法、発表や討議の方法などの基礎を身に着けることをねらいとします。
