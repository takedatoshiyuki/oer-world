name:
  ja: 第9回 iCeMSラーニングラウンジ：Patrick Larpent + Wan-Ting Hong
description:
  ja: この講義では、2名の若手研究者が英語でそれぞれの研究を紹介する。1つは二酸化炭素の捕集に向けた「nano-pockets」の応用で、もう1つはスローロリスを例にした動物園動物の福祉の定量的評価である。動物の福祉をさまざまな環境で測る科学的手法にも言及する。
quotedDescription:
  text:
    ja: '概要

      「ラーニングラウンジ」では、毎回2名の若手研究者が自身の研究について英語でトークを行います。社会背景に関連づけた魅力的なトークにより、なぜ自分の研究が世界にとって重要なのか、専門外の方にもわかりやすく訴えかけます。

       

      Patrick Larpent（パトリック・ラルパント）さん

      “Nano-Pockets to Trap Carbon Dioxide”

      The dramatic and continuous increase of carbon dioxide emission responsible of global warming is
      a major problem for the welfare and future of our planet. The development and easy fabrication of
      state-of-the-art technologies capable of capturing carbon dioxide efficiently from their emission
      centers are therefore of crucial needs. Join us to learn about the innovating use of ‘nano-pockets’
      towards the realization of such novel molecule capturing systems.

       

      Wan-Ting Hong（ワンティン・ホン）さん

      “Zoo from Lorises’ Point of View”

      The well-being of zoo animals is now drawing much more attention than before. But how do we know
      whether animals are satisfied about their environment or not? Let’s look at slow lorises as an example
      of how well-being of zoo animals are measured quantitatively, in an effort to improve the lives
      of these small primates whose welfare is often overlooked.

      研究者コメント

      Animals think, perceive their environment and experience suffering and pleasure as we do. However,
      while doctors can ask human patients how they feel, we have no idea whether animals are happy, sad
      or stressed because we do not share a common language with them. Scientists have been trying to
      establish rigorous scientific methods to measure well-being of animals as pets, in zoos, laboratories,
      on farms and in the wild.'
