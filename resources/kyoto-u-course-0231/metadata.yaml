name:
  ja: エネルギー理工学研究所特別講演会（ZEセミナー）「エネルギーと生活満足度（アセアン非電化地区での調査から）」
description:
  ja: 東南アジアの非電化地区で行った調査をもとに、エネルギーが生活満足度にどう関わるかを扱う講演である。太陽光を含む電化システムについての調査結果を取り上げ、エネルギー利用と暮らしの満足度の関係を考える。
quotedDescription:
  text:
    ja: '概要

      エネルギーは人類の発展、とりわけ経済の発展とは密接な関係にありますが、 世界の人口の37%（UN：2018）ではクリーンで現代的なエネルギーを利用できない 状況です。ZE拠点ではその活動を通じてクリーンエネルギーの開発を行ってきています。

      一方で、エネルギーが人々の生活満足度にどれほど影響を与えるのか？という問いに対して、私たちは東南アジアの非電化地区の住民に対して調査を行ってきています。今回、太陽光を含む電化システムの生活満足度に関して学んだことをお話ししたいと思います。'
