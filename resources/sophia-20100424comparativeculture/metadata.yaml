name:
  ja: 'Shrine, Church, and State: The Borders between “Teaching” and “Religion”'
description:
  ja: この講義資料は、神社を宗教施設とみなすかどうかをめぐる戦前の議論と、1932年の靖国神社非参拝事件の経緯を扱う。あわせて、文部省が参拝を教育上の行為として位置づけた説明や、東アジア思想における「教」と神社の関係にも触れる。そこから、「教育」と「宗教」の境界を考える構成になっている。
quotedDescription:
  text:
    ja: "神社、教会、国家\n 「教」と「宗教」の境界線 \n 戦前の神社史において、もっとも争点となる問題はおそらく神社の性質の定義である。神社は宗教的な施設であるか否か。宗教的であるという立場から、１９３２年に上智大学の予科生が靖国神社に引率されたおり、数名が参拝を行わなかった。政府は逆に神社が宗教的な施設ではないとの観点を取ってはいたが、この時点まで、その立場の裏付けには主に神社と宗教団体が違う官僚組織の管理下にあったことに頼り、神社で実際に行われる行為などに関して立ち入った公式な所見を示すことを避けていた。しかし、上智の学生の非参拝が発端となって事態が複雑化するに至り、困難な状況を打開するため、文部省はそれまでの姿勢を変え、参拝の内容に関する見解を発表することになった。学生などを神社参拝させる目的は教育上の理由に基づき、参拝の場で要求される敬礼は愛国心と忠誠を現すものであると言明したのである。焦点を「宗教」から「教育」に移すことによって、折り合いの余地を作ろうとしたわけであるが、根底にある問題が乗り越えられたとは言えない。「教育」には「教」の観念が伏在するが、西洋から\
      \ religion （宗教）の概念が輸入される以前から、東アジアの伝統的思想における「教」と神社との関係が議論になっていたのであり、それは神社と「宗教」の関係についての問題とも絡まりあっていた。１９３２年の靖国神社非参拝事件の経緯や事後の対応の意義を理解するために以前の論争を視野に入れることは有効であろう。また異論が多い「国家神道」問題にも示唆を与えると思われる。\
      \ \n当日のチラシは こちら をご覧ください。"
