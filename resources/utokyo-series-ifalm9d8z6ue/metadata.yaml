name:
  ja: 東京大学公開講座：予測できる未来と、予測できない未来
description:
  ja: 地震予測が難しい理由を、実験の制約やデータの少なさ、破壊現象としての性質から考える講義である。さらに、精度の低い予測を公表することが社会にどのような影響を及ぼすかを、ラクイラ地震事件を手がかりに扱う。
quotedDescription:
  text:
    ja: '地震は「実験ができない」「超低頻度でデータが乏しい」「破壊現象で決定論が無理」などの理由から、精度の高い予測が難しいことを、例を示しながら解説します。

      また、社会からの強い要請のために精度の低い予測を公表せざるを得ない場合に何が起こるかを、イタリアのラクイラ地震事件を例に解説します。

      01:10　日本はなぜ地震国なのか？

      10:41　基礎知識

      20:56　科学的予測の経緯ー東日本大震災例にー

      28:57　全国地震…'
