name:
  ja: バイオミメティクス市民セミナー 博物館に学ぶ 博物館の自然史研究とバイオミメティクス （2012）
description:
  ja: 博物館に収蔵された生物標本を手がかりに、自然史研究とバイオミメティクスの接点を扱う。北大総合博物館で進められている、微小な昆虫標本の電子顕微鏡撮影とデータベース作製にも触れ、標本を介した生物学と工学の連携を紹介する。
quotedDescription:
  text:
    ja: 博物館の生物標本は、生物学者が集め、管理し、研究してきました。生物標本の「重要さ」を訴えるのも生物学者。大学研究者のなかで、標本を利用し研究をしている割合は２パーセント。標本の重要さは理解されても、その価値を直接評価する人はごくわずかでした。バイオミメティクス研究が盛んになるにつれ、工学研究者たちが生物のもつ様々なデザインを探していることを知りました。その規範となるデザイン・サンプルは、すべて博物館に揃っています。収蔵庫の標本箱には、38
      億年に渡る進化によって洗練されたデザインが、生物標本としてずらりと並んでいるのです。北大総合博物館では微小な昆虫標本の体表面を電子顕微鏡で撮影し、工学系研究者が技術開発の「気づき」を想起するためのデータベースを作製中です。その気づきは生物学にもフィードバックされます。博物館を舞台に、生物標本を仲立ちとした、生物学者と工学者の異分野交流が始まりました。あたらしい自然史系博物館の時代の到来かもしれません。
  source: https://ocw.hokudai.ac.jp/lecture/biomimetics-museum2012
