name:
  ja: 全学教育 英語IV All-English Training for Travel and Documentaries（2013）
description:
  ja: 英語のみで行う1学期の講義で、人と会う場面でのやり取り、アニメやドキュメンタリーのような短い映像の理解を扱う。あわせて、日常会話やドキュメンタリー番組でよく現れる語句を使って、話す・聞く・読む・書くことを扱う。
quotedDescription:
  text:
    ja: 'In this one-semester wholly-English course，students acquire skills to (a) meet people，(b) understand
      short videos such as anime and documentaries，and (c) say，hear，read and write using phrases that
      commonly appear in casual conversations or documentary programs.

      リンク

      http://goh.kawai.com/'
