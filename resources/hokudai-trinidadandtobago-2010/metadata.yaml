name:
  ja: 土曜市民セミナー トリニダードトバゴ共和国の歴史と文化、自然 …常夏の島…（2010）
description:
  ja: カリブ海の南端にあるトリニダード・トバゴ共和国を、2つの島から成る国として扱う。1492年のコロンブス到着以後の植民の歴史と、アフリカ系・インド系住民の系譜がつくる食文化や音楽、文化の重なりを取り上げる。あわせて、スチールパン、カリプソ、ソカ、リンボや、天然資源とマンパワーにも触れる。
quotedDescription:
  text:
    ja: 'トリニダード トバゴ共和国はカリブ海列島の南端に位置し、２つの主な島から成ります。

      １４９２年のコロンブス到着に始まる植民の歴史で、トリニダード トバゴは主にアフリカ系 及び、インド系住民が創り上げました。

      住民の系譜のこの二重性によって、食文化・音楽そして文化そのものがなお、それぞれに独自性を保ち、かつ 絡み合ってひとつの独特のものを作り上げています。（スチールパンやカリプソ、ソカ、リンボなど。）　豊かな天然資源とマンパワーによって、トリニダード
      トバゴは、この地域の発展の推進力となっています。'
