name:
  ja: Prostitution, Emigration and Nation-Building 1870-1930.
description:
  ja: この教材は、1870年から1930年にかけての日本人女性の性産業、海外移動、国家形成の関係を扱う。明治期の官僚的知識の再編や、日本政府が海外移動をめぐって促進と統制の両面をどう進めたかを論じる。あわせて、日本領事の役割が貿易・定住情報の収集から海外在住日本人の管理へ変化する流れを示す。
quotedDescription:
  text:
    ja: The focus of this presentation is on how the systematic restructuring of bureaucratic knowledge
      was instrumental in transforming Meiji sensibilities regarding the sex life of the poor. Sex and
      bureaucracy are considered opposite forces, but bureaucrats redefined peasant women finding work
      abroad, who had been understood as filial daughters, making them into ‘unsightly women abroad.’
      The spread of Japanese women engaging in sex work overseas intensified the discord the Japanese
      government faced over how to promote and facilitate and, at the same time, control and limit, the
      movement of Japanese subjects abroad. My talk will show how, over time, the Japanese consuls’ role
      of obtaining information relating to trade and settlement transformed into one concerned with the
      administration and control of Japanese living overseas.
