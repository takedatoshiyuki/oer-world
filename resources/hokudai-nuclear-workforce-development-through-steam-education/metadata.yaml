description:
  ja: STEAM教育の理論や実践を軸に、原子力・放射線教育を扱う教材である。放射線の基礎やエネルギー・環境概論、原子力防災の観点からの放射線教育などを含み、教育手法と関連分野の内容をあわせて構成する。
quotedDescription:
  text:
    ja: "STEAM教育手法を活用した原子力人材育成\n \nSTEAM教育論 米国との比較と日本の潮流と日本型のSTEAM教育を目指して（熊野 善介・静岡大学）CC BY-NC\n \n放射線の基礎（大矢\
