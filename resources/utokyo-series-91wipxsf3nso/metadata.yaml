description:
  ja: 火星の環境変化を手がかりに、宇宙において生命を育む星に必要な条件を考える講義である。かつて海を湛えた温暖な火星が、乾燥し極寒な気候へ移った過程にも触れながら、惑星のあり方を扱う。
quotedDescription:
  text:
    ja: 'この宇宙に，地球のように生命を育む星は存在するのでしょうか？火星という惑星はかつて，海を湛えた温暖な気候から， 乾燥し極寒な気候への大変動を経験しました．火星の研究を通じて，宇宙における生命を育む星の条件に迫ります．

      講師：黒川 宏之

      ★高校生と大学生のための金曜特別講座 

      ★あなたのシェアが、ほかの誰かの学びに繋がるかもしれません。

      お気に入りの講義・講演があればSNSなどでシェアをお願いします…'
