description:
  ja: 原子力施設の経年劣化と建設材料の耐久性評価を導入として扱い、社会基盤施設に用いるコンクリートと鋼材の建設、セメントコンクリートの材料特性の基礎を取り上げる。さらに、鉄筋コンクリート構造物について設計・施工・維持管理の観点を含めて整理する。
