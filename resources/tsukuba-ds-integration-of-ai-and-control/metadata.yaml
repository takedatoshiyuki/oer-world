    ja: 本講義では、実世界環境の物体をロボットが操作するための機械学習の応用例について紹介する。AIを用いてロボットを制御すれば容易にロボットが人間並の作業をできると思われがちであるが、これはなかなかに難しい。どのようなデータを用いればロボットを適切に操作できるのか、という実応用を通してデータを利活用するための問題意識と解決策を解説する。
