name:
  ja: 2011年度 京都大学新任教員教育セミナー
description:
  ja: 京都大学の新任教員教育セミナーの構成をまとめた教材で、冒頭に挨拶と趣旨説明を置き、その後に大学教育の動向や京都大学の方針を扱う講義が続く。さらに、京大生の学習と生活、全学共通教育、K.U.PROFILE、プレFD、教育サポート・リソースなど、京都大学の教育関連の取組を順に取り上げる。最後に「私の授業」を扱うミニ講義が収録されている。
quotedDescription:
  text:
    ja: '1 挨拶：松本 紘（京都大学総長）

      2 趣旨説明：田中 毎実（高等教育研究開発推進センター長）

      セッション１　ミニ講義１：「現在の大学教育の動向と京都大学のポリシー」

      3 淡路 敏之（教育・学生担当理事）

      セッション２　ミニ講義２：「京大生の学習と生活」

      4 高等教育開発推進センター准教授　溝上 慎一

      ミニ講義３：「京大の教育的取組」

      5 「全学共通教育（ポケゼミ）」

      少人数教育部会部会長　吉田 純

      6 「K.U.PROFILE」

      国際交流推進機構長　森 純一

      7 「プレFD」

      文学研究科准教授　出口 康夫

      8 「京大の教育サポート・リソース」

      高等教育研究開発推進センター

      ミニ講義４：「私の授業」

      9 理学研究科教授　戸部 博'
