name:
  ja: 数学展望-I
description:
  ja: 有理数を幾何学的な視点から捉え直す内容で、連分数から始めてフォードの円へと進み、最後に双曲幾何を扱う。連分数による有理数・無理数の表し方や、フォードの円との対応を通して、有理数同士の関係を考察する。講義の終盤では、円の反転を用いて双曲幾何を初等的に説明する。
quotedDescription:
  text:
    ja: 有理数を高校までとは全く違った視点から特に幾何学的に考察する方法を学ぶ。具体的には連分数、フォードの円、双曲幾何の順に解説する。連分数とは有理数を入れ子状の分数で表したものである。計算には向かないが面白い性質を多く持っており、有理数や無理数に対する新たな見地が開けるだろう。次に各有理数に対応したフォードの円を学ぶ。このフォードの円を使うと、有理数同士の関係が幾何学的に理解できるようになる。またこのフォードの円は連分数と大変相性がよいのも特色である。以上の有理数とフォードの円の対応は、実は双曲幾何学を通してみると自然に理解できるものとなっている。講義の終盤ではこの双曲幾何の解説をする。双曲幾何とは通常のユークリッド幾何とは違い、「平行線の公理」を仮定しないで成り立つ幾何学である。この双曲幾何を円の反転を用いて初等的に説明する。
  source: https://ocw.nagoya-u.jp/courses/0504-%E6%95%B0%E5%AD%A6%E5%B1%95%E6%9C%9B-I-2015/
