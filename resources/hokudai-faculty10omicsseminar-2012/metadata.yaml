name:
  ja: 経済学研究科・経済学部セミナー 「原発は是か非か!? －エネルギー政策と北海道経済－」 （2012）
description:
  ja: 福島の原発事故後の議論を背景に、原子力発電の継続か廃止かという論点を扱うセミナーである。工学的側面と政策的側面を手がかりに、エネルギー政策が北海道経済に与える影響まで考察する。
quotedDescription:
  text:
    ja: 本セミナーでは、福島の原発事故後精力的にそれぞれの研究分野から発信を続けておられます学識経験者をお招きし、工学的側面・政策的側面など、多角的見地からテーマを深く掘り下げていきます。北海道電力泊原発3号機の停止以降、国内の原発はすべて停止の状態です。今ここで改めて、原子力発電は継続すべきなのか、廃止すべきなのか。エネルギー政策の観点から、北海道経済への影響も絡めて、この論議を進めていきたいと考えます。
