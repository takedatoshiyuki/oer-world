  ja: 'Statistical physics on sparse random graphs: A mathematical perspective'
description:
  ja: 無秩序物質の理論モデルと組合せ最適化問題の典型的な複雑さとの関係を扱う講義である。離散変数の相互作用をランダムな木状の疎グラフとして捉え、その予測を証明する最近の進展と、スピングラス模型・ランダム行列・extremal
