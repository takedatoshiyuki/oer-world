name:
  ja: 言語と人間II
description:
  ja: 言語研究を中心に、隣接する諸分野との関係を広く扱う講義である。「言語と人間I」で学ぶ基礎を踏まえ、言語研究に直接・間接に関わる分野を見渡し、その動向を概観する。講義は各担当教員が2回ずつ担当する輪講形式で行う。
quotedDescription:
  text:
    ja: "多様な広がりをみせる人間言語の研究は本来学際的なものであり，隣接する諸分野との関係が特に重要になります。このコースでは「言語と人間Ⅰ」で学んだ基礎的な考え方をもとに，言語の研究に直接・間接にかかわってくる諸分野を幅広く見渡し，その動向を概観します。講義は，各担当教員が２回ずつ行う輪講形式です。なお，本講義は公開学習センターの開講科目ともなっています。\n\
      \ ＊「言語と人間Ⅰ」をあらかじめ受講していることが望ましい。"
