name:
  ja: 原子力人材育成事業（*） 機関連携強化による未来社会に向けた新たな原子力教育拠点の構築「中学校理科・モデル授業 持続可能な社会とエネルギー」
description:
  ja: 中学校理科の授業として、日本のエネルギー事情から発電方法の比較、北海道の電源構成やブラックアウトまでを順に扱う教材である。後半では、将来の電源構成、発電に伴う廃棄物、NIMBY問題を取り上げ、複数の視点からエネルギーの課題を考える構成になっている。
quotedDescription:
  text:
    ja: '中学校理科・モデル授業　持続可能な社会とエネルギー

      ー科学的根拠に基づいて、正解のない問題に対峙する資質・能力を育成するー

      ■授業内容

      ｢中学校理科・モデル授業　持続可能な社会とエネルギー」の教材は全て制限資料のライセンスで公開しています。

      イントロダクション

      第1時 日本のエネルギー事情を知る

      第2時 エネルギー基本計画、１日の必要な発電量

      第3時 発電方法の長所と短所

      第4時 東日本大震災前後での北海道電力の電源構成

      第5時 ブラックアウトが起きた理由

      第6時 北海道でつくることができる電力

      第7時 未来の電源構成を考える?

      第8時 未来の電源構成を考える?

      第9時 日本政府の電源構成案（2030年）

      第10時 電気をつくってできる廃棄物

      第11時 NIMBY問題をどうするか

      ※第11時の授業で紹介している動画は、以下のURLより視聴してください。

      「反対する人の理解どう得るか」福島県学生が寿都町長と意見交換 高レベル放射性廃棄物処分場選定に向けて (21/11/06 18:50), 北海道ニュースUHB

      https://youtu.be/gX1mWuC5-aY?si=9_FMmzSoqRLF5arO

      「地元だったら…」寿都町高校生が考える「核のごみ」復興途中の福島県訪れ向き合う"核の今と町の未来" (22/09/04 08:00), 北海道ニュースUHB

      https://youtu.be/ufyn4keZHnA?si=x5dTYqBQ_s6VFGuD'
