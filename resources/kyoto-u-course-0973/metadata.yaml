name:
  ja: 物理気候学, 2012
description:
  ja: 地球システム内のエネルギーの流れが気候をどう形づくるかを、大気科学の視点から扱う講義教材である。地質学的な気候変化や地球の基本データ、大気の状態方程式、熱力学、放射、大気境界層までを順に扱い、最後に気候数値モデルの導入へ進む。各回の資料として、イントロダクションから気候モデルまでの7件が公開されている。
quotedDescription:
  text:
    ja: 地球システム内のエネルギーの流れが気候を形成するが、その様々な形態について気候の記述ではなく大気科学の視点から講述する。具体的には、地質学的気候変化、惑星地球の基本データとその変化、大気放射学の基礎、混合気体の状態方程式、未飽和大気熱力学、飽和大気熱力学、雲・降水形成過程の入門、大気境界層の基礎、気候数値モデル紹介、などである。気候形成物理過程の基礎理解のため、大気の変化過程を記述する方程式を導出してその意味を解説し、実際への応用についても多数の図版を示しながら例示する。
  source: https://ocw.kyoto-u.ac.jp/course/973/
