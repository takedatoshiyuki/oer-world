name:
  ja: Transnational Migration and Asian Regional Integration:Examining the Migration Policies of Hong
    Kong and Tokyo
description:
  ja: 東京と香港を対象に、移民政策を比較する研究を扱う講義である。東京では区ごとの政策と移民受け入れへの対応を、香港では地方政府としての移民政策への対応を取り上げる。さらに、両都市の政策を比較し、政策共有の可能性や長所・短所を検討する。
quotedDescription:
  text:
    ja: 'Dr. Stephen Nagy started out doing research in Tokyo, finding out about government policies in
      the different district wards in the metropolis area and comparing policies regarding immigration
      and their reception.

       Upon moving to Hong Kong he began doing similar research in Hong Kong, looking at Hong Kong as
      a local government and how it deals with migrant policies.

       His work has since then become a comparative project between Tokyo and Hong Kong, looking at the
      possibility of sharing migration policies, as well as comparing the merits and demerits of the policies
      of both cities.'
