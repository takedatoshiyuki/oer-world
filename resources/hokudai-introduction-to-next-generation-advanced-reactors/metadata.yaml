name:
  ja: 原子力人材育成事業（*） 機関連携強化による未来社会に向けた新たな原子力教育拠点の構築「次世代革新炉概論」
description:
  ja: 次世代革新炉をテーマに、各炉型の特徴や開発の現状を項目ごとに扱う講義である。第4世代炉、高速炉、高温ガス炉、SMR、革新軽水炉に加え、燃料サイクル、再処理、規制、エネルギー政策までを含む。
quotedDescription:
  text:
    ja: "次世代革新炉概論\n \n原子力と資源循環ー第4世代炉の開発動向ー（上出 英樹・日本原子力研究開発機構）制限資料\n \niBRの特徴と開発の現状（青木 保高・東芝エネルギーシステムズ株式会社\
      \ 原子力システム設計部）★準備中\n \n金属燃料と金属燃料サイクル（尾形 孝成・一般財団法人 電力中央研究所 エネルギートランスフォーメーション研究本部）★準備中\n \n大型革新軽水炉HI-ABWRの概要（近藤\
      \ 貴夫・日立GEベルノバニュークリアエナジー株式会社）★準備中\n \n小型革新軽水炉BWRX-300の概要と海外の最新状況（木藤 和明・日立GEベルノバニュークリアエナジー株式会社）★準備中\n\
      \ \nエネルギー政策と次世代革新炉開発の動向（宮下 誠一・資源エネルギー庁）★準備中\n \n高速炉の特徴と開発の現状（若井 隆純・日本原子力研究開発機構 大洗原子力工学研究所 高速研究開発部）★準備中\n\
      \ \n燃料再処理技術のプロセスと工学システム（竹内 正行・日本原子力研究開発機構 大洗原子力工学研究所 戦略推進部）★準備中\n \n次世代革新炉の規制について（大村 哲臣・原子力規制庁）★準備中\n\
      \ \n高温ガス炉技術開発（角田 淳弥・日本原子力研究開発機構 大洗原子力工学研究所 高温工学試験研究炉部）★準備中\n \n超臨界圧水冷却炉の特徴と開発の現状 Supercritical Water-cooled\
      \ Reactor (SCWR)（山路 哲史・早稲田大学理工学術院 先進理工学研究科 共同原子力専攻）★準備中\n \n高温ガス炉燃料の製造（高橋 昌史・原子燃料工業株式会社 東海事業所）★準備中\n\
      \ \nNuScale SMRの特徴と開発の現状（小池 大介・株式会社IHI／森本 泰臣・日揮グローバル株式会社）★準備中\n \n今日と明日のエネルギーを形作る AP1000 & AP300TM　技術概要（東\
      \ 正剛・Westinghouse Electric Japan Limited）★準備中\n \n次世代革新炉開発の取組み（木村 芳貴・三菱重工業株式会社 原子力セグメント 原子力技術部）★準備中"
