name:
  ja: 2014年度 E.FORUM 教育研究セミナーⅡ「高大におけるカリキュラム改革を考える－探究力育成の視点から－」
description:
  ja: 高校と大学の教育接続をめぐる課題を背景に、高大それぞれで進むカリキュラム改革を扱う。高校での探究的な学習や大学での教育の質保証を踏まえ、探究力を育成するための改革のあり方を検討する内容である。
quotedDescription:
  text:
    ja: '趣旨

      大学全入時代を迎えて高校と大学の教育接続が改めて問われている現在、高大においては様々なカリキュラム改革が進んでいます。高校、特にスーパーサイエンスハイスクール（SSH）やスーパーグローバルハイスクール（SGH）では探究的な学習が重視されています。一方、大学では、「グローバル人材」の養成が強調され、教育の質保証が問われています。

      質の高い教養や専門性と結びつくような探究力を高校と大学の双方で保障していくためには、どのようなカリキュラム改革を構想すれば良いのか、高校教員と大学教員が集い、考えたいと思います。'
  source: https://ocw.kyoto-u.ac.jp/course/149/
  note: 京都大学OCW 「趣旨」より（同サイトの利用条件に基づく転載）
