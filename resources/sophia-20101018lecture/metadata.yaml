description:
  ja: 本講演は、不確実な時代における愛と結婚を、キリスト教の視点から考える内容である。人を愛すること、結婚の意味、そして「愛」としての神の呼びかけを手がかりに、愛し愛されて生きることのメッセージを扱う。
quotedDescription:
  text:
    ja: "不確実の時代における愛と結婚のキリスト教的ビジョン \n 人を好きになるのは簡単なこと。でも愛するのは…。\n 一人の人をずっと愛せる？結婚って何のためにあるの？\n 神様は私たちを「愛」と呼んでいる。愛し愛されて生きるように招いている。\n\
      \ 呼びかけの声に耳を傾け、そのメッセージを探ってみませんか？\n当日のチラシは こちら をご覧ください。"
