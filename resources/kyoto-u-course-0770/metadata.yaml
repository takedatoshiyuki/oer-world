name:
  ja: 2017年 若手パブリックヘルス研究者京都国際会議
description:
  ja: 本教材は、2017年に京都大学医学研究科が開催した若手パブリックヘルス研究者京都国際会議の記録である。会議では、医療制度、疾病予防、産業活動と健康、環境安全、健康と生活の質など、公衆衛生に関する複数のテーマの講演と発表を扱う。
