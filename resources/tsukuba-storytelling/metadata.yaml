name:
  ja: 「読み聞かせ方が幼児の読書能力に及ぼす影響」
description:
  ja: 幼児の読書能力に対して、どのような読み聞かせ方が影響するのかを検討する研究発表である。絵本の読み聞かせを扱い、その方法の違いと読書能力との関係を主題にする。
quotedDescription:
  text:
    ja: '村野亜子さん（筑波大学 大学院 図書館情報メディア研究科 博士前期課程）による「読み聞かせ方が幼児の読書能力に及ぼす影響」についての研究発表。

      子供の読書には、様々な効果があると言われており、「読み聞かせ」という経験が重要だと考えられている。しかし、絵本の読み聞かせ方は行う人や家庭によってバラバラである。どのような読み聞かせ方が幼児の読書能力に影響を与えるのかを検討することを目的として研究を行っている。'
  source: https://ocw.tsukuba.ac.jp/course/knowledge/storytelling/
