description:
  ja: 学生の研究プロジェクトを題材に、英語での発表と議論を行う演習科目である。自分の研究内容を発表できるようになることに加え、他の学生の研究内容についても細部まで議論することを目指す。
quotedDescription:
  text:
    ja: 'Outline and object of course

      Purposes of this course are to enhance presentation skill and to improve English communication skill
      through students’ research projects. All classes are held in English. A goal of this course is to
      reach the level to be able to present on students’ own research projects and to discuss on details
      not only in students’ own researches but also in other students’ researches (including Ph.D. students).
      Although it is possible for non-members of Bio-Sensing Engineering Laboratory to take this course,
      they need to be consulted with their supervisors because they have to also take their own seminars
      held at laboratories.'
