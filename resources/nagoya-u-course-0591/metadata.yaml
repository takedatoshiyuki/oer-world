name:
  ja: 西洋法制史
description:
  ja: 中世以降のフランスを中心に、法制度の変化だけでなく、法を取り巻く社会や担い手の動きも含めて法の歴史をたどる講義である。神判や魔女裁判、アンシャン・レジームの法制度、刑法改革、フランス革命期の近代刑法典の成立までを扱い、具体例や一次文献にも触れる。
quotedDescription:
  text:
    ja: 'この講義では、中世以降のフランスを中心とした法の歴史を、単に法制度だけでな く、法を取り巻く社会や広い意味での法の担い手たちの動向にも留意しながら、近代 法の形成されるナポレオン期までを取り扱うことにする。

      具体的には、イントロダクションのあと、中世ヨーロッパの神判や近世の魔女裁判について法社会史的な講義をし、時代のコンテクストの中で考えることの重要性を理解してもらうようにする。つぎに、アンシャン・レジームの法制度について概観し、いわゆる啓蒙時代の刑法改革の動きを
      18 世紀後半の冤罪事件と刑法改革思想、そして当時の法学者たちの反応について説明して、フランス革命期の近代刑法典の成立までを跡付け、最後に、革命をはさんで法制度や法曹や法学教育がどのように変化するのかを考察し、近代法の歴史的な意味を検討する。

      講義に際しては，具体的な事件や図像など示し、また一次文献に実際に接してもらうことによって、生き生きとした法の歴史を描き出すようにしたい。こうして、法を歴史的に奥行きのある視点で考察することが、今日の法制度の正確な理解と評価につながり、ひいては、批判的な検討も可能になるだろう。

      法をその時代の歴史的な文脈の中で考察することにより、過去の法がどのようなもので、社会のなかでどのような機能を果たしていたのかを理解する。こうして、単純な進歩史観から脱し、と同時に、近代法の正当な歴史的な意義を見失うことなく、評価・検討できる歴史的なセンスを獲得する。法の歩みにおける法律家たちの社会的な役割についても理解を深め、法の歴史におけるユマニテの重要性にも注意を向けるようにする。'
