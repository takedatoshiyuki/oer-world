  ja: データサイエンス講義 「心」のデータ：行動デザインの視点から
description:
  ja: 応用行動分析学を基礎に、対人相互作用を記述・予測・制御するための行動デザイン研究を扱う講義である。自閉スペクトラム症のある子どもを対象とした研究を主な例に、行動計測技術とデータを用いて心的現象を明らかにする方法を解説する。
quotedDescription:
  text:
    ja: 筑波大学行動デザイン研究室では，応用行動分析学を基礎とし，対人相互作用の記述・予測・制御に向けて，最新の行動計測技術を活用した行動デザイン研究を推進しています。本講義では，社会性の障害によって特徴づけられる，自閉スペクトラム症のある子どもを対象とした研究を主な例として，いかに，科学的・客観的なデータを通じて心的現象を明らかにしていくか，解説します。
