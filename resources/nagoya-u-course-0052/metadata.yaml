name:
  ja: ロシア語2
description:
  ja: 発音の基礎からロシア語の文法体系へ進み、文章読解に必要な基本事項を学ぶ。あわせて、辞書を使いながら文章を理論的に分析する力を身につけることを目指す。
quotedDescription:
  text:
    ja: この授業では、発音の仕方から始め、ロシア語の文法体系をきちんと、しかもできるだけ効率よく習得してゆき、文章読解などの際に必要不可欠となるロシア語の基本事項を学ぶことを主眼とします。そして、辞書を使いこなしつつ、自分の力で文章を理論的に分析していくことができるような能力を養い、言語に対する正確な作法というべきものを身につけてもらいます。これは、ロシア語の学習を将来も続け、ロシア語を実際に使用してゆくにあたっての第一歩であり、大切な基礎となるはずです。
