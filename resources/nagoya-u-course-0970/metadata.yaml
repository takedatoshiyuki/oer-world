quotedDescription:
  text:
    ja: 貿易や投資など、基本的には国ではない経済主体（企業など）の活動を、基本的には国の間の法である国際法（条約）が、どのように規制しているのでしょうか。経済に関するさまざまな分野における国際法上の主要な論点について、例えば、世界貿易機関（WTO）における日本産水産物等に対する韓国の輸入規制事件や、TPP協定（および包括的・先進的TPP協定）、日米貿易協定、投資条約に基づく仲裁（野村證券グループによるチェコでの投資に関するサルカ事件など）を取り上げながら授業します。
