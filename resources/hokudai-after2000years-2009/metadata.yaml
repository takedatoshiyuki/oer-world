name:
  ja: 北海道大学教育GP「博物館を舞台とした体験型全人教育の推進」 2000年後の美術館・博物館プロジェクト（2009）
description:
  ja: 本教材は、「2000年後から見た現代社会」というテーマにもとづき、41世紀に発掘された携帯電話やパソコンなどの化石を制作する活動を扱う。あわせて、全国各地の美術館・博物館で行われた、美術品や出土品とのコラボレーションによる展覧会や、市民・学生を巻き込んだアートプロジェクト、ワークショップを紹介する。
quotedDescription:
  text:
    ja: '演者は、イタリアのポンペイ遺跡などに触発され「２０００年後から見た現代社会」という壮大なテーマで、”４１世紀に発掘された携帯電話やパソコン等の化石”を制作しています。

      今回は、全国各地の美術館・博物館で美術品や出土品とコラボレーションし魅力を引き出す展覧会や、市民・学生を巻き込んで行ったアートプロジェクトやワークショップを紹介します。'
