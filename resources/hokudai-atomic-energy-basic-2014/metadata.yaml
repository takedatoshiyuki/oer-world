name:
  ja: 特別プログラム オープン教材の作成・活用による実践的原子力バックエンド教育 「基礎教育コース・講義」 （2014）
description:
  ja: 原子力バックエンド分野を扱う基礎教育用の講義で、関連する多様な専門分野の概論講義と基礎実験を含む。基礎教育の内容をオープン教材として作成し、公開することを目指す。
quotedDescription:
  text:
    ja: '国際原子力人材育成イニシアティブ事業

      機関横断的な人材育成事業

      本事業では、原子力バックエンド分野において、基礎教育、実践的な専門教育、国際教育の３つを行うことで、原子力バックエンド分野の研究開発を国際的にリードする人材を教育・育成を図ることを目的とします。

      基礎教育では、原子力バックエンド分野に関心を持つ学生が、原子力バックエンド分野がカバーしなければならない多様な専門分野に関する概論講義および基礎実験を受講できるコースです。

      また、基礎教育の内容をオープン教材として作成、公開することにより、一般市民の原子力および原子力バックエンド分野への理解を深める教材とすることを目指します。

      国際原子力人材育成イニシアティブ事業'
