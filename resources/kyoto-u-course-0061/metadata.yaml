name:
  ja: 第55回 京都大学品川セミナー「放射線に立ち向かう生命のたくましさ」
description:
  ja: 生命を、環境要因とのエネルギーのやり取りの中で成り立つものとして捉え、放射線との関係を考える内容である。自然放射線に対する生体の応答を生命のストレス応答として扱い、生命が放射線にどう向き合うかを示す。
quotedDescription:
  text:
    ja: 哲学者が命題とする“私はなに？”という単純な疑問は、最先端の生命科学者が持つ疑問 “生命はなに？”と全く同じものと言えるでしょう。それに対する解答は、“生命はエネルギーそのものである”と答えることができます。エネルギーは、原子を作り、原子は分子を作り、分子は様々な物質を作っており生命もその例からもれません。生命は、地球上に生まれ36億年の間、温度、圧力、放射線といった様々な物理化学的要因に満たされた環境で生き、それらのストレスから切り離されて存在したことはありません。言い換えれば、そうした“環境要因との間でエネルギーのやり取りをする営み自体が生きている”ことにほかなりません。生命は細胞膜で囲まれた極めて狭い空間に宇宙の法則に逆らった自立的な環境を作り出すために様々な進化を遂げてきたのです。従って、自然放射線を生命から切り離すことは不可能であって、その線量域における生体の放射線応答反応は、生命のストレス応答現象そのものであり“生命とはなにか？”に迫る鍵となる生命反応であると考えられます。本シンポジウムでは、生命が放射線に立ち向かうたくましさを備えていることを解説します。
