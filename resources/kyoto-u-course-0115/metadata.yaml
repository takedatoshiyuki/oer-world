name:
  ja: アルゴリズムとデータ構造入門
description:
  ja: この教材は、Scheme を用いてアルゴリズムとデータ構造の基礎を扱う講義の資料群である。手続きによる抽象化やデータによる抽象化、記号データ、複数の表現法、汎用演算システムなど、抽象データの扱い方に関する回が含まれる。あわせて
    TUT Scheme の利用資料や理解度テスト、講義内で課される演習・レポートに関する要素も公開されている。
quotedDescription:
  text:
    ja: '・TUT Scheme （湯淺先生小宮先生開発）を使用して講義を進める。

      ・当該年度の授業回数などに応じて一部省略、追加がありうる。

      ・2〜3回のプログラム演習・レポートを課す。中間テストを行う場合もある。

      ・習熟度の早い学生に対しては、参考書を使ってより高度な随意課題を課す等の配慮を行う。

      ・古典力学に興味のある学生Gerald Jay Sussmanらの著書"Structure and Interpretation of Classical Mechanics" (MIT Press,
      2001) を本講義の続きとして独習することを勧める。

      ・オンライン版フルテキスト (MIT Press 提供)'
  source: https://ocw.kyoto-u.ac.jp/course/115/
