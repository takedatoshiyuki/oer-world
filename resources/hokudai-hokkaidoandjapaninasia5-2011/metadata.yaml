name:
  ja: 北海道大学公開講座 アジアのなかの日本・北海道 第5回 土─地球の皮膚─を守る農業（2011）
description:
  ja: 地球表面の土の厚さや、食料生産に使われる土の割合を手がかりに、土壌の役割を扱う講義である。あわせて、20世紀以降に進む土壌劣化と、その具体的な現象を取り上げる。さらに自然の土の生成を見ながら、土を守る農業のあり方を考える。
quotedDescription:
  text:
    ja: 地球表面を取り巻く土の平均の厚さは18cm、地球半径の3500万分の1でしかありません。その10％を使って食料を生産しています。しかし、20世紀に入り世界中でつぎつぎと土壌劣化が顕在化し、食料生産への影響のみならず、土壌侵食、砂漠化、塩類化、アルカリ化、酸性化、土壌踏圧など環境への影響が懸念されています。自然の土の生成をみながら、土を守り環境を守る農業を考えます。
  source: https://ocw.hokudai.ac.jp/lecture/hokkaidoandjapaninasia5-2011
