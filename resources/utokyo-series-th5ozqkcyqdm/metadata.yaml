  ja: 近世ヨーロッパで形成された学問と、その代表例としてのアダム・スミスを手がかりに、西欧の知が東アジア、とくに日本へ伝わる過程を扱う講義である。明治維新以降の日本の近代化における西欧知の受容を軸に、アダム・スミスの受容と新渡戸稲造へのつながりにも触れる。
quotedDescription:
