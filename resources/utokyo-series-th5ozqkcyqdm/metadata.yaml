    ja: '近世ヨーロッパでは、経済学の創始者として有名なアダム・スミスをはじめ、近代の学問を形作る人物が出現した。明治維新以降、日本が近代化する際、それら西欧の知が基礎となった。西欧の知・学問の受容により、日本は、西欧に肩を並べる国になろうとしたのである。

