  ja: 自由曲面の編集と加工を行う簡単なCAD/CAMプログラムを作成しながら、設計・製造に関わる基礎的な数学とソフトウェア技術を扱う。内容にはJava 2のプログラミング、自由曲面生成、変換、ファイル入出力、工具経路とNCコード生成、自由曲面加工が含まれる。
quotedDescription:
  text:
    ja: 'Students will learn basic mathematics and software technologies of design and manufacturing by
      making a simple CAD/CAM program for editing and machining free-form surfaces.

