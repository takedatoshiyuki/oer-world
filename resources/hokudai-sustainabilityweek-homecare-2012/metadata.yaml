name:
  ja: サステナビリティ・ウィーク 安心した暮らしと在宅ケアを支える （2012）
description:
  ja: 日本の高齢化を背景に、日常生活での健康維持や在宅での看護・介護に関わる課題を取り上げる。内容は、在宅を中心とした安心した暮らしを支える健康科学・技術の紹介にある。
quotedDescription:
  text:
    ja: 急速に高齢化が進む日本では、日常生活の中で健康を維持管理できることが重要です。また、看護・介護が必要になっても在宅で安心な生活できれば、病院ベッド数の不足を解消するとともに、「自宅で最期を迎えたい」という国民意識にも適います。本セミナーは、在宅を中心に安心した暮らしを支えるための健康科学・技術に関する紹介です。
  source: https://ocw.hokudai.ac.jp/lecture/sustainabilityweek-homecare-2012
