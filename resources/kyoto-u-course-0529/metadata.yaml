name:
  ja: 学士課程における科学教育の未来
description:
  ja: 21世紀に必要な科学教育を、すべての学生にどう提供するかを扱う講義である。カール・E・ワイマンの講演と、複数の物理学者によるパネルディスカッションを通して、科学教育の未来を論じる。公開教材には、科学教育、文系学生への授業経験、大学での実験教育、指定討論の資料が含まれる。
quotedDescription:
  text:
    ja: 'カール・E・ワイマン講演：「21世紀の科学教育–科学のツールを用いて科学を教える–」

      パネルディスカッション：カール・E・ワイマン、坂東昌子、笹尾登

      21世紀に向けて必要な科学教育をすべての学生に提供するためには何が必要なのか。2001年ノーベル物理学賞受賞者で、世界の科学教育のリーダーでもあ るカール・ワイマンと、教育に情熱を注ぐ日本の第一線の物理学者とが、自らの実践をふまえながら、科学教育の未来について語りあう。'
  source: https://ocw.kyoto-u.ac.jp/course/529/
  note: 京都大学OCW 「講義概要」より（同サイトの利用条件に基づく転載）
