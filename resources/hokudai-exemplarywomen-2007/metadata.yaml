name:
  ja: 全学教育 漢文講読－『列女伝』を読む－（2007）
description:
  ja: 前漢の劉向が編んだ『列女伝』を素材に、漢文訓読法で代表的文章を精読する講義である。各伝記でどの場面が要点になるか、主人公の女性のどのような言動が評価されるかを確認しながら、劉向が女性をどう分類し、どのような目的で編纂したかを考察する。
quotedDescription:
  text:
    ja: '約二千年前、前漢の学者、劉向（前79?－前8?）が編んだ『列女伝』は、書名の示す通り、中国古代の女性伝記集である。そこには、いわゆる良妻賢母など、主として模範とされる女性の伝記が収録されるが、末尾には悪女の伝記も付されている。また後代には、各伝記に即して数種類の挿絵が描かれたという。

      本講義では、漢文講読の素材として、『列女伝』の代表的文章をとりあげ、漢文訓読法を用いながら精読する。その上で、次の問題について、受講者の諸君とともに考察したい。

      （１）各伝記のポイントとなる場面はどこか。

      （２）各伝記の主人公とされる女性について、そのいかなる言動が評価されたのか。

      （３）編者の劉向は、各伝記の女性をいかに分類したのか。また、劉向が『列女伝』を編纂したのは、いかなる目的からか。

      エクセレント・ティーチャー

      本講義を担当している弓巾和順教授は、

      平成19年度エクセレント・ティーチャーに選ばれています。

      授業実施上の取組・工夫などについては、

      こちらをご覧ください。'
