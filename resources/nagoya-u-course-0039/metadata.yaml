name:
  ja: 解析力学及び演習
description:
  ja: 解析力学を扱い、ラグランジェ形式にもとづいて複雑な系の運動を解析的に解く方法を学ぶ講義・演習である。あわせて、力学形式の基本的な考え方も取り上げる。
quotedDescription:
  text:
    ja: 物理学には「力学」「電磁気学」「熱・統計力学」「量子力学」など重要な学問体系がある。この中で、「解析力学」は力学体系のうち、数学的手法を用いる比較的高度な内容を含むものである。そもそも力学はニュートンの３原則をもととして体系化されている。そのなかでニュートンの運動方程式は物体の運動を記述するものであるが、この基礎方程式は、このほかにもラグランジェ形式とハミルトン形式からも導かれる。本講義・演習ではラグランジェ形式にもとづいて、複雑な系の運動を解析的に解くことを学ぶ。同時に背景にある力学形式の基本的考え方についても学習する。
