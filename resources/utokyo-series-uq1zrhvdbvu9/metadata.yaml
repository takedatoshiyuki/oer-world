name:
  ja: '#WeChange 女性幹部養成プログラム ネットワーキングイベント'
description:
  ja: 東京大学の女性リーダー育成施策「UTokyo 男女+協働改革#WeChange」の一環として行われた、女性教員向けのネットワーキングイベントを扱う。イベント冒頭の座談会では、理事・副学長や部局長経験者が参加し、幹部候補の女性教員を対象にした交流の場が設けられている。
quotedDescription:
  text:
    ja: '東京大学では、2022年度に始動した女性リーダー育成に向けた施策「UTokyo 男女+協働改革#WeChange」の一環として、昨年度より、女性研究者キャリアアップ支援を目的として「女性教員幹部養成コース」を試行実施しています。昨年度に引き続き、今年度も幹部候補の女性教員を対象とした、ネットワークイベントを開催しました。
      イベントの冒頭では、林香里理事・副学長と、部局長経験者である物性研究所 森初果教授、史料編纂所 本郷恵子教授が、田野井慶太朗 ジェンダー・エクイティ推進オフィス長のモデレートのもと、座談会を行いました。

      制作：東京大学 多様性包摂共創センター　ジェンダー・エクイティ推進オフィス'
