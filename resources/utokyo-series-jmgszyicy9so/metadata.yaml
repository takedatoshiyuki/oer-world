name:
  ja: 世界の中の日本、日本の中の世界：「国内で実施する国際研修」の挑戦
description:
  ja: 本講義は、学部生を海外に派遣する従来型の短期国際研修と、日本国内に海外大学の学部生を招いて本学の学部生と共に学ばせる短期国際研修を扱う。国内で行う国際研修の取り組みを主題とし、北海道大学と韓国・西江大学校の担当者を交えたシンポジウムとして構成される。
quotedDescription:
  text:
    ja: 近年、本学教養学部では、従来から行ってきた「本学の学部生を海外に送りだす短期国際研修」に加えて、「海外の大学の学部生を日本国内に呼び、本学の学部生とともに日本で学ばせる短期国際研修」という新しい試みをはじめました。そしてこのような試みは、他のアジアの大学でも広がっています。このシンポジウムでは、日本から北海道大学、韓国から西江大学校の担当者を招き、「自国内で行う国際研修」に関するこれまでの成果を…
