name:
  ja: 情報処理基礎演習
description:
  ja: この教材は、情報リテラシとプログラミングの二つの内容を扱う。前半では、インターネットや電子メール、ワープロ、表計算、プレゼンテーション、Webのしくみといった基本事項と、各種ソフトウェアを使う操作を学ぶ。後半では、Mac上のXcodeを用いてC言語の初歩的なプログラミング演習を行う。
quotedDescription:
  text:
    ja: 'この科目では、情報リテラシに関する内容とプログラミングに関する内容の大きく２つのことを学びます。

      情報リテラシに関する内容では、インターネットやその上でのサービスである電子メールなどのしくみ、ワープロによる文書作成、表計算、プレゼンテーション、Webのしくみなどを学びます。

      Webブラウザや電子メール、日本語ワードプロセッサなどを利用し、道具としてのパソコンの基本的操作を学習します。

      これらを通して、一般的な計算機システム利用のための知識を身につけることができます。

      プログラミングに関する内容では、Mac上のXcodeを用いて、初歩的なC言語プログラミングの演習を行います。

      プログラミングとは、与えられた問題を分析し、それを解くための手順、すなわち、アルゴリズムを見つけ、これをプログラミング言語で表現する作業です。実際にプログラムを作成することにより、プログラムの本質であるアルゴリズムの概念を理解することをめざします。'
