name:
  ja: ひらめき☆ときめきサイエンス サケは海からの贈り物（2008）
description:
  ja: この講義は、サケの生涯と、海の栄養を陸域へ運ぶ働きを扱う。道南の遊楽部川でシロザケの遡上やオジロワシを観察したのち、講義と質疑応答を行い、修了証書の授与まで含む。
quotedDescription:
  text:
    ja: 'サケは川で生まれて海に降り，大海原でエサをたくさん食べて，体が十分に大きくなると生まれた川に戻って産卵し，子孫を残してその一生を終えます。川をさかのぼって産卵するとき，サケはクマやワシなどの陸上動物に食べられたり，死体が分解することで，海の豊富な栄養素や物質を陸域に運びます。まさに，サケは海からの贈り物です。皆さん、自然の中でのサケの役割を学び、そして、そんなサケの様子を道南のユ－ラップ川に行って観察してみませんか。

      スケジュール

      8:40 　 受付開始（北大水産学部）

      9:00 　 開会式

      9:10 　 北大水産学部を出発

      11:00 　遊楽部川上流に到着。シロザケの遡上やオジロワシの観察会

      12:15 　遊楽部川中流へ移動。橋の上からシロザケの観察

      12:45 　八雲町総合保険福祉施設シルバープラザへ移動，昼食

      13:30 　帰山教授による講義

      14:30 　講義終了，質疑応答

      14:40 　原研究院長による修了証書「未来博士号(水産科学)」の授与式

      15:10 　北大水産学部へ出発，車内でアンケート記入

      17:00 　北大水産学部到着・解散

      リンク

      ・北海道大学水産学部

      ・日本学術振興会'
