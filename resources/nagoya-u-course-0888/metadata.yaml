quotedDescription:
  text:
    ja: 生産管理を行う上で必要な知識とその解法を身につけるため、生産管理における基本的な課題の理論的な理解を深めることを目的とする。本授業では、自動車に代表される工業製品の製造を行う生産システムを対象に、現代の企業が直面する諸課題を把握・分析し、課題解決に取り組むことができる能力の育成を行う。
