name:
  ja: 学部専門教育 政治経済学II（2008）
description:
  ja: この講義は、経済学の根拠と限界を近代市民社会と国家の関係から検討し、経済学のモデルの意味も整理する。さらに、生産と交換の視点から新古典派経済学と非新古典派経済学の違いを扱う。あわせて、グローバル化の進展の中で現れる国家と市場の限界に由来する問題群を取り上げ、現代政治経済学の課題を示す。
quotedDescription:
  text:
    ja: '（1）経済学の学問的根拠と限界を，近代市民社会と国家（State)の関係から明らかにする。

      （2）経済学のモデルの意味を明らかにし，その上で新古典派経済学と非新古典派経済学の相違を，生産と交換のパラダイムに基づいて説く。

      （3）グローバル化の進展する現代における国家と市場の限界から生じている問題群を示し，現代政治経済学の課題と基本的な探求方向を示す。'
