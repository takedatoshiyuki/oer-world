name:
  ja: ひらめき☆ときめきサイエンス MISSION:遺伝子コードを解読せよ！（2011）
description:
  ja: この講義は、遺伝子に記された情報と生物の特徴の関係を扱い、PCR法と電気泳動法を使う。対象はお米で、遺伝子を増幅して大きさを調べ、その結果を組み合わせて遺伝子コードを読み解く流れになっている。
quotedDescription:
  text:
    ja: '遺伝子には、生命をつかさどる情報がたくさん書き込まれています。科学技術が進歩したおかげで、植物や動物、わたしたち人間の遺伝子に書き込まれている、全ての情報が明らかになりました。遺伝子の情報がわかれば、さまざまな生物のもつ特徴を理解することができます。遺伝子研究の基本実験技術として世界の研究者がPCR
      法や電気泳動法を利用しています。

      このプログラムでは、調べたい遺伝子を人工的に増やすPCR 法と、その大きさを分析する電気泳動法を利用して、私たちが普段食べているお米の特徴を調べます。分析結果をパズルのように組み合わせて、お米のもっている遺伝子コードを解読しましょう！'
  source: https://ocw.hokudai.ac.jp/lecture/dna-2011
