  ja: 文系学部の1年生を対象に、大学での学術活動の基盤となる情報リテラシーを扱う。講義と実習を通じて、情報の伝達・収集・整理・分析に関わる技術の活用と必要な知識を身につけることを目指す。教材としては、シラバスと第1回オリエンテーションの講義ノートが公開されている。
quotedDescription:
  text:
    ja: 大学での学術的活動で基盤となる情報リテラシーの習得を目的としている。本授業では特に文系学部生向けに、情報の伝達・収集・整理・分析といった情報関連技術の活用能力およびそのために必要な知識を、講義と実習を通じて主体的に身につけることを目指す。情報関連技術は時代と共に急速に変化していくものであるため、現時点でのソフトの使い方や知識を覚えるよりも、自分で必要な情報を探したり使い方を考えたりする活動を重視し
