name:
  ja: 'N1: Foundations and Concepts of Physics (B) N1：物理学の基礎と概念（Ｂ）'
description:
  ja: この講義は、物理学の基礎と原理を歴史的な観点から扱い、あわせて科学の最新知識の概観も含む。さらに、物理的な世界の捉え方が哲学的な見方に及ぼす影響についても検討する。講義内容には、力学から流体、熱、電磁気、光、現代物理までの広い話題が並ぶ。
quotedDescription:
  text:
    ja: 'This course is designed to examine the foundation and principles of physics from a historical
      perspective. Providing an overview of the cutting-edge knowledge of science, this course also examines
      how one”s perception of the physical-material universe may affect one”s philosophical viewpoint.

      物理学の基礎や原理を歴史的な視点から考察し、また、最先端の科学的知識を概観するとともに、哲学的なものの見方にたいする自然観の影響について検討する。

      Contents of Lectures

      The Laws of Motion

      Mechanical Objects

      Feb 10

      Fluids

      Feb 1

      2

      Fluids and Motion

      Feb 1

      4

      Fluids and Motion

      Heat and Phase Transitions

      Thermodynamics

      Resonance and Mechanical Waves

      Electricity

      Magnetism and Electrodynamics

      Electromagnetic Waves

      Light

      Optics and Electronics

      Modern Physics*  (* Extent depends on time available.)'
