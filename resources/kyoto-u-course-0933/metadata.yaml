name:
  ja: 人文科学研究所 国際シンポジウム 「人種神話を解体する－Dismantling the Race Myth」
description:
  ja: 本シンポジウムは、人種をめぐる生物学的な見方が否定された後も社会に残る「人種神話」を扱う。見えない人種、科学と社会の共生産、血の政治学を越える混淆という三つの観点から議論し、日本・アジアの経験にも目を向ける。
quotedDescription:
  text:
    ja: '概要

      「人種」は、生物学的概念としての有効性が否定されて久しいが、今日でも社会的には根強く存在する。本シンポジウムでは、国内外からさまざまな分野の研究者を招いて、「見えない人種」の Invisibility,
      科学と社会の共生産による Knowledge, 「血」の政治学を越えての Hybridity の三つの角度から人種神話の解体を試みる。これまでの人種研究は環大西洋地域の経験に偏重するものであったが、本シンポジウムは日本・アジアの経験を重視しながら「見えないもの」「曖昧な存在」「はざまの領域」に光を当てることにより、人種研究の新たな地平を拓くことを目指す。

       

      主催：京都大学人文科学研究所

      共催：科研基盤（Ｓ）「人種表象の日本型グローバル研究」'
