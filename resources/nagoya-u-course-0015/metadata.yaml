name:
  ja: 中国西南の民族と歴史
description:
  ja: 中国西南部の少数民族が、中国伝統王朝の周縁で中国文明と接触しながら形成してきた歴史と文化を扱う講義である。中国王朝の立場で書かれた歴史文献を、西南民族の側から読み直すことで何が見えるかを考える内容で、比較の視点として中国と他のアジア諸国、近代の欧米とアジア諸国の関係にも触れる。
quotedDescription:
  text:
    ja: この講義で扱う中国西南部の少数民族は、中国伝統王朝の周縁にあって、つねに中国文明と接触しながら自らの歴史・文化を形成してきました。歴史文献は常に多数派、この場合でいうと中国王朝の立場から書かれるものですが、私はそれを、少数派である西南民族の立場から読み直したとき何が見えてくるかを、皆さんとともに考えたいと思います。またこのような見方は中国と他のアジア諸国、近代の欧米とアジア諸国といった関係を考える上でも有益なのではないかと考えています。
  source: https://ocw.nagoya-u.jp/courses/0015-%E4%B8%AD%E5%9B%BD%E8%A5%BF%E5%8D%97%E3%81%AE%E6%B0%91%E6%97%8F%E3%81%A8%E6%AD%B4%E5%8F%B2-2014/
