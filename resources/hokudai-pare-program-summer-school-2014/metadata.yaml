quotedDescription:
  text:
    ja: 'PAREプログラムとは、文科省平成24年度事業「大学の世界展開力強化事業」に採択された教育プログラムであり、正式名称を「人口・活動・資源・環境の負の連環を転換させるフロンティア人材育成プログラム」といいます。

      ここでは、グループで課題解決に取り組む短期研修「サマースクール」で最優秀賞を勝ち取った、Group 2によるプレゼンテーションをご紹介します。'
