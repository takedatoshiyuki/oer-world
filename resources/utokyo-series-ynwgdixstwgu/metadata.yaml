  ja: 動物の発生の仕組みを探し続けて40年（浅島誠最終講義）
description:
  ja: この講義は、発生生物学を軸に、卵から幼生への形づくり、器官形成、細胞の増殖と分化を扱う。あわせて、担当教員の略歴が掲載されており、研究内容と経歴を通して講義の位置づけを示している。
quotedDescription:
  text:
    ja: '【研究概要】

      発生生物学

      １．  「卵から幼生への形づくり」: 実験形態学から分子生物学まで

      ２．  器官形成の発生生物学

      ３．  細胞の増殖と分化の分子生物学的研究

      【教授略歴】

      1944年9月6日生まれ

      1967年  東京教育大学理学部卒業

      1972年  東京大学理学系大学院博士課程修了（理学博士）

      1972年  ドイツ・ベルリン自由大学分子生物学研究所研究員

      1974年  横浜市立大学文理学部助教授

      1986年  横浜市立大学文理学部教授

      1993年  東京大学教養学部教授

      1995年  東京大学　総長補佐

      1996年  東京大学大学院総合文化研究科教授

      1999年  東京大学大学院総合文化研究科．評議員（兼任）

      2001年  東京大学大学院総合文化研究科．学部長特別補佐

      2003年  東京大学大学院総合文化研究科長・教養学部長'
