name:
  ja: パターン認識及び演習
description:
  ja: 音声・画像・文字などの認識を対象に、パターン認識の基本的な考え方と識別理論、学習理論、各種アルゴリズムを扱う。あわせてコンピュータ演習を通じて具体的な問題を解く構成になっている。公開教材には講義資料や配布資料に加えて授業アンケートが含まれる。
quotedDescription:
  text:
    ja: '音声、画像、文字などを高精度で認識するパターン認識技術の基本的な考え方、識別理論、学習理論およびそれらのアルゴリズムを習得する。さらにコンピュータを用いた演習で具体的な問題を解き、理解を深めるとともに実際の場で本技術を適用できる応用力を身につける。達成目標は以下の二点である。

      パターン認識の基本概念を理解し、説明できる

      識別、学習のアルゴリズムを用いて具体的な問題を解ける'
  source: https://ocw.nagoya-u.jp/courses/0253-%E3%83%91%E3%82%BF%E3%83%BC%E3%83%B3%E8%AA%8D%E8%AD%98%E5%8F%8A%E3%81%B3%E6%BC%94%E7%BF%92-2011/
