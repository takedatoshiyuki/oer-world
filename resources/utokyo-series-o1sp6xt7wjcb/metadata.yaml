  ja: 俗ラテン語から中世末期・近代の入り口までのテキストを読み、現代スペイン語がどのように形づくられたかをたどる。あわせて、スペイン語の歴史と地理を通して、言語現象の成り立ちや地理的な変異を扱う。
quotedDescription:
  text:
    ja: 'この授業では、スペイン語の歴史を幅広く概観します。

      俗ラテン語から中世末期・近代の入り口までのさまざまなテキストを読みながら現代スペイン語の形成過程とその理由を探ります。

      私たちが学んでいるスペイン語の歴史と地理（「スペイン語の地理」をご覧ください）を探ることによって実用語学だけではわからないさまざまな言語現象の根 源的な理由や地理的なバリエーションの実態を知ることができれば，語学そのものへの興味がさらに増し，その効果も上がるのではないでしょうか。'
