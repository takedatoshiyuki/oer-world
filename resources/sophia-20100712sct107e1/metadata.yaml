name:
  ja: 基礎物理学
description:
  ja: 力学、電磁気学、熱力学を軸に、基礎概念の確認と復習を行う講義である。冒頭では微分やベクトル解析の基本事項を扱い、その後、運動方程式と保存則、さらに電荷・電流・電圧や静電場・静磁場の法則へと進む。熱力学では、熱・温度・圧力に関する基本法則を取り上げる。
quotedDescription:
  text:
    ja: この講義では力学、電磁気学、及び熱力学などの内容を復習し、基礎概念を理解する。始めに微分、ベクトル解析の基本的な事項について講義する。次に運動方程式から出発して、種々の保存則について説明する。電磁気学では、電荷、電流、電圧に関する基本概念と静電場，静磁場の基本法則について講義する。熱力学では、巨視的なスケールでの現象の記述における、熱、温度、圧力などに関する基本的法則について解説する。
