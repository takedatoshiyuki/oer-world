name:
  ja: 日本経済思想史
description:
  ja: この教材は、経済学説史と経済思想史の違いを手がかりに、慣習や行動、制度の中に埋め込まれた「経済観念」を考える。そこから、経済学の基礎概念を相対化し、経済史学の歴史的分析や歴史認識との関係を扱う。
quotedDescription:
  text:
    ja: 経済学説史が学問としての経済学の理論の変遷を追いかけるのに対して、経済思想史は、人々の慣習や行動、制度の中に埋め込まれている考え方＝「経済 観念」を明らかにすることを通して、経済学の分析の基礎となっている概念を相対化し、歴史的な分析＝経済史学研究によりリアルな分析道具を提供することに
      よって歴史認識を豊富化させ、ひいては経済学そのものにも基礎的な考え方に見直しを求め得るという役割を担う。
