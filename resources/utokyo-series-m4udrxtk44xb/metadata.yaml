description:
  ja: 東京大学本郷キャンパスで開催されたキックオフシンポジウムをもとに、文化政策が変化する状況を取り上げる。今後どのような展開があり得るか、またどのような課題があるかを、各界で活動する登壇者とともに検討する内容である。
quotedDescription:
  text:
    ja: "2017年6月19日、東京大学本郷キャンパスにて「文化を基軸とした融合型新産業創出研究ユニット」のキックオフシンポジウムを開催しました。本シンポジウムでは、文化政策が変化しつつある現状に照らし、今後に向けてどのような展開があり得るのか、どのような課題があるのかについて、各界の最先端で活躍する論客とともに探りました。\
