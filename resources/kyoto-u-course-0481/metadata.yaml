name:
  ja: 工学部オープンセミナー「ひと・社会・工学 －工学のいまを知る－」, 2017
description:
  ja: 京都大学工学部が2017年に開講したオープンセミナーで、鉄骨造建物の耐震に関する研究と、スピンを制御するスピントロニクスを扱う2本の講義からなる。前半では超巨大地震に備える建物設計の取組を、後半ではスピン流を含むスピン操作の考え方を紹介する。
quotedDescription:
  text:
    ja: '1「超巨大地震に備える—鉄骨造建物の最新の取組—」

      聲高 裕治（建築学科准教授）

      我が国で初めて鉄骨造の建物が造られてから100年あまりが経過しました。度重なる大地震のたびに設計法が見直され、より安全・安心な建物を造ることができるように、絶え間ない研究が続けられています。本講では、近年発生が危惧されている超巨大地震に対する最新の取組について紹介します。

       

       

      2「スピンを操る～スピントロニクス事始め～」

      白石 誠司（電気電子工学科教授）

      ナノテクノロジーの発展によって、人類は電子の持つスピンという機能を自由に操作できるようになり、「スピントロニクス」という新しい物理学の領域が創られました。本講では「スピン流」という新しい概念にも触れながらスピンを操る面白さを紹介します。'
