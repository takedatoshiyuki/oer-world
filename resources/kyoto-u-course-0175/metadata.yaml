  ja: Understanding Medical Education シリーズ①
description:
  ja: 医学教育研究で用いる基本的な理論枠組みを扱い、quantitative、qualitative、positivism、participatory などの考え方を紹介する。あわせて、それらの枠組みを研究にどう使うかを参加者と議論する。Understanding
    Medical Educationシリーズの第1回として、書籍第20章を取り上げる。
quotedDescription:
  text:
    ja: '11th KYOTO UNIV. MEDICAL EDUCATION INTERACTIVE SEMINAR

      日本でも医学教育研究への関心は高まりつつありますが、医学教育研究をする上での基本的理論にはどのようなものがあるか等を学ぶ機会はあまりありません。

      本セミナーでは、quantitative, qualitative, positivism, participatory など、基本的な医学教育研究の理論的フレームワークをいくつか紹介し、これらをどのように使う事ができるのかみなさんと議論をします。どれも医学教育研究の基礎的な理論ですので、幅広く医学教育にご関心のある方にはご参考になると思います。

      なお、医学教育推進センターでは、「Understanding Medical Educationシリーズ」 として、同名の書籍（T. Swanwick 編著、2010、Blackwell）についてセミナーを実施致します。今回はその第一回目として、同書第20章
      “Thinking about Research: frameworks, ethics and scholarship” を取り上げます。'
