name:
  ja: 第6回「京大おもろトーク：アートな京大を目指して」〜矛盾をはらんだ創造
description:
  ja: 京都という土地の歴史と文化、そこにアートが果たす役割、さらに京都大学がアートの発想を取り入れて変わろうとする試みを扱う講義である。公開資料はディスカッションの書き起こしで、第6回のテーマとして「矛盾をはらんだ創造」を掲げている。
quotedDescription:
  text:
    ja: 長い歴史と文化を持つ京都は、同時に常に最先端の動きを取り入れてきた町でもあります。アートはその伝統とモダンをつなぎ、新しい動きを創る力を持っています。いま京都大学はアートの発想を取り入れて、新しく生まれ変わろうとしています。京大おもろトークに参加して、その試みを目撃してみませんか？
      第6回目のテーマは、「矛盾をはらんだ創造」です。
