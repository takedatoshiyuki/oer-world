name:
  ja: MOOC時代の大学教育改善
description:
  ja: MOOCやOCWをはじめとする教育テクノロジーを、既存の授業や学習方法とどう組み合わせるかを扱う。あわせて、教授学習活動の可視化、分析、評価の方法とその適用を取り上げる。ハーバード大学のHarvardXやDerek
    Bok Center for Teaching and Learningの事例を踏まえ、日本の大学での教育改善を考える内容である。
quotedDescription:
  text:
    ja: 「人材・教育システムの国際化」、「産業界のニーズに対応した社会人の学び直し機会の拡大」、「大学教育の質保証・向上」、「教育情報の公開」、「教育イノベーションの創発」など、我が国の高等教育における喫緊の重要課題・目標に取り組むにあたり、インターネットやマルチメディア等のテクノロジーの教育利用は、大学における教育や学習を革新し進展させる大きな可能性を孕んでいる。MOOC（大規模オープンオンラインコース）や
      OCW（オープンコースウェア）などに代表される新たな教育技法や教材と既存の授業や学習方法を、どのように相乗的・相互補完的に活かしていくか。また、学生による主体的・能動的・実質的な学習を実現するために、教授学習活動の可視化、分析・評価を行う方法、そしてその実践的な適用などに国内外の大学の関心が高まっている。しかし、このような教育の進展を支えるための包括的な支援体制は、日本の大学において極めて乏しく未発達であり、必要とされるキャパシティづくりが急務である。本公開研究会・国際シンポジウムでは、ハーバード大学の
      MOOC プロジェクト HarvardX と世界的に著名な Derek Bok Center for Teaching and Learning の Faculty Director である
      Robert A. Lue 教授を基調講演者としてお招きし、同大学の先進的な試みや成果、これまで我が国の大学で推進されてきた教育制度改革や FD（ファカルティ・ディベロプメント）を踏まえ、教員の教育に対する情熱や学生の学ぶ意欲に基づいた真の教育イノベーションや教育改善のための具体的な方策を探索し、その可能性や課題について理解と議論を深めたい。
