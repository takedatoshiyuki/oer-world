name:
  ja: '[ポケット・ゼミ] メディアアート（映画監督養成講座）, 2014'
description:
  ja: 映像制作を通して、人の心に残る物語のしくみを探る講義である。物語と言語の関係や語り部の記憶、『スターウォーズ』を例にした英雄伝説の三段構造を扱い、その考え方に基づいて作品制作を行う。公開教材には学生レポートと学生作品が含まれる。
quotedDescription:
  text:
    ja: '授業の概要目的

      人の心に訴える映像制作を研究、制作を目的として、人々の心に残る物語のしくみについて研究する。

      物語と言語の関係、語り部の記憶とはなにか、物語の母型「スターウォーズ」英雄伝説の三段構造－その考え方に基づいて、実際に作品制作をする。'
