name:
  ja: Introduction to Algebras of Chiral Differential Operators
description:
  ja: 通常の微分作用素代数とその表現論への応用から始め、Beilinson-Drinfeld の枠組みにある Lie* 代数、coisson 代数、chiral 代数へ進む講義である。そこで vertex
    algebra 理論とのつながりを示したうえで、chiral differential operators の代数とその応用を扱う。
quotedDescription:
  text:
    ja: 'In these lectures we shall cover the following.

      (1) Ordinary algebras of differential operators. Applications to representation theory.

      (2) The Beilinson-Drinfeld categories: Lie* algebras, coisson algebras, chiral algebras. The purpose
      of this part will be to establish a link to the conventional vertex algebra theory.

      (3) Algebras of chiral differential operators.

      (4) Applications.'
