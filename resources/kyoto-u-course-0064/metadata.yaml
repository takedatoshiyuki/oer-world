name:
  ja: 西洋経済史A
description:
  ja: 本講義は、資本主義的生産システムの成立をめぐる「なぜ、いつ、どのように」を中心に扱う。大塚久雄と堀江英一の見解を整理し、近年の研究動向も取り入れながら論点を検討する。
quotedDescription:
  text:
    ja: '授業の特色

      なぜ、いつ、どのようにして資本主義的生産システムが成立したか？大塚久雄の見解と堀江英一の見解を対比・総合しつつ、近年の研究動向を適宜くみあわせつつ、解説します。 両者を検討する際には「先人の足跡を虚心坦懐に学ぶ」という姿勢をとりました。

      授業の紹介

      本講義は、日本における西洋経済史学がとりくんできた中心テーマ「なぜ、いつ、どのようにして資本主義的生産システムが成立したか？」を、５W1Hを明確にしつつ、緒論者の見解を整理しながら検討します。'
