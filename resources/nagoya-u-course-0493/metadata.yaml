name:
  ja: カリキュラム学講義Ⅱ／計画講義Ⅱ―現代の学力とカリキュラム
description:
  ja: カリキュラム学の基礎と日本の教育課程の動向を手がかりに、学力観の意味と位置づけを考える講義である。前半では、日本の教育改革の流れや国際学力比較調査、21世紀型能力、教育現場での実現可能性を多面的に扱う。公開教材には、講義予定のほか、学習指導要領や国際学力調査に関する資料が含まれる。
quotedDescription:
  text:
    ja: 本講義では、幅広い視野に立ってカリキュラム学の基礎ならびに日本の教育課程の動向に着目し、その底流を流れる学力観の意味と立ち位置を考える。前半では、A) 近年の国内の「教育改革」の系譜、B)
