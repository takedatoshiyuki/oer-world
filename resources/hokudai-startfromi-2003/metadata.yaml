name:
  ja: 全学教育 数学概論A 愛ではじまる微積分（2003）
description:
  ja: 複素数 i を用いる見方から微積分を捉え直し、複素数平面やべき級数、指数関数、オイラーの公式へと話を進める。さらに、線積分と留数、コーシーの積分定理、フーリエ級数まで扱い、既習の微積分と現代数学の基礎・応用を結びつける構成である。
quotedDescription:
  text:
    ja: '【講義概要】

      複素数 "i" を使った微積分の立場から，既習の微積分をもう一度見直し，現代数学の基礎と応用を概観する．

      なお，題名の「愛」は，言うまでもなく複素数 "i"(アイ)にかけた駄洒落だが，ややもすると無味乾燥に見えてしまう微積分が、複素数 "i" を使うことによって見通しが良くなり面白く感じられ，学生諸氏が少しでも数学を好きになってくれれば良いな，という願いもこめたネーミングである．

      「数理のこころを知りたいならば，愛で始めよ微積分」

      【スケジュール】

      1.  "i" と複素数

      2.  複素多項式

      3.  複素数平面

      4.  べき級数

      5.  指数関数

      6.  オイラー(Euler)の公式

      7.  円周率再論

      8.  三角関数再論

      9.  収束半径

      10. 項別微分

      11. 実関数の微分学再論

      12. 線積分と留数

      13. コーシー(Cauchy)の積分定理

      14. 実関数の積分学再論

      15. フーリエ(Fourier)級数'
