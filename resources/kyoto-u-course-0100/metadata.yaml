name:
  ja: 病理組織・細胞検査学実習
description:
  ja: 小動物を用いて、病理検査や生命科学研究に必要な細胞・組織の解析手順を実習する。臓器の摘出から固定、薄切、各種染色、標本観察までを扱い、細胞診の染色法も体験する。さらに、標本の観察結果をもとに学生同士で発表と討論を行う。
quotedDescription:
  text:
    ja: '授業の特色

      検査技術科学を専門とする学生が、病院での病理検査や生命科学研究を進める際に必要な細胞組織学的解析法の実際を学びます。小動物の扱い方、Power Pointを用いた発表方法も習熟します。

      授業の紹介

      病院での病理検査や生命科学研究を進める際に必要な細胞組織学的解析法の実際を小動物を用いて学びます。つまり、臓器の摘出、切り出し、固定、組織薄切、染色法（HE.染色、特殊染色、免疫染色など）の実際を行います。細胞診についてもギムザ染色、パパニコロウ染色法を体験します。また、小動物の扱い方にも習熟します。作製した標本を用い、諸臓器の組織形態を光学顕微鏡を用い観察します。顕微鏡写真を取り、諸臓器について、勉強したことを、学生同士でPower
      Pointを用いて発表、討論をし、理解を深めます。'
