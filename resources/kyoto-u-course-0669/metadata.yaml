name:
  ja: 生物機械計測学
description:
  ja: 自然界の色や植物・農産物の計測を手がかりに、マシンビジョンと各種センサの原理を学ぶ講義である。公開教材では、色の表現、照明、電磁波画像、分光反射特性、画像処理ソフトによる色・寸法・形状・欠陥の計測、さらに目の比較やセンサの方式までを扱う。
quotedDescription:
  text:
    ja: '現代は，規格化された工業製品だけでなく，自然界の植物，動物をも計測したり，制御・生産する時代である．本授業では，複雑で多様な自然現象および植物の挙動等に内在する法則，現象を理解すると同時に，不定形で多様な対象物を計測する装置およびその原理，構成，仕組みなどを学ぶ。これにより，自然界における工学的計測に関わる用語，知識を幅広く身に着けること，植物の成長，挙動に関連する特性およびルールが理解できること，計測装置を備えた生物機械システムの原理が理解容易となることを到達目標とする。

      具体的には，太陽と自然界の色のしくみ（夕焼けはなぜ赤いか？葉はなぜ緑色か？虹のできる理由など），マシンビジョンシステムとその計測（果実の色，形状，寸法，欠陥計測），各種センシングシステム，計測装置，ならびに信号処理に関して解説すると共に画像処理演習を行う。'
  source: https://ocw.kyoto-u.ac.jp/course/669/
  note: 京都大学OCW 「講義概要」より（同サイトの利用条件に基づく転載）
