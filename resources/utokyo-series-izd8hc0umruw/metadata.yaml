name:
  ja: 教育行財政学 I
description:
  ja: 近年の教育改革と教育政策の展開を手がかりに、教育行政学の基本的事柄を学ぶ講義である。国と自治体の教育行財政システム、教育政策決定過程、学校改革論議や改革課題を、マクロな政策的視点から扱う。
quotedDescription:
  text:
    ja: '日本の教育は現在、歴史的な転換点に立っていると言われており、教育行財政もその例外ではなく、大きな改革のときを迎えている。

      一方で、教育行財政システムは戦後の歴史的な流れにおいてきわめて独特な形態を形成、保持してきた。近年の日本の教育問題やそれに対する改革について考える上で、教育行財政システムに関する視点は欠かせないだろう。

      「教育行財政学Ⅰ」では、近年の教育改革と教育政策の展開を具体的に考えながら、教育行政学の基本的事柄を学習することをねらいとしている。マクロな政策的視点から、国と自治体の教育行財政システムや教育政策決定過程、また、近年の学校改革論議や改革課題について論じる。

      なお、続く「教育行財政学Ⅱ」では、学校経営的な視点から改革等を論じている。ご興味のある方は、「教育行財政学Ⅱ」をご覧下さい。'
