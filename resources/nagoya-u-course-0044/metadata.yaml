name:
  ja: 教育方法学講義-II-授業分析と教育の科学化
description:
  ja: 授業分析を軸に、授業で学習者が何を学び、何を実現しつつあるのかを捉える方法を扱う講義である。公開教材には、授業の観察と記録、逐語記録にもとづく分析、授業設計・実施・評価、協同的な教育実践研究に関する資料が含まれる。
quotedDescription:
  text:
    ja: 名古屋大学教育方法研究室では、教育の科学化を標榜し、50 年にわたり授業分析を研究の柱としてきた。本講義では、授業において学習者がどのようなことを学び，何を実現しつつあるのかをとらえるために、授業分析の方法を学ぶ。
