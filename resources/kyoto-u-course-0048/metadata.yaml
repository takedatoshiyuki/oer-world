name:
  ja: 第39回 京都大学品川セミナー「湖沼・海洋の微生物はダイナミックに生きている」
description:
  ja: 湖沼や海洋におけるプランクトンの食物連鎖を、微生物ループを軸に説明する講義である。植物プランクトン、細菌、原生動物、動物プランクトンの関係をたどりながら、微生物がどのようにつながっているかを扱う。あわせて、この仕組みが人間の生活に関わる点にも触れる。
quotedDescription:
  text:
    ja: '湖沼や海洋のプランクトンも、食物連鎖の中で生きています。プランクトンの中に は、細菌、植物プランクトンや原生動物などの微生物も含まれますが、これらの微生 物は微生物ループと呼ばれる食物連鎖を動かしています。少し詳しく述べますと、微
      生物ループでは、植物プランクトンが光合成により作りだした有機物の一部を溶存態 有機物（水に溶けた状態の有機物）として排出し、この有機物を細菌が栄養物質とし て食べて増殖し、増殖した細菌を原生動物が食べて、さらに原生動物がミジンコ等の
      動物プランクトンに捕食されることによって従来の生食連鎖（植物プランクトンが動 物プランクトンに食べられる食物連鎖）につながります。

      つまり、これまで単に分解 者として位置づけられていた細菌や原生生物は、実は微生物ループを通じて動物プラ ンクトンの餌資源としても貢献します。本セミナーでは、湖沼や海洋で微生物ループ がダイナミックに駆動している様子を紹介するとともに、微生物ループがいかに我々
      の生活にも重要であるか、分かり易く紹介します。'
