name:
  ja: 地域研究入門／INTRO. TO AREA STUDIES
description:
  ja: 地域研究の成立背景と、その後の展開を踏まえながら、地域研究に共通する姿勢や方法論、他分野との関係を学ぶ。あわせて、対象地域ごとに異なる地域研究のあり方を取り上げ、地域研究の多様な側面を扱う。
quotedDescription:
  text:
    ja: 20世紀後半の米国において、政策的な目的から特定地域の総合的理解を目指した学問として出発した地域研究は、その学際性を維持しつつ、政策性に過度に固執せず、より調査対象の現地に寄り添った学問へと展開してきた。対象地域により、その具体的なあり方は様々だが、本講義では地域研究としての共通の姿勢と方法論、他の学問分野との関係のあり方を学び、さらに対象地域別の地域研究のあり方の特質をみていくことで、地域研究の多様性を含めた理解を深める。総合グローバル学部の必修科目であり、AとBに分けて同一内容で開講されるので、自分が受講すべき授業を間違えないよう注意すること。
