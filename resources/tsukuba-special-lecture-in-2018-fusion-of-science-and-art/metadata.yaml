name:
  ja: 2018年度 特別講義「科学と芸術の融合 ”光のコスモロジー 生命発生から宇宙へ”」
description:
  ja: 宇宙ステーションJAXA JEM KIBOで2008年から行われた芸術実験を取り上げる講義である。あわせて、無重力環境や地球外からの視点が世界観に与える影響を、宇宙飛行士の体験やピラミッドなどの巨大遺構の検証を通して考察する。さらに、航空機を用いた学生の無重力フライト実験も扱う。
quotedDescription:
  text:
    ja: 「なぜ、人は宇宙を目指すのか」この問いに挑戦すべく、2008年から実施された宇宙ステーションJAXA JEM KIBOに於ける芸術実験について報告する。そして、無重力環境と地球外からの視点が新たな世界観を生むことを宇宙飛行士の体験やピラミッドなどの巨大な遺構の検証に基づいて考察する。また、航空機による学生無重力フライト実験についても紹介する。
