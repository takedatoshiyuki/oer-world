  ja: 本講義は、親密圏と公共圏の再編成をテーマに、理論と実証の両面から各国事例を検討する英語のリレー講義である。海外からの招聘教員2名が分担して講義を行い、国家や労働市場といったマクロな制度と、家族や親密な関係をめぐる変化との関係を扱う。
quotedDescription:
  text:
    ja: '授業の概要目的

      この講義は、２人の海外からの招聘教員による英語によるリレー講義です。「親密圏と公共圏の再編成」に関する理論的実証的な検討を各国の事例をもとに行います。２人の講師がそれぞれ講義します。

      京都大学グローバルCOEプログラム「親密圏と公共圏の再編成をめざすアジア拠点」

      グローバル化、高齢化など社会の基本条件を揺るがす大きな変動が起きている現代世界では、国家や労働市場などマクロな制度の再編成と、家族や親密な人間関係など私的な領域の変容が同時進行している。本COEではその両端の変化と相互関係に注意を向けながら、とりわけアジアに特徴的な諸問題（超低出生率、急速な高齢化、家族主義的福祉、国際移動の女性化等）の分析と解決をめざしている。

       

      拠点ページ：http://gcoe-intimacy.bun.kyoto-u.ac.jp/'
