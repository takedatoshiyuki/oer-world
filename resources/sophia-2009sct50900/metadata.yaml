name:
  ja: 科学技術英語２Ｃ（物理）
description:
  ja: 科学技術英語の系統的な学習の一部として、物理分野の英語文献を読むことと、物理用語の語彙を増やすことを扱う。あわせて、自然現象を英語で理解し表現することを目標にした講義資料が公開されている。
quotedDescription:
  text:
    ja: 科学技術に国境はなく，英語による情報収集，発信の重要性はますます高まっている。一方，科学技術の文献を読みこなし，様々な形で情報発信するためには，科学技術の文献独特の専門用語を熟知し，論旨を明確にし結論をはっきりと述べる必要がある。これは英会話や文学作品を読むことだけでは，身に付かない。科学技術英語IからVIは，こうした科学技術英語を系統的に学ぶ。なお，本課程は文部科学省から現代GP「グローバル社会における系統的科学英語教育」として支援を受けている。
      科学技術英語Ibでは，アメリカの高校生が使っている物理の教科書を読み，物理用語の語彙を増やすとともに自然現象の記述を英語で理解し，表現出来ることを目指す。
