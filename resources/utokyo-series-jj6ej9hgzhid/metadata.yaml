description:
  ja: 将棋で古くから用いられる格言を手がかりに、羽生善治が選んだ50の言葉を取り上げる講義である。各格言について、羽生自身の将棋の例や体験を大盤を使って示す。2013年度冬学期の全学体験ゼミナール「将棋で磨く知性と感性」の開講を機に特別に企画された。
quotedDescription:
