  ja: 学部専門教育 比較地域社会学 貧困・民族・生活の社会学（2005）
description:
  ja: 南北問題、貧困、発展、民族といったテーマを、発展途上国の人々の生活に即して考える講義である。公開教材には配布資料と講義スライドがあり、4つの講義回の題目が示されている。
quotedDescription:
  text:
    ja: 'なぜ発展途上国の人々は貧しいのだろうか？　そもそも貧困ってなんだろう？　なぜ民族紛争は起こっているのだろうか？　そもそも民族ってなんだろう？　発展途上国の人びとの生活と私たちはどうつながっているんだろうか？　この講義では、南北問題とは何か、貧困とは何か、発展とは何か、民族とは何か、といった問題を、なるべく具体的な“人々の生活”のレベルから考えます。

      1. モノから考える南北問題

      2. 「貧困」って何だ？

      3. 「民族」って何だ？

      4. 「村の生活」を考える'
