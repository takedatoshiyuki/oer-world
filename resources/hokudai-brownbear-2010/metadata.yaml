name:
  ja: 全学教育 北大総合博物館で学ぼう、ヒグマ学入門（2010）
description:
  ja: ヒグマに関連する各専門家の研究成果を取り上げ、ヒグマを手がかりに自然と社会の関係を考える講義である。内容には、旧石器時代から人類とクマが関わってきたことや、アイヌをはじめとする極東諸民族との関係も含まれる。
quotedDescription:
  text:
    ja: クマは食物連鎖の頂部にあって、古く旧石器時代から人類と緊張のある関わりをもってきました。とくにアイヌをはじめ極東諸民族はクマにたいして深い畏敬と敬愛の念をいだき、独特の付き合いをしてきたことが知られています。日本列島最大の陸上哺乳動物であるヒグマに関連するする各専門家の最新の研究成果を学んで、ヒグマを通して自然と社会の関係を考えましょう。
  source: https://ocw.hokudai.ac.jp/lecture/brownbear-2010
