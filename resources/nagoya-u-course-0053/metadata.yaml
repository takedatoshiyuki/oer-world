name:
  ja: ポスト・ローマ期ヨーロッパの表象構造
description:
  ja: ポスト・ローマ期ヨーロッパの表象構造を主題とする名古屋大学の2006年前期講義で、講義ノートと参考資料の模範答案が公開されている。教材には、ラテン語の会話の消滅や文字表象、キルペリクス指令、エヒテルナッハに関する項目が含まれる。
quotedDescription:
  text:
    ja: この授業は「特殊研究」という授業科目で、毎回新しい主題が設定され、リーピートはない。 2006 年前期が、上記のテーマでの講義である。授業の目的は関連分野での最新の知見に基づき、オリジナリティのある発見的思考を養う訓練でもある。選ばれた主題を解明するために、どのような論点を設定し、どのような記録を利用し、どのような事実を相互に関連づけて議論を展開したらよいか、教師に取ってその実演の場であり、受講生に思考のレベルで追体験と検証を求める機会と位置づけている。歴史学的思考の作法を学んで貰う機会であり、同時にそれ自体完全にオリジナルな一つの研究でもある。
  source: https://ocw.nagoya-u.jp/courses/0053-%E3%83%9D%E3%82%B9%E3%83%88%E3%83%BB%E3%83%AD%E3%83%BC%E3%83%9E%E6%9C%9F%E3%83%A8%E3%83%BC%E3%83%AD%E3%83%83%E3%83%91%E3%81%AE%E8%A1%A8%E8%B1%A1%E6%A7%8B%E9%80%A0%E2%80%94%E3%82%B3%E3%83%9F%E3%83%A5%E3%83%8B%E3%82%B1%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3%E8%A1%8C%E7%82%BA%E3%81%AE%E6%AD%B4%E5%8F%B2%E7%9A%84%E8%80%83%E5%AF%9F(1)%E2%80%94-2006/
