description:
  ja: 言語の教え方と学び方を主題に、世界各国の言語教育を検討する講義である。第一言語と第二言語の定義や第二言語習得の理論に加え、言語喪失、教授法、バイリンガル教育、言語帝国主義などの論点を取り上げる。
quotedDescription:
  text:
    ja: 'This course focuses on the teaching and learning of languages with discussions of the methods
      of teaching languages, learning strategies and language education around the world.

      言語教育・言語学習の視点から、各国における教授法・学習ストラテジー・言語教育等について検討・考察する。

