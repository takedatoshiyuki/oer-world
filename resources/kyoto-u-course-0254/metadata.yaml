name:
  ja: 第107回 京都大学丸の内セミナー「不均質な媒質が惹き起こす奇妙な現象」
description:
  ja: 熱や波動の伝播を例に、媒質を均質とみなす場合の記述と、不純物を含む不均質な媒質の模型を対比して扱う。ランダムに不純物が入る模型で、少量の不純物が系の挙動に与える影響を取り上げる講義である。
quotedDescription:
  text:
    ja: '講師からの補足：

      非対称ランダムウォークの分散の計算が間違っています．

      正しい値はnではなく24n/25です．なおこれは講義の内容には影響しません．

      　熱や波動の伝播を始めとるする物理現象は媒質が均質だと仮定すると 単純な微分方程式によって記述され，その挙動は比較的よく分かってい ます．一方で現実的には媒質にわずかな不純物が含まれる可能性は否定
      できません．従って微視的に不均質な模型を考えて，それが均質さを仮 定した模型とどれくらい違う振る舞いをするのかを研究することは重要 な問題です．この講演では不純物がランダムに含まれているような模型
      においては，わずかな不純物が系の振る舞いに大きな影響を与える場合 があることを紹介します。'
