name:
  ja: 学術フロンティア講義「30年後の世界へ― 空気はいかに価値化されるべきか」
description:
  ja: この講義は、気候変動やカーボン・ニュートラルを背景に、空気をどのように価値づけるかを考える。空気を物質としてだけでなく、人間の関係性や社会的共通資本と結びつく〈場〉として捉え、価値概念や社会経済システムのあり方を分野横断で検討する。
quotedDescription:
  text:
    ja: '東アジア藝文書院は、2019年度の発足以来、「30年後の世界へ」をテーマとして毎年オムニバス講義を行ってきた。今年度は「空気の価値化」について考えたい。

      　グローバルな気候変動が人類の生存を危機に晒している。2050年のカーボン・ニュートラル実現が人類共通の目標に据えられているが、専門家の中には2030年までが目標達成のために具体的な手立てを講じ得る最後のチャンスであるとの声もある。現に猛暑や異常渇水、巨大水害、森林火災などが世界中で深刻な被害をもたらしている。温室効果ガスの排出を止めるためには、少なくとも化石燃料の使用を制限しなければならないが、一方で、人々の安全かつ健やかなくらしのために、機械的な空気調和が欠かせないのも事実だ。わたしたちは、炭素化合物を排出して空気の条件そのものに人為的変更を加えながら、悪化した空気を局部的に調整するためにさらなるエネルギー消費を行うという矛盾した経済活動のことを文明と称している。

      　たしかにわたしたちは空気なしでは生活できない。空気を条件づけること（air conditioning）はしたがって、人間を条件づけること（human conditioning）である。だからこそ、わたしたちは空気に独自の価値を見出さなければならない。空気において新たな価値は創造できるだろうか？だが、そもそも空気に価値を見出すとはいかなることなのだろうか？この講義ではこれらの問いについて、分野を越えて議論したい。

      　新たな価値の創造は産業社会の革新的発展の原動力であり、豊かな明るい未来の到来を予感させる。だが、こうした期待には、価値とは交換価値であるという前提がある。だが、近代文明がそのように価値を矮小化してしまったために、人類は大きな代価を払っている。直接人類の文明生活が脅かされているだけではない。あらゆる生命を育む地球の生態環境全体が深刻に脅かされている。本来、地球は生きとし生けるものたちすべてにとっての「コモンズ」であるはずであり、その価値は交換価値によってだけ測られるものではない。

      　交換価値の外側には、価値にならない価値、非価値の価値が見出されるべきである。それを指標化するために「社会的共通資本」という概念がある。空気に価値があるとすれば、それはまず社会的共通資本としての価値であろう。その価値は交換価値よりも、交換を可能にする基礎要件に近い。ところで、交換は資本主義や近代社会に特有なものではない。人間の活動にはつねに何らかの交換がつきまとっている。つまり、交換によって媒介される人間活動は交換価値に先立って存在している。人間の行為に交換が付きまとっているということは、人間が関係性によって成り立つ動物だということを示す。人は空気なしに生きられない。だがそれは、生命維持に不可欠な物質としての空気への依存のみを意味するのではない。空気が交換を可能にする基礎要件であるということは、空気はまた、人の関係性を成立させるための〈場〉でもあるということを意味している。空気をよくしていくことは、したがって、関係性を生み出したり、促進したりすることでもあり、関係性はすべて交換価値に還元できるわけではない。

      　つまるところ、「空気の価値化」とは、物質であると同時に多様な関係を取り結ぶ〈場〉としての機能をも有する空気に独自の価値を見出すべく、非価値の価値に光を当てようとする創造的試みである。空気の価値を創造することは、価値概念の変容をもたらし、したがって、人間に対する理解のありようを変容させることにつながる。特に、関係性は人と人のみならず、自然の万物や超越との関係性を含むし、今日、関係性の〈場〉には物理空間のみならずサイバー空間までが含まれるはずだ。

      　カーボン・ニュートラルの実現が、人のよりよき生を顧みることのないままに目指されることになれば、2050年にわたしたちが見出すのはディストピアの光景であるかもしれない。「空気はいかに価値化されるべきか」という問いは、価値概念の見直しから始めて、万物のよりよき共生的関係を可能にする社会経済システムを考えるプロジェクトである。これこそはいまアカデミアが果たすべき役割の中心であるにちがいない。'
