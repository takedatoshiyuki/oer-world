name:
  ja: GraSPP20周年記念シンポジウム-EBPMと政治
description:
  ja: 公共政策分野で広がってきたEBPMの流れを背景に、政策立案の変化を扱うシンポジウムである。東京大学公共政策大学院がこれまで担ってきた役割を振り返り、今後の政策決定で果たすべき役割を考える内容を含む。教員に加えて現役国会議員も登壇する。
quotedDescription:
  text:
    ja: 公共政策分野では過去20年で政策立案の流れが大きく変化し、政策の企画をその場限りのエピソードに頼るのではなく、政策目的を明確化したうえで合理的根拠（エビデンス）に基づくEBPMを推進する流れが強くなってきている。本シンポジウムでは、当大学院の教員に加え、現役国会議員の方々にもご登壇いただき、今まで当大学院が果たしてきた役割を振り返るとともに、こうした流れの変化の中で当大学院が政策決定において果たすべき役割を展望することを予定している。
  source: https://ch.u-tokyo.ac.jp/series/?id=p9oviDzScCEz
