name:
  ja: 'S2: Media and Cultural Signs S２：メディアと記号'
description:
  ja: メディアを通して社会的に構築される意味を、文化記号論の立場から考える講義である。記号論の理論を踏まえつつ、メディアスポーツを題材にジェンダー、人種、国民、企業、スターなどの観点から記号を読む実践を扱う。後半には受講者の研究発表や、ジェンダーと身体イメージ、メディアと記号をめぐる討議も含まれる。
quotedDescription:
  text:
    ja: '様々なメディアを通して構築される私たちの周りの世界の意味を読み解いていく。文化記号論的な考え方に基づき、日常の「当たり前」を見直すために、多様な記号のクリティカルな意味解釈を試みる。

      The course examines how meaning is socially constructed through media. Semiotic analysis allows
      us to reveal the meanings of various signs which we may overlook in everyday life and to open up
      the possibility of different interpretation

