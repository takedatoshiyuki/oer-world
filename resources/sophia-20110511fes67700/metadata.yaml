  ja: 第２言語習得研究１
description:
  ja: 第2言語習得研究の理論と実証研究を概観し、成人の第二言語習得を中心に扱う授業である。自然な環境での習得と指導を受ける習得の両方を取り上げ、関連する範囲で子どもの第二言語習得や第一言語習得にも触れる。
quotedDescription:
  text:
    ja: This is a survey course in second language acquisition (SLA) in which we will consider important
      SLA theories and empirical research findings. In this course, we will focus on adult second language
      acquisition, including both naturalistic and instructed SLA. We will also cover various issues and
      important research findings pertaining to child SLA and child first language acquisition throughout
      the semester whenever they are deemed relevant.
