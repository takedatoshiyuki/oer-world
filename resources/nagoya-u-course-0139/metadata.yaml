  ja: 文学作品の比較考察を通じて、「拒食」をモチーフにした作品群を扱う講義である。公開教材には、論文の書き方に関するノートのほか、欧米の拒食症や『嵐が丘』と『“文学少女”と飢え渇く幽霊（ゴースト）』の人物対照表が含まれている。
quotedDescription:
