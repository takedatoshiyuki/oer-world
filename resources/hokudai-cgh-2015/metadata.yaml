name:
  ja: 大学院教育 電子ホログラフィとCGHシリーズ（2015）
description:
  ja: ホログラフィの基礎から電子ホログラフィと計算機合成ホログラムまでを、11回の動画で順に扱う講義である。回折積分やCGHの基本式、ポリゴン法、点光源法、レンダリング、立体表示技術、3次元表示装置と視覚特性までを含む。
quotedDescription:
  text:
    ja: 'メディア創生学研究室「電子ホログラフィとCGHシリーズ」の動画をご覧いただけます。

      ・メディア創生学研究室

      ・CGH Homepage

      第1回　ホログラフィとは

      第2回　簡単なホログラフィの原理

      第3回　電子ホログラフィと計算機合成ホログラム

      第4回　フレネル-キルヒホッフの回折積分　CGHの基本式

      第5回　ポリゴン法

      第6回　点光源法

      第7回　ホログラフィックステレオグラム

      第8回　レンダリング1　物体の質感

      第9回　レンダリング2　陰面処理

      第10回　様々な立体表示技術

      第11回　3次元表示装置と視覚特性'
