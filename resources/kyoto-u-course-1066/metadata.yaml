description:
  ja: 計算機に視覚を与えることを題材に、視覚という問題をどう数学的に定式化するかを扱う講義である。視覚が難しい理由を起点に、最近のブレークスルーと未解決の課題までを取り上げる。
quotedDescription:
  text:
    ja: 講演者は計算機に視覚を与えたいが、それはいったい何をすることなのかがよく解らない。数学の一つの特徴は、何について何を言っているのかよくわかることである。そのため現実の問題を数学的にうまく定式化すると、本質を捉えて多くの問題を解決することができるが、最初の定式化が難しい。視覚には多くの一面的な定式化が存在するが、それさえ最近まで解けなかった。講演では視覚がなぜ難しいのかということから始めて、最近起こったブレークスルーと、それでも残された問題について紹介したい。
