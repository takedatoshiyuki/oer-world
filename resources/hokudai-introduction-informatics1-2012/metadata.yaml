  text:
    ja: '情報倫理小冊子（日・英・中・韓）

      本冊子は、情報学Iの授業で使われた情報倫理に関する資料です。留学生への対応のため、日本語、英語、中国語、韓国語の教材と なっています。なお、日本語教材は、文章や漫画のセリフを クリックすることで中国語の音声が流れるようになっています。

