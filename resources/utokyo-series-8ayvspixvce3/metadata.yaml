name:
  ja: 子どものいのちと未来を紡ぐDX ～途上国における“誰も取り残さない”ビジネスとは？
description:
  ja: 途上国の保健医療・教育分野で、デジタル技術を用いた新しい取り組みをどのように事業として形にするかを扱う講義である。日本企業と支援組織の登壇者が、持続可能な事業化に向けた課題と取り組みを語る。
quotedDescription:
  text:
    ja: '「誰も取り残さないビジネス」は可能なのか？途上国の保健医療・教育分野でデジタル技術を駆使した新しいソリューションやビジネスモデルの構築に取り組む日本企業と、そうした取り組みを支える組織から登壇者が、持続可能な事業化に向けた熱意と課題を本音で語ります。熱意をもって第一線で取り組まれている方とこの問題について一緒に考えましょう。

      ※撮影・編集　東京大学放送研究会

      ★あなたのシェアが、ほかの誰かの学びに繋がるかもしれません。

      お気に入りの講義・講演があればSNSなどでシェアをお願いします。'
