name:
  ja: 全学教育 あつまれメディカルLabサイエンス大好き人間!! 未知なる血液学の世界（2013）
description:
  ja: 健康を中心に、医学や検査、生理機能、がん、血液、化学、寄生虫、エイズ、染色体、細菌を関連づけて考える教材である。病気の治療だけでなく、予防や健康維持に関わる視点から、これらのテーマを包括的に捉え直す内容になっている。
quotedDescription:
  text:
    ja: 「メディカルLabサイエンス」という造語からどのようなイメージをもちますか? 医学は病気の治療から予防さらに健康維持へと大きな転換期を迎えています。健康を維持していくためにどのようにしたらよいのか.....私達の健康を脅かすさまざまな要因からその方策を浮き彫りにして行きます。"健康"を中心に"医学"、"検査"、"生理機能、""がん""、""血液""、""化学""、""寄生虫""、""エイズ""、""染色体""、""細菌""を有機的に連結し包括的に捉えなおすことで、私達のライフスタイルについてあらためて考えてみましょう!"
