name:
  ja: 土曜市民セミナー 原子力発電所のリスクと日常生活のリスク（2012）
description:
  ja: 日本国民にとってのリスクを考えるために、スイス連邦共和国を例として原子力に関する情報を扱う。スイスの電源構成やCO2排出量、原子力発電所による地域への蒸気・熱供給に触れつつ、原子力発電所のリスクと日常生活のリスクを総合的に眺める内容である。
quotedDescription:
  text:
    ja: '日本国民にとってのリスクを考えるために、ＥＵに加盟していないスイス連邦共和国を例に原子力に関する情報を提供したい。日本と同様に資源に恵まれないスイスは、２０世紀の２回の大戦にも巻き込まれることなく２００年間平和を維持し繁栄を続けている。また、２０１０年のスイス国民１人あたりのＣＯ２排出量は
      ５.６ton で、再生可能エネルギーで注目されているデンマークの ８.５ton に比べて圧倒的に少ない。

      その理由は、スイスアルプスの水源を利用した水力発電が約５０％、ＣＯ２を排出しない原子力発電が約４５％を占めているからである。７０年代の石油危機後、ベツナウとゲスゲンの原子力発電所では地域の工場、公共施設、住宅、農場などへ蒸気と熱を供給する事業も開始し、地域経済にも貢献している。脱原発を宣言した両国の国民性も含め私達を取り巻くリスクを総合的に眺めてみたい。'
