name:
  ja: 人文学カフェ 増える鹿、減るトナカイ（2010）
description:
  ja: 屋久島や北海道のシカの増加、シベリアのトナカイの減少を手がかりに、野生生物の増減と人間の社会生活との関係を扱う。世界各地で現地調査を行う研究者の話を通して、人と野生生物の関わり方を考える構成で、フィールドワークにも触れる。
quotedDescription:
  text:
    ja: 世界自然遺産の屋久島、ここ北海道でも、今、シカがあふれて困っています。一方、シベリアではトナカイが減ってやっぱり困っているそうです。これら野生生物の増減は、多くの場合、人間の社会生活が原因で引き起こされています。人と野生生物の関わり方について、世界各地を駆け回るフィールドワーカー（現地調査を行う研究者）のお話しを聞いて、みなさんも「しか」と考えてみませんか。フィールドワークの魅力もたっぷりお伝えします。
  source: https://ocw.hokudai.ac.jp/lecture/deerandreindeer-2010
