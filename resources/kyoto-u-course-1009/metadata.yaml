name:
  ja: 【オンライン公開講義】”立ち止まって、考える” シーズン2 「人をつなぐものとしての美術ー前近代の西洋美術に注目して」
description:
  ja: 中世末期からルネサンスにかけての西洋絵画を題材に、芸術作品を個人の鑑賞にとどまらない「人をつなぐもの」として捉える視点を扱う講義である。作品が他者との関係や、言葉にしにくいものの伝達にどう関わるかを考える。
quotedDescription:
  text:
    ja: '新型コロナ・ウィルスの流行は、私たち人類が心身ともに健康に生きていくために重要な「つながり」を分断しました。そして、他者との「つながり」を断ち切られた私たちは、「人とつながる」ことの意味を、日々、自問自答しています。本講座では、私が専門とする中世末期からルネサンスにかけての西洋絵画を題材に、単に個々人の美的鑑賞の枠内にとどまらない、「人をつなぐもの」としての芸術作品の在り方について、考えます。そして、「言葉にできないもの」を他者に伝える手段としての芸術について認識を深め、ウィズ・コロナ時代の生き方を模索します。

      オリジナルのコンテンツは、人社未来形発信ユニットのウェブサイトでご覧いただけます。

      https://ukihss.cpier.kyoto-u.ac.jp/2313/'
