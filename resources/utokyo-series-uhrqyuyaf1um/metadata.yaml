description:
  ja: 東洋文化研究所に新たに加わった、明代刊行の『新刻彙正十八国闘宝伝』を手がかりに、中国の書物を扱う。春秋時代の伍子胥を主人公とする通俗小説として、この資料の性格を紹介しつつ、新発見の作品に触れる。
quotedDescription:
  text:
    ja: '東洋文化研究所は数多くの貴重書を収蔵しています。このたび、中国で明の時代に出版された『新刻彙正十八国闘宝伝』という本が、新たにその仲間に加わりました。

      春秋時代に実在した伍子胥という文武両道の名将を主人公とする通俗小説で、これまで存在が知られていなかった、新発見の作品です。

      とはいえ、そのストーリーは、今まで誰も知らなかったお話というわけではありませんでした。それどころか、明よりも前の元の時代か…'
