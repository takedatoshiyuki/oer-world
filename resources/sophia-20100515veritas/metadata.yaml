name:
  ja: より身近に感じられる科学 「地球の果て」
description:
  ja: 大地を平らなものとみなしていた考えから、地球が球体であるという見方に至るまでの変化を扱う講義資料である。航海の広がりやコロンブスの航路、さらにコペルニクスやガリレイによる地動説の成立にも触れている。
quotedDescription:
  text:
    ja: "より身近に感じられる科学 「地球の果て」\n 大地が球になっているということに気がつくまで、我々の大地は四角い板のようなものだと考えて来た。この端に行くと海の水はジャージャーと落下していくから、船乗り達も端に行かないようにした。高い山に登って遠くを見ても余り遠くは見えないから、どうも大地は丸いのではないかと気がつき、気がついてみれば空には月をはじめとした天体が数多く浮いており、初めて我々の大地も球ではないかと考え始めたのである。それまでは喜望峰までしか行かなかった船乗り達が一斉にインド洋に乗り出し、インドあたりにまで行くようになった。スペインに居たコロンブスは逆にスペインから西に行けばインドに行けるだろうと言ってアメリカを発見した。最初のうちはインドに行って来たのだと勘違いしていた。1492年、今から約500年前のことである。コペルニクス次いでガリレイといった天文学者が活躍し、地動説が次第に正当視されるようになった。\n\
      プログラムの詳細は こちら をご覧ください。"
