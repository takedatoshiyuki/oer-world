name:
  ja: サイエンスパーク in 北海道大学総合博物館 ノーベル化学賞鈴木章先生と 見て、触れて、楽しみ、学ぼう！ （2011）
description:
  ja: 北海道大学総合博物館で行われた体験・交流型イベントを扱う。ノーベル化学賞受賞者の鈴木章と国際科学オリンピックで活躍した高校生を招き、子どもたちに科学技術への関心を促す内容である。
quotedDescription:
  text:
    ja: "ノーベル化学賞を受賞した鈴木章北海道大学名誉教授と国際科学オリンピックで活躍したスーパー高校生をお招きし、北海道の未来を担う子どもたちに、生活の利便性の向上や社会経済の発展に大きく貢献する科学技術への関心を高めてもらうため、「見て、触れて、楽しみ、学ぶ」ことができる体験・交流型のイベント「サイエンスパークin北海道大学総合博物館」を開催しました。\n\
      ＜関連情報＞\n北海道科学技術振興課 \n北海道大学総合博物館"
