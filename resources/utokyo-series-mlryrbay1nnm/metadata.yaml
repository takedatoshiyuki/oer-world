  ja: 人間の社会性を政治思想の観点から考察する公開講座である。人と人との絆を「恵み」とみなす考え方と、関係のしがらみが自由を妨げるという見方を取り上げ、その意味を問い直す。著名な哲学者たちの思想にも触れる。
quotedDescription:
  text:
    ja: この講座では、人間の「社会性」（sociability）というテーマを政治思想の観点から考察します。大自然からの恵みと並んで、人と人との絆は私たちが生きる上でかけがえのない恵みであると考えられます。一方、人間関係のしがらみに囚われてしまうと自由に生きることではない、という考え方もあります。人は人にとっての恵みだと言えるのでしょうか。もし言えるとしたら、どういう意味でそうなのでしょうか。著名な哲学者たちの思想…
