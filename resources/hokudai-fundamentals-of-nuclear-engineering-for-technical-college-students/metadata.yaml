  ja: 高専生向けの基礎原子力工学を扱う講義で、分離技術、PUREX法、新しい湿式再処理・核種分離法を取り上げる。あわせて、放射性廃棄物処分に関する化学分配係数と、原子力発電プラントや原子炉の臨界を扱う原子炉工学入門を含む。
