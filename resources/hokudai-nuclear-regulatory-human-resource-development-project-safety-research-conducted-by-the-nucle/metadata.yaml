name:
  ja: 原子力規制人材育成事業（*）オープン教材を活用した原子力規制人材育成プログラムの拡充「原子力規制庁が実施する安全研究」
description:
  ja: 原子力規制委員会の組織体制と、安全研究が規制の中でどのように位置づけられ、どの体制・方針で進められるかを扱う。あわせて、対象となる安全研究や重点課題、新技術への対応、国内外の機関との連携、国際機関への協力、研究職の役割までを含む。
quotedDescription:
  text:
    ja: "原子力規制庁が実施する安全研究\n \n「原子力規制庁が実施する安全研究」の教材は全て制限資料（閲覧のみ）のライセンスで公開しています。\n \n本教材の内容は以下の通りです。\n \n\
      ・原子力規制委員会の組織体制\n \n・安全研究の位置づけ\n \n・規制庁が行う安全研究とは\n \n・安全研究の実施体制\n \n・安全研究の進め方\n \n・安全研究の実施方針\n \n\
      ・原子力規制委員会が対象とする安全研究\n \n・実施方針における重点課題\n \n・新技術への対応\n \n・国内機関との連携\n \n・海外機関との連携・海外留学\n \n・国際機関への協力\n\
      \ \n・安全研究に携わる研究職"
