description:
  ja: 日本の急速な少子高齢化を手がかりに、人口の変化が社会にどのような課題を生むかを考える講義である。出典文では、現在の高齢化の状況と2050年の見通しを示し、その先にある超高齢社会への向き合い方を扱う。
quotedDescription:
  text:
    ja: 2010年、日本の総人口は128,057（千）人である（2012年4月17日公表、総務省統計局）。そのうち、65歳以上人口が占める割合は23%と、4人に1人弱が高齢者である。2050年には、一人の現役世代（15～64歳）が一人の高齢者を支える肩車型の時代が予想されている。急速な少子高齢化を経験した日本にとって、だれも経験したことのない超高齢社会が待っている。そんな将来にわれわれはどう向き合っていくのか。人口変動と人と人のつながり…
