name:
  ja: 2016年 若手パブリックヘルス研究者京都国際会議
description:
  ja: 本教材は、2016年12月の2日間に行われた国際会議の記録で、開会挨拶、基調講演、セッション、ポスター発表、閉会までを収録する。内容はユニバーサル・ヘルス・カバレッジを軸に、日本やアジア各国の医療制度、保健医療経済、費用対効果の論点を扱う。各地域の事例を通して、医療制度の課題と政策上の検討事項を取り上げる。
