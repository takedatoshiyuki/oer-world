name:
  ja: Principles of Microeconomics ミクロ経済学原論
description:
  ja: 市場の需要・供給と均衡を出発点に、消費者と企業の行動を経済学の基本理論に沿って学ぶ講義である。さらに、独占、外部性、情報の非対称性、公共財、税や補助金、所得再分配といった市場の失敗や政策対応まで踏み込む。
quotedDescription:
  text:
    ja: 'This course covers basic level of “traditional” microeconomics (so-called “price theory”: analysis
      of the perfect competition) and its application.Topics that this course deals with are: market,
      demand, supply and the equilibrium; consumer behavior and utility maximization; firm behavior and
      profit maximization;market failure (imperfect competition, imperfect information, externality, and
      public goals) and economic policy; taxes and subsidies, income distribution, etc.

      伝統的なミクロ経済学（価格理論）の基礎部分、およびその応用例を幅広く学ぶ。取り扱うトピックは、 市場と需要・供給、市場均衡、消費者の行動と効用最大化、生産者の行動と利潤最大化、市場の失敗（不完全競争、不完全情報、外部性、公共財）と経済政策、税と補助金、所得分配
      などである。

      Contents of Lectures

      26

      Lectures  /

      43

