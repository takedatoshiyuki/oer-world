name:
  ja: 先端分野総合研究(外国人と法)
description:
  ja: 戦後の東アジア情勢のもとで形作られた日本の外国人に関する法政策を扱い、その後の変化にも目を向ける。公法・国際法の基礎を前提に、外国人登録や在留資格、退去強制、難民、在留保障などの論点を講義ノートで扱う。
quotedDescription:
  text:
    ja: '日本における外国人の状況は、法の眼でみるとどのように見ることができるのか、その全体的動向を把握し、背景を理解する。

      入管法をめぐる主要問題について、実務的側面を含む基礎的知識を修得し、 入管法の構造について問題意識をもつ。

      入管法を変動させる重要な要因となっている国際法的規制について、それら の内容と性格、日本法における適用状況についての基礎知識を修得する。

      外国人法政策をめぐる最近の議論とその背景について基礎知識をもち、今後 の変動に対応できる問題意識をもつ。

      入管難民法についての調査について基礎を修得する。'
