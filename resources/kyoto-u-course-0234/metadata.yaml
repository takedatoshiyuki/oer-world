name:
  ja: 第85回 京都大学丸の内セミナー「最新宇宙論の３大謎に迫る！～ダークエネルギー・ダークマター・インフレーション～」
description:
  ja: 宇宙背景輻射の観測や銀河の回転速度、初期宇宙の急激な膨張を手がかりに、宇宙論で未解明とされる三つのテーマを扱う講義である。ダークエネルギー、ダークマター、インフレーションの各々について、何が問題になっているかを取り上げる。
quotedDescription:
  text:
    ja: '宇宙背景輻射の観測は、現在の宇宙の加速膨張と負の圧力を持ったエネルギーの存在を強く示唆しており、また銀河の回転速度を説明するには、遠心力を引き止めるのに必要な重力を生み出す物質が必要と考えられています。

      　これらの未知のエネルギーと物質は、ダークエネルギー、ダークマターと呼ばれ、宇宙の大部分を占めていると考えられています。

      　さらに、初期宇宙における急激な膨張、イン フレーションを起こした源のエネルギーが何によるものなのか、それも未だに分かっていません。

      　本セミナーでは、豊富な精密観測データを誇る宇宙論の前に立ちはだかる、ダークエネルギー・ダークマター・インフレーションという、3つ の大きな謎に迫ります。'
