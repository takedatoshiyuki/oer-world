description:
  ja: インターネットへの依存が進む社会を背景に、利用者を脅威から守るための基本技術と対策を扱う。あわせて、実際にありうる脅威の例や、技術面に加えて社会現象・法整備に関する話題も取り上げ、情報セキュリティの基礎を概観する。
quotedDescription:
  text:
    ja: '授業の概要・目的

      IT革命以降、社会はますますインターネットへの依存を深めている。インターネットはデジタル機器間の情報の流通を極めて高速に安価に行うことを可能にし、コンピュータによるネットワーク接続を身近で手軽なものにした。一般市民の利用が広がるに従い、インターネットは電子政府・自治体や電子商取引など重要な分野でも使用されるようになった。しかし、このことは同時にインターネットの持つ脆弱性に多くの人をさらす結果となっている。本講義では、インターネット上の脅威からユーザを守るために使われている基本的な技術と、実際にありうる脅威、その対策について講述し、技術面から社会現象、法整備まで多岐に渡る内容の紹介を通じて、情報セキュリティの基礎を概観する。'
  source: https://ocw.kyoto-u.ac.jp/course/703/
