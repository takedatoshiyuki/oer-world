name:
  ja: ギリシア神話学
description:
  ja: この教材は、ギリシア神話を題材に、神話とは何かという問題を扱う。複数のヴァージョンを持つ個々の神話を取り上げ、似た話を並べて比較しながら、その背後にある意味を探る構成になっている。
quotedDescription:
  text:
    ja: 神話とは何かと考えた時、昔話や御伽噺や伝説なら比較的たやすく説明できるのに、神話はなかなかすっきりと説明できないことに気付きます。神が出てくることは多いが、必ずしも神の話ではありません。荒唐無稽な話ばかりですが、子供だましでもありません。ギリシア神話のひとつひとつには、高度の脚色されたさまざまなヴァージョンがありますが、脚色をとりのぞいてゆくと単純なストーリーが残り、たいていそこには何らかの真実が力強く埋込まれています。似た話を並べてみることによってそれが見えてくることもあります。この授業は、そういう神話の性質を伝え、それぞれの神話の奥にある意味をさぐる力を涵養することを目指しています。それは、読んだり覚えたりして楽しむだけでなく、世界や人生や神をとらえ直したり、西欧人の考え方の枠組みを理解する助けにもなるはずです。
  source: https://ocw.nagoya-u.jp/courses/0531-%E3%82%AE%E3%83%AA%E3%82%B7%E3%82%A2%E7%A5%9E%E8%A9%B1%E5%AD%A6-2015/
