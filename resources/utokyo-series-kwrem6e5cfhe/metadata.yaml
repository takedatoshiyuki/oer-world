name:
  ja: 医療×AIセミナーシリーズ第11回：シンポジウム『医療現場で本当に価値あるAIを作るために』
description:
  ja: 医療現場へのAI実装に向けて、ディープラーニングの現状と今後の展望を整理する講義である。認識、運動の習熟、言葉の意味理解という発展段階を手がかりに、米中の実装事例や研究動向を参照しながら、臨床医療での活用可能性を扱う。
quotedDescription:
  text:
    ja: '医療現場にてAIを実装するためには、一体どんな取り組みが必要でしょうか。それを知るためにはディープラーニングの現状と今後の展望の正しい認識が大切です。

      この講演では、ディープラーニングにおける「認識」「運動の習熟」「言葉の意味理解」の三つの発展段階を、アメリカや中国におけるディープラーニングの実装事例や最新の研究動向とともに概観しながら、臨床医療でのディープラーニングの活用の可能性を模索していきます…'
