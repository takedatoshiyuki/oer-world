  ja: 知的財産の保護をめぐる基本的な法枠組みと、先端的な論点を扱う講義である。特許、商標、著作権を例に、日本法と国際条約を中心に据えつつ、米国とEUの法にも触れる。
quotedDescription:
  text:
    ja: 'This course covers basic legal frameworks and advanced issues concerning the protection of intellectual
      property (IP) (e.g., patents, trademarks, copyrights). Main focus will be put on Japanese law and
      international treaties (such as the Paris and Berne Conventions, and the TRIPS Agreement), but laws
      of other major countries, particularly the US and the EU, will be also touched on.

      Professor Nishii will teach the first four classes, and then Professor Suzuki will teach the rest
      of the classes.'
