name:
  ja: 原子力人材育成事業（*） 機関連携強化による未来社会に向けた新たな原子力教育拠点の構築「核データ工学」
description:
  ja: 核データ工学の基礎として、核データの意味や原子核の性質、崩壊と反応、中性子核反応、核分裂、核融合工学との関係を扱う。あわせて、核データの測定手法、処理、核データライブラリと国際協力にも踏み込む。
