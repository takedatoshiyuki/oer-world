  ja: 解析力学Ⅰ
description:
  ja: ラグランジアンやハミルトニアンを用いて、質点や剛体の運動を扱う解析力学の内容を学ぶ教材である。基本原理の理解に加え、簡単な応用を通して手法を身につける構成になっている。
quotedDescription:
  text:
    ja: 'ラクラジアンやハミルトニアンを用いた理論形式は，質点や剛体などの力学系の運動を調べるために非常に有効である。また、2 年後期に学ぶ量子力学 I を理解する上でも、解析力学は必要不可欠である。本講義では，その基本原理を理解すると共に，簡単な応用を通じて手法を取得する。

      ラグラジアンやハミルトニアンを構築する方法を習得し，それらを用いて力学系の運動を理解することができるようになる。'
