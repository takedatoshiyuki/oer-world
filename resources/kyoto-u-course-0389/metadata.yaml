name:
  ja: 第17回総合防災セミナー “A Puzzle About Intensity IX (Modified Mercalli) Ground Motions”
description:
  ja: 本教材は、Modified MercalliのIntensity IXをめぐる一つの問題を扱う講義資料である。米国内の複数地点で地震ハザード解析が示す発生頻度と実測の整合に関する課題を取り上げ、その科学的な論点と解決に向けた考えを述べる。
quotedDescription:
  text:
    ja: 'Course Description

      This lecture was given by Prof. John Anderson in the 17th Sogo Bosai Seminar on June 1, 2018, who
      stayed at Disaster Prevention Research Institute as a visiting professor from University of Nevada.
      He talked about one large challenge of Intensity IX. The problem is that according to many seismic
      hazard analyses, it is predicted to happen too often at several locations in the United States where
      it can be tested. He talked about the scientific challenges this introduces, and some thoughts that
      he hoped will be useful contributions towards a resolution.'
