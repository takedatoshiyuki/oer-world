name:
  ja: 上智の座シリーズ 第2回
description:
  ja: ニューマンの『大学の理念』を手がかりに、カトリックの立場から大学をどう捉えるかを扱う講義資料である。19世紀中頃の知的世界を背景にした議論を、現代の大学との距離を意識しながら読み直し、その意義を考える。
quotedDescription:
  text:
    ja: "ニューマンの『大学の理念』と我々の大学 \n ニューマンの『大学の理念』は、カトリックの立場からする大学論として存在はよく知られているけれども、実際に読まれ、理解されることの少ない本と言っていいだろう。それもそ\n\
      \ のはず、19世紀中頃の知的世界を背景として語られた彼の理念は、前提からして現代の大学の現実から遠く隔たっている。その距離を認めた上で、この本が今の我々に対してもっている意味を考えてみたい。（2010\
      \ 年9月ニューマンはカトリック教会において列福されました。）\n当日の講演会のチラシは こちら をご覧ください。"
