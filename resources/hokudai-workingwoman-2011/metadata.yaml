quotedDescription:
  text:
    ja: '2012年2月23日 オステリア シスタービート デュオにて開催された、「働く女性のONとOFF」の資料をご覧いただけます。

      主催 北海道大学創成研究機構

      1. 癒し系の素材”ゲル”が作り出す先端医療材料

      佐藤 のりゆき（北海道大学）、龔 剣萍（グン チェンピン）（北海道大学）

      2. プロフェッショナルが語る「働き方」と「生き方」

      佐藤 のりゆき（北海道大学）、龔 剣萍（グン チェンピン）（北海道大学）、平野たまみ（株式会社あるた出版）'
