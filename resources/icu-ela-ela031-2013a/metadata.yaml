name:
  ja: Reading and Content Analysis 精読と英文構成法
description:
  ja: 学術英文を精読し、読解の技法や方略を扱う講義資料である。あわせて、テキストのジャンル、構成、論調、社会文化的文脈を分析し、言い換えや要約の練習も取り上げる。公開されている教材は講義資料2件で、授業の一部が記録された動画とスライドが含まれる。
quotedDescription:
  text:
    ja: 'Along with Academic Reading and Writing 3, RCA3 is a core course in the ELA Program. Through
      intensive reading, this course helps students to develop reading skills and strategies to become
      independent readers of academic texts. By incorporating the experience of teachers as learners of
      English as a foreign language, the course is designed to assist students to comprehend academic
      texts, and to take a further step in analyzing their genre, structure, tone and socio-cultural context.
      Writing, such as paraphrasing and summarizing, is introduced to increase accuracy in comprehension.
      The course is taught over three terms which must be taken in sequence.

      「読解と論文作法」と共に、リベラルアーツ英語プログラム(Stream 3)の中核となる科目である。精読のための技法の習得を通して、学術文章を自律的に読みこなす読解力の向上を図る。英語を外国語として学んだ経験を持つ教員が担当することにより、テキストのジャンル、構成、論調、社会文化的文脈を分析しながら、より深い読解を目指すための読み方へ学生を導くように工夫されている。さらに、理解力を高めるために言い換えや要約等のライティングの演習を行う。1、2、3学期の順に履修すること。

