name:
  ja: 鉱物をみて地球を考える
description:
  ja: 地球に存在する鉱物や、それらが集まってできる岩石を手がかりに、地球の自然環境と生態系の関係を考える講義である。鉱物の多様性を学ぶとともに、五感を使って自然を観察する取り組みも扱う。
quotedDescription:
  text:
    ja: 地球には約4800種の鉱物があり、鉱物が集まって岩石（石ころ）になります。水の惑星地球では、水・鉱物・植物・動物が一体となって、一つの生態系を作っています。生物多様性を育む生態系は鉱物と深く関係しているので、鉱物ぬきで生物多様性を理解することはできません。中津川プロジェクトでは、鉱物（岩石）の多様性を学ぶとともに、五感のすべてを使って自然を観察します。自然をよくみて、自分の感性を磨き、あれこれ考え
  source: https://ocw.nagoya-u.jp/courses/0284-%E9%89%B1%E7%89%A9%E3%82%92%E3%81%BF%E3%81%A6%E5%9C%B0%E7%90%83%E3%82%92%E8%80%83%E3%81%88%E3%82%8B-2010/
