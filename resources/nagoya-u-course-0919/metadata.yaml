quotedDescription:
  text:
    ja: 'This course aims to increase students’understanding on the concept, practice and methodology
      of education policy planning andassessment in the area of educational development.

      The course provides not only the theoretical overview of educational development planning and assessment,
      but also reviews practicalsteps to prepare for a national education strategic plan (NESP) and to
      assess the NESP implementation in a country. After reviewing thescope and dimension of education
      policies, the course further discusses the structure, formulation process and practical issues of
      NESPpreparation which varies by the country’s context and situation, as well as the concepts and
      calculation methods of key educationindicators. The course further introduces the methodologies
      of major assessment analysis used as a tool of policy/project assessment inboth practical and academic
      fields.

      本授業の英語ページはこちら：

      Educational Development Planning and Evaluation

      At the end of this course, students are expected to be able to understand the concept of educational
      development planning andassessment, to calculate major educational indicators, to explain each component
      of NESP, and to develop basic shape of NESP withsupport of experts.'
