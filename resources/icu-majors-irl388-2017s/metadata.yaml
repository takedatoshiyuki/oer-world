name:
  ja: Advanced Studies in International Relations 国際関係学特別研究
description:
  ja: 国際関係の中から選んだ論点を取り上げ、国連の歴史や安全保障、人権、開発、ジェンダー、気候変動などを扱う。あわせて、外交や国際公務のキャリア、国連関連情報の調べ方、講義回ごとのゲストによる話題提供も含む。
quotedDescription:
  text:
    ja: 'Advanced exploration and analysis of selected topics in international relations. 国際関係をめぐる重要課題を随時取り上げ分析する。

      Apr 1

      0

      A. Reflection of My 42-year Diplomatic Career: How I became a diplomat and what challenges I faced
      (Open to all ICU students)

      Motohide Yoshikawa  H.E. Ambassador, Permanent Representative of Japan to the United Nations(at
      the time of interview), March 1974 Graduate of ICU’s College of Liberal Arts, Division of Social
      Sciences.

      >>

      interview

      B. Introduction of the Course: Aim of the course. Feedback from the students.

      Apr 17

      **C

      ampus Only

      A. History of the United Nations, including its predecessor, the League of Nations.

      B. Guidance: Searching for UN-related Information and Documents (Open to all ICU students)

      -Guest Speaker: Mr. Kiyoshi Chiba (United Nations Information Centre)

      Apr

      24

      A. Peace and Security (1): Role of the UN Security Council: Use of force authorized by the SC –
      Korean War, Iraq War I and II, and Afghanistan

      B. Peace and Security (2): PKOs – History, functions, and limits

      May 01

      A. Peace and Security (3): Peace Building and “Seamless Assistance”

      B. Peace and Security (4): How the SC Works? Making of SC Resolution 2270 on DPRL’s nuclear test

      May 0

      8

      A. Peace and Security (5): Reform of the Security Council

      B. Human Rights: North Korea, Treaty bodies, including disability

      May 15

      A. Diplomacy and Media – Case Studies: Japanese Hostages in Iraq

      B. Diplomacy and Media – Guest Discussant: Prof. Fumihiko Yoshida

      May 22

      A. Humanitarian Assistance and Development (1): MDGs and SDGs

      UN Initiatives on Gender and SDGs (open to all ICU students) – Guest Speaker: Ms. Miwa Kato, Regional
      Director, UN Women Regional Office for Asia Pacific

      B. UN Initiatives on Gender and SDGs (Part 2)

      May 29

      A. Global Issues

      Human Security and Responsibility to Protect (R2P)

      B. Secretary-General and Secretariat Instructor: Prof. MORI, Katsuhiko

      Jun 05

      A. Career Development in Diplomatic and International Public Services

      B. Career Development in Diplomatic and International Public Services

      Panerist:

      Ms. YAMAZAKI, Setsuko,

      the former U.N. Development Programme Cambodia Country Director

      Ms . TAKASE, Chikako, Director,

      United Nations Centre for Regional Development

      Ms. Noguchi,

      Yuri  of the Climate Change Division of the Ministry of Foreign Affairs'' International Cooperation
      Bureau

      高瀬千賀子（国連地域開発研究センター所長） ・山崎節子（国連開発計画・前カンボジア事務所長） ・野口侑里（外務省国際協力局気候変動課）

      Moderator: MORI, Katsuhiko ICU 毛利勝彦（国際基督教大学 教養学部長）

      Jun 12

      A. Paris Agreement

      B. The Role of Japan in the World: Historical Perspective

      2017, Spring'
