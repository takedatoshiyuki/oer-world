  ja: 病気の概念を原因論から整理し、細胞・組織・臓器・全身性の各レベルで疾患を説明する講義である。後半では腫瘍論として遺伝子レベルの内容も扱う。解剖学、生化学・分子生物学、免疫学、細菌学の基礎知識を前提にしている。
