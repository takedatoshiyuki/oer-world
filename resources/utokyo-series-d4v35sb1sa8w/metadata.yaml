    ja: 病理学総論講義においては、病気（疾患）の概念を原因論から出発して系統的に説明する。細胞レベル、組織レベル、臓器レベル、そして全身性の疾患という具 合に理解してほしい。さらに後半の腫瘍論においては、遺伝子レベルの講義を行う。解剖学、生化学・分子生物学、免疫学、細菌学などの基礎知識が幅広く身に
      ついていないと病理学の講義を理解するのは難しい。
