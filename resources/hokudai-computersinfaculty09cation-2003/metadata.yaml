name:
  ja: 学部専門教育 教職総合演習 現代社会における数値計算の役割（2003）
description:
  ja: Unixコンピュータ上で数値計算のためのプログラムを作成し、問題解決を体験する教材である。あわせて、アルゴリズムの構築、計算結果のグラフ化、Webpageへの表示、TeXを用いた資料作成まで扱う。
quotedDescription:
  text:
    ja: '現代社会においてはコンピュータの利用は必要不可欠になっている。これは単なる娯楽のためというだけでなく、高齢化社会において少ない労働力で高い作業効率を得ることが、我国の社会における課題となっているためでもある。

      このことは教育現場にも当てはまり、日本全体で教材を共同で利用するなど、コンピュータやネットワークを使った教育の効率化の可能性はたいへん大きい。

      このような作業効率・教育効率の向上の上では、様々な機能を提供するサーバーコンピュータ (多くは Unix ワークステーション) を使いこなせること、サーバー上でのプログラムを作成する技術、そして
      Webpage やプリントでの表現等の重要性が今後増していくものと考えられる。

      この授業では、サーバーとして用いられている Unix コンピュータ上で実際にプログラムを組み、数値計算による問題解決を体験することを通じて、必要なコンピュータの利用法、プログラムのアルゴリズムの構築方法、計算結果の可視化
      (グラフ化)、Webpage へのグラフの表示、TeX などを利用した数式・図を含むプリント作成方法等について修得することを目的とする。'
