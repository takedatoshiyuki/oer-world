name:
  ja: 韓国・朝鮮語表現論演習b-日本語と韓国・朝鮮語の分節音の音声学・音韻論
description:
  ja: 日本語と韓国・朝鮮語の分節音を題材に、理論や方法論、具体的事例を往復しながら音声学・音韻論を扱う。あわせて、Praatを用いた音響分析の実習を通じて、音響分析の手法も学ぶ。
quotedDescription:
  text:
    ja: 'この授業では、日本語と韓国・朝鮮語の分節音を対象とし、理論、方法論、具体的事例を行き来しながら、このトピックに対する理解を深めていきます。

      なお、この授業では音響分析の実習も行う予定です。Praat という音響分析ソフトウェアを用い、音響分析の手法も学んでいきます。'
