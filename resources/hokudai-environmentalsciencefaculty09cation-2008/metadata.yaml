description:
  ja: 北海道に固有の自然・文化・社会・産業にかかわる教育の展開を通じて、地域を教育資源として活用する取り組みを扱う。あわせて、環境教育と社会教育の基盤整備、地域活性化に向けたノウハウの蓄積について触れ、その概要と問題点を報告する。
quotedDescription:
  text:
    ja: 平成１６～１８年度の現代GP「北方地域人間環境科学教育による地域活性化」は、北海道に固有の自然・文化・社会・産業にかかわる教育を展開し、北海道地域全体をわが国における貴重な教育資源として開発し、国民全体に活用してもらうための環境教育ならびに社会教育の基盤を整備し、地域活性化のためのノウハウの蓄積をはかることを目指して行われました。その取り組みの概要および問題点について報告します。
