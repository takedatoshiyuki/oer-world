name:
  ja: 情報メディア工学特論
description:
  ja: 可視化対象となるデータの分類や数値補間の基本を扱い、それらに対する可視化処理を学ぶ講義である。あわせて、UMLやOpenGLを用いた可視化システムの設計・実装や、ボリュームレンダリング、等値面表示、多視点映像処理などの教材を含む。
quotedDescription:
  text:
    ja: '授業の特色

      可視化処理の基本技術の講義とシステム開発実習を通じて可視化技術を効果的に理解することができる

      授業の紹介

      本講義では、可視化対象となるデータの分類と数値補間技術について基本事項を理解させ、それらのデータに対する可視化処理について習得させる。さらにシステム構築技法についての概要を説明した上で可視化システム開発の基本を理解させ、基本グラフィックスライブライリを使用した可視化システムプロトタイプの開発を経験させる。'
  source: https://ocw.kyoto-u.ac.jp/course/36/
  note: 京都大学OCW 「講義概要」より（同サイトの利用条件に基づく転載）
