name:
  ja: Introduction to Public Policy 公共政策入門
description:
  ja: 公共政策の基礎と政策研究の方法を学び、政策の意義・構造・形成から実施、評価までの流れを扱う。あわせて、政府に加えて市民、NPO、企業が政策過程で果たす役割と、その関係の動きを取り上げる。講義では、公共政策の定義、政府と市場、意思決定、立法や行政手続なども扱う。
quotedDescription:
  text:
    ja: 'Fundamentals of public policy, problem solving approaches, and methodology of policy studies.
      Dealing with significance, structure and processes of public policy, as well as dynamics relationship
      between government, citizens, NGOs, or companies.

      広く公共政策、公的問題の解決、政策研究の方法について学ぶ入門コース。公共政策の意義と構造、政策の形成・実施・評価プロセスの基礎を理解し、政策過程の中核に位置してきた政府に加え、市民・NPO・企業等の役割も視野に入れてネットワークの動態を把握する。

