name:
  ja: Introduction to Linguistics I 言語学入門 I
description:
  ja: 言語学と応用言語学で使う基本的な用語や概念を導入し、言語分析の練習を行う講義資料である。音声学・音韻論から、形態論、統語論、意味論までを扱い、人間言語の音のしくみ、語の作り方、文の構造、意味の捉え方を学ぶ。
quotedDescription:
  text:
    ja: 'The course has two major goals: (1) to introduce basic terminology and concepts commonly used
      in modern Linguistics and Applied Linguistics, and (2) to provide practice in analyzing language.
      At the end of this course, students should be able to conduct a structural analysis of basic linguistic
      data in a scientific and systematic manner.

      人間言語の音韻システム、単語の構成、文の構造、意味のとらえ方などに焦点をあて、言語学の基礎体系を学ぶ。具体的な言語分析になれることによって、人間言語がどのようなシステムになっているか、また、どのように働くのかを理解する。

      Contents of Lectures

      4

      Lectures /

      1

      Video

      Oct 03

      Phonetics: the study of speech sounds. & Phonology: the study of the organization of language sounds.

      Lecture Notes

      Exercises

      Oct

      15

      Morphology: the study of the make-up of words.

      Syntax: the study of how phrases and sentences larger than the word are constructed.

      Semantics: the study of meaning.'
