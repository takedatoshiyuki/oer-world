name:
  ja: 農村づくりとSDGs
description:
  ja: 北海道大学の小林国之准教授が、2022年2月開催の「SDGs×北海道セミナー2022」で行った基調講演を収録する。農村づくりとSDGsをテーマに、セミナー全体の中で講演のほか北海道大学のSDGsの取組紹介や道内の進捗状況の報告も扱う。
quotedDescription:
  text:
    ja: '2022年2月に開催された「SDGs×北海道セミナー2022」（主催：北海道/共催：北海道大学）の基調講演、

      「農村づくりとSDGs」と題した農学研究院准教授 小林国之先生による講演です。

      開催報告

      「SDGs×北海道セミナー2022」概要

      〇日時：2022年2月17日（木）13:30～15:30

      〇会場：オンライン（Zoomを使用した配信）

      〇主催：北海道、共催：北海道大学

       協力：北海道大学

       高等教育推進機構オープンエデュケーションセンター、ＵＲＡステーション

      〇プログラム

      （1）開会

          濱坂　真一 　北海道総合政策部長

          横田　篤　北海道大学理事・副学長(国際、SDGs担当)

      （2）基調講演

        「農村づくりとSDGs」講師：小林　国之氏（北海道大学大学院農学研究院　准教授）

      （3）SDGsに関する取組紹介

        「北海道大学におけるSDGsの取組紹介」（北海道大学SDGs事業推進本部）

        「オーガニックフラワーの調査・研究」（北海道旭川農業高等学校）ほか

      （4）北海道内のSDGsの進捗状況について（北海道総合政策部計画局計画推進課）'
