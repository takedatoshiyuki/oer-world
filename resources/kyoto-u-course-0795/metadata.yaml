  ja: 京都大学の市民講座「物理と宇宙」の第4回に関する教材で、理学研究科の担当者による講義資料3件を公開する。扱うテーマは、脳の計算原理、重力波の直接検出、ニュートリノ振動による物質と反物質の対称性の破れである。市民向け講座として、物理学と宇宙物理学の研究成果を紹介する内容になっている。
