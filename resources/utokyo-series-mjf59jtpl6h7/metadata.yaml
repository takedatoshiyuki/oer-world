name:
  ja: 生命の科学−構造と機能の調和（学術俯瞰講義）
description:
  ja: 生命科学を俯瞰する講義で、個体の発生を通した形づくりや器官形成、分子モーター、ウイルス学、ゲノム科学と進化を扱う。生命を「分子の言葉」で理解する流れや、生命科学の広がりを踏まえて、生命の多様性と一様性を考える内容である。
quotedDescription:
  text:
    ja: 21世紀は「生命科学」の時代とも言われている。それほど生命科学は20世紀から21世紀にかけて急速な発展と変化がみられてきた。その一つはヒト を含めて生命を“分子の言葉”で理解することが急速に進んできて可能になっていることによる。ヒトを含めたモデル生物のゲノム解読、細胞内情報伝達のしく
      み、形づくりに関する遺伝子の解明、プロテオミクス、脳科学の解明などである。もう一つは、生命科学が今までの医学、農学、薬学、理学（生物科学）など、 いわゆる生物科学という枠を超えて工学、教育学、経済学、情報学、環境学、認知学など、学際的かつ総合科学として大きく発展している。そのような生命科学
      が大きな拡がりをもち、発展と変化の中で生命科学をどのように俯瞰的にみていくのかは正直、非常に大きな課題である。この学術俯瞰講義では、個体の発生を 通しての形づくりと器官形成、分子モーターからみた生命、ウイルス学、ゲノム科学と進化などに焦点をあてて、「生命」について俯瞰してみたい。各生物がも
      つ生命の歴史とそこに秘められた奥深さと美しさ、構造と機能の調和、ウイルスと人類の戦いのドラマなどを通して生命のもつ多様性と一様性など、「生命知」 について語ってもらう。
  source: https://ch.u-tokyo.ac.jp/series/?id=MJF59JtpL6H7
