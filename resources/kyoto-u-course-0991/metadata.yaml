name:
  ja: 第5回京都こころ会議シンポジウム こころとコロナ危機
description:
  ja: 京都こころ会議のシンポジウムとして、「こころ」とコロナ危機の関係を扱う。医学、仏教学、心理学などの観点から、コロナ危機がこころに与える影響や、その意味を考える内容である。
quotedDescription:
  text:
    ja: '2015年4月に発足した「京都こころ会議」は、科学技術の進歩や経済のグローバル化により、複雑化した世界に生きる人間の「こころ」そのものを究明しようという試みです。その際に「こころ」という日本語に含まれる広がりや深いニュアンスを大切にしながら、「こころ」についての新しい理解をKyoto
      Kokoro Initiativeとして世界に向けて発信します。

      今年度は、今の危機的状況のこころにとっての意味を問う必要があろうという認識から、「こころとコロナ危機」というテーマで、2月にシンポジウムを開催することになりました。コロナ危機は、こころにどのような影響を与えるのか、こころにとってどのような意味があるのかを、医学、仏教学、心理学と様々な見方から問うことができればと思います。'
  source: https://ocw.kyoto-u.ac.jp/course/991/
