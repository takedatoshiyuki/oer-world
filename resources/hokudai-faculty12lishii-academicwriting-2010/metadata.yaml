description:
  ja: Philip Seatonによる「Academic Writing」シリーズの一部として、長めの英文を聞き取るためのビデオ教材を扱う。視聴前に例示用のEssayや論文をダウンロードするよう案内があり、論じられる内容は英語論文に限らず、学術的な論文やレポートに共通する基本的ルールに及ぶ。
quotedDescription:
  text:
    ja: 'Philip Seatonによる新ビデオ講義シリーズ"Academic Writing" seriesです。

      この課題のビデオはlong passages（長い文章）を聞き取るための教材です。ビデオを見る前に、例として遣われているEssayや論文をダウンロードしてください。

      なお、このビデオで論じられていることがあてはまるのは英語論文だけではありません。学問の世界で書かれる論文、レポートなら、言語を問わず、ここで述べられている基本的ルールが適用されるものと考えておくのがよいでしょう。'
