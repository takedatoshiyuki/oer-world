name:
  ja: 第16回 北海道大学教育ワークショップ（2010）
description:
  ja: 北海道大学の若手教員向けワークショップで、授業科目の設計とシラバス作成を通して教育の基礎や教育手法を学ぶ。あわせて、教育倫理綱領や教育評価、授業支援システム、クリッカー、北大OCWなど、授業実践に関わる話題を取り上げる。講義とグループ作業、発表・討論を組み合わせて進める。
quotedDescription:
  text:
    ja: '現在，大学の教育現場においては、学生に知的刺激を与え、自主性を引き出し、自学自習の態度・習慣を身につけさせることが強く求められています。このワークショップでは、若手教員を対象として、新しく授業科目を考え出してシラバスを作成することにより教育の基礎を理解し、新しい教育手法を身につけることを目指します。また、最近制定された北大の教育倫理綱領について学びます。

