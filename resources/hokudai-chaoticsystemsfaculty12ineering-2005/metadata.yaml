name:
  ja: 大学院教育 混沌系工学特論 (2005)
description:
  ja: 統計力学の考え方に基づく情報処理システムの設計と動作解析を、具体例を通して扱う講義である。画像修復、誤り訂正符号、移動体通信、ゲーム理論を題材に、確率的情報処理と情報統計力学による性能評価の方法を学ぶ。
quotedDescription:
  text:
    ja: '確率的情報処理に関する話題の提供 II:

      統計力学の考え方に基づく情報処理システムの設計とその動作の解析がどのように行われるのか、を前年度の「確率的情報処理に関する話題の提供 I」に引き続いて具体例をあげて解説する.

      今年度は昨年度学んだ確率的情報処理のバックグラウンドをベースに、画像修復、誤り訂正符号、移動体通信、ゲーム理論をトピックスに選び、そこでの確率的情報処理、情報統計力学を用いた性能評価の方法について詳しく学んで行く.'
  source: https://ocw.hokudai.ac.jp/lecture/chaoticsystemsfaculty12ineering-2005
