name:
  ja: 令和5年度「東京大学安全の日」講演会
description:
  ja: 東京大学が、7月4日の「東京大学安全の日」に合わせて毎年実施している講演会である。2023年度の第18回では、「現代社会に内在するリスクへの対応」をテーマに扱い、同時に東京大学環境安全衛生スローガンコンテストの表彰式も行う。
quotedDescription:
  text:
    ja: '本学では、平成17年に構成員が潜水作業中に亡くなる事故が発生した7月4日を「東京大学安全の日」と定め、安全の日を迎えるこの時期に、事故の記憶を風化させることなく、教育研究活動における安全衛生の向上、事故災害の発生防止、安全意識の向上及び安全文化の定着を図ることを目的として、毎年「東京大学安全の日」講演会を実施しています。

      第18回となる本年度の講演会は、「現代社会に内在するリスクへの対応」をテーマとして7月4日（火）に開催いたしました。

      ※同時開催：第7回東京大学環境安全衛生スローガンコンテスト表彰式'
