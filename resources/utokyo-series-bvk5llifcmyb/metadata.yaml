name:
  ja: 認知臨床心理学
description:
  ja: 日常生活や臨床場面で問題となる不安、恐怖、抑うつ、幻覚、妄想、自我障害を扱う講義である。ビデオ観察を通して現象を確認したうえで、アセスメント、メカニズム、治療の観点から整理する。認知療法、行動療法、認知心理学、社会心理学を統合する認知行動理論にも触れる。
quotedDescription:
  text:
    ja: 人間の感情や異常心理は、科学最後のフロンティアである。認知療法・行動療法・認知心理学・社会心理学などを統合する形で、認知行動理論（Cognitive-Behavioral Approach)が大きく展開し、臨床心理学はいま大きく様変わりしている。この講義では、日常生活や臨床場面で問題となる不安・恐怖・抑うつ・幻覚・妄想・自我障害といった現象をとりあげる。これらについて、ビデオ観察により現象を理解したあと。アセスメント・メカニズム・治療の側面から整理して解説する。
