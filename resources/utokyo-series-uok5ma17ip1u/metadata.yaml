name:
  ja: ジェンダーを考える（学術フロンティア講義）
description:
  ja: この講義は、ジェンダーや多様性の視点を手がかりに、現代社会の事象や課題を捉え直すことを扱う。日本のジェンダー平等をめぐる現状を取り上げ、各講師の専門領域に基づくトピックを通して学ぶ構成になっている。最後に、講義内容を踏まえたグループ発表とまとめを行う。
quotedDescription:
  text:
    ja: 現代社会では、想定外の政治的課題や事象が次々と起こっている。その際、マジョリティ側とは異なる視点、ジェンダーや多様性の視点を導入することで、複雑な事象や課題を別の視点から捉え、分析することが可能になる。本講義では、ジェンダー平等後進国の日本の現状について、学生が認識を高め、ジェンダーをめぐる多様な問題について自ら考える機会を持つことを目的としている。初回はイントロダクション、2回目から11回目までは各講師の専門領域の視点や切り口からジェンダーに関連したトピックについて講義を行う。第12回、第13回は講義を踏まえグループに分かれて発表を行い、最後にまとめを行う。
