name:
  ja: 原子力規制人材育成事業（*）オープン教材を活用した原子力規制人材育成プログラムの拡充「解説：原子力施設の経年劣化と建設材料の耐久性評価」
description:
  ja: この教材は、原子力施設の経年劣化と建設材料の耐久性評価を主題として、セメント、コンクリート、鉄筋コンクリートの性質や変質を扱う。さらに、劣化機構に基づく対策や設計、点検・調査・診断を踏まえた維持管理シナリオの策定までを取り上げる。
quotedDescription:
  text:
    ja: "解説：原子力施設の経年劣化と建設材料の耐久性評価\n「解説：原子力施設の経年劣化と建設材料の耐久性評価」の教材は全てCC BY-NCのライセンスで公開しています。\n本教材の内容は以下の通りです。\n\
      2-1　セメントの水和機構と化学的変質\n セメント水和物の生成と劣化因子の反応を伴う長期変質挙動\n2-2　コンクリートの空隙構造と物質移行性\n 空隙構造モデルとイオン移動および拡散シミュレーション\n\
      \ \n2-3　鉄筋コンクリートの力学特性と性能評価\n 環境作用に伴う耐力低下とひび割れ発生機構に基づく構造物の性能評価\n \n2-4　劣化メカニズムに基づく対策と設計\n 供用環境における各種劣化機構と補修・補強と性能評価の考え方\n\
      \ \n2-5　維持管理シナリオ\n 点検・調査・診断の在り方と維持管理シナリオの策定\n \n \n「導入：原子力施設の経年劣化と建設材料の耐久性評価」の教材はこちらから視聴可能です。"
