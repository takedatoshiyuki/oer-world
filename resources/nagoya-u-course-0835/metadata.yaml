quotedDescription:
  text:
    ja: '本講義の目的は下記の点です。

      マクロ経済学を基礎としたマンデル − フレミングモデルや為替を中心とした国際金融の理論を学習します。

      ファイナンスやリスク管理、銀行について理論と実証研究成果について学びます。

      履修者は国際金融およびファイナンス理論に関する理解を深め、国際金融や金融現象に関する経済分析ができるようになります。'
