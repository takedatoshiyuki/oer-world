name:
  ja: 北海道大学教育GP「博物館を舞台とした体験型全人教育の推進」 『地域教育の行方』 ―地域活動と大学教育の連携―(2010)
description:
  ja: 地域活動と大学教育の連携をテーマに、学生主体の活動を土台にした地域活動の現状を扱う。あわせて、滋賀県立大学が現代GP採択後の7年間に進めてきた取り組みを紹介する。
quotedDescription:
  text:
    ja: 学生たちが活動の中で地域と共に課題に向き合い、共通の認識を見つけ出した時、地域の願いや、しがらみ、ジレンマを肌で感じることだろう。そこで気づかされる何か。この何かに学生たちの学びのモチベーションを高める秘薬が潜んでいる。より専門性の高い地道な研究をすることが大学としての地域貢献だという意見もある。地域にとっても、突然自分たちの日常に大義を携えて突然やってきた学生に、自分たちの問題や地域活性化の効果を手放しで期待しているわけではない。合意形成を経て地道に歩んでいる地域活動からは、しっかりとした人材や魅力ある資源、営みが生まれている。教育という制度は人間の社会活動のひとつである。現代GP採択により7年間滋賀県立大学が進めて来た学生主体の活動を基本とした地域活動の現在をお話します。
