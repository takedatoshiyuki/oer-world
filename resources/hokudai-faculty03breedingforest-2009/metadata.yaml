name:
  ja: サイエンス・カフェ札幌から Pick up! 魚を育てる森の話（2009）
description:
  ja: オホーツク海と太平洋の生き物が、陸地や川、流氷などの環境とどう関わりながら育まれているかを扱う。アムール川の鉄分が海へ運ばれる流れや、魚付林という森と魚の関係に触れながら、アムール川流域の自然環境をどう守るかを考える。
quotedDescription:
  text:
    ja: 生命の母、海。そこにすむ生き物たちは、陸地や川、流氷など、まわりの環境と深くかかわりながら生きています。今回のカフェでは、「オホーツク海、そして太平洋の生き物が、まわりの環境にどのように育まれているか」を調べている白岩孝行さんにお話しいただきます。
      5年目を迎える「アムール・オホーツクプロジェクト」は、アムール川に含まれる鉄分が千島列島をへて、やがて太平洋へと流れていくことを明らかにしました。そして、この鉄分が海の生き物の生命を支えていることがわかりました。
      今回は、魚付林(うおつきりん)という「森が魚を育てる」しくみに着目します。アムール川流域の巨大な魚付林。アムール川とオホーツク海にかかわる国々が、この自然環境をどうやって守っていくべきか、みなさんと考えていきましょう。
