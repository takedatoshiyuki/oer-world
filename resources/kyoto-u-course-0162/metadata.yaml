name:
  ja: 春秋講義「戦争と平和」の時代とキリスト教
description:
  ja: この講義は、キリスト教が戦争と平和の問題にどう向き合ってきたかを扱う。絶対平和主義と聖戦論という、キリスト教に見られる二つの立場を手がかりに、その関係をどう理解するかを考える。古代キリスト教、内村鑑三を含む明治期の日本キリスト教、現代キリスト教を対象にする。
quotedDescription:
  text:
    ja: キリスト教は、その長い歴史のなかで、多くの戦争に関わってきました。「戦争と平和」の時代を生きてきたキリスト教について、本講義では、絶対平和主義と聖戦論という一見矛盾した二つの立場がキリスト教に同時に見出されることをどのように理解したらよいのか、という問題を取り上げます。特に、古代キリスト教（1世紀と4世紀）、明治時代の日本キリスト教（内村鑑三）、そして現代キリスト教に注目します。
