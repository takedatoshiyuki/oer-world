description:
  ja: 研究における倫理的問題を扱い、研究倫理教育に使える教材である。講義資料は、研究倫理の概説、6つの事例集、倫理テストの考え方と使い方を扱う資料の3つで構成される。授業の事前学習や、事例を用いたグループ討議に使う例が示されている。
quotedDescription:
  text:
    ja: "This educational material is funded by a grant-in-aid for the research project under the auspices\
      \ of the Office of President，Hokkaido University.\nIn this lecture，we consider ethical issues in\
      \ research，or research ethics. It is available to everyone for research ethics education.\n \nAs\
      \ an example of how to use this material，you can watch [Research Ethics] in preparation or at the\
      \ beginning of class，and then conduct a flipped class in which students discuss [Imaginary Cases]\
      \ in groups.\n[Problem Solving Learning in Research Ethics] explains the concept behind examining\
      \ the cases. It is intended to be viewed in preparation or by the discussion facilitator to prepare\
      \ for the class.\n \n[Research Ethics]\nOutline\n1. Introduction\n2. What is Research?\n3. Ethics\
      \ of Research，Ethics in Research\n4. Research Ethics\n5. Research Misconduct\n6. Three Attitudes\
      \ towards Research Ethics\n7. Tests for Judgement of an Act\n8. Imaginary Case\n9. Conclusion\n\
      >> Lecture Materials\n \n[Research Ethics : Imaginary Cases]\nCase 1: ‘Research Methods’\nCase 2:\
      \ ‘An ‘Old-Fashioned’ Mentor’\nCase 3: ‘Career and Funding’\nCase 4: ‘Good Mentee，Bad Mentor?’\n\
      Case 5: ‘Media-savvy Intellectual?’\nCase 6: ‘Troublesome Boss’\n>> Lecture Materials\n \n[Problem\
      \ Solving Learning in Research Ethics]\nOutline\n1. Introduction\n2-1. What are the Ethics Tests?\n\
      2-2. How to Use the Ethics Tests 1: Steps 1 and 2\n2-3. How to Use the Ethics Tests 2: Steps 3-6\
      \ on No Paper Problem\n2-4. How to Use the Ethics Tests 2: Steps 3-6 on No Money Problem\n3. Conclusion\n\
      4. Summary\n>> Lecture Materials"
