name:
  ja: 電磁気学-I
description:
  ja: この教材は、電磁気学の基礎概念と手法を学ぶ講義に対応する講義ノートである。内容は、真空中や誘電体、導体を含む空間における、時間的に変化しない電荷分布と静的な電界を扱う。
quotedDescription:
  text:
    ja: 本講義では、現代科学技術における重要な基礎分野の一つである電磁気学を学び、その基礎概念と手法について理解を深めるとともに、電磁気学とその概念を利用した理工学分野を学ぶための基礎学力を養う。本講義では、真空中や誘電体および導体をふくむ空間に、電荷が分布していて時間的に変化しない静的な電界（電場）について学ぶ。
