name:
  ja: 書く、のはいいが、イッタイ何のため？
description:
  ja: 名古屋大学で2010年に行われた特別講義の教材で、附属高校1・2年生を対象にしたものだ。公開されている資料は、高校生の取り組みの様子を示す講義ノートと、文章を書くことの目的を扱う講義ノートの2件である。出典サイトには、生徒アンケートの問いとして中津川プロジェクトで印象に残ったことや、教科を超えた学問との連携体験に関する項目がある。
quotedDescription:
  text:
    ja: '生徒アンケートより

      中津川プロジェクトに参加して最も印象に残ったことは何でしたか?

      「教科を超えて学問に触れる・社会や大学の学問と連携する」を体験できたとあなたが思う企画は何でしたか?

      学習成果'
