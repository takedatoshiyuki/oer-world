name:
  ja: 'N1: The Chemical Basis of Nature (A) Ｎ１：自然の化学的基礎（Ａ）'
description:
  ja: この教材は、化学の基本知識を手がかりに、自然界と人工物の両方を理解する内容を扱う。あわせて、現代化学と化学技術の発展、その過程で生じた問題、さらに化学・技術行政を考える視点を含む。公開されている動画はコースの一部で、講義資料が1件提供されている。
quotedDescription:
  text:
    ja: 'This course provides a balanced approach for understating natural and artificial worlds based
      on basic knowledge of chemistry. It is designed to enhance understanding of the development of modern
      chemistry and chemical technology as well as problems they have generated, helping students grow
      into citizens in a democratic society able to act on their initiative and judgment regarding chemical
      and technical policies.

      自然および人工的世界を化学的基礎から理解し、現代化学および科学技術の発展と問題点を認識する。また、民主社会における化学・技術行政に関して、知的な判断力を行使できる能力を養う。

      ※Video is partial recording of Course.

      ※この動画はコースの一部を公開しています。'
