name:
  ja: 基礎セミナーA
description:
  ja: 本教材は、名古屋大学の「基礎セミナーA」に関する講義資料で、医学部保健学科の学生を対象にした前期開講の授業に対応する。説明文では、15回構成で意見を伝えたり聞いたりすることを意識しつつ、「女性と健康」をテーマに自ら課題を見つけて取り組む内容としている。卒業研究や博士課程への進学につながることも示している。
quotedDescription:
  text:
    ja: 本セミナーを受講することで、自分の意見を他者に伝える・聞くことを意識した 15 回構成としている旨を学生に伝えている。また、一般的に「看護師とは何をする職業か」のイメージはついても、「看護師の研究」を捉えることが難しい。そのため、3
      年生より始まる卒業研究、博士課程への進学につながるように、「女性と健康」をテーマに、自ら課題を見つけ、取り組むようにしている。
