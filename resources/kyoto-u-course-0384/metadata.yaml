name:
  ja: E.FORUM 全国スクールリーダー育成研修　第13回実践交流会 シンポジウム「学力評価をどう改善するか？―学力評価スペシャリスト研修の成果と今後の課題」
description:
  ja: 本教材は、学力評価の改善が教育実践の改善につながる道筋を扱うシンポジウムの記録である。教師に求められる知識やスキル、理解をめぐる問いを取り上げ、学力評価スペシャリスト研修で得られた成果の一部を示す。公開資料としてプログラムと2件の講義資料が含まれる。
quotedDescription:
  text:
    ja: '概要

      学力評価を改善することによって教育実践を改善する道筋は、どう構想されるのでしょうか？また、そのために、教師にはどのような知識やスキル、理解が必要となるのでしょうか？ 今年度の E.FORUM
      では、「学力評価スペシャリスト」研修の実施を通して、これらの問いを探究してきました。このシンポジウムでは、その成果の一端を紹介しつつ、参加者の皆さんと議論を深めたいと考えています。'
  source: https://ocw.kyoto-u.ac.jp/course/384/
