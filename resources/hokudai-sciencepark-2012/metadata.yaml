description:
  ja: 北海道大学名誉教授の鈴木章氏を招き、子どもたちが科学技術に触れる機会をつくる内容である。見て、触れて、楽しみながら学ぶ体験型の交流の場として構成されている。
quotedDescription:
  text:
    ja: 北海道大学名誉教授の鈴木章氏をお招きし、本道の未来を担う子どもたちに、生活の利便性向上や社会経済の発展に大きく貢献する科学技術への関心を高めてもらうため、「見て、触れて、楽しんで、学ぶ」ことができる「体験型の交流の場」を創出しました。
