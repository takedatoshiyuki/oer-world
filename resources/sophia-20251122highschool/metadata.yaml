  ja: 第15回 上智大学全国高校生英語弁論大会ジョン・ニッセル杯
description:
  ja: '本教材は、第15回上智大学全国高校生英語弁論大会ジョン・ニッセル杯を扱う。大会テーマは「The Future of Japanese Tradition」で、全国から集まった高校生20人が、経験を含むさまざまな視点からスピーチを行ったことが示される。

    また、審査を通じて上位6名と英検賞・TOEFL賞の受賞者が表彰されたことまで含む。'
quotedDescription:
  text:
    ja: "第15回を迎える今回の大会テーマは、“The Future of Japanese Tradition”。 過去最大の334人の応募者のなかから厳しい一次審査を通過した20人の高校生が全国から集まり、自分自身の経験を含めた様々な視点から、内容・語学力ともに見事なスピーチを披露しました。\
      \ \n 審査の結果、上位6名と特別賞の「英検賞」1名及び「TOEFL賞」1名の合計8名が表彰され、トロフィー、表彰状、副賞が授与されました。"
