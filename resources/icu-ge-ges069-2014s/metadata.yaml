name:
  ja: S2:Introduction to American Studies S2:アメリカ学
description:
  ja: この教材は、アメリカ学の導入として、現代アメリカの人種、ジェンダー、日米関係などの論点を学際的に扱う。あわせて、アメリカの歴史的形成を、植民地時代から独立、南北戦争、国家神話、政教分離に関する最高裁判断までたどる。講義資料に加えて2本の動画とゲストレクチャーを含む。
quotedDescription:
  text:
    ja: 'Through an inter-disciplinary approach to contemporary issues of American society such as ethnicity,
      feminism, Japan-American relationships, etc., an orientation to American studies will be given.
      According to each subject, special guests from various disciplines, including ICU faculty and visiting
      professors, will be invited.

      現代アメリカの人種問題，女性問題，日米（文化）関係などの諸問題を学際的に取り扱うことを通して，アメリカ研究への視野を開く。テーマは毎年変更し，そのテーマに則した研究者を学内外から招く。

      Contents of Lectures

      23 Lectures / 2 Videos

      Lecture 1

      アメリカ学とは

      Lecture 2

      アメリカ的なるものとは

      Lecture 3

      地理、歴史、地勢

      Lecture 4

      神話と象徴学派

      Lecture 5

      階級、人種、ジェンダー

      Lecture 6

      ピューリタン的起源

      Lecture 7

      討論とここまでの復習

      Lecture 8

      プリマス植民地の成立

      Lecture 9

      マサチューセッツ湾岸植民地 公民資格

      Lecture 10

      神政政治の衰退 中途契約

      Lecture 11

      魔女事件

      Lecture 12

      エドワーズとホイットフィールド

      Lecture 13

      第一次覚醒運動、第二次覚醒運動

      Lecture 14

      独立戦争と独立革命

      Lecture 15

      連邦憲法と修正条項第一条

      Lecture Note

      Lecture 16

      Video I: Mr. Smith Goes to Washington

      Lecture 17

      討論

      Lecture 18

      南北戦争

      Lecture 19

      Video II: Lincoln

      Lecture 20

      ゲストレクチャー

      Lecture 21

      国家神話の形成

      Lecture 22

      国旗と国歌 忠誠誓約

      Lecture 23

      政教分離と最高裁判断'
