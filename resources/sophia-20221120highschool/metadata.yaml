name:
  ja: 第12回 上智大学全国高校生英語弁論大会ジョン・ニッセル杯
description:
  ja: 全国の高校生が参加する英語弁論大会の第12回開催の様子を収める。大会テーマに沿って、参加者が自身の経験を含む多様な視点からスピーチを行い、審査の結果、上位入賞者と特別賞受賞者が表彰されるまでを扱う。
quotedDescription:
  text:
    ja: "第12回を迎える今回の大会テーマは、“Coexistence for a Sustainable Future”。3年ぶりの対面での開催となり、264人の応募者のなかから厳しい一次審査を通過した19人の高校生が全国から集まり、自分自身の経験を含めた様々な視点から、内容・語学力ともに見事なスピーチを披露しました。\
      \ \n 審査の結果、上位6名と特別賞「英検賞」1名の合計7名が表彰され、トロフィー、表彰状、副賞が授与されました。"
