name:
  ja: 並列アルゴリズム
description:
  ja: 並列計算機やネットワークで結ばれた計算機クラスターを対象に、分散型環境で用いるアルゴリズムを扱う。あわせて、それらのアルゴリズムにおける通信量と計算時間を論じる。
quotedDescription:
  text:
    ja: '計算を高速に行うための手法として、計算の並列化があります。

      たとえばスーパーコンピュータは並列に計算を行い、高速に答を出力します。

      また、ネットワークに接続された複数の計算機をうまく使えば、

      計算の負荷を分散することができるかもしれません。

      この授業では、並列計算機やネットワークで結ばれた

      計算機クラスターのような分散型環境のためのアルゴリズムを紹介し、

      その通信量及び計算時間を論じます。'
