  ja: 身近な物理
description:
  ja: 日常に見られる現象を物理学の視点で捉え、毎回2～3の話題を取り上げて進める講義である。熱、光、音、電気製品、スポーツ、自然、おもちゃ、料理に関する物理に加え、宇宙や量子力学などの話題も扱う。
quotedDescription:
  text:
    ja: 日常に見られる現象について，物理学の目で見た解釈を講義する．生活の中にはおもしろい物理が沢山あるので，毎回2～3の話題を取り上げて皆で考えながら，講義を進めていく．具体的には，熱の物理，光の物理，音の物理，電気製品の物理，スポーツの物理，自然の中の物理，おもちゃの物理，料理の物理，などをテーマとして取り上げる．また，身近でないテーマ（宇宙，量子力学など）もいくつか話題にする．
