name:
  ja: 心に挑む－心理学との出会い、心理学の魅力（学術俯瞰講義）
description:
  ja: 東京大学の心理学系教員が、それぞれの関心から進めている研究を具体的に紹介する講義である。心理学研究の最先端がどのような内容かを取り上げ、学問としての心理学に触れる構成になっている。心理学関係諸学科への進学を考える受講者も視野に入れている。
quotedDescription:
  text:
    ja: 心理学ほど一般から誤解されている学問も珍しい。この講義では、東京大学の心理 を専門とする教員が、どのような興味から、どのような研究をおこなっているかを具 体的に紹介したい。この講義によって、心理学研究の最先端の面白さと深さを感じて
      いただきたい。心理学関係諸学科に進学を希望する諸君の聴講も大いに期待する。
  source: https://ch.u-tokyo.ac.jp/series/?id=JY21rncm4g9n
