description:
  ja: 東日本大震災による健康被害を、公衆衛生と情報マネジメントの観点から扱う東京大学大学院医学系研究科公共健康医学専攻のフォーラムである。震災と津波、福島第一原子力発電所事故に伴う状況を背景に、これらの課題を中長期的な視点で考える内容となっている。
quotedDescription:
  text:
    ja: 東京大学大学院医学系研究科公共健康医学専攻（ＳＰＨ）は7月5日、「東日本大震災の健康被害－－公衆衛生と 情報マネジメント」をテーマに、二回目のフォーラムを開催いたしました。地震と津波による大きな被害、その後の福島第一原子力発電所の事故の影響は、これ
      までに私たちが経験したことのない深刻な事態となっています。本学ＳＰＨとして、さまざまな課題にどう対処していくべきか、中長期的な視点でとらえようと いうもの…
