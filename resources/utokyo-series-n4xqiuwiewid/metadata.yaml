  ja: 東京大学のホームカミングデイにおける文学部企画を収録する。第1部では古井由吉が翻訳と創作を題材に講演し、第2部では安藤宏、中地義和、大宮勘一郎を交えて文学部をめぐるシンポジウムが行われる。
