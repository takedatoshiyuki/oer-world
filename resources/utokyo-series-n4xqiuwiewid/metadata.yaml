    ja: 第11回ホームカミングデイの文学部企画。第1部は芥川賞・谷崎潤一郎賞等多数の文学賞を受賞した、日本を代表する作家である古井由吉氏（本学文学部ドイツ文学科卒）を招いて、「翻訳と創作と」と題した講演が行われた。第2部では安藤宏教授、中地義和教授、大宮勘一郎教授が加わり、「文学部というところ」というテーマでシンポジウムが開かれた。
