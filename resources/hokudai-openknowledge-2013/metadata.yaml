  ja: 北海道大学情報基盤センター共同研究講演会 知識のオープン化と教育の未来（2013）
description:
  ja: ウィキペディアやクリエイティブ・コモンズを手がかりに、知識のオープン化をめぐる論点を扱う講義資料である。オープン化が起こる理由、進展の是非、定義の問題までを取り上げ、情報社会と教育の関係を考える。
quotedDescription:
  text:
    ja: 近年、情報社会の未来と知識のオープン化への関心がますます高まっています。本講演では、ウィキペディアやクリエイティブ・コモンズなど、情報の「オープン化」に深く関与してきた渡辺智暁氏を講師に迎え、なぜオープン化がおきているのか、オープン化の進展は望ましいことなのか、そもそもオープン化をどう定義するのか、といった根本的な問題について考えます。
