name:
  ja: 臓器移植
description:
  ja: 臓器移植の基礎知識に加え、京都大学での臨床経験から得られたデータを扱う講義である。公開教材では、肝移植の適応や臓器提供者の選択、免疫抑制療法、感染症、合併症、各種疾患に対する肝移植までを取り上げる。
quotedDescription:
  text:
    ja: '授業の特色

      臓器移植は、手術手技・免疫抑制剤の発達とともに1980年代から実験的医療から一般医療へと変貌した。京都大学においても１９９０年より生体肝移植が始まり、2004年には1000例をこえ、世界で最多数の実績を達成した。また生体小腸移植や生体膵島移植も手がけている。この歩みの中で得た見識を我々は広く公開してきた。そのため国内はもとより欧米を含む世界中から研修生が訪れ、帰国後それぞれの地で生体肝移植を芽吹かせている。

      授業の紹介

      臓器移植に関する基礎的な知識、京都大学における実際の臨床経験から抽出されたデーター、移植医療の最先端について紹介する。'
  source: https://ocw.kyoto-u.ac.jp/course/97/
  note: 京都大学OCW 「講義概要」より（同サイトの利用条件に基づく転載）
