name:
  ja: 北海道大学プロフェッサー・ビジット 循環型社会と低炭素社会(2010)
description:
  ja: ペットボトルや家電製品のリサイクルと、そのアジア各国への輸出を取り上げる。日本の循環型社会制度が実際に環境にどのような結果を生んでいるのかを検討し、持続可能な低炭素社会の実現に向けた課題にも触れる。世界の視点から循環型社会と低炭素社会を考える内容である。
quotedDescription:
  text:
    ja: 'ペットボトルや家電製品がリサイクルされアジア各国に輸出されています。日本は世界に先がけ循環型社会という制度を作っていますが、本当に環境に優しい結果を生んでいるのか。この問題を持続可能な低炭素社会の実現への課題にも触れながら、世界の視点で考えてみましょう。

