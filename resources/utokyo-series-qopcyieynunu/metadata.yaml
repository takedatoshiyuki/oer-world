name:
  ja: 学問と人間（学術俯瞰講義）
description:
  ja: 大学の変革期を背景に、学問そのものの意味を考え直す講義である。人文・社会・心理の分野、とくに思想・宗教や学問論に関わる視点から、学問と人間の関係や、人間を対象とする学問がどう成立するかを扱う。
quotedDescription:
  text:
    ja: 現在、大学は、第二次大戦後３度目といわれる、大きな変革期に直面しています。第１の変革期は、戦後まもなく、旧制大学から新制大学への移行期であり、第 ２のそれは、１９６８／６９年、全世界的なスチューデント・パワーが大学を席巻した時代です。
      それぞれの変革期には、大学のありかたが問われるとともに、学問それ自体が鋭く問われてきました。この、第３の変革期も例外ではありません。学問を問うこ とは、学問を担う人間を問うことであり、そもそも学問と人間との関係それ自身を問いかえすことです。学問とは、すぐれて人間による営みであるからです。
      人間、文化、社会、歴史を問題とする学問領域は、同時に、みずからの営みそれ自体を問いかえす宿命を帯びています。それは、人間を対象とする学問（科学） は、そもそもいかにして可能なのかを問い、理性とは背反するとされる対象を学問的に考察する意味を問い、真理それ自体の、いわゆる「客観性」と「歴史性」
      に対して、あらためて問いかけます。 この講義は、「学術俯瞰講義」シリーズのひとつとして、人文・社会・心理の分野、とりわけ思想・宗教や学問論の分野において広い視野をもった本学関係者が 講師を担当します。この講義によって学生諸君が学問自体の意味を問う営みに触れ、また人文・社会系統の学のありかたに触れられることを望んでいます。
