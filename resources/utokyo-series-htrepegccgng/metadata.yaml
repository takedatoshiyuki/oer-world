name:
  ja: 数理の世界－新世紀の数学を探る（学術俯瞰講義）
description:
  ja: 数学の複数分野を広く見渡し、代数、幾何、解析、応用数理の4領域から特徴的なテーマを取り上げる講義である。各分野の専門家が、それぞれの視点から数学の見取り図を示す構成になっている。
quotedDescription:
  text:
    ja: 数学は、二千年以上の長い歴史を有し、現在もなお活発な研究がなされ、急速な発展を続けている分野である。数や図形の深い性質、関数や空間の構造が次々に明らかにされており、約350年間懸案だったフェルマー予想の解決や、約100年間未解決だったポアンカレ予想が解かれる等、最近の数学の進展には目を見張るものがある。また、数学は思考の自由さと汎用性の広さが特徴の分野で、諸科学の共通言語として、理学、工学、経済学、社会学など様々な分野に応用されている。たとえば、コンピュータの原理の発見のように、数学は時として社会を根底から変えてしまうような力も秘めている。数学は、人工的に分割できるものではないが、便宜上、代数、幾何、解析、応用数理の４つの領域にわけて考える習慣がある。そして自然や社会の現象を解析する応用面からみた数学をふくめて数理科学と呼んでいる。今回の俯瞰講義では、それぞれの領域において、特徴的なテーマを取り上げ、国際的に活躍する専門家によって広い視野から数学を俯瞰し、皆さんがこれから勉学して行く上での水先案内をしたいと考えている。前期課程で学んでいる数学が、今後学ぶであろう様々な分野の基礎であることを再認識し、皆さんがこれから進むべき道への展望を得るきっかけとなることを期待する。
