name:
  ja: アカデミック日本語５（漢字２２００）
description:
  ja: 約2200字の漢字とその単語を、使用頻度の高い順に学ぶ講義である。既習の約800字を土台に、語彙を増やしながら漢字数を広げていく構成になっている。公開教材には、読み書きの問題と解答、単語と例文の資料が含まれる。
quotedDescription:
  text:
    ja: この講義では約2200字の漢字とその単語をよく使われる順に学びます。800字程度の漢字を既に学習した人が、既習漢字の語彙を増やし、さらに漢字を増やすためのクラスです。 一回の授業は二部に分かれます。一部では漢字とその語彙を、よく使われる順にテストをしながら学びます。二部では、漢字に関するさまざまなトピックで授業を進めます。この講義は、漢字に関する総合的な知識を持ち、漢字とその語彙を理解し、使え
  source: https://ocw.nagoya-u.jp/courses/0441-%E3%82%A2%E3%82%AB%E3%83%87%E3%83%9F%E3%83%83%E3%82%AF%E6%97%A5%E6%9C%AC%E8%AA%9E%EF%BC%95%EF%BC%88%E6%BC%A2%E5%AD%97%EF%BC%92%EF%BC%92%EF%BC%90%EF%BC%90%EF%BC%89-2018/
