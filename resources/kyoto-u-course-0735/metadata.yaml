name:
  ja: 民法III（債権総論）
description:
  ja: 民法第三編債権を対象に、契約・事務管理・不当利得・不法行為などから生じる債権に共通する効果を扱う講義資料である。債権総論の導入から始まり、債権の種類、債務不履行、損害賠償、債権者代位権、債権者取消権までを順に取り上げる。出典文では、これらの論点について判例・学説の解釈を踏まえて考察することが示されている。
quotedDescription:
  text:
    ja: 民法第三編債権として、各種の債権発生原因（契約・事務管理・不当利得・不法行為）から生じる債権に共通の効果を規定している制度を概観し、現代の諸問題に対して、判例・学説が解釈によっていかに対応する諸準則を展開しているかを考察する。講義項目の順序・日程などの詳細な予定は、教科書等の説明と共に、最初の時間に示す。また、講義の際には、レジュメを配布する。
