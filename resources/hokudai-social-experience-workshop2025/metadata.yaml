name:
  ja: 全学教育 社会体験ワークショップ（2025）
description:
  ja: 北海道を代表するゲスト企業等との対談を通じて、実社会の課題や展望について議論する講義である。公開教材では、各企業等の取組やゲスト講師の体験談を中心に、講演動画と講義資料の一部を扱う。
quotedDescription:
  text:
    ja: '前年度に引き続き、北海道を代表するゲスト企業等との対談形式で実社会の課題や展望についてディスカッションを行う「社会体験ワークショップ」を開講しました。

      >> 2024年度の取組はこちら

      >> 2023年度の取組はこちら

      >> 2022年度の取組はこちら

      オープンコースウェアでの公開内容は、講演動画7社（北大生とのディスカッションを除く）、講義資料8社と授業の一部ですが、各企業等の取組やゲスト講師の体験談（これまでのキャリアや学んだこと）を中心に、道内企業等の魅力を実感できる内容です。

      ぜひご覧ください！'
