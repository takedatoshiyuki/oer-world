name:
  ja: サイエンス・カフェ札幌から Pick up! コミュニケーションする脳！？ ～脳をカオスで語る～（2010）
description:
  ja: 脳とコミュニケーションの関係を、数理科学の視点から扱う講義である。コミュニケーションの際に脳内で起こる神経細胞の相互作用を取り上げ、それをカオスという数理科学的な切り口で考える。
quotedDescription:
  text:
    ja: 私たちは一人ひとり考え方や感じ方が異なっています。それは、私たちがそれぞれ違う脳をもっていることと大きく関係しています。それにもかかわらず、コミュニケーションを通してお互いの思いや情報を共有し合うことができます。どうしてでしょうか？今回のサイエンス・カフェ札幌では、北海道大学の津田一郎さんに、数理科学の観点から脳とコミュニケーションの関係についてお話をしていただきます。私たちがコミュニケーションを通して思いや情報を伝え合っているとき、脳内では神経細胞の複雑な相互作用が起こっています。津田さんは、この現象をカオスという数理科学的側面から解明する研究に第一線で取り組んでいます。
