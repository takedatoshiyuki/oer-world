name:
  ja: オンライン勉強会「オンライン環境を活用した授業内課題の評価 ー 相互評価データに項目反応モデルを適用した実践事例 ー」（2021.07.19）
description:
  ja: オンライン授業で行う授業内課題の評価を題材に、学生同士の相互評価データを分析する事例を扱う。学生の評価者としての特性を考慮しながら、項目反応モデルを実践に適用した内容を含む。あわせて、学習評価やテストに関する基礎事項にも触れる。
quotedDescription:
  text:
    ja: '高等教育推進機構オープンエデュケーションセンター（OEC）では、効果的なオンライン教育の実施に向けて、オンライン授業ガイドの運用、オンライン授業に関する講習会、Slackコミュニティ「お～ぃ知ってる？オンライン教育サークル（OeCi）」の運営など、継続的な情報発信に取り組んでいます。さらに今年度は、オンライン教育に関わる勉強会を公開し、広く参加者を募る所存です。

      今回のオンライン勉強会では、心理統計学や教育測定学がご専門で、これまで公的試験の実務にも携わってこられた岩間徳兼氏（高等教育推進機構 高等教育研究部 准教授）にご登壇いただき、昨年度のオンライン授業において、ご自身の専門を生かして実践された
      “オンライン授業における授業内課題の評価” について話題提供していただきました。

      学生同士で相互評価させることには、学習者の内省を促すことや、学習動機向上などの効果が期待されますが、その一方で学生の評価者としての能力は一定ではないという問題があります。

      そこで、評価者としての学生の特性を考慮した上で課題遂行に関する能力を推測するために、テストデータの分析で利用される数理モデルを学生間の相互評価データに適用した事例について報告していただきました。数理的側面に関する説明は最小限にとどめるとともに、実践報告に関連した学習評価やテストに関する基礎事項についても触れていただきました。分野に馴染みのない方も、ぜひご覧ください。'
