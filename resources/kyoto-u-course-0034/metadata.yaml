name:
  ja: 欧米経済史
description:
  ja: 第二次大戦後から1970年代までの西ヨーロッパの経済復興と欧州統合を、アメリカの対欧州戦略という観点から追う講義である。戦後秩序の転換の中で、イギリス帝国の解体問題やドイツ問題がどのように位置づけられたかを扱う。あわせて、1970年代までに形成された米欧日相互依存の構図を検討する。
quotedDescription:
  text:
    ja: '授業の特色

      本講義は、第二次大戦後から1970年代にかけての欧州統合の史的展開をアメリカの欧州統合戦略の視点から時代毎の画期に分けて検討し、米欧相互依存関係の基本的構図を解説します。

       

      授業の紹介

      本講義の目的は、第二次大戦後から1970年代にかけての西ヨーロッパの経済復興・統合をパクス・アメリカーナの展開過程として把握することにある。パクス・ブリタニカ（19世紀までのイギリス主導の国際秩序）からパクス・アメリカーナ（第二次大戦後のアメリカ主導の国際秩序）への転換過程においては、イギリス帝国の解体問題ドイツ問題が大きな問題であった。第二次大戦後の西欧統合のプロセスを通じて、アメリカがこの２つの問題をどのように解決し、1970年代までに米欧日相互依存システムを構築したか検討する。'
