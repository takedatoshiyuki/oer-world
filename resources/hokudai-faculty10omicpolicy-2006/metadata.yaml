description:
  ja: 公共政策の基本科目に入る前提として置かれた経済政策の講義で、財政・金融政策に限らず、日本経済や世界経済の構造変化まで視野に入れて扱う。学際的な観点から経済政策を体系的に整理し、理論と実践の両面を結びつけて学ぶ内容である。
quotedDescription:
  text:
    ja: '本科目は、公共政策の基本科目のうち、学生の知見を標準化するための前提科目の一つとして開講される。

      経済政策に関し、財政・金融政策といった範囲に限定することなく、日本経済、世界経済の構造変化等

      学際的な視点から体系的に方向づけ、理論と実践を融合した経済政策の知識と応用力を形成することを目的としている。'
