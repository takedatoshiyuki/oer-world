name:
  ja: サイエンス・カフェ札幌から Pick up! 畑と食卓のおいしい関係（2008）
description:
  ja: 食料自給率や国産食材の問題を手がかりに、日々の食生活と食品流通の関係を考える。安全性や品質をめぐる消費者の行動が流通にどう関わるかを、流通経済論の視点から扱う。
quotedDescription:
  text:
    ja: 'あなたは今日何を食べましたか? その中に国産の食材はどのくらい含まれていたでしょうか?

      毎日の生活の中で「食べる」ことは当たり前のことのように思いがちですが、我が国の食料自給率は40%にとどまっています。そんな中、安全性や品質への不安から、国内産の食材への需要はますます高まっています。「安全でおいしく安い食品」が欲しい―。私たち消費者にとっては当たり前のニーズですが、そこには矛盾があります。安全性や品質を高めようとすればそれに応じたコストがかかるからです。繰り返される産地偽装や改ざんは、決して許されることではありませ
      んが、その背景には「安全でおいしい食品」を少しでも「安く」手に入れたいという私たちの意識・行動が影響しているのです。

      今回のサイエンス・カフェでは、より安心・安全な食生活実現にむけて、消費者の行動と食品流通の関係に、流通経済論の視点からアプローチします。

      「食べること」に関わる一人として、今一度、自分たちの「食」のあり方を見つめ直してみませんか?'
