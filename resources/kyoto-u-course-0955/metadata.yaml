  ja: ポケットゼミ メディアアート研究
description:
  ja: 日本文化を支える要素を題材に、研究とメディアアート制作を行う講義である。出典サイトでは、日本の自然風土や日本文化とアジア文化との関係、神仏習合、日本語の特性、日本的意匠を扱うとしている。公開教材には、2010年度学生作品として「俳句とかさね
    HitchHaiku + Kasane」の題名をもつ講義資料が8件ある。
quotedDescription:
  text:
    ja: '授業のテーマと目的

      日本文化を支える以下の項目をテーマに研究し、メディアアートを制作する。

      ・日本の自然風土

      ・日本文化とアジア文化との関係性

      ・神仏習合

      ・日本語の特性

      ・日本的意匠（デザイン）

      教員ホームページ'
