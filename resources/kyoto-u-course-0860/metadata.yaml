  ja: 京都大学とUNDPの協力協定締結を記念して開かれる国際シンポジウムである。UN機関と高等教育機関の連携をテーマに、2017年1月13日に京都大学大学院総合生存学館が主催し、GSSが支援する形で実施される。
quotedDescription:
  text:
    ja: 'Course Description

      Kyoto University and the United Nations Development Programme (UNDP) will be commemorating the April
      2016 conclusion of their comprehensive cooperation agreement with the International Development
      Symposium “Collaboration Between UN Organization and Higher Education — Ceremonial Symposium for
      Conclusion of MoU Between United Nations Development Programme (UNDP) and Kyoto University”, to
      be held Friday 13 January as follows.

      The event will be hosted by the Kyoto University Graduate School of Advanced Integrated Studies
      in Human Survivability (GSAIS, or “Shishu-Kan”), the University’s lead institution for the MoU,
      with support from the Inter-Graduate School Program for Sustainable Development and Survival Societies
      (GSS).'
