name:
  ja: 平成30年度 エネルギー科学研究科公開講座「『エネルギー科学の今』 〜リスク制御とものづくり〜」
description:
  ja: 太陽光エネルギーを電気や化学反応に変換する方法として、太陽電池と光触媒を扱う。シリコンや酸化チタンを代表例に、ほかの材料も含めて取り上げ、既存材料との違いや研究の動向、今後の見通しを述べる。
quotedDescription:
  text:
    ja: 太陽光エネルギーを利用する方法には、光から電気をつくる太陽電池、光で励起させた電子と正孔（ホール）を化学反応に使う光触媒などがあります。太陽電池ではシリコン、光触媒では酸化チタンが代表的な材料ですが、シリコンや酸化チタン以外にも、いろいろな材料が研究されています。本講演では、これらの材料のいくつかを紹介すると共に、既存のシリコンや酸化チタンとの相違点、現状の傾向、今後の展望などについて概説します。
