name:
  ja: 生物化学2
description:
  ja: 細胞内での物質代謝とエネルギー獲得の仕組みを扱い、酵素の基本概念や反応速度論、数値計算にも触れる。解糖系を含む代謝経路とその調節、さらに酸化的リン酸化によるATP生産機構までを講義する。
quotedDescription:
  text:
    ja: '生物に共通する細胞での物質代謝とエネルギー獲得の概念、具体的な詳細経路に関する理解、そして代謝に関わる酵素の基本概念と数値計算にも習熟することを到達目標とする。

      生物が食物あるいは栄養成分として摂り入れた物質は、エネルギーを得るため、あるいは自らの構成成分を作り出す素材を得るために様々な仕組みで代謝される。本講義では酵素触媒反応の特徴、酵素反応の速度論、解糖系をはじめとする代謝経路と調節機構、生理的意義、さらに酸化的リン酸化による
      ATP 生産機構とその調節などを中心に代謝のダイナミズムについて深く理解できるよう講義する。'
