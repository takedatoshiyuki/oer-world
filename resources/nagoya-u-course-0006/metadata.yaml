name:
  ja: 情報と法
description:
  ja: 情報化社会の現状とそれに伴う法的諸問題を扱い、情報技術の発展や社会の情報化が何を意味するかを考察する。あわせて、ネットワーク、セキュリティ、知的財産権、著作権、ソフトウェア保護に関する参考資料を公開している。
quotedDescription:
  text:
    ja: '情報化社会の現状と法的諸問題について講義するとともに、情報技術の発展が何を意味するのか、社会の情報化の本質は何かという問題に考察を加える。特に、それが従来の社会とそれを支えていた様々な価値・理念にいかなる変容をもたらすか（あるいはもたらさないか）を理論的見地から問題とし、具体的な法制度との関連を追求する。基本的に講義形式だが、前提となる技術的知識については適宜説明を加えるとともに、実際に利用・経験してみる課題を課す。

      情報化の進展に伴う法的諸問題の現状について、正確な知識を習得する。

      情報化社会論の知識と考え方を習得する。

      社会の理論的分析を行うための知識と考え方を習得する。

      情報技術について一定程度の正確な知識を習得する。'
