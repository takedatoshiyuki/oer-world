name:
  ja: 【オンライン公開講義】”立ち止まって、考える” シーズン2 「科学哲学の観点からみたコロナをめぐる言説」
description:
  ja: 新型コロナウイルスをめぐって語られてきた感染経路、治療法、対処法などの話題を、科学哲学の観点から取り上げる。科学の方法論に関する考え方を踏まえ、情報の真偽やもっともらしさをどう受け止めるかを考える内容である。
quotedDescription:
  text:
    ja: 'この一年間、われわれは新型コロナウイルスについて、感染経路や治療法・対処法などいろいろなことを語り合ってきました。このウイルスについての科学的な情報の真偽やもっともらしさを見極めなくてはならないようなことがらも多かっただろうと思います。

      わたしが専門とする科学哲学は、科学の実践とは少し距離をおきながら、科学の方法論などについて考える分野です。　決して直接どの情報が信用できるかが科学哲学からわかるわけではありませんが、そうした情報との接し方、距離のとり方について、少し参考になるような話はできるのではないかと思います。

      オリジナルのコンテンツは、人社未来形発信ユニットのウェブサイトでご覧いただけます。

      https://ukihss.cpier.kyoto-u.ac.jp/2313/'
