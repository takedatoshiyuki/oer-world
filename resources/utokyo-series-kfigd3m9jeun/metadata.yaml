description:
  ja: 第二次世界大戦期の経済体制から戦後改革、戦後復興を経て、高度経済成長に至るまでの日本経済史を扱う。日本の近代史を経済の視点からたどり、経済活動と社会・政治の関係を考える内容である。
quotedDescription:
  text:
    ja: 日本の近代史を「経済」という視点から描きなおす。現代日本経済史ⅡではⅠに続き、第二次世界大戦期の経済体制から始まり、戦後改革と戦後復興を経 て、高度経済成長に向かうまでの歴史を扱う。一国の経済活動とその状態は、そのときどきの社会情勢を大きく動かし、社会制度や政治をも変化させる大きな要
      因となる。日本の近代史における、経済活動と社会・政治のダイナミズムの関係を振り返ってみよう。
