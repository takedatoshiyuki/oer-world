name:
  ja: 第9回上智大学全国高校生英語弁論大会ジョン・ニッセル杯
description:
  ja: 全国から集まった高校生20人が、与えられたテーマに沿って英語でスピーチする大会の様子を扱う。各発表は4分以上5分以内で、終了後には審査員の質問に英語で応答する。
quotedDescription:
  text:
    ja: '第9回を迎える今回の大会テーマは、“What YOU Can Do Today for Tomorrow”。206人の応募者のなかから厳しい一次審査を通過した20人の高校生が全国から集まり、自分自身の経験や様々な視点から、深く考え抜かれたスピーチを豊かな表現力で披露しました。

      大会ルールとして、スピーチの長さは4分以上5分以内、スピーチ後に審査員からの質問に英語で答えることとなっています。'
