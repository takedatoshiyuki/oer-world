quotedDescription:
  text:
    ja: '患者の主訴と症状より、急性期管理における緊急性と重症性を評価する方法を学ぶ。

      救急医学の対象とする緊急性の高い病態について、基本となる診断と治療を理解する。

      救急・集中治療医学の対象とする重症病態について、重症に対する診断と治療を理解する。

      救急医療法制・救急医療体制・災害医療体制と救急・集中治療専門医の関連を学ぶ。'
