  ja: Liberal Arts Seminar リベラルアーツセミナー
description:
  ja: 本講義は、リベラルアーツ教育への導入として、文献の精読やエッセー執筆、プレゼンテーション、議論を通じて学修のための方法論的知識と技能を扱う。担当教員によって学問分野や開講言語が異なり、動画はコースのレビューセッションとして収録されたものである。
quotedDescription:
  text:
    ja: 'Seminar introducing liberal arts education. Small class size. Aims to have students acquire methodological
      knowledge and skills necessary for receiving a liberal arts education through careful reading of
      literature, essays, presentations, and discussions. Academic fields and languages of instruction
      differ by faculty member. Enrollment during the first or second year is strongly recommended.

      リベラルアーツ教育への導入セミナー。少人数のセミナー形式で、文献の精読、エッセーの執筆、プレゼンテーション、議論等を行うことにより、リベラルアーツ教育の学修に必要な方法論的知識、技能を習得することを目的とする。扱う学問分野および開講言語は担当教員により異なる。第1年次または第2年次での履修を強く勧める。

      ※Video is Review Session of Course.(Recording on June 19, 2018.)

      ※この動画はコースのレビューを公開しています。(2018年6月19日収録）'
