name:
  ja: フランス文化学講義IIa / フランス文学講義
description:
  ja: ロマン主義を中心に、フランス文学の作品とその時代背景、文学史上の位置づけを扱う講義である。あわせて、絵画・音楽・建築など他分野の芸術や、古典主義、社会・政治との関係にも踏み込む。ドイツ、日本、イギリスのロマン主義にも触れ、比較の視点を含む。
quotedDescription:
  text:
    ja: '本講義の目的は、18 世紀から 19 世紀末までのフランス文学主要な作品のうち、ロマン主義に関わるものを取り上げて、考察することです。目標は文学と芸術（音楽、美術、建築）についての考察を深め、同時にフランス文学史についての知識を修得することにあります。

      ロマン主義とはなにか、考察を深めます。関連するフランス文学の作品を取り上げ、作品の特徴や時代背景を説明して文学史の知識を習得した上で、特徴的な箇所を鑑賞します。また関連する絵画、音楽、建築等の芸術の各ジャンルとの連動についても解説します。

      主に扱う主題は以下の通りです。

      ロマン主義と古典主義、芸術運動と社会・政治

      18 世紀フランス文学におけるロマン主義

      ドイツロマン主義とスタール夫人

      シャトーブリアン

      ラマルチーヌ、ヴィニー、ユゴー、ミュッセの詩

      演劇、特にエルナニ事件とユゴー『クロムウエル』序文

      中世への回帰、ユゴー、バルザック、フロべール、ネルヴァル

      ロマン主義の継続と反動、ボードレール、ルコント・ド・リール

      日本におけるロマン主義

      イギリスにおけるロマン主義、シェークスピアからラスキンへ'
