name:
  ja: 第8回上智大学全国高校生英語弁論大会ジョン・ニッセル杯
description:
  ja: 全国の高校生が参加する英語弁論大会を扱う。テーマに沿って、応募者の中から選ばれた高校生が4〜5分のスピーチを行い、その後に審査員の質問へ英語で応答する流れを収録する。
quotedDescription:
  text:
    ja: '第8回を迎える今回の大会テーマは、“Action Speaking Louder than Words”。179人の応募者のなかから厳しい一次審査を通過した20人の高校生が全国から集まり、自分自身の経験や様々な視点から、深く考え抜かれたスピーチを豊かな表現力で披露しました。

      大会ルールとして、スピーチの長さは4分以上5分以内、スピーチ後に審査員からの質問に英語で答えることとなっています。'
