name:
  ja: 第84回 京都大学丸の内セミナー「森・里・海のややこしい三角関係」
description:
  ja: 森から海へとつながる栄養物質の循環や、それを利用するプランクトンの生産、川と海を行き来する魚類の生態を取り上げる。あわせて、人間活動が加わることで森・里・海の関係がどのように複雑になるかを扱う。
quotedDescription:
  text:
    ja: '「森は海の恋人」という有名なキャッチフレーズがある。この言葉は「豊かな森が豊かな海を育む」と言い換えることができる。私たちの感性はこの命題は真であると強くささやくが、自然科学を通して森と海のつながりとそのメカニズムを明らかにすることは容易ではない。

      　私が所属する京都大学フィールド科学教育研究センターは、森から海までの生態系や社会のつながりを研究する「森里海連環学」という新たな学問領域の創生をめざして研究を進めている。この中で「里」は人間が活動する場を示す。人間は森、河川、沿岸域を様々に利用することから、人間活動を通して森里海の関係は非常に複雑になる。

      　本講演では、私たちの研究成果を中心に、森から海に至る栄養物質の循環、それを利用するプランクトンの生産、川と海の間を行き来するウナギやスズキなどの魚類の生態について紹介し、そこに人間活動が介在することによって生じる森里海のもつれた三角関係を探索する。'
  source: https://ocw.kyoto-u.ac.jp/course/232/
