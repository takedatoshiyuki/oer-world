name:
  ja: 土曜市民セミナー 再生可能エネルギーと地域経済の活性化（2013）
description:
  ja: 北海道における再生可能エネルギーの導入状況を取り上げ、風力やバイオマス、太陽光、地熱、小水力などの資源を軸に話を進める。あわせて、固定価格買取制度や道内で進む太陽光発電の動きに触れながら、北海道内の事例と日本全体の制度上の課題を検討する。デンマークとドイツの取り組みも紹介する。
quotedDescription:
  text:
    ja: 北海道は、日本の中でも、風力、バイオマス、太陽光、地熱、小水力など、自然エネルギーが恵まれた地域です。昨年の7月から、再生可能エネルギーの固定価格買取制度が発足して、道内でも大型の太陽光パネルの建設が始まっています。しかし、大部分が本州資本による投資です。エネルギーの地産地消に向けた取り組みが求めされています。デンマーク、ドイツなどの取り組みを紹介しながら、北海道内先進的取り組みと日本全体の制度的な課題を、紹介、検討したいと思います。
