description:
  ja: 本教材は、民法第3編「債権」のうち、契約、事務管理、不当利得、不法行為を対象に、各制度の基本的な仕組みと考え方を扱う。公開されている講義資料には、講義案内や契約法序論に加え、売買、賃貸借、消費貸借などの回が含まれる。
