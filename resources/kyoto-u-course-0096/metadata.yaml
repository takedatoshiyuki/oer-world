  ja: 理学療法総論
description:
  ja: 理学療法の目的や方法を導入として扱い、日本におけるリハビリテーション医学と理学療法の歴史、対象疾患、治療手段を学ぶ講義である。あわせて、理学療法部門の見学や松葉杖・装具の使用、車いす操作、血圧測定といった実習的な内容も含む。
quotedDescription:
  text:
    ja: '授業の特色

      本授業では，リハビリテーションを学び始めた学生に対し，理学療法の目的や方法など紹介する．

      授業の紹介

      学生は，我が国におけるリハビリテーション医学と理学療法の歴史，理学療法の対象疾患，および理学療法の治療手段を学ぶ．また本授業で学生は，大学病院のリハビリテーション部の理学療法部門の見学，松葉杖と装具の使用，車いす操作，および血圧測定を経験する．'
