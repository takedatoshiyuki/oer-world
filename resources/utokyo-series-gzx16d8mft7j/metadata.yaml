name:
  ja: 多様な視点からジェンダーを見る(学術フロンティア講義）
description:
  ja: ジェンダー、男性性／女性性が文化や階級、人種などとどう関わるかを、国や社会の違いも踏まえて扱う講義である。政策、メディア、教育、健康、災害、歴史、暴力、社会問題などのトピックを、各講師の専門分野から取り上げる。基礎的な概念を確認したうえで、グループ発表とまとめまで行う。
quotedDescription:
  text:
    ja: '社会が大きく変動する中で、「ジェンダー研究」そのものが問い直しの対象となっている。このような問いに応えるべく、本講義では、ジェンダー、男性性／女性性が、文化、階級、人種、エスニシティ、ナショナリズム等との間でどのように相互作用を起こしているのか、さらに、それが国や社会によってどのように異なるのかについて考えていく。本講義では、政策、メディア、教育、健康、災害、歴史、暴力、社会問題に関するテーマ、国内外の事例などのジェンダーにかかわるトピックを各講師の専門分野の視点から取り上げる。

      本講義は、ジェンダー、セクシュアリティに関する基礎的な概念を確認したうえで、ジェンダーをめぐる多様な問題について自ら考える機会を持つことを目的としている。ジェンダーの多様性を批判的に理解し、自らの立場や社会構造との関係を分析できる力を養うことを目指している。初回はイントロダクション、2回目から11回目までは各講師の専門領域の切り口からジェンダーに関連したトピックについて講義を行う。第12回、第13回は講義を踏まえグループに分かれて発表を行い、最後にまとめを行う。'
