  ja: Analytical Chemistry Laboratory 分析化学実験
description:
  ja: 河川水の分析を題材に、分析化学の基本手法を扱う教材である。誤差解析、容量分析、比色分析に加え、化学平衡や化学反応を用いた物質の分離、定性・定量分析の基本を学ぶ内容である。
