name:
  ja: アジアコミュニケーション[B類]
description:
  ja: アジア諸国におけるマス・コミュニケーション史を軸に、報道と政治体制・経済・開発との関係を扱う講義である。ナショナリズムやメディアとイデオロギー、プロパガンダ、開発コミュニケーション論、文化帝国主義などの事例と理論を、講義、文献輪読、ディスカッションを通じて学ぶ。あわせて、論文構成や研究の進め方、研究計画書を論文へ発展させる方法も取り上げる。
quotedDescription:
  text:
    ja: '本講義のテーマは、アジアにおけるマス・コミュニケーション史である。前期『アジアのメディア』の授業内容を踏まえ、本講義では、アジア諸国におけるマス・コミュニケーションを通じた報道が、いかに国内の政治体制や経済水準および開発状況によって影響を受けてきたか、そうした中でメディアはいかなる役割を果たしてきたのか、また、そうした中でマス・コミュニケーションがメディアや政治に与える影響はいかなるものであったのかに関する知識、視座、分析手法およびそれらを研究でいかに使うのかに関して学ぶ。

      以上のねらいのもと、本講義を受講した学生は、アジア諸国のメディア史やメディアの分析理論のみならず、アジア諸国の政治体制やその政治史を学ぶ。とりわけ、ナショナリズムと国民統合、メディアとイデオロギー、メディアとプロパガンダ、開発コミュニケーション論および文化帝国主義とその批判に関する事例、理論研究を取り上げる。授業では、これらを講義形式で論じるほか、古典を含む文献の輪読、さらには、受講生とのディスカッションを通じて理解を深める。さらに、論文の構成や研究の進め方の基本についても講義し、執筆した研究計画書をいかに論文へと発展させるかに関し、必要な知識や技術を習得する。また、取り上げるテーマに関しては、受講生の関心に応じて変化することもあり得る。'
