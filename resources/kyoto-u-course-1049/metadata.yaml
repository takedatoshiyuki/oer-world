name:
  ja: 個と場の共創的Well-Being Symposium
description:
  ja: この講義は、個人の最適化を支える「場」の状態に着目し、その計測技術や、そうした状態を生み出す要因・技術、社会実装の方法を扱う。JST未来社会創造事業の採択課題に関するキックオフシンポジウムとして、多様なセクターの参加者と議論する内容である。内田由紀子による趣旨説明と話題提供を公開する。
quotedDescription:
  text:
    ja: 'JST未来社会創造事業　「個人に最適化された社会の実現」領域　採択課題「個人の最適化を支える「場の状態」：個と場の共創的Well-beingへ」キックオフシンポジウムを開催しました。

      本課題において、多様な個人の最適化は「場」によって支えられるという立場から、「場」の状態を計測する技術の開発、個人を最適化する「場」の状態を生み出す要因と技術、さらには社会実装の方法を議論しました。様々なセクターの方と共に議論し、Well-being共創の場の実現を目指します。代表の内田由紀子（こころの未来研究センター・教授）による趣旨説明と話題提供を公開します。'
