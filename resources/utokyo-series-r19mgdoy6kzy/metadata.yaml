name:
  ja: 情報工学概論Ａ
description:
  ja: インターネットの利用状況や運営体制、利用に伴う問題点を取り上げたうえで、通信方式や電子メール、World Wide Webの実現方式を扱う。さらに、情報セキュリティや著作権保護への脅威に対抗するための暗号や電子透かしについても、技術面を中心に解説する。
quotedDescription:
  text:
    ja: インターネットは今や多くの人々の生活にとって、不可欠なものとなっています。その一方で、いわゆる迷惑メールやコンピュータウィルス、個人情報の流出など、インターネット利用に伴う問題点も生じています。本講義では、インターネットの利用状況や問題点、運営体制などについて紹介した後、インターネットで用いられている通信方式や電子メール・World
      Wide Webなどのアプリケーションの実現方式、情報セキュリティや著作権保護に対する脅威に対抗するための暗号・電子透かしなどに関して、技術的側面を中心に解説します。
