description:
  ja: 確率統計、確率過程、信号処理の基礎を、講義と演習を通して扱う授業である。順列と組み合わせから確率分布、ランダムウォーク、ブラウン運動、フーリエ変換、ディジタル信号処理までを含み、信号処理ではSPICE3を用いた演習も行う。
quotedDescription:
  text:
    ja: この講義は主に学部３年生を対象としているが、学部４年生も受講することができる。確率統計、確率過程、信号処理の基礎を、講義と演習を通して習得し、自 在に応用できるようにするのが目的である。この講義によって身に付く事項として、順列と組み合わせ、確率変数と確率分布、ランダムウォーク、ブラウン運
      動、ランジュバン方程式、自己相関、雑音、誤差、フーリエ変換、パワースペクトル、ディジタル信号処理などが挙げられる。信号処理については、コンピュー タ上でSPICE3プログラムを用いた演習も行う。
