description:
  ja: 日本の伝統芸能について、歴史と特色の基礎を扱い、あわせて現在の課題と将来像を考える講義である。雅楽、声明、民俗芸能、能楽、人形浄瑠璃、歌舞伎、落語を取り上げ、特別公開講演会として義太夫節も含む。
