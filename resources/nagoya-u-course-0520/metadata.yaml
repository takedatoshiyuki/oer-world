name:
  ja: 基礎セミナー韓流ドラマから「パッチギ」まで−日韓関係を考える
description:
  ja: 韓国（朝鮮）の社会や文化に対して日本で抱かれやすい違和感を手がかりに、日本人の見方を考える講義である。あわせて、日本に定住する在日コリアンへの理解を深めるため、講義、ディスカッション、情報検索、グループ発表を通して学ぶ。
quotedDescription:
  text:
    ja: '日本で暮らす人々にとって、韓国 (朝鮮) は「似ている」ようでどこかが「違う」、ちょっと気になる国です。この授業では、私たちがが韓国 (朝鮮) の社会や文化のどこに違和感を抱くのかを吟味し、韓国
      (朝鮮) という <鏡> に映った日本人の自画像を議論していきます。また、韓国 (朝鮮) との歴史的な深い関係を知る糸口として、日本に定住している在日コリアンに対する理解を深めるのがこの授業のねらいです。

      講義とディスカッション (授業スケジュールを参照)

      図書館やインターネットでの情報検索、文献検索

      パワーポイントを使った発表をグループ活動で行います。'
