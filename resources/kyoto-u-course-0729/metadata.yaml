name:
  ja: 民法V（親族・相続法＝家族法）
description:
  ja: 民法典の親族編と相続編に置かれた家族法の制度を取り上げ、その基本的な仕組みと考え方を概説する講義である。婚姻や離婚、親子関係、養子縁組、親権、後見・保佐・補助、扶養などを順に扱い、制度が現実の問題としてどのように現れるかも見る。
quotedDescription:
  text:
    ja: 民法典第四編「親族」第五編「相続」に規定されている、家族法の種々の制度の基本的な仕組みと考え方、および現実の問題の現れ方につき概説する。講義項目の順序・日程などの詳細な予定は、教科書等の説明と共に、最初の時間に示す。また、講義の際には、レジュメを配布する。
  source: https://ocw.kyoto-u.ac.jp/course/729/
