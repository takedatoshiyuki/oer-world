name:
  ja: 第43回 京都大学品川セミナー「話がわかるコンピュータ－音声認識と対話システムの最前線－」
description:
  ja: 人間の話す言葉を理解するコンピュータやロボットを主題に、音声認識と対話システムの進展を扱う。スマートフォンでの音声入力による検索や翻訳、会話アプリ、国会会議録作成への応用までを取り上げる。
quotedDescription:
  text:
    ja: 人間の話す言葉を理解するコンピュータやロボットの実現は 長らくＳＦの範疇でしたが、 ２１世紀に入り急速に進歩と実用化が進んでいます。 特にこの数年で、スマートフォンで音声入力によって情報検索や翻訳を行ったり、
      軽妙な会話を行うアプリが出現するなど、身近なものになっています。 また、国会（衆議院）の会議録作成に供するような高度なものも実現されています。
