  ja: 生命科学研究科、ウイルス研究所、薬学研究科の若手研究者が主体となって開催する国際学生セミナーで、世界各地の若手研究者を招いて交流する。参加者は自らの研究を英語で発表し討論することで、英語による発表や議論を行う場を持つ。今回の回では、生命科学研究に関するスローガンとして「No
