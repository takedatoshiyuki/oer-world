quotedDescription:
  text:
    ja: '【セミナーの紹介】

      国際学生セミナーは、生命科学研究科、ウイルス研究所、薬学研究科の若手研究者が主体となって開催し、世界から優れた若手研究者（大学院生・ポスドク）を招き、国際的な交流を深めます。

      本セミナーの目的は、大学院生やポスドクといった若手研究者が、国際的な研究者へ成長することへの後押しです。参加者の皆さんは、自らの研究について英語による発表や討論を行うことで、英語のプレゼンテーションやディスカッションのスキルを磨き、さらに国内外の若手研究者とのコミュニケーションにより、新たな視点や刺激を手にできます。

      今回のセミナーでは、生命科学研究における分野の広大さ、相互の関係性、何よりその重要性をふまえ、”No Life No Science; No Science No Life” をスローガンとしました。'
  source: https://ocw.kyoto-u.ac.jp/course/161/
