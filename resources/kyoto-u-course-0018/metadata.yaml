name:
  ja: 教育課程論Ⅱ
description:
  ja: 教育課程論Ⅱのうち、学力評価とカリキュラム設計を扱う4回分の授業内容を公開する。資料には評価方法に加え、中学校社会科や高校の英語科・数学科の実践例が含まれ、評価基準、指導案、年間指導計画も扱う。
quotedDescription:
  text:
    ja: '近年、日本においても、学校において創意工夫を生かした教育課程（カリキュラム）編成を行うことが求められています。教育課程論Ⅱでは、前半で「学力評価とカリキュラム設計」、後半で「教育課程の歴史と論点」を扱います。ここでは、「学力評価とカリキュラム設計」を扱っている4回分の授業内容をオープン・コースウェアとして公開しています。

      ※パフォーマンス評価とポートフォリオ評価法の概要を説明した授業を教育課程論Ⅰサイトに掲載しています。

      ※各回の講義資料をプリントアウトして手元に置きつつ、動画を視聴していただくことをお勧めします。'
  source: https://ocw.kyoto-u.ac.jp/course/18/
