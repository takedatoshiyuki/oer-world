name:
  ja: 上智大学でまなぶ”国際問題（グローバル・イシュー）の最前線”
description:
  ja: アフリカへの見方を手がかりに、日本とアフリカの関係や、アフリカから学べることを考える内容である。説明文では、NGOとしてアフリカで医療に携わる経験にも触れながら、アフリカの文化やそこで生きる人々の姿を扱う。
quotedDescription:
  text:
    ja: "上智大学でまなぶ ”国際問題（グローバル・イシュー）の最前線”\nアフリカに対するイメージは、野生動物、そして内戦、貧困、飢え、エイズ、少年兵などだけでしょうか。\nまた、日本はアフリカの資源を必要としているだけで、アフリカから学ぶことは何もないのでしょうか？\n\
      \ 経済的な豊かさの中で私たち日本人が失ってきたものは「原始力」、 厳しい環境の中ででも生きてゆくことができる力です。\n 私は、長年にわたりNGO メンバーとしてアフリカで医療を続けています。\n\
      アフリカには、豊かな文化、貧しい中で強くたくましく生きている人々がいます。 \n 遠いアフリカから学ぶことはたくさんあると思います。 \n   \n 当日のチラシは こちら をご覧ください。"
