name:
  ja: 映画を読んでみよう
description:
  ja: 身振り、音楽、文字、絵画、映像など、表現の媒体によって生じる違いを手がかりに、表現されたものをどのように「読んで」理解するかを扱う。あわせて、伝えようとする側が理解されるために工夫を重ねることにも触れる。公開教材には、講義ノートと高校生の取り組みの様子が含まれる。
quotedDescription:
  text:
    ja: 何かを伝えようとする時、その表現にはさまざまな「かたち」が用いられます。身振り、音楽、文字、絵画、映像・・・。文字で表現する場合でも、メモ、手紙(私的なもの・公的なもの)、文書、詩、散文、小説・・・。それら媒体の異なりは直接表現の違いになります。そうした特徴を理解したうえで表現されたものを「読んで」(理解して)みましょう。伝えようとする人は理解されることを望んでいます。そのためにいろいろな工夫
  source: https://ocw.nagoya-u.jp/courses/0289-%E6%98%A0%E7%94%BB%E3%82%92%E8%AA%AD%E3%82%93%E3%81%A7%E3%81%BF%E3%82%88%E3%81%86-2010/
