    ja: '【研究概要】

      物性基礎論・統計力学、とくに非線形物理学

      【教授略歴】

      1945年 2月10日生まれ

      1967年 東京大学理学部物理学科卒業

      1970年 ニューヨーク州立大学大学院卒業（Ph.D.）

      1970年 ニューヨーク州立大学研究員

      1971年 東京教育大学光学研究所・助手

