  ja: 人工知能における倫理的・法的・社会的問題を扱い、人工知能が人間社会で利用される際の権利侵害などの論点を取り上げる。あわせて、人工知能に関するELSIのガイドラインを中心に、これまで議論されてきた内容を整理する。
quotedDescription:
  text:
    ja: 本講義では人工知能における倫理的，法的，法的問題 (ELSI)について解説する．人工知能の研究ではどうやってデータを活用するかという問題に焦点が当てられているが，人工知能におけるELSIでは人工知能が人間社会で用いられたときに人間の権利が侵害されないかなどの問題を取り扱う．講義では，人工知能に関するELSIについてのガイドラインを中心に，これまで議論されてきたELSIについて解説する．
