name:
  ja: 「モデル小説」から見るプライヴァシーの近代
description:
  ja: 小説の登場人物のモデルをめぐって起こる「モデル問題」を手がかりに、文学と社会の関係を扱う講義である。柳美里『石に泳ぐ魚』裁判、島崎藤村、内田魯庵『破垣』を取り上げ、現代から明治期へさかのぼりながら、その成立や展開を追う。小説表現と私的領域の衝突が時代によってどう異なるかを考える内容である。
quotedDescription:
  text:
    ja: '「モデル問題」は、小説の登場人物のモデルとされた者が、何らかの形で抗議することによって起こります。明治以来、さまざまな「モデル問題」が生じましたが、それが〈問題〉となった理由もまたさまざまでした。小説家がなにを書きたいのか、モデルは何に腹を立てたのか、どのような文芸思潮がその時代を支配し、どのような「常識」が人々を規定していたのか。複雑な要因が絡み合って起こる「モデル問題」を時系列にそって眺めていくと、文学と社会の関係——とりわけ小説表現と〈私的領域〉との衝突のありさま——は時代によって変化するということが如実にみえてきます。

      この講義では、現在における「モデル問題」のあり方を出発点とし、さかのぼりながら明治期におけるその初発期の様相を探ります。トピックは三つあります。表現の自由とモデルの保護に関する現代的感覚の登場があらわになった柳美里『石に泳ぐ魚』とその裁判（一九九四〜
      ）、日本のリアリズム文学の立役者の一人でありモデルとのトラブルの絶えなかった作家でもある島崎藤村の軌跡（一九〇〇〜一〇年代）、日本で初めてモデル問題により発売禁止処分を受けた内田魯庵の「破垣」（一九〇一）です。'
