name:
  ja: 30年後の世界へ ―「世界」と「人間」の未来を共に考える（学術フロンティア講義）
description:
  ja: グローバリゼーション、技術、気候変動、医療・生命技術を背景に、「世界」と「人間」を問い直す視点を扱う講義である。各分野の研究者が順番に登壇し、30年後の未来を考えるための問いを開いていく。
quotedDescription:
  text:
    ja: '「グローバリゼーションは新たな段階を迎えつつある。人・モノ・情報のボーダーレスな移動によって生起したさまざまなコンフリクトは、人類が近代に達成したさまざまな価値や制度に揺さぶりをかけている。これに拍車をかけるのは、第四次産業革命とも言われる新たなテクノロジー社会の到来であり、気候変動を核心とする人類と地球生態系のサスティナビリティの危機であり、医療・生命技術の発展がもたらした生命のボーダーレス化である。

      　いったい、わたしたちがいま生き、これから向かおうとしている世界はどのようなすがたをしているのだろうか。これまでそうだと思っていた世界の分節が機能不全を呈しつつある時、わたしたちはもう一度、わたしたちが生きる「世界」そのものを問い直し、新たな「世界」像を構築するための想像力を開放する必要がある。そのことは同時に、「人間」に対する再定義をも迫っている。現在の人間は、自然とのつながりだけでなく、機械や情報ネットワークなどの人工物とのつながりのなかではじめて人間たりえている。人種、民族、ジェンダー、階級、個人、健康、生死、環境、技術、制度などなど、人間を構成する諸条件を現代的状況のなかで問い直すことは、新しい世界像を構築することと切り離すことはできないはずだ。」（｢世界人間学宣言｣座談会アジェンダより）

      　これは、駒場の教員たちが集まって2019年12月9日に開催された｢世界人間学宣言｣座談会の開催趣旨文の一部です。ここ東京大学駒場キャンパスは、リベラルアーツを旗印として、学問分野の垣根を越えながら広く｢問う｣ことにおいて、智慧への愛好（philosophia）を共にする場です。人類史的な、否、地球史的な大きな転換点にあるいま、｢世界｣と｢人間｣を問い直すことは、わたしたち人類の智慧によって希望を切り拓くために不可欠な課題です。これは同時に、既存の学問の前提を取り外すことをわたしたちに要求しています。駒場はこうした要請に応えうる、世界にも稀な場であると言えるでしょう。なぜなら、そこには東京大学に入学したばかりの前期課程生がすべて集まり、三千人を超える学生の一人ひとりが、それぞれに相応しい専門の学問を見出す前に、アカデミックに生きるための技法（アート）として、「問う」姿勢を身につけることを約束されているからです。問うことの自由を手に、渾沌とした世界に働きかけ、新たな学問を切り拓くこと、それが駒場の教養教育の役割であり、駒場に課せられた時代の要請なのです。言い換えれば、わたしたちの駒場キャンパスは前期課程のみなさんと共にあることによって、学問のフロンティアに立ち続けています。フロンティアならではの喜びを分かち合いながら、希望の未来像についてみなで共に考えること、それが駒場における研究教育の意義にほかなりません。

      　この授業では、それぞれの研究分野の第一線で活躍している研究者が順番に登壇しながら、わたしたちの未来を考えるための｢問い｣をひらきます。テーマは｢30年後｣ですので、そこに明確な答えは用意されていません。しかし、答えのない「問い」を問う姿勢こそが、この時代を覆うさまざまなチャレンジに応じるためのパスポートにほかならず、駒場で学ぶわたしたちの特権であると言えます。

      　この授業を主催するのは、東京大学東アジア藝文書院（East Asian Academy for New Liberal Arts, EAA）です。EAAは｢東アジア発のリベラルアーツ｣を標榜し、東アジアという土壌の上に新しい研究教育のプラットフォームを構築し、今後の世界における新しい大学のあり方を提示することを目指しています。

      　共に未来を考えたい学生さんたちの参加を大いに歓迎いたします。'
