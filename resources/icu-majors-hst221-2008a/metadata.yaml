name:
  ja: History of Contemporary Japan 日本現代史
description:
  ja: 戦時下の日本の出来事と経験が、戦後60年以上のあいだにどのように記憶され、使われ、再び使われてきたかを扱う講義である。そこから、そうした記憶が国内政治、国際関係、国民的アイデンティティの形成にどう関わるかを追う。秋学期に全18回、ディスカッション回とフィールドトリップを含む形で行う。
quotedDescription:
  text:
    ja: 'According to Benedetto Croce, “all history is contemporary history.” This year, 2008, marks the
      63th anniversary of the end of the Pacific War. This course will show how events of the past are
      very much alive in the present. The war is constantly in the news. This course will explore the
      ways in which the events and experiences of wartime Japan have been remembered and used and re-used
      over the past 60-plus years in shaping domestic politics, international relations, and national
      identity.

      Course Structure

      This course is taught on the ICU campus during the Fall term. There are 18 sessions, each 105 minutes
      long, held over a period of 10 weeks. There is one required “field trip” and 7 discussion sessions.

      Contents of Lectures

      18

      Lectures'
