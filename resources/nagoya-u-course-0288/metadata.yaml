description:
  ja: 途上国が直面する問題と、開発に伴って生じる論点を、政治・経済・文化・社会の各側面から扱う講義である。DVD映像や写真を用いながら、国際開発の取り組みと、大学研究での議論の概観に触れる。
quotedDescription:
  text:
    ja: 本講義の目的は途上国が直面する諸問題について考察するとともに、開発に関連して生起する諸問題について、政治、経済、文化、社会にまたがる多種多様な見地から国際開発がどのように取り組まれてきたかを考察することである。講義はDVD映像や写真を活用して行うとともに、国際開発が大学研究においてどのように議論されているかについての全体像についても触れる。
