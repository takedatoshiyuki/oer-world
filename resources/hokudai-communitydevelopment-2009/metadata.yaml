name:
  ja: 北海道大学教育GP「博物館を舞台とした体験型全人教育の推進」 文化コーディネーターと町づくり（2009）
description:
  ja: 出典文では、京都文教大学の地域連携活動を背景に、教育GPとして地域の文化資源を見出し発信する取り組みが扱われる。あわせて、そうした活動を通じて地域活性化に関わる人材育成をめざす内容が示されている。
quotedDescription:
  text:
    ja: 京都文教大学は、京都府南部の宇治市にある唯一の大学として、現場主義教育を旗印に地域連携活動に取り組んできました。平成20年度の教育GP「文化コーディネーター養成プログラム～『モノ・ひと・地域を活かす大学ミュージアム』を活用した実践的人材育成教育」では、地域の文化資源を見出し、発信することによって、地域活性化に貢献できる人材の輩出をめざしています。もう一つの特色GPの活動と合わせて、本学の取り組みを紹介します。
