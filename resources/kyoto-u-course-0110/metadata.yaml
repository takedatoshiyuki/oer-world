name:
  ja: 物性・デバイス基礎論
description:
  ja: この教材は、固体中で電子が関わる性質や現象の基礎を、量子力学・熱力学・量子統計力学の観点から扱う。あわせて、化学結合や結晶構造を踏まえたうえで、電子の輸送現象や電子放出、固体内および真空中での電子の挙動を概述する。
quotedDescription:
  text:
    ja: 電子が関与する固体の各種性質，現象の基礎を学習する．電子のエネルギー状態を量子力学的観点から理解し，平衡状態における粒子のエネルギー分布を熱力学や量子統計力学の観点から理解する．さらに，固体を構成する化学結合や結晶構造を学んだ後，電子の輸送現象や電子放出を理解することを目指す．固体内や真空中における電子の挙動を概述する．
  source: https://ocw.kyoto-u.ac.jp/course/110/
