  ja: 未来創成学国際研究ユニットセミナー（第8回）「進化の過程における人間の思考と言語の発達」
description:
  ja: 人間の言語の起源と、ホモ・サピエンスにおける思考の発達を扱う。遺伝子、言語、壁画を手がかりに、道具や武器、美術が同時に発達した時期の出来事を考える。
quotedDescription:
  text:
    ja: '要旨

      人間の言語は10万年ほど前に現れたと言われている。ネアンデルタール人よりもはるかに高度な思考がホモ・サピエンスに芽生え、優れた道具、武器、美術などが同時に発達した。本発表では、この時期に一体何があったのかを遺伝子、言語、壁画などをもとに考える。'
