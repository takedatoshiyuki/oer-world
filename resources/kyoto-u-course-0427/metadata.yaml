name:
  ja: 補助教材「ベクトルから行列へー線形性とは何かー」
description:
  ja: ベクトルから行列へと進みながら、線形性という考え方を軸に線形変換やその行列表現を学ぶ教材である。行列の積、逆行列、正則行列と特異行列までを含み、各テーマごとの講義資料と解答集が公開されている。
quotedDescription:
  text:
    ja: 'ILAS 自習用補助教材

      ベクトルから行列へ — 線形性とは何だろうか?

      「大学で初めて行列を学ぶ学生諸君へ」

      ILAS(Institute for Liberal Arts and Sciences, 国際高等教育院)の数学教室では,表題の自 習用テキストと,その内容を 10 本のビデオにしたものを用意しました.旧課程で行列を学習し
      た諸君にも,大学の数学への入り口として役に立つはずです.

      高校で学んだベクトルから大学で初めて学ぶ行列へと,動画とナレーションを通して学んで いく中で,線形性という,数学の「ものの見方」になじんでいってください.

      テキストの中には問も与えられています.このテキストを脳みそを使って読み込み,さらに 手を動かして問を解いてみることで,行列と線形性を自分のものにしていきましょう.問題を 解くときの手助けとして,ビデオ画面のテキストファイルを利用してください.

      皆さんが考える邪魔をしないように,今は解答を載せていませんが,5月の中旬頃には順 に解答をこのサイトに載せていく予定です.'
  source: https://ocw.kyoto-u.ac.jp/course/427/
  note: 京都大学OCW 「講義概要」より（同サイトの利用条件に基づく転載）
