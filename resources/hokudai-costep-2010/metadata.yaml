name:
  ja: 北海道大学教育GP「博物館を舞台とした体験型全人教育の推進」 CoSTEPこれまでとこれから(2010)
description:
  ja: この講義は、CoSTEPが取り組んできた科学技術コミュニケーション教育の歩みを扱う。専門家と市民をつなぐ人材育成を軸に、双方向性や地域性を重視した実践の意図と、その達成方法、さらに今後の方向性を述べる。
quotedDescription:
  text:
    ja: ＣｏＳＴＥＰはこれまで５年間、「科学技術コミュニケーター」と呼ばれる、科学技術の専門家と市民との間を橋渡しする人々を育成する教育活動を行なってきました。その際、次のことを重視しました。双方向的な科学技術コミュニケーションの実現を目指すこと、地域に根ざした科学技術コミュニケーションを実践すること、そして双方向的な科学技術コミュニケーションを目指すことなどです。なぜそれらを意識したのか、どのように達成しようとしたのか、これからは何をめざすのか、などについてお話しする予定です。
