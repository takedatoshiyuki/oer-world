  ja: History, Art, and Literature 歴史、芸術、文学
description:
  ja: 日本研究の成立と展開を、歴史・芸術・文学の観点から扱う講義である。日本研究とは何か、国内外でいつからどのように研究されてきたか、近年の動向を取り上げ、当年のテーマとして「Visions of
    Japan」を据える。秋学期に全19回で実施され、討論、短いレポート、美術館レビュー、研究報告を通して学ぶ構成である。
quotedDescription:
  text:
    ja: 'This course is an introduction to the developing field of Japan Studies with a special emphasis
      on history, art and literature. What is “Japan Studies?” When did people, both outside and inside
      Japan, begin to study about Japan — and why? What are some recent trends in Japan Studies? The special
      theme of this year’s course is: “Visions of Japan.”

      Course Structure

      This course is taught on the ICU campus during the Autumn term. There are 19 sessions, each 105
      minutes long, held over a period of 11 weeks. The course includes multiple discussion sessions,
      5 short papers, a museum review project and a research report on a topic of the student’s choice
      in lieu of a final examination. Two graduate students gave special lectures on the topic of the
      Ph.D. dissertation at the end of the course.

      Contents of Lectures

      10

