  ja: のりさんと科学を語ろう!! 第2回「北海道の農業ビジネス最前線！」（2010）
description:
  ja: 北海道大学の講義で、2010年に経済学部で開講される。担当者として複数の教員・関係者が記載されており、出典文では佐藤のりゆき氏が客員教授として北大の研究や活動を市民に伝える役割を担うことが示されている。
quotedDescription:
  text:
    ja: '北海道大学創成研究機構ではこのたび、フリーキャスター佐藤のりゆき氏を客員教授に迎えました。これまでのキャスターとしての経験や科学技術番組制作の経験を生かして、北大の研究や活動・取り組みを分かり易く市民の皆様に伝えていただきます。

