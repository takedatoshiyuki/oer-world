name:
  ja: サイエンス・リーダーズ・キャンプ 意欲を引き出す次世代型生物教員の育成 ～高度な専門性と卓越した学習指導力の獲得 を目指して～(2011)
description:
  ja: 北海道大学の理学研究院が2011年に実施した、教員向けの生物教育プログラムである。タンパク質、細胞、DNA、形態、バイオーム、系統・分類などを講義と実験で扱い、博物館でのナイトツアーやナイトセッションを通して教育現場での指導方法も検討する。最終日には、学習意欲を踏まえた生物授業のあり方について取り上げる。
quotedDescription:
  text:
    ja: '北海道大学は、開学以来１３０年以上に渡って多くの研究者を輩出し、世界屈指の研究業績を積み上げてきました。その資産の中から、生物におけ る新学習指導要領のキーワードに対応したプログラムを講義と実験で提供します。

      またそれらの内容を教育現場で展開する上で、どのような学習指導が生徒に必要なのか、生物教育のエクセレントテーチャーたちとディスカッションするナイトセッションや、北大博物館の資産を元にした実習：ナイトツアーなどを通して体験的に学びます。最終日は、「学習意欲」の新しい知見を元にしながら、意欲を引き出す生物授業の方法について解説します。

      中学校、高等学校等の理数教育を担当する教員に、最先端の科学技術や才能ある生徒を伸ばすための効果的な指導方法を合宿形式で修得してもらうことで、理数教育における指導力向上やリーダーの育成、教員間のネットワーク形成を支援する科学技術振興機構（JST）のプログラムです。

      日時　2011年8月12日～15日

      場所　北海道大学情報教育館４F・高等教育推進機構、 北海道大学理学部、北海道大学総合博物館

