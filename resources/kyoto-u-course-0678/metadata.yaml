description:
  ja: 農業政策上の諸問題を、海外の事例も参照しながら公共経済学と資源環境経済学の視点で扱う講義である。食料問題、環境ガバナンス、農地取得政策、農業法人政策、農業担い手政策、農業と環境政策などを通して、農業政策の体系を学ぶ。
