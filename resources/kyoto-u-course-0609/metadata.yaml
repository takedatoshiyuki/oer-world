name:
  ja: 基礎物理化学Ａ
description:
  ja: 量子力学の基本を出発点に、原子・分子の電子状態と化学結合論を扱う講義である。公開資料では、シュレディンガー方程式、一次元井戸型ポテンシャル、水素類似原子、原子軌道やスピン、選択則、スピン軌道相互作用、摂動法と変分法までを取り上げる。講義と演習を通して、分子構造や反応性を原子核と電子の振る舞いから考える。
quotedDescription:
  text:
    ja: '授業の特色

      量子力学の基本から説き起こし、原子・分子の電子状態および化学結合論について議論する。数学的な取り扱いが比較的容易なモデルを用いた定性的な議論を重視する。

      授業の紹介

      分子の構造や反応性が示す多様な性質は、原子核と電子の振舞いによって決まる。本講義では、量子論に基づく化学結合論について講義と演習を行い、原子・分子の電子状態や分子構造とその変化に関する物理化学の基礎を習得する。'
  source: https://ocw.kyoto-u.ac.jp/course/609/
