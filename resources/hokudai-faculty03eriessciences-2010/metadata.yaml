name:
  ja: サステナビリティ・ウィーク 市民フォーラム サステナビリティ水産学の理論と実践（2010）
description:
  ja: 水産資源を将来にわたって利用するための考え方を扱い、漁獲から食卓までの流れで生じる環境負荷に触れる。あわせて、フード・マイレージ、エコラベル、トレイサビリティ、養殖を取り上げ、海洋生態系の保全と水産食料の持続的確保の関係を考える。
quotedDescription:
  text:
    ja: サケやイワシ、マグロといった水産資源を、世界の人々が未来ずっと食べていくには、どうしたらよいのか考えます。水産生物が漁獲されてから食卓にあがるまでの間に、どれくらい環境へ影響を与えたのかを示す、フード・マイレージ、エコラベル、食料トレイサビリティ，養殖などを話題にします。海洋生態系の保全と水産食料の持続的な確保が同時に可能となるよう、学問と実践の両方を進める必要があります。
  source: https://ocw.hokudai.ac.jp/lecture/faculty03eriessciences-2010
