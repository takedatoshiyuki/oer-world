name:
  ja: フランス文学研究ＩＶｂ
description:
  ja: パリを主題に、都市の詩学という観点からフランス文学作品を読み、作品の構造や細部の意味を考える講義である。バルザック、ゾラ、プルーストなどの作品を中心に、作者の発言や作品内の描写、街区の変化を手がかりとして、パリの風景がどう変わり、どのように語られていくかを扱う。
quotedDescription:
  text:
    ja: '授業のメインテーマはパリです。一つの文学作品を理解するには、多くの方法を駆使してそれ自体を、そして同じ作者のあるいは他の作家の作品と読み比べて、初めて十分に可能となります。都市の詩学という観点から作品を研究することが、その作品の全体の構造についても細部の意味についても、いろいろ興味深い解釈をもたらしてくれることがあります。都市の詩学を構成する要素である都市風景の描写に関しては、絵画においては近代パリの描出が19世紀後半のマネから始まるとしたら、文学においては19世紀前半のバルザックから始まると言えます。

      フランス文学を代表するパリの風景画家としては、バルザック、ゾラ、プルーストの三大作家となりますが、ユゴー、ボードレール、フロベールも貴重な作品を残しています。作者の発言や作品内の住民の相貌と街区の改造をおいながら、パリの風景がいかに変貌し、この首都が神話化されていくのかを探求します。'
