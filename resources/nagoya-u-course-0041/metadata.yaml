name:
  ja: 経済理論 I
description:
  ja: 本講義は、マクロ経済学の基礎をケインズ経済学の観点から扱う。国民経済、GDPの決定、消費と貯蓄、投資の理論などに関する講義ノートが公開されている。
quotedDescription:
  text:
    ja: 本講義は、一国の経済活動全体を捉えるマクロ経済学について、その１つの考え方であるケインズ経済学からのマクロ理論の基礎的な部分を扱います。「現実の経済を理論的に捉える」とはどういうことであるかを学生のみなさんがより直感的に理解できるように、日本のマクロデータを適宜提示します。
