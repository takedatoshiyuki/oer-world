name:
  ja: 大学院教育 産業エネルギー政策論（2006）
description:
  ja: 戦後日本の産業政策を、復興期から構造改革期までの流れに沿って整理し、その機能や限界を扱う。あわせて、日本のエネルギー政策について、国内外の情勢変化を踏まえた歴史的な変遷と、石油・石炭・電力・ガス・原子力をめぐる論点を取り上げる。
quotedDescription:
  text:
    ja: '【概要】

      戦後復興期、高度成長期、石油危機以降の安定成長期、さらにはその後の構造変革期においてどのような政策が産業に関連して採られたのか、そしてそれらの政策はどのうように機能し、機能しなかったのかを考えます。また、日本がエネルギーに関し置かれている状況を前提に、エネルギーに関して日本はどのような政策を採ってきたのか、それは外的な環境変化の中でどのように変化してきたのかということに関しても見ていきます。

      【スケジュール】

      産業政策

      1.産業政策とは何か－概念の整理

      2.戦後日本の産業政策－復興、高度経済成長、そして構造改革

      3.産業界と通商産業省

      4.競争政策と産業政策

      5.貿易摩擦への対応

      6.技術政策と研究開発政策

      7.規制改革－経済的規制と社会的規制

      エネルギー政策

      1.世界のエネルギー情勢

      2.日本のエネルギー情勢

      3.エネルギー政策の歴史的変遷

      4.石油政策－開発、精製、流通、備蓄

      5.石炭をどう考えるか

      6.公益事業－電力、ガスと規制緩和

      7.環境制約の登場－省エネ、新エネ、原子力'
