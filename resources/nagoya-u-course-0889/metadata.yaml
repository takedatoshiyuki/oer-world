  ja: 健康・スポーツ科学講義
description:
  ja: 健康の維持増進に必要な身体に関する科学的知識と、安全で効果的な運動の実践方法を扱う。あわせて、これらの知識を通して自己管理能力を身につけることを目的とする。
quotedDescription:
  text:
    ja: '健康の維持増進に必要な身体に関する科学的知識や，安全で効果的な運動の実践方法についての知識を習得し，自己管理能力を身につけることを目的とします。

      本授業の目標は，

      １）大学生活を心身ともに健康に過ごすために必要な基礎的知識の修得と，運動の意義・必要性について多面的に学ぶ。

      ２）体力や運動能力の現状を把握しそれを向上させるためのトレーニングの方法は，持久力や筋力など，その目標とする体力要素によって異なっている。トレーニングに対する考え方，トレーニングを行う上で必要となる基礎理論や注意点について学び，さらにトレーニング実施によってその効果を検証する。'
