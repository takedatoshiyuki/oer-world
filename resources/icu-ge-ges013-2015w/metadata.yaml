name:
  ja: 'S1: Political Science (C) S1:政治学（Ｃ）'
description:
  ja: 政治を理解するための分析枠組みを導入しつつ、日本と中国をめぐる安全保障や外交関係を具体例として扱う。あわせて、記憶の政治、経済発展と地域秩序への影響、東アジアにおける中国認識とソフトパワーまでを取り上げる。
quotedDescription:
  text:
    ja: 'Politics is all around us, in the media and in daily life. Often it”s difficult to make sense
      of all the different actors, their fundamental ideas, their ambitions, their speeches, laws and
      provisions, their goals, and the short-term and long-term consequences. This course wants to provide
      a structure and an analytical framework developed by political scientists over the last two-thousand
      years.

      政治はメディアや日常生活のいたるところにある。政治を演じる者たちすべてを理解し、その基本的考え方、野心、スピーチ、法および規則、ゴール、短期的・長期的結果を理解することは、しばしば困難である。このコースは、過去二千年以上にわたって政治学者が開発してきた分析の枠組みと構造を提供する。

