      Week 1

      Introduce traditional security issues that exist between Japan and China. Develop students’ understanding
      of the difference between traditional security (TS) and non-traditional security (NTS).

      Key concepts: Traditional security, Power relations

      Week 2

      Introduce Chinese views on US-Japan Alliance and the TS issues associated with it.

      Key Concepts: Traditional security, Power relations

      Week 3

      Introduce NTS issues facing Japan and China and potential areas for cooperation.

      Key concepts: Non-traditional security

      Week 4

      Discuss the politics of memory in both Japan and China.

      Key concepts: Nationalism, memory production, domestic politics

