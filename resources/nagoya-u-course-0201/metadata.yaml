name:
  ja: こころの健康を維持する
description:
  ja: この教材は、うつ病をめぐる状況を背景に、予防と早期発見に関わる内容を扱う。うつ病について全般的な知識を与え、その理解を深めることを目的とする公開講座の教材である。
quotedDescription:
  text:
    ja: 近年、わが国の自殺者は３万人を超え高い水準を維持している。その背景にはうつ病の存在が指摘されている。そのため、うつ病の予防、早期発見のために、様々な対策が講じられてきている。こうした努力によって、うつ病に対する知識は、一般の人々の間に、かなり普及していると考えられる。しかし、必ずしもまだ十分とは言えない。そのため、本講座では、うつ病について全般的な知識を与えることによって、うつ病に対する理解を深め
