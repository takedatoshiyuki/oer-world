name:
  ja: 古代手工業生産史の考古学的研究
description:
  ja: 日本古代の手工業生産のうち、奈良時代の国分寺創建期における地方の造瓦組織を中心に、地域ごとのあり方を検討する教材である。あわせて、律令制の成立から変質、崩壊に至るなかで造瓦組織がどのように移り変わるかを扱う。公開されている講義ノートには、瓦の基礎事項、研究史、造瓦工房、各地域の国分寺瓦生産や官営瓦工房に関する回が含まれる。
quotedDescription:
  text:
    ja: '日本古代の手工業生産について、おもに奈良時代における国分寺創建期の地方造瓦組織を題材として、その地域的諸様相を検討し、律令制の成立から変質、崩壊という過程において、どのような変遷を遂げていくかを論じる。

      講義の目的としては、古代手工業生産に関する知識の取得ばかりでなく、本講義における担当者の研究手法を通して、受講者が自らの研究対象を深めていくにあたっての論理的思考や叙述能力を涵養することが望まれる。'
