name:
  ja: 第56回 京都大学品川セミナー「第一次大戦と現代・世界」
description:
  ja: 第一次世界大戦の勃発から終結までの経過をたどり、参戦国の広がりや植民地からの動員によって戦争が世界規模へ拡大したことを扱う。あわせて、約2600万人の死者を出したこの戦争が20世紀に与えた位置づけと、日本における受け止められ方を考える内容である。
quotedDescription:
  text:
    ja: '１９１４年７月、オーストリアからセルビアへの宣戦布告で始まった戦争は、落ち葉の季節までには終わるだろうとの予想を裏切って４年３ヶ月も続いた。この戦争には英・仏・ロ・日・米・中など連合国２７か国とオーストリア・独・オスマン帝国など同盟国４か国が参加、アジアやアフリカなどの植民地からも兵士や労働者が動員されたことによって世界規模の戦争へと展開し、その死者は軍人と民間人を合わせて約２６００万人にのぼったと推計されている。それは未曾有の大量殺戮をもたらした人類史上の重大事件であるとともに、「戦争と革命の世紀」そして「アメリカの世紀」と呼ばれる２０世紀を刻印することとなった。

      　しかし、日本ではこの戦争について主たる戦場となったのがヨーロッパだったため、軍需景気による「成金」を生んだことで言及される程度の「遠い戦争」であり、「忘れられた戦争」と見なされてきた。確かに、時の元老・井上馨が述べたように「今回欧洲の大禍乱は、日本国運の大発展に対する大正新時代の天佑」とみなされ、結果的に日本は「五大強国」に列して南洋諸島を委任統治するに至った。ある意味では、「欧洲の大禍乱」にも拘わらず、日本は唯一この大戦で少ないコストで大きな権益を獲得できた参戦国となった。'
