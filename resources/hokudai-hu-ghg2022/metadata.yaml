name:
  ja: 北海道大学GHGインべントリ2022 解説動画
description:
  ja: 北海道大学の温室効果ガス排出量等をまとめた「北海道大学GHGインベントリ」を扱う解説動画である。全拠点・全活動を対象にしたデータをもとに、国際基準に準拠したデータベースの内容と位置づけを要点を絞って説明する。2050年カーボンニュートラルに向けた評価・検証の基礎資料として、どのような情報を集約しているかを示す。
quotedDescription:
  text:
    ja: '北海道大学では、2024年10月、本学の温室効果ガスに関する排出量等のデータを体系的にとりまとめた「北海道大学GHGインベントリ」を策定しました。

      本インベントリは、カーボンニュートラル実現に向けた基礎資料として、本学の温室効果ガスに関する現状を適正に把握するために作成したものです。本学の全拠点・全活動を対象に、国際基準に準拠した信頼性の高いデータベースを構築しています。これらのデータは、2050年カーボンニュートラルに向けた、本学の気候変動対策を中長期的に評価・検証するための基礎データとなります。

      本動画では、インベントリについての理解を深めていただくことを目的に、要点を絞って内容を解説しております。

      北海道大学GHGインベントリ（本編・概要版）は以下ウェブサイトからダウンロードいただけます。

      ・ https://www.sustainability.hokudai.ac.jp/repository/ghg/'
