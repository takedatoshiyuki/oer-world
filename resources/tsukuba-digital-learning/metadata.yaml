name:
  ja: 「体験型デジタル教材を活用した授業の開発と評価」
description:
  ja: 高校生を対象に、体験型デジタル教材を用いた授業実践を通して、その効果を検討する研究発表である。教材の活用がどのように授業設計と評価につながるかを扱う。
quotedDescription:
  text:
    ja: 八巻龍さん（筑波大学 大学院 図書館情報メディア研究科 博士前期課程 図書館情報エリア支援室 技術補佐員）による「体験型デジタル教材を活用した授業の開発と評価」の研究発表。体験型デジタル教材は、視覚的な分かりやすさ、体験が難しい現象の疑似体験ができるなどのメリットがあるが、教育現場においてはまだ十分に活用されていない。高校生を対象に、体験型デジタル教材を使用した授業実践を行い、どのような効果が出るかを検討している。
