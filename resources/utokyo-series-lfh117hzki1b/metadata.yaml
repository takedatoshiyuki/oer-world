name:
  ja: 農学部公開セミナー 第45回「動物の病気から見えるもの」
description:
  ja: 昆虫に見られる病気と、その原因となる病原体を取り上げるセミナーである。カイコなどの家畜昆虫を病原体から守ってきた歴史に加え、病原体を害虫制御や医薬品・バイオマテリアルの生産に利用する現状を扱う。
quotedDescription:
  text:
    ja: "私たち人間に病気が存在するように、昆虫にも病気が存在する。感染性の病気の原因となる病原体は、ウイルス、細菌、糸状菌など多様であり、日々、宿主である昆虫とせめぎ合いを繰り返している。本セミナーでは、私たちの身近に存在する昆虫の病原体を紹介し、カイコをはじめとする家畜昆虫を病原体から守ってきた歴史や、病原体を利用して害虫を制御したり、医薬品やバイオマテリアルを生産している現状を紹介する。\
      \ \n \n    ★過…"
