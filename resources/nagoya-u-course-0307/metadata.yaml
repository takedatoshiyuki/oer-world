name:
  ja: 実験音声学基礎
description:
  ja: コンピューターを用いて音声を音響的に分析し、その結果から言語音声の性質を考える内容を扱う。音声の特徴抽出を通じて、人間の声の成り立ちや音の識別、発話における韻律的特徴を見ていく。公開教材として講義ノートがある。
quotedDescription:
  text:
    ja: この授業は、コンピューターを用いて音声を音響的に分析し、その特徴を抽出する手法を習得することを目的とする。授業ではあらかじめ用意された音声を素材として分析を行い、その結果として得られる画像や数値から、人間の声の成り立ち、音と音を識別するための手がかり、連鎖による音の変容、発話における韻律的特徴など、言語音声の性質やそこに生じる現象について、音響の側面から理解を進めていく。参加者はテーマごとに理論面
