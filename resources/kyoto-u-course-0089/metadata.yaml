name:
  ja: フランソア喫茶室－京都に残る豪華客船公室の面影－
description:
  ja: 京都・四条木屋町のフランソア喫茶室の歴史を軸に、その店に関わった人物や1920年代から40年代の京都、豪華客船の歴史を扱う講義である。公開教材には、各回の講義資料と参考文献が含まれている。
quotedDescription:
  text:
    ja: '授業の特色

      この講義では，1934年に創業した四条木屋町のフランソア喫茶室の歴史を，店内貸し切りで講義しました。

      授業の紹介

      1934年に創業した京都・四条木屋町のフランソア喫茶室は，豪華客船公室を模した美しいイタリアン・バロックのインテリアで知られています。

      この講義では，フランソアに関わった人物，1920年代～40年代の京都，豪華客船の歴史などについてお話しました。'
