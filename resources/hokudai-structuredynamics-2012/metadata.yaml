name:
  ja: 大学院教育 構造ダイナミクス特論（2012）
description:
  ja: 機械システムの設計で重要な運動と動的特性の把握を主題とし、変分法、ハミルトンの原理、ラグランジュ方程式などの力学の諸原理を学ぶ。あわせて、連続体の振動やモード解析、非線形振動、ロボットの構造解析と運動方程式・状態方程式の導出まで扱う。
quotedDescription:
  text:
    ja: '機械システムの設計において、その系の運動状況と動的特性を力学系に把握することは極めて大切です。この講義では、変分法、ハミルトンの原理、ラグランジュ方程式など力学の諸原理の理解に重点を置き、これに基づいて連続体の振動、モード解析、非線形振動、さらにロボットの構造解析、運動方程式および状態方程式の導出についても学びます。

      本編撮影年度：平成24年度前期（第1～15回）

      第2回以降の講義はこちら

      ガイダンス以降の本編は、工学系教育研究センター（CEED）の配信システムで公開しています。

