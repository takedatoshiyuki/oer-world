    ja: 【京都大学白浜水族館】昭和天皇行幸一周年の記念式典を機に、1930年に公開された歴史ある水族館です。年間約８万人の入館者が訪れ、瀬戸臨海実験所で実施される学生実習でも利用されています。展示生物は全て白浜周辺で採取されたもので、常時約500種を展示しています。
