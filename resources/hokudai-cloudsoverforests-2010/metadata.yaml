name:
  ja: サイエンス・カフェ札幌から Pick up! 森の上の雲 ～シベリアを環（めぐ）る水の話～（2010）
description:
  ja: 水が雲、雨、川、海、氷河へと姿を変えながら循環するしくみを扱い、その背景にある要素を考える。研究の舞台をシベリアに置き、永久凍土とタイガ林の地域で進める水循環研究を、フィールドワークの写真を交えて紹介する。あわせて、地球温暖化によって水の流れがどう変化するかも取り上げる。
quotedDescription:
  text:
    ja: 地球上の生き物にとって必要不可欠な水。水は雲や雨、さらに川、海、氷河などに姿を変えながら私たちのまわりを循環しています。では水が循環する背景にはどのような要素が関わっているのでしょうか？また、地球温暖化によって水の流れはどのように変化していくのでしょうか？今回のゲストは、水循環を研究している杉本敦子さん。研究の舞台、それは札幌から約3000km離れた、永久凍土とタイガ林が広がるシベリアです。杉本さんはそこで様々に“かたち”を変える水を追いながら、生物と環境の相互作用を明らかにすることを目指しています。本日はその研究について、フィールドワークの写真を交えながらお話しいただきます。さらに、まだ明らかになっていない地球温暖化と水循環の関係について、みなさんと一緒に考えていきたいと思います。
  source: https://ocw.hokudai.ac.jp/lecture/cloudsoverforests-2010
