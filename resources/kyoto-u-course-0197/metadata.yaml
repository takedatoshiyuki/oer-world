name:
  ja: 第74回 京都大学丸の内セミナー「西南日本の地殻変動と2016年熊本地震」
description:
  ja: この教材は、全国規模のGNSS観測網によって捉えられる日本列島の地殻変動を手がかりに、西南日本の変形の特徴を扱う。南海トラフから沈み込むフィリピン海プレートの影響、内陸域の複雑な変動、ひずみ集中帯と地震発生の関係までを述べる。
quotedDescription:
  text:
    ja: 我が国に全国規模のGNSS(GPS)観測網の整備が開始されたのは1994年である。これ以降、日本列島の地殻変動、すなわち日本列島の形が現在どのように変わりつつあるのかを高精度に観測できるようになった。西南日本（図１）においては、南海トラフから沈み込むフィリピン海プレートの影響を受けて、四国や紀伊半島が北西向きに変動しているが、内陸域にはフィリピン海プレートの影響だけでは説明できない変動が見られ、特に九州の地殻変動は複雑である。内陸域の地殻変動が集中している場所は、ひずみ集中帯と呼ばれ、近年の内陸地震の多くは、ひずみ集中帯に発生している。ひずみ集中帯の場所は、概ね活断層が多く分布する地域と対応しているが、顕著な活断層が見つかっていない地域にも、ひずみ集中帯は存在する。
