name:
  ja: 学際情報学－情報と諸学問の融合（学術俯瞰講義）
description:
  ja: 情報技術が社会や諸分野の知的活動に与える影響を、経済・社会・教育・文化・芸術・人間行動・生命などの領域にわたって扱う。基礎科目「情報」で学ぶ概念や方法論を土台に、各分野で情報が知の営みをどう変えてきたかを考える。
quotedDescription:
  text:
    ja: 急速に発展している情報技術は，現代の情報化社会を支える技術的および思想的な基盤として社会全体に大きな影響を与えており，経済，社会，教育，文化・芸術，人間行動，生命等の様々な分野における知的活動を質的に変化させてきた。そのため，これら諸分野における知の営みと情報の関係を正しく理解することは，21世紀に生きる私たちにとって，文系・理系の区別なく必要である。この講義では，全科類生にとって必修である基礎科目「情報」で学ぶ概念や方法論をベースにして，それら概念や方法が，上述の諸分野でどのような影響を与え，知の営みをどのように変化させてきたかを学ぶことで，真の意味での広義の情報リテラシーを幅広く身に付けることを目指している。
  source: https://ch.u-tokyo.ac.jp/series/?id=iQqZRf6aAO5H
