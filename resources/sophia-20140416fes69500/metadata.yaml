description:
  ja: 上智大学の英語学科関連の卒業生を招き、歩んできた経歴や現在までの仕事、所属する業界の事情を取り上げる講義である。受講生は、その内容を手がかりに自分の職業選択や人生設計について考え、毎回の小レポートと期末レポートでまとめる。
quotedDescription:
  text:
    ja: この講義では、主に英語学科を中心とした上智大学の卒業生をお招きし、それぞれが歩んでこられた人生の軌跡と、過去から現在に至る仕事や個々の業界の事情などを語っていただく。受講生たちは将来の自分自身の職業選択や人生設計を考える様々な材料を見つけることが出来るだろう。毎回、講義から学び自ら考えたことを８００字程度にまとめた小レポートを提出。それとは別に４０００字程度の期末レポートを課す。レポート類の言語は日本語に限る。
