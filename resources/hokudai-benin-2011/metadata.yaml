name:
  ja: 土曜市民セミナー アフリカの有名な小国 – ベナン（2011）
description:
  ja: ベナンを題材に、多民族社会や民主化、ブードゥー教を含む伝統文化を取り上げる。あわせて、ドラム演奏やパフォーマンスを交えながら、アフリカの現在を紹介する。
quotedDescription:
  text:
    ja: アフリカで最も狭い国の１つベナンは、多数の民族をかかえながらも民主化を果たし、また、ブードゥー教など豊かな伝統的な文化が息づいている大変ユニークな国です。今回のセミナーでは、これまでのような型にはまった報告ではなく、ドラム演奏やパフォーマンス等を交えて、アフリカの今日を紹介します。陽気な、そして奥深いアフリカの雰囲気を味わってください。
  source: https://ocw.hokudai.ac.jp/lecture/benin-2011
