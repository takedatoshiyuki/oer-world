name:
  ja: 全学教育 英語演習 初級：All-English Training for Giving a Campus Tour (2012)
description:
  ja: 北海道大学で2012年度に開講された英語演習で、キャンパスツアーを英語で案内するための内容を扱う。キャンパスや市の説明のしかたに加え、札幌で英語を使って人と接する場面にも触れる。公開教材は8件のスライド資料である。
quotedDescription:
  text:
    ja: 'I want you to be friendly，outgoing，personable，useful，and helpful. You can be all of these things
      and speak English in Sapporo at the same time. I want to help you know our campus and city，how to
      explain them，and -- above all -- to meet people who would appreciate your help.

      This course is easy，normal，and hard. The easy part is the English language. The normal part is finding
      somebody who needs help. The hard part is offering help to them.'
