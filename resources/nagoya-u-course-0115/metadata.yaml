name:
  ja: E.-ライントレースカーを作る
description:
  ja: 床の上の線を自動でたどって走るライントレースカーを題材に、ものづくりと制御の要素を扱う教材である。公開されている講義ノートは、制作、制御用プログラムの開発、試走の流れで構成されている。メカトロニクスという工学分野との関係にも触れる。
quotedDescription:
  text:
    ja: 私達の身の回りでは自動車や航空機からの洗濯機や扇風機に至るまでさまざまな「動く」機械が活躍しています．これらの機械の多くはコンピュータやさまざまなセンサなどの電子回路によって制御されています．このような機械工学(Mechanics)と電子工学(Electronics)を組み合わせた技術は「メカトロニクス」(Mechatronics)と呼ばれます．ここでは，床の上に描かれた線を自動的にたどって走る「ライントレースカー」を製作し，メカトロニクスの世界に触れます．
  source: https://ocw.nagoya-u.jp/courses/0115-E.-%E3%83%A9%E3%82%A4%E3%83%B3%E3%83%88%E3%83%AC%E3%83%BC%E3%82%B9%E3%82%AB%E3%83%BC%E3%82%92%E4%BD%9C%E3%82%8B-2008/
