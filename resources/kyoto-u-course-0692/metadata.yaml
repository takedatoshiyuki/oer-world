name:
  ja: 情報と社会
description:
  ja: この教材は、情報技術と社会の接点を主題にした講義資料である。情報コンテンツの共有、ネットワークによる組織形成、情報メディアが社会変革に与える影響という3段階で、扱う範囲を広げていく。公開資料には、技術史、コミュニケーション、教育の変革を扱う回と課題が含まれる。
quotedDescription:
  text:
    ja: '美濃教授 担当分のみ

      授業の特色

      「情報と社会」は、高等学校の教職免許「情報」を得るために必要な科目である。本講義では、情報技術と社会接点について解説する。講義は3部に分かれている。第１部では情報コンテンツ（データ、ＷＥＢ情報、映像など）の社会的共有を、第２部では情報ネットワークのコミュニケーションが可能とする電子的な組織（チーム、マーケット、コミュニティ）の形成を講義する。第３部では第１部、第２部を踏まえて、情報メディアが今後の社会変革に与える影響を解説する。'
