name:
  ja: 'H2: Behavioral Sciences and Humanistic Sciences (B) Ｈ２：行動の科学・人間性の科学（Ｂ）'
description:
  ja: 心理学の知識と方法論を学び、それを教育、平和、環境などの領域での企画・実行・評価にどう適用するかを扱う講義である。内容には、幸福の説明と測定、ウェルビーイングの相互関係、多文化的文脈での強みや文化的多様性、社会正義、希望をめぐるテーマが含まれる。
quotedDescription:
  text:
    ja: 'Students are expected to acquire psychological knowledge and approaches in this course. This
      course encourages them to examine how these knowledge and approaches are applied to the categories
      of plan, action and assessment in various fields such as education, peace and environment.

      心理学の知識と方法論を学び、それが教育、平和、環境その他の諸領域におけるプログラムの企画、実行、評価にいかに適用されるかを検討する。

      Contents of Lectures

