description:
  ja: この講義は、機械学習のブラックボックスモデルを題材に、信頼性・公平性・有用性に関わる問題を扱う。あわせて、モデルの仕組みを確認し、どのような場合に解釈可能性が生まれ、どのような場合に不明瞭になるかを取り上げる。さらに、ブラックボックス問題を軽減するための技術的手法、その使用例、現在の課題まで概説する。
quotedDescription:
  text:
    ja: この講義では、機械学習におけるブラックボックスモデルの信頼性、公平性、そしてAIアプリケーションの有用性に関する課題に取り組みます。具体的なモデルのメカニズムを調べ、どのようにして一部のモデルが解釈可能であり、どのようにしてそれらが不明瞭になるかを示します。また、ブラックボックス問題を軽減するための一般的な技術的解決策を取り上げ、これらの技術の具体的な使用例と現在の課題についても概説します。
