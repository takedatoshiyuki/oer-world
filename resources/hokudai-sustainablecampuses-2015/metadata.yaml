name:
  ja: サステナビリティ・ウィーク サステイナブルキャンパス 国際シンポジウム（2015）
description:
  ja: 北海道大学のサステナビリティ・ウィークの一環として行われる国際シンポジウムで、持続可能な社会の実現に向けた大学内の組織づくりを扱う。サステイナビリティ・オフィスの役割や、トップの関与と現場からの働きかけをどう組み合わせるかを議論する構成になっている。公開教材として、持続可能な社会の実現に向けた北海道大学の取組をまとめたPDF講義資料がある。
quotedDescription:
  text:
    ja: '【テーマ Theme】

      持続可能な社会実現のためのチーム・ビルディング

      ―世界の課題に取り組む大学の新たな組織づくりとサステイナビリティ・オフィスの役割Team building toward a sustainable future

      ― New university regime for global issues and the role of a sustainable campus office

      【趣旨 Purpose】

      　サステナビリティ・ウィークの一環として行われるサステイナブルキャンパス国際シンポジウムは2011年から始まり、今回で5回目を迎えます。

      　昨年は、「サステイナブルキャンパス構築のための思想と実践－大学にとって「地域」とは－」と題し、地域社会と大学が関わり合うことで、持続可能な社会づくりに大学がどのように貢献できるのか、多くの事例が示されました。

      　大学キャンパスは、社会的学習の場という新しい役割を持ちはじめています。実社会の課題を解決しようとするサステイナビリティ学の教育プログラムに取り組む大学は、専門分野の異なる教員の知識、学生のアイデア、社会のニーズを統合させ、大学を”象牙の塔”から社会に開かれた場へと、どんどん進化させています。

      　この進化を起こす鍵となるものは何でしょうか？大学全体を巻き込み、動かしていく秘訣があるのでしょうか？

      　今年のシンポジウムでは、全学を巻き込むチーム・ビルディングの方法、サステイナビリティ・オフィスの役割、トップコミットメントとボトムアップの双方向の戦略について議論します。マサチューセッツ工科大学（アメリカ）、ブリティッシュコロンビア大学（カナダ）、国内からは、キャンパスマネジメントのトップランナーである名古屋大学、計３つの大学からゲストスピーカーをお招きします。

      　Hokkaido University annually holds a unique event “Sustainability Weeks” that has been offering
      various workshops and symposiums since 2007、precedential to G8 Hokkaido Toyako Summit in 2008 where
      Sapporo Sustainability Declaration was made、to researchers、students、and general public in the world
      to discuss sustainability issues. The International Symposium on Creation of Sustainable Campuses
      is one of the symposiums organized during Sustainability Weeks. This is the 5th year to hold the
      international symposium on sustainable campuses.

      　In the last symposium、2014、a new role of a campus at higher educations was suggested by both of
      the keynote speakers. A university campus is transforming to be an important place for social learning.
      Problem based learning programs in sustainability science consolidate the knowledge of faculty、the
      ideas of students、and the needs of the society. The transformation of an entire university from
      an ivory tower is essential for our sustainable future.

      　Then、what’s the key of this transformation? How would we move the whole of university? In this
      year、2015、from 3 keynote speeches、we drill down to means of team building、the role of a sustainable
      campus office、and the integration of top-commitment and bottom-up approach.'
