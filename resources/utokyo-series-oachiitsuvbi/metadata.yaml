name:
  ja: Teaching Development in Higher Education in English／UTokyo Global Future Faculty Development Program（UTokyo
    Global FFDP）
description:
  ja: 大学教員に必要な教育者としての力量を育てることを目的に、学生の学習を促す方法や、学習者中心のシラバス・授業設計を扱う。加えて、反省、批判的思考、議論、実践を通じて、flipped classroom
    や peer-feedback などを体験的に学ぶ。証拠に基づく視点と国際的な視点から、大学教員としての専門性の育成を目指す。
quotedDescription:
  text:
    ja: "To fulfill their roles as academics, faculty members in universities are asked to have the competences\
      \ of an educator, in addition to those of a researcher.\n “The University of Tokyo Global Future\
      \ Faculty Development Program” (UTokyo Global FFDP) aims to contribute to the educational development\
      \ of future faculty members. Through the course, participants will learn how to enhance students’\
      \ learning, contribute to their active and significant learning, design a syllabus and lessons with\
      \ a learner-directed approach, and engage into the teaching profession with an inclusive and scholarly\
      \ approach.\n The course emphasizes reflection, critical thinking, discussion, and learning by doing.\
      \ Hence, participants will learn by practicing and experiencing the contents addressed (e.g., flipped\
      \ classroom, class instruction, peer-feedback, etc.).\n UTokyo Global FFDP approaches the training\
      \ of future faculty members using an evidence-based and global perspective that will allow participants\
      \ to develop their careers as academics both in Japan and overseas. The participants’ learning experience\
      \ will be enriched by “making use” of the variety of national contexts and disciplinary fields among\
      \ them, contributing to the acquisition of new perspectives on how teaching and learning occurs\
      \ internationally and to the building of professional networks/communities beyond their own disciplinary\
      \ field."
  source: https://ch.u-tokyo.ac.jp/series/?id=OacHiiTSUvBI
