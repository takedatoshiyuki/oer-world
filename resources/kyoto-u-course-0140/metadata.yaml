name:
  ja: 第60回人環国際交流セミナー “In Praise of Light and Shadows”
description:
  ja: 中世の光学からルネサンスの遠近法への展開を手がかりに、表象にもとづく知識の考え方を扱う講義である。さらに、ライプニッツの逆遠近法と「影の教説」を取り上げ、視覚的形式の意味を西洋思想と東洋思想の両方に照らして考える。
quotedDescription:
  text:
    ja: 'Course Description

      Transforming the Medieval “science of light” (geometric optics) into a “science of vision” (artificial
      perspective), European Renaissance artists paved the way for a theory of knowledge grounded on representation.
      For Leibniz, however, representation is only a passive copy, whereas knowledge draws correlations
      between different things and therefore requires also a “doctrine of shadows”, which is drawn from
      perspective once the light replaces the eye, the opaque replaces the object, and the shadow replaces
      the projection. Thus, Leibniz’s reverse perspective might help clarify the significance of visual
      forms in Western and Eastern thought.'
