name:
  ja: サステナビリティ・ウィーク ようこそ！ヘルスサイエンスの世界へ あの日からの復興-保健科学の視点から- （2011）
description:
  ja: '保健科学研究院の公開講座として、震災からの復興を保健科学の視点から扱う。放射線の人体への影響、被災地域の人々の健康を支えるケア、遠隔健康相談の3つを通して、各分野の話題を取り上げる。

    北海道大学の2011年度講義で、3名の講師が専門分野を紹介する構成である。'
quotedDescription:
  text:
    ja: '保健科学研究院の公開講座は「ようこそ！ ヘルスサイエンスの世界へ」というテーマのもと、３名の講師陣が専門分野の紹介をします。今回は震災からの復興を保健科学の立場から考えることとし、「あの日からの復興－保健科学の視点から－」というサブタイトルをつけました。

      第１限目は「放射線の人体への影響－被ばくとリスクの考え方－」と題して、伊達広行教授が原発事故によってクローズアップされた放射線の問題を解説します。第２限目は「被災地域の人々の健康を支えるケア－人々の絆と健康－」と題して、河原田まり子教授が被災地の人々の心身両面にわたるケアをどのようにするべきかを解説します。第３限目は「被災地と北大を結んだ遠隔健康相談」と題して、小笠原克彦教授が最近話題となっている遠隔地と北大をテレビ電話でつなぐ高度遠隔健康相談システムを用いて、被災地と北大を結んで行った健康相談について解説します。

      講演者はサステナビリティ・ウィーク2011のテーマの一つである「健やかに人間らしく生きる」ことと震災からの復興をキーワードとして、保健科学の視点から詳しくかつ分かりやすく解説します。ご期待ください。

      ＜関連講義＞

      ・サステナビリティ・ウィーク　ようこそ！ヘルスサイエンスの世界へ（2012）

      ・サステナビリティ・ウィーク　ようこそ！ヘルスサイエンスの世界へ（2013）'
