name:
  ja: 2021年度：高校生と大学生のための金曜特別講座
description:
  ja: インド世界の多様性と、カーストが果たしてきた社会制度としての役割を扱う講義である。あわせて、現代社会で平等性と多様性をどう両立させるかを、インドの歴史と社会を手がかりに考える。
quotedDescription:
  text:
    ja: 'インド世界の魅力の一端はその圧倒的な多様性にあります。そして実は、多様性を保つための社会制度として機能してきたのがカーストでした。 現代社会においては、人びとの平等性と多様性を共に重んじることが大切です。それはいかにして可能なのでしょうか。そのためのヒントを、インドの歴史と社会から探っていきましょう。

      講師：田辺 明生

      ★高校生と大学生のための金曜特別講座 

      ★あなたのシェアが、ほかの誰かの学び…'
