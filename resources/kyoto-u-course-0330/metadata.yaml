name:
  ja: 振動・波動論
description:
  ja: 振動と波動の基礎を扱い、単振動から減衰振動・強制振動、2自由度の連成振動へと進む。さらに、一般の自由度における基準振動モードと基準座標、連続体の振動、波動方程式、フーリエ級数展開までを学ぶ。公開教材として、共鳴現象の例と応用である核磁気共鳴を扱う資料がある。
quotedDescription:
  text:
    ja: '授業の特色

      力学的運動のみならず、電磁気現象など自然界のさまざまな分野に共通して登場する振動・波動の基礎について講義する。現象を数式を用いて表現し、数学的に解析して、各種物理量の関係を導出する手法、および得られた数式の物理的意味を分かり易く解説する。

      授業の紹介

      単振動より始めて、減衰振動および強制振動を扱い、自由度が２の場合の連成振動を考察する。次に、一般の自由度の基準振動モードと基準座標について学ぶ。さらに、連続体の振動とそれを記述する波動方程式を述べ、その解の性質や固有振動を取り扱う数学的方法としてのフーリエ級数展開を論じる。これらをもとに波の重ね合わせや
      干渉・回折等の波の性質について考察する。'
