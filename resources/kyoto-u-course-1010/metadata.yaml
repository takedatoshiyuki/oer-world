name:
  ja: 【オンライン公開講義】”立ち止まって、考える” シーズン2 「会話と社交の倫理学」
description:
  ja: この講義は、日常的な会話や社交を哲学・倫理学の観点から考える。第一回ではそれらの本質を扱い、第二回では寛容や信頼との関係から倫理学的な意義と課題を考察する。
quotedDescription:
  text:
    ja: '新型コロナウイルスの影響下では、われわれのコミュニケーションのあり方も大きな変化を求められてきたといえるでしょう。しかし、そもそもコミュニケーションとはどういうものであるのか（あるべきなのか）はそれほど自明なことではありません。

      本セミナーでは、これまでの哲学・倫理学の歴史において等閑視されてきたともいえる日常的な「会話」や「社交」の本質について考察し（第一回）、その上でそれらがもつ倫理学的な意義と課題を「寛容」や「信頼」といった概念との関係で考えてみたい（第二回）と思います。

      オリジナルのコンテンツは、人社未来形発信ユニットのウェブサイトでご覧いただけます。

      https://ukihss.cpier.kyoto-u.ac.jp/2313/'
