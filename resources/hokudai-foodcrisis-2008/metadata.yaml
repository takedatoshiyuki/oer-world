name:
  ja: 遠友学舎炉辺談話 迫りくる食料危機（2008）
description:
  ja: 食料危機を主題に、人口増加に加えて穀物の争奪、温暖化、水危機がどのように関わるかを扱う。あわせて、世界の現状と日本の実態を示す内容である。
quotedDescription:
  text:
    ja: '地球人口の爆発的増加による食料危機が早くから叫ばれていたが、今日、食物とエネルギーをめぐる穀物の争奪に伴う、新たな食料危機が生じている。さらに、温暖化、水危機も加わり、じわじわと地球を浸食している。いたずらに危機感を煽るわけではないが、世界の現状と日本の実態を伝えることで、警鐘を促したい。

      第4回北海道大学遠友学舎炉辺談話

      日時 2009年2月5日

      場所 北海道大学遠友学舎'
