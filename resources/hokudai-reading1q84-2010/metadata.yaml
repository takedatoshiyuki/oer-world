name:
  ja: 人文学カフェ 村上春樹『1Q84』を読む（2010）
description:
  ja: 村上春樹の『1Q84』を手がかりに、作品に含まれる暴力や性の描写と、その背後にある「物語の力」を扱う講義である。村上文学がなぜ人を引きつけるのかという点をめぐって、作品の魅力の源泉を考える。
quotedDescription:
  text:
    ja: 現代日本を代表する作家は誰かと尋ねれば、多くの人が「村上春樹」の名前をあげることでしょう。デビュー作の「風の歌を聴け」以来、村上春樹の作品は日本のみならず、海外においても多くの人々の心を魅了し続けてきました。その村上春樹が2009年に発表した「1Q84」もまたベストセラーとなり、村上文学の魅力はますますその輝きを増していると言えるでしょう。しかし彼の小説の中には暴力や性に関する強烈な描写が含まれており、ほかの作家の作品とは一線を画す禍々しさに満ちていることも事実です。それにもかかわらず村上文学が人を惹きつけてやまないのはなぜでしょうか？
      今回ゲストにお招きする中村さんは、「1Q84」の魅力の源泉はそういった描写の背後にある「物語の力」にあると言います。われわれを魅了し続けてやまない村上文学の魅力の源泉、「物語の力」とはどのようなものなのでしょうか？
      みなさんも中村さんとともに村上文学の隠れた魅力を探求してみませんか？
