description:
  ja: 現代インドを対象に、経済成長による社会変化と、それに伴う中間層・富裕層の抱える問題を扱う講義である。消費社会の拡大や人々が直面する苦悩に触れながら、現代インドの状況を解説する。
quotedDescription:
  text:
    ja: 現代インドは大きな転換点にあります。著しい経済成長により社会状況は大きく変わりました。消費社会も拡大し、街にはモノがあふれかえっています。しかし、その一方で人々は新たな苦悩に直面しています。ストレスを抱える中高年の増加、若者の自殺率の上昇…。インドの中間層・富裕層は豊かさゆえの問題を抱えはじめています。現代のインドをわかりやすく解説します。
