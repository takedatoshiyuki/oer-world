name:
  ja: 全学教育 蛙学への招待（2010）
description:
  ja: 北海道大学の全学教育講義として、無尾目を中心に両棲類を扱う。形態や生態、繁殖戦略、鳴き声に加え、絵本や物語、食文化といった文化的側面も取り上げる。あわせて、両棲類を取り巻く環境の変化を通して、問題解決の視点と手法を学ぶことをめざす。
quotedDescription:
  text:
    ja: 今から約3億6000万年前のデボン紀に、暖かい沼地の浅瀬から勇気ある両棲類の先祖(ユーステノプテロン)が陸を目指しました。この水圏からの脱出、つまり陸上への進出は体重を支えるための骨格の劇的な進化と、空気中の酸素を獲得するための未完成な肺の誕生につながり、私たちヒトの今日の存在の基礎となったのです。本講座は、現存する両棲類の中で特異的に進化した無尾目を、形態や生態、繁殖戦略や鳴き声といった生物学的側面と、絵本や物語また食文化といった文化的側面から分析し、激変する両棲類周辺の環境を通して総合的に両棲類を捉えようとするものです。文系理系を問わず、授業を通して将来研究者として必要な問題解決の視点と手法をマスターすることも目的としています。
  source: https://ocw.hokudai.ac.jp/lecture/invitationtoagaku-2010
