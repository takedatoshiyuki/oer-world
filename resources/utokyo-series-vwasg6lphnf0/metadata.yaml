name:
  ja: 震災後、魂と風景の再生へ（朝日講座「知の冒険—もっともっと考えたい、世界は謎に満ちている」2011年度講義）
description:
  ja: 東日本大震災をめぐり、被災した人々や亡くなった人々、災害を見守った人々に向けて何を語りうるかを考える講義である。文学・思想・歴史・人間に関する人文知と、別の方法で「永遠」に触れてきた諸科学を手がかりに、教員と参加者が共に考える場として位置づけられている。
quotedDescription:
  text:
    ja: 'コーディネータ：加藤陽子、阿部公彦

      東日本大震災の被災地で生きる人々、亡くなられた人々、

      未曾有の災害に対して固唾をのんで見守った人々。

      このようなすべての人々、あるいはその魂に向け、

      魂と風景の再生に捧げる「言葉の花束」を共に想像（創造）することをめざす。

      今年度は、文学と思想、歴史、人間についての知である人文知を一つの核とし、

      今一つには、人文知とは別個の方法で「永遠」といったものに触れてきた

      諸科学が、現在もなお進行中の、この壮絶な悲惨さのなかで何を語りうるのか、

      何を遺しうるのか、教員と参加者とが共に考える場としたい。'
