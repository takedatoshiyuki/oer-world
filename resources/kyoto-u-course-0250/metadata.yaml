name:
  ja: ワークショップ “Expand your borders, experience Virtual Exchange!”
description:
  ja: このワークショップは、オンライン講義を用いたVirtual Exchange Programの仕組みと、それを通じた学びのあり方を扱う。海外の大学が提供する講義を受講し、一定の基準を満たすことで自大学で単位認定を受ける仕組みについても触れながら、ヴァーチャルな留学の可能性を議論する。
quotedDescription:
  text:
    ja: '概要

      教育へ情報通信技術（ICT）を活用することが普及しつつある昨今、高等教育機関の正規課程内でオンライン教育が重要な役割を担いつつあります。それに伴い、オンライン講義を利用した単位・学位認定の取り組みが活発になっています。

      「Virtual Exchange Program」は、世界のトップ大学が加盟するグローバルな教育プログラムです。自国にいながら、外国にある他大学提供のオンライン講義を受講し、試験に合格するなどの一定の基準を満たすことで、自大学での単位認定を受けられるという仕組みになっています。

      本ワークショップでは、ワーヘニンゲン大学（オランダ）でオープン＆オンライン教育チームの一員として Virtual Exchange Program の運営に携わっている Iris van Hal
      氏を迎え、オンライン講義を用いたヴァーチャルな留学（Virtual Exchange）を通じた新しい学びの可能性について議論します。'
