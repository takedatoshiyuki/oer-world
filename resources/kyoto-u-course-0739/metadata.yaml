quotedDescription:
  text:
    ja: 'Course Description

      The minimal model program is an ambitious program that aims to describe the birational geometry
      of smooth complex projective varieties.

      In these lectures I will discuss recent progress that has led to the completion of this program
      for varieties of general type and to the proof of the theorem on the finite generation of the canonical
      ring.'
