name:
  ja: 土曜市民セミナー 大陸から島へ バイカル・北海道考古学プロジェクトの取り組み（2011）
description:
  ja: 大陸から島への移住行動や民族形成を、環境変化と人類文化の多様性という観点から扱う講義である。礼文島で始まった国際フィールドスクールや、11カ国の大学から集まった研究者・学生による共同研究にも触れ、7年にわたるプロジェクトの意義を説明する。
quotedDescription:
  text:
    ja: '人類は、大陸から島嶼まで多様な環境に適応した独自の文化を生み出してきました。

      しかし、この適応行動には、大きな転換点が存在したことが知られています。その一つは季節的環境変化の大きな北方圏への進出であり、もう一つは海洋環境への適応でした。

      この夏、北の花の浮き島と呼ばれる礼文島に世界の11カ国の大学から研究者と学生が集い、環境変化と人類文化の多様性を調査する国際フィールドスクールがスタートしました。

      地球規模での環境変動と文化的多様性、大陸から島への移住行動と民族形成など7年にわたる長期プロジェクトで何を明らかにしていくのか。動き出した国際共同研究の意義を解説します。'
