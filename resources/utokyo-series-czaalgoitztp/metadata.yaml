    ja: コンゴでは1996年以降紛争が続き、累計で600万人の犠牲者が出てきました。特にコンゴ東部では、豊富な鉱物資源を資金源として100組織を超える武装勢力が闘争を続け、住民に対する人権侵害を行っています。その人権侵害の一環として、組織的な性暴力が行われています。本シンポジウムでは、コンゴ東部で性暴力被害者への医療に取り組むデ二・ムクウェゲ医師を講師として招き、コンゴ東部における紛争下の性暴力の実態についてお話…
