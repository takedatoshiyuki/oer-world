    ja: 上智大学は、２０１３年に創立１００周年を迎える。本講では、上智大学の歴史をその源泉にまで遡って振り返り、本学の教育理念およびアイデンティティを様々な角度から考察・探求する。授業は、それぞれの分野を専門とする講師の輪講形式で行われる。
