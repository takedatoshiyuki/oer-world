name:
  ja: 全学教育 ムーミンの国へようこそ！（2010）
description:
  ja: ムーミン物語を手がかりに、フィンランド人の自然観・人間観・人生観を学ぶ講義である。北欧の伝承との関連にも触れつつ、日本の将来や自分の生き方を考える。
quotedDescription:
  text:
    ja: 'ムーミンはカバではありません！ムーミンたちはすべて、トーベ・ヤンソンが作り出した「いきもの」です。北欧に古くから伝わるサーガ（物語）に登場する妖精との類似が指摘されています。こうした北欧色が色濃く漂うムーミン物語を題材として、フィンランド人の自然観や人間観、人生観を学びます。これにより、自らがよりよく生きていくための指針を考えることが本授業の目標です。

      しかし、なぜ今フィンランドなのでしょう？それは、とても小さく寒い国なのに、とても「熱い」国だからです。経済協力開発機構（OECD）が実施する15歳時の学力調査（PISA）で世界一を維持し続け、世界経済フォーラム（WEF）による国際競争力調査でも世界トップクラス。一方の日本はいずれも下降の一途。フィンランドと日本の明暗を分けているものはなんでしょうか？ムーミン物語を通じて日本の将来と自分の生き方について考えていきましょう。'
