name:
  ja: E. FORUM 2016 全国スクールリーダー育成研修
description:
  ja: 学校や地域の教育改革を担うスクールリーダーの育成を扱う研修である。公開教材には、課題設定能力の育成に向けた指導と評価、および高校での教員の職能成長や授業改善に関する講義資料が含まれる。
quotedDescription:
  text:
    ja: '概要

      現在の日本においては，学校や地域の教育改革を推進するスクールリーダー（教育委員会指導主事，学校管理職・研究主任，地域の教育サークルのリーダーなど）の育成・力量向上が求められています。そこで，京都大学大学院教育学研究科では
      2006年度に E.FORUM を設立し，毎年「全国スクールリーダー育成研修」を提供しています。2012年度からは，教師をめざす学生たちにも積極的な参加を呼び掛け，教師のライフコース全体を見通した力量向上のネットワークを築くことをめざしています。

       

      京都大学大学院教育学研究科教育実践コラボレーション・センター主催'
  source: https://ocw.kyoto-u.ac.jp/course/922/
