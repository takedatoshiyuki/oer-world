name:
  ja: 機能創造理工学Ｉ
description:
  ja: 物理学の基礎として、力学と電磁気学を順に扱う講義である。前半では3次元空間での質点の運動や重力下・惑星の運動を保存則とともに学び、中盤では例題演習を通じて力学を確認する。後半では電流と磁気の関係、および電磁誘導の法則を学ぶ。
quotedDescription:
  text:
    ja: 物理学は機能創造理工学の基礎である。本講義では，その物理学の中でも基本的な位置を占める力学，電磁気学を学ぶ。（オムニバス方式／全１４回）始めの５回は、基礎物理学で学んだ力学を受けて，3次元空間での質点の運動を学ぶ。特に重力下での質点の運動と惑星の運動を，運動量，角運動量，エネルギーの保存則を使って理解する。次の４回は、例題の演習と解説を通じて，物理学の基礎である力学の理解を深める。最後の５回は、電流と磁気の関係（ビオ-サバールの法則,アンペールの法則），電磁誘導（ファラデーの法則）を学ぶ。
