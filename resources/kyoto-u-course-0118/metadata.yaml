name:
  ja: 電子回路
description:
  ja: 電子回路の基礎を、制御電源や線形化、バイアスといった概念の説明から段階的に扱う講義である。バイポーラトラン幅、直流増幅、帰還、オペアンプ回路、発振回路へと進み、時間があれば非線形回路にも触れる。講義中に行った教卓実験の内容も公開する。
quotedDescription:
  text:
    ja: '授業の特色

      電子回路の基礎の習得を目標とします. 基本的なことから積み上げて電子回路を理解していく立場で講義します. このことによって, より複雑な回路の動作をも理解できる応用力まで身につけてもらえればと期待しています.

      授業内容

      まず, 電子回路特有の概念 (制御電源, 線形化, バイアス, 等) の説明から始めます. 続いて, 電子回路でもっとも基本となるバイポーラトラン幅, 直流増幅と, 次第に高度な回路の理解へと進めます.
      さらに, 帰還の考え方とともに, オペアンプ回路, および発振回路について説明します. 時間が許せば，非線形回路, 等も説明したいと考えています.

      電子回路の理解の一助になればと, 講義の中で3回ほど, 教卓で実験をしています. 講義中の実録ではありませんが, その実験内容をOCWで公開します. また, この講義のホームページは https://www.t.kyoto-u.ac.jp/lecturenotes/fe/d/60100/outline
      にあります.'
