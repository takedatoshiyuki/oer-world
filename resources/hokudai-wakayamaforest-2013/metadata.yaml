name:
  ja: 研究教育資料 北海道大学 和歌山研究林紹介（2013）
description:
  ja: 北海道大学和歌山研究林本館を取り上げ、その建物の外観と内部を映像で紹介する。1927年に建てられた洋風木造建造物であることや、和歌山研究林の成り立ちが示されるほか、揚妻林長による内部案内も含まれる。
quotedDescription:
  text:
    ja: '和歌山県古座川町平井地区にある登録有形文化財（建造物）「北海道大学和歌山研究林本館」の紹介映像。研究林本館は1927年に建てられた洋風の木造建造物で、北大研究林の歴史を残しています。

      北海道大学の研究林は国内7カ所にあり、和歌山県以外の研究林はすべて北海道にある。和歌山研究林は北海道帝国大学時代の1925年に開設された。北大研究林で戦前に建てられた建造物を現在も利用しているのは和歌山研究林のみです。この映像は、和歌山研究林本館の内部を揚妻林長に案内し、建物内の魅力を語ります。'
