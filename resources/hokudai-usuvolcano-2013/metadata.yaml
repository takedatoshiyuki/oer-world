name:
  ja: 土曜市民セミナー 有珠火山の植生と土壌の回復（2013）
description:
  ja: 有珠山の噴火跡地を例に、植生と土壌がどのように関わりながら回復していくかを扱う。1977-78年噴火後の森林の変化や、土壌の生成に関わるミミズの活動にも触れ、植生と土壌の生成・発達が同時に進む様子を紹介する。
quotedDescription:
  text:
    ja: 自然界では生物と土壌の関わりについて、生物が土壌を豊かにし、土壌は生物の生息環境として相互に作用するといわれる。それをより実感できるのは火山の噴火跡地であろう。有珠山は近年1977-78年と2000年に大きな噴火があった。前者では、火口原を囲む外輪山内壁はかつて樹高30
      ｍに達する森林であったが、噴火で壊滅した後、現在樹高25 ｍに達するドロノキからなる森林が見られるほどになった。土壌の生成は、地質学者でもあったＣ．ダーウインが研究したようにミミズの活動があったことによる。植生と土壌の生成発達は同時に進行しているといえる。1977-78年噴火後のその様子について紹介する。
  source: https://ocw.hokudai.ac.jp/lecture/usuvolcano-2013
