  ja: 北海道大学プロフェッサー・ビジット 美しいかけがえのない水環境をいつまでも(2010)
description:
  ja: この講義は、水資源を浄化し、循環再利用するための取り組みを扱う。環境汚染物質の分解・除去に関わるバイオテクノロジーと、廃水から電気エネルギーを回収する研究を取り上げる。
quotedDescription:
  text:
    ja: '限りある水資源を浄化し、有効に循環再利用することは、我々の環境・健康を守る上でも、重要なテーマです。本講義では、環境汚染物質の分解・除去を行う最新のバイオテクノロジー、廃水からクリーンな電気エネルギーを回収する研究などを紹介していきます。

