description:
  ja: この教材は、英語で物語を創作する授業の記録で、グループでの短編創作から個人での創作へ進む流れを含む。創作した作品は朗読会で扱われ、クラス全体で品評会も行う。課外学習として、創作のためのジャーナルとリーディングジャーナルが課される。
quotedDescription:
  text:
    ja: この授業ではクリエイティヴ・ライティングを行います。クリエイティヴ・ラインティングでは、アカデミック・ライティングとは違って、想像力を働かせて物語を創造し、読者を楽しませる魅力的な文章を書くことが求められます。クリエイティブ・ライティングを通じて、表現力豊かな文章力を身につけることが、この授業の目的です。
