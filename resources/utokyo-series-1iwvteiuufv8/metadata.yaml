name:
  ja: 死すべきものとしての人間－生と死の思想（学術俯瞰講義）
description:
  ja: 哲学・宗教・文芸における「生と死の思想」の展開を、主として西洋を素材に考察する講義である。死をめぐる現代の議論の背景をたどりつつ、日本文化を背景とする立場から死生観を見直す手がかりも示す。
quotedDescription:
  text:
    ja: 人間は死すべきものである。ふつう私たちはそのことを強く意識せずに生きている。そうはいかないさしせまった状況に置かれるまでは考えたくないという思いも理解できる。しかし、それは生きていることの「真実」からの逃避ではないだろうか。多くの文化は死に向き合って生きるような装置をもっていた。成熟するとは、「生と死の文化」を身につけ、自覚を深めていくことでもあった。ところが、近代の実利主義的な文化や学問は「生と死の文化」を遠ざけてきた。死にゆく人のケアの現場においてさえそうである。だが、問題は医学だけに限られない。２１世紀を迎えた現在、死すべきものとしての人間のあり方が、諸科学において改めて問い直される状況が生じている。学術を身につけようとするものにとって、「生と死の思想」に親しむことは不可欠な学びの一部ではないだろうか。この講義では、哲学・宗教・文芸等において「生と死の思想」がどのように展開してきたか、主として西洋を素材として考察する。それは、死をめぐる現代の論議の背景を照らし出すことにもなる。そこからさらに、日本文化を背景とする者として、自らの死生観を省み、育てていくための手がかりを得ていただくことを願っている。
