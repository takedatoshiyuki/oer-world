description:
  ja: サステイナブル・ファイナンスを題材に、環境・社会・ガバナンスの課題とその背景を学び、サステイナビリティとファイナンスの基礎知識を身に付ける内容である。あわせて、実務に必要な知識やスキル、発想力、マネジメント力、調整力の育成も扱う。対象は若手から中堅の社会人である。
quotedDescription:
  text:
    ja: 本スクールは、近年、国内外で主流となりつつあるサステイナブル・ファイナンスに関して、背景にある地球規模での環境・社会・ガバナンス課題への理解を深め、サステイナビリティやファイナンスの学術的基礎知識を身に付けると同時に、実務遂行に必要な知識やスキル、発想力、マネジメント力、調整力を育成するものです。特に若手から中堅の社会人を対象とし、サステイナブル・ファイナンスの課題を読み解いたうえで日常業務に生かすにとどまらず、国際社会動向に精通する能力を高め、企業の中長期的な経営戦略の中に組み込む総合的な判断力を育成することを目標とします。
