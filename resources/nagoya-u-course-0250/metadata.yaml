name:
  ja: 心理行動科学実験演習3（検査・測定法）
description:
  ja: 乳幼児から児童期、さらに成人期までのアセスメントを扱い、心理検査法の習得とその方法論を学ぶ教材である。公開されている講義ノートは、検査・測定法、発達検査、知能、人格検査・その他の検査の4件で構成される。
quotedDescription:
  text:
    ja: '乳幼児〜児童期のアセスメントと成人期のアセスメントについて、心理検査法の習得と方法論についての学習を目的とする。

      心理検査を実施し、検査結果をレポートとしてまとめる。個々の心理検査に関する学習ではなく、教育・臨床場面等における心理アセスメントの実践的な方法論について学習をする。'
