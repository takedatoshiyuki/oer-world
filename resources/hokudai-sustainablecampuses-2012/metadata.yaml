name:
  ja: サステナビリティ・ウィーク サステイナブルキャンパス 国際シンポジウム（2012）
description:
  ja: 北海道大学が開講する、サステイナブルキャンパスをテーマにした国際シンポジウムである。欧州3大学の事例をもとに、行動計画、地域連携、PDCAのための評価項目と評価手法を取り上げ、日欧の違いを議論する。
quotedDescription:
  text:
    ja: '昨年行われた国際シンポジウムでは、日米におけるサステイナブルキャンパスに関するトップランナーの大学と、これまでの取組(Achievements)やこれからの課題(Challenges)について紹介いただき、サステイナブルキャンパス構築に向けた今後の方向性を検討しました。

      今回のシンポジウムでは、本学とサステイナブルキャンパスに関する国際交流プロジェクトを協働している欧州3大学からサステイナブルキャンパス構築のための行動計画や地域と連携した計画、そしてPDCAサイクルを回すための評価項目及びその評価手法について紹介いただき、日欧における計画やその評価項目・手法の違いについて議論し、今後のサステイナブルキャンパス構築に向けた知見を得ることを目的とします。'
  source: https://ocw.hokudai.ac.jp/lecture/sustainablecampuses-2012
