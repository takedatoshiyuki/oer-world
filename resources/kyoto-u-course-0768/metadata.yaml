  ja: 畜産技術論と実習Ⅱ
description:
  ja: 京都大学附属牧場で行う畜産の講義と実習を扱う教材である。内容は、育種、繁殖、栄養、生理、生産システムに関する講義と実習に加え、家畜の生体観察・測定、繁殖技術、栄養生理、環境生理、畜産情報の収集と統合化のコンピュータ実習まで含む。
