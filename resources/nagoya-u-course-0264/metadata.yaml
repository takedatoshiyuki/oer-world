name:
  ja: 基礎セミナー遺伝子を使うと何がわかる？何ができる？
description:
  ja: 遺伝子とDNAの関係や、遺伝子を使って何ができるかを扱う基礎セミナーである。講義ノートでは、DNAの基礎から遺伝子組換え、PCR、身近な試料の同定や親子鑑定までを題材にしている。実験を通して、遺伝子を調べたり利用したりする方法を学ぶ。
quotedDescription:
  text:
    ja: いまどき「遺伝子」という言葉を知らない人はいないでしょう。遺伝子組換え、遺伝子診断、DNA 鑑定など、遺伝子を扱う技術はずいぶん身近なものになってきました。でも、遺伝子と DNA の関係は？
      と聞かれたり、赤花遺伝子と白花遺伝子は何が違うの？ と聞かれたりしたとき、正確に答えられる人は多くないかもしれません。この基礎セミナーでは、大腸菌に新しい遺伝子を導入する「遺伝子組換え実験」や、遺伝子を検出する方法である「PCR
      実験」を実際に行いながら、遺伝子とは何か、遺伝子を使うとどんなことができるのかについて理解を深めます。
  source: https://ocw.nagoya-u.jp/courses/0264-%E5%9F%BA%E7%A4%8E%E3%82%BB%E3%83%9F%E3%83%8A%E3%83%BC%E9%81%BA%E4%BC%9D%E5%AD%90%E3%82%92%E4%BD%BF%E3%81%86%E3%81%A8%E4%BD%95%E3%81%8C%E3%82%8F%E3%81%8B%E3%82%8B%EF%BC%9F%E4%BD%95%E3%81%8C%E3%81%A7%E3%81%8D%E3%82%8B%EF%BC%9F-2011/
