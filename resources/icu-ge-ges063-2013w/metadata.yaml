name:
  ja: 'S2: Peace Research Ｓ２：平和研究'
description:
  ja: 戦争、貧困、抑圧に表われる現実を踏まえながら、平和、暴力、世界秩序の問題を扱う講義である。既存の平和論を考察し、新しい視点から平和を提案するとともに、新しい社会科学の方法論の可能性を探る。
quotedDescription:
  text:
    ja: 'Aimed at enabling a deeper understanding of the problems of peace, violence and world order,
      on the basis of full recognition of the reality of the violent world as expressed in such forms
      as war, poverty and oppression. Included is a proposal for peace from a fresh perspective.

      戦争，貧困，抑圧などに表わされる現代社会の荒れる現実に対する冷静な認識の上に，これまでの平和論を考察し，新しい平和論と新しい社会科学の方法論への可能性を探る。

