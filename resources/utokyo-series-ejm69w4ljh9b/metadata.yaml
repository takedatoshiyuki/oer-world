name:
  ja: 「つながり」から読み解く人と世界（朝日講座「知の調和―世界をみつめる 未来を創る」2019年度講義）
description:
  ja: 人間が他者や社会、自然環境、モノと結びついて生きることを、「つながり」という観点から捉え直す講義である。生命維持や人体内部の関係から、家族・共同体・社会の成り立ち、さらにグローバル化やネット社会による関係の変化までを扱う。
quotedDescription:
  text:
    ja: '私たちは、様々な「つながり」の中で生きています。生物としてのヒトは、生命維持のために呼吸や栄養補給などを通じた外部世界との「つながり」が不可欠です。人体の内部でも各種の器官が複雑につながり合って活動しています。一方、そのような人は、決して1人では生きていけない存在です。「個」としての自分は、他者となんらかの形でつながっています。家族・共同体・社会などは、いずれも人と人との間の多様な「つながり」の産物にほかなりません。

      また私たちは、動物や植物、自然環境、さらには無生物であるモノとの間にも多様な「つながり」を持っています。グローバル化やネット社会の出現は、人をめぐるそうした従来の「つながり」のあり方を大きく変えるものです。あるいは、これまで直接つながっていなかったもの同士が新たに結びつくことで、これまでになかった新しい意味や可能性が生み出されてもきています。人や世界をめぐる様々な問題を「つながり」という視点を強く意識しながら読み解くと、一体何が見えてくるでしょうか。本年度の朝日講座では、人をめぐる多様な「つながり」の諸相を多角的に捉えなおしてみたいと思います。'
  source: https://ch.u-tokyo.ac.jp/series/?id=ejM69w4ljH9b
