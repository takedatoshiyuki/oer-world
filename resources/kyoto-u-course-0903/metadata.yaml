name:
  ja: 第15回知的コラボの会「指導要録改訂史にみる教育評価観の変遷」
description:
  ja: 指導要録を手がかりに、戦後の公的な教育評価や学力観がどのように位置づけられてきたかを扱う講義である。改訂の歴史を追いながら、教育評価の考え方の変化を考察する。公開教材としてレジュメと配布資料がある。
quotedDescription:
  text:
    ja: '概要

      一般に公表されない指導要録は通知表や内申書の原簿としての位置づけを持っていて、戦後の公的な教育評価の考え方や学力観を集中して表しています。その隠れた改訂の歴史を繙くことで、いかに教育評価の考え方が変化したのかを考えます。'
