  ja: Introduction to Education and Mass Communication 教育とマス・コミュニケーション概論
description:
  ja: マス・コミュニケーションの過程とその影響を、主要な理論やモデルを通して扱う講義である。政治的・社会的行動への影響の分析に加え、教育との関係ではセサミストリートやメディア・リテラシー教育を取り上げる。
quotedDescription:
  text:
    ja: 'Review of major perspectives on the process and effects of mass communication. Special attention
      will be given to the analysis of the extent that mass communication affects our lives in such areas
      as political and social behavior.

      マス・コミュニケーションの過程とその影響における理論の主なものを検討する。特に，政治的または社会的行動のような領域で，マス・コミュニケーションがどの程度われわれの生活に影響を与えるかということの分析に注目する。

