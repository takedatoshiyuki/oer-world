name:
  ja: 第31回 京都大学品川セミナー「テラヘルツ波が切り拓く新しい科学」
description:
  ja: テラヘルツ波の性質と、近年の技術発展の要点を扱う講義である。半導体物理学や水の科学への適用例を取り上げ、あわせてセキュリティー分野での応用例にも触れる。
quotedDescription:
  text:
    ja: 'テラヘルツ波は電波と光の中間の周波数を有する電磁波のことです。その振動数は携帯電話で用いられている電磁波の約１０００倍、可視光の約１０００分の１となっており、通信などで用いられているエレクトロニクスの技術と光技術の両方が未開拓な先端領域になっています。テラヘルツ波は、以前は「遠赤外線」と呼ばれ、物質の研究や治療などに用いられてきましたが、技術的な遅れから科学的な進展はわずかでした。しかし、１９９０年代後半に光技術の画期的な進展により、現在テラヘルツ波をもちいた科学が目覚ましい勢いで世界的に発展しています．応用分野でも、セキュリティーでは空港などで「ボディスキャナー」として使用されています。また、医療ではがん診断や薬剤分析などの応用展開が期待されています。

      本セミナーでは、テラヘルツ波とは何かをわかりやすく説明した後、最近の技術発展のポイントを解説し、半導体物理学、水の科学などの基礎科学への適用例を示します。適宜、セキュリティー分野などへの応用例も示します。'
