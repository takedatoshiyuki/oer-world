name:
  ja: Introduction to Linguistics II 言語学入門 II
description:
  ja: さまざまな言語のデータを手がかりに、理論言語学の基本的な考え方を扱う講義である。内容は、言語理論と普遍文法、音韻論、形態論、統語論、意味論、脳と言語理論に及ぶ。
quotedDescription:
  text:
    ja: 'This course is an introduction to theoretical linguistics. It examines linguistic data from various
      languages to learn basic theoretical thinking. It covers basic issues in phonology, morphology,
      syntax and semantics. INTRODUCTION TO LINGUISTICS I or consent of the instructor required.

      理論言語学入門コース。種々の言語のデータを使い理論言語学の考え方を学ぶ。音韻論、形態論、統語論、意味論の各分野から基本的な問題をとりあげ検討する。言語学入門 I を既修のこと。または担当教員の受講許可を要する。

      Contents of Lectures

      7

      Lectures /

      2

      Videos

      1.言語理論と普遍文法（人間はどうして言語が話せるのか？）

      2.音韻論の分析と理論的考察（音韻体系のしくみ）

      3.形態論の分析と理論的考察（単語の内部構造）

      Jun 01

      4.統語論の分析と理論的考察（文の構造）

      Lecture Notes

      Jun 0

      3

      4.統語論の分析と理論的考察（文の構造）

      Lecture Notes

      5.意味論の分析と理論的考察（形式意味論）

      6.脳と言語理論（脳科学からみた言語学）'
