name:
  ja: 地球環境政策論1B：企業と市民社会の対話と協力
description:
  ja: 企業トップ、環境NGO、有識者が交代で講義する形式で、環境経営と環境政策を扱う。実社会での環境問題への取り組みを素材に、持続可能な社会の形成を考える構成である。講義後には質疑応答とアンケートを行う。
quotedDescription:
  text:
    ja: '授業の特色

      環境経営・環境政策をテーマに、企業トップ、環境ＮＧＯ、有識者によるリレー講座として実施。全学共通科目であるとともに、公開講座でもある。実社会における環境問題への取り組みを素材とし、持続可能な社会の形成を考えることが本講座の目的。

       

      授業の紹介

      「環境を考える経済人の会（Ｂ−ＬＩＦＥ２１）」のご協力によって、環境経営・環境政策をテーマにして、企業トップ、環境ＮＧＯ、有識者によるリレー講座として実施する。毎回の授業では、各講師それぞれの立場での環境問題への取り組みと、受講生へのメッセージを込めた講義をいただき、その後質疑応答を行う。毎回の講義の後には、受講生に対し講義の感想、質問、意見などのアンケートを実施する。実社会の第一線における環境問題への取り組みを素材として持続可能な社会の形成を考えることが本講座の目的である。'
  source: https://ocw.kyoto-u.ac.jp/course/979/
