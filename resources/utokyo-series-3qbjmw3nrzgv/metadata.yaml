quotedDescription:
  text:
    ja: '【研究概要】

      西洋・近代建築史

      【教授略歴】

      1974　東京大学工学部専任講師

      1974-1975　ロンドン大学コートゥールド美術史研究所留学（英国政府給費留学生）

      1978　東京大学助教授

      1990-　東京大学教授（工学部建築学科・現在は工学系研究科建築学専攻）

      1993　ハーヴァード大学客員教授（美術史学科）

      1997-1998　日本建築学会副会長

      2000-　早稲田大学客員教授（併任）'
