name:
  ja: 高温超伝導発見 ベドノルツ博士（ノーベル賞受賞者）を迎えて－大学への物理学：超伝導とトポロジー, 2016
description:
  ja: 高温超伝導体の発見者であるベドノルツ博士を迎え、発見の経緯やノーベル賞受賞者としての活動を取り上げる講義である。前半では京都大学の教員が超伝導の入門的な解説を行い、高温超伝導体を用いた実験や、超伝導とトポロジーの関係の導入にも触れる。
quotedDescription:
  text:
    ja: '概要

      高温超伝導体を発見による1987年ノーベル物理学賞受賞者のべドノルツ博士を迎えて、高校生向けのメッセージを主眼に、発見の経緯やノーベル賞受賞者としての活動などをお話しいただきます。概要の通訳も致します。

      前半では京都大学の教員が超伝導の入門的解説を行い、さらに高温超伝導体を用いた実験もお見せします。解説では、物質科学の分野で急速な発展を遂げつつあるトポロジーと超伝導の関係についても入門的なお話をします。

       

      主催：文部科学省 科学研究費補助金

      新学術領域研究「トポロジーが紡ぐ物質科学のフロンティア」'
