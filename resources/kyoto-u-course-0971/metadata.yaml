  ja: 地球科学の研究と教育を振り返りながら、地震・噴火・温暖化の今後を扱う講義である。東日本大震災後の日本列島を「大地変動の時代」として捉え、その先の見通しを述べる。
quotedDescription:
  text:
    ja: '1997年の着任以来、24年にわたって行ってきた地球科学の研究と教育を振り返り、未来へのメッセージを伝えたい。

      10年前の2011年東日本大震災によって日本列島は「大地変動の時代」に入ってしまった。今後の地震・噴火・温暖化を予測し、賢く明るく楽しく生き延びる知恵を講義する。'
