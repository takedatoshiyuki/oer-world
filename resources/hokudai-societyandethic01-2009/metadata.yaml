name:
  ja: 北海道大学公開講座 現代社会と倫理 「『リスク社会』を知る」（2009）
description:
  ja: 現代社会を「リスク社会」という概念から捉え、科学・技術の発展がもたらす副作用としてのリスクを扱う講義である。あわせて、そのリスク社会の実態を確認し、そこで倫理が意味をもつかどうかを考察する。
quotedDescription:
  text:
    ja: 現代社会の特質を表す1つの有力な概念として「リスク社会」というものがある。近代化の進展過程で、科学・技術の発展を通じて、人間社会は貧困や病苦という宿敵と戦い打ち負かしてきたが、その反面、科学・技術の発展は、社会全体を蝕み変形させる「副作用」＝リスクも同時に生み出してしまった。このリスク社会の実態と、リスク社会において倫理は意味をもちうるか否かについて考察を加えていく。
