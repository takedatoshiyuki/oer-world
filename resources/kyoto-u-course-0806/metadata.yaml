name:
  ja: 自然の不思議を探る：文系・生命科学系向け現代物理学
description:
  ja: 自然科学における客観的理解と、対象に入り込む主観的・体験的理解の二つの見方を軸に、創造性や生命の捉え方を考える講義資料である。分岐現象や安定性、老化、認識、環境問題、脳構築、発達障害など、現代物理学の周辺にある題材へも展開する。
quotedDescription:
  text:
    ja: '概要

      理解するという方法には、２つの側面がある。１つは、皆さんもよく熟知している客観的な理解である。これは、見ている対象とは独立に観測者があることを前 提としている。その独立性故に、私たちは普遍性について議論できると考えている。自然科学は、こうした客観的な世界観を緻密に体系化してきた学問であることは、言うまでもない。いま１つの方法は、主観的かつ体験的な理解である。対象そのものになりきることによって、その本質を捉えようとする方法である。武術・芸術などでは、書物の客観的知識とは別に、失敗と成功を繰り返すことによって、熟知していくということはよく知られている。前者は、西洋的であると言われ、後者は東洋的であると言われる。心理学者ユングは、前者を外向タイプ、後者を内向タイプと呼んだ。創造性を探究するということは、実はこの２つの方法を統合することに他ならない。そして、生命の本質は、両者の循環過程−すなわち、「自己・非自己循環過程」−として、捉えることが可能となる。これは、従来までの、要素還元論による物質への還元だけでは、生物と無生物の根本的相異を捉えることができなかったという反省を踏まえた、相補的なアプローチではないだろうか。'
  source: https://ocw.kyoto-u.ac.jp/course/806/
