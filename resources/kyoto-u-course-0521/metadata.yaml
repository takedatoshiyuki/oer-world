  ja: 海洋生物に関する講義と実習を組み合わせた授業で、漁業、無脊椎動物、微細藻類、底棲生物などを扱う。教材には、採集・同定、種同定のための分子遺伝学的手法、観察、抽出、海洋観測といった実習関連の資料が含まれる。
