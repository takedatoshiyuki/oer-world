  ja: 経営管理 I
description:
  ja: 本講義は、もの造りの基本ロジックを手がかりに、製品開発と生産を含むトータル・システムを競争力と結びつけて考える。広義の情報や行為の情報という概念を用い、生産活動を工程から製品への設計情報の転写として捉える視点を扱う。
quotedDescription:
  text:
    ja: '本講義のメインテーマは、「もの造りの基本ロジック」の追求を通じた「競争力の維持・発展」である。製品開発や生産の諸活動が相互に連携しながら「競争 力」という一つの帰結に収斂する。そのための開発・生産の「トータル・システム」を競争力と結びつける糸として「広義の情報」と捉える。講義では一貫し
      て、生産活動を「工程から製品への設計情報の転写」とみなす姿勢を貫いている。

      本講義ではそのような「行為の情報」概念を接着剤として「トータル・システム」と「競争力」を関連付けることをねらいとしている。'
