name:
  ja: 学部専門教育 カオス･フラクタル（2009）
description:
  ja: カオスとフラクタルの基本概念を、非線形力学系やセル・オートマトンの計算機上での再現を通して学ぶ講義である。C言語による実習を含み、運動方程式や非線形写像、分岐現象、リアプノフ指数、アトラクタ、フラクタル次元などを扱う。公開教材にはガイダンス配布資料、講義ノート、スライドがある。
quotedDescription:
  text:
    ja: '複雑系研究の代表的なトピックスである「カオス」「フラクタル」の基本的概念を習得します。

      特に、 複雑なシステムを非線形力学系、 セル・オートマトン等で計算機上に再現し、 そこに現れる複雑な系の挙動・性質がカオスやフラクタルの概念によって特徴付けられることを、 2年次に既習の初等的なC言語プログラミングを実際に行ってもらうことで学習します。

      スケジュール

      (1)運動方程式とその線形化、生態系の方程式とその差分化

      (2)非線形写像

      (3)軌道の稠密性

      (4)写像の折りたたみ度と軌道のエントロピー、軌道安定性とリアプノフ指数

      (5)分岐現象とカオス

      (6)数値計算の準備

      (7)非線形力学系とカオス

      (8)アトラクタの埋め込み次元と相関次元

      (9)カオスの計算機演習

      (10)自己相似性とフラクタル

      (11)複素力学系と確率的フラクタル、フラクタル次元

      (12)フラクタル計算機演習

      (13)マルチフラクタル'
