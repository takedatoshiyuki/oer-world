description:
  ja: メディア報道に含まれる虚報や誤報を取り上げ、事例を通してその問題点を考える教材である。拉致問題、オウム真理教、北朝鮮のミサイル発射、中川昭一財務相（当時）の「酔いどれ会見」問題などを例に、報道と取材源の関係にも目を向ける。
quotedDescription:
  text:
    ja: 日常的に伝えられるメディア報道は、いちいち検証を必要とする時代になったようだ。昔から虚報、誤報のたぐいは多々あるが、近年は民主主義、あるいは安全保障上からみてもゆゆしき問題を引き起こすケースが目立っている。拉致問題、オウム真理教、北朝鮮のミサイル発射など豊富な事例を挙げて、問題点をえぐり出したいと思う。また、中川昭一財務相（当時）の「酔いどれ会見」問題などから、記者と取材源の間で過度の癒着も顕著に
