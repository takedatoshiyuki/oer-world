name:
  ja: 農業経営の未来戦略
description:
  ja: 本講義は、農業経営をめぐる環境変化を背景に、個別農業経営体のあり方を多面的に扱う。農外企業の参入、集落営農、六次産業化、農商工連携、流通や金融、輸出といった論点を通じて、地域産業ネットワークの中での経営と地域への影響を検討する。
quotedDescription:
  text:
    ja: '今日、農外企業の農業参入や集落営農の展開が進んでいる。その結果、多様な農業経営体が地域に並存し、地域農業・社会に対し新たな影響を及ぼしている。また、農業者が農産物生産だけでなく、農産物加工やその他関連事業に取り組む六次産業化や農商工連携の事例も広範に出現してきている。このような状況下で、様々な有り様を示す個別農業経営体の発展及び地域社会の活性化に有効な諸方策の具体的提示やモデル造りの必要性が個々の現場において求められてきている。

      本講義は、農業経営に関わる人材の育成を重視しつつ、地域産業クラスター等の地域・産業ネットワークをベースとした個別農業経営体のあり様（財務・投資戦略を含む）を多面的な角度から検討することを目的とする。'
  source: https://ocw.kyoto-u.ac.jp/course/365/
