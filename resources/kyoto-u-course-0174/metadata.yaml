name:
  ja: 「やましろ文箱（ポートフォリオ）」をつくろう！, 2013
description:
  ja: この教材は、学習の履歴を残し、定期的に見直したり他者と対話したりするポートフォリオの考え方と作り方を扱う。高校生向けに構成されており、あわせて目次の例や検討会（交流会）の進め方に関する資料も収録している。
quotedDescription:
  text:
    ja: '概要

      ポートフォリオに学習の履歴を残し、定期的に編集したり、人と対話したりすることは、効果的に学習を進めたり、自分の生き方について考えたりする上で大きな意義があります。この講演では、高校生の皆さんに、ポートフォリオのつくり方について説明しています。「参考資料」には、ポートフォリオの目次や検討会（交流会）の進め方について説明した資料も掲載しています。

      なお、ポートフォリオは、様々にデザインできます。詳しくは、「資料」に掲載した「補足資料」で紹介している参考文献を参照してください。'
