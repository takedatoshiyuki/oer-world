description:
  ja: 日本の物語文化における文字とイメージの関係を、前近代から近代・現代まで通して扱う講義である。個別作品やジャンルを取り上げながら、視覚的物語の制作と受容、さらにテキストとイメージの関係や改作、相互テクスト性を考えるための語彙を導入する。
quotedDescription:
  text:
    ja: '(Semester 1): This course, the first part of a year-long survey, will introduce students to the
      rich traditions of visual storytelling in medieval and early modern Japan. Through a series of units
      on individual works and genres, including the Tale of

      Genji

      scrolls, medieval

      gunki-monogatari

      scrolls, Buddhist scriptures and early modern illustrated books, students will gain practical knowledge
      about the production and reception of visual narratives, as well as broad-based historical and cultural
      knowledge to enhance appreciation. Secondary readings will introduce critical vocabulary for analyzing
      interactions between text and image, adaptation across genres, and intertextuality.

      (Semester 2): This course, the second part of a year-long survey, will introduce students to traditions
      of visual storytelling popular during the late nineteenth- and twentieth-centuries, highlighting
      points of contingency with traditions introduced in the first course. Through a series of units
      on individual works and genres, including woodblock prints,

      ponchi-e, manga, shashin shōsetsu

      (photo novels) and other popular print genres, film,

      anime

      , and

      keitai shōsetsu

      (cell phone novels) students will gain practical knowledge about the production and reception of
      visual narratives, with a view towards gaining historical and cultural context for appreciating
      the interplay between technology and narrative form.'
