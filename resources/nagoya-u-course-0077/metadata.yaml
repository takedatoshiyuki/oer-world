name:
  ja: 社会行動学講義
description:
  ja: 対人コミュニケーションに関する研究テーマを概観し、対人関係の発展過程におけるコミュニケーションの役割を扱う講義である。あわせて、対人影響の手段としてのコミュニケーション方略や態度変容の理論・モデルを紹介する。公開教材には、対人コミュニケーションの特質、対人関係の発展過程、対人攻撃、日本的対人コミュニケーションなどの講義ノートが含まれる。
