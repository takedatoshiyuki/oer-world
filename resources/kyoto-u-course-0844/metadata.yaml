name:
  ja: 京都大学国際シンポジウム「未来創成学の展望」
description:
  ja: 京都大学・未来創成学国際研究ユニットの活動成果を総括し、その内容を国内外に向けて発信する国際シンポジウムである。外国人研究者と学内研究者の講演に加え、異分野のパネリストによる学術対話も行う。
quotedDescription:
  text:
    ja: '概要

      2015年7月に発足した京都大学・未来創成学国際研究ユニットは、これまでに32名の外国人研究者を招聘し、10数名の若手研究者の海外からの招聘や海外への派遣を実施しました。その結果40件程度の共同研究成果が得られました。このユニットは2019年度に5年プロジェクトの最終年度を迎えるため、これまでの成果を総括するとともに、世界に向けてそれらの成果を発信します。

      著名外国人研究者による講演と学内研究者による講演、ならびに数名の異分野パネリストが集う学術対話（その１，その２）を実施します。世界をリードする独創研究・国際共同研究を推進するとともに、次世代研究者の国際的共同研究が生まれる機会として、奮ってご参加ください。

      ※2022年3月に 京都大学ジュニアキャンパス “未来目標に基づく現状革新に向けて” 2019年10月26日（土）の映像を7本追加しました。'
