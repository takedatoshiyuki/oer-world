name:
  ja: 土曜市民セミナー モノとコトの博物館(2011)
description:
  ja: 博物館にあるモノが、情報としてのコトと結びつくことで意味をもつという見方を扱う。あわせて、総合博物館をモノとコトの両面から捉え、文系館長の立場からそのコトへのこだわりを述べる。
quotedDescription:
  text:
    ja: 博物館にあるさまざまなモノは、コト（＝事／言）つまり情報とセットになって初めて意味をもちます。モノが具体的で目に見えるのに対し、コトは不確定で捉えがたい面があります。それぞれをハード／ソフト、あるいは理系／文系の対比で捉えることもできるかもしれません。「総合」博物館とは、まさにモノとコトの総合でもあります。総合博物館初の文系館長がコトへのこだわりを語ります。
  source: https://ocw.hokudai.ac.jp/lecture/exhibitionanddescription-2011
