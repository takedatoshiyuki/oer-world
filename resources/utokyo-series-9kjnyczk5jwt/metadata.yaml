    ja: 近年、社会問題の改善のためにゲームの力を活かそうとするシリアスゲームやゲーミフィケーションの取り組みに関心が高まっています。社会問題を題材にして優れたゲームを企画し、デザインしていくには、普段の考え方やモノの見方と異なる切り口で社会問題を捉え直すことが求められます。本公開セッションでは、ゲーム作家の山本貴光氏をお招きして、ゲームデザイナーの問題を捉える枠組みやアイデアの組み立て方など、実例を交え…
