  ja: 社会問題の改善にゲームをどう生かすかという観点から、シリアスゲームやゲーミフィケーションを扱う。社会問題を題材にしたゲームの企画やデザインに向けて、問題の捉え方やアイデアの組み立て方を実例とともに扱う。
