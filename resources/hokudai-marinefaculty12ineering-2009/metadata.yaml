description:
  ja: 水産物生産の流れの中で使う漁船や機械・装置を対象に、それらを効率よく安全に動かすための工学の基礎を扱う。あわせて、船や機械に働く力の仕組みと運動特性の扱い方の基礎を学ぶ。
quotedDescription:
  text:
    ja: 水産物生産において，捕獲・選別・加工する一連の生産プロセスの中で，漁船やこれに搭載される各種の機械・装置が使用されます。本授業ではこうした機械・装置を効率よく安全に動かすために必要な工学の基本について初歩から解説し，船・機械に働く力のメカニズムや運動特性の取り扱い方の基礎を学習します。
