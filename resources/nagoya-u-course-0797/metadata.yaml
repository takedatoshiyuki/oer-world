quotedDescription:
  text:
    ja: '本授業科目は，自然科学系分野の学問体系を認識するとともに，自主的判断能力を培うことが目的である。

      本実習は、動物、植物および微生物の取り扱い方法、観察方法、実験観察 器具の操作法などをそれぞれ修得すると共に、肉眼や顕微鏡による多様な生物の観察、解剖、実験を通して、生物の構造と機能についての基礎的な理解を得ることを目的とする。またそれにより、構造や機能と遺伝子の関係を学び、観察の学問であった
      古典生物学から分子的理解を追求する近代生物学への流れを理解することを目標とする。'
