name:
  ja: 研究用計算機システム講習会
description:
  ja: この教材は、研究用計算機システムの利用に関する講習をまとめたもので、UNIXの基本操作から中級内容までを扱う。加えて、スーパーコンピュータや高性能演算サーバでのFortran、C、C++の利用法と、OpenMPによる並列プログラム作成法を扱う。
quotedDescription:
  text:
    ja: '「UNIX初級」では、UNIXのコマンドやエディタの基本的な使用方法の解説と実習を行います。

      「プログラミング言語利用」では、スーパーコンピュータ、高性能演算サーバにおける Fortran、C、C++の利用方法の解説と実習を行います。

      「UNIX中級」では、UNIXにおけるファイル管理、プロセス管理、シェルプログラミング等についての解説と実習を行います。

      「並列プログラミング(OpenMP)」では、多くの共有メモリ型並列計算機で利用可能なOpenMPによる並列プログラム作成法の解説と実習を行います。'
