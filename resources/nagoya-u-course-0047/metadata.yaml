name:
  ja: 情報通信工学第2
description:
  ja: 音声、画像、データを無線で伝送する技術を扱い、アナログ方式とディジタル方式の両方を対象にする。変調・復調や多元接続技術を数式を用いて扱い、CDMAにも触れる。
quotedDescription:
  text:
    ja: この授業では、音声や画像、データといった多様な情報を無線伝送するための技術について、ラジオの放送や従来のテレビ放送で用いられて来たアナログ方式、そして衛星・地上波ディジタル放送や携帯電話等で用いられているディジタル方式の両方を取り上げ講義します。この授業は、情報を電波に乗せ（変調）、また電波から情報を取り出す（復調）技術について、イメージだけでなく数式を用いた正確な記述での理解を与えます。また、無線伝送の共通媒体である空間を複数の信号で共有し使用するための多元接続技術についても講義します。携帯電話等でおなじみの単語である
      CDMA も多元接続技術のひとつです。
