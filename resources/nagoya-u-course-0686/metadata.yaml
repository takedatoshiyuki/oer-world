description:
  ja: この教材は、朝鮮・韓国語3と4を通じた1学期間の学習項目を扱い、連体形や可能・不可能表現、変則用言、簡単な文章の読解、入力と検索を含む。授業は教科書に沿って進み、各課の会話を扱ったのちに小テストを行う構成である。公開されている教材は、2018年10月から2019年1月にかけて作成された10件の講義ノートである。
quotedDescription:
  text:
    ja: '朝鮮・韓国語３と４を合わせ、１学期間の主な学習項目は以下のとおりである。

      ・連体形 ・可能・不可能表現 ・変則用言 ・簡単な文章の読解 ・コンピュータによる入力と検索

      授業は基本的に、教科書に沿って一つの課を 2 ～ 3 回で終えるペースで進めていく。 各課の冒頭の会話が終わった場合、当該会話について同一曜時限の次の回に 10 分程度の小テストを行う。それ以外にも適宜小テストを行うことがある。'
