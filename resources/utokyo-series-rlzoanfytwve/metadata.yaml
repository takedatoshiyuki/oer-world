description:
  ja: この講義は、介護・育児・介助を含むケアを、家族の中で担われてきた見えない労働として位置づけ、その社会的な意味を考える。少子高齢化の状況のなかで、ケアが労働といえるのか、誰が担うのか、受ける側の権利は何かを検討し、介護保険と支援費制度にも触れる。
quotedDescription:
  text:
    ja: ケアは介護、育児、介助等をふくむ広義の概念であり、自立できない個人を援助する行為をさす。だが、これまでケアは長い間、家族という私的領域のなかで見 えない労働とされてきた。少子高齢化のもとケアが焦点化するなかで、ケアは労働か、どんな労働か、だれが担うのか、それはなぜか、ケアを受ける側の権利と
      は何か等の今日的な門題を検討する。介護保険と支援費制度にも言及する。
