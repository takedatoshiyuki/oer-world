name:
  ja: 数理科学展望I
description:
  ja: 有限グラフを対象に、固有値・固有ベクトルの復習を行いながら、グラフのスペクトル解析の基礎を扱う講義である。グラフ理論と作用素の理論の関係にも触れ、解析学的な側面からグラフを見ていく。
quotedDescription:
  text:
    ja: 'グラフ理論は、組合せ論などの応用数理方面で活発に研究されている分野の一つであるが、その解析学的な側面に注目すると、作用素の理論と深く関わりをもつものであることが知られている。

      この授業では、有限グラフを主たる対象とし、固有値・固有ベクトルの復習と同時にグラフのスペクトル解析の基礎について学ぶ。

      と同時に、自ら数学を実践する、というと大げさかも知れないが、少なくともあれこれ考えるとはどういうことかを実感できれば幸い。'
