name:
  ja: 大学院教育 南極学特別実習III（野外行動技術実習）（2015）
description:
  ja: 極域環境で野外観測活動を安全に行うための行動技術を扱う教材で、氷河、海氷、山岳地域での活動を対象にする。寒冷地の装備や雪崩・クレバスの危険、高山病、低体温症、緊急時の対処法まで取り上げ、室内講義と実習に札幌手稲山での宿泊実習を組み合わせる。
quotedDescription:
  text:
    ja: '極地における野外観測は非常に重要ですが、厳しい環境下での活動は困難で、時として危険も伴います。この実習では、氷河、海氷、山岳地域など、極域環境において野外観測活動を安全に実施するための行動技術の習得と学びます。ヒマラヤや南極での経験豊富な野外活動のスペシャリスト、樋口和生氏（国立極地研究所）を講師に迎えて、寒冷地に必要な装備、雪崩やクレバスの危険、高山病や低体温症、緊急時の対処法など、実践的な知識と技術を習得することができます。野外観測の経験豊富な北大の講師陣も加わり、室内での講義と実習に札幌手稲山での宿泊実習を交えた、全国でもユニークなプログラムです

      実習の詳細については、下記のページをご覧下さい。

      2007年度　野外行動技術実習

      2009年度　野外行動技術実習

