quotedDescription:
  text:
    ja: 火成岩や変成岩等の岩石は地球型惑星を構成する主要な物質であり、地球の進化やその内部構造を理解するために重要である。本講義では、火成岩と変成岩の基本的な分類とそれらがどのような鉱物で構成されているかについて学ぶ。さらに、これらの岩石の成因について、主要造岩鉱物の結晶化学的特徴・熱力学の初歩と相平衡の考え方を併せて理解する。
  source: https://ocw.nagoya-u.jp/courses/0875-%E5%B2%A9%E7%9F%B3%E5%AD%A6-2022/
