name:
  ja: 第13回 上智大学全国高校生英語弁論大会ジョン・ニッセル杯
description:
  ja: 全国から集まった高校生が英語でスピーチを行う弁論大会を扱う。応募から一次審査、当日の発表、審査による表彰までの流れが示される。大会テーマと、経験を含む多様な視点からの発表内容が示される。
quotedDescription:
  text:
    ja: "第13回を迎える今回の大会テーマは、“Putting “For Others, With Others” into Practice”。 238人の応募者のなかから厳しい一次審査を通過した21人の高校生が全国から集まり、自分自身の経験を含めた様々な視点から、内容・語学力ともに見事なスピーチを披露しました。\
      \ \n 審査の結果、上位6名と特別賞「英検賞」1名の合計7名が表彰され、トロフィー、表彰状、副賞が授与されました。"
