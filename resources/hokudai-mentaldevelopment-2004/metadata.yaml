name:
  ja: 全学教育 心の発達と自己分析 – ありのままの自分を見つめて -（2004）
description:
  ja: 心の発達過程を乳児から老年までの段階でたどり、それぞれの時期に乗り越える課題を扱う。あわせて、無意識の世界、対人場面での行動と集団の影響、会話を通して心の成長を促すカウンセリングも取り上げる。
quotedDescription:
  text:
    ja: '1. 心の発達過程を学習し、乳児～老年までの発達段階で乗り越えねばならない課題を理解する。

      2. 心の深層を学習し、無意識の世界を理解する。

      3. 対人場面における人間の行動について学習し、集団の影響力を理解する。

      4. カウンセリングを学習し、会話を通して心の成長を促す技法を理解する。'
  source: https://ocw.hokudai.ac.jp/lecture/mentaldevelopment-2004
