description:
  ja: 2004年のスマトラ島巨大地震と、2011年の東北地方太平洋沖巨大地震による巨大津波を取り上げる。アジアで発生した巨大津波の事例を学び、北海道における津波防災について考える。
quotedDescription:
  text:
    ja: 2004年スマトラ島巨大地震により大津波が発生し、インド洋沿岸の地域（特にスマトラ島北部、インドネシア）で25万人を越える死者・行方不明者を出す大災害となりました。また2011年には東北地方太平洋沖巨大地震でも巨大津波による死者・行方不明者が25000人を越える大災害も起こりました。アジアで発生してきた巨大津波について学ぶとともに北海道での津波防災について考えます。
