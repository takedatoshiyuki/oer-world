name:
  ja: 土曜市民セミナー マリモはなぜ阿寒湖で丸くなるのか（2012）
description:
  ja: 阿寒湖のマリモが球状になる現象を手がかりに、生物の形づくりにおける球化の位置づけを考える講義である。あわせて、球化する大型生物の有無、集合の構造、発達過程、成長の速さや大きさ、阿寒湖でのみ丸く育つ理由まで扱う。
quotedDescription:
  text:
    ja: 球状の集合を形成することで知られる阿寒湖のマリモ。研究の進捗によって、長く生物学の謎とされてきたマリモの球化現象の全体像がようやく見えるえてきました。生物の形づくりにおいて、球化現象はどのように位置づけられるのか。球化する大型生物はマリモだけなのか。集合のつくりはどうなっているのか。どんな発達過程をたどって球化するのか。球化するのに生きて行くためのメリットがあるのか。野球ボールの大きさに育つまで150年もかかると言うのは本当か。最大でどれくらいまで大きくなるのか。阿寒湖に球状集合は何個くらいあるのか。なぜマリモは阿寒湖でのみ丸く大きく育つのか。マリモの球化をめぐる様々な疑問についてお答えします。
  source: https://ocw.hokudai.ac.jp/lecture/sphericalmoss-2012
