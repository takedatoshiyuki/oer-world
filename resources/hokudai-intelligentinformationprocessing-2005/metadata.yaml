name:
  ja: 学部専門教育 知能情報処理（2005）
description:
  ja: 人工知能技術に基づく知的ソフトウェアの構成要素を扱い、記号化された概念を対象にした推論、学習、不確実性の数理的処理を学ぶ講義である。あわせて、人間の知能だけでなく感覚や運動の特性も踏まえたヒューマンインタフェース設計の基礎を扱う。
quotedDescription:
  text:
    ja: '人工知能技術に基づく知的ソフトウェアの構成要素を学ぶ．この分野の技術は多岐にわたっているが，本講義では概念が記号化された以降の高次レベルでの推 論や学習および不確実性の数理的な扱いを中心に学ぶ．（それに対して，信号として与えられる低次レベルのパターンを知的に扱う技術は別の講義でなされている．）

      さらに，人間の知能に加えて感覚や運動の特性まで考慮したヒューマンインタフェースのデザインの基礎を学ぶ．'
  source: https://ocw.hokudai.ac.jp/lecture/intelligentinformationprocessing-2005
  note: 北海道大学OCW 「概要」より（著作権法32条の引用）
