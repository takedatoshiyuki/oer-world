name:
  ja: 学部専門教育 システム制御工学（2006）
description:
  ja: 漁船や水産物の捕獲・選別・加工に使う機械・装置を、安全かつ効率よく動かすための制御の基本を初歩から扱う講義である。制御設計の基礎となる理論と実際を、身近な応用例に沿って学ぶ。あわせて、機械要素の運動学や力学・運動方程式の実用的な解法も取り上げる。
quotedDescription:
  text:
    ja: '漁船、水産物を捕獲、選別、加工する生産プロセスの中で各種の機械・装置が使用されます。本授業ではこうした機械・装置を効率よく安全に動かすために必要な制御の基本について初歩から解説し、実際の制御設計の基礎となる理論と実際について身近な応用例を用いて講義を行います。

      また、機械の制御を理解するには、機械要素の運動学的理解が必要であり、力学・運動方程式の実用的な解法についても適宜、講義に中に組み入れ、「物理・力学」を履修していない学生でも容易に理解できる内容にしています。'
