name:
  ja: 憲法-II（人権・憲法訴訟）
description:
  ja: 本教材は、憲法のうち人権と憲法訴訟論を扱い、まず日本国憲法における違憲審査制度の概要を示す。そのうえで、人権条項の解釈と適用をめぐる憲法学説および判例を検討する。公開教材には、司法権と違憲審査制度、総論、表現の自由に関する講義ノートが含まれる。
quotedDescription:
  text:
    ja: この講義では、憲法・憲法学のうち、人権および憲法訴訟論を取り上げる(総論 および統治機構については憲法 I で取り扱う)。日本国憲法の下で採用されてい る違憲審査制度について概説した後、人権条項の解釈・適用にかんする憲法学説
      および判例の分析・検討を行う。
