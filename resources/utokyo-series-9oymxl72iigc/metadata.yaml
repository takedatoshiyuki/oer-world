name:
  ja: 東京大学公開講座：氣
description:
  ja: 産業革命を、機械や蒸気機関だけでなく原料の転換という観点から捉え直す講義である。土木・建築・造船の材料の変化や、化学肥料・合成農薬に依存する現代農業からの脱却の可能性に触れつつ、石炭問題や温暖化問題まで扱う。
quotedDescription:
  text:
    ja: '現在の目で産業革命を再考する場合に最も重要なのは、機械・工場や蒸気機関（エネルギー革命）ではなく、原料革命です。土木・建築・造船の主原料を木材から鉄材に変えた産業文明と、化学肥料・合成農薬に依存した現代農業から脱却できる方途が発見されていないからです。

      00:51　産業革命について

      08:44　産業革命の諸側面

      31:24　滅亡の事例ーギルガメッシュ、モアイ

      41:35　石炭問題

      46:30　温暖化問題

      ★ 過去の公開講…'
