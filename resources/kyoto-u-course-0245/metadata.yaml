description:
  ja: 京都大学大学院医学研究科の School of Public Health が、Ian Roberts 教授を招いて行う2019年の特別短期コースである。教授はロンドン衛生熱帯医学大学に所属し、疫学・公衆衛生や臨床試験に関わる研究を担当する。内容は、急性の重度出血の管理における
    tranexamic acid の大規模試験を扱う。
quotedDescription:
  text:
    ja: 'Course Description

      Kyoto University School of Public Health (KUSPH) invites you to the 2019 special short course by
      Professor Ian Roberts, London School of Hygiene & Tropical Medicine. Ian Roberts is Professor of
      Epidemiology & Public Health and co-director of the Clinical Trials Unit at the London School of
      Hygiene & Tropical Medicine. He is the principal investigator of several large international randomised
      controlled trials. His current focus is the conduct of large scale trials of tranexamic acid in
      the management of acute severe bleeding.

       

      This course is sponsored by the Kyoto University Clinical Biostatistics Course.'
