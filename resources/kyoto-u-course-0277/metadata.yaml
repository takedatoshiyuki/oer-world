name:
  ja: 春秋講義「なつかしさの心理学－こころの時間旅行－」
description:
  ja: この講義は、ヒトの脳を手がかりに、目に見えない「こころ」をどう捉えるかを扱う。あわせて、「なつかしさ」を心理学の観点から考える内容である。2020年度秋季の春秋講義として、オンデマンド配信で実施された。
quotedDescription:
  text:
    ja: '春秋講義は、京都大学における学術研究活動の中で培われてきた知的資源について、広く学内外の人々と共有を図るため、1988（昭和63）年秋から開講している公開講座です。年に2回、春と秋にテーマをもうけ講義を行います。

      令和2年度秋季講義は、新型コロナウイルス感染拡大防止のため、オンデマンド配信で「こころのカタチ」をテーマに開催します。

      テーマ：こころのカタチ

      確かにあるのに目に見ることが出来ない「こころ」。わたしたちの行動や思考はこの見えない「こころ」に大きな影響を受けています。「こころ」はどういうもので、どこにあるのでしょうか？「こころ」を形にすることは出来るのでしょうか？今回の講義では、ヒトの脳からこの見えない「こころ」の問題を考えてみたいと思います。'
  source: https://ocw.kyoto-u.ac.jp/course/277/
