name:
  ja: 資源植物環境学
description:
  ja: 植物の光合成を中心に、光化学反応と炭酸固定反応の生理・生化学を扱う。あわせて、高温や乾燥環境に適応した光合成様式の違い、代謝と結びついた組織・細胞構造、環境変化の感知と防御・適応の分子機構を取り上げる。公開教材には、C3/C4光合成、CO2濃縮機構、CAM型光合成、光環境、光阻害などの講義ノートと試験問題が含まれる。
quotedDescription:
  text:
    ja: 植物を特徴づける機能として光合成があげられます。光合成は地球の物質循環を規定する因子であり、光合成効率の最適化や向上が生命科学の重要課題の一つとされています。本授業では、光合成の光化学反応と炭酸固定反応に関する生理学、生化学を詳しく講述します。さらに、高温や乾燥気候に適応進化した光合成様式の多様性を学ぶとともに、その代謝機能と密接に関連した組織・細胞構造の分化についても紹介します・また、移動できない植物が環境の変化を敏感に感知し、防御や適応を行う分子機構についても講述します。この授業から植物の生産性や生存能力の向上を目指した研究に興味をもっていただければ幸いです。
  source: https://ocw.nagoya-u.jp/courses/0033-%E8%B3%87%E6%BA%90%E6%A4%8D%E7%89%A9%E7%92%B0%E5%A2%83%E5%AD%A6-2005/
