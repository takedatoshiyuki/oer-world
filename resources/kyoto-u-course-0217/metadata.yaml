  ja: 2012年度 京都大学新任教員教育セミナー
description:
  ja: 京都大学の新任教員向けセミナーで、大学教育の動向や京都大学の方針を起点に、学習実態、教育的取組、全学共通教育、国際教育、少人数担任制度、教育支援資源までを扱う。後半では「私の授業」を通じて授業実践にも触れる構成になっている。
