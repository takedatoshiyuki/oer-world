  text:
    ja: '1 趣旨説明：高等教育研究開発推進センター長　大塚 雄作

      2 セッション1

      ミニ講義１：「現在の大学教育の動向と京都大学のポリシー」

      教育・学生担当理事　淡路 敏之

      3 セッション２

      ミニ講義２：「京大生の学習の実態」

      高等教育開発推進センター准教授　溝上 慎一

      セッション３

      ミニ講義３：「京大の教育的取組」

      4 全学共通教育（ポケゼミ）

      少人数教育部会部会長　吉田 純

      5 「京都大学の国際教育」

      国際交流推進機構　渡部 由紀

      6 「理学部の少人数担任制度」

      理学部少人数担任委員会委員長　福田 洋一

