name:
  ja: 第60回玉城嘉十郎教授記念公開学術講演会
description:
  ja: 京都大学理学研究科が開く第60回の公開学術講演会で、玉城嘉十郎先生を記念する年次講演会として実施される。数値天気予報を軸に、予測可能性や不確実性、データ同化、古気候再現、気候予測までを2件の講演で扱う。
quotedDescription:
  text:
    ja: '玉城教授記念公開学術講演会について

      玉城嘉十郎先生は京都大学理学部において理論物理学を講じられ、在職中53歳の若さでご他界されましたが、ご他界後30年に当たり、先生のご意志に基づいて、ご遺族より奨学のために多額のご寄付を頂き、先生を記念して毎年公開の学術講演会を開くことにいたしました。第１回は1969年秋、以後52年、回を重ねること今回で60回に達しました。テーマは必ずしも既存の専門にとらわれず、明日の学問への展望をひらくものをと心がけて選ばれています。

      この玉城記念講演会は、専門の研究者だけでなく学生諸君の参加も多く、またもとより公開でありますので、少数ながら熱心な一般聴衆の方々にも好評を博しております。

      「不確実性を伴う数値天気予報と気候予測」

      余田 成男

      国際高等教育院　副教育院長/特定教授、京都大学名誉教授

      数値天気予報の歴史と予測可能性問題、および気候予測の不確実性との異同について講演する。過去約70年にわたる計算機・計算科学の発展史を概観し、それと相俟った大気変動の予測可能性に関する研究の進展を講演者自身の寄与も含めて紹介する。また、カオス解析手法の数値天気予報への実装としてアンサンブル予報が導入されてきた経緯や、予報誤差成長の時空間変動情報の活用例を紹介する。そして、古気候再現および未来気候予測における不確実性の問題を数値天気予報と対比しつつ考察する。科研費新学術領域「太陽地球圏環境予測」で実施した完新世中期および最終氷期最大期の古気候再現シミュレーションを実例として、太陽軌道要素変動（ミランコビッチ・サイクル）による地表気候変化が成層圏オゾン光化学反応過程の扱い方に依存することを示し、その適切な実装の必要性を指摘する。また、気候予測におけるアンサンブル手法の活用事例についても紹介する。

      「数値天気予報の要：データ同化とその展望」

      三好 建正

      理化学研究所　主任研究員/チームリーダー、京都大学大学院理学研究科連携教授

      数値天気予報は、コンピュータによる大気のシミュレーションと、リアルタイムの実測データを組み合わせて行う。ここで要となるのが「データ同化」である。力学系理論と統計数理に基づき、シミュレーションと実データを結び、サイバー世界と現実世界を同期する。数値天気予報はコンピュータ・計測センサ・衛星・情報通信など、様々な技術の統合の成果だ。「京」「富岳」の突出した計算能力と新型センサによる桁違いのデータを統合する「ビッグデータ同化」の技術革新により、ゲリラ豪雨予測手法を創生、2020年にリアルタイム予報の実証実験を達成した。データ同化は気象を超え、広くシミュレーションとデータを融合し、サイバー世界の中で予測可能性シナリオを比較検討して、望む未来を導く。サイバーと現実が高度に融合した超スマート社会Society
      5.0の要となる。未来の人材に向け、MACS教育プログラムでの取り組みも始まっている。'
