    ja: 日本の近現代史を「経済」という視点から描きなおす。現代日本経済史Ⅰでは、日露戦争前から始まり、第一次大戦を経て、第二次大戦前までの歴史を扱 う。一国の経済活動とその状態は、そのときどきの社会情勢を大きく動かし、社会制度や政治をも変化させる大きな要因となる。日本の近現代史における、経済
