name:
  ja: Advanced Studies on Peace and Security II
description:
  ja: 国連大学本部で行われる共同大学院講座の3分野から1つを選んで参加する形式の講義で、平和と紛争研究、人権、開発研究を扱う。各分野は約15回の講義で構成され、専門家の講義に加えて、実務家や他大学の学生との議論を含む。公開動画は授業の一部を収録したものです。
quotedDescription:
  text:
    ja: 'This course will give students the chance to participate in one of three courses of the United
      Nations University (UNU) Joint Graduate School Seminar held at the UNU headquarter in Tokyo. The
      three courses in (a) Peace and Conflict Studies, (b) Human Rights, and (c) Development Studies consist
      of a series of about 15 lectures by reknown experts in their specific field, and give students the
      chance to discuss with practionioers and fellow students from other participating universities.

      このコースでは、学生が国連大学本部で開かれる共同大学院講座の３コース（１．平和と紛争研究、２．人権、３．開発研究）の中から１コースを選択して参加するものである。 それぞれのコースは当該分野の著名な専門家による約１５回の講義で構成され、実務家や様々な大学からの学生と共に議論を行う。

      ※Video is partial recording of lecture.

      ※この動画は授業の一部を公開しています。'
