    ja: ブルーノ・ヴィアーナ博士はフランス国立科学研究センター局長であり、ピエール・マリー・キュリー大学パリ高等化学研究所で指導しておられます。専門はレーザー、シンチレータ、蛍光体を含むフォトニクス用の光学材料の研究。最近では、バイオイメージングのための長残光蛍光体の応用に取り組み活躍しておられます。
