name:
  ja: 第95回 京都大学丸の内セミナー「ゲリラ豪雨の早期探知と危険性予測」
description:
  ja: 本講義は、ゲリラ豪雨による災害の事例を踏まえ、積乱雲の発達過程と気象レーダによる早期探知の仕組みを扱う。上空で見える降水粒子の段階を手がかりに、短時間豪雨が地上にもたらされる前の兆候や危険性の予測について述べる。あわせて、気球や各種レーダを用いた積乱雲内部の観測研究と、警戒ランク判定システムの開発にも触れる。
quotedDescription:
  text:
    ja: '■ゲリラ豪雨災害とは？

      　２００８年は、７月２８日に神戸の都賀川、そして８月５日には東京雑司ヶ谷で、ゲリラ豪雨による悲惨な災害が起こりました。都賀川では川辺の親水空間を楽しんでいた約５０名が突然の出水によって流され児童ら５名が亡くなりました。一方の雑司ヶ谷では、幹線下水道の強度補強の工事中に急激な増水により作業員６名が流され、５名が亡くなりました。

      ゲリラ豪雨の発生も含めて、ある意味、都市故の災害であったと言えるかも知れません。そして、５分、１０分でも早い避難情報がどれほど重要かを防災関係者に愕然と認識させた災害でありました。

      ■ゲリラ豪雨のタマゴとその早期探知、危険性予測

      　積乱雲ができるとき、まず、湿った空気が上昇して雲粒になります。さらに上昇しますと雲粒自体が集まって遥かに大きなミリ単位の粒である雨粒や氷粒（あられ、雪や雹など）といった降水粒子が数キロの高度で形成され始め、その段階になって初めて気象レーダで探知されます。この、上空でレーダ探知されだした降水粒子を「ゲリラ豪雨のタマゴ」と私たちは呼んでいます。タマゴが探知されだしてからしばらくはさらに多くの降水粒子がどんどん上空で急激に蓄積されてゆき、上昇気流で支えきれなくなって５～１０分後に上空の冷たい空気とともにドサーと落ちてきます。

      　私たちは、通常観測の気象レーダにより上空で「ゲリラ豪雨のタマゴ」探知されていたことを明らかにしました。

      　さらに、多数の事例を用いて，積乱雲が強化される際には，地上に豪雨がもたらされるより２０～３０分前に「ゲリラ豪雨のタマゴ」が上空で出現すること，５０ｍｍ以上の短時間豪雨がもたらされる場合はタマゴの段階からコマを回転させたような渦がほぼ確実に上空で確認されることを，明らかにしました。その後、国土交通省は私たちと共同して，「危険な短時間豪雨が来るぞ」という「ゲリラ豪雨の早期探知・危険性予測」の現業化を進め，大阪・神戸・京都を含む近畿地域において，豪雨警戒ランクを3段階で判定する手法を開発し，Web表示するシステムを構築しました。現在、気象庁や近畿地方の地方自治体を対象に試験配信が継続されています。

      ■ビデオカメラと様々な気象レーダを用いて積乱雲内部を探る

      　何分後にどれくらいの短時間豪雨がもたらされるかを予測できるようにするためには、そのタマゴからどのように積乱雲が発達するかを知ることがとても大切です。そのために私たちは、モクモクと発達してゆく積乱雲内部の様子を、ビデオカメラなど入れた箱（ゾンデとよばれる）をぶら下げた気球と様々な気象レーダ（降水レーダーや雲レーダー）によって同時観観する基礎研究を、いくつかの大学・研究機関の研究者・学生の皆さんと世界に先駆けて２００７年から沖縄で継続しています。卒業した学生さんはすでに百数十名になります。最新の現業用気象レーダは豪雨の強さ（降雨強度）だけでなく、上空に浮いている降水粒子があられか、雹か、雪かなどといった種類をも推測できます。一方では積乱雲の中に入ったビデオカメラからは本当にそのような種類のものがそこにどれくらいあるのかを確認できます。雲粒から発達してどういった種類の降水粒子が順次できているかは、積乱雲がこれからまだ発達するのか、衰弱するのかを予測するのに大切な情報になります。

      この内容は「NHKそなえる防災」にも公開中

