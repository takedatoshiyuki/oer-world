  ja: Topics in Mathematics II 数学特論 II
description:
  ja: 現代数学に関する高度の知識を扱う講義で、解析・代数・幾何などの分野から担当教員が選んだ題目を学ぶ。国際基督教大学で2013年に開講され、鈴木寛名誉教授が担当し、日本語で行われる。
quotedDescription:
  text:
    ja: 'Aims to provide advanced knowledge of modern mathematics. The topics are selected by the instructor
      among various fields of analysis, algebra, geometry, etc. Two periods of lecture weekly.

      数学特論 I, II, III, IV：現代数学に関する高度の知識を学ぶ。講義の題目は解析，代数，幾何などの分野のうちから，そのつど担当教員によって選ばれる。毎週講義2時限。

      Contents of Lectures

      11Lectures / 11 Videos'
