name:
  ja: 医師は診察中に何をしているのか？「医師アタマをのぞいてみる」
description:
  ja: 医師が診察中に行う思考の流れを、患者との会話や身体診察で得た情報を手がかりにたどる内容である。診察で集めた情報をもとに、患者の問題をどう整理し解決へつなげるかを扱う。
quotedDescription:
  text:
    ja: みなさん、医師はどんなことを「アタマの中」で考えて、患者さんを診察していると思いますか?目の前の患者さんにピッタリ当てはまる病名を探すための、特殊な推理能力でも持っているのでしょうか?残念ながら、医師は特殊な力を持っている訳ではありません。実は、患者さんとの会話や体の診察から得た情報を基に、科学の他の領域でも利用されているある思考法を用いて、患者さんの問題を解決するお手伝いをしているのです。
  source: https://ocw.nagoya-u.jp/courses/0291-%E5%8C%BB%E5%B8%AB%E3%81%AF%E8%A8%BA%E5%AF%9F%E4%B8%AD%E3%81%AB%E4%BD%95%E3%82%92%E3%81%97%E3%81%A6%E3%81%84%E3%82%8B%E3%81%AE%E3%81%8B%EF%BC%9F%E3%80%8C%E5%8C%BB%E5%B8%AB%E3%82%A2%E3%82%BF%E3%83%9E%E3%82%92%E3%81%AE%E3%81%9E%E3%81%84%E3%81%A6%E3%81%BF%E3%82%8B%E3%80%8D-2010/
