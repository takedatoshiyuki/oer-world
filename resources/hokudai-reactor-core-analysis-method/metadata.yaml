description:
  ja: 原子炉炉心解析に関するオンラインセミナーの講義資料を集めた教材で、中性子輸送理論から拡散方程式、キャラクタリスティクス法、近代ノード法、均質化、燃焼、原子炉動特性、燃料配置最適化までを扱う。講義ごとに、炉心解析で用いる決定論的手法や関連計算法の基礎を順に示す構成である。
quotedDescription:
  text:
    ja: '■講義内容

      原子炉炉心解析手法オンラインセミナーの教材は全てCC BY-NCのライセンスで公開しています。

      講義１：原子炉炉心解析手法オンラインセミナー 中性子輸送理論の概要 ～決定論的手法～

      講義２：原子炉炉心解析手法オンラインセミナー 拡散方程式の数値解法の基礎

      講義３：原子炉炉心解析手法オンラインセミナー キャラクタリスティクス法（1/2）

      講義４：原子炉炉心解析手法オンラインセミナー キャラクタリスティクス法（2/2）

      講義５：原子炉炉心解析手法オンラインセミナー 実効断面積と共鳴計算手法

      講義６：原子炉炉心解析手法オンラインセミナー 中性子減速理論と超多群計算

      　　　　原子炉炉心解析手法オンラインセミナー 中性子減速理論と超多群計算 ～超多群スペクトル計算に関する補足～

      講義７：原子炉炉心解析手法オンラインセミナー 近代ノード法（1/2）

      講義８：原子炉炉心解析手法オンラインセミナー 近代ノード法（2/2）

      講義９：原子炉炉心解析手法オンラインセミナー 均質化誤差と均質化法 ～不連続因子、SPH法など～

      講義10：原子炉炉心解析手法オンラインセミナー 燃料棒出力再構成法

      講義11：原子炉炉心解析手法オンラインセミナー 燃焼の基礎理論（1/2）

      講義12：原子炉炉心解析手法オンラインセミナー 燃焼の基礎理論（2/2）

      講義13：原子炉炉心解析手法オンラインセミナー 空間依存の原子炉動特性（1/2）

      講義14：原子炉炉心解析手法オンラインセミナー 空間依存の原子炉動特性（2/2）

      講義15：原子炉炉心解析手法オンラインセミナー 動力炉における燃料配置の最適化（Loading Pattern Optimization for Commercial Reactors）

      ■講義資料

      講義１：中性子輸送理論の概要 ～決定論的手法～

      講義２：拡散方程式の数値解法の基礎

      講義３／講義４：キャラクタリスティクス法

