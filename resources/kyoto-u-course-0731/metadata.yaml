name:
  ja: 民法第二部（物権・担保物権）
description:
  ja: 民法第2編の物権法を中心に、所有権、不動産登記、動産の所有権移転、即時取得、占有などの制度を順に扱う講義である。あわせて、担保物権を含む民法の物権編の基本的な考え方と、適用をめぐる判例・学説の議論を検討する。
quotedDescription:
  text:
    ja: '授業の特色

      この講義は民法第２編の物権法の諸制度を概説し、規律の適用をめぐる判例・学説の議論を検討する。

      授業の紹介

      民法の物権編は有体物を中心とする財貨の価値の帰属とその変動に関する規定を中心として規律を設けており、契約による財貨移転の基礎となっている。本講義では、物権に特有の制度や考え方の基本を十分に身につけていただくことを目標とする。講義では、基本設例を示して、受講生の理解を容易にする。'
