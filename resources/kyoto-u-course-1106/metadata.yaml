description:
  ja: 多細胞生物の器官の形が機能とどう関わるかを題材に、形態形成における細胞の力の働きを扱う。あわせて、多細胞力学を基盤とした計算機シミュレーションによる解析の概要、現状、課題を取り上げる。
quotedDescription:
  text:
    ja: 多細胞生物の器官の形は、その機能発現と深く関わっており、その形の成り立ち（形態形成）には、個々の細胞が生み出す力が重要な働きをしています。近年、形態形成を多細胞の力学をもとに、計算機を用いたシミュレーションで解析できるようになってきました。多細胞力学シミュレーションの概要、現状や課題について紹介します。
