description:
  ja: 京都大学学術情報メディアセンターの月例セミナーとして行われた講義の教材である。公開資料は2件あり、プロバイダ側のセキュリティ対策と大学におけるセキュリティ対策をそれぞれ扱う。
quotedDescription:
  text:
    ja: 京都大学学術情報メディアセンターでは，月に一度，各分野でご活躍の講師をお招きし，それぞれの研究開発活動の内容や現在抱えている課題についてご紹介いただき，参加者を含めて広く議論を行う機会として，月例セミナーを開催しております．10月28日の学術情報メディアセンターセミナーでは，「セキュリティ対策」をテーマにNTTコミュニケーションズの宮川晋氏と立命館大学の上原哲太郎氏をお招きし，ご講演いただきます．
