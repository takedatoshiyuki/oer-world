name:
  ja: 北海道大学公開講座 アジアのなかの日本・北海道 第4回 環境汚染問題から見たアジアの中の日本－幾つかの事例から学ぶ－（2011）
description:
  ja: アジアで起こる環境汚染を複数の事例から取り上げ、その違いを通して各国の特徴を見ていく。そこから、環境汚染問題の観点で日本をアジアの中に位置づけて考える内容である。
quotedDescription:
  text:
    ja: アジアには先進国もあれば、発展途上国、極貧と呼ばれる国も存在します。また中国やインドのように巨大な人口を抱える国もあれば、モンゴルのように広大な国土にわずかな人口しか持たない国もあります。アジアは多様な国の集合だと言えるでしょう。そこで起こっている環境汚染も様々であり、汚染を調べることでその国の特徴が見えることがあります。幾つかの例を示しながら、環境汚染問題からみたアジアの中の日本について考えましょう。
