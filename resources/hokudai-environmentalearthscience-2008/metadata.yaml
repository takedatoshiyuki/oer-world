  ja: 地球環境の現状を踏まえ、地球システムのしくみを理解したうえで将来を予測する内容を扱う。大気・海洋・陸域の物理機構と生態系の相互作用に加え、それらの間に介在する化学過程にも注目する。
quotedDescription:
  text:
    ja: 破壊されつつある地球環境の現状を知り，地球システムが持つしくみを理解することに基づいて，地球環境の将来を予測する。特に大気海洋陸域の物理機構と生態系との相互作用，および双方の間に介在する化学過程に注目する。
