name:
  ja: 学術フロンティア講義（30年後の世界へーー変わる教養、変える教養）
description:
  ja: 東京大学の教養学部が担う教養教育を手がかりに、「教養」とは何か、なぜ重視されるのかを考える講義である。社会の変化やVUCA時代の状況を踏まえ、教養をどのように捉え直し、変えていくかを受講者とともに検討する。30年後の世界を見据え、新しい時代の教養を考える場として構成されている。
quotedDescription:
  text:
    ja: '2024年、東京⼤学教養学部は、第⼀⾼等学校の前⾝である東京英語学校の設⽴からちょうど150年を迎えた。1949年に新制東京⼤学のもとで教養学部が設置される前から、「教養」ということばは、⼀⾼に象徴される知的エリートへのあこがれのみならず、つねに批判を伴いながら、⽇本の社会に広く根づき、戦後になると、各⼤学に教養課程が設置され、⽇本の⾼等教育の⾵景を⻑らくかたどってきた。1990年代以降、その⾵景は⼤きく変わり、もはや⼤学における教養教育の共通像は消え去り、⼀⽅で、教養の学問を独⾃の思想で掲げる⼤学や学部が個性を放っている。東京⼤学もその⼀つだ。学部教育の最初の2年間をすべての学⽣が教養学部で過ごすという東京⼤学のモデルは世界的にもユニークであり、したがって、教養教育は東京⼤学が独⾃の価値をグローバルにアピールできる最⼤の特徴の⼀つとなっている。

      しかし、教養とは結局、何を指すのだろうか。そして、なぜ東京⼤学では教養をかくも重視するのだろうか。東京⼤学は、教養の理想を⾼く掲げることによって、どのように広く社会の発展に寄与しようとしているのだろうか。とりわけ、東⼤の中で教養の学問を専ら営む教養学部は、いかにして社会からの付託に応えようとしているのだろうか。

      複雑さと不安定さが増す今⽇の⼈類社会「VUCA」の時代において、学問の貢献は益々重要になってきている。そのことは同時に、教養に対する社会からの呼び声が⾼まっていることを意味している。教養はいま、社会を変⾰するための智慧として希求されているのだ。産業界でも教養とリベラルアーツに対する渇望が⽇増しに⾼まっている。では、わたしたちが教養学部で⽇々⾏っている学問は、こうした社会からの求めに答え得ているだろうか。社会的有⽤性の追求は学問の独⽴を損なうという意⾒もあるだろう。もし仮にそうであるとしても、敢えて無⽤性に⽢んじること⾃体の意義と価値を主張する必要から逃れることはもはや不可能だろう。

      教養概念の⼀つの解釈は「リベラルアーツ」である。中世ヨーロッパの「⾃由七科」までもどらずとも、アメリカのリベラルアーツ・カレッジのように、それはつとに確固たる地位を確⽴している。東アジア諸⼤学においても、21世紀に⼊って以来リベラルアーツ学部が新たに設置され、その多くが⼤いに活況を呈している。教養には社会的効⽤のポテンシャルが多分に孕まれているだけではなく、その価値は広く社会に認知されている。これは揺るぎない現実だ。

      にもかかわらず、⼈々が求める教養には無数に異なったイメージがある。それはまるで、⼀⼈ひとりの⼈がみなそれぞれに異なった⼈⽣の道を歩くことを望んでいるのと同じだ。教養とは、⼈がより⼈らしく変化していくプロセスそのものであり、そうした変化をよりよく促すための智慧の技法なのだ。社会が⼈によって成り⽴っているかぎり、社会をよりよい⽅向に変えていくには、よりよき教養が不可⽋である。そしてそうであるなら、あるべき教養の姿はまた、社会の変化に応じて⾃ら変わることを求めるはずだ。教養を変えていくのもまた教養のなせるわざであろうし、そうでなければ、わたしたちは⾃らの⼒で⾃らを変化させていくことを成しえないだろう。

      「変わる教養、変える教養」。わたしたちは、今⽇の時代と社会条件の下で、いかなる教養を望むべきだろうか。そのために、いまある教養をどのように変えていくべきだろうか。この講義では、こうした問いを受講者の皆さんと共に考え抜きたい。それは、未来に向かってどのような社会を望み、いまある社会をどのように変えていくべきかを考えることとほぼ同義である。

      この講義を、「30年後の世界」に向かって、新しい時代の、新しい⼈の教養を共に鍛える場にしたいと願う。'
