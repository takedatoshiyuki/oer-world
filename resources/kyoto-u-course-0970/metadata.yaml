description:
  ja: 『東南アジア研究』と『アジア経済』への投稿をテーマに、査読付きジャーナルへの論文投稿の流れを扱うセミナーである。編集委員や編集部員、元編集委員が、投稿時の注意点や査読プロセス、経験談を通して内容を示す。
quotedDescription:
  text:
    ja: '京都大学東南アジア地域研究研究所、日本貿易振興機構アジア経済研究所の共催による査読付きジャーナル 論文投稿セミナー『東南アジア研究』と 『アジア経済』への投稿案内

      両誌の編集委員、編集部員、元編集委員が、投稿時の注意点や査読プロセスの紹介、投稿者・査読者としての経験談等を通し、査読誌への掲載のコツを伝授します。'
