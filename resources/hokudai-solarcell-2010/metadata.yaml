name:
  ja: 北海道大学プロフェッサー・ビジット 見えない光、赤外線を利用する太陽電池(2010)
description:
  ja: 地表で観測される太陽光に含まれる赤外線に着目し、それを電気エネルギーへ変換する太陽電池の研究を扱う講義である。目に見えない赤外線を利用する新しい太陽電池について、その研究内容を解説する。
quotedDescription:
  text:
    ja: '赤外線は、地表で観測される太陽光の中に40％以上も含まれていますが、エネルギーが低いため、効率よく電気エネルギーに変換することができませんでした。本講義では、目に見えない赤外線を有効にエネルギー変換できる新しい太陽電池の研究について平易に解説します。

      関連情報

