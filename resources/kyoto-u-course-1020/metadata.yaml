description:
  ja: この教材は、実効性が確認された保健介入を現場に導入する実装研究と、そのための科学を扱う。公共・国際保健の文脈で、介入を実際に適用して健康改善や命を救うことに関わる課題を取り上げる。2018年の会議として、implementation
    research と health for all への理解を深めることをねらう。
quotedDescription:
  text:
    ja: '“Implementation Research and Science for Health for all”

      A key challenge faced by the Public/Global health community is how to get proven effective interventions
      off the shelves and implement them in the real world to improve health and save lives. The 2018
      KGC is devoted to raising awareness and understanding of implementation research and science for
      health for all.'
