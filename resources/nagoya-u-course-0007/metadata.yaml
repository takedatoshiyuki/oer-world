name:
  ja: 基礎セミナー図書館情報リテラシー：図書館と情報を使いこなす
description:
  ja: 図書館情報学の立場から、文献や情報を探す方法、図書館の使い方、情報のまとめ方と発表のしかたを扱う講義である。公開教材には、講義ノートのほか、プレゼンテーション課題の例が含まれる。
quotedDescription:
  text:
    ja: 大学生となって、身につけるべき情報リテラシーには多くのものがあります。名古屋大学では「情報リテラシー」という科目を文系・理系それぞれに開講しています。この基礎セミナー A では数ある情報リテラシーの中でも、図書館情報学のアプローチから文献と情報の探索、図書館の利用方法、情報のまとめ方とプレゼンテーションに重点をおきます。また少人数かつ文理融合という特性を存分に生かした内容とします。
  source: https://ocw.nagoya-u.jp/courses/0007-%E5%9F%BA%E7%A4%8E%E3%82%BB%E3%83%9F%E3%83%8A%E3%83%BC%E5%9B%B3%E6%9B%B8%E9%A4%A8%E6%83%85%E5%A0%B1%E3%83%AA%E3%83%86%E3%83%A9%E3%82%B7%E3%83%BC%EF%BC%9A%E5%9B%B3%E6%9B%B8%E9%A4%A8%E3%81%A8%E6%83%85%E5%A0%B1%E3%82%92%E4%BD%BF%E3%81%84%E3%81%93%E3%81%AA%E3%81%99-2005/
