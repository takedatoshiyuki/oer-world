name:
  ja: 京都大学 数学・数理科学5研究拠点合同市民講演会「故きを温ねて新しきを知る」
description:
  ja: 数学・数理科学の5研究機関で行われている共同利用・共同研究事業をもとに、社会と数学の関係とその重要性を扱う市民向けの合同講演会である。オンラインと会場のハイブリッド形式で開催され、数学・数理科学の最先端研究の一端を京都から紹介する。
quotedDescription:
  text:
    ja: '数学・数理科学の５研究機関において、それぞれで行われている共同利用・共同研究事業の内容を基に、社会と数学との係わり合い及びその重要性について市民向けの合同講演会を企画いたしました。 昨年は福岡（九州大学）でオンラインにより開催してまいりましたが、今回は新型コロナウイルスの感染拡大防止のため、「オンライン」と「会場」とのハイブリット形式で「故きを温ねて新しきを知る」をテーマに数学・数理科学の最先端の研究の一端を京都からご紹介したいと思っております。

      詳細 https://cscenter.co.jp/kyoten2021/'
