quotedDescription:
  text:
    ja: 複素関数は，自然科学の様々な箇所に現れ，基本的役割を果たすと共に幅広い応用を持っている。特に，その微分積分学は，実数のそれと全く異なった美しく統一的な世界を形作っている。本科目はこうした複素関数の微分積分学の基礎，特に複素解析関数（正則関数ともよばれる）の基本的性質を学び，応用上重要な，その様々な取り扱いに習熟することを目的とする。
      特に，ベキ級数および複素積分の取り扱いを重視する。
