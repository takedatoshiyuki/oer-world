name:
  ja: 【オンライン公開講義】“立ち止まって、考える” – 連続講義（3）倫理学　パンデミックの倫理学
description:
  ja: 新型コロナウイルスのパンデミックを対象に、医療や公衆衛生の問題を倫理学の視点から考える講義である。科学技術だけでは解決できない問題としてパンデミックを捉え、人文社会科学の知も踏まえて検討する。京都大学によるオンライン公開講義で、連続講義の第3回にあたる。
quotedDescription:
  text:
    ja: '新型コロナウイルスのパンデミックは現代社会に未曾有の危機をもたらしている。それは単に医学を始めとする科学技術のみによって解決できる問題ではなく、哲学・倫理学を始めとした人文社会科学の知も大いに必要とされている。本講義では、医療や公衆衛生の問題を中心に、パンデミックを倫理学の視点から一緒に考えていきたい。

      オリジナルのコンテンツは、人社未来形発信ユニットのウェブサイトでご覧いただけます。

      https://ukihss.cpier.kyoto-u.ac.jp/1669/'
