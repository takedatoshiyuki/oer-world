name:
  ja: 学部専門教育 臨床心理学（2006）
description:
  ja: 教育と臨床心理学、教育と精神医学の接点にある臨床教育学を扱い、精神医学全般の病理をライフサイクルの視点から概観する。講義では、精神医学の歴史や面接方法、診断学総論に加え、乳幼児期から老年期までの精神発達と精神障害、治療学を取り上げる。
quotedDescription:
  text:
    ja: '【概要】

      　臨床教育学を、教育と臨床心理学、教育と精神医学の接点領域から生まれる新しい思考と実践に資する領域と想定している。授業では出来るだけ現代の病理に沿りライフサイクル的視点から、精神医学全般の病理の概観を学ぶことを目標にする。

      【スケジュール】

      1.精神医学の歴史と関連領域

      2.面接方法

      3.診断学総論

      4.乳幼児の精神発達と精神障害

      5.小児の精神発達と精神障害

      6.思春期・青年期の心性

      7.成人の精神発達と精神障害

      8.初老期・老年期の精神発達と精神障害

      9.治療学

      10.その他'
  source: https://ocw.hokudai.ac.jp/lecture/clinicalpsychology-2006
