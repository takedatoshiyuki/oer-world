description:
  ja: 英語で発表を行いながら、プレゼンテーション、英語でのコミュニケーション、PowerPoint作成に必要なデザイン面を扱う演習科目である。受講生は修士論文、博士論文、課題研究などの実験内容について、前期・後期にそれぞれ2回ずつ発表する。各発表は12分で、続いて約10分の質疑応答を行い、担当教員やNative
