name:
  ja: 人間環境システム学
description:
  ja: 自然災害と環境問題を、人間社会と地球環境の接点にある現象として扱う講義である。災害を生む自然現象の規模・頻度・地域差を見たうえで、環境問題の実態と、人間社会がそれらとどう向きあうかを地理学的視点から考察する。あわせて、世界各地でのフィールドワークの実態も紹介する。
quotedDescription:
  text:
    ja: 自然災害や環境問題は、人間社会と地球環境の接点領域において生じる主要現象である.巨大化する自然災害は、人類社会の持続的発展にとって大きな脅威となりつつある.自然災害を生起させる様々な自然現象を対象として、それらの発生規模-頻度分布特性や地域性を解明するとともに、人間社会の変化とともに深刻化する環境問題の実態を理解することを目標とする.本講義では、世界各地でのフィールドワークの実態を紹介する。人間社会を自然環境システムの一部に位置付けることを通じて、人間社会は自然災害や環境問題といかに向きあっていくべきか、地理学的視点から論考する。
