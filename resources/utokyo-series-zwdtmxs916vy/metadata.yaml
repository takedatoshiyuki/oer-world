name:
  ja: ジェンダー不平等を考える（学術フロンティア講義）
description:
  ja: 現代社会の課題を、ジェンダーや多様性の視点から見直しながら、日本のジェンダー平等の現状を扱う講義である。各講師の専門分野に基づく話題を順に学び、最後にグループディスカッションと発表を行う構成になっている。
quotedDescription:
  text:
    ja: 現代社会では、想定外の政治的課題や事象が次々と起こっています。その際、マジョリティ側とは異なる視点、ジェンダーや多様性の視点を導入することで、複雑な事象や課題を別の視点から捉え、分析することが可能になります。政府が設定した「202030年目標」は未達成に終わりましたが、新たに、2020年代の可能な限り早期に社会のあらゆる分野において指導的地位に占める女性比率が少なくとも30％程度になるよう目標を設定しています。本講義では、ジェンダー平等後進国の日本の現状について、学生が認識を高め、ジェンダーをめぐる多様な問題について自ら考える機会を持つことを目的としています。初回はイントロダクション、2回目から11回目までは各講師の専門領域の視点や切り口からジェンダー不平等に関連したトピックについて講義を行います。第12回は講義を踏まえてグループに分かれてディスカッションを行い、第13回は発表とまとめの回になります。
  source: https://ch.u-tokyo.ac.jp/series/?id=zWdtMxs916vY
