  ja: 日本列島の高山帯に生育する高山植物を例に、その分布がどのような過程で形づくられたかを科学的に考える講義である。生物の分布の背景を通して、生物多様性や自然の見方を考える内容を扱う。
quotedDescription:
  text:
    ja: 人類がアフリカ大陸から全世界に広がったように， 地球上のあらゆる生物（種）は現在の分布を獲得するまでにそれぞれが独自な歴史を経験してきました。 こうした生物の分布が作られた背景を知ると，生物多様性をはじめ，自然に対する新しい見方をできるようになるはずです。
      本講義では，日本列島の高山帯に生育する植物（高山植物）を例に，高山植物の分布が作られたプロセスを科学的に考えてみたいと思います。★高校生と大学生…
