name:
  ja: 財産法の基礎２（Civil Law (Basic) 1）
description:
  ja: この教材は、民法の財産法のうち債権法を扱い、制度の趣旨、内容、機能を整理しながら学ぶ構成になっている。不法行為を中心に、講義資料、参考資料、補足説明、ミニテストとその解説が公開されており、単純な事案の法的分析につなげる内容である。
quotedDescription:
  text:
    ja: '授業の概要

      「財産法の基礎1・2」は、2年次以降の民事法関係科目を履修するうえで必要となる、民法（財産法）の諸制度に関する基礎的・体系的理解を得させるとともに、法的思考力を養成することを目的とする。

      「財産法の基礎2」は、債権法（債権総論・債権各論）を対象とし、諸制度の趣旨・内容・機能につき、確実な基礎的知識を習得させるとともに、単純な事案の法的分析・構成につなげる。'
  source: https://ocw.kyoto-u.ac.jp/course/940/
  note: 京都大学OCW 「授業の概要」より（同サイトの利用条件に基づく転載）
