name:
  ja: 土曜市民セミナー 博物館における映像情報デザイン (2010)
description:
  ja: 博物館において、標本そのものに加えて説明文、写真、映像がどのような働きをするかを扱う。実物展示が難しい対象や、発見時の状況、人の肉声を伝える場面で映像が果たす役割にも触れ、博物館での映像の役割と作り方を考える。
quotedDescription:
  text:
    ja: 博物館には、数多くの標本があります。しかし、それらの標本を見ているだけでは、その価値を知ることは難しく、パネルにある説明文や写真、モニターに映し出される映像など標本を補完するツールのおかげで気づきや標本の見方を知り、理解することができます。特に、自然や産業、文化遺産など実物展示が難しい場合や標本が見つかった当時の状況、人の肉声を紹介するインタビューなどでは映像の持つ特性が発揮されます。今回のセミナーでは、博物館の中での映像とはどのような役割があるのか、どのように作られているのか一緒に考えていきたいと思います。
  source: https://ocw.hokudai.ac.jp/lecture/informationdesign-2010
