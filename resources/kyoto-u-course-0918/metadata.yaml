name:
  ja: 総合博物館 2009年秋季企画展 「学術映像博2009」特集 トークイベント 文化・無意識・コンピュータ映像の創造力
description:
  ja: カルチュラルコンピューティングをめぐって、コンピュータによる山水禅や、空気をよむコンピュータ、インターネット上の文字から俳句を作る事例を取り上げる。さらに、宗教と伝統文化の専門家を交えて、そこから生まれるものについて議論する。
quotedDescription:
  text:
    ja: 'イベント概要

      カルチュラルコンピューティングで、いったい何が生まれてくるのかということを、コンピュータによる山水禅「ZENeticComputer」、空気をよむコンピュータ「i.plot」、インターネットから文字を取って俳句を作る「Hitch
      Haiku」などの事例を紹介し、宗教、伝統文化の専門家と共に、未来に生まれてくるものをディスカッションする。'
