description:
  ja: 日本で進められてきた循環型社会の制度を取り上げ、ペットボトルや家電製品のリサイクルとアジア各国への輸出との関係を考える。あわせて、それらの取り組みが本当に環境に優しい結果につながっているのかを世界の視点から検討する。
quotedDescription:
  text:
    ja: 'ペットボトルや家電製品がリサイクルされアジア各国に輸出されています。日本は世界に先がけ循環型社会という制度を作っているが、本当に環境に優しい結果を生んでいるのか。この問題を世界の視点から考えてみます。

      札幌稲雲高等学校

      2009年10月29日'
