name:
  ja: 物質の神秘 ― その生い立ちから私たちの未来まで（学術俯瞰講義）
description:
  ja: 宇宙創世と元素の誕生から、膨張宇宙の運命や暗黒物質の研究までを視野に入れ、物質の成り立ちを広く扱う講義である。さらに、金属・半導体・高分子の物質科学や、医療技術、自然エネルギーを支える材料の科学にも話題を広げる。複数の教員が最先端分野の観点から、物質に関わる研究の広がりを解説する。
quotedDescription:
  text:
    ja: 'コーディネータ：小島 憲道

      ナビゲータ：永田 敬

      自然界に存在する元素は約90種類存在するが、これらは宇宙の膨張過程および星の中で誕生した。また、人類は、元素の変換から生み出される新しいエネルギーを発見し、約30種類に及ぶ人工元素が合成された。人工元素を含む約100種類の元素をもとに合成された分子は1000万種以上にも及び、現在も新しい化合物が合成されている。

      本講義では、「物質の神秘」を主題テーマとして、宇宙創世と元素の誕生、膨張する宇宙の運命、正体不明の暗黒物質を探る研究、物質の性質を支配する法則とそれを応用した金属、半導体から高分子にわたる物質の科学、新しい医療技術を生み出す物質の科学、自然エネルギーを活用し持続的社会を支える材料の科学などを最先端の分野で活躍している教員が解説する。

      本講義を受講した皆さんは、物質のもつ神秘と無限の可能性に接し、新しい物質観を見出すことであろう。理系学生のみならず多数の文系学生の聴講を期待している。'
