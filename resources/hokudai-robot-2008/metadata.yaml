name:
  ja: サイエンス・カフェ札幌から Pick up! すぐそこのロボット、あなたはどう使う？（2008）
description:
  ja: ロボット技術を手がかりに、身のまわりに入り込む技術の広がりと、その活用のあり方を考える内容である。講義では、研究開発で注目されるテーマを取り上げ、実際の研究成果である「スマートスーツ」の実演も行う。
quotedDescription:
  text:
    ja: 'みなさんはロボットというと、どのようなものをイメージしますか? 実在のロボットを思い浮かべる人、アニメやマンガや映画に登場するものを想像する人……おそらくそのイメージは千差万別でしょう。

      私たちのまわりを見渡すと、実はいたるところにロボットが入り込んでいます。家電製品や自動車にも、ロボットに使われているのと同じ技術が組み込まれたものが少なくありません。さまざまなロボット技術は、これから先、社会のあらゆる分野で私たちの生活や仕事を支えていくことが予想されます。あなたなら、こうした技術をどのように使ってみたいと思いますか?

      今回のサイエンス・カフェでは、ロボット技術の研究開発で今何がホットなテーマになっているのか、実際の研究成果である「スマートスーツ」を会場で実演してもらいながら、お話をうかがいます。専門家と一緒に、「すぐそこ」にロボットがいる未来を考えてみませんか。'
  source: https://ocw.hokudai.ac.jp/lecture/robot-2008
