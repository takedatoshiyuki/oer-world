name:
  ja: 精神医学
description:
  ja: 精神障害を生物・心理・社会の複数の観点から捉え、精神症状の評価や検査、薬物療法、精神療法、成因論といった総論を扱う。さらに、身体的基盤のある障害から心理的側面の強い障害までを、児童期から老年期までの各ライフステージに沿って学ぶ。加えて、司法的側面や研究倫理にも触れる。
quotedDescription:
  text:
    ja: '精神障害の特徴は、中枢神経系高次機能の障害としての生物学的特性を有する点と、個人を取り巻く心理・社会的要素が環境因子としてその病態や臨床に影響する、という点にある。したがって、生物・心理・社会という多面的なとらえ方が、精神障害の理解においては重要である。

      本講義においてもこの点に留意して、精神症状の把握・評価、検査、薬物療法を中心とした身体的治療、精神療法(心理社会的治療)、精神障害の成因論といった総論的内容と、身体により基礎付けられた精神障害から心理的側面の強い精神障害に至るまで、児童期から老年期の各ライフステージを踏まえて、各論的内容について理解を深めて行くことを目標とする。さらに、社会の中における精神障害という観点から、司法的側面や研究における倫理的側面についても言及する。'
