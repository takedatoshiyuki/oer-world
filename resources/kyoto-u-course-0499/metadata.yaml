name:
  ja: 情報探索入門：図書館とインターネット情報の活用, 2007
description:
  ja: 図書館情報学と情報探索の基礎を扱い、図書館の機能、分類、目録情報、参考資料、インターネット情報やデータベースの活用までを資料として示す。あわせて、論文・レポートや卒業論文のための文献調査に必要な情報活用技術を演習を通じて扱う。
quotedDescription:
  text:
    ja: '授業の特色

      情報探索に必要な基礎を、図書館機構長ほか専門分野の異なる教員によるリレー方式の講義と演習で身につける。演習には図書館司書が協力する。

      授業の紹介

      論文・レポートを書くための文献・情報収集、卒業論文作成のための文献調査等に必要な情報活用技術を演習によって習得しながら、図書館情報学、情報探索の概要を学ぶ。'
