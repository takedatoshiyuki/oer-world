quotedDescription:
  text:
    ja: 'This course is designed to build your research ability by providing particularly important methodological
      skills that are often used in modern macroeconomic research. In particular, we shall focus on (1)
      difference equations for describing variables that evolve over time, and (2) dynamic optimization
      methods for describing the optimal allocation over time.

      After this course, students should be able to (1) solve any system of difference equations; (2)
      solve any dynamic optimizing problem using either by Lagrange method or by dynamic programming;
      and (3) read and understand advanced textbooks and professional articles in the field of macroeconomics.'
