name:
  ja: 応用音響学
description:
  ja: 音声分析や音声認識、音声合成、音響信号処理、音声対話システムに関わる基礎知識を扱う講義である。あわせて、スペクトル解析、パターン認識、確率モデル、統計学習、最適解探索といった基本概念とアルゴリズムを取り上げ、これらの技術の土台となる知識の習得を目指す。
quotedDescription:
  text:
    ja: 音声分析、音声符号化、音声認識、音声合成、音響信号処理、音声対話システムなどに関連する基礎知識について講義する。これらの音声・音響技術は、日本が 世界をリードした分野であり、さまざまなキーアイディアが集積されている。応用としては、携帯電話やMDやMP３などの音声音楽情報圧縮技術などは確立し
      ているが、音声認識技術や音声合成システムなどは、まだまだ人間には及ばないものの、高度な情報処理技術である。これらの分野は、スペクトル解析、パター ン認識、確率モデル、統計学習、最適解探策などの基本概念とアルゴリズムの集積である。本講義では、これらの技術の基礎になる知識と概念の習得を目指す。
