name:
  ja: 基礎物理学（物質生命理工学科２クラス）／BASIC PHYSICS
description:
  ja: 高校で学ぶ力学を復習しながら、ベクトルや微分方程式を使って運動の法則を整理する講義資料である。次元解析、保存則、重力や空気抵抗下の運動、振動現象、加速度系での運動を順に扱う。さらに、粒子の回転運動から剛体の運動までを角運動量保存則を手がかりに議論する。
quotedDescription:
  text:
    ja: この講義では，高校時代に学習した力学の内容を復習し，ベクトル，微分方程式により力学の法則の記述し，それから導かれる保存則により物理現象を理解する。始めに次元解析など基本的な事項について講義する。次に運動の法則を説明し，運動方程式から出発し，運動量，エネルギーの保存則について説明し，それを重力・空気抵抗中での粒子の運動や振動現象などに応用する。その後，加速度系における物体の運動について議論する。さらに，粒子の回転運動を角運動量保存則から議論し，それを拡張し剛体の運動を説明する。
