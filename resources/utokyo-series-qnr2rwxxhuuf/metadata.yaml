name:
  ja: 知と幸福（朝日講座「知の冒険—もっともっと考えたい、世界は謎に満ちている」2012年度講義）
description:
  ja: この講義は、文系理系を横断しながら「幸福」という概念を複数の知の領域から考察する。あわせて、不安・リスク・危機管理・希望といった概念との関係にも目を向け、異なる分野の考え方に触れる構成になっている。
quotedDescription:
  text:
    ja: '「幸福」は照れくさい言葉です。テレビドラマでは連呼されても、私たちの日常生活では意外に口にされませんし、ましてや細分化された学問の世界ではなかなか正面から扱うのが難しいようです。しかし、このところ――とりわけ2011年3月以降――メディア等でしきりに取り上げられる「不安」「リスク」「危機管理」「希望」といった概念をつきつめていくと、その根底には私たちが「幸福」なる得体のしれない感覚とどのように付き合うかという問題があることがわかってきます。最近、「幸福」そのものを題材とした研究があらためて増えつつあるのもそのためかもしれません。

      　この授業では文系理系の垣根を越え、「幸福」という概念がさまざまな知のフィールドでどのような意味を持つかについて――ときには批判的な視点をまじえながら――考察します。この講義を通して、ふだん接する機会のあまりない他の分野で、どのようなものの考え方がされているかを体験する機会にもなるかと思います。'
  source: https://ch.u-tokyo.ac.jp/series/?id=QNr2rWxXHUuf
