name:
  ja: 北海道大学教育GP「博物館を舞台とした体験型全人教育の推進」 大学院における高度博物館学教育の実践(2010)
description:
  ja: 日本の博物館と学芸員養成の現状と課題を整理し、大学で行う高度な博物館学教育の目的を論じる講義である。あわせて、当該プログラムの特徴やこれまでの成果と問題点、今後の見通し、学芸員養成への要件を取り上げる。最後に、GP終了後の國學院大学大学院における高度博物館学教育の展望を紹介する。
quotedDescription:
  text:
    ja: 我が国の博物館及び学芸員養成の現状と問題点を明らかにし、大学における博物館学大系に基づく高度博物館学教育の目的についてお話します。また、本プログラムの特徴と、現時点までの成果と問題点、更には今後予想される成果と学芸員養成への期待要件を提言し、ＧＰ終了後の、国学院大学大学院での高度博物館学教育の展望についてご紹介します。
