name:
  ja: 実学 国際貢献論 第1回：日本・モンゴル国際交流で学ぶ真実と親切を真理で学ぶ
description:
  ja: 上智大学が主催する連続講演会「実学 国際貢献論」の第1回で、日本・モンゴルの国際交流を扱う。白鵬翔がユネスコ親善大使としての立場から、国際交流や親善への思いを語る内容である。
quotedDescription:
  text:
    ja: "ユネスコ親善大使(スポーツ・アスリート)が親善にかける意欲 \n 日本・モンゴル国際交流で学ぶ真実と親切を真理で学ぶ \n このたび本学では、『生命の碧い星』実行委員会（委員長：鳩山由紀夫\
      \ 元内閣総理大臣世界平和と地球環境保護の実現、世界各国の青少年の友好関係を築くことを目的とした活動を行う）の協力を得て、「実学 国際貢献論」と題して連続講演会（全11回）を行うこととなりました。\n\
      第１回目は、大相撲春場所で通産２２回目の優勝を果たした横綱白鵬関がやってきます。白鵬関は、ユネスコ親善大使を務めており、国際交流・親善にかける意欲を皆さんに熱く語ってくれます。\n 一人でも多くの方々にご参加いただきますよう、ご案内いたします。"
