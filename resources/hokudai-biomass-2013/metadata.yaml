name:
  ja: 土曜市民セミナー 木質バイオマスの総合利用とその今日的意義（2013）
description:
  ja: 木質バイオマスについて、基本的な性質を整理しながら、エネルギー利用とマテリアル利用の両面からその利活用を扱う講義である。実際の利用状況に加えて、比較的最近の研究事例を示し、今後の可能性と課題まで踏み込む。
quotedDescription:
  text:
    ja: 現在、太陽光や風力、水力、地熱などとならび、再生可能資源の一つとして位置づけられているバイオマス、特に木質バイオマスは、エネルギー利用とマテリアル利用の両側面から、化石代替資源として注目を集めています。本講演では、地球上に豊富に存在し、「カーボンニュートラル」とされる木質バイオマスの基本的な性質を整理し、その利活用の実態や比較的最近の研究事例をご紹介するとともに、今後の可能性と課題をわかりやすく概説します。
