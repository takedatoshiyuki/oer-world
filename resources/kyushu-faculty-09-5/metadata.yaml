quotedDescription:
  text:
    ja: 'この講義は、光と物質との相互作用に主眼をおいた、分光計測のための光学入門です。

      関連授業科目（物理化学II、応用物理学、固体物理学など）で修得した内容を復習しつつ、

      分光計測機器をブラックボックスとせず、必要に応じて改良・開発するための基礎知識、基礎技術について学びます。'
