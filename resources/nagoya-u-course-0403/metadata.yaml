  ja: 複雑系プログラミング特論
description:
  ja: 複雑系研究で扱う代表的なモデルを題材に、Pythonの基礎やデータの可視化、オブジェクト指向的なプログラミングの基礎を順に学ぶ講義である。あわせて、モデル構築から実装、実験、可視化と分析、再検討までの流れに沿った研究手法を実習する。
quotedDescription:
  text:
    ja: '講義とプログラミングの実習を行います。

      複雑系研究の幅広い分野からいくつかの代表的なモデルを題材として取り上げ、プログラミング言語 python の基礎、データの可視化、オブジェクト指向的なプログラミングの基礎等を順次紹介します。

      同時に、モデル構築・実装・実験・可視化と分析・再検討からなる構成論的アプローチに基づく研究手法を実践的に学びます。'
