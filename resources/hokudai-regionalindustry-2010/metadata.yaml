name:
  ja: サイエンス・カフェ札幌から Pick up! 北海道の地域産業を元気にしたい！（2010）
description:
  ja: 北海道の経済状況や少子高齢化による人口減少を背景に、地域産業をどう元気にするかを扱う。須田孝徳の活動を通して、北海道の産業の将来像と大学が地域にどう関わるかを考える。
quotedDescription:
  text:
    ja: 近年、全国的な景気低迷の中、北海道経済も例にもれず厳しい状況の下にあります。また、少子高齢化による生産年齢人口の減少も大きな社会問題となっています。「北海道の産業を元気にするために、一大学人として、一研究者としていったい何ができるのか？」この問いを胸に抱き続け、さまざまな挑戦を続けている須田孝徳さんを、今回のカフェではゲストにお迎えします。須田さんは、北海道に生まれて道内の大学を卒業した後、一度民間企業に就職して関東で働くようになります。しかし、北海道への思いを捨てきれず北海道大学に転職し、現在では一研究者の枠を超えた地域産業活性化のための活動をしておられます。本日は須田さんに、ご自身のこういったさまざまな活動と、その根底にある北海道への想いについて語っていただくことを通じて、北海道の産業の将来像、大学と地域の関係のありかたについて、みなさんと一緒に考えてみたいと思います。
  source: https://ocw.hokudai.ac.jp/lecture/regionalindustry-2010
