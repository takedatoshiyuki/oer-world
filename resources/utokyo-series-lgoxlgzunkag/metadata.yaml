name:
  ja: スペイン語の地理
description:
  ja: 各地で異なるスペイン語のバリエーションを扱い、発音や語形、意味の差に触れる12回シリーズである。前半では地域ごとの様子を概観し、続いてバリエーション研究の考え方を説明し、最後に世界のスペイン語を見渡す共通の概念を扱う。研究グループの調査結果の一部も取り上げる。
quotedDescription:
  text:
    ja: '12回のシリーズで各地のスペイン語のバリエーションについてお話します。スペイン語は世界20カ国で3億5000万人によって話される大言語ですが，そ の地域的な変異は他の諸言語に比べて少ないと言えます。それでも，発音の仕方や単語の形や意味が微妙に異なります。このシリーズではあまり細かい点には立
      ち入らず，各地の特徴のなかでとくに重要だと思われる点だけを説明します。

      シリーズの構成は，1旅先，2言葉を求めて，3言葉の広がり，の3本立てです。1で各地のスペイン語の様子を簡単に紹介し，２でスペイン語のバリエーショ ン研究について説明し，3で共通のコンセプトについて，世界中のスペイン語を見渡すことにしましょう。私たちの研究グループの調査結果の一部をピックアッ
      プします。'
