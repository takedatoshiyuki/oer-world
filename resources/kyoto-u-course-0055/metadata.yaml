name:
  ja: 第48回 京都大学品川セミナー「iPS細胞技術を用いたがん特異的キラーT細胞の再生－がんの免疫細胞療法の革新的戦略－」
description:
  ja: iPS細胞を利用して、がんの免疫細胞療法を開発する研究を扱うセミナーである。あわせて、白血球やB細胞、T細胞の分類に触れたうえで、感染細胞やがん細胞を殺すキラーT細胞を中心に説明する。
quotedDescription:
  text:
    ja: 'iPS細胞は、どんな細胞にでも分化できる「万能細胞」です。自分の血液細胞からiPS細胞をつくって、それを使って自分の体の傷んだところを修復する・・・近い将来、そんな夢のような再生医療が、可能になることでしょう。

      私達は、そんなiPS細胞を利用して、がんの免疫細胞療法を開発するという研究に取り組んでいます。本セミナーでは、この取組みについてお話しします。

      血液の中を流れている白血球は、病原体から体を守る働きをしています。白血球を大きく分類すると、好中球、単球、リンパ球に分けられます。好中球や単球はリンパ球にはB細胞とT細胞とがあります。B細胞は抗体をつくり、つくられた抗体は病原体を阻止する力を持っています。T細胞には、B細胞が抗体をつくるのを助けるヘルパーT細胞と、感染細胞やがん細胞を殺すキラーT細胞があります。今回は、このキラーT細胞の話をします。'
  source: https://ocw.kyoto-u.ac.jp/course/55/
