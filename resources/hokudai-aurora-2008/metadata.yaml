  ja: 北海道大学プロフェッサー・ビジット 惑星オーロラから宇宙環境を探る（2008）
description:
  ja: 地球や木星などの惑星に見られるオーロラを手がかりに、その光の色の違いと大気の性質の関係を扱う。あわせて、オーロラ観測から星の大気と宇宙環境を読み取る見方を示す。
quotedDescription:
  text:
    ja: 地球のオーロラは大気中の酸素や窒素が出す固有の色をしています。木星などにもオーロラが存在しますが、その光の色は地球と異なります。オーロラを観測することにより、その星の大気と宇宙環境を知ることができます。
