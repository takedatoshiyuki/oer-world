name:
  ja: 前衛芸術概論
description:
  ja: ドイツ・オーストリア近現代音楽とオペラを軸に、調性や美、価値、資本形態、欲望と欲動の関係を扱う講義である。ワーグナーやモーツァルト、ベルクを題材とする講義ノートを通して、音楽史・オペラ史を文化現象として見直す内容になっている。
quotedDescription:
  text:
    ja: ドイツ・オーストリア近現代音楽の基底に認められる一定の構造と、資本制のもとでの経済体系や心的装置のメカニズムとの相同性に着目し、マルクスの価値形態論、フロイト=ラカンの欲望・欲動論などを参照しながら、ドイツ・オーストリア近現代音楽史・オペラ史を複合的な文化現象として領域横断的に捉えなおすことを目的としている。
