    ja: この授業では，インタプリタ形式のオブジェクト指向スクリプト言語について学修することで，基礎的なプログラミングのリテラシーを身につける。プログラミング言語に関する概要を学び，プログラムにおける変数の概念，基本的なデータ型や制御文について学ぶ。
