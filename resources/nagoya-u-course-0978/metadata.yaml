quotedDescription:
  text:
    ja: 'This course is designed for 2nd year graduate students to build their research ability in the
      field of macro-labor economics. The course focuses on the long-run labor market issues such as (1)
      technological progress and unemployment; and (2) wage inequality. The goal is to catch up with the
      frontier of research on the aggregate labor market.

      After this course, students should be able to (1) understand the frontier of research in the field
      of growth and inequality; (2) write their own computer codes to replicate existing quantitative
      results found in professional articles; and (3) design their own research.'
  source: https://ocw.nagoya-u.jp/courses/0978-%E5%8A%B4%E5%83%8D%E7%B5%8C%E6%B8%88b-2025/
