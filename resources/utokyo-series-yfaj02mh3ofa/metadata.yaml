    ja: "ガンジー生誕150周年(1869年10月2日生まれ、1948年1月30日暗殺死)、インパール作戦75周年を記念する式典が東京大学で開催されました。\n非暴力と悲惨な戦闘を経て達成されたインド独立を日印交流の観点から振り返ります。\n\
