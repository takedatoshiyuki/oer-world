name:
  ja: データサイエンス講義 ビジネスとデータサイエンス
description:
  ja: ビジネスにおけるデータサイエンスの役割を、実事例を通して扱う講義である。筑波山江戸屋でのデータ活用によるマーケティング手法の検討や、水戸信用金庫での営業支援AIの試みを取り上げる。あわせて、実験的なエビデンス経営や経営情報システムの革新による経営管理システムの高度化を説明する。
quotedDescription:
  text:
    ja: 本講義では、ビジネスにおけるデータサイエンスの役割について解説します。地域企業・旅館である筑波山江戸屋におけるデータを活用したマーケティング手法の検討、非営利の地域金融機関である水戸信用金庫における営業支援AIの試みなど、実事例を紹介しながら、実験的なエビデンス経営や経営情報システムの革新による経営管理システムの高度化について説明します。
