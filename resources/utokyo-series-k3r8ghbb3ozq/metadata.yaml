name:
  ja: 情報＜よむ・かく＞の新しい知識学（学術俯瞰講義）
description:
  ja: この講義は、＜よむ・かく＞を記憶・思考・認識に関わる基本的な行為として捉え、その周辺を多分野から考える。人文学、情報科学、ロボット学、認知科学・脳科学、文字学・書物学、情報デザイン学にまたがる領域を取り上げ、＜よむ・かく＞活動をめぐる知識のあり方を探る。
quotedDescription:
  text:
    ja: 'コーディネータ　石田英敬（教養学部/付属図書館副館長）

      ナビゲータ　　　阿部卓也（情報学環）　　　

      　＜よむ・かく＞は、記憶・思考・認識の基本的な身ぶりです。今日では、コンピュータもロボットも＜よむ・かく＞活動を行っていますし、ヒト、動物、生命が、いかに＜よむ・かく＞活動を行っているのか、多様な学問領域で研究が進められています。

      　本年度の学術俯瞰講義「情報」では、人文学から情報科学まで、ロボット学から認知科学・脳科学まで、文字学・書物学から情報デザイン学まで、知の先端領域を拓きつつある講師陣を迎えて、＜よむ・かく＞活動をめぐる＜新しい知識学＞の姿を皆さんと探ってみようと思います。'
  source: https://ch.u-tokyo.ac.jp/series/?id=K3R8GHBb3OZQ
