name:
  ja: 図形をドミノで敷き詰める
description:
  ja: ドミノによる図形の敷き詰めを題材に、与えられた図形を隙間なく埋める方法を考える。あわせて、どのような図形が敷き詰め可能か、敷き詰め方が何通りあるかを調べる。
quotedDescription:
  text:
    ja: ドミノは辺の長さが1:2の長方形で,  ドミノ倒しなどでおなじみのものです.  このドミノで, あたえられた図形を隙間なく敷きつめることを考えます. これは畳がちょうど1:2の長方形なので, 
      いろいろな形の部屋を,  畳で隙間なく敷 きつめる問題と同じで,  何通りの敷きつめ方が存在するのか,  そもそもいかなる図形が敷きつめ可能なのかを調べる, 一種のパズルと言ってよいでしょう.
      しか
