  ja: プラトンの対話篇やホメロスの叙事詩を選んで講読する授業で、例として『ソクラテスの弁明』『クリトン』『パイドン』『饗宴』が挙げられている。プラトンとホメロスは年度ごとに交互に扱い、公開動画はコースの一部を収録したものとなっている。
