name:
  ja: 北海道大学教育GP「博物館を舞台とした体験型全人教育の推進」 知られざる北海道写真の展覧会をつくる （2009）
description:
  ja: 北海道大学函館キャンパスの水産科学館に残る疋田豊治氏撮影のガラス乾板資料を扱う。院生・学生がその写真資料を調べ、展覧会を準備する過程を紹介する。
quotedDescription:
  text:
    ja: 北大函館キャンパス内にある水産科学館には、明治末から昭和初期まで水産学部で教鞭をとった疋田豊治氏の撮影による約6,000点にも及ぶガラス乾板が残されています。疋田氏は、シシャモの学名の命名者で、カレイの研究者として知られています。「疋田写真」は「北海道開拓写真」と並ぶ北大の所蔵する貴重な歴史資料ですが、これまでほとんど紹介されてきませんでした。この「疋田写真」を研究し、展覧会を準備する院生・学生の活動について報告します。
