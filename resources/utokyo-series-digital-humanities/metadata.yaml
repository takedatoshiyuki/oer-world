name:
  ja: デジタル・ヒューマニティーズ ― 変貌する学問の地平 ―（学術俯瞰講義）
description:
  ja: 人文情報学（デジタル・ヒューマニティーズ）の研究動向を、各分野の専門研究者が分担して解説する 学術俯瞰講義シリーズ。資料のデジタルアーカイブ化と分析、学術情報の構造化、VR・人工知能の応用などを扱う。
quotedDescription:
  text:
    ja: 20世紀後半より急速に進展した情報通信技術革新は、知の保存、分析、交換という学問成立の根底をなす方法を変革するとともに、各国の大学・図書館・博物館等に個別に所蔵された知を、インターネットをとおした世界的地平に開き出しました。過去から継承された厖大な知を、この新地平にもたらし、次世代に向けた知創成の基盤とするため、世界の大学は、人文・社会・芸術の分野を中心に、デジタル・ヒューマニティーズ（人文情報学）という新分野を創成し、大きく変わりはじめています。文字・画像資料のアーカイブ・分析・発信・三次元モデル化、学術情報の整理・分析・構造化、マルチメディア・ヴァーチャルリアリティ・人工知能といった問題群を対象にし、領域の壁を超えた方法論的共有地として新たな大学の可能性を開きつつある最先端の研究動向を、それぞれの専門研究者がわかりやすく講義をいたします。
