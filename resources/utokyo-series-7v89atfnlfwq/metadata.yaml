name:
  ja: 30年後の世界へ ― 「共生」を問う（学術フロンティア講義）
description:
  ja: 東京大学東アジア藝文書院が行う「30年後の世界へ」シリーズの2022年度版で、テーマは「共生」だ。人、文化、社会、技術、自然をめぐる共生を、生物の相互依存や人新世、持続可能性、SDGsと結びつけて考える。さらに、新しい冷戦やテクノロジーの進展を視野に入れながら、共生という語やその周辺の言葉を問い直し、よりよい生のあり方を考察する。
quotedDescription:
  text:
    ja: '東京大学 東アジア藝文書院（East Asian Academy for New Liberal Arts, EAA）は2019年度以来、教養学部で「30年後の世界へ」を共通テーマとするオムニバス講義を行ってきました。「30年後の世界」は具体的に今日から30年後の世界のことを指しているわけではありません。受講者のみなさんが社会の各領域で中心的な役割を担っているであろう未来のことを象徴的に表すものです。そこに至るまでの道のりは、みなさん一人一人が自分で、そして他の誰かと手を取り合って歩いて行くものです。未来はしたがって、みなさんの外側からやってくるものではなく、みなさんがわたしたちと共に創りあげていくものなのです。「30年後の世界へ」とはつまり、みなさんが自身の未来を想像するための手がかりとなる言語を探す旅の始まりを劃すわたしたちからの呼び声にほかなりません。教養とは持てる知識の量的な豊かさではなく、未来を創りだすために必要な言語を不断に鍛え続けるプロセスのことを指すと、わたしたちは考えます。

      　2022年度の講義では「共生」という概念について問い直してみます。

      共生ということばが使われるようになって久しくなりました。人、文化、社会、技術、自然などの様々な領域において、「他者」と名指されるあらゆる存在と共生することが、わたしたちの目指すべき理想の姿であるとされます。

      　このことばは、生物の世界において異なる生物種が相互依存の関係にあることを示すsymbiosisに通じると理解されることがあります。したがって、実は共生とは、わたしたちが目指すべき社会の理想である以前に、わたしたちがこの世界にあって生きていることの前提条件であり、既存の事実であると言うべき状態のことなのです。しかし、共生が自然界における厳然たる事実である以上、それは、赤裸々な無道徳の世界のありようでもあり、そこで表現されるのが全的な調和であるとしても、その中には個体の死滅や個体間の生存をかけた闘争が不可欠なメカニズムとして組み込まれています。まして、人新世と呼ばれる近代文明は、生物としての人の生を管理しながら延長することを倫理的な要請としつづける一方で、自然界における生物の多様性を著しく損なっています。そんな中で、持続可能性を探究することがいまや世界的な課題であると見なされています。しかし、SDGsのかけ声は、人間の類としての生存（したがって人類内部の共生）を持続的に可能にするだけのものに終わってはならないでしょう。その声は、生命を持つあらゆる種との共生を望むもう一つの声によって応答されるべきでしょうし、いまはまだ世界に存在していない者の声をも喚び起こすものであるべきです。ましてや、持続すべきものが近代文明によって生み出されたさまざまな現実のレベルに留まっていては、それは近代文明を享受する一部の人びとの独りよがりに終わってしまいかねません。要するに、単なる持続を追求するのとは異なる、新しい人間の生のあり方が真剣に問われるべきであると言うことができます。

      　しかし、そんなことがいかにして可能になるのでしょうか？生物の世界における共生関係が示しているのは、生が死と共にあるというきびしい現実にほかなりません。だからこそ、あるべき共生について考えるためには、生が死と一対のものであることを無視することはできませんし、全的生存のために犠牲を正当化する構造を人間が創りだしてきた現実への反省が求められるはずです——この反省は日本から東アジアに向かって共生を唱えようとする場合にことさら重要な当事者責任において行われるべきです——。新しい冷戦の到来とも言われる今日の世界情勢のもとで政治社会がいかにあるべきかを考え、また、テクノロジーの発展の先にあるべき人のあり方を構想するためにも、わたしたちは、「他者」なる存在と共によりよく生きるための思索をこの世界に生を受けた人間の責任として深め、想像力を豊かにしていく必要があります。

      　共生を事実としてそのまま理想化するのではなく、既存の思想の枠組みの中であるべき姿を構想するのでもなく、このことばとそこから派生する一連の言語を問い直すことを通じて、わたしたちが生きるべきよりよき生のあり方について、いっしょに考えてみることにしましょう。'
