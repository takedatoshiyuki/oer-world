description:
  ja: 苛酷原子炉事故におけるソースターム評価を、事故と評価の歴史から規制体系での変遷まで整理する教材である。さらに、事故時に起こる関連事象の進展を踏まえ、化学的・物理的プロセスの適用や解析コード、現象確認実験まで扱う。
quotedDescription:
  text:
    ja: '解説：苛酷原子炉事故におけるソースターム評価

      「解説：苛酷原子炉事故におけるソースターム評価」の教材は全てCC BY-NCのライセンスで公開しています。

      本教材の内容は以下の通りです。

      ・ 原子炉事故とソースターム評価の歴史

      ・ 我が国の規制体系におけるソースターム評価の変遷

      ・ 苛酷原子炉事故（Severe Reactor Accident）時のソースターム関連事象の進展

      ・ 化学的プロセスとソースターム評価への適用

      ・ 物理的プロセスとソースターム評価への適用

      ・ ソースターム評価用の解析コードと現象確認実験

      「導入：苛酷原子炉事故におけるソースターム評価」の教材はこちらから視聴可能です。'
