    ja: '概要

      遠くにあってロマンをかきたてられたアフリカ

      困難に直面する人びとの住むアフリカ

      大きな市場と人口をもって発展するアフリカ

      みなさんはアフリカにどのようなイメージをお持ちでしょうか？

      長年にわたりアフリカの現場から学び続けてきたフィールドワーカーが語ります

      あなたの学びがアフリカの未来とつながりますように！'
